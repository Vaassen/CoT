 binwarji_aros_sentinels:0 "Aro's Sentinels"
 binwarji_capital_guardians:0 "The Silent Guardians"
 binwarji_restored_imperial_authority:0 "Restored Imperial Authority"
 binwarji_southern_charter:0 "The Southern Charter"
 binwarji_sovereign_authority:0 "Our Own Authority"
 binwarji_court_title:0 "The Court must Act"
 binwarji_court_desc:0 "Our nation is in a downward spiral - we must hold an emergency meeting in the still held capital. Time is off the essence, before every grievance becomes another claimant to the throne!"
 binwarji_hear_princes_title:0 "Hear the Hollow Princes"
 binwarji_hear_princes_desc:0 "The Hollow Princes carry ancestral claims, by promising them something we can gain their support. Let us hear their petitions..."
 binwarji_reopen_nobles_title:0 "Resume Petition: Hear the Hollow Princes"
 binwarji_reopen_nobles_desc:0 "Reopen this petition if you left the council without agreeing a settlement. Resources are charged only when you select a settlement."
 binwarji_sacred_forges_title:0 "Rekindle the Sacred Forges"
 binwarji_sacred_forges_desc:0 "The blacksmith priests will not be ordered back to their anvils by another empty promise..."
 binwarji_reopen_forges_title:0 "Resume Petition: Rekindle the Sacred Forges"
 binwarji_reopen_forges_desc:0 "Reopen this petition if you left the council without agreeing a settlement. Resources are charged only when you select a settlement."
 binwarji_taafi_levy_title:0 "The Taafi Levy"
 binwarji_taafi_levy_desc:0 "The Taafi are refusing to aid us! We must offer them something to gain their support back."
 binwarji_reopen_taafi_title:0 "Resume Petition: The Taafi Levy"
 binwarji_reopen_taafi_desc:0 "Reopen this petition if you left the council without agreeing a settlement. Resources are charged only when you select a settlement."
 binwarji_crown_champion_title:0 "A Champion for the Crown"
 binwarji_crown_champion_desc:0 "Our ruler need not win a distant war before the state resumes activity..."
 binwarji_reopen_champion_title:0 "Resume Petition: A Champion for the Crown"
 binwarji_reopen_champion_desc:0 "Reopen this petition if you left the council without agreeing a settlement. Resources are charged only when you select a settlement."
 binwarji_dune_magic_title:0 "Still the Dune Magic"
 binwarji_dune_magic_desc:0 "The sandstorms carry the anger of an ogre mage to the east. We must find a solution..."
 binwarji_reopen_dunes_title:0 "Resume Petition: Still the Dune Magic"
 binwarji_reopen_dunes_desc:0 "Reopen this petition if you left the council without agreeing a settlement. Resources are charged only when you select a settlement."
 binwarji_three_petitions_tt:0 "Settle any three of the five council petitions. Settling all five will grant an additional reward."
 binwarji_recovery_title:0 "Authority Recovered"
 binwarji_recovery_desc:0 "Agreement in three quarters of the court is enough to govern again, and to end the immediate crisis. With five completed - we will gain full control and authority!"
 binwarji_sigilan_title:0 "Reclaim Sigilan"
 binwarji_sigilan_desc:0 "The rebels had full control of the most prosperous city in our realm of Sigilan! While this remains true our nation cannot function. Take that back and crush them!"
 binwarji_all_janama_tt:0 "Directly own, core and control every province of Janama."
 binwarji_janama_title:0 "Infiltrate the Traitors"
 binwarji_janama_desc:0 "Some of our people are under occupation by the vultures to the north and south. We must build a comprehensive spy network in them to gain an advantage. Building either will let us destabalize that nation, and both will let us act on both of them!"
 binwarji_roads_title:0 "Open the Kubaci Roads"
 binwarji_roads_desc:0 "The second commission follows the western roads of Kubaci. Our trade must be re-opened to the east lest the disparate states take control of it."
 binwarji_western_kubaci_tt:0 "Directly own, core and control the Kaino Binni and Franxhaz areas in western Kubaci."
 binwarji_eastern_march_title:0 "The Eastern March"
 binwarji_eastern_march_desc:0 "A defensible march and securing a buffer zone matters more than chasing every rogue state. The people of Mausarjirad are weak for now, we must send them a bribe while we still can!"
 binwarji_landings_title:0 "Ironwood Landings"
 binwarji_landings_desc:0 "The third commission looks south along the western Dao Nako coast. Secure a landing from which ironwood, charcoal and craftsmen can reach the royal workshops."
 binwarji_west_coast_tt:0 "Directly own, core and control the highlighted western Dao Nako coastal provinces and Junansuar."
 binwarji_western_coast_title:0 "The Western Coast"
 binwarji_western_coast_desc:0 "Take the western coast and the monastery supply route. The deep interior and the eastern coast are outside this commission."
 binwarji_one_commission_tt:0 "Complete any one of the three territorial commissions."
 binwarji_imperial_return_title:0 "First Imperial Return"
 binwarji_imperial_return_desc:0 "With our borders secure and our people no longer under crisis - it is time to rebuild the Empire."
 binwarji_dendugma_title:0 "The Dendugma Contract"
 binwarji_dendugma_desc:0 "Within Junansuar, the Dendugma blacksmith priests work above the ruins of an efreet palace. Secure their ironwood supply, it is fit to serve the realm!"
 binwarji_steel_title:0 "Steel Worthy of Biakata"
 binwarji_steel_desc:0 "Complete the Steel Commission decision, then equip a permanent military establishment. The steel of Biakata must be a dependable supply, not a single ceremonial sword."
 binwarji_honest_weights_title:0 "Honest Weights"
 binwarji_permanent_mine_title:0 "Permanent Mining Operation"
 binwarji_honest_weights_desc:0 "The Jelli teach that a Binwarji promise should mean what it says. Let the same principle govern our markets."
 binwarji_silver_exchanges_title:0 "The Silver-Grass Exchanges"
 binwarji_silver_exchanges_desc:0 "Silver Grass is the mining country of our inheritance. Reopen and develop Warjifara, and the state will breath a sigh of relief as the gold flows once more."
 binwarji_two_commissions_tt:0 "Complete any two of the three territorial commissions."
 binwarji_games_title:0 "Games of Sigilan"
 binwarji_games_desc:0 "The court at our capital will sponsor the restored championships at the Imperial Arena of Sigilan. Freed gladiators and planetouched champions will compete for honours and power!"
 binwarji_overlord_title:0 "The Distant Overlord"
 binwarji_overlord_desc:0 "Our relations with Kheterata are coming under question. Do we seek recognition as a powerful southern satrapy, or establish an authority that answers to no overlord?"
 binwarji_charter_title:0 "The Southern Charter"
 binwarji_charter_desc:0 "Remain a subject of Kheterata and fund the recognition of a southern charter."
 binwarji_charter_reward_tt:0 "While subject to Kheterata: §G+1§! diplomatic reputation and §G+10%§! trade efficiency. This settlement excludes Our Own Authority."
 binwarji_sovereign_title:0 "Our Own Authority"
 binwarji_sovereign_desc:0 "Our restored realm must secure its independence, then defend its own land!"
 binwarji_sovereign_reward_tt:0 "While independent: §G+5%§! army morale. This settlement excludes The Southern Charter."
 binwarji_either_settlement_tt:0 "Complete either The Southern Charter or Our Own Authority."
 binwarji_place_title:0 "Our Place in Sarhal"
 binwarji_place_desc:0 "The court has settled its place in the wider world. Its right to govern Janama will be exercised through that settlement. Now we must enforce it."
 binwarji_aro_title:0 "What Aro Bound"
 binwarji_aro_desc:0 "Our sculptors never forgot how to give stone a lifelike face. It is time to make the first true sentinel of a new age."
 binwarji_throne_title:0 "The Throne Commands"
 binwarji_throne_desc:0 "Approach the Throne, but not as a ruler in crisis. Binwarji is ascendant! We were born to rule!"
 binwarji_restoration.10.a:0 "Honour their ancestral titles."
 binwarji_restoration.10.b:0 "Give the princes offices in royal service."
 binwarji_restoration.10.c:0 "Return to this petition later."
 binwarji_restoration.10.t:0 "Hear the Hollow Princes"
 binwarji_restoration.10.d:0 "Hear their demands..."
 binwarji_restoration.11.a:0 "Repair the sacred workshops."
 binwarji_restoration.11.b:0 "Pay an advance on a new steel contract."
 binwarji_restoration.11.c:0 "Return to this petition later."
 binwarji_restoration.11.t:0 "Rekindle the Sacred Forges"
 binwarji_restoration.11.d:0 "Hear their demands..."
 binwarji_restoration.12.a:0 "Write a charter of recognised tolls."
 binwarji_restoration.12.b:0 "Agree the terms of military service."
 binwarji_restoration.12.c:0 "Return to this petition later."
 binwarji_restoration.12.t:0 "The Taafi Levy"
 binwarji_restoration.12.d:0 "Hear their demands..."
 binwarji_restoration.13.a:0 "Appoint a champion of the crown."
 binwarji_restoration.13.b:0 "Honour the strongest planetouched contender."
 binwarji_restoration.13.c:0 "Return to this petition later."
 binwarji_restoration.13.t:0 "A Champion for the Crown"
 binwarji_restoration.13.d:0 "Who should lead as the Arena's champion?"
 binwarji_restoration.14.a:0 "Fund wards around the settlements."
 binwarji_restoration.14.b:0 "Provision the ogres and their caravan guides."
 binwarji_restoration.14.c:0 "Return to this petition later."
 binwarji_restoration.14.t:0 "Still the Dune Magic"
 binwarji_restoration.14.d:0 "How shall we solve the unstable desert?"
 binwarji_restoration.3.a:0 "Bring the petitioners before us."
 binwarji_restoration.3.t:0 "The Court Still Sits"
 binwarji_restoration.3.d:0 "Five petitions lie before the throne. Any three settlements will restore enough authority to end the immediate crisis, completing all five will grant us unprecedented control and authority. The emergency court will reduce the penalty of the End of Authority to +1 unrest, +50% stability cost, -20% land force limit and +25% morale damage received."
 binwarji_restoration.20.a:0 "Issue the three territorial commissions."
 binwarji_restoration.20.t:0 "Authority Recovered"
 binwarji_restoration.20.d:0 "The court can govern again. Further breakaways caused by End of Authority have been stopped. Unresolved petitions now impose only small obligations; the remaining settlements will remove them. It is time to rebuild..."
 binwarji_restoration.250.a:0 "Let the court prepare its answer."
 binwarji_restoration.250.t:0 "The Distant Overlord"
 binwarji_restoration.250.d:0 ""The next settlement is yours to make" the emissary advised... The Southern Charter rewards a recognised relationship with Kheterata. Our Own Authority rewards independence. Complete one of those missions; both routes lead to Our Place in Sarhal."
 binwarji_restoration.330.a:0 "Let the first sentinel take its post."
 binwarji_restoration.330.t:0 "What Aro Bound"
 binwarji_restoration.330.d:0 "For generations the sculptors of Binwarji made lifelike figures in ivory, bronze, wood and terracotta. Today a figure of stone moves without a craftsman's hand."
 binwarji_restoration.400.a:0 "And the realm answers."
 binwarji_restoration.400.t:0 "The Throne Commands"
 binwarji_restoration.400.d:0 "UNLIMITED POWER! IT IS YOURS TO TAKE! None shall challenge Binwarji! The old Empire has returned, and a benevolent eternity shall it rule for!"
 binwarji_restoration.200.a:0 "Honour the champions of flame."
 binwarji_restoration.200.b:0 "Honour the champions of stone."
 binwarji_restoration.200.c:0 "Honour the champions of wind."
 binwarji_restoration.200.t:0 "The Imperial Championships"
 binwarji_restoration.200.d:0 "Planetouched and mortal contenders gather at Sigilan. The court will make one discipline the example for the next generation. Its military benefit lasts fifteen years; another championship may be commissioned twenty years after this one."
 binwarji_championship_title:0 "Hold the Imperial Championships"
 binwarji_championship_desc:0 "Choose one fifteen-year military blessing. This has a twenty-year cooldown."
 binwarji_steel_commission_title:0 "Commission Dendugma Steel"
 binwarji_steel_commission_desc:0 "Fund a two-year trial at Junansuar. Requires a controlled core of 15 development with a workshop or counting house. Costs 75 military power and one year of income."
 binwarji_resume_steel_title:0 "Resume the Steel Commission"
 binwarji_resume_steel_desc:0 "The commission is already funded. Restore control of Junansuar and allow thirty days for final inspections. No second payment is required."
 binwarji_restoration.601.a:0 "The old standard can be met again."
 binwarji_restoration.601.t:0 "The Steel Trials Succeed"
 binwarji_restoration.601.d:0 "The blacksmith priests have delivered the promised steel. Complete Steel Worthy of Biakata once the army has the technology and barracks to use it throughout the realm."
 binwarji_restoration.602.a:0 "Keep the commission accounts."
 binwarji_restoration.602.t:0 "The Steel Commission Pauses"
 binwarji_restoration.602.d:0 "The funded trial has reached its final inspections, but Junansuar is unavailable or the realm is at war. Restore the conditions and use Resume the Steel Commission. The treasury will not be charged again."
 binwarji_bindings_first_title:0 "Catalogue the Lost Bindings"
 binwarji_bindings_first_desc:0 "Stage 1 of the recovered bindings. Costs 100 administrative power and one year of income; lasts 2 years. All five council settlements, the steel mission, the exchanges and the games must be complete to begin the programme. Interrupted completion retains its funding and offers a free thirty-day resumption."
 binwarji_resume_bindings_first_title:0 "Resume: Catalogue the Lost Bindings"
 binwarji_resume_bindings_first_desc:0 "This stage has already been funded and its original research period has elapsed. Restore its requirements and allow thirty days for the final work. No further payment."
 binwarji_restoration.301.a:0 "Record the achievement."
 binwarji_restoration.301.t:0 "Catalogue the Lost Bindings — Complete"
 binwarji_restoration.301.d:0 "The funded work has been completed. The surviving records are catalogued. The stone vessels can now be commissioned."
 binwarji_restoration.302.a:0 "Preserve the work and its accounts."
 binwarji_restoration.302.t:0 "Catalogue the Lost Bindings — Work Paused"
 binwarji_restoration.302.d:0 "The original research period has elapsed, but the sites or national conditions needed to conclude the work are unavailable. Restore the requirements and use the matching Resume decision. Funding is retained."
 binwarji_bindings_second_title:0 "Raise the Stone Vessels"
 binwarji_bindings_second_desc:0 "Stage 2 of the recovered bindings. Costs 100 diplomatic power, 100 military power and two years of income; lasts 3 years. All five council settlements, the steel mission, the exchanges and the games must be complete to begin the programme. Interrupted completion retains its funding and offers a free thirty-day resumption."
 binwarji_resume_bindings_second_title:0 "Resume: Raise the Stone Vessels"
 binwarji_resume_bindings_second_desc:0 "This stage has already been funded and its original research period has elapsed. Restore its requirements and allow thirty days for the final work. No further payment."
 binwarji_restoration.311.a:0 "Record the achievement."
 binwarji_restoration.311.t:0 "Raise the Stone Vessels — Complete"
 binwarji_restoration.311.d:0 "The funded work has been completed. The vessels are ready. Their final awakening requires a great magical capital and a stable realm."
 binwarji_restoration.312.a:0 "Preserve the work and its accounts."
 binwarji_restoration.312.t:0 "Raise the Stone Vessels — Work Paused"
 binwarji_restoration.312.d:0 "The original research period has elapsed, but the sites or national conditions needed to conclude the work are unavailable. Restore the requirements and use the matching Resume decision. Funding is retained."
 binwarji_bindings_third_title:0 "Awaken the Sentinels"
 binwarji_bindings_third_desc:0 "Stage 3 of the recovered bindings. Costs 150 administrative power, 150 military power and three years of income; lasts 3 years. All five council settlements, the steel mission, the exchanges and the games must be complete to begin the programme. Interrupted completion retains its funding and offers a free thirty-day resumption."
 binwarji_resume_bindings_third_title:0 "Resume: Awaken the Sentinels"
 binwarji_resume_bindings_third_desc:0 "This stage has already been funded and its original research period has elapsed. Restore its requirements and allow thirty days for the final work. No further payment."
 binwarji_restoration.321.a:0 "Record the achievement."
 binwarji_restoration.321.t:0 "Awaken the Sentinels — Complete"
 binwarji_restoration.321.d:0 "The funded work has been completed. The recovered bindings have held. Complete What Aro Bound to deploy the guardians."
 binwarji_restoration.322.a:0 "Preserve the work and its accounts."
 binwarji_restoration.322.t:0 "Awaken the Sentinels — Work Paused"
 binwarji_restoration.322.d:0 "The original research period has elapsed, but the sites or national conditions needed to conclude the work are unavailable. Restore the requirements and use the matching Resume decision. Funding is retained."
