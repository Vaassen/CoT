 farranean_casean_effect_tt:0 "Up to 3 of our provinces with a Fort and Manpower Building with gain a free Workshop immediately."
 farranean_elf_minorities_tt:0 "Converting a province to Farrani Half-Elf culture will now add or increase the elven minority size in the province."
 farranean_munas_tt:0 "If Corinite or Regent Court, Munas will be upgraded as a Deity or his Holy Order will improve. We will gain Tolerance of the True Faith +3 permanently otherwise."
 farranean_human_minority_sizes_tt:0 "All of our and Ibevar's provinces will have their human minority size increased in the province if applicable."
 farranean_mana_privileges_tt:0 "Primacy of the Nobility, Religious State and Land of Commerce will now give +5% Loyalty instead of -5% Loyalty."
 farranean_ibevari_missions_unlocks_tt:0 "You can now complete Ibevar's missions even while Ibevar is a subject and you'll be able to use development in Farrani Half-Elf provinces and Farrani ownership to complete them at times. Completing  Ibevar's Ibevari Soldier, Ibevari Diplomat and Greater Ibevar will unlock powerful rewards upon completing the Farrani mission 'The Future We Create'."
 farranean_inherting_ibevar_tt:0 "We will unlock the End to the Elfrealm Act which will let us inherit Ibevar and will set the bonuses we get from 'The Future We Create'."
 farranean_bonus_conditions_tt:0 "We will gain a permanent modifier for completing Ibevari Soldier, Ibevari Diplomat and our national ideas will be upgraded if we complete Greater Ibevar"
 
