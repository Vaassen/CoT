 cot_market_events.1:0 "The Market System"
 cot_market_events.1.t:0 "The Market System"
 cot_market_events.1.desc:0 "Throughout Bulwar new specialized markets have sprung up, offering strange and exotic items. By conquering these provinces we will grant ourself access to these markets for free, and the §Ytreasures§! that lie within. We are able to pay an upfront cost of mana to visit a market not in our land. However, not all visitors are equal. Whether we find treasures or trash in these places depends on our Ruler, Heir, and Consorts §Bdip skills - our Prestige - and our Mercantalism§!. Your country has §R3 item slots§!, when they are full you will need to sell your existing items for permanent power to buy more items! Each market also has a specific trade good, you cannot gain more goods while holding one, so choose carefully which you wish to keep. Legendary items are unique, only one of each can exist in the world at once so be quick to find them! For §BMonsters§!, we can instead loot the market using our mil stats and manpower percentage for better loot and money!"
 cot_market_events.1.a:0 "I love new mechanics! So balanced!"
