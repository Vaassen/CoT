 cot_market_events.24.a:0 "Leave the store without selling!"
 cot_market_events.24.b:0 "Sell your trade goods!"
 cot_market_events.24.t:0 "The Trade Good Store"
 cot_market_events.24.desc:0 ""Welcome to the Goods Store" A tall spindly man greets you with a sharp smile. "Here, your goods may become wealth beyond your wildest dreams" He smirks slightly "If what you have is worth selling, that is..." "

 cot_market_events.2.t:0 "The Market Menu"
 cot_market_events.2.desc:0 "This Menu is where you manage most of the market related activities! You can see your Market Power split into three catagories below, or Monster Power if you are monstrous! Opening this Menu updates your Market/Monster power, so make sure to do it before you go visiting Markets. Below that is the option to sell items for Permanent Power (for non monsters)! Since you can only have 1 item in each slot at a time, it is intended to sell and gain gradual increases of permanent power throughout the game until you can reach 60, the highest tier for increasing market loot quality! Monsters do not have slots, loot the Markets and get as much stuff as you can!!"

 cot_market_events.3.t:0 "Sell Market Items"
 cot_market_events.3.desc:0 "This is where you sell the items in each slot. If a slot is not available as an option, you have nothing in it!"

 cot_market_events.5.t:0 "Which Market Should I visit?"
 cot_market_events.5.desc:0 "Pick which Market you wish to travel to. The price increases depending on your Market Power - but is always free if you own the Market. It's better to conquer one the more power you have, but at the start of the game it isnt neccesary!"

 cot_market_events.6.t:0 "The Grain Market"
 cot_market_events.6.desc:0 "This is the Market, welcome! Take a look at the wares available, which store do you wish to go to? If a store is not available, you have an item in that slot already! Sell it to re-enter the store again. Hopefully you find what your looking for, and if not, theres always next time!"

