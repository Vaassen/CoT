 flavour_celmaldor.1.t:0 "Call of the Endless Sea"
 flavour_celmaldor.1.d:0 "An explorer distinguishes himself, he is a famous eccentric who once had a troll as a crew member."
 flavour_celmaldor.1.a:0 "Toward the stormy horizon"

 flavour_celmaldor.2.t:0 "Our Explorer DIsappears"
 flavour_celmaldor.2.d:0 "Our most competent Explorer, Urvion Wavedancer has mysteriously disappeared whilst sailing near the Ruined sea."
 flavour_celmaldor.2.a:0 "weird"

 flavour_celmaldor.3.t:0 "The Returned"
 flavour_celmaldor.3.d:0 "Eerily changed, our explorer Urvion Wavedancer has returned to our service. People find him unnerving but even more competent than ever before."
 flavour_celmaldor.3.a:0 "Good?"

 flavour_celmaldor.4.t:0 "Soldiers of the Reach"
 flavour_celmaldor.4.d:0 "We cna choose which race should be the main one in our Army"
 flavour_celmaldor.4.a:0 "Human numbers will bolster us."
 flavour_celmaldor.4.b:0 "Elven discipline must be the base."

 flavour_celmaldor.5.t:0 "Elves of the Old World"
 flavour_celmaldor.5.d:0 "There are still elves living in Aelantir"
 flavour_celmaldor.5.a:0 "Distant cousins, cool I guess"

 flavour_celmaldor.6.t:0 "Specialised Snowy Shipyards"
 flavour_celmaldor.6.d:0 "We can choose to specialise the shipyards of our signature harbour"
 flavour_celmaldor.6.a:0 "I like Light Ships"
 flavour_celmaldor.6.b:0 "Give me more Heavies"

 flavour_celmaldor.7.t:0 "Purpose Without Conflict"
 flavour_celmaldor.7.d:0 "The clans are reformed, they're still powerful but they don't basically own the country anymore."
 flavour_celmaldor.7.a:0 "Neat"

 flavour_celmaldor.8.t:0 "Aspiring Toward Migrant Ships"
 flavour_celmaldor.8.d:0 "The old migrant ships were very epic, we should try making one"
 flavour_celmaldor.8.a:0 "Can it even be done?"

 flavour_celmaldor.9.t:0 "Expertise of the Sea Elves"
 flavour_celmaldor.9.d:0 "sea elves have come offering their help with making the migrant ship"
 flavour_celmaldor.9.a:0 "yes"
 flavour_celmaldor.9.b:0 "no"

 flavour_celmaldor.10.t:0 "Scourge of decent Elvenkind"
 flavour_celmaldor.10.d:0 "aelnar is cringe but some of the people from there could know stuff about the old ships"
 flavour_celmaldor.10.a:0 "sure"
 flavour_celmaldor.10.b:0 "hell no"

 flavour_celmaldor.11.t:0 "Records and Study of Diranhria"
 flavour_celmaldor.11.d:0 "The most clear sources on the struture of migrant ships belong to the sun elves, we could definitely use notes on Diranhria's construction for our project"
 flavour_celmaldor.11.a:0 "gimme"
 flavour_celmaldor.11.b:0 "go away"

 flavour_celmaldor.13.t:0 "A City of Sails"
 flavour_celmaldor.13.d:0 "ship is finished and cool"
 flavour_celmaldor.13.a:0 "yay"

 flavour_celmaldor.14.t:0 "The Two Leaders"
 flavour_celmaldor.14.d:0 "celmaldor asks to merge our trade leagues"
 flavour_celmaldor.14.a:0 "ok mr elf"
 flavour_celmaldor.14.b:0 "go away mr elf"

 flavour_celmaldor.15.t:0 "Welcome to The Reach"
 flavour_celmaldor.15.d:0 "This is a cool place"
 flavour_celmaldor.15.a:0 "Hello"

 flavour_celmaldor.16.t:0 "Investments in Freedom"
 flavour_celmaldor.16.d:0 "they can take our lives but they can never take my moors"
 flavour_celmaldor.16.a:0 "Join the Moorman Revolution"

 flavour_celmaldor.17.t:0 "Northern Cities Develop"
 flavour_celmaldor.17.d:0 "they growing"
 flavour_celmaldor.17.a:0 "woooo"

 flavour_celmaldor.18.t:0 "The Model Modern Elf"
 flavour_celmaldor.18.d:0 "This is Elanaria, she is very smart"
 flavour_celmaldor.18.a:0 "Thank you for the invention Elanaria"

 flavour_celmaldor.19.t:0 "An Adshaw Invasion"
 flavour_celmaldor.19.d:0 "Crovis Adshaw has attacked Frozenmaw, while we don't have much sympathy for orcish monsters it could still be wise to help them if it means the evil adshaws don't gain power."
 flavour_celmaldor.19.a:0 "Let's help frozenmaw"
 flavour_celmaldor.19.b:0 "Let's get some power in the white reach instead"

 flavour_celmaldor.20.t:0 "The Cedevik Deal"
 flavour_celmaldor.20.d:0 "Cedevik is now independent as per our agreement with Grombar"
 flavour_celmaldor.20.a:0 "Let's get them in the trade league ASAP"

 flavour_celmaldor.21.t:0 "Whitespear Funded Whalers"
 flavour_celmaldor.21.d:0 "we have a whole northern ocean to fish in, the whitespears want oil and ivory"
 flavour_celmaldor.21.a:0 "a whale of a time"

 flavour_celmaldor.22.t:0 "The Aging Rudder"
 flavour_celmaldor.22.d:0 "Taelar is old and known as a coward, he contemplates on this"
 flavour_celmaldor.22.a:0 "Let's be more aggressive"
 flavour_celmaldor.22.b:0 "Being cautious can help us"

 flavour_celmaldor.69.t:0 "Steady Progress"
 flavour_celmaldor.69.d:0 "We have finished iterating a new invention"
 flavour_celmaldor.69.a:0 "science yay"

 flavour_celmaldor.71.t:0 "Choose Trade League Investment"
 flavour_celmaldor.71.d:0 "We can make a trade building, a coast defense building or a production building"
 flavour_celmaldor.71.a:0 "Trade"
 flavour_celmaldor.71.b:0 "Production"
 flavour_celmaldor.71.c:0 "Coastal Protection"
 flavour_celmaldor.71.e:0 "Nevermind"

 flavour_celmaldor.101.t:0 "The Reckless Family"
 flavour_celmaldor.101.d:0 "Whitespears are adventurous gamblers in their investments, a foreign nation accuses them of rigging their markets for a profit"
 flavour_celmaldor.101.a:0 "They were just lucky"
 flavour_celmaldor.101.b:0 "You're right we should look into it"

 flavour_celmaldor.102.t:0 "Calls to Adventure"
 flavour_celmaldor.102.d:0 "The Whitespear clan offers an explorer or conquistador"
 flavour_celmaldor.102.a:0 "Explorer"
 flavour_celmaldor.102.b:0 "Conquistador"
 flavour_celmaldor.102.c:0 "Neither" #THE NEITHER (fire emoji)

 flavour_celmaldor.103.t:0 "Inspiring Leaders"
 flavour_celmaldor.103.d:0 "A clan has inspired their former soldiers to enlist in the national army"
 flavour_celmaldor.103.a:0 "Accept them"
 flavour_celmaldor.103.b:0 "We don't need it"

 flavour_celmaldor.104.t:0 "Silver Tongued Ice"
 flavour_celmaldor.104.d:0 "The Cunning Icewind Clan has offered us some new trading relations"
 flavour_celmaldor.104.a:0 "I love money"
 flavour_celmaldor.104.b:0 "I don't need more money"

 flavour_celmaldor.105.t:0 "Discerning Eye"
 flavour_celmaldor.105.d:0 "The Frozentide family has noticed corruption ongoin in one of our provinces and are offering to help root it out"
 flavour_celmaldor.105.a:0 "Let them help"
 flavour_celmaldor.105.b:0 "Ignore it"

 flavour_celmaldor.106.t:0 "Wealth of Centuries"
 flavour_celmaldor.106.d:0 "The Clans are old and rich, they offer a donation in exchange for some small favours"
 flavour_celmaldor.106.a:0 "Sure"
 flavour_celmaldor.106.b:0 "No"

 flavour_celmaldor.107.t:0 "Eager Investors"
 flavour_celmaldor.107.d:0 "A clan has started an investment in a trade league member, this is good but it might skew their influence in our country"
 flavour_celmaldor.107.a:0 "Let them cook"
 flavour_celmaldor.107.b:0 "Never cook again"

 flavour_celmaldor.108.t:0 "Sacnadlous Conversion"
 flavour_celmaldor.108.d:0 "whilst people are allowed to worship whatever it's still not expected that a member of the Clans converted to another religion. The clan asks us to persuade their family member to reconsider"
 flavour_celmaldor.108.a:0 "If they help us with some stuff then sure"
 flavour_celmaldor.108.b:0 "No, it is their right"

 flavour_celmaldor.109.t:0 "Worries of Elitism"
 flavour_celmaldor.109.d:0 "People have noticed that the Clans kinda keep non-elves on a lower payroll"
 flavour_celmaldor.109.a:0 "Force them to pay more equally"
 flavour_celmaldor.109.b:0 "Have you considered finding a different job?"

 flavour_celmaldor.110.t:0 "Language of Trade"
 flavour_celmaldor.110.d:0 "The law guarantees mostly equal pay for all races, but the Clans are using people not being fluent in Elven as an excuse to pay them less"
 flavour_celmaldor.110.a:0 "Payting extra for an additional skill isn't wrong"
 flavour_celmaldor.110.b:0 "Try to force them to not do this"

 flavour_celmaldor.111.t:0 "The Language Barrier"
 flavour_celmaldor.111.d:0 "The clans are still not letting go of favouring clients and employees who speak elven, it has been considered that we should just teach our merchants elven then."
 flavour_celmaldor.111.a:0 "Organise some more elven lessons"
 flavour_celmaldor.111.b:0 "Make learning elven mandatory for merchants"

 flavour_celmaldor.112.t:0 "Alfrbrut"
 flavour_celmaldor.112.d:0 "Our policy of mandatory elven has been nicknamed "Alfrbrut" meaning the Elven-toll, people don't like having to learn a minority language to get a good job."
 flavour_celmaldor.112.a:0 "Tough shit"
 flavour_celmaldor.112.b:0 "Lower the elven standards"

 flavour_celmaldor.113.t:0 "Magnate Absorbtion"
 flavour_celmaldor.113.d:0 "Magnates control a lot of Alenic commerce, one magnate family is trying to merge their assets into a clan for profit"
 flavour_celmaldor.113.a:0 "let them do that"
 flavour_celmaldor.113.b:0 "stop it"

 flavour_celmaldor.114.t:0 "Clan Colonial Conflict"
 flavour_celmaldor.114.d:0 "Different settlements in x colony were built by groups sponsored by different clans and they have beef now and are fighting"
 flavour_celmaldor.114.a:0 "You must go"
 flavour_celmaldor.114.b:0 "no you"

 flavour_celmaldor.115.t:0 "Princely Favouritism"
 flavour_celmaldor.115.d:0 "The prince's clan has made big strides during their rule and people complain about favouritism"
 flavour_celmaldor.115.a:0 "sorry"
 flavour_celmaldor.115.b:0 "we're just better"

 flavour_celmaldor.116.t:0 "Am I not Your Favourite?"
 flavour_celmaldor.116.d:0 "A representative of a clan has claimed the Prince is a supporter of their clan"
 flavour_celmaldor.116.a:0 "they're right"
 flavour_celmaldor.116.b:0 "they're a liar"

 flavour_celmaldor.117.t:0 "Clannish Multiculturalism"
 flavour_celmaldor.117.d:0 "A clan has started employing lots of people of the newly integrated races"
 flavour_celmaldor.117.a:0 "Good"
 flavour_celmaldor.117.b:0 "We can use this to ease their integration further"

 flavour_celmaldor.118.t:0 "Elventongued Finefolks"
 flavour_celmaldor.118.d:0 "Speaking elven has given people, especially those in clan patronage a sense of superiority. They're being real asses about it too atm."
 flavour_celmaldor.118.a:0 "They're trendsetters"
 flavour_celmaldor.118.b:0 "This is cringe"

 flavour_celmaldor.119.t:0 "Clan Magic Patronage"
 flavour_celmaldor.119.d:0 "The clans being rich have some mages in their employ. A clan is offering the state a mage for some favours and will be miffed if we decline."
 flavour_celmaldor.119.a:0 "I accept"
 flavour_celmaldor.119.b:0 "I decline"

 flavour_celmaldor.120.t:0 "Thinkers and Tinkerers"
 flavour_celmaldor.120.d:0 "A clan is investing thoroughly into artificery"
 flavour_celmaldor.120.a:0 "Let them"
 flavour_celmaldor.120.b:0 "but I don't want them to"

 flavour_celmaldor.700.t:0 "Election"
 flavour_celmaldor.700.d:0 "Term is up, should the current ruler stay or should there be a new one"
 flavour_celmaldor.700.a:0 "[Root.Monarch.GetName] stays"
 flavour_celmaldor.700.b:0 "The Frozentide Clan's Candidate"
 flavour_celmaldor.700.c:0 "The Icewind Clan's Candidate"
 flavour_celmaldor.700.e:0 "The Whitespear Clan's Candidate"
 flavour_celmaldor.700.f:0 "A Candidate not from a Clan"

 flavour_celmaldor.701.t:0 "Election"
 flavour_celmaldor.701.d:0 "The Prince has died, choose a new one"
 flavour_celmaldor.701.a:0 "[Root.Monarch.GetName] stays"
 flavour_celmaldor.700.b:0 "The Frozentide Clan's Candidate"
 flavour_celmaldor.700.c:0 "The Icewind Clan's Candidate"
 flavour_celmaldor.700.e:0 "The Whitespear Clan's Candidate"
 flavour_celmaldor.700.f:0 "A Candidate not from a Clan"

 flavour_celmaldor.702.t:0 "Election"
 flavour_celmaldor.702.d:0 "Term is up, should the current ruler stay or should there be a new one"
 flavour_celmaldor.702.a:0 "[Root.Monarch.GetName] stays"
 flavour_celmaldor.702.b:0 "An Administator"
 flavour_celmaldor.702.c:0 "A Diplomat"
 flavour_celmaldor.702.e:0 "A Militarist"


 flavour_celmaldor.703.t:0 "Election"
 flavour_celmaldor.703.d:0 "The Prince has died, choose a new one"
 flavour_celmaldor.702.b:0 "An Administator"
 flavour_celmaldor.702.c:0 "A Diplomat"
 flavour_celmaldor.702.e:0 "A Militarist"

 flavour_celmaldor.1001.t:0 "Innate Windshaping"
 flavour_celmaldor.1001.d:0 "Our ships have innate windshaping spells in their sails allowing for faster and more dexterous sailing"
 flavour_celmaldor.1001.a:0 "Eureka"

 flavour_celmaldor.1002.t:0 "Icestorm Cannons"
 flavour_celmaldor.1002.d:0 "Me when I cast cone of cold through the ship's cannon using the sea water"
 flavour_celmaldor.1002.a:0 "Eureka"

 flavour_celmaldor.1003.t:0 "Sustaining Arks"
 flavour_celmaldor.1003.d:0 "We have special cooling and sanitising artifice systems on the transport ships so people and goods don't spoil in transit"
 flavour_celmaldor.1003.a:0 "Eureka"



