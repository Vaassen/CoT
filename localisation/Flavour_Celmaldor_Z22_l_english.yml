# factions

 whitespear_clan:0 "Clan Whitespear"
 whitespear_clan_influence:0 "Whitespear Clan Influence"
 whitespear_clan_FACTION_DESC:0 "Navigators and warriors, the Whitespears are the descendants of Maldorian himself. The smallest of the three clans yet the most well known by far, having produced many soldiers and heroes of fame and valour."

 icewind_clan:0 "Clan Icewind"
 icewind_clan_influence:0 "Icewind Clan Influence"
 icewind_clan_FACTION_DESC:0 "Diplomats and the Richest Merchants, the Icewinds are the richest of the Clans. Operating out of the huge Palace of Commerce in Celmaldor proper, the clever negotiators of this Clan maintain businesses in every trade they find profitable."

 frozentide_clan:0 "Clan Frozentide"
 frozentide_clan_influence:0 "Frozentide Clan Influence"
 frozentide_clan_FACTION_DESC:0 "Cool eyed and grim, the Frozentides are unbiased and calculating planners. Most of the legislation of the republic was created by Frozentide scholars, the Clan is also vastly invested in banking and insurances."

