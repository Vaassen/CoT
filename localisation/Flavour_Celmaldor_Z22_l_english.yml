 z22_denied_conversion_desc:0 "A citizen was forced to revert their conversion to another religion."
 z22_elf_supremacist_fears:0 "Worries of Elf Supremacy"
 z22_elf_supremacist_fears_desc:0 "Recent Policies have caused people to worry about the nation using other races as stepping stones for the Elves."
 z22_more_elven_lessons:0 "More Elven Lessons"
 z22_more_elven_lessons_desc:0 "We will have more lessons in elven to get more people educated as traders."
 z22_complaints_about_language:0 "Language Complaints"
 z22_complaints_about_language_desc:0 "People don't want to be forced to learn a different language."
