# Country and Province Modifiers

 z22_icewinds_upset:0 "Icewinds Upset"
 z22_icewinds_upset_desc:0 "Our Actions have annoyed the Icewind Clan"
 z22_denied_conversion:0 "Denied Conversion"
 z22_denied_conversion_desc:0 "A citizen was forced to revert their conversion to another religion."
 z22_elf_supremacist_fears:0 "Worries of Elf Supremacy"
 z22_elf_supremacist_fears_desc:0 "Recent Policies have caused people to worry about the nation using other races as stepping stones for the Elves."
 z22_more_elven_lessons:0 "More Elven Lessons"
 z22_more_elven_lessons_desc:0 "We will have more lessons in elven to get more people educated as traders."
 z22_complaints_about_language:0 "Language Complaints"
 z22_complaints_about_language_desc:0 "People don't want to be forced to learn a different language."
 z22_magnates_and_clans:0 "Magnates and Clans"
 z22_magnates_and_clans_desc:0 "A local Magnate family has been absorbed into one of the Merchant Clans, boosting the profits of the province."
 z22_clan_favouritism:0 "Clan Favouritism"
 z22_clan_favouritism_desc:0 "Our ruler is playing favourites with the Clans."
 z22_clan_favouritism_denied:0 "Denied Nepotism"
 z22_clan_favouritism_denied_desc:0 "Denied nepotistic favours."
 z22_elventongued_finefolks:0 "Elventongued Finefolks"
 z22_elventongued_finefolks_desc:0 "A snobbish supremacist feeling has formed around those within our nation who speak elven, alienating those who do not."
 z22_lowered_elven_standards:0 "Lowered Elven Standards"
 z22_lowered_elven_standards_desc:0 "Lowered the standards of elven language requirements."
 z22_declined_advisors:0 "Refused Clan-loyalist Advisors"
 z22_declined_advisors_desc:0 "Refused to employ advisors with clan loyalties."
 z22_white_harbour_gates:0 "Gates to the White Harbour"
 z22_white_harbour_gates_desc:0 "Large forts and patrol ships can be sighted by any ship approaching the inlet of the Mawriver making would-be raider or smuggler think twice before approaching."
 z22_last_homely_harbour:0 "The Last Homely Harbour" #Víteán
 z22_last_homely_harbour_desc:0 "The fair homestead of Víteán watches over a narrow bay at the mouth of a fast-running river reachable only by boat save for a steep zig-zag path to the pine clad ridge above. A warm and comfortable refuge, the small town has many spare beds for visiting travellers and in matters of stars, sails, or weather it as a haven of good counsel and wise lore. It gains its nickname of The Last Homely house from sailors heading out to Aelantir, for to them it is the last chance for provisions and a warm bed before braving the cold waves of the northern crossings."
 z22_growing_colony:0 "Growing Colony"
 z22_growing_colony_desc:0 "This colony is growing rapidly."
 z22_pass_watched:0 "The Pass is Watched"
 z22_pass_watched_desc:0 "The tight grip Celmaldor holds on the Frostbridges severely limits our ability to raid."
 z22_frozen_infrastructure:0 "Anti-Freezing Infrastructure"
 z22_frozen_infrastructure_desc:0 "To prevent these important locations from falling victim to the harsh cold of the lands we have invested thoroughly in stores of coal and wood to keep warm the inhabitants and buildings that they may keep the shipping lanes open. "
 z22_restructuring_army:0 "Restucturing the Army"
 z22_restructuring_army_desc:0 "We are busy redesigning the bureaucracy of our army which limits its capabilities somewhat."
 z22_colonial_port:0 "Primary Colonial Port"
 z22_colonial_port_desc:0 "The local infrastructure of the White Harbour allows for efficient loading of huge ships of settlers and resources for our colonies in the Old world."
 z22_out_of_reach:0 "Out of Reach"
 z22_out_of_reach_desc:0 "The prepared defenses of the Reachmen swing naval battles in the surounding coast significantly in their favour."
 z22_prepared_defenses:0 "Eternally Prepared"
 z22_prepared_defenses_desc:0 ""It may only need one year's slack to erode a century of building and arming, let us never be idle or lazy.""
 z22_caution_of_taelar:0 "The Caution of Taelar"
 z22_caution_of_taelar_desc:0 "Taelar Icewind is a famously timid elf, if we work carefully this can work in our favour and make other nations fear us less."
 z22_ignored_corruption:0 "Ignored Local Corruption"
 z22_ignored_corruption_desc:0 "Tips about the corrupt institutions of this province have been ignored, allowing for its administration to suffer."
 z22_snow_legions:0 "Snow Legions"
 z22_snow_legions_desc:0 "Our army boasts training in the harshest of winter conditions with the most state of the art weaponry and tactics."
 z22_whitespear_expedition_society:0 "The Whitesper Expedition Society"
 z22_whitespear_expedition_society_desc:0 "Founded by the Whitespear clan, the Expedition Society of Lonely Isle funds ventures related to the research of Aelantir. Focusing on collaboration with the local ruinborn regimes the society conducts investigations in archaeology, ecology, and geography, granting both the Republic and its ruinborn allies extensive advantages in our knowledge especially surrounding the Precursor Elves."
 z22_icewind_commerce_house:0 "Icewind Commerce House"
 z22_icewind_commerce_house_desc:0 ""A much smaller version of the famous Icewind Palace of Commerce in the Capital itself, the local house of commerce serves the same purpose as its larger predecessor. Well staffed and full of cozy private rooms, the house is an excellent place to conduct your company's deals be it to sell, hire or insure!\n\n- COmmerce House Placard"
 z22_frozentide_anticorruption:0 "Frozentide No-Tolerance"
 z22_frozentide_anticorruption_desc:0 "Even the smallest embezzlement or tax evasion is frowned upon by the Frozentide Clan, whose influence across our nation serves to constantly eliminate elements seeking to cheat and exploit."
 z22_centre_reach:0 "Centre of the Reach"
 z22_centre_reach_desc:0 "A flat here is desirable, a job a dream, the serpentshead's cities are the most prosperous even in the booming economy of The Reach."
 z22_flagships:0 "Maintaining the Galsheah"
 z22_flagships_desc:0 "We have secured the systems and resources to field our second flagship of Nur Galsheáh."
 z22_against_bayvic:0 "Against Bayvic"
 z22_against_bayvic_desc:0 "Furthermore I believe the Bayvicman league must be destroyed"
 z22_magnate_lumber:0 "Magnate Lumber"
 z22_magnate_lumber_desc:0 "This province produces vast amounts of lumber for our ships thanks to the oversight of competent Magnates."
 z22_new_timber:0 "New Timber"
 z22_new_timber_desc:0 "New sources of timber allow us to expand our cities at a much cheaper cost."
 z22_westmoors_rebel_support:0 "Moorman Rebel Support"
 z22_westmoors_rebel_support_desc:0 "We are supporting a revolt in the moors."
 z22_westmoor_rebel_consort:0 "Rebel Elven Consort"
 z22_westmoor_rebel_consort_desc:0 "Our consort brought with her a force of elite elven rangers who have helped strengthen our army and win many skirmishes out on the misty moors."
 z22_gnomish_acceptance:0 "Gnomish Acceptance"
 z22_gnomish_acceptance_desc:0 "We have found a good source of innovators and consellors in the gnomish people recently granted extensive rights and citisenship through the acts of Deland."
 z22_league_support:0 "Supporting the League"
 z22_league_support_desc:0 "We have invested large sums of money into boosting the immediate power of our trade league."
 z22_toward_unification:0 "Toward Unification"
 z22_toward_unification_desc:0 "The reach clamours for less boundaries and more representation, the path toward diplomatic unification is going faster and smoother all the time."
 z22_bright_futures:0 "Bright Futures"
 z22_bright_futures_desc:0 "Workers motivated by the promise of a safe path to a bright future makes investments profit and grows our cities."
 z22_white_reach_stabilised:0 "The White Reach Stabilised"
 z22_white_reach_stabilised_desc:0 "We have eliminated the uncertainty and conflict which plagued the Eastern Alenic Reach."
 z22_gerudian_settlers:0 "Gerudian Settlers"
 z22_gerudian_settlers_desc:0 "Our colonies now also receive settlers from Gerudia"
 z22_welcome_reach:0 ""Welcome to the Reach!""
 z22_welcome_reach_desc:0 "We are the white capital of equality and prosperity in the north, may all see the happiness of our people and the success of our society."
 z22_northern_city_development:0 "Northern City Development"
 z22_northern_city_development_desc:0 "Similarly to the Blue Reach places in Gerudia have begun to urbanise and become trade hubs, this should allow for easier expansion of these cities."
 z22_northern_trade_cities:0 "Northern Trading Cities"
 z22_northern_trade_cities_desc:0 "Emulants of their older sisters in the Reach, these Gerudian Cities have grown into formidable trading centres as prosperous as any in the south."
 z22_white_harbour_couriers:0 "The White Harbour Courier Service"
 z22_white_harbour_couriers_desc:0 "Due the vastness of the White Harbour the city employs a large amount of ferries to efficiently reach the different docks and shipyards with goods, people and messages."
 z22_white_harbour_1:0 "The White Harbour"
 z22_white_harbour_1_desc:0 "Intended to be able to host the entiraty of the Migrant Fleet, the White Harbour is a huge port complex made to operate through even the harshest winters and to be able to service even the colossal Migrant Ships themselves without issue.\n\nStill in disreapair and far from its intended size, some initial reconstruction efforts have proven to bear fruit in re-opened piers and loading cranes."
 z22_white_harbour_2:0 "The White Harbour"
 z22_white_harbour_2_desc:0 "Intended to be able to host the entiraty of the Migrant Fleet, the White Harbour is a huge port complex made to operate through even the harshest winters and to be able to service even the colossal Migrant Ships themselves without issue.\n\nAlmost returning to the peak of its operations, only the furthest of the grey stone landingways remain unused."
 z22_white_harbour_3:0 "The White Harbour"
 z22_white_harbour_3_desc:0 "Intended to be able to host the entiraty of the Migrant Fleet, the White Harbour is a huge port complex made to operate through even the harshest winters and to be able to service even the colossal Migrant Ships themselves without issue.\n\nThe harbour is now fully at capacity for what it was, every single old pier is repaired and serving ships year-round. We will need to claim new land and raise new docks to host the increasing ship traffic."
 z22_white_harbour_4:0 "The White Harbour"
 z22_white_harbour_4_desc:0 "Intended to be able to host the entiraty of the Migrant Fleet, the White Harbour is a huge port complex made to operate through even the harshest winters and to be able to service even the colossal Migrant Ships themselves without issue.\n\nThe Sprawling labyrinth of docks is now a veritable city in and of itself, one can barely see the horizon from the shore past the swaying forest of sails."
 z22_white_harbour_5:0 "The White Harbour"
 z22_white_harbour_5_desc:0 "Intended to be able to host the entiraty of the Migrant Fleet, the White Harbour is a huge port complex made to operate through even the harshest winters and to be able to service even the colossal Migrant Ships themselves without issue.\n\nThe final stage of the Harbour has been finished, now should a second Migrant Fleet come visiting we should laugh merrily and show them docking space, workers, pulleys, cranes and storage carts to host their number once and again!"
 z22_harbour_construction_1:0 "Harbour Expansion Ongoing"
 z22_harbour_construction_1_desc:0 "Some of the workings of the city have been disrupted due to the harbour expansion efforts."
 z22_harbour_construction_2:0 "Harbour Expansion Ongoing"
 z22_harbour_construction_2_desc:0 "Some of the workings of the city have been disrupted due to the harbour expansion efforts."
 z22_harbour_construction_3:0 "Harbour Expansion Ongoing"
 z22_harbour_construction_3_desc:0 "Some of the workings of the city have been disrupted due to the harbour expansion efforts."
 z22_harbour_construction_4:0 "Harbour Expansion Ongoing"
 z22_harbour_construction_4_desc:0 "Some of the workings of the city have been disrupted due to the harbour expansion efforts."
 z22_harbour_construction_5:0 "Harbour Expansion Ongoing"
 z22_harbour_construction_5_desc:0 "Some of the workings of the city have been disrupted due to the harbour expansion efforts."
 z22_greater_reach:0 "The Greater Reach"
 z22_greater_reach_desc:0 "The Reach is not only Celmaldor, it is not only the Blue Cities or even the White too, in our guidance The Reach is now the entirety of Gerudia!"
 z22_trade_council:0 "Grand Council of Trade"
 z22_trade_council_desc:0 "Our nation is represented in a Grand International Trading Council which works to set prices and eliminate tariffs in order to ensure a steady and prosperous flow of goods and services."
 z22_trade_leader:0 "Trade Leader"
 z22_trade_leader_desc:0 "Our Position as head of the grandest trading council in the world gives us immense power to remove our enemies profits at a whim."
 z22_pale_legions:0 "Pale Legions"
 z22_pale_legions_desc:0 "Our army boasts training in the harshest of winter conditions with the most state of the art weaponry and tactics."
 z22_wood_stone:0 "Walls of Wood and Stone"
 z22_wood_stone_desc: ""It may only need one year's slack to erode a century of building and arming, let us never be idle or lazy.""
 z22_anchoring_might:0 "Anchoring Might"
 z22_anchoring_might_desc:0 "When the league fears or worries let us be the strong back which they may look at to steel their nerves as we hold back their foes."
 z22_linked_military:0 "Linked Military"
 z22_linked_military_desc:0 "Like knots in a chain the individual armies of the reach are part of a greater whole, and through this whole we in the league remain protected so long as the links and their anchor hold strong."
 z22_frontier_settlement:0 "Frontier Settlement"
 z22_frontier_settlement_desc:0 "Investments have been made to expand into the unadministered frontiers."
 z22_unification_desire:0 "Unification Desire"
 z22_unification_desire_desc:0 "The reach clamours for less boundaries and more representation, the path toward diplomatic unification is going faster and smoother all the time."
 z22_specialised_light:0 "Specialised Light Ship Infrastructure"
 z22_specialised_light_desc:0 "The shipyards of the WHite Harbour are specially designed to accommodate, build, and repair light trading ships."
 z22_specialised_heavy:0 "Specialised Heavy Ship Infrastructure"
 z22_specialised_heavy_desc:0 "To better protect ourselves and the Trade League the White Harbour has excellent facilities for the reparing and fielding of large vessels of war."
 z22_whitespear_whaling_guild:0 "Whitespear Whaling Guild"
 z22_whitespear_whaling_guild_desc:0 "A local Whitespear Clan administered whaling and fishing guild improves the profits of this province."
 z22_commercial_language_blue_1:0 "Commercial Language"
 z22_commercial_language_blue_1_desc:0 "Knowledge of one unified language of commerce has improved the local population's capacity to take in new information and acclimate to new jobs and inventions."
 z22_commercial_language_notblue_1:0 "Commercial Language"
 z22_commercial_language_notblue_1_desc:0 "Knowledge of one unified language of commerce has improved the local population's capacity to take in new information and acclimate to new jobs and inventions. However the dislike of the mandatorisation of elven as the commercial language has people upset."
 z22_commercial_language_blue_2:0 "Commercial Language"
 z22_commercial_language_blue_2_desc:0 "Knowledge of one unified language of commerce has improved the local population's capacity to take in new information and acclimate to new jobs and inventions."
 z22_commercial_language_notblue_2:0 "Commercial Language"
 z22_commercial_language_notblue_2_desc:0 "Knowledge of one unified language of commerce has improved the local population's capacity to take in new information and acclimate to new jobs and inventions. However the dislike of the mandatorisation of elven as the commercial language has people upset."
 z22_icewind_mercs:0 "Icewind Funded Mercenaries"
 z22_icewind_mercs_desc:0 "Clan Icewind is using their money to fund our Mercenaries, making them cheaper at only their expense."
 z22_frozentide_mercs:0 "Frozentide Funded Mercenaries"
 z22_frozentide_mercs_desc:0 "Clan Frozentide is using their money to fund our Mercenaries, making them cheaper at only their expense."
