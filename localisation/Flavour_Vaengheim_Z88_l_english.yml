vaengheim.101.t: "Hunt go!"
vaengheim.101.d: "hunts"
vaengheim.101.a: "Enter Equilibrium"
vaengheim.101.b: ""
vaengheim.101.c: ""
vaengheim.101.e: ""
vaengheim.101.f: ""
vaengheim.101.g: ""
