l_english:

 cot_golden_era.1.t:0 "Choose golden era type"
 cot_golden_era.1.d:0 "Our country has entered a golden era, but how should we take advantage of it?"
 cot_golden_era.1.a:0 "Focus on administration and budget"
 cot_golden_era.1.b:0 "Focus on diplomacy and trade"
 cot_golden_era.1.c:0 "Focus on the military and general staff"

 cot_golden_era_adm:0 "Golden Era of Administration and Finance"
 cot_golden_era_dip:0 "Golden Era of Diplomacy and Industry"
 cot_golden_era_mil:0 "Golden Era of Military"

 cot_golden_era.3.t:0 "Golden Era - Genius Treasurer"
 cot_golden_era.3.d:0 "In this time of splendour of our country, a brilliant treasurer has appeared in our court to help us bring the nation's finances to new heights."
 cot_golden_era.3.a:0 "He's the right man for the job"

 cot_golden_era.4.t:0 "Golden Era - Prodigy Heir"
 cot_golden_era.4.d:0 "As the country enters a golden era, one of our ruler's children showed an exceptional skill in administration. How should we put their talent to use?"
 cot_golden_era.4.a:0 "Declare them the official heir"
 cot_golden_era.4.b:0 "Let them educate our current heir instead"

 cot_golden_era.5.t:0 "Golden Era - Ambitious explorer"
 cot_golden_era.5.d:0 "The golden era inspired our people to look beyond the horizon. One such young man offered to brave the seas and explore the world in our glorious nation's name."
 cot_golden_era.5.a:0 "May he venture further than any before him"

 cot_golden_era.6.t:0 "Golden Era - Industralisation of the capital"
 cot_golden_era.6.d:0 "The golden era can be vividly seen in our capital. New merchant guilds, manufacturing exotic goods, are sprining up at every corner. Which industry should we focus on as we expand our capital?"
 cot_golden_era.6.a:0 "Focus on Cloth industry"
 cot_golden_era.6.b:0 "Focus on Glass industry"
 cot_golden_era.6.c:0 "Focus on Silk industry"
 cot_golden_era.6.d:0 "Focus on our current industry"

 cot_golden_era.7.t:0 "Golden Era - Administrative power"
 cot_golden_era.7.d:0 "Our golden era has brought about an enormous amount of political power, that is sure to help our bureaucracy."
 cot_golden_era.7.a:0 "There's no such thing as too much bureaucracy"

 cot_golden_era.8.t:0 "Golden Era - Genius Trader"
 cot_golden_era.8.d:0 "In this time of splendour of our country, a brilliant trader has appeared in our court to help us expand our trade routes further than ever before."
 cot_golden_era.8.a:0 "He's the right man for the job"

 cot_golden_era.9.t:0 "Golden Era - Prodigy Heir"
 cot_golden_era.9.d:0 "As the country enters a golden era, one of our ruler's children showed an exceptional eloquence and diplomatic skill. How should we put their talent to use?"
 cot_golden_era.9.a:0 "Declare them the official heir"
 cot_golden_era.9.b:0 "Let them educate our current heir instead"

 cot_golden_era.10.t:0 "Golden Era - Ambitious admiral"
 cot_golden_era.10.d:0 "The golden era has brought about an exceptional talet. One of those gifted individuals is a young admiral, who offers to lead our navy."
 cot_golden_era.10.a:0 "With his help, we shall rule the seas"

 cot_golden_era.11.t:0 "Golden Era - New center of trade"
 cot_golden_era.11.d:0 "With the dawn of the golden era, one of our cities has become a popular hub for traders from near and far."
 cot_golden_era.11.a:0 "Business is booming"

 cot_golden_era.12.t:0 "Golden Era - Diplomatic power"
 cot_golden_era.12.d:0 "Our golden era has brought about an enormous amount of diplomatic power, that is sure to help our industry and trade, as well as give us political leverage."
 cot_golden_era.12.a:0 "Leverage is good"

 cot_golden_era.13.t:0 "Golden Era - Genius Commandant"
 cot_golden_era.13.d:0 "In this time of splendour of our country, a brilliant commandant has appeared in our court. He offers to drill our troops, so that they could face any enemy."
 cot_golden_era.13.a:0 "He's the right man for the job"

 cot_golden_era.14.t:0 "Golden Era - Prodigy Heir"
 cot_golden_era.14.d:0 "As the country enters a golden era, one of our ruler's children showed an exceptional military skill and tactical mind. How should we put their talent to use?"
 cot_golden_era.14.a:0 "Declare them the official heir"
 cot_golden_era.14.b:0 "Let them educate our current heir instead"

 cot_golden_era.15.t:0 "Golden Era - Ambitious general"
 cot_golden_era.15.d:0 "The golden era has brought about an exceptional talet. One of those gifted individuals is a young general, who offers to lead our army."
 cot_golden_era.15.a:0 "With his help, we shall rule the seas"

 cot_golden_era.16.t:0 "Golden Era - Expand capital fortifications"
 cot_golden_era.16.d:0 "For our nation to thrive, our people must be safe. To that end, our brilliant military engineers worked tirelessly to expand the fortifications of our capital city."
 cot_golden_era.16.a:0 "Let them try and take it"

 cot_golden_era.17.t:0 "Golden Era - Military power"
 cot_golden_era.17.d:0 "Our golden era has brought about an enormous amount of military power, that is sure to help our army, and make sure it will be a shining beacon of martial prowess."
 cot_golden_era.17.a:0 "A wise king never seeks war, but must always be ready for it"
 