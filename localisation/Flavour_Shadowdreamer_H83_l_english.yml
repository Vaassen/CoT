 shadowdreamer.1.t:0 "A Dreamers Dream"
 shadowdreamer.1.d:0 "Cast out of Gor Vazumbrog for his prophetic visions, Zog Shadowdreamer has led his people far, unified in pursuit of the Kabir Drahm, and today he stands alone, addressing what remains of those who escaped with him. \n \n “My friends, long have we ran, persecuted for our beliefs, shunned and hunted. But no more, for we now carve the destiny of the dream, let it be known that we are the dreamers who will never let go. Let us not forget those who have been left behind, those who died so that we could get this far. Know that in their final moments, they were able to find peace, knowing they died in service to the Great Dookan until their last, as is the destiny of every dreamer. The road ahead will be dangerous, not all of us will make it, but we must have faith in Dookans guidance, for all will make sense when we finally arrive at the promised lands. But until then, it is today. Today, we finally begin our great march to Gor Ozumbrog. Today, we become who we were always meant to be. Today, we make history.”"
 shadowdreamer.1.a:0 "We must have faith in Dookan"
 shadowdreamer.2.t:0 "Follow Your Dreams"
 shadowdreamer.2.d:0 "Met some Goblins, Debating their leader, Zog Won, yeah he's kinda the GOAT of this whole religion thing, now they all want to join us"
 shadowdreamer.2.a:0 "Welcome them into the fold"
 shadowdreamer.3.t:0 "Troll Town"
 shadowdreamer.3.d:0 "Some loud trolls were mining nearby us so we have captured them, what do we do?"
 shadowdreamer.3.a:0 "Keep them as our slaves"
 shadowdreamer.3.b:0 "Return them to their people"
 shadowdreamer.3.c:0 "Raid their town"
 shadowdreamer.3.d:0 "Direct them to our friends in §YGrizehûd§!"
 shadowdreamer.4.t:0 "The New Age"
 shadowdreamer.4.d:0 "Zog Shadowdreamer is now far too old to lead his people, Dookan said this Zur Shadowdreamer guy seems pretty chill"
 shadowdreamer.4.a:0 "Glory to Zur Shadowdreamer!"
 shadowdreamer.4.b:0 "I shall tutor him myself"
 shadowdreamer.5.t:0 "Dream Led Footsteps"
 shadowdreamer.5.d:0 "Zur Shadowdreamer, as the chosen of the dreams begins to sleepwalk around Ozumbrog, hearing strange voices."
 shadowdreamer.5.a:0 "What could this mean?"
 shadowdreamer.6.t:0 "Restless Nights"
 shadowdreamer.6.d:0 "Ever since Zur started having his dreams he's been sleepwalking, and now he can barely even rule the country."
 shadowdreamer.6.a:0 "We can only pray for a swift recovery"
 shadowdreamer.7.t:0 "The Voice in the Vault"
 shadowdreamer.7.d:0 "Zur’s sleepwalking ends deep beneath Ozumbrog, he discovered a sealed vault untouched since the dwarves fled, and feels a strange presence that tells him to go kill all the dwarves"
 shadowdreamer.7.a:0 "I see clearly now"
 shadowdreamer.8.t:0 "Zur's Offer"
 shadowdreamer.8.d:0 "You should become my vassal!"
 shadowdreamer.8.a:0 "We have no choice"
 shadowdreamer.8.b:0 "Never!"
 shadowdreamer.9.t:0 "List of Demands"
 shadowdreamer.9.d:0 "The Trolls and Goblins of our realm have UNIONISED????"
 shadowdreamer.9.a:0 "We must resolve this issue swiftly"
 shadowdreamer.10.t:0 "A Promising Dream Sage Born"
 shadowdreamer.10.d:0 "A gifted child has been born within Gor Ozumbrog, one with the potential to become the dream king. However, if he is to realise his potential, he must be trained."
 shadowdreamer.10.a:0 "Allow the Drahmgall to raise him so that he may be gifted in the ways of the Dream"
 shadowdreamer.10.b:0 "He shall grow up in the Dream Council, so that he may understand the ways of all"
 shadowdreamer.10.c:0 "Raise him to be a fine general, able to do what must be done in the name of Dookan"
 shadowdreamer.11.t:0 "Goblins Request Land"
 shadowdreamer.11.d:0 "Goblins think they need more space and autonomy if they are to keep living in our realm"
 shadowdreamer.11.a:0 "Allow them to live there"
 shadowdreamer.11.b:0 "No"
 shadowdreamer.12.t:0 "Trolls Request Land"
 shadowdreamer.12.d:0 "Trolls think they need more space and autonomy if they are to keep living in our realm"
 shadowdreamer.12.a:0 "Allow them to live there"
 shadowdreamer.12.b:0 "No"
 shadowdreamer.13.t:0 "Revenge?"
 shadowdreamer.13.d:0 "Long ago, our forefather Zog Shadowdreamer was cast out from Skewered Drake because of his ideas. Now we have conquered their old hold, we must decide what to do with them."
 shadowdreamer.13.a:0 "Execute them for their crimes"
 shadowdreamer.13.b:0 "Have them exiled, like Zog once was"
 shadowdreamer.13.c:0 "Pardon them. This is beneath us"
 shadowdreamer.14.t:0 "The Old Drakons"
 shadowdreamer.14.d:0 "How shall we use the Drakons of Skewered Drake?"
 shadowdreamer.14.a:0 "Use them as sparring partners for our troops"
 shadowdreamer.14.b:0 "Train an elite force to ride them"
 shadowdreamer.15.t:0 "Renovations Completed"
 shadowdreamer.15.d:0 "BANG CRASH. The last Dwarven Statue within Gor Ozumbrog has been toppled. This is not a disgusting stinky dwarven hold anymore..."
 shadowdreamer.15.a:0 "Finally, now this is truly ORCISH!"
 shadowdreamer.16.t:0 "Dreamforgery Menu"
 shadowdreamer.16.d:0 "Which Dreamforgery would you like today? You must have at least 5 §YDreamfire§! to activate Dreamforgery."
 shadowdreamer.16.a:0 "Establish Dreamforged Swords"
 shadowdreamer.16.b:0 "Revoke Dreamforged Swords"
 shadowdreamer.16.c:0 "Establish Dreamforged Armor"
 shadowdreamer.16.e:0 "Revoke Dreamforged Armor"
 shadowdreamer.16.f:0 "Establish Dreamforged Cannons"
 shadowdreamer.16.g:0 "Revoke Dreamforged Cannons"
 shadowdreamer.16.h:0 "Establish Dreamforged Supply Lines"
 shadowdreamer.16.i:0 "Revoke Dreamforged Supply Lines"
 shadowdreamer.16.j:0 "Go Back"
 shadowdreamer.17.t:0 "Mithril Seeding Completed"
 shadowdreamer.17.d:0 "Hey, you shouldnt be seeing this event! (Unless using the console)"
 shadowdreamer.17.a:0 "Oops!"
 shadowdreamer.18.t:0 "Dream Innovation"
 shadowdreamer.18.d:0 "Goblins have made Proto Dream-Laced Artificery Tools and say they're super cool!"
 shadowdreamer.18.a:0 "Perhaps it is time for us to listen to these goblins"
 shadowdreamer.18.b:0 "We must devote ourselves only to magic"
 shadowdreamer.19.t:0 "Dream Innovation"
 shadowdreamer.19.d:0 "The brightest Orcs have made Proto Dream-Laced Artificery Tools and say they're super cool!"
 shadowdreamer.19.a:0 "Perhaps it is time for us to look to the future"
 shadowdreamer.19.b:0 "We must devote ourselves only to magic"
 shadowdreamer.20.t:0 "The Long Forgotten"
 shadowdreamer.20.d:0 "The calls that we heard from this old hold tell the dreamers to visit Jorkad"
 shadowdreamer.20.a:0 "We Must Investigate"
 shadowdreamer.21.t:0 "Artificers Done Studying"
 shadowdreamer.21.d:0 "Hey, you shouldnt be seeing this event! (Unless using the console)"
 shadowdreamer.21.a:0 "Oops!"
 shadowdreamer.22.t:0 "Mages Done Studying"
 shadowdreamer.22.d:0 "Hey, you shouldnt be seeing this event! (Unless using the console)"
 shadowdreamer.22.a:0 "Oops!"
 shadowdreamer.23.t:0 "The Expedition"
 shadowdreamer.23.d:0 "We were told to explore here! I'm sure we wont find anything earth shattering."
 shadowdreamer.23.a:0 "I shall personally lead this expedition!"
 shadowdreamer.24.t:0 "The Lab"
 shadowdreamer.24.d:0 "Ooh, an old lab! What could we learn here?"
 shadowdreamer.24.a:0 "Let us investigate"
 shadowdreamer.25.t:0 "The Abomination"
 shadowdreamer.25.d:0 "Mangled skeletons of Orcs and all other kinds of creatures found, it kinda stinks too."
 shadowdreamer.25.a:0 "What kind of monster could have done this?"
 shadowdreamer.26.t:0 "The Theory"
 shadowdreamer.26.d:0 "THIS IS OUR BIRTHPLACE?? WHAT THE FUUUUU- Well, at least we know we were LITERALLY CREATED to kill Dwarves!"
 shadowdreamer.26.a:0 "We must accept this new reality"
 shadowdreamer.27.t:0 "The End"
 shadowdreamer.27.d:0 "Woah, you did it?? I hope you enjoyed the MT :)"
 shadowdreamer.27.a:0 "Congrats!"
 shadowdreamer.28.t:0 "Rumors of the Great Bat"
 shadowdreamer.28.d:0 "Theres this big bat thing, apparently if we kill it we can make some mithril there"
 shadowdreamer.28.a:0 "We must prepare the troops"
 shadowdreamer.28.b:0 "I'll do it later"
 shadowdreamer.29.t:0 "Who shall we have lead the hunt?"
 shadowdreamer.29.d:0 "This will be dangerous"
 shadowdreamer.29.a:0 "Allow a Goblin General to take charge"
 shadowdreamer.29.b:0 "Allow a Troll General to take charge"
 shadowdreamer.29.c:0 "I shall lead"
 shadowdreamer.29.e:0 "Nevermind, another time maybe"
 shadowdreamer.30.t:0 "Size of the hunt"
 shadowdreamer.30.d:0 "How many men do we need to kill the bat? I've heard its big and VERY scary."
 shadowdreamer.30.a:0 "5000 of our soldiers will have no problem wiping out this beast."
 shadowdreamer.30.b:0 "We do not have the resources to spare to invest any more than 10,000 soldiers."
 shadowdreamer.30.c:0 "We must be careful, 20,000 soldiers should be enough."
 shadowdreamer.30.e:0 "We shall spare no expense. We must bring as many troops as possible."
 shadowdreamer.30.f:0 "We are not prepared for this. Cancel the hunt."
 shadowdreamer.31.t:0 "Echoes in the deep"
 shadowdreamer.31.d:0 "As the hunt descends into the Pit of Xazor, strange echoes ripple through the caverns. They are not merely sounds they are voices that mimic our warband, calling their names. \n \n Grotesque, bat-like humanoids, eyes empty of life, shrieking in imitation of our own soldiers. Minions of Xazor, arisen from those who once chased the Dream and never returned. \n They hunt alongside the beast."
 shadowdreamer.31.a:0 "We must push onwards"
 shadowdreamer.32.t:0 "An ambush"
 shadowdreamer.32.d:0 "The echoes grow louder... then become screams. \n From cracks in the stone, the bat things pour forth in a shrieking tide, their twisted mouths repeating our own commands and battle cries. The cavern becomes chaos as shadows tear into the hunt. \n \n Xazor’s minions strike first."
 shadowdreamer.32.a:0 "There is nothing we can do"
 shadowdreamer.32.b:0 "We must fight them head on"
 shadowdreamer.33.t:0 "Silence"
 shadowdreamer.33.d:0 "The tunnels open into a vast chamber, yet nothing comes. The echoes fade into the distance, as our troops are engulfed in silence. No screams. No wings. Only the distant drip of water and the uneasy feeling of being watched. \n \n Either the beast knows not… or prepares something far worse."
 shadowdreamer.33.a:0 "Perhaps this is for the best"
 shadowdreamer.34.t:0 "A slaughter?"
 shadowdreamer.34.d:0 "Deep within the cavern, the echoes finally stop. \n Dozens of bat things cling to the stone above, folded wings twitching as they sleep. Their mouths murmur half formed words, fragments of old hunts and dying prayers. \n A single mistake could wake them all."
 shadowdreamer.34.a:0 "We must kill them here"
 shadowdreamer.35.t:0 "The Great Bat"
 shadowdreamer.35.d:0 "The tunnels widen into a vast, lightless chamber. The air grows hot and still, heavy with the stink of blood. \n From the ceiling comes the slow scrape of claws on stone. \n \n Xazor descends at last. \n A shape of wings and ruin unfolds above us, vast, scarred, and crowned with burning eyes. Its minions scatter as it lands, the Pit of Xazor trembling beneath its weight."
 shadowdreamer.35.a:0 "There is no turning back now. This ends here."
 shadowdreamer.36.t:0 "Failure..."
 shadowdreamer.36.d:0 "This was never even a fight. \n \n The hunt breaks apart in the dark, formations lost beneath screaming wings. Orders are swallowed by echoes that mock them back in familiar voices. One by one, the lights go out. \n \n By the time silence returns to the Pit of Xazor, none remain. Just the scattered bodies of soldiers who once followed the dream."
 shadowdreamer.36.a:0 "Damn it"
 shadowdreamer.37.t:0 "The Stalemate"
 shadowdreamer.37.d:0 "Our weapons have finally find their mark. A wing is torn, ichor spills across the stone, and Xazor’s scream shakes the cavern to its foundations. \n \n With a furious surge, it withdraws into the depths, leaving our formation decimated. The survivors drag themselves from the Pit, with the knowledge that Xazor bleeds. \n We have shown that the beast can be harmed. \n And now, wounded and enraged, it will remember us."
 shadowdreamer.37.a:0 "We will be back"
 shadowdreamer.38.t:0 "Total Victory"
 shadowdreamer.38.d:0 "The battle grinds on until the stone is slick with blood from orc and beast alike. At last, Xazor falters. A final blow sends the great body crashing to the cavern floor, and the echoes that once filled the Pit collapse into silence. \n \n When the dust settles, the minions are gone, crumbling into ash and shadow. Only Xazor's corpse remains, yet eventually, even that dissipates into a pool of tainted ichor, seeping into the stone.\n The Pit of Xazor is quiet now. \n Whatever once watched from the dark has been unmade."
 shadowdreamer.38.a:0 "Glory to Shadowdreamer!"

 


