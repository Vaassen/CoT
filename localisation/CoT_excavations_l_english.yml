 # Rewards
 cot_excavate_rewards.1.t:0 "Excavation results - A single golden coin"
 cot_excavate_rewards.1.d:0 "Our excavation efforts were rather uneventful, all we managed to find was a single golden coin."
 cot_excavate_rewards.1.a:0 "I'll keep it for luck"

 cot_excavate_rewards.2.t:0 "Excavation results - Old weapons"
 cot_excavate_rewards.2.d:0 "It seems our excavation site was once a place of a huge battle. We managed to retrieve some of the old weapons found there, maybe they will prove useful."
 cot_excavate_rewards.2.a:0 "Good enough to arm some peasants"
 
 cot_excavate_rewards.3.t:0 "Excavation results - A desert hot spring"
 cot_excavate_rewards.3.d:0 "During excavations our workers encountered a water spring in the middle of the desert. It is certain this will bring some life to these harsh lands."
 cot_excavate_rewards.3.a:0 "Halanna has blessed us"
 
 cot_excavate_rewards.4.t:0 "Excavation results - A huge diamond"
 cot_excavate_rewards.4.d:0 "One of our workers has found a massive diamond during the excavation. With such a jewel, the crown will shine brighter than ever before."
 cot_excavate_rewards.4.a:0 "Shine bright"