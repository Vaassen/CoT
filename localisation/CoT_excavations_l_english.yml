l_english:
 
 # Button
 cot_excavate_button_tt:0 "Excavate!"
 excavate_one_at_a_time_tt:0 "Is not currently constructing a building or centralizing the state.\nWe can only excavate one province at a time."
 cot_excavate_start_tt:0 "\nExcavations will take roughly a year. Upon completion, Halanna will reward us with her riches... right?"
 cot_excavate_progress_tt:0 "Excavation efforts in progress"

 # Building
 excavation_1:0 "Excavation site"
 building_excavation_1:0 "Excavation site"
 ledger_excavation_1:0 "Excavation site"

 # Rewards
 cot_excavate_rewards.1.t:0 "Excavation results - A single golden coin"
 cot_excavate_rewards.1.d:0 "Our excavation efforts were rather uneventful, all we managed to find was a single golden coin."
 cot_excavate_rewards.1.a:0 "I'll keep it for luck"

 cot_excavate_rewards.2.t:0 "Excavation results - Old weapons"
 cot_excavate_rewards.2.d:0 "It seems our excavation site was once a place of a huge battle. We managed to retrieve some of the old weapons found there, maybe they will prove useful."
 cot_excavate_rewards.2.a:0 "Good enough to arm some peasants"
 
 cot_excavate_rewards.3.t:0 "Excavation results - A desert hot spring"
 cot_excavate_rewards.3.d:0 "During excavations our workers encountered a water spring in the middle of the desert. It is certain this will bring some life to these harsh lands."
 cot_excavate_rewards.3.a:0 "Halanna has blessed us"
 
 cot_excavate_rewards.4.t:0 "Excavation results - A huge diamond"
 cot_excavate_rewards.4.d:0 "One of our workers has found a massive diamond during the excavation. With such a jewel, the crown will shine brighter than ever before."
 cot_excavate_rewards.4.a:0 "Shine bright"

 cot_excavate_rewards.5.t:0 "Excavation results - A goblin nest!"
 cot_excavate_rewards.5.d:0 "The goblins! They are everywhere!"
 cot_excavate_rewards.5.a:0 "To arms!"

 cot_excavate_rewards.6.t:0 "Excavation results - A marble deposit"
 cot_excavate_rewards.6.d:0 "During excavations we have found a sizeable amound of good quality marble. While not treasure, it will certainly aid our construction sector in the area."
 cot_excavate_rewards.6.a:0 "Practical, I like it"
 cot_excavate_marble_deposit:0 "Marble deposit"

 cot_excavate_rewards.7.t:0 "Excavation results - Old scrolls"
 cot_excavate_rewards.7.d:0 "We have found a chest full of old scrolls. We think it's some bureaucratic corespondence. Perhaps it will give us insight how our ancestors governed this land."
 cot_excavate_rewards.7.a:0 "As if I needed more bureaucratic corespondence in my life"

 cot_excavate_rewards.8.t:0 "Excavation results - Old pottery"
 cot_excavate_rewards.8.d:0 "Our miners have found some pottery decorated with beautiful pictures depicting events from our ancestors' myths and legends. Perhaps they will help us better understand their culture and how they contributed to shaping our own."
 cot_excavate_rewards.8.a:0 "Fascinating"

 cot_excavate_rewards.9.t:0 "Excavation results - Ancient temple"
 cot_excavate_rewards.9.d:0 "We have found a large underground temple complex. Perhaps we could repurpose it to serve our gods instead?"
 cot_excavate_rewards.9.a:0 "Marvelous"

 cot_excavate_rewards.10.t:0 "Excavation results - Kobold hoard"
 cot_excavate_rewards.10.d:0 "Good news: We found a pile of gold!\nBad news: It's surrounded by a horde of feral kobolds..."
 cot_excavate_rewards.10.a:0 "Gold you said?"

 cot_excavate_rewards.11.t:0 "Excavation results - Rosemetal"
 cot_excavate_rewards.11.d:0 "We have found a vein of the most prized mineral in Western Cannor. Rosemetal is perfect for decorating royal regalia and is the jewel in the crown of Lorent."
 cot_excavate_rewards.11.a:0 "Wine isn't the only treasure this land has to offer."

 cot_excavate_rewards.12.t:0 "Excavation results - Ebonsteel"
 cot_excavate_rewards.12.d:0 "We have found a deposit of Ebonsteel, the metal of choice for the best Gerudian warriors. A correctly prepared Ebosteel armour is lighter and stronger than any other in Cannor."
 cot_excavate_rewards.12.a:0 "Fire the Ebonsteel forges!"

 cot_excavate_rewards.13.t:0 "Excavation results - Cold Iron"
 cot_excavate_rewards.13.d:0 "We have found a vein of Cold Iron. It's a rather rare and brittle metal, but nonetheless useful, mostly for fighting against the fey and other magical creatures."
 cot_excavate_rewards.13.a:0 "Set up a proper mine immediately."

 cot_excavate_rewards.14.t:0 "Excavation results - Elkaesal's Cloak"
 cot_excavate_rewards.14.d:0 "She will probably want it back..."
 cot_excavate_rewards.14.a:0 "Let her try"

 cot_excavate_rewards.15.t:0 "Excavation results - Ancient factory"
 cot_excavate_rewards.15.d:0 "We have found a large underground factory. Let us renovate it and make it functional again."
 cot_excavate_rewards.15.a:0 "Let's get to work"

 cot_excavate_rewards.16.t:0 "Excavation results - Ancient armoury"
 cot_excavate_rewards.16.d:0 "We have found a large underground armoury. Its contents will certainly help our recruitment efforts up above."
 cot_excavate_rewards.16.a:0 "There's no such thing as too many soldiers"

 cot_excavate_rewards.17.t:0 "Excavation results - Ancient laboratory"
 cot_excavate_rewards.17.d:0 "We have found a large underground laboratory. We can surely learn a lot from the experiments conducted there."
 cot_excavate_rewards.17.a:0 "Yeah, science!"

 cot_excavate_rewards.18.t:0 "Excavation results - Ancient dwarven cannon"
 cot_excavate_rewards.18.d:0 "Our engineers have found a massive iron machine. They have indentified it as a piece of dwarven artillery from the times of Aul-Dwarov. Perhaps we could still make use of it."
 cot_excavate_rewards.18.a:0 "Finest dwarven engineering"
 cot_ancient_dwarven_cannon:0 "Kaboom"

 cot_excavate_rewards.19.t:0 "Excavation results - Lost dwarven expedition"
 cot_excavate_rewards.19.d:0 "As the workers are digging through the layers of stone beneath them, they suddenly see ground crumble on its own, creating a hole. After a moment, a group of dwarfs emerge from the revealed tunnel. They take a bit for their eyes to adjust to sunlight, then their leader clears his throat and turns to the closest excavation worker.\n\n\"Ay, you there, which way to Gronstunad?\"\n\nAfter being informed , majority of the dwarfs turn back to the tunnel to continue on their quest. However, some of them decide to stay here and start a new life in this foreign to them land. They even offer some of the treasure they accumulated along the way as a gift."
 cot_excavate_rewards.19.a:0 "A surprise, to be sure, but a welcome one"

 cot_excavate_rewards.20.t:0 "Excavation results - Magical lantern"
 cot_excavate_rewards.20.d:0 "As you await the results of the recent excavation effort, two workers approach you with some sort of lamp. After judging how much it is worth, they inform you that inside is a wish-granting djinn, and he an grant 3 wishes! Sadly, they also inform you that their curiosity made them waste 2 of the wishes already. No matter, you rub the lamp, wait for the djinn to come out and you wish for..."
 cot_excavate_rewards.20.a:0 "Riches!"
 cot_excavate_rewards.20.b:0 "Wisdom!"
 cot_excavate_rewards.20.c:0 "Power!"
 cot_improve_ruler_magic_school_tt:0 "§GIncrease proficiency in a random magic school of your ruler!§!"

