l_english:
 
 # Button
 cot_excavate_button_tt:0 "Excavate!"
 excavate_one_at_a_time_tt:0 "Is not currently constructing a building or centralizing the state.\nWe can only excavate one province at a time."
 cot_excavate_start_tt:0 "\nExcavations will take roughly a year. Upon completion, Halanna will reward us with her riches... right?"
 cot_excavate_progress_tt:0 "Excavation efforts in progress"

 # Building
 excavation_1:0 "Excavation site"
 building_excavation_1:0 "Excavation site"
 ledger_excavation_1:0 "Excavation site"

 # Rewards
 cot_excavate_rewards.1.t:0 "Excavation results - A single golden coin"
 cot_excavate_rewards.1.d:0 "Our excavation efforts were rather uneventful, all we managed to find was a single golden coin."
 cot_excavate_rewards.1.a:0 "I'll keep it for luck"

 cot_excavate_rewards.2.t:0 "Excavation results - Old weapons"
 cot_excavate_rewards.2.d:0 "It seems our excavation site was once a place of a huge battle. We managed to retrieve some of the old weapons found there, maybe they will prove useful."
 cot_excavate_rewards.2.a:0 "Good enough to arm some peasants"
 
 cot_excavate_rewards.3.t:0 "Excavation results - A desert hot spring"
 cot_excavate_rewards.3.d:0 "During excavations our workers encountered a water spring in the middle of the desert. It is certain this will bring some life to these harsh lands."
 cot_excavate_rewards.3.a:0 "Halanna has blessed us"
 
 cot_excavate_rewards.4.t:0 "Excavation results - A huge diamond"
 cot_excavate_rewards.4.d:0 "One of our workers has found a massive diamond during the excavation. With such a jewel, the crown will shine brighter than ever before."
 cot_excavate_rewards.4.a:0 "Shine bright"

 cot_excavate_rewards.5.t:0 "Excavation results - A goblin nest!"
 cot_excavate_rewards.5.d:0 "The goblins! They are everywhere!"
 cot_excavate_rewards.5.a:0 "To arms!"

 cot_excavate_rewards.6.t:0 "Excavation results - A marble deposit"
 cot_excavate_rewards.6.d:0 "During excavations we have found a sizeable amound of good quality marble. While not treasure, it will certainly aid our construction sector in the area."
 cot_excavate_rewards.6.a:0 "Practical, I like it"
 cot_excavate_marble_deposit:0 "Marble deposit"

 cot_excavate_rewards.7.t:0 "Excavation results - Old scrolls"
 cot_excavate_rewards.7.d:0 "We have found a chest full of old scrolls. We think it's some bureaucratic corespondence. Perhaps it will give us insight how our ancestors governed this land."
 cot_excavate_rewards.7.a:0 "As if I needed more bureaucratic corespondence in my life"

 cot_excavate_rewards.8.t:0 "Excavation results - Old pottery"
 cot_excavate_rewards.8.d:0 "Our miners have found some pottery decorated with beautiful pictures depicting events from our ancestors' myths and legends. Perhaps they will help us better understand their culture and how they contributed to shaping our own."
 cot_excavate_rewards.8.a:0 "Fascinating"

 cot_excavate_rewards.9.t:0 "Excavation results - Ancient temple"
 cot_excavate_rewards.9.d:0 "We have found a large underground temple complex. Perhaps we could repurpose it to serve our gods instead?"
 cot_excavate_rewards.9.a:0 "Marvelous"

 cot_excavate_rewards.10.t:0 "Excavation results - Kobold hoard"
 cot_excavate_rewards.10.d:0 "Good news: We found a pile of gold!\nBad news: It's surrounded by a horde of feral kobolds..."
 cot_excavate_rewards.10.a:0 "Gold you said?"