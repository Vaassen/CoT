 blood_masquerade_organise_title: "Host the Blood Masquerade"
 blood_masquerade_organise_desc: "Invite vampires drink blood bang bitches get bonuses" 
 organise_blood_masquerade.tt: "This will be a demanding event and there will be many prices to pay!!"
 
 
 
 blood_court.3.t: "The Blood Masquerade"
 blood_court.3.1.d: "As the sun sets and the sky turns red, shadows begin to gather beneath the Godshield Mountains, around the grim sight that is the fortress-castle of Arca Corvur. These shadows take the form of galloping horses and the carriages they pull—carriages of the various vampire envoys that have been sent by their estates from all across Cannor to attend the Blood Masquerade.\n\nThe gothic halls of Arca Corvur are unusually busy: immortal envoys plot their power plays, thralls prepare barrels of dozens of different types of blood, prey is prepared for the hunt, musicians finely tune their instruments. Everything must be ready for the immortal hosts—they permit nothing but perfection.\n\nWhile the masquerade combines all the pleasures that might entice the eternal nature of its guests, its true purpose is for the Blood Court to gather, unite, and rule the international vampire society.\n\nThe Blood Court is an organisation of powerful vampires who oversee all vampire activity. They are the law, the government, and the final word on all matters pertaining to vampires. The Blood Court is made up of various vampire envoys, each representing a different vampire estate. The court is led by the Blood Archon, who is traditionally always, if there is one, the Dark Lord of Corvuria, the original and mightiest Vampire Realm.\n\nThe Blood Court rarely convenes, and when it does, it is always at the Blood Masquerade. The Blood Masquerade is the only time when all members of the Blood Court are together in the same place. This is the night when deals are made, new declarations are enacted, old grievances are aired and the course of international vampire efforts is plotted.\n\nFrom the balcony of the great hall, the Blood Archon of Cannor looks down upon his guests with a satisfied smirk.\n\nThe Blood Masquerade is about to begin."
 blood_court.3.2.d: "As the sun sets and the sky turns red, shadows begin to gather beneath the Godshield Mountains, around the grim silhouette of Asheniande — the black jewel of the east, and the site of the Blood Masquerade. These shadows take the form of galloping horses and the carriages they pull—carriages of the various vampire envoys sent from their estates across Cannor to attend this most sacred of gatherings.\n\nThe gothic halls of Asheniande are unusually alive with motion: immortal envoys plot their power plays, thralls prepare barrels of dozens of different types of blood, prey is arranged for the hunt, and musicians fine-tune their instruments. Everything must be perfect — nothing less will satisfy the immortal hosts.\n\nThough the masquerade offers every vice and pleasure that might entice eternal beings, its true purpose is far greater: for the Blood Court to gather, unify, and dictate the fate of vampirekind.\n\nThe Blood Court is a council of powerful vampires who oversee all vampire activity. They are the law, the government, and the final word in all matters that concern the undead. Each member of the court represents a different vampire estate, and together they rule through ancient consensus and ruthless diplomacy.\n\nThe Blood Court rarely convenes, and when it does, it is always beneath the veiled spires of Asheniande during the Masquerade. This is the one night when every envoy walks the same floor. This is when declarations are made, rivalries reignited, and the course of vampire ambition is redrawn.\n\nFrom the balcony above the great hall, the Vampiric Council watches the gathering unfold, their expressions hidden behind silver masks and timeless eyes.\n\nThe Blood Masquerade is about to begin."
 blood_court.3.a: "We shall attend the Masquerade"
 blood_court.3.b: "It is time to solidify our rule"
 blood_court.4.t: "End of the Blood Masquerade"
 blood_court.4.1.d: "We have chosen *Sanguine Diplomacy*, gaining a boost to our diplomatic prowess."
 blood_court.4.2.d: "We have embraced *Dancing Shadows*, enhancing our intrigue and subtlety."
 blood_court.4.3.d: "We have followed *Bound by Blood*, strengthening our Dominus authority."
 blood_court.4.4.d: "We have enacted *Crimson Administration*, improving our administrative capability."
 blood_court.4.5.d: "We have adopted *Scarlet Economy*, refining our control over wealth and trade."
 blood_court.4.6.d: "We have embraced *Grim Architecture*, reinforcing our defenses and resolve."
 blood_court.4.7.d: "We have taken up *The Smell of Blood*, awakening primal instincts in our armies."
 blood_court.4.8.d: "We have unleashed *The Red Tide*, overwhelming our enemies with ferocity."
 blood_court.4.9.d: "We have invested in *Immortal Research*, unlocking secrets hidden from time itself."
 blood_court.4.10.d: "We have assembled the *Army of Darkness*, summoning dread and power incarnate."
 blood_court.4.a: "We are a member and we get a lesser modifier"
 blood_court.4.b: "We are the leader and we get a regular modifier"
 blood_court.4.c: "Shadow over Cannor.."
 SANGUINE_DIPLOMACY_DESC_TOOLTIP: "Your diplomats speak with charm, veiled threat, and blood-soaked promises. Others listen, if they value their lives."
 DANCING_SHADOWS_DESC_TOOLTIP: "From behind curtains and masks, your agents weave webs of secrets, deceit, and whispers that sway courts and rivals alike."
 BOUND_BY_BLOOD_DESC_TOOLTIP: "Oaths sworn in blood bind your vassals and subjects tighter than chains. Loyalty, once earned, becomes absolute."
 CRIMSON_ADMINISTRATION_DESC_TOOLTIP: "A sharp quill and a sharper will. Bureaucracy serves your rule, with ledgers inked in crimson."
 SCARLET_ECONOMY_DESC_TOOLTIP: "Gold flows as freely as blood. Your coffers swell with profit harvested through ruthless efficiency."
 GRIM_ARCHITECTURE_DESC_TOOLTIP: "Towers rise like fangs against the sky, fortresses endure like tombs. Your domains are built to outlast time itself."
 SMELL_OF_BLOOD_DESC_TOOLTIP: "The scent of battle awakens the beast within. Your soldiers fight harder, driven by a primal thirst."
 RED_TIDE_DESC_TOOLTIP: "An ocean of blood surges forth, unstoppable and merciless. None can stand against the coming flood."
 IMMORTAL_RESEARCH_DESC_TOOLTIP: "Ancient tomes and forbidden truths guide your scholars. Through their work, you step closer to mastering undeath itself."
 ARMY_OF_DARKNESS_DESC_TOOLTIP: "You command legions of the dead and damned. Where they march, silence and ash follow."
 blood_court.5.t: "A Declaration of Blood?"
 blood_court.5.d: "As our immortal guests mingle among themselves in the great halls—scheming, revelling, hunting, and enjoying all sorts of depraved activities—we have a much more important task to attend to as the leaders of the Blood Court. It falls to us to decide which course our kind shall take in the upcoming period.\n\nThe decision is neither simple nor easy to make. A thousand different circumstances—ranging from politics and wars to the economy and religious views of various members of our community and beyond—affect the options available to us.\n\nEven after the choice is made, there is still the task of enforcing it. Our esteemed guests each have their own plans, goals, and desires that might not align with our own. Some of them will not obey easily.\n\nYet, we are the Lords of Night and Blood. Our lands are the ancestral homeland of all vampires, and all vampires trace their origins back to us. Our blood is thicker, our armies vast, and our influence is greater than any other vampire estate. Despite all the hardships we might experience at the masquerade and beyond, one thing is certain: they will obey.\n\nAnd so, we shall give a grand speech, letting everyone know of our plans. We will declare a Declaration of Blood that will unite and bind the Court of Blood to our will—and make all the shadows of Cannor serve us..."
 blood_court.5.a: "We hereby proclaim an Age of Sanguine Diplomacy, where honeyed words and veiled threats shall secure our dominion."
 blood_court.5.b: "Let it be known: we walk the Path of Dancing Shadows, where silence, secrecy, and subtlety shall rule."
 blood_court.5.c: "By blood and vow, we declare our realm Bound by Blood — united, unyielding, and forever loyal."
 blood_court.5.d.d: "We proclaim the rise of the Crimson Administration, where order reigns and inefficiency dies a swift death."
 blood_court.5.e: "The Scarlet Economy shall guide our reign, for coin is power, and our coffers shall overflow."
 blood_court.5.f: "We decree the Era of Grim Architecture, where stone and shadow stand eternal as the bones of our rule."
 blood_court.5.g: "Let the Smell of Blood carry through the air — from this day forth, we shall be as beasts upon the battlefield."
 blood_court.5.h: "We proclaim the coming of the Red Tide — relentless, unmerciful, and all-consuming in our wrath."
 blood_court.5.i: "We declare the Ascendancy of Immortal Research; through forbidden knowledge, we shall master eternity."
 blood_court.5.j: "We summon forth the Army of Darkness — an endless host to march beneath our banner of death and power."
 blood_court.6.t: "A Declaration of Blood"
 blood_court.6.1.d: "All of the guests are wealthy nobles and ancient aristocrats, accompanied by the rare rich merchant whose influence has bought them a seat at the table—or at least, a mask on the floor. They arrive adorned in their finest silks, velvets, and lacquered armor. Every guest wears a mask, each bearing the sigil or sacred beast of their estate. All but a few trembling human dignitaries are vampires.\n\nThe great hall is swathed in blood-red banners and tapestries older than most kingdoms. Along the upper balconies, musicians dressed in funeral black play a haunting nocturne on harps and strings. The air is thick with perfume, candle smoke, and the electric tension of ambition.\n\nAt the stroke of midnight, the great doors creak open and the crowd stills. Shadows spill into the room as the representative of the Blood Court makes his entrance—garbed in black and crimson, his mask wrought in silver fangs.\n\nHe ascends the dais in silence. All eyes are fixed upon him. Then, his voice cuts through the silence:\n\n\"With regal poise, the representative speaks of diplomacy sharpened like fangs, of veiled threats and honeyed words. An era of Sanguine Diplomacy shall dawn—where language bleeds and silence kills.\"\n\nWith the speech declared and silence settling like dust, the Ball begins. The music swells. The guests dance, whisper, plot, and feed. The Blood Masquerade has begun in full."
