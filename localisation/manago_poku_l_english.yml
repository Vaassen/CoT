 manago_poku.100.clue_forest_from_cape: "\n\nA tree that could dwarf the world. It beckons you northeast."
 manago_poku.100.clue_jungle_from_cape: "\n\nA jungle filled with abominations. It lures you southwest, to a mighty river's source."

