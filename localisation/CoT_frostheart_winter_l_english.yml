 cot_frostheart_winter.2.t:0 "Eternal Winter - Requirement Fulfiled"
 cot_frostheart_winter.2.d:0 "We have managed to increase food production across the continent. Maybe we will survive this winter, after all."
 cot_frostheart_winter.2.a:0 "Let it grow"

 cot_frostheart_winter.4.t:0 "Eternal Winter - Blizzard"
 cot_frostheart_winter.4.d:0 "A devastating blizzard sweeps through Cannor, destroying crops and burying fields under the snow. People all across the continent are starving, while food is worth its weight in gold."
 cot_frostheart_winter.4.a:0 "What did we do to deserve it?"

 cot_frostheart_winter.6.t:0 "Eternal Winter - A city starves"
 cot_frostheart_winter.6.d:0 "With recent food shortages, towns don't have enough to feed their citizens. In nothing is done, our great cities will wither away"
 cot_frostheart_winter.6.a:0 "Are the gods mad at us?"

