 cot_B31_comb_I:0 "Combined Military I"
 cot_B31_comb_II:0 "Combined Military II"
 cot_B31_trad_I:0 "Traditional Military I"
 cot_B31_trad_II:0 "Traditional Military II"
 castellyr_masters_of_escann_II:0 "Castellyr, Foremost Peers of Escann"
 
 
 #CoT Missions
 CA_economic_overhaul_title:0 "Economic Overhaul"
 CA_economic_overhaul_desc:0 "As our nation has advanced, so too has the economic complexity of the time we live in. We must focus more on developing our financial sectors if we wish to stay relevant and protect our honorable reputation at courts abroad."
 CA_escanninomics_title:0 "Escanninomics"
 CA_escanninomics_desc:0 "Escann is a beast unto itself, requiring complex economic theory. Thankfully, we are situated at the heart of that beast, best able to take it's pulse, and understand it's movements."
 CA_army_for_escann_title:0 "Army for Escann"
 CA_army_for_escann_desc:0 "An Army in Escann is but one pawn among many. We are knights, and knights stand for a cause. Our Army must emulate this, and fight not for mere survival's sake but for the sake of Escann itself, reforging itself to a form that can protect all."
 CA_army_of_escann_title:0 "Army of Escann"
 CA_army_of_escann_desc:0 "Our honor and military might are renowned, and all of Castan's former empire know of our skill at arms. We are an Army that does not simply fight for Escann, but represent this great land itself; shining, resplendent, and draped in chivalrous honor."
 CA_castellyrian_marriages_title:0 "Castellyrian Marriages"
 CA_castellyrian_marriages_desc:0 "Castellyr was once renowned for it's marriage networks. Our honor and prestige was such that many wished to join hands with us, and in turn this served to bind together Escann, promoting peace, stability, and cooperation. We will revive this ancient practice, and prove no less worthy a match than our forebears. \\n §YWe will gain the positives, and negatives, of our consort's trait.§!"
 CA_castellyrian_alliances_title:0 "Castellyrian Alliances"
 CA_castellyrian_alliances_desc:0 "WIP"
 CA_eastern_fortifications_title:0 "Eastern Fortifications"
 CA_eastern_fortifications_desc:0 "The eastern realm is no less in need of defense than the west. Historic and grand keep-gates will be rebuilt and redesigned into grand and modern fortress-citadels."
 CA_cot_orc_fate_title:0 "Fate of the Orcs"
 CA_cot_orc_fate_desc:0 "The time has come to determine the fate of the orcs within our reclaimed lands. Are they beasts of burden, monsters to be put down, or is there something redeemable about them?"
 CA_cot_slavery_fate_title:0 "The Slavery Debate"
 CA_cot_slavery_fate_desc:0 "Many argue that Slavery is a moral wrong. Some argue that there is justification for slavery that can be found among the gods. Still others argue that slavery itself is wrong, but the concept of the condemned being set to work off their debt to society is a sound principle, and a good way for the honorless to regain their honor. Which truth will take hold in Castellyr? Only time will tell."
 CA_cot_castellyr_honored_title:0 "Castellyr Honored"
 CA_cot_castellyr_honored_desc:0 "Castellyr is once more honored, the homeland cherished as it was in times of yore, the people peaceful, prosperous, and yet fierce also."
 CA_cot_choosing_religion_title:0 "Choosing Our Faith"
 CA_cot_choosing_religion_desc:0 "The Divisions on Halann have reached up into the Heavens. A most glorious and terrible holy conflict is brewing, and many look to Glorious Castellyr for example on which celestial host we must enjoin with."
 CA_cot_on_artificery_title:0 "On Artificery..."
 CA_cot_on_artificery_desc:0 "Some Gnomish adventurers that settled in our land have, in conjunction with the sil Varaines and the Pathfinders Guild approached us requesting grants to pursue the subject of artificery. This is a Gods-sent opportunity, as it allows for us to address not just their grant request but the subject of artificery, and by extension magic, at large within the Kingdom."
 CA_cot_our_purpose_title:0 "Our Purpose"
 CA_cot_our_purpose_desc:0 "At long last we arrive at our purpose - We survived, nay were reborn, in the fires of the Greentide, and ever since have been faced with choice after choice that has brought the Kingdom to here and now. With this depth of history, and the knowledge that comes with it, we declare:"

