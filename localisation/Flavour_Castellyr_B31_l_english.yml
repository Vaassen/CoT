 cot_B31_mix:0 "Mixed Magic and Artificery"

 #CoT Events
 flavor_castellyr.4.t:0 "The Fate of Orcs"
 flavor_castellyr.4.d:0 "It has come time to pass judgement."
 flavor_castellyr.4.a:0 "We cannot judge our own people for Korgus' crime!"
 flavor_castellyr.4.b:0 "They shall be judged by the lower courts!"
 flavor_castellyr.4.c:0 "Condemn them in the highest courts!"

 #Misc
 COT_CASTELLYRIAN_INDENTURED_SERVITUDE:0 "Indentured Servitude Act"
 COT_CASTELLYRIAN_INDENTURED_SERVITUDE_desc:0 "While slavery is officially banned, the debt owed to Casellyr by the Orc is eternal, and the Indentured Servitude Act ensures they pay that debt off in perpetuity."
 cot_castellyr_tall_tt:0 "So long as wel remain within the boundaries of the White Walls, our cherished homeland will be buffed."
 cot_b31_horc_tt:0 "By forgiving the Orcs you will become a half-orcish nation!"
