 deranne_seaflower_merchants.tt:0 "The Privilege §Y'Private Trade Fleets'§! is §Rdisabled§!\n\nEnables the §Y'D.T.C Merchant Fleets'§! privilege for the §YDeranne Trade Company§! which does the following:\n§YModifiers:§!\nGrants scaling modifiers depending on the D.T.C's §YCrown Land Ownership§!. At max this gives the following effects:\nTrade Efficiency: §G+25%§!\nSShip Trade Power: §G+50%§!\nCost to Promote Mercantilism: §G-25%§!\nNational Tax Modifier: §R-10%§!\n\nEnables the §Y'Merchants of the Seaflower'§! Government Reform\nGives the following effects:\n§YGovernment Mechanics:§!\nThe Estate Privilege §YIndebted to the Deranne Trade Company§! no longer reduces Mercantilism\n\n§YReform Modifiers:§!\nTrade Steering: §G+15%§!\nLight Ship Cost: §G-10%§!\nReasons to Transfer Trade Power: §G+50§!\nDeranne Trade Company Loyalty Equilibrium: §G+10%§!\nDeranne Trade Company Influence: §G+5%§!"
