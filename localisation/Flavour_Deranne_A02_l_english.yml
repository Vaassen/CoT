 #Missions
 deranne_vengeance_of_tomorrow_title:0 "Vengeance of Tomorrow"
 deranne_vengeance_of_tomorrow_desc:0 "“The Lilac Wars had ended. The Lorentish rose was victorious against their Damerian rivals, with the Silmunas slaughtered and a pretender put upon the Anbennarian throne. Yet, while the Síloriels celebrated their triumph, a people on the western shore sharpened their swords.”\n\n- From the famous Derannic tale “The Withered Roses”.\n\nThese are dark days for Lencenor. The moon party has lost and our allies in Dameria are gone, its capital sacked and the Silmunas slaughtered. Now, we linger in a precarious situation. As one of the last realms resisting Lorentish domination, it will not be long before the Lorentish recover from the destruction caused by the Lilac Wars and set out to enforce our loyalty.\n\nWe cannot allow this to happen. We must use the shattered state of Lencenor to our advantage and pick up the pieces. Our first obstacle will be right outside our eastern border; the Ordings. Ever since Derhilde set foot upon Lencori soil and destroyed the horseriders, they have limped on in a pitiful state, reminiscing about grander days. It is time we put them out of their misery once and for all."
 deranne_the_final_swing_title:0 "The Final Swing"
 deranne_the_final_swing_desc:0 "With the Ordings once again subjugated beneath Derannic rule, we may set our sights on our true goal: The fall of Lorentainé. The final confrontation is soon upon us, and if fate wills it, we will avenge the fallen and topple the Lorentish tyranny. Yet while our will is strong and our armies lust for vengeance, we must not rush in like fools.The Lorentish, while weakened, are still powerful. Their lands are vast, their allies strong, and while inferior to our Seaflower Knights, the Knights of the Rose are renowned across Cannor.\n\nThankfully, the Siloriels have many enemies, both within and outside their realm. A grand coalition should be formed, one powerful enough to cast down the Lorentish hegemony and usher in a new age for the Lencori. The final swing of honor is upon us, and it will shear off the heads of tyrants who have had it long coming."
 deranne_docks_of_westport_title:0 "The Docks of Westport"
 deranne_a_withered_rose_title:0 "A Withered Rose"
 deranne_a_withered_rose_desc:0 "Long ago, towards the end of the 14th century, Lorentish armies disgracefully marched upon Deranne and laid waste to countless villages, pillaging the countryside and leaving our realm as a land of smoke and fire. Now, we will finally have our vengeance, for it is done. The Lorentish rose wilts as our armies march upon the city of Lorentainé, ready to deliver justice to those who have for so long managed to avoid it. The time of retribution is here, and the tyrants of the High Lorentish will feel our wrath."
