 war_khet_reform_desc:0 "REPLACE_ME"
 war_khet_reform_tooltip:0 "\n§WReplace §YDecree of Knowledge§! with §YDecree of Destruction§!, giving the following effects:\n§G+50%§! Siege Ability\n\nReplace §YDecree of Defiance§! with §YDecree of Annihilation§!, giving the following effects:\nFor the duration of the edict, any enemy you declare war on has their leader and heir §Rkilled§!, and gains a §Rweak§! new leader.§!"
 
