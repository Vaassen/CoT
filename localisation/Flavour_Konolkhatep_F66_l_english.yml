 medasi_enlightening_halann_reform_desc:0 "REPLACE_ME"
 medasi_enlightening_halann_reform_tooltip:0 "\n§WOur §YMedasi§! will gain the following modifier:\n  Manpower in Accepted Cultures provinces: §G+10.0%§!\n\nOur §YMedasi§! will accept every §YKheteratan§! culture for §Gfree§!. The §YMedasi conversion events§! will sometimes convert their §YKhetist§! provinces to a random §YKheteratan§! culture.§!"
