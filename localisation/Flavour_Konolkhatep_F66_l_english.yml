 flavor_konolkhatep.6.b:0 "A new crown!"

 flavor_konolkhatep.7.t:0 "The Gifters"
 flavor_konolkhatep.7.d:0 "Some fluff about the Koggs"
 flavor_konolkhatep.7.a:0 "They will be absorbed."
 flavor_konolkhatep.7.b:0 "A new crown!"


 flavor_konolkhatep.8.t:0 "The Mother or the Son"
 flavor_konolkhatep.8.d:0 "Our rule over the lands of Kheterata is almost unquestioned; we have the full support of the godlike beings known as the Khet and gnollish armies march the length and breadth of the Sorrow.\n\nThough we hold the blessing of the Khet to rule, the religious politics of the humans we rule over are somewhat more complex. Though all worship the Khet, there are two major factions within the Khetist faith. If we are to legitimise our rule in the eyes of our human subjects, we should choose one of these factions to support.\n\nThe Elikhetist faithful are the most established within the Kheteratan heartland and among the urban elite. Adopting Elikhetism would ensure our popularity among the nobility in the capital, but given its more orthodox nature they may not respect us as outsiders.\n\nOn the other hand the Nirakhetist faith is popular among the lower classes and among the province's on the edge of Kheterata. Championing Nirakhetism may legitimise our rule and give us a way to gain popular support, but may also cause unrest in the heartlands."
 flavor_konolkhatep.8.a:0 "Elikhet reigns supreme"
 flavor_konolkhatep.8.b:0 "Mother Nirakhet will guide us"



 flavor_konolkhatep.9.t:0 "Brrtekuh the Splitter"
 flavor_konolkhatep.9.d:0 "Some fluff about Brrtekuh and the Windhowler Gnolls. Also mention the other windhowler tribes"
 flavor_konolkhatep.9.a:0 "They will be absorbed."
 flavor_konolkhatep.9.b:0 "A new crown!"

 flavor_konolkhatep.10.t:0 "Irkorzik the Wind"
 flavor_konolkhatep.10.d:0 "Some fluff about Irkorzik and fangaula"
 flavor_konolkhatep.10.a:0 "They will be absorbed."
 flavor_konolkhatep.10.b:0 "A new crown!"

 flavor_konolkhatep.11.t:0 "Rozherg the Hammer"
 flavor_konolkhatep.11.d:0 "Some fluff about Rozherg and the religion. Throw away the actual hammer"
 flavor_konolkhatep.11.a:0 "They will be absorbed."
 flavor_konolkhatep.11.b:0 "A new crown!"

 flavor_konolkhatep.12.t:0 "Rise of the Sorrowmanes"
 flavor_konolkhatep.12.d:0 "A new gnoll culture has risen from the melding of kheteratan/khetist and gnolls."
 flavor_konolkhatep.12.a:0 "A new era approaches"
 flavor_konolkhatep.12.tooltip:0 "Unlock the §YOne Pack§! steward reform"

 flavor_konolkhatep.13.t:0 "Ozyl the Seeker"
 flavor_konolkhatep.13.d:0 "Some fluff about Tzilekal, genies, and planetouched"
 flavor_konolkhatep.13.a:0 "They will be absorbed."
 flavor_konolkhatep.13.b:0 "A new crown!"

 flavor_konolkhatep.14.t:0 "Gnolls in the Ahati"
 flavor_konolkhatep.14.d:0 "After seeing how ungnollish we're being and actually being good to kheterata, the ahati have agreed to cooperate more with the gnolls which is signified by letting gnolls become ahati merchants"
 flavor_konolkhatep.14.a:0 "A great step forward"
 flavor_konolkhatep.14.tooltip:0 "The §YState Merchants§! Ahati privilege will no longer have a loyalty penalty and provides an additional §Ymerchant§!.\nThe §YKhet Guardians§! Ahati privilege will no longer have a loyalty penalty"

 flavor_konolkhatep.15.t:0 "Voice of Elikhet"
 flavor_konolkhatep.15.d:0 "cool fluff about horutep basically being Elikhet's prophet now."
 flavor_konolkhatep.15.a:0 "something"
 konolkhatep_voice_of_elikhet_event_tt:0 "Every owned or subject owned provinces in the §YKheterata§! and §YGol§! regions gain §G-25%§! autonomy."
 konolkhatep_voice_of_elikhet_event_2_tt:0 "The §YWords of Horutep§! reform will also be available for our §YMedasi§! subjects."
 
 flavor_konolkhatep.16.t:0 "An Eternal Empire"
 flavor_konolkhatep.16.d:0 "kheterata is cool and stuff, but many of the ancient practices can be "improved" and with Horutep at the lead everything is possible"
 flavor_konolkhatep.16.a:0 "something"
 konolkhatep_eternal_empire_tt:0 "Unlock the §YLessons of Horutep§! and §YLegions of Kheterata§! Steward Reforms. Disable the §YEnlighten the Future§! and §YTaste of Magic§! Reforms. If we already passed them, we will be refunded §Y80§! Mandate."

 flavor_konolkhatep.17.t:0 "Kult Ender"
 flavor_konolkhatep.17.d:0 "cool fluff about horutep destroying the remnants of the xhazobkult"
 flavor_konolkhatep.17.a:0 "something"
 konolkhatep_kult_ender_tt:0 "Every remaining §YXhazobkult§! province in Halann will be converted to §YKvangahga§!"

 flavor_konolkhatep.18.t:0 "The Gnoll and the Dragon"
 flavor_konolkhatep.18.d:0 "Horutep and Aakhet meet and have a chill talk and end up as bros"
 flavor_konolkhatep.18.a:0 "something"
 konolkhatep_throne_hills_tt:0 "Release §YXanzerbexis§! as a §YMedasi§!, and become Historical Friends with them. They will get every province in §YBusinor§! owned by us or our subjects. Up to 4 provinces in Businor will convert to §YHillthrone Gnoll§! culture."

 flavor_konolkhatep.19.t:0 "Horutep Marches"
 flavor_konolkhatep.19.d:0 "he's gonna kill lots of dudes"
 flavor_konolkhatep.19.a:0 "something"

 flavor_konolkhatep.20.t:0 "A Throne in the Hills"
 flavor_konolkhatep.20.d:0 "some fluff about the hillthrone gnolls"
 flavor_konolkhatep.20.a:0 "release them as Medasi"
 flavor_konolkhatep.20.b:0 "+stab"
 flavor_konolkhatep.20.d:0 "if you were Xanberxis:+stab and mandate"

 flavor_konolkhatep.21.t:0 "Divine Restorer of the Ancient Tree"
 flavor_konolkhatep.21.d:0 "horutep purified the tree and destroyed the darkness yay"
 flavor_konolkhatep.21.a:0 "something"

 flavor_konolkhatep.22.t:0 "The Gilded Mask"
 flavor_konolkhatep.22.d:0 "with gold, magic, and genie mumbo jumbo you've created a legendary artifact that resembles Elikhet's golden mask"
 flavor_konolkhatep.22.a:0 "something"

 flavor_konolkhatep.23.t:0 "The Mother's Change"
 flavor_konolkhatep.23.d:0 "make a magic sceptre with damestear to symbolize nirat's power over life and death"
 flavor_konolkhatep.23.a:0 "something"
 konolkhatep_mothers_change_tt:0 "Horutep becomes §sRenowned§! in §YEvocation§! and §YAbjuration§! if he's is not already."

 flavor_konolkhatep.24.t:0 "The Black Chains"
 flavor_konolkhatep.24.d:0 "the only troubling thing to put in chains are mages, fortunately the Oni have already found a solution we can "borrow"."
 flavor_konolkhatep.24.a:0 "something"

 flavor_konolkhatep.25.t:0 "The Planewalker"
 flavor_konolkhatep.25.d:0 "with all his artifacts and genie relics, horutep has mastered the ability to harness the planes' energies"
 flavor_konolkhatep.25.a:0 "something"
 konolkhatep_the_planewalker_tt:0 "Unlock the ability to switch Horutep's §YPlanetouched§! personality to §Gany§! element at will. To do that, click on the §YHorutep Title§! button inside the Government Mechanic UI."

 flavor_konolkhatep.26.t:0 "Banisher of the False Gods"
 flavor_konolkhatep.26.d:0 "good bye cannor faiths"
 flavor_konolkhatep.26.a:0 "something"

 flavor_konolkhatep.27.t:0 "Ascension"
 flavor_konolkhatep.27.d:0 "horutep is basically god now"
 flavor_konolkhatep.27.a:0 "end game"
 flavor_konolkhatep.27.b:0 "continue game"
 konolkhatep_ascension_tt_1:0 "§OWhen chosing this option, we will immediatly end the game.§!"
 konolkhatep_ascension_tt_2:0 "§OWhen chosing this option, we will be able to continue the game.§!"
 
 #Title events
 flavor_konolkhatep.28.t:0 "The Starcaller"
 flavor_konolkhatep.28.d:0 ""
 flavor_konolkhatep.28.a:0 "something"
 konolkhatep_event_starcaller_tt:0 "The §YDamestear§! deposits in §Y[starcaller_target_1.GetName]§!, §Y[starcaller_target_2.GetName]§! and §Y[starcaller_target_3.GetName]§! will be §Gpermanent§!.\n\n§GDisable§! the '§YComet Sighted§!' event for §Y[Root.GetName]§!."

 flavor_konolkhatep.29.t:0 "Lord of Light"
 flavor_konolkhatep.29.d:0 ""
 flavor_konolkhatep.29.a:0 "something"
 konolkhatep_event_lord_of_light_tt:0 "Every §YBulwari§! religion province in §YBulwar§! has a §Y50%§! of converting to §Y[Root.Religion.GetName]§!.\n\nOur subjects with provinces in §YBulwar§! will also convert to §Y[Root.Religion.GetName]§! if their §YReligious Unity§! is too low."

 flavor_konolkhatep.30.t:0 "Icelord"
 flavor_konolkhatep.30.d:0 ""
 flavor_konolkhatep.30.a:0 "something"
 konolkhatep_event_icelord_tt:0 "Every owned or subject owned province with §YWinter§! climate will gain a §GLocal Governing Cost§! bonus depending on winter severity. Our future conquests will also gain these effects."

 flavor_konolkhatep.31.t:0 "Guider of Storms"
 flavor_konolkhatep.31.d:0 ""
 flavor_konolkhatep.31.a:0 "something"
 konolkhatep_event_guider_of_storms_tt:0 "Every owned or subject owned province with §YMonsoon§! climate will gain a §GLocal Development Cost§! bonus depending on monsoon severity. Our future conquests will also gain these effects."

 flavor_konolkhatep.32.t:0 "Emperor of Gnollkind"
 flavor_konolkhatep.32.d:0 ""
 flavor_konolkhatep.32.a:0 "something"
 konolkhatep_event_emperor_of_gnollkind_tt:0 "Every §YGnollish§! province in §YSarhal§! loses §Gall§! Devastation and §Gall§! Local Autonomy.\n\nThey also get '§YRuled by the Emperor of Gnollkind§!' for §Y50§! years, giving the following modifier:\n§G-5§! Unrest"

 flavor_konolkhatep.33.t:0 "Destined Sovereign of Scales"
 flavor_konolkhatep.33.d:0 ""
 flavor_konolkhatep.33.a:0 "something"
 konolkhatep_event_sovereign_of_scales_tt:0 "Every §YLizardfolk§! country will gain §GHistorical Friendship§! with us."

 flavor_konolkhatep.34.t:0 "High Mage of the Tower"
 flavor_konolkhatep.34.d:0 ""
 flavor_konolkhatep.34.a:0 "something"

 flavor_konolkhatep.35.t:0 "Warden of the Pyramid"
 flavor_konolkhatep.35.d:0 ""
 flavor_konolkhatep.35.a:0 "something"
 konolkhatep_event_warden_of_the_pyramid_tt:0 "Every province in §YKheterata§! gains §G+1§! Tax."

 flavor_konolkhatep.36.t:0 "Keeper of all Lore"
 flavor_konolkhatep.36.d:0 ""
 flavor_konolkhatep.36.a:0 "something"
 konolkhatep_event_keeper_of_all_lore_tt:0 "We will gain §G+10%§! Magic Study Speed."

 flavor_konolkhatep.37.t:0 "Grand Commander of the Ahati"
 flavor_konolkhatep.37.d:0 ""
 flavor_konolkhatep.37.a:0 "something"

 flavor_konolkhatep.38.t:0 "Patriarch of the Khet"
 flavor_konolkhatep.38.d:0 ""
 flavor_konolkhatep.38.a:0 "something"
 konolkhatep_event_patriarch_of_the_khet_tt:0 "Each time a new §YKhetarch§! appears, we will gain an additionnal §G30§! §YHedonism§!."

 flavor_konolkhatep.39.t:0 "Grand Banisher of Darkness"
 flavor_konolkhatep.39.d:0 ""
 flavor_konolkhatep.39.a:0 "something"
 konolkhatep_event_grand_banisher_of_darkness_tt:0 "If they exist, §Y[A59.GetName]§! and §Y[A60.GetName]§! lose access to the §YVampire§! estate.\n\n§GRemove§! every §YVampire Adventurer's Wanted§! modifier and §Gpermanently disable§! them for us and our subjects."

 flavor_konolkhatep.40.t:0 "Master of Rivers"
 flavor_konolkhatep.40.d:0 ""
 flavor_konolkhatep.40.a:0 "something"
 konolkhatep_event_grand_master_of_rivers_tt:0 "Every owned or subject owned province with an §YEstuary§! will gain an additionnal §G+10§! Trade Value. Our future conquests will also gain these effects."

 flavor_konolkhatep.41.t:0 "King of Kings"
 flavor_konolkhatep.41.d:0 ""
 flavor_konolkhatep.41.a:0 "something"
 konolkhatep_event_king_of_kings_tt:0 "Every country in a continent that §Y[F66.GetName]§! or one of their subject has any province in loses §Y100§! Legitimacy."

 flavor_konolkhatep.42.t:0 "The King of Games"
 flavor_konolkhatep.42.d:0 ""
 flavor_konolkhatep.42.a:0 "something"
 konolkhatep_event_king_of_games_tt:0 "The §YGame of Khet§! invention will no longer costs §YArtificer Capacity§!."

 flavor_konolkhatep.43.t:0 "Undisputed Monarch of the Seas"
 flavor_konolkhatep.43.d:0 ""
 flavor_konolkhatep.43.a:0 "something"

 flavor_konolkhatep.44.t:0 "Master of all Warfare"
 flavor_konolkhatep.44.d:0 ""
 flavor_konolkhatep.44.a:0 "something"

 flavor_konolkhatep.45.t:0 "Renowned Architect of the Dunes"
 flavor_konolkhatep.45.d:0 ""
 flavor_konolkhatep.45.a:0 "something"
 konolkhatep_event_reknowned_architect_of_the_dunes_tt:0 "We will get back more §YSlaves§! upon finishing a §YSlave Project§!."

 flavor_konolkhatep.46.t:0 "Carver of Ways"
 flavor_konolkhatep.46.d:0 ""
 flavor_konolkhatep.46.a:0 "something"
 konolkhatep_event_reknowned_carver_of_ways_tt:0 "Every §YRoad Slave Project§! will be upgraded to gain an additionnal §G+10% Local Trade Power."

 flavor_konolkhatep.47.t:0 "Holy Deacon of the Sands"
 flavor_konolkhatep.47.d:0 ""
 flavor_konolkhatep.47.a:0 "something"

 flavor_konolkhatep.48.t:0 "Breaker of Giants"
 flavor_konolkhatep.48.d:0 ""
 flavor_konolkhatep.48.a:0 "something"
 konolkhatep_event_breaker_of_giants_1_tt:0 "Every former Empire of Anbennar members will become our §YSatrapies§!"
 konolkhatep_event_breaker_of_giants_2_tt:0 "Every country with their capital in the §YDamescrown§!, §YWest Dameshead§!, §YEast Dameshead§!, §YEsmaria§! and §YThe Borders§! regions will become our §YSatrapies§!"

 flavor_konolkhatep.49.t:0 "Scourge of the Faithless"
 flavor_konolkhatep.49.d:0 ""
 flavor_konolkhatep.49.a:0 "something"
 konolkhatep_event_scourge_of_the_faithless_tt:0 "Every §YWuhyun§! province in §YHaless§! is converted to §Y[Root.Religion.GetName]§! and to a random §YKheteratan§! culture.\n\nGain §G10§! Hobgoblin Minorities in §YKheterata§!"

 flavor_konolkhatep.50.t:0 "Seneschal of the Ruined Lands"
 flavor_konolkhatep.50.d:0 ""
 flavor_konolkhatep.50.a:0 "something"
 konolkhatep_event_seneschal_of_the_ruined_lands_tt:0 "Our Colonial Nations will gain a permanent §G-25%§! Core Creation Cost and §G+20§! Global Colonial Growth"

 flavor_konolkhatep.51.t:0 "Eternal Master of the Arcane"
 flavor_konolkhatep.51.d:0 ""
 flavor_konolkhatep.51.a:0 "something"
 konolkhatep_event_eternal_master_of_the_arcane_lands_tt:0 "§THalann magic is now fully in the hands of Horutep [Root.HorutepGetCurrentTitles].§!\n\nAs of now, §Y[Root.GetName]§! and our subjects are the only countries that will be able to wield §Truler magic§!.\n\nEvery other §YPowerful Mage§! in Halann will lose their powers, §Rkilling§! all §YLiches§! in the process, and there can no longer be §YPowerful Mage§! except for us and our subjects.\nHaving lost their purpose, §YMagocracies§! will forcefully be turned into §YMonarchies§! and any §YMagocratic§! governement will definitely be disabled.\n"

 flavor_konolkhatep.52.t:0 "Arch Lord of the Abyssal Depths"
 flavor_konolkhatep.52.d:0 ""
 flavor_konolkhatep.52.a:0 "something"
 konolkhatep_event_arch_lord_of_the_abyssal_depths_lands_tt:0 "Merfolk will §Gno longer§! lose Opinion of us.\n\nGain §G2§! of each Development in every province with a §YMerfolk Settlement§!"

 #Disaster events
 flavor_konolkhatep.100.t:0 "Victories across the Sands"
 flavor_konolkhatep.100.d:0 "Initial conquests are going well, we're very cool. Some gnolls are still clinging to old ways but nothing we can't handle"
 flavor_konolkhatep.100.a:0 "cool"

 flavor_konolkhatep.101.t:0 "Voices in the Dark"
 flavor_konolkhatep.101.d:0 "Many gnolls now follow khetist but there are whispers of hidden cults still practicing the old ways"
 flavor_konolkhatep.101.a:0 "y u do this"

 flavor_konolkhatep.102.t:0 "Darkness Closes in"
 flavor_konolkhatep.102.d:0 "there have been rebellions all around, the cults are taking action."
 flavor_konolkhatep.102.a:0 "oh no"

 flavor_konolkhatep.103.t:0 "Flickering Lights"
 flavor_konolkhatep.103.d:0 "Zinhakan PoV. the gnolls are gathering in akasik in preparation for the ritual"
 flavor_konolkhatep.103.a:0 "something"

 flavor_konolkhatep.104.t:0 "Agonized Screams"
 flavor_konolkhatep.104.d:0 "Zinhakan PoV. the sacrifices are being gathered"
 flavor_konolkhatep.104.a:0 "something"
 
 flavor_konolkhatep.105.t:0 "Dark Flames"
 flavor_konolkhatep.105.d:0 "Zinhakan PoV. the ritual begins and succeeds, zinhakan offers more than the usual gnolls do which is why she became a xhazobaine without the ingame 10 years stuff"
 flavor_konolkhatep.105.a:0 "something"
 
 flavor_konolkhatep.106.t:0 "Bane of Kings"
 flavor_konolkhatep.106.d:0 "back to Konol PoV from now on. this is the event you get when the disaster actually starts. this event spawns the zinhakan tag"
 flavor_konolkhatep.106.a:0 "oh no"
 
 flavor_konolkhatep.108.t:0 "March on Akasik"
 flavor_konolkhatep.108.d:0 "zinhakan takes over all of akasik"
 flavor_konolkhatep.108.a:0 "oh no"
 
 flavor_konolkhatep.109.t:0 "The Waters are Unsafe"
 flavor_konolkhatep.109.d:0 "Zinhakan and her followers are mainly seascourge gnolls, so they raid your coasts to spite you"
 flavor_konolkhatep.109.a:0 "oh no x2"
 
 flavor_konolkhatep.110.t:0 "Howling at the Wind"
 flavor_konolkhatep.110.d:0 "zinhakan goes south to the Western Salahad and "convinces" the gnolls there to join"
 flavor_konolkhatep.110.a:0 "oh no x3"
 
 flavor_konolkhatep.111.t:0 "Lost Scraps"
 flavor_konolkhatep.111.d:0 "taking advantage of the chaos, some kvangahga zealots are attempting their own rebellion. its small though"
 flavor_konolkhatep.111.a:0 "oh no"
 
 flavor_konolkhatep.112.t:0 "The Demon Comes"
 flavor_konolkhatep.112.d:0 "zinhakan declared war on you because she thinks you suck"
 flavor_konolkhatep.112.a:0 "oh no x48123"
 flavor_konolkhatep.112.b:0 "play as demon gnoll lady"
 flavor_konolkhatep.112.tooltip:0 "We must §Rhold out§! against the demonic onslaught. Losing §Ycontrol of Kheterat§! for more than a §Yyear§! will §Rspell our own destruction§!."
 
 flavor_konolkhatep.113.t:0 "Scourge of the Seas"
 flavor_konolkhatep.113.d:0 "lol remember when you called yourself Scourge of the Seas? no, no you're not. Zinhakan launches a surprise attack on Shasoura"
 flavor_konolkhatep.113.a:0 "oh shit"

 flavor_konolkhatep.114.t:0 "To the World's Ending"
 flavor_konolkhatep.114.d:0 "idk your ruler thinks they're Theoden or something."
 flavor_konolkhatep.114.a:0 "cool"

 flavor_konolkhatep.115.t:0 "There is no Hope"
 flavor_konolkhatep.115.d:0 "nvm Zinhakan and her forces kicked your ass really quickly. She also turned your corpse into a demonfire bomb and catapulted it onto the palace. a distant relation that wasn't in the palace becomes ruler"
 flavor_konolkhatep.115.a:0 "this is fine"

 flavor_konolkhatep.116.t:0 "Into the Tomb"
 flavor_konolkhatep.116.d:0 "Neverkaar decides to go into the tomb and try to get Elikhet to help because otherwise everything will be dead. people panic because they're basically leaderless"
 flavor_konolkhatep.116.a:0 "very smart"

 flavor_konolkhatep.117.t:0 "Ashes and Embers"
 flavor_konolkhatep.117.d:0 "Zinhakan meanwhile has been busy wrecking stuff"
 flavor_konolkhatep.117.a:0 "oh no"

 flavor_konolkhatep.118.t:0 "Death around every Corner"
 flavor_konolkhatep.118.d:0 "this pyramid has a lot of traps oh no"
 flavor_konolkhatep.118.a:0 "am I a...tomb raider?"

 flavor_konolkhatep.119.t:0 "Tomb of the Creator"
 flavor_konolkhatep.119.d:0 "you reached the actual tomb, good job. Now start trying to wake up Elikhet"
 flavor_konolkhatep.119.a:0 "elikhetist option"
 flavor_konolkhatep.119.b:0 "nirakhetist option"

 flavor_konolkhatep.120.t:0 "An Audience with God"
 flavor_konolkhatep.120.d:0 "he's awake and nearly zapped your head off. queue lore talks"
 flavor_konolkhatep.120.a:0 "elikhetist option"
 flavor_konolkhatep.120.b:0 "nirakhetist option"

 flavor_konolkhatep.121.t:0 "In His Footsteps"
 flavor_konolkhatep.121.d:0 "He tells you how to become immortal and gives you massive powers"
 flavor_konolkhatep.121.a:0 "elikhetist option"
 flavor_konolkhatep.121.b:0 "nirakhetist option"

 flavor_konolkhatep.122.t:0 "Horutep the Reborn"
 flavor_konolkhatep.122.d:0 "No more Neverkaar, now you're horutep"
 flavor_konolkhatep.122.a:0 "its horutepping time"

 flavor_konolkhatep.123.t:0 "A Light Against the Darkness"
 flavor_konolkhatep.123.d:0 "You're basically using console commands to win now."
 flavor_konolkhatep.123.a:0 "and he horutepped all over"

 flavor_konolkhatep.124.t:0 "They will know"
 flavor_konolkhatep.124.d:0 "the xhaz gnolls are panicking now because well, you know. (gives modifier called Fear)"
 flavor_konolkhatep.124.a:0 "seems like the shoe is on the other foot"
 flavor_konolkhatep.124.tooltip:0 "Reinforcements will no longer spawn for §YZinhakan§!"

 flavor_konolkhatep.125.t:0 "Words of Banishment"
 flavor_konolkhatep.125.d:0 "kheterata region converts back to your religion, you get a buff so you can win more easily"
 flavor_konolkhatep.125.a:0 "cool"

