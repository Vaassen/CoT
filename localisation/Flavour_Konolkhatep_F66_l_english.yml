 #Tooltip Horutep Titles
 konolkhatep_horutep_unlocked_tt:0 "We are ruled by Emperor Horutep the Reborn, Guardian of the Sorrow[Root.HorutepGetLivingGod][Root.HorutepGetSlayerDemons][Root.HorutepGetKingOfKings][Root.HorutepGetVoiceElikhet][Root.HorutepGetEmperorGnollkind][Root.HorutepGetWardenPyramid][Root.HorutepGetKultEnder][Root.HorutepGetStarcaller][Root.HorutepGetCommanderAhati][Root.HorutepGetLordLight][Root.HorutepGetDivineMask][Root.HorutepGetGeneralLegions][Root.HorutepGetGuiderStorms][Root.HorutepGetMageTower][Root.HorutepGetMasterWarfare][Root.HorutepGetBreakerGiants][Root.HorutepGetRestorerTree][Root.HorutepGetIcelord][Root.HorutepGetKeeperLore][Root.HorutepGetHoldsSceptre][Root.HorutepGetDeaconSands][Root.HorutepGetMasterArcane][Root.HorutepGetSeneschalLands][Root.HorutepGetBanisherGods][Root.HorutepGetCompanionDragon][Root.HorutepGetLordDepths][Root.HorutepGetPatriarchKhet][Root.HorutepGetArchitectDunes][Root.HorutepGetMasterRivers][Root.HorutepGetScourgeFaithless][Root.HorutepGetCarverWays][Root.HorutepGetWielderChains][Root.HorutepGetPlanewalker][Root.HorutepGetKingGames][Root.HorutepGetSovereignScales][Root.HorutepGetBanisherDarkness][Root.HorutepGetMonarchSeas].\n\nFor him to get new titles, Horutep shall:\n[Root.HorutepTriggerLivingGod] Ascend\n[Root.HorutepTriggerSlayerDemons] Kill an otherworldly Foe\n[Root.HorutepTriggerKingOfKings] Have countless subjects\n[Root.HorutepTriggerVoiceElikhet] Become Elikhet's Prophet\n[Root.HorutepTriggerEmperorGnollkind] Rule over all Gnolls\n[Root.HorutepTriggerWardenPyramid] Build a Pyramid for Elikhet\n[Root.HorutepTriggerKultEnder] End the Demons Kult\n[Root.HorutepTriggerStarcaller] Master Conjuration and Artificery to Peruse the Skies\n[Root.HorutepTriggerCommanderAhati] Build an Academy for the Ahati\n[Root.HorutepTriggerLordLight] Rule over all the Garden Lands\n[Root.HorutepTriggerDivineMask] Craft the Mask of a God\n[Root.HorutepTriggerGeneralLegions] March forth with your Legions\n[Root.HorutepTriggerGuiderStorms] Rule over the Lands of Rains\n[Root.HorutepTriggerMageTower] Build a peerless Tower\n[Root.HorutepTriggerMasterWarfare] Field a neverending Army\n[Root.HorutepTriggerBreakerGiants] Subjugate Cannorian Empires\n[Root.HorutepTriggerRestorerTree] Restore the Tree\n[Root.HorutepTriggerIcelord] Rule over the Lands of Snow\n[Root.HorutepTriggerKeeperLore] Build an influential Library\n[Root.HorutepTriggerHoldsSceptre] Craft the Sceptre of a Godess\n[Root.HorutepTriggerDeaconSands] Convert Sarhal to your Faith\n[Root.HorutepTriggerMasterArcane] Master Magic, and More\n[Root.HorutepTriggerSeneschalLands] Rule over the Lands across the Lament\n[Root.HorutepTriggerBanisherGods] Destroy the False Pantheons\n[Root.HorutepTriggerCompanionDragon] Befriend a Dragon\n[Root.HorutepTriggerLordDepths] Rule over the Merfolk\n[Root.HorutepTriggerPatriarchKhet] Build a Statue of Niramit\n[Root.HorutepTriggerArchitectDunes] Build Projects across your Lands\n[Root.HorutepTriggerMasterRivers] Rule over the Lands of Rivers\n[Root.HorutepTriggerScourgeFaithless] Subjugate the Almighty Unbelievers\n[Root.HorutepTriggerCarverWays] Build Roads across your Lands\n[Root.HorutepTriggerWielderChains] Craft Korashi Chains\n[Root.HorutepTriggerPlanewalker] Walk across Planes\n[Root.HorutepTriggerKingGames] Discover a Game\n[Root.HorutepTriggerSovereignScales] Rule over the Lizard Lands\n[Root.HorutepTriggerBanisherDarkness] Subjugate the Blood Drinkers\n[Root.HorutepTriggerMonarchSeas] Rule over the Seas."
