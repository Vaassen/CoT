 luxuries_depths_reform_desc:0 "REPLACE_ME"
 luxuries_depths_reform_tooltip:0 "\n§WEmperor gets:\n  Every owned coastal province in §YSarhal§! gains:\n    Local Trade Value: §G+10.0%§!\n\nAll members except the Emperor gets:\n  Every owned coastal province in §YSarhal§! gains:\n    Local Trade Value: §G+10.0%§!\n\nCreate a §YMerfolk Settlement§! in §Y[402.GetName]§! and §Y[5813.GetName]§!.§!"
