 ability_konolkhatep_mechanic: "Slavery Mechanic"
 konolkhatep_slaves: "Slaves"
 konolkhatep_slaves_desc: "\n§YSlaves§! are gained by the following:\n§G+10§! from trading in §YSlaves§!\n§G+10§! from every Golden House edict of enslavement\n§G+2.5§! from slave ports\n§G+2.5§! from Strapies with 250 development\n§G+5§! from Strapies with 500 development\n§G+1§! to §G+4§! from coastal riding per province raided\n§G+25%§! of an enemy's development (max: §Y100§!) when using the §YTake Slaves§! peace option"
 konolkhatep_slaves_gain_modifier: "Slaves Modifier"
 monthly_konolkhatep_slaves: "Monthly Slaves"
 konolkhatep_medasi_locked_tt:0 "We will unlock this mechanic with the §YExpand the Medasi System§! mission."
 konolkhatep_medasi_unlocked_tt:0 "Our Medasi get unique renames and gain the §YGnoll Medasi§! government reform.\n\nOur Satrapies need to have §Y150§! development before we can turn them into Medasi, and the §YMandate§! growth we get from our Medasi will be reduced.\n\nThe number of §YMedasi§! subjects we can have is equal to the number of §YStewardship Reforms§! we passed.\nCurrent number of Medasi: §Y[Root.num_medasi.GetValue]§!\nMax number of Medasi: §Y[Root.num_china_reform.GetValue]§!\n\nYou can click this button to §Yrefresh§! these numbers if you think they are broken."
 konolkhatep_legions_locked_tt:0 "We will unlock this mechanic with the §YLegions of Kheterata§! Stewardship Reform."
 konolkhatep_legions_unlocked_tt:0 "We can unlock §Y5§! powerful Legions. They are §YElite Mercenaries§! that, when they are not fielded, are integrated into our main army, giving us country-wide §Ymilitary modifiers§!.\n\nEach Legion costs §Y50 000§!£icon_manpower£, §Y1000§!¤ and §Y100§! Slaves.\n"
 konolkhatep_governors_locked_tt:0 "We will unlock this mechanic when we finish the §YHouse of Golden Chains§! Slave Project. It will allow us to pass powerfull §YSlave Edicts§!."
 konolkhatep_governors_unlocked_tt:0 "Each superregion in Halcann outside §YNorth Salahad§! where we own at least §Y30§! provinces, directly or with subjects, will gain access to 4 §YSlave Edicts§!.\n\nEach superregion can have only §Y1§! active Edict, giving a bonus to every province we or our subjects own in that superregion.\n\n§YEdict of Enslavement§!:\n  §R+3§! Unrest\n  Konolkhatep gains §G+10§! Monthly Slaves (cumulative for every Edict of Enslavement)\n\n§YEdict of Assimilation§!:\n  §G-25%§! Culture Conversion Time\n  Provinces that get converted to §YSorrowmane Gnoll§! or any §YKheteratan§! culture will receive §G1§! random Development\n\n§YEdict of Integration§!:\n  §G-25%§! Core-Creation Cost\n  §G-25%§! Governing Cost\n\n§YEdict of Service§!:\n  §G+10%§! Manpower\n  §G+25%§! Garrison Size\n\nEach Edict costs §Y50§! Slaves and 100£adm£.\n\nIf we §Yconquer§! or §Ysubjugate§! new provinces in a superregion where we have an active Edict, we will need to §Yapply the Edict again§! for it to include those new provinces.\n"
 konolkhatep_projects_unlocked_tt:0 "We will be able to build §YSlave Projects§! across our empire. Every Project costs us many Slaves and will bring us unforetold prosperity.\n"
