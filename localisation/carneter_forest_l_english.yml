l_english:
 carneter_grove_base:0 "Royal Grove"
 desc_carneter_grove_base:0 "A nearby settlement of Druids operates this holy place."
 carneter_grove_communion:0 "Grove of the Spirit Court"
 desc_carneter_grove_communion:0 "This grove is a recognised meeting place for woodland creatures, as well as spirits."
 carneter_sanctuary_base:0 "Royal Wildlife Sanctuary"
 desc_carneter_sanctuary_base:0 "Protected breeding grounds and an agreed upon hunting season maintains the local population of wildlife."
 carneter_sanctuary_breeding:0 "Protected Breeding Grounds"
 desc_carneter_sanctuary_breeding:0 "Wardens and naturalists protect breeding grounds while guiding the use of local resources."
 carneter_sanctuary_living:0 "A Living Deruwren"
 desc_carneter_sanctuary_living:0 "The sanctuary here is merged with the military and local economy to bolster both."
 carneter_unified_court:0 "A Single Carnetori Court"
 desc_carneter_unified_court:0 "No more shall the people of Carnetor squabble and infight."
 carneter_old_borders:0 "Heirs of the Old Realm"
 desc_carneter_old_borders:0 "The recovery of the full old realm means none can deny our claim!"
 carneter_kingdom:0 "A Kingdom of Our Own"
 desc_carneter_kingdom:0 "We have the most robust set of institutions of any of the former Carnetori states."
 carneter_college_network:0 "The Druidic Colleges"
 desc_carneter_college_network:0 "Our mages learn from druids in the traditions and practical knowledge of the Deruwren."
 carneter_covenant:0 "The Covenant Renewed"
 desc_carneter_covenant:0 "The renewed covenant establishes lasting cooperation between our state and its druids."
 carneter_grovemen_charter:0 "The Grovemen's Charter"
 desc_carneter_grovemen_charter:0 "A charter supporting the local construction of woodland towns."
 carneter_woodland_industry:0 "Wood, Hide and Herb"
 desc_carneter_woodland_industry:0 "Foresters, hunters and herbalists are the backbone of our economy."
 carneter_root_roads:0 "Root and Road"
 desc_carneter_root_roads:0 "Druidic guides and carefully maintained trails offer fast and safe access in our lands."
 carneter_woodland_wealth:0 "The Wealth of the Woods"
 desc_carneter_woodland_wealth:0 "The woodland economy supports prosperous towns and merchants far beyond the Deruwren."
 carneter_expanded_wardens:0 "Expanded Royal Wardens"
 desc_carneter_expanded_wardens:0 "The wardens have been turned into a robust fighting force, integrated within our military."
 carneter_gorge_defences:0 "Hold the Gorge"
 desc_carneter_gorge_defences:0 "Prepared strongholds cover the approaches to the woodland heartland."
 carneter_rangers:0 "Rangers of the Crown"
 desc_carneter_rangers:0 "Professional rangers combine local knowledge with the training of a royal army."
 carneter_unbroken_green:0 "The Unbroken Green"
 desc_carneter_unbroken_green:0 "The wardens and their fortified network form a lasting defence of the kingdom."
 carneter_root_rain:0 "Rite of Root and Rain"
 desc_carneter_root_rain:0 "A magical rite sustains the soil and the woodland economy."
 carneter_root_rain_greater:0 "Greater Rite of Root and Rain"
 desc_carneter_root_rain_greater:0 "A powerful magical rite sustains the soil and the woodland economy."
 carneter_thornwall:0 "The Thornwall"
 desc_carneter_thornwall:0 "A network of ritual wards strengthens our defences."
 carneter_thornwall_greater:0 "The Greater Thornwall"
 desc_carneter_thornwall_greater:0 "A powerful network of ritual wards strengthens our defence."
 carneter_wild_eyes:0 "Eyes of the Wild"
 desc_carneter_wild_eyes:0 "Animal signs and druidic divination guide our commanders."
 carneter_wild_eyes_greater:0 "Greater Eyes of the Wild"
 desc_carneter_wild_eyes_greater:0 "Animal signs and powerful druidic divination guide our commanders."
 carneter_wild_hunt:0 "The Wild Hunt"
 desc_carneter_wild_hunt:0 "The forest guardians lend their presence to the state. They ride with us!"
 carneter_crown_stewardship:0 "Crown of Stewardship"
 desc_carneter_crown_stewardship:0 "The monarchy dedicates itself to the prosperity and careful stewardship of the living realm."
 carneter_crown_hunt:0 "Crown of the Wild Hunt"
 desc_carneter_crown_hunt:0 "The monarch leads the wardens as the mortal face of the Wild Hunt."
 carneter_crown_veil:0 "Crown Beyond the Veil"
 desc_carneter_crown_veil:0 "The spirit court shares in the counsel and institutions of the kingdom."
 carneter_rite_cooldown:0 "The Groves Must Rest"
 desc_carneter_rite_cooldown:0 "Another Royal Rite can be performed when this ten-year recovery period ends."
 carneter_hart_haven:0 "The White Hart's Haven"
 desc_carneter_hart_haven:0 "A settlement with the guardian protects its habitat and the livelihoods around it."
 carneter_hart_watch:0 "The White Hart's Watch"
 desc_carneter_hart_watch:0 "The wardens maintain a respectful watch over the guardian and its territory."
 carneter_boar_haven:0 "The Root-Tusk's Haven"
 desc_carneter_boar_haven:0 "A settlement with the guardian protects its habitat and the livelihoods around it."
 carneter_boar_watch:0 "The Root-Tusk's Watch"
 desc_carneter_boar_watch:0 "The wardens maintain a respectful watch over the guardian and its territory."
 carneter_moonwing_haven:0 "The Moonwing's Haven"
 desc_carneter_moonwing_haven:0 "A settlement with the guardian protects its habitat and the livelihoods around it."
 carneter_moonwing_watch:0 "The Moonwing's Watch"
 desc_carneter_moonwing_watch:0 "The wardens maintain a respectful watch over the guardian and its territory."
 carneter_claim_counties_tt:0 "Gain permanent claims on the remaining provinces of §YCarneteria§! and §YWoodwell§!."
 carneter_claim_west_dameshead_tt:0 "Gain permanent claims on the remaining settled provinces of §YWest Dameshead§!."
 carneter_two_loyal_estates_tt:0 "At least §Ytwo§! of the Clergy, Nobility, Burghers, Mages and Adventurers have §Y50§! loyalty."
 carneter_two_senior_advisors_tt:0 "Employ advisors of skill §Y2§! or higher in at least §Ytwo§! different power categories."
 carneter_two_habitats_tt:0 "Maintain sanctuaries in at least §Ytwo§! habitat categories: Woodland, Coast or Riverland."
 carneter_woodland_production_tt:0 "Have at least §Y25§! production development across owned woodland and sanctuary provinces. Last census: §Y[Root.carneter_woodland_production_development.GetValue]§!. The royal census updates automatically; Review the Realm provides an immediate count."
 carneter_total_production_tt:0 "Have at least §Y75§! production development across owned settled provinces. Last census: §Y[Root.carneter_total_production_development.GetValue]§!. The royal census updates automatically; Review the Realm provides an immediate count."
 carneter_unlock_groves_tt:0 "Unlock §YEstablish a Royal Grove§!. Initially maintain up to §Y3§! owned groves; the colleges increase this to §Y5§!."
 carneter_unlock_sanctuaries_tt:0 "Unlock §YEstablish a Wildlife Sanctuary§!. Initially maintain up to §Y3§! owned sanctuaries, including the sanctuary inherited from Ilvandet."
 carneter_unlock_rites_tt:0 "Unlock §YConsult the Royal Circle§! and three ten-year Royal Rites: Root and Rain, The Thornwall, and Eyes of the Wild. Rites share a ten-year recovery period. Grove capacity rises to §Y5§!."
 carneter_upgrade_groves_tt:0 "All owned Royal Groves permanently gain §G+10%§! Local Production Efficiency and §G+10%§! Local Manpower, in addition to their tax bonus. Future groves receive the same upgrade."
 carneter_upgrade_sanctuaries_tt:0 "Upgrade all owned sanctuaries to §G-2§! Local Unrest and §G+20%§! Local Production Efficiency. These replace their earlier bonuses. Sanctuary capacity rises to §Y5§!."
 carneter_living_sanctuaries_tt:0 "All owned sanctuaries additionally gain permanent §G+1§! Local Goods Produced and §G+25%§! Local Manpower. Future sanctuaries receive the same upgrade."
 carneter_unlock_hunt_tt:0 "Unlock §YThe Wild Hunt§! as a fourth Royal Rite: §G+10%§! Infantry Combat Ability and §G+25%§! Reinforce Speed for ten years, sharing the normal ritual recovery period."
 carneter_greater_rites_tt:0 "Future Root and Rain rites grant §G+25%§! Production Efficiency; The Thornwall grants §G+40%§! Fort Defence; Eyes of the Wild grants §G+2§! Leader Manoeuvre and §G-20%§! Land Attrition. Existing rites retain their original strength until they expire."
 carneter_crown_choice_tt:0 "Choose one permanent identity for the kingdom: §YCrown of Stewardship§!, §YCrown of the Wild Hunt§!, or §YCrown Beyond the Veil§!."
 carneter_counts_title:0 "The Scattered Counts"
 carneter_counts_desc:0 "A restored title must be followed by restored authority. Gather Carneter, Ilvandet and Neckcliffe into a common settlement, and the remaining counties will hear our claim."
 carneter_court_title:0 "A Single Carnetori Court"
 carneter_court_desc:0 "The former counties bring separate laws, offices and privileges. Convene a court that can settle their disputes and give the restored realm institutions of its own."
 carneter_borders_title:0 "The Old Borders"
 carneter_borders_desc:0 "From the woodland counties to Windtower and Neckcliffe, the old realm can be gathered through agreement or force. Loyal subjects may share in its restoration, provided their allegiance is secure."
 carneter_kingdom_title:0 "A Kingdom of Our Own"
 carneter_kingdom_desc:0 "The crown must outlast the victories that restored it. A prosperous heartland, secure succession and established authority will make Carneter a kingdom whose neighbours must take seriously."
 carneter_circle_title:0 "Call the Green Circle"
 carneter_circle_desc:0 "Invite the druids to a permanent place at court. Their knowledge will be supported by royal grants, and their sacred groves will become the meeting places of a wider covenant."
 carneter_colleges_title:0 "The Druidic Colleges"
 carneter_colleges_desc:0 "A kingdom needs more than occasional counsel. Establish colleges around the royal groves, where experienced scholars can teach the rites and practical arts of the Deruwren."
 carneter_spirits_title:0 "A Court of Spirits"
 carneter_spirits_desc:0 "Reports from the protected breeding grounds speak of presences that answer the druids. Prepare a court where those who speak for the forest may negotiate with those who wear its crown."
 carneter_covenant_title:0 "The Covenant Renewed"
 carneter_covenant_desc:0 "The guardians have been approached and the spirit court established. At the heart of the royal groves, renew the covenant between crown, communities and the living forest."
 carneter_surveys_title:0 "Beyond the Familiar Paths"
 carneter_surveys_desc:0 "The records gathered in Ilvandet were a beginning. Dispatch naturalists to woodland, coastal and riverland sites, so the whole restored kingdom may be understood and protected."
 carneter_breeding_title:0 "Safe Breeding Grounds"
 carneter_breeding_desc:0 "Protection must account for the seasons and the needs of different habitats. Establish sanctuaries where animals can breed undisturbed and nearby communities can live from a renewed landscape."
 carneter_beasts_title:0 "The Great Beasts"
 carneter_beasts_desc:0 "The White Hart, the Root-Tusk and the Moonwing cannot be approached as ordinary game. Let the wardens and druids learn their habits, settle the disputes around their territories and earn their cooperation."
 carneter_living_forest_title:0 "A Living Deruwren"
 carneter_living_forest_desc:0 "Sanctuaries, settlements and sacred groves now form a living landscape. Let its prosperity endure across the seasons, providing both a home for its creatures and a livelihood for its people."
 carneter_living_crown_title:0 "The Living Crown"
 carneter_living_crown_desc:0 "The restored kingdom has become a realm sustained by its people, its wildlife and its magic. Before the assembled court, decide how the crown will uphold that shared inheritance for the generations to come."
 carneter_charter_title:0 "The Grovemen's Charter"
 carneter_charter_desc:0 "The compact that sustained a small woodland realm must now become a royal charter. Fund the workshops and common arrangements needed by a kingdom of foresters, hunters and craftspeople."
 carneter_resources_title:0 "Wood, Hide and Herb"
 carneter_resources_desc:0 "Timber, hides and woodland herbs can sustain more than scattered village crafts. Organise their supply to a growing network of workshops while protecting the sources on which they depend."
 carneter_roads_title:0 "Root and Road"
 carneter_roads_desc:0 "The colleges can help travellers read the changing paths of the forest. Combine their guidance with markets, maintained roads and a dependable trade centre to carry the wealth of the woods abroad."
 carneter_wealth_title:0 "The Wealth of the Woods"
 carneter_wealth_desc:0 "Our forest economy can supply great manufactories and support merchants throughout the Dameshead. Let prosperity rest on productive settlements and renewed resources across the realm."
 carneter_wardens_title:0 "Expand the Wardens"
 carneter_wardens_desc:0 "The defenders of Ilvandet must become the wardens of an entire kingdom. Fill the ranks, retain a reserve of recruits and appoint a commander worthy of the restored crown."
 carneter_gorge_title:0 "Hold the Gorge"
 carneter_gorge_desc:0 "Fortified approaches should give the wardens time to gather and deny an enemy easy passage into the forest. Maintain strong garrisons around the gorge and woodland roads."
 carneter_rangers_title:0 "Rangers of the Crown"
 carneter_rangers_desc:0 "Royal service must combine the skills of hunters with the discipline of a professional army. Train formations that can march, scout and fight together beneath the boughs."
 carneter_unbroken_title:0 "The Unbroken Green"
 carneter_unbroken_desc:0 "Modern strongholds, veteran wardens and the cooperation of the forest guardians can make the kingdom a formidable opponent. The green heartland shall remain unbroken."
 carneter_forest.3.t:0 "A Census of the Living Realm"
 carneter_forest.3.desc:0 "The royal clerks and wardens have gathered their latest records.\n\nControlled core Royal Groves: §Y[Root.carneter_grove_count.GetValue]§!\nControlled core Royal Sanctuaries: §Y[Root.carneter_sanctuary_count.GetValue]§!\nWoodland and sanctuary production development: §Y[Root.carneter_woodland_production_development.GetValue]§!\nTotal production development: §Y[Root.carneter_total_production_development.GetValue]§!"
 carneter_forest.3.a:0 "Continue."
 carneter_forest.4.t:0 "The Crown Takes Root"
 carneter_forest.4.desc:0 "Carneter is restored, but its future remains to be made. The counts seek a common court, the grovemen a lasting charter, and the druids a place in the life of the kingdom. Beyond the settlements, the wardens bring reports of creatures whose presence has become harder to dismiss.\n\nThe new mission tree is now available. Any wildlife sanctuary inherited from Ilvandet has been recognised by the crown."
 carneter_forest.4.a:0 "Continue."
 carneter_convene_court_title:0 "Convene the Restored Court"
 carneter_convene_court_desc:0 "Bring the institutions of restored Carneter together and open its national mission tree. If using the Ilvandet tree, first complete A Crown Beneath the Boughs. The court will otherwise convene automatically shortly after formation."
 carneter_review_realm_title:0 "Review the Realm"
 carneter_review_realm_desc:0 "Request the latest royal census of groves, sanctuaries and productive settlements. The clerks already update the records regularly; a fresh review records recent changes immediately."
 carneter_select_site_tt:0 "Choose a qualifying province in the following event. Browse another site or cancel without paying. All requirements and costs are checked again when you confirm."
 carneter_grove_requirements_tt:0 "A Royal Grove requires an owned, controlled core with §Y15 development§!, a temple or cathedral, and no devastation. Cost: §Y25 ADM§! and §Ysix months of income§!."
 carneter_sanctuary_requirements_tt:0 "A sanctuary requires an owned, controlled core with §Y10 development§!, no devastation and a qualifying habitat. Cost: §Y25 DIP§! and §Ythree months of income§!. Woodland, non-woodland coastal provinces, and inland farmlands, grasslands or marsh qualify."
 carneter_establish_grove_title:0 "Establish a Royal Grove"
 carneter_establish_grove_desc:0 "Choose a province for a new royal grove. Groves require 15 development and a temple or cathedral. The event lets you browse eligible sites before paying."
 carneter_forest.100.t:0 "A Site for a Royal Grove"
 carneter_forest.100.desc:0 "The wardens recommend §Y[carneter_grove_site.GetName]§! for a royal grove.\n\nA grove costs 25 ADM and six months of current income. It needs 15 development, a temple or cathedral, and no devastation.\n\nYou may browse another eligible site or cancel. No resources are spent until you confirm."
 carneter_forest.100.a:0 "Establish it in [carneter_grove_site.GetName]."
 carneter_forest.100.b:0 "Show another eligible province."
 carneter_forest.100.c:0 "Leave this for another time."
 carneter_forest.101.t:0 "A Site for a Royal Grove"
 carneter_forest.101.desc:0 "The wardens recommend §Y[carneter_grove_site.GetName]§! for a royal grove.\n\nA grove costs 25 ADM and six months of current income. It needs 15 development, a temple or cathedral, and no devastation.\n\nYou may browse another eligible site or cancel. No resources are spent until you confirm."
 carneter_forest.101.a:0 "Establish it in [carneter_grove_site.GetName]."
 carneter_forest.101.b:0 "Show another eligible province."
 carneter_forest.101.c:0 "Leave this for another time."
 carneter_establish_sanctuary_title:0 "Establish a Wildlife Sanctuary"
 carneter_establish_sanctuary_desc:0 "Choose a province for a new wildlife sanctuary. Sanctuaries require 10 development and a suitable habitat. The event lets you browse eligible sites before paying."
 carneter_forest.110.t:0 "A Site for a Wildlife Sanctuary"
 carneter_forest.110.desc:0 "The wardens recommend §Y[carneter_sanctuary_site.GetName]§! for a wildlife sanctuary.\n\nA sanctuary costs 25 DIP and three months of current income. It needs 10 development, a qualifying habitat, and no devastation.\n\nYou may browse another eligible site or cancel. No resources are spent until you confirm."
 carneter_forest.110.a:0 "Establish it in [carneter_sanctuary_site.GetName]."
 carneter_forest.110.b:0 "Show another eligible province."
 carneter_forest.110.c:0 "Leave this for another time."
 carneter_forest.111.t:0 "A Site for a Wildlife Sanctuary"
 carneter_forest.111.desc:0 "The wardens recommend §Y[carneter_sanctuary_site.GetName]§! for a wildlife sanctuary.\n\nA sanctuary costs 25 DIP and three months of current income. It needs 10 development, a qualifying habitat, and no devastation.\n\nYou may browse another eligible site or cancel. No resources are spent until you confirm."
 carneter_forest.111.a:0 "Establish it in [carneter_sanctuary_site.GetName]."
 carneter_forest.111.b:0 "Show another eligible province."
 carneter_forest.111.c:0 "Leave this for another time."
 carneter_survey_woodland_title:0 "Survey a Woodland Habitat"
 carneter_survey_woodland_desc:0 "Dispatch naturalists to an owned core with a woodland habitat. Choose a site before spending 25 DIP; the report arrives after 90 days. Each national survey uses a different province."
 carneter_forest.130.t:0 "The Woodland Survey Returns"
 carneter_forest.130.desc:0 "The expedition from [carneter_survey_site.GetName] has returned. The naturalists chart feeding paths, nesting trees and the use of clearings through the seasons. Their findings will guide the protection of woodland breeding grounds."
 carneter_forest.130.a:0 "Add the findings to the royal records."
 carneter_survey_coastal_title:0 "Survey a Coastal Habitat"
 carneter_survey_coastal_desc:0 "Dispatch naturalists to an owned core with a coastal habitat. Choose a site before spending 25 DIP; the report arrives after 90 days. Each national survey uses a different province."
 carneter_forest.131.t:0 "The Coastal Survey Returns"
 carneter_forest.131.desc:0 "The expedition from [carneter_survey_site.GetName] has returned. The expedition records nesting colonies, the sheltered shore and the traffic between land and water. The coast must be managed with its own seasons in mind."
 carneter_forest.131.a:0 "Add the findings to the royal records."
 carneter_survey_riverland_title:0 "Survey a Riverland Habitat"
 carneter_survey_riverland_desc:0 "Dispatch naturalists to an owned core with a riverland habitat. Choose a site before spending 25 DIP; the report arrives after 90 days. Each national survey uses a different province."
 carneter_forest.132.t:0 "The Riverland Survey Returns"
 carneter_forest.132.desc:0 "The expedition from [carneter_survey_site.GetName] has returned. The naturalists record the wildlife of the settled lowlands, wet ground and agricultural margins. Their report explains how protected habitat can coexist with working communities."
 carneter_forest.132.a:0 "Add the findings to the royal records."
 carneter_forest.120.t:0 "A Site for the National Survey"
 carneter_forest.120.desc:0 "The naturalists propose §Y[carneter_survey_site.GetName]§!. Dispatching the expedition costs §Y25 DIP§!, and the report will return after §Y90 days§!.\n\nThe selected province must still be an owned, controlled core when you confirm. Browse another site or cancel without paying."
 carneter_forest.120.a:0 "Send the expedition."
 carneter_forest.120.b:0 "Consider another site."
 carneter_forest.120.c:0 "Cancel the dispatch."
 carneter_forest.121.t:0 "A Site for the National Survey"
 carneter_forest.121.desc:0 "The naturalists propose §Y[carneter_survey_site.GetName]§!. Dispatching the expedition costs §Y25 DIP§!, and the report will return after §Y90 days§!.\n\nThe selected province must still be an owned, controlled core when you confirm. Browse another site or cancel without paying."
 carneter_forest.121.a:0 "Send the expedition."
 carneter_forest.121.b:0 "Consider another site."
 carneter_forest.121.c:0 "Cancel the dispatch."
 carneter_seek_hart_title:0 "Seek The White Hart"
 carneter_seek_hart_desc:0 "Send wardens and druids to approach The White Hart. The first report arrives after 30 days. Later event choices require monarch power or income; an expedition can wait and resume if further preparations are needed."
 carneter_resume_hart_1_title:0 "Resume the Search for The White Hart"
 carneter_resume_hart_1_desc:0 "Return to the unfinished encounter with The White Hart. Resuming has no fee; only a confirmed choice in the following event spends resources."
 carneter_resume_hart_2_title:0 "Resume the Search for The White Hart"
 carneter_resume_hart_2_desc:0 "Return to the unfinished encounter with The White Hart. Resuming has no fee; only a confirmed choice in the following event spends resources."
 carneter_forest.200.t:0 "Approaching The White Hart"
 carneter_forest.200.desc:0 "A white hart has been seen at the edges of the protected woods. It never allows the hunters a clear approach, yet its tracks repeatedly lead to places where young trees have been damaged. The wardens ask how they should proceed.\n\nThe expedition is based in [carneter_hart_site.GetName]."
 carneter_forest.200.a:0 "Follow its tracks without disturbing it. (DIP 25)"
 carneter_forest.200.b:0 "Ask the druids to interpret its signs. (ADM 25)"
 carneter_forest.200.c:0 "Prepare further before continuing."
 carneter_forest.201.t:0 "A Settlement with The White Hart"
 carneter_forest.201.desc:0 "The hart has led the expedition to a glade used by both animals and nearby villagers. A lasting settlement will require either a protected haven with agreed access, or a watch that keeps the routes clear and the young woodland safe.\n\nThe proposed site is [carneter_hart_site.GetName]."
 carneter_forest.201.a:0 "Fund a protected haven."
 carneter_forest.201.b:0 "Organise a respectful watch."
 carneter_forest.201.c:0 "Regroup and return when arrangements are ready."
 carneter_forest.202.t:0 "The White Hart Recognises the Covenant"
 carneter_forest.202.desc:0 "The White Hart no longer withdraws at the wardens' approach. When its pale shape appears among the trees, the druids regard it as recognition of the promise made at its glade."
 carneter_forest.202.a:0 "Record the guardian among the allies of the crown."
 carneter_seek_boar_title:0 "Seek The Root-Tusk"
 carneter_seek_boar_desc:0 "Send wardens and druids to approach The Root-Tusk. The first report arrives after 30 days. Later event choices require monarch power or income; an expedition can wait and resume if further preparations are needed."
 carneter_resume_boar_1_title:0 "Resume the Search for The Root-Tusk"
 carneter_resume_boar_1_desc:0 "Return to the unfinished encounter with The Root-Tusk. Resuming has no fee; only a confirmed choice in the following event spends resources."
 carneter_resume_boar_2_title:0 "Resume the Search for The Root-Tusk"
 carneter_resume_boar_2_desc:0 "Return to the unfinished encounter with The Root-Tusk. Resuming has no fee; only a confirmed choice in the following event spends resources."
 carneter_forest.210.t:0 "Approaching The Root-Tusk"
 carneter_forest.210.desc:0 "Woodcutters report a boar of extraordinary size turning over boundary stones and tearing through fences. Its tusks are tangled with living roots. The creatures of the sanctuary follow in the disturbed ground behind it.\n\nThe expedition is based in [carneter_boar_site.GetName]."
 carneter_forest.210.a:0 "Send experienced wardens to learn its movements. (MIL 25)"
 carneter_forest.210.b:0 "Have the druids prepare an offering of the forest. (ADM 25)"
 carneter_forest.210.c:0 "Prepare further before continuing."
 carneter_forest.211.t:0 "A Settlement with The Root-Tusk"
 carneter_forest.211.desc:0 "The Root-Tusk's feeding grounds overlap working woodland. The grovemen can establish a protected haven and shift their work, or join the wardens in maintaining clear boundaries and a respectful watch.\n\nThe proposed site is [carneter_boar_site.GetName]."
 carneter_forest.211.a:0 "Fund a protected haven."
 carneter_forest.211.b:0 "Organise a respectful watch."
 carneter_forest.211.c:0 "Regroup and return when arrangements are ready."
 carneter_forest.212.t:0 "The Root-Tusk Recognises the Covenant"
 carneter_forest.212.desc:0 "The great boar has ceased its attacks on the settlements. In the rough ground it leaves behind, the druids find signs of renewed growth. The Root-Tusk has a place within the kingdom's covenant."
 carneter_forest.212.a:0 "Record the guardian among the allies of the crown."
 carneter_seek_moonwing_title:0 "Seek The Moonwing"
 carneter_seek_moonwing_desc:0 "Send wardens and druids to approach The Moonwing. The first report arrives after 30 days. Later event choices require monarch power or income; an expedition can wait and resume if further preparations are needed."
 carneter_resume_moonwing_1_title:0 "Resume the Search for The Moonwing"
 carneter_resume_moonwing_1_desc:0 "Return to the unfinished encounter with The Moonwing. Resuming has no fee; only a confirmed choice in the following event spends resources."
 carneter_resume_moonwing_2_title:0 "Resume the Search for The Moonwing"
 carneter_resume_moonwing_2_desc:0 "Return to the unfinished encounter with The Moonwing. Resuming has no fee; only a confirmed choice in the following event spends resources."
 carneter_forest.220.t:0 "Approaching The Moonwing"
 carneter_forest.220.desc:0 "A vast bird has begun circling a sanctuary after dusk. Its wings catch the moonlight above the sleeping settlements, and livestock scatter at its shadow. The naturalists believe they can find its nesting place.\n\nThe expedition is based in [carneter_moonwing_site.GetName]."
 carneter_forest.220.a:0 "Observe the flights and chart the nesting routes. (DIP 25)"
 carneter_forest.220.b:0 "Let the druids seek it through dreams and signs. (ADM 25)"
 carneter_forest.220.c:0 "Prepare further before continuing."
 carneter_forest.221.t:0 "A Settlement with The Moonwing"
 carneter_forest.221.desc:0 "The Moonwing nests above a route used by the surrounding communities. We can fund a quiet haven and change the approach to the nest, or establish a trained watch that protects both travellers and the great bird.\n\nThe proposed site is [carneter_moonwing_site.GetName]."
 carneter_forest.221.a:0 "Fund a protected haven."
 carneter_forest.221.b:0 "Organise a respectful watch."
 carneter_forest.221.c:0 "Regroup and return when arrangements are ready."
 carneter_forest.222.t:0 "The Moonwing Recognises the Covenant"
 carneter_forest.222.desc:0 "The Moonwing has accepted the new arrangements around its nesting ground. Its appearance above the royal wardens is now greeted as a sign of the living forest's watchfulness."
 carneter_forest.222.a:0 "Record the guardian among the allies of the crown."
 carneter_court_project_ongoing:0 "The Court of Spirits in Preparation"
 desc_carneter_court_project_ongoing:0 "The funded preparations are underway. A disrupted project can be resumed without paying its initial cost again."
 carneter_fund_court_project_title:0 "Fund The Court of Spirits"
 carneter_fund_court_project_desc:0 "Commit 100 DIP and 2 years of current income to the court of spirits. Preparations take 1 year(s). If the required sites or conditions are lost at completion, the funded project pauses and can be resumed without a second payment."
 carneter_resume_court_project_title:0 "Resume The Court of Spirits"
 carneter_resume_court_project_desc:0 "Restore the required sites and conditions, then complete the final preparations over seven days. The initial investment has already been paid."
 carneter_forest.701.t:0 "The Court of Spirits Is Ready"
 carneter_forest.701.desc:0 "The funded preparations have been completed. The druids report that the sites and arrangements are ready; the corresponding mission can now be claimed once its other requirements are met."
 carneter_forest.701.a:0 "Continue."
 carneter_forest.702.t:0 "The Court of Spirits Is Interrupted"
 carneter_forest.702.desc:0 "The preparations have reached a point where the required sites or conditions must be restored before the work can proceed. The investment remains committed. A resume decision will allow the druids to complete the project without paying the initial cost again."
 carneter_forest.702.a:0 "Continue."
 carneter_grand_rite_ongoing:0 "The Grand Rite in Preparation"
 desc_carneter_grand_rite_ongoing:0 "The funded preparations are underway. A disrupted project can be resumed without paying its initial cost again."
 carneter_fund_grand_rite_title:0 "Fund The Grand Rite"
 carneter_fund_grand_rite_desc:0 "Commit 150 ADM and 3 years of current income to the grand rite. Preparations take 3 year(s). If the required sites or conditions are lost at completion, the funded project pauses and can be resumed without a second payment."
 carneter_resume_grand_rite_title:0 "Resume The Grand Rite"
 carneter_resume_grand_rite_desc:0 "Restore the required sites and conditions, then complete the final preparations over seven days. The initial investment has already been paid."
 carneter_forest.801.t:0 "The Grand Rite Is Ready"
 carneter_forest.801.desc:0 "The funded preparations have been completed. The druids report that the sites and arrangements are ready; the corresponding mission can now be claimed once its other requirements are met."
 carneter_forest.801.a:0 "Continue."
 carneter_forest.802.t:0 "The Grand Rite Is Interrupted"
 carneter_forest.802.desc:0 "The preparations have reached a point where the required sites or conditions must be restored before the work can proceed. The investment remains committed. A resume decision will allow the druids to complete the project without paying the initial cost again."
 carneter_forest.802.a:0 "Continue."
 carneter_rite_recovery_tt:0 "No Royal Rite is active or recovering; the groves rest for ten years after each rite."
 carneter_consult_circle_title:0 "Consult the Royal Circle"
 carneter_consult_circle_desc:0 "Choose a ten-year Royal Rite. All rites share a ten-year recovery period and cost six months of income plus monarch power. Root and Rain requires peace; the defensive and military rites can be used during war."
 carneter_forest.600.t:0 "The Royal Rites"
 carneter_forest.600.desc:0 "The druids offer the rites supported by the royal groves. Each blessing lasts ten years and requires six months of current income in addition to its listed monarch power. The groves must then recover for the same ten years.\n\nThe renewed covenant strengthens the first three rites. The Wild Hunt becomes available after the three guardian encounters are completed."
 carneter_forest.600.a:0 "Root and Rain: Production Efficiency +15%, or +25% after renewing the covenant. (50 ADM)"
 carneter_forest.600.b:0 "The Thornwall: Fort Defence +25%, or +40% after renewing the covenant. (50 MIL)"
 carneter_forest.600.c:0 "Eyes of the Wild: Leader Manoeuvre +1 and Land Attrition -10%, improved to +2 and -20%. (50 DIP)"
 carneter_forest.600.d:0 "The Wild Hunt: Infantry Combat Ability +10% and Reinforce Speed +25%. (75 MIL)"
 carneter_forest.600.e:0 "Let the groves rest."
 carneter_forest.900.t:0 "The Living Crown"
 carneter_forest.900.desc:0 "The royal court gathers beneath the boughs. Counts, grovemen and wardens stand alongside the druids, while the spirit court bears witness. The kingdom has fulfilled the work of restoration. Now its crown must choose the promise by which it will be remembered.\n\nStewardship binds the monarchy to the prosperity of the living realm. The Wild Hunt makes it the leader of the forest's defenders. Beyond the Veil, the spirit court shares in the kingdom's lasting counsel."
 carneter_forest.900.a:0 "Crown of Stewardship"
 carneter_forest.900.b:0 "Crown of the Wild Hunt"
 carneter_forest.900.c:0 "Crown Beyond the Veil"
