l_english:
 #Missions
 I69_caillumh_ughea_title: "Caillumh Ughea"
 I69_caillumh_ughea_desc: "A steep, inhospitable path along the mountainside. A geoglyph, etched into the stone; That is Caillumh Ughea. We knew of it, but our shamans have taken the knowledge of this spot to their watery graves.\nWe will sing praises here, observe the skies and tell stories. And our cries will be answered and magic returns. "

 I69_caillumh_ughea_tt: "Gain the modifier §YStarstruck Observatory§! in the province fulfilling the requirements."

 I69_interpreting_the_signs_title: "Interpreting the Signs"
 I69_interpreting_the_signs_desc: "There, atop Caillumh Ughea, we see the Scale in the skies; describing the need for us to not dominate the other sects, but to understand their ways to reach a consensus, not enforce one."

 I69_interpreting_the_signs_tt: "We will be able to cast each §Treligious action§! once without having their §Yreligious school§! invited, also ignoring their cooldown once.\n\nWe will gain §YEnforce Tributary§! war goals on any nation following the §Yreligious school§! that we have done the §Treligious action§! of."


 I69_presents_for_the_faithful_title: "Presents for the Faithful"
 I69_presents_for_the_faithful_desc: "And it is then when the great Starfire fell upon the mountain. That skyborne tear, inhibiting pure magic in its form. We thank you, Irdaeos!"

 I69_comet_tt: "\n§GEvent Insight§!\nWitnessing a comet is a monumental occasion for our nation! It will henceforth give §G+50§! §Ychurch power§! and §G+100§! §TMana§!!\n\nWe will also gain a §Tpermanent damestear deposit§! on our §YStarstruck Observatory§! the next time we cast §YTearfall§!."


 I69_mountainborne_ghanzamh_title: "Mountainborne\nGhanzamh"
 I69_mountainborne_ghanzamh_desc: "To be devoted to Irdaeos is to ruminate.\nTo read the sky as best we can. All like-minded people from far and wide will see our devotion and come to our aid, shamans included!"

 I69_mountainborne_ghanzamh_tt: "We will gain §G25§! §Ychurch power§! when tributizing an §YIrdaeos Worship§! nation, an additional §G25§! if that nation is following the §YMalukhuga Sect§!.\nHolding a §TMalukhuga communion§! will grant us §G10§! §TMana§! and §Y20% Mage Estate Influence§! for 30 years as long as we have the Mage Estate Privilege §YDecimated Shamans§!."


 I69_burying_our_relatives_title: "Burying our Relatives"
 I69_burying_our_relatives_desc: "The waves still bring us our fallen brethren. Their bloated corpses. We will grant them the best burials, despite their deaths being decades ago and our subjects will be eager to support us."

 I69_any_ongoing_celebration: "Has any ongoing §TMalukhuga Communion§!."

 I69_coastline: "Province is bordering the eastern lakes of Keyalhkho, Oriolg, Oritsukh or Koverek."

 I69_temple_1_tt: "Gain access to the custom province button §YTighten our Grip§! on your tributaries' capital in the Forbidden Plains, building a temple in their lands at the cost of 100 ducats. We will gain §T5 mana§!, §G0.5§! §Yyears of manpower§! (once per tributary) and §G-20%§! §YLiberty Desire§! on that tributary (once every 3 years)."


 I69_reversing_negeal_title: "Reversing Negeal"
 I69_reversing_negeal_desc: "The reversal of the annihilation of a tribe...\nBreaking the giant caehnates is a necessity. Every corner of the plains shall be recognized and be invited to the coming conclave, for that is how we attain all interpretations!"

 I69_reversing_negeal_tt: "All subjects fulfilling the requirements §Rwill be shattered§!, releasing all nations, those becoming our tributaries. The province interaction button §YTighten our Grip§! will now do the same at the cost of §R5%§! §YLiberty desire§! in the broken caehnate.\n\nWe have additionally outlawed §Yany and all wars§! between our tributaries! We §Ywill§! reach a consensus that benefits all!"


 I69_the_ram_title: "The Ram"
 I69_the_ram_desc: "The stubborn ram;\nA sign for those who believe that to struggle is to live. That to crawl is to breathe.\nTheir school, the oldest of our worship, will be easily convinced of the necessity of consensus"

 I69_any_maslekhuga_aspect: "Has any Maslekhuga aspect from a §YMaslekhuga Religious Action§! active."
  
 I69_the_ram_subjects_tt: "At least two tributary subjects that follow the §YMaslekhuga Sect§! have 100 Opinion of us. 1 suffices if only 1 exists. Have the §YGlyphs of Irdaoes§! great project at tier 1 alternatively."

 I69_the_ram_tt: "Transfer §Y5%§! crownland from the §YMonstrous Tribes§! to the §YMages§!.\nAll subjects that follow the §YMaslekhuga School§! will lose §G50§! §YLiberty Desire§!."


 I69_faint_and_far_title: "Faint and Far"
 I69_faint_and_far_desc: "What does it mean to live in the darkness? What have we lost when our light was snuffed out?\nIt matters little, now."

 I69_faint_and_far_50_tt: "\n§GEvent Insight§!\nWe will reclaim that faint and distant star and overcome the decimation of our mages.\n£no£ Greater Rewards at §Y75% Mage Estate Influence§!.\n£no£ Greatest Rewards at §Y100% Mage Estate Influence§!.\n\n§GInherit§! all Malukhuga sect subjects at a rate of §Y6 diplomatic power§! per inherited development\n...among other benefits"

 I69_faint_and_far_75_tt: "\n§GEvent Insight§!\nWe will reclaim that faint and distant star and overcome the decimation of our mages.\n£yes£ Greater Rewards at §Y75% Mage Estate Influence§!.\n£no£ Greatest Rewards at §Y100% Mage Estate Influence§!.\n\n§GInherit§! all Malukhuga sect subjects at a rate of §Y3 diplomatic power§! per inherited development\n...among other benefits"

 I69_faint_and_far_100_tt: "\n§GEvent Insight§!\nWe will reclaim that faint and distant star and overcome the decimation of our mages. It is time to seize our future!\n\n§GInherit§! all Malukhuga sect subjects for free\n...among other benefits"


 I69_the_tent_title: "The Tent"
 I69_the_tent_desc: "The gathering tent;\nA sign for those unbothered by the cruelties of this world. Drifting along meaninglessly.\nTheir contribution to the conclave is small, but necessary."

 I69_any_irdukhuga_aspect: "Has any Irdukhuga aspect from an §YIrdukhuga Religious Action§! active."

 I69_the_tent_subjects_tt: "At least two tributary subjects that follow the §YIrdukhuga Sect§! have 100 Opinion of us. 1 suffices if only 1 exists. Have the §YGlyphs of Irdaoes§! great project at tier 1 alternatively."

 I69_the_tent_tt: "Lose §G30%§! §Ydevastation§! and gain §G80%§! §Yprosperity§! in every state\nTransfer §Y5%§! crownland from the §YMonstrous Tribes§! to the §YMages§!.\nAll subjects that follow the §YIrdukhuga School§! will lose §G50§! §YLiberty Desire§!."


 I69_the_roc_title: "The Roc"
 I69_the_roc_desc: "The resplendent roc, soaring the skies.\nThe resplendent Stormbringer, circling amongst the clouds above us.\nThe conclave is upon us, consensus draws near."

 I69_the_roc_tt: "\n§GEvent Insight§!\nWe will create a great Conclave of Shamans, in order to discuss the future of our faith, in addition to the future of these lands that we have grown old in.\n§YIt will go exactly as planned§!."


 I69_tithing_their_shamans_title: "Tithing their Shamans"
 I69_tithing_their_shamans_desc: "The mechanism of re-establishing a mage organization from nothing is monumental. We also do not have the option of doing it the slow and proper way.\nA great Mage-Tithe must therefore established, and all of our subjects must oblige!"

 I69_tithing_their_shamans_tt: "\n§GEvent Insight§!\nReestablishing a whole pillar of governance is not an easy task. It is good that we can reappropriate that very same pillar from other places.\n\nGain §Y10% Mage Estate Influence§! for every tributary that we have as long as we are Star Rider\n...among other benefits."


 I69_consensus_of_the_eastern_tribes_title: "Consensus of the Eastern Tribes"
 I69_consensus_of_the_eastern_tribes_desc: "To reach a consensus is to reach divinity.\nThat is our goal.\nOur subjects must understand this truth and support us in this endeavor."

 I69_consensus_east_tt: "\n§GEvent Insight§!\nEstablish §TMagical Feudalism§!\n\nTributized nations will now pay in §Tmagical experience§!\n...among other benefits."

 I69_the_crow_title: "The Crow"
 I69_the_crow_desc: "The vengeful crow;\nA sign for those driven by bloodlust and the intrinsic desire to die in combat.\nAnd as such, it must be snatched and kept safe, lest it lash out once more."
 
 I69_any_filustkhuga_aspect: "Has any Filustkhuga aspect from a §YFilustkhuga Religious Action§! active."

 I69_the_crow_subjects_tt: "At least two tributary subjects that follow the §YFilustkhuga Sect§! have 100 Opinion of us. 1 suffices if only 1 exists. Have the §YGlyphs of Irdaoes§! great project at tier 1 alternatively."

 I69_the_crow_tt: "Transfer §Y5%§! crownland from the §YMonstrous Tribes§! to the §YMages§!.\nAll subjects that follow the §YFilustkhuga School§! will lose §G50§! §YLiberty Desire§!."


 #Events
 flavour_star_rider.1.t: "Requiem"
 flavour_star_rider.1.d: "Big problem. Our ruler and all of our shamans have not returned.\nWe have waited for a 7 long years, but eventually we had to accept that they have passed on.\nWe have elected a new caehn, and we hope he'll save us."
 flavour_star_rider.1.a: "Onwards, then!"

 I69_starting_situation_tt: "Our shamans are dead, without exception. We need to bring them back.Our folly is represented as a §YMage Estate Privilege§!, whose effects scale inversely with §YMage Estate Influence§!.\nIt is instrumental that we finish the mission §YFaint and Far§! in order to achieve liberation from the mistakes of our late caehn. This will not be easy."


 flavour_star_rider.2.t: "Servitude by other Means"
 flavour_star_rider.2.d: "People get subjugated, they ask how they should serve and they get the response that they need to send at least 10 shamans every year to Star Rider"
 flavour_star_rider.2.a: "They are not happy. At all."

 I69_mage_tithe_tt: "Every Tributary will add §Y10% Mage Estate Influence§! to us. Tributizing a nation will increase our §Tmana§! by §G2§!. Our current subjects will gain §G10%§! §YLiberty Desire§!.\n\nWe gain the §YForce Tributary§! casus belli on any centaur holding land in Nuzurbokh."


 flavour_star_rider.3.t: "And they Understood"
 flavour_star_rider.3.d: "Codifying our Faith is our first and last goal. And yet, we hear unsatisfied grumblings from those we have conscripted for this endeavor. As they can not be trusted, we might need to make them incapable of resisting us."
 flavour_star_rider.3.a: "Implement a new system."

 I69_magical_feudalism_tt: "We will establish §TMagical Feudalism§!.\nEvery subject will gain §R10§! §YLiberty desire§! and §G50§! §Tmagical experience§!. We will gain §Y1% feudalism progress§! in our capital and §G20§! §Tmagical experience§! for every tributary that we have or will have. Every paid tribute will increase our §Tmagical experience§! by §G2§!. Every subject below 25% §YLiberty Desire§! will additionally give us §Y+1% Feudalism progress§! in our capital whenever a tribute is paid."

 flavour_star_rider.4.t: "Twinkle and Shine, My Star"
 flavour_star_rider.4.d: "You, who has been gifted to us. We are sorry to have disregarded you. We are sorry for our insolence. Please, illuminate our path once more, allow us to move forward under your guidance. Be our star in the darkness, which we will never leave again."
 flavour_star_rider.4.a: "Never again"
 flavour_star_rider.4.b: "Never again"
 flavour_star_rider.4.c: "Never again"

 I69_faint_and_far_50: "We will acquire the Mage Estate Organization §YReligious Organization§!.\nWe will inherit every subject of the §YMalukhuga sect§! at a cost of §R6§! diplomatic points per development."

 I69_faint_and_far_75: "We will acquire the Mage Estate Organization §YReligious Organization§!.\nWe will inherit every subject of the §YMalukhuga sect§! at a cost of §R3§! diplomatic points per development."

 I69_faint_and_far_100: "We will acquire the Mage Estate Organization §YReligious Organization§!.\nWe will inherit every subject of the §YMalukhuga sect§! at no cost."

 I69_festival_tt: "Holding an §YIrdaeos Worship Festival§! while this modifier is active will increase our §TMana§! by §T10§! and our §YMage Estate influence§! by §Y15%§! for 30 years."


 flavour_star_rider.5.t: "Conclave of Shamans"
 flavour_star_rider.5.d: "This is what all of it has been leading to.\nThe conclave has no choice but to obey your command (due to liberty desire or superior arguing through Foresight)"
 flavour_star_rider.5.a: "Our purpose draws near"

 I69_consensus_start: "This is a pivotal moment. You'll gain multiple events that will influence the estate privilege that you will get by the end of this.\nChoosing §Yone issue§! from a sect will decrease liberty desire of all followers of that sect by §G25%§!, choosing §Ytwo issues§! will allow us to integrate them for 5 diplomatic points per development integrated. Choosing §Ythree issues§! will integrate the followers of that sect for no cost.\nThere are §Yfour issues§! in total. Do §Rnot§! count on the last one to go your way."

 I69_answer_maslekh: "The Maslekhuga delegation stomps their hooves in agreeance."
 I69_answer_malekh: "The Malukhuga delegation hums a celebratory tune."
 I69_answer_irdu: "The Irdukhuga delegation cheers happily."
 I69_answer_filust: "The Filustkhuga delegation fills the assembly with war cries."

 flavour_star_rider.6.t: "The Gifts That We've Been Given"
 flavour_star_rider.6.de: "Debate regarding the things that we have been given by Irdaeos."
 flavour_star_rider.6.a: ""We've been given only the Plains.""
 flavour_star_rider.6.b: ""We've been given Magic by Irdaeos!""
 flavour_star_rider.6.c: ""We have been given the gift of enjoying life to the fullest!""
 flavour_star_rider.6.d: ""To die and reawaken in Ik Magthaal. That is his gift.""

 I69_answer_maslekh_1: "Codifying this as our consensus will give us §G-2§! §YGlobal Unrest§! scaling with §YMage Estate Influence§!."
 I69_answer_malekh_1: "Codifying this as our consensus will give us §G+1§! §Tmagical experience§! scaling with §YMage Estate Influence§!."
 I69_answer_irdu_1: "Codifying this as our consensus will give us §G-10%§! §Ydevelopment cost§! scaling with §YMage Estate Influence§!."
 I69_answer_filust_1: "Codifying this as our consensus will give us §G+20%§! §YManpower Recovery Rate§! scaling with §YMage Estate Influence§!."
 
 flavour_star_rider.7.t: "The Ways of our Rituals"
 flavour_star_rider.7.de: "Debate regarding how our Rituals should be organized."
 flavour_star_rider.7.a: ""A period of fasting to commemorate our exodus!""
 flavour_star_rider.7.b: ""To ruminate and commune with Irdaeos' messengers, whether they are rocs or shamans!""
 flavour_star_rider.7.c: ""To enjoy all that the plains give to us!""
 flavour_star_rider.7.d: ""To test our mettle in valorous competition!""
 
 I69_answer_maslekh_2: "Codifying this as our consensus will allow us to hold §TMaslekhuga Festivals§! without inviting their scholars. Holding that festival will give us §G30§! reform progress each time."
 I69_answer_malekh_2: "Codifying this as our consensus will allow us to hold §TMalukhuga Festivals§! without inviting our...? scholars. Holding that festival will give us §G50§! mana each time."
 I69_answer_irdu_2: "Codifying this as our consensus will allow us to hold §TIrdukhuga Festivals§! without inviting their scholars. Holding that festival will give us §G0.75§! years of income each time."
 I69_answer_filust_2: "Codifying this as our consensus will allow us to hold §TFilustkhuga Festivals§! without inviting their scholars. Holding that festival will give us §G1§! year of manpower each time."

 flavour_star_rider.8.t: "The Essence of Virtue"
 flavour_star_rider.8.de: "Debate regarding what it is that we need to do to get to Ik Magthaal."
 flavour_star_rider.8.a: ""To persevere and endure hardship!""
 flavour_star_rider.8.b: ""To revere those who wield magic!""
 flavour_star_rider.8.c: ""To be gregarious and hospitable!""
 flavour_star_rider.8.d: ""To find glorious death in battle!""
 
 I69_answer_maslekh_3: "Codifying this as our consensus will reduce our §YGlobal Tax Modifier§! by §R-5%§! scaling with §YMage Estate Influence§!."
 I69_answer_malekh_3: "Codifying this as our consensus will reduce our §YMage Estate Loyalty§! by §R-2.5%§! scaling with §YMage Estate Influence§!."
 I69_answer_irdu_3: "Codifying this as our consensus will reduce our §YForeign Spy detection§! by §R-50%§! scaling with §YMage Estate Influence§!."
 I69_answer_filust_3: "Codifying this as our consensus will increase our §YMonthly War Exhaustion§! by §R0.01§! scaling with §YMage Estate Influence§!."

 flavour_star_rider.9.t: "The Ones Who Guide Us"
 flavour_star_rider.9.de: "The path leading to the future.\nThis debate is just a pretense, all shamans have already agreed on the outcome of this debate.\nConsensus is upon us."
 flavour_star_rider.9.a: ""A strong figure, to keep our traditions alive!""
 flavour_star_rider.9.b: ""The shamans must guide us, as they have done before.""
 flavour_star_rider.9.c: ""No one centaur can rule alone! We are a people!""
 flavour_star_rider.9.d: ""Revenge guides us. There is no need for fancy organization.""
 
 I69_answer_maslekh_4_fake: "£no£This conclusion would give us §G+30%§! §YMaximum Effective Absolutism§! scaling with §YMage Estate Influence§! and allow us to form §YLejdazamh§!.\n§RBut such a conclusion will never come to pass in this assembly.§!£no£"
 I69_answer_malekh_4: "£yes£It is done. We will form §YTaryeanzamh§!, getting §G+1§! §YTolerance of the True Faith§! scaling with §YMage Estate Influence§!!£yes£\nAll that is left is to implement the §Yprivilege§!, to codify this consensus."
 I69_answer_irdu_4_fake: "£no£This conclusion would give us §G-50%§! §Yre-election cost§! scaling with §YMage Estate Influence§! and allow us to form §YAltorzamh§!.\n§RBut why would we give such quarter to the uneducated non-shamans?§!£no£"
 I69_answer_filust_4_fake: "£no£This conclusion would give us §G+50%§! §YRazing Power Gain§! scaling with §YMage Estate Influence§! and allow us to form §YKhüraen Ulaeg§!.\n§RBut we have seen the exploits and the breaking of the Great Incursion. Such a conclusion will never happen.§!£no£"

 I69_maslekhuga_answer_3: "We will inherit all subjects with the §YMaslekhuga school§! at no cost.\n"
 I69_maslekhuga_answer_2: "We will inherit all subjects with the §YMaslekhuga school§! at a cost of 5 dip per dev.\n"
 I69_maslekhuga_answer_1: "We will reduce the §YLiberty desire§! all subjects with the §YMaslekhuga school§! by 25%.\n"
 I69_maslekhuga_answer_0: "The maslekhuga seem unimpressed with the assembly. Not that it matters.\n"

 I69_malukhuga_answer_4: "So resplendent. So glorious. The Stormbringer can not arrive soon enough. WATCH OUR PIETY! OBSERVE OUR DEVOTION, STORMBRINGER!\n"
 I69_malukhuga_answer_3: "We will inherit all subjects with the §YMalukhuga school§! at no cost.\n"
 I69_malukhuga_answer_2: "We will inherit all subjects with the §YMalukhuga school§! at a cost of 5 dip per dev.\n"
 I69_malukhuga_answer_1: "We have achieved what we needed to.\n"

 I69_irdukhuga_answer_3: "We will inherit all subjects with the §YIrdukhuga school§! at no cost.\n"
 I69_irdukhuga_answer_2: "We will inherit all subjects with the §YIrdukhuga school§! at a cost of 5 dip per dev.\n"
 I69_irdukhuga_answer_1: "We will reduce the §YLiberty desire§! all subjects with the §YIrdukhuga school§! by 25%.\n"
 I69_irdukhuga_answer_0: "The irdukhuga seem distraught that their amendments were rejected. Who cares.\n"

 I69_filustkhuga_answer_3: "We will inherit all subjects with the §YFilustkhuga school§! at no cost.\n"
 I69_filustkhuga_answer_2: "We will inherit all subjects with the §YFilustkhuga school§! at a cost of 5 dip per dev.\n"
 I69_filustkhuga_answer_1: "We will reduce the §YLiberty desire§! all subjects with the §YFilustkhuga school§! by 25%.\n"
 I69_filustkhuga_answer_0: "The filustkhuga scream meaninglessly. They should calm down, lest the assembly makes them.\n"

 #Comet Sighted option
 EVTOPTSTARRIDERCOMET5060: "Rejoice as you watch the star rider in the sky!"
 I69_likes_comets: "There is no reason to fear. Only reason to celebrate."
 I69_likes_comets_tt: "There is no reason to fear. Only reason to celebrate."

 #Estate Privileges
 estate_mages_organization_decimated_shamans: "Decimated Shamans"
 estate_mages_organization_decimated_shamans_desc: "Our insolence has lead us to this point. We ignored the warning of the stars and are now stumbling in darkness, bereft of those capable of reading them."
 I69_decimation_repentance_tt: "Repent. Atone for your sins."
 estate_mages_I69_codification_of_our_consensus: "Codification of our Consensus"
 estate_mages_I69_codification_of_our_consensus_desc: "Cheer, Centaurkind! Consensus amongst our ways have been achieved. Never shall we stray from Irdaeos' path again, as we understand any and all of facets of his worship!"
 I69_finalized_consensus_tt: "We must have codified our faith. This is our purpose. This is our way of showing repentance. This is our way of ensuring prosperity for our kind."
 I69_codification_explanation: "The effects of this privilege depend on our favoured choices in the §Yconclave of shamans§!."
 I69_maslekhuga_festival: "Allows us to hold the §YUndergo Rites of Maslekh§! religious interaction without inviting a scholar. We will also get §G30§! §Ygovernment reform progress§! whenever we hold it."
 I69_malukhuga_festival: "Allows us to hold the §YCommune with the Shamans§! religious interaction without inviting a scholar. We will also get §G50§! §Tmana§! whenever we hold it."
 I69_irdukhuga_festival: "Allows us to hold the §YHold a Festival§! religious interaction without inviting a scholar. We will also get §G0.75§! §Yyears of income§! whenever we hold it."
 I69_filustkhuga_festival: "Allows us to hold the §YHold a Tournament§! religious interaction without inviting a scholar. We will also get §G1§! §Yyear of manpower§! whenever we hold it."

 #Modifiers
 I69_starstruck_observatory: "Starstruck Observatory"
 I69_starstruck_observatory_desc: "Be careful to not lose yourself in the magnificence of the sky here."
 I69_reclamation_of_magic: "Reclamation of Magic"
 I69_reclamation_of_magic_desc: "Us getting chastened for our blasphemy was inevitable. Us returning to the forefront of the plains was inevitable.\nThere is a certain kind of beauty in how this panned out."
 I69_festival: "Festivals of Irdaeos"
 I69_festival_desc: "§RUnderstanding§!. §GComprehension§!. §PConsensus§!.\nOur knowledge of our worship expands.\n\nHolding an §YIrdaeos Worship Festival§! will increase our §TMana§! by §T10§! and our §YMage Estate influence§! by §Y15%§! for 30 years."
 I69_tributary_influence: "Mage-Tithe"
 I69_tributary_influence_desc: "The Mage-Tithe in effect!"
 I69_cooldown: "Cooldown"
 I69_cooldown_desc: "Cooldown for Star Rider things. Hello, Player."

 I69_ritual_influence_effect_tt: "Malukhuga Communion: $VAL|Y$§Y%§!"

 #Custom UI button
 I69_shamanic_influencing_button_tt: "Tighten our Grip"
 I69_shamanic_influencing_button_2_tt: "We will shatter their caehnate into pieces. All of their splinters will become our tributaries."
