l_english:
 I69_caillumh_ughea_title:0 "Caillumh Ughea"
 I69_caillumh_ughea_desc:0 "A steep, inhospitable path along the mountainside. A geoglyph, etched into the stone; That is Caillumh Ughea. We knew of it, but our shamans have taken the knowledge of this spot to their watery graves.\nWe will sing praises here, observe the skies and tell stories. And our cries will be answered and magic returns. "

 I69_interpreting_the_signs_title:0 "Interpreting the Signs"
 I69_interpreting_the_signs_desc:0 "There, atop Caillumh Ughea, we see the Scale in the skies; describing the need for us to not dominate the other sects, but to understand their ways to reach a consensus, not enforce one."

 I69_presents_for_the_faithful_title:0 "Presents for the Faithful"
 I69_presents_for_the_faithful_desc:0 "And it is then when the great Starfire fell upon the mountain. That skyborne tear, inhibiting pure magic in its form. We thank you, Irdaeos!"

 I69_mountainborne_ghanzamh_title:0 "Mountainborne\nGhanzamh"
 I69_mountainborne_ghanzamh_desc:0 "To be devoted to Irdaeos is to ruminate.\nTo read the sky as best we can. All like-minded people from far and wide will see our devotion and come to our aid, shamans included!"

 I69_burying_our_relatives_title:0 "Burying our Relatives"
 I69_burying_our_relatives_desc:0 "The waves still bring us our fallen brethren. Their bloated corpses. We will grant them the best burials, despite their deaths being decades ago and our subjects will be eager to support us."

 I69_reversing_negeal_title:0 "Reversing Negeal"
 I69_reversing_negeal_desc:0 "The reversal of the annihilation of a tribe...\nBreaking the giant caehnates is a necessity. Every corner of the plains shall be recognized and be invited to the coming conclave, for that is how we attain all interpretations!"

 I69_the_ram_title:0 "The Ram"
 I69_the_ram_desc:0 "The stubborn ram;\n A sign for those who believe that to struggle is to live. That to crawl is to breathe.\nTheir school, the oldest of our worship, will be easily convinced of the necessity of consensus"

 I69_faint_and_far_title:0 "Faint and Far"
 I69_faint_and_far_desc:0 "What does it mean to live in the darkness? What have we lost when our light was snuffed out?\nIt matters little, now."

 I69_the_tent_title:0 "The Tent"
 I69_the_tent_desc:0 "The gathering tent;\nA sign for those unbothered by the cruelties of this world. Drifting along meaninglessly.\nTheir contribution to the conclave is small, but necessary."

 I69_the_roc_title:0 "The Roc"
 I69_the_roc_desc:0 "The resplendent roc, soaring the skies.\nThe resplendent Stormbringer, circling amongst the clouds above us.\nThe conclave is upon us, consensus draws near."

 I69_tithing_their_shamans_title:0 "Tithing their Shamans"
 I69_tithing_their_shamans_desc:0 "The mechanism of re-establishing a mage organization from nothing is monumental. We also do not have the option of doing it the slow and proper way.\nA great Mage-Tithe must therefore established, and all of our subjects must oblige!"

 I69_consensus_of_the_eastern_tribes_title:0 "Consensus of the Eastern Tribes"
 I69_consensus_of_the_eastern_tribes_desc:0 "To reach a consensus is to reach divinity.\nThat is our goal.\nOur subjects must understand this truth and support us in this endeavor."

 I69_the_crow_title:0 "The Crow"
 I69_the_crow_desc:0 "The vengeful crow;\nA sign for those driven by bloodlust and the intrinsic desire to die in combat.\nAnd as such, it must be snatched and kept safe, lest it lash out once more."


