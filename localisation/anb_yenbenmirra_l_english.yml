 festival_of_flame:0 "§YFestival of Flame§!"
 desc_festival_of_flame:0 "Many outsiders see the Gift of Fire as a weapon that burns the evil so the righteous can live to fight another day, but we know that the flames hide so much more. Let us celebrate its beauty and light in a great festival dedicated to the rebirth of nature that follows the cleansing of its warmth.\n--------------\nEvery owned province with both §YHuman§! and §YMechanim§! population get §G-10%§! Local Development Cost for §Y10§! years.\n--------------\nIf we understand the §OGift of Fire§!:\n    §Y5% chance§! to gain an extra development when developing one of our provinces with the '§YFestival of Flame§!' modifier."
 festival_of_flame_tt:0 "§YHumans§! and §YMechanim§! will help develop our land."
