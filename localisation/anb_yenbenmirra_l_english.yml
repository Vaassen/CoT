 #Hinui Hunters
 yenbenmirra_hinui_hunters_00:0 "Hinui Hunters: Wanderer"
 yenbenmirra_hinui_hunters_00_desc:0 "The tribe is followed by a few hinui hunters who help protect them as they migrate.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."

 yenbenmirra_hinui_hunters_01:0 "Hinui Hunters: Scout"
 yenbenmirra_hinui_hunters_01_desc:0 "Hinui hunters scout ahead the tribe so those not ready to face the creatures of the Underworld may walk the path safely.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."
 
 yenbenmirra_hinui_hunters_02:0 "Hinui Hunters: Innitiate"
 yenbenmirra_hinui_hunters_02_desc:0 "If one wishes to become a true hinui hunter they must face the beasts who would see our goddess dead. Those who do not return are mourned by all, but those who live shall be remembered in our tales forever.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."
 
 yenbenmirra_hinui_hunters_03:0 "Hinui Hunters: Warrior"
 yenbenmirra_hinui_hunters_03_desc:0 "A hinui hunters life is full of peril. To be a warrior is to hone your skill not only against beasts but men who wish ruin upon the tribe as well.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."

 yenbenmirra_hinui_hunters_04:0 "Hinui Hunters: Elder"
 yenbenmirra_hinui_hunters_04_desc:0 "Not many hinui hunters live to see their hair gray, but those who do share their tales with the future generations who shall sing these songs about them evermore.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."

 yenbenmirra_hinui_hunters_05:0 "Hinui Hunters: Warchief"
 yenbenmirra_hinui_hunters_05_desc:0 "Amongst the most skilled hinui hunters, a leader is selected to help coordinate the fight against the Underworld and organize our warriors into a truly formidable force.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."
 
 yenbenmirra_hinui_hunters_06:0 "Hinui Hunters: Band"
 yenbenmirra_hinui_hunters_06_desc:0 "Some hinui hunters prefer to rely solely on themselves, but most know the best way to stay alive in the wilds is to band together and rely on the other's strength as much as you do on your own.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."

 yenbenmirra_hinui_hunters_07:0 "Hinui Hunters: Mob"
 yenbenmirra_hinui_hunters_07_desc:0 "Some hinui hunter bands grow so close together that they may be considered their own mob within the tribe, yet their duty to protect all who need it is something they'll never forget.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."
 
 yenbenmirra_hinui_hunters_08:0 "Hinui Hunters: Clan"
 yenbenmirra_hinui_hunters_08_desc:0 "Hunting brings people together, some closer than others. As our tribe grows it becomes more and more common to see clans whose ancestors have all been hinui hunters, passing down their knowledge to their children.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."

 yenbenmirra_hinui_hunters_09:0 "Hinui Hunter: Tribe"
 yenbenmirra_hinui_hunters_09_desc:0 "The road has been long and hard and it forged our tribe into one of highly skilled warriors well versed in the ways of the hinui hunters. Many say it is time we settle, but there are some who still believe that our journey must still continue.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."

 yenbenmirra_hinui_hunters_10:0 "Hinui Hunters: Nation"
 yenbenmirra_hinui_hunters_10_desc:0 "We stand at the precipice of a new age as we prepare to finally wake our long dormant brothers. There will be much we can share with them and we're sure they'll their their own tales, so come now proud hinui hunter, let us form this new nation and let our real fight against the Underworld begin.\n--------------\nThe hinui hunters of this tribe are protecting §Y[Root.Owner.children_of_fire_count.GetValue] Children of Fire§!."

 #Dunborgula
 collect_children_of_fire:0 "§YCollect Children of Fire§!"
 desc_collect_children_of_fire:0 "The land is littered with sleeping Children of Fire. We need to take them back to our capital so we will be with them when they awake once again.\n--------------\nWe will §Yscour§! every province in our lands or tribal lands that contain §Ydormant mechanim§! and bring them back to our capital. We cannot take any more §YChildren of Fire§! from a province that has already been §Yscoured§!.\n--------------\nIf we understand the §OGift of Fire§!:\n    Gain §G5§! Army Tradition."
 collect_children_of_fire_bonus_tt_YES:0 "£yes£ £icon_danguranga_fire_in_text£: §OGain 5 Army Tradition.§!"
 collect_children_of_fire_bonus_tt_NO:0 "£no£ £icon_danguranga_fire_in_text£: §OGain 5 Army Tradition.§!"

 charkuchin_recruits:0 "§YCharkuchin Recruits§!"
 desc_charkuchin_recruits:0 "Most of the Charkuchin keep to themselves staying in their citadels focusing on keeping the mountains clean of the corruption of the Underworld. Some however argue that a more drastic approach must be taken which can lead to unrest within the citadel. Perhaps we can convince our friends in the mountains to sponsor the journey of these more unruly Children of Mountains into the lowlands where they can assist us in our fight to keep the lowlands safe from all evils.\n--------------\nGain §G50§! Crowns.\nGain §G5000§! Manpower.\n§YCharkuchin§! nation's opinion of §Yus§! changes by §G+50§!.\n--------------\nIf we understand the §gGift of Mountains§!:\n    If the §YCharkuchin§! nation is ahead of us in technology:\n        Gain §G+25§! Monarch Power in that category."
 charkuchin_recruits_tt:0 "Receive §G50§!¤ and §G5000§!£icon_manpower£ from our §YCharkuchin§! friends."
 charkuchin_recruits_bonus_tt_YES:0 "£yes£ £icon_danguranga_earth_in_text£: §gGain 25£adm£/£dip£/£mil£ if their £icon_technology_in_text£ is higher.§!"
 charkuchin_recruits_bonus_tt_NO:0 "£no£ £icon_danguranga_earth_in_text£: §gGain 25£adm£/£dip£/£mil£ if their £icon_technology_in_text£ is higher.§!"
 
 mangrove_republics_sponsors:0 "§YMangrove Sponsors§!"
 desc_mangrove_republics_sponsors:0 "The people living in the Mangrove Republics would be threatened should we fail our sacred duties in burning the invasive hinuifauna and fauna. They know this as well as we do, and have offered us support in our efforts.\n--------------\nIf we §YDON'T§! have the §YLeaders of Fire§! Government Reform:\n    Gain §G25§! Government Reform Progress.\nIf we have the §YLeaders of Fire§! Government Reform:\n    Gain §G50§! Administrative Power.\n§YTaga'ala§! nation's opinion of §Yus§! changes by §G+50§!.\n--------------\nIf we understand the §MGift of Water§!:\n    A random §G75%§! cost §YTaga'ala§! advisor joins our court."
 mangrove_sponsors_1_tt:0 "Receive §G25§!£icon_reform_progress_in_text£ from our §YTaga'ala§! friends."
 mangrove_sponsors_2_tt:0 "Receive 25£adm£ from our §YTaga'ala§! friends."
 mangrove_sponsors_bonus_tt_YES:0 "£yes£ £icon_danguranga_water_in_text£: §MGain a random 75% cost Taga'ala advisor.§!"
 mangrove_sponsors_bonus_tt_NO:0 "£no£ £icon_danguranga_water_in_text£: §MGain a random 75% cost Taga'ala advisor.§!"
 
 support_tribe_growth:0 "§YSupport Tribal Growth§!"
 desc_support_tribe_growth:0 "Where we need our men is in our homes, supporting our tribes, keeping our people fed and safe. Recall our messengers and tell them we are holding a feast tonight.\n--------------\nWe get '§YSupporting Tribal Growth§!' for §Y5 years§!, giving the following effects:\n    Tribal Development Growth: §G+0.02§!\n--------------\nIf we understand the §gGift of Mountains§!:\n    '§YSupporting Tribal Growth§!' gives the following effect:\n        Tribal Development Growth: §G+0.02§!\n        Settle Cost: §G-10%§!"
 support_tribal_growth_tt:0 "Gain §G+0.02§!£icon_tribal_development_growth_in_text£ for 5 years."
 support_tribal_growth_bonus_tt_YES:0 "£yes£ £icon_danguranga_earth_in_text£: §gAlso gain -10% Settle Cost.§!"
 support_tribal_growth_bonus_tt_NO:0 "£no£ £icon_danguranga_earth_in_text£: §gAlso gain -10% Settle Cost.§!"
 dunborgula_supporting_tribal_growth:0 "Supporting Tribal Growth"
 dunborgula_supporting_tribal_growth_desc:0 ""
 dunborgula_supporting_tribal_growth_2:0 "Supporting Tribal Growth"
 dunborgula_supporting_tribal_growth_2_desc:0 ""

 the_fightback:0 "§YThe Fightback Begins§!"
 desc_the_fightback:0 "Children of Water and Children of Fire stand side by side. It is time. Go beyond the mountains and retake the world from those monsters. For the Goddess!\n--------------\nGain §G+0.2%§! Army Morale for provinces that have both §YHuman§! and §YMechanim§! population, up to a maximum of §G+20%§!, for §Y5§! years.\n--------------\nIf we understand the §OGift of Fire§!:\n    We get '§YExemplary Officers§!' for §Y5 years§!, giving the following effects:\n    Yearly Army Tradition: §G+1§!"
 the_fightback_tt:0 "§YDanguranga's Children§! will fight more fiercely when united."
 the_fightback_bonus_tt_YES:0 "£yes£ £icon_danguranga_fire_in_text£: §OGain +1 Yearly Army Tradition for 5 years.§!"
 the_fightback_bonus_tt_NO:0 "£no£ £icon_danguranga_fire_in_text£: §OGain +1 Yearly Army Tradition for 5 years.§!"
 dunborgula_the_fightback:0 "The Fightback"
 dunborgula_the_fightback_desc:0 "We will retake Insyaa!"

 spread_the_goddess_people:0 "§YSpread the Goddess' People§!"
 desc_spread_the_goddess_people:0 "Now that the Children of Fire finally awakened we must find a place for them. Let us make sure that all clans have at least one mechanim watching over them so they can help each other out in adapting to these strange new times we find ourselves in.\n--------------\nA random owned province with at least §Y10 Development§! and §Yno Mechanim population§! gains a '§YSmall Mechanim Minority§!'.\n--------------\nIf we understand the §MGift of Water§!:\n    §Y50% chance§! that the affected province gains one random development as well."
 spread_the_goddess_people_tt:0 "Some of the §YMechanim§! settle within our lands."
 spread_the_goddess_people_bonus_tt_YES:0 "£yes£ £icon_danguranga_water_in_text£: §M50% chance to gain +1 Random Development in affected province.§!"
