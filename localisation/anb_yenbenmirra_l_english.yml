l_english:

 #Yenbenmirra
 yenbenmirra_tribe:0 "Yenbenmirra Tribe"
 yenbenmirra_tribe_desc:0 "Guarding the lowlands from the spread of hinuiflora and fauna, the Yenbenmirra have been moving across the jungles of west Insyaa and conducting ritual burnings of any stray piece of hinuiflora that enters their lands. Though often dangerous, these burnings hold great religious and societal importance, and any tribe not doing their due dilligence in containing the spread of dangerous flora and fauna is considered to have failed both their people and the land itself."
 yenbenmirra_leaders_of_fire:0 "Leaders of Fire"
 yenbenmirra_leaders_of_fire_desc:0 "With thousands of Children of Fire in our tribe, we feel closer than ever to our dream. Yet this old method of migrating our home no longer makes sense. Set up a permanent capital, send our people with the supplies needed to combat the spread of the hinuiflora and fauna, and come back with more Children of Fire."
 yenbenmirra_cultivate_the_lowland:0 "Cultivate the Lowland"
 yenbenmirra_cultivate_the_lowland_desc:0 "Now that we have abandoned our migratory ways, it's time to change how we approach the lands we call home. Plant seeds, till the soil, divert water from the rivers, flood the plains. Take every skill we have passed down through our words and memories and let us take control of this land the Goddess has given us."
 yenbenmirra_federation:0 "Yenbenmirra Federation"
 yenbenmirra_federation_desc:0 "With the awakening of the Children of Fire and the unification of Bomowoka, a new age has begun for the Yenbenmirra. The smaller tribes are starting to federalize and borders are being drawn, but this does not mean that they abandoned their old traditions. Many clans still live semi-nomadic lives, wandering between settlements, each being represented by their own Clan Elders who always have the ear of the current leader of the nation, the Grand Elder."

 bomowoka_nation_title:0 "Awaken the Children of Fire"
 bomowoka_nation_desc:0 "We are ready. We have the knowledge. We have the power. We, the Children of Water, have gathered an army of Children of Fire. When they awaken, they shall awaken amongst their comrades. They shall see that we are prepared to lead them in retaking all that the Goddess made us."

 ritual_burning_title:0 "Conduct Ritual Burning"
 ritual_burning_desc:0 "Burn all our §Ytribal lands§! to cleanse it of invasive hinuifauna and flora!"
 yenbenmirra_ritual_burning_tt:0 "Remove all §YTribal Land§! we own and gain §R25 Devastation§! in affected provinces.\nWe will gain §Y25 Church Power§! for every province of §Ytribal land§! we burn.\nIf we are a §Ymigratory tribe§!, our §Ycapital§! also gains §R50 Devastation§!.\n"

 yenbenmirra_settle_down_title:0 "Settle Down"
 yenbenmirra_settle_down_desc:0 "We might have lost the race to awaken the Children of Fire but our story does not end here. We shall fight against the Underworld until the end of times and we shall do so on our own, however if we want to stand a chance against the growing corruption on the East, we must change and adapt just as Bomowoka did."

 yenbenmirra.3.t:0 "Collect the Children of Fire"
 yenbenmirra.3.d:0 "Across the lowlands lie our sleeping breatheren. When the goddess made us, the Children of Water, she also made the Children of Fire. They were supposed to fight by us. And yet they sleep, for neither we nor they were ready to take the fight to the jungle.\n\nWhen they next awaken, they must see that they are not alone. We will gather them all in one place - a long and tiring process for sure, but one that must be done."
 yenbenmirra.3.a:0 "Gather the Children of Fire"
 yenbenmirra.3.b:0 "Never Mind"

 yenbenmirra.4.t:0 "The Children of Fire"
 yenbenmirra.4.d:0 "Our grandparents shared with us a story. They were there when the Children of Fire awoke. These people, hewn from metal, lay asleep across the lowlands. We knew the Goddess had a plan for them, but we were not ready. When they awoke, they looked at what we had built, saw they were alone, and knew they could never retake Insyaa at this time. So back into their long slumber they fell.\n\nFor decades the mystery of why they fell back asleep evaded us. But in the past decade, many amongst the Yenbenmirra feel they knew the answer. They saw they were alone, so we must put them all together. Collect the Children of Fire from across the lowlands, so that when they awaken, they will see their comrades.\n\nWe must continue our sacred task of burning all invasive hinuiflora and fauna to keep our people and this land safe. But while we do so, we will have a second task: Collect all of the Children of Fire. And when they awaken, we will be the ones to lead them to retake Insyaa!"
 yenbenmirra.4.a:0 "We will unite the Children of Fire"

 yenbenmirra.5.t:0 "Our Children of Fire Collection Grows"
 yenbenmirra.5.d:0 "A great feast was held tonight, as we celebrated our growing contingent of dormant Children of Fire. It takes a full tribe's effort to move our collection as we migrate, but we know it will all be worth it."
 yenbenmirra.5.a:0 "A great day"

 yenbenmirra.6.t:0 "Our Children of Fire Collection Grows"
 yenbenmirra.6.d:0 "As our collection grows, so do the number of outsiders coming to our lands to join us and be on our side once we find a way to awaken the Children of Fire. However our rivals also become more and more jealous, sending raiders and thieves to claim our prize for themselves, a clear sign that our collections have become a lot better."
 yenbenmirra.6.a:0 "Damn right it has"

 yenbenmirra.7.t:0 "Our Children of Fire Collection Grows"
 yenbenmirra.7.d:0 "As the sun rises overhead, it glints over an army of sleeping Children of Fire, all sitting side-by-side, awaiting the day they wake together. The collection has grown so large, it has become an immense operation to move them. Perhaps we should think about setting up a permanent home for our people?"
 yenbenmirra.7.a:0 "A permanent home eh?"

 yenbenmirra.8.t:0 "Our Children of Fire Collection Grows"
 yenbenmirra.8.d:0 "It is done. We have gathered thousands of Children of Fire and soon they shall walk amongst us once more. Some final preparations must be made before we can truly walk into this new age but once we are done and they are awake we shall slay the monsters of the Underworld and free Danguranga from their grasp."
 yenbenmirra.8.a:0 "A new age for the Yenbenmirra awaits"

 yenbenmirra.9.t:0 "Disaster!"
 yenbenmirra.9.d:0 "Tragic news comes from one of the warriors who were left to guard the Children of Fire as we fought our war against the enemy. It seems as soon as they broke our defenses they headed for our dormant brethren, taking as many as they could and burning all who tried to defend them."
 yenbenmirra.9.a:0 "Our loss will not be forgotten"

 yenbenmirra.10.t:0 "The Birth of Mumambarra"
 yenbenmirra.10.d:0 "With the recent awakening of the Children of Fire, most of our people expected that our siblings would immediately start the fight against the Underworld, however it seems like they don't remember much from the ages before they fell into their long slumber and many of them, just like us, have their own goals and aspirations that don't fit our typical conceptions of what they would be like. This new perspective on our newly awakened family has brought many changes, while most of the Yenbenmirra still see the mechanim as some sort of mythical beings and nearly worship them, some are starting to think they are just like them so they share their own gifts and burdens and most of the mechanim happily accept them. Even amongst the peaks of the Charkuchar some have begun to question their old ways and started calling their ancestors defensive and admittedly more isolated stance atop the mountains as cowardly and they call for their leaders to begun the fight against the Underworld. There is only one question that remains and that is, which direction shall our own country take?"
 yenbenmirra.10.a:0 "It will take time but we accept the change."
 yenbenmirra.10.b:0 "Change brought us here, it shall guide us ever further."
 yenbenmirra.10.c:0 "We stayed atop our mountains for too long, it is time we strike back!"
 yenbenmirra.10.e:0 "Everyone has their own path, and we already found ours."

 yenbenmirra_startup_tt:0 "The West Insyaan Lowlands are filled with §YDormant Mechanim§!. Conduct §YRitual Burnings§! to gain church power, then use that church power to §YCollect the Children of Fire§!. As our collection grows, our need for ritual burning decreases, and the closer we get to reforming.\n"
 
