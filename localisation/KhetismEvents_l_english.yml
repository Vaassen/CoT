l_english:

khetism_events.1.t: "A Stickler for the Rules?"
khetism_events.1.d: "Khetists are often bewildered by the many varying aspects of their faith. Officially, they worship Elikhet and his kin above all others and, for the more formal parts, the rulings of the Eldkhet. But these rulings are few and far-between, given the lazy natures of even the oldest and most respectable – if their behaviour could be called that – Khets. So when it comes to the different sects and their customs, most people leave each other to their own ways. Recently however, a priest has objected to [Root.Adm_Advisor.GetName]’s practice of some esoteric ritual, of which they say is technically incorrect and should be punished. [Root.Adm_Advisor.GetName] argues that it is not the priest’s place to speak on this and that it is an overreach from them."
khetism_events.1.a: "Does it really matter?"
khetism_events.1.b: "Oh really? Well, if you say so."

khetism_events.2.t: "Late to the Liturgical Party"
khetism_events.2.d: "Last night’s sacrifice to Elikhet went well, except for the small detail of the scholar responsible for the sacrifice proceedings turning up late, half-drunk on the finest Oronsinoman banana beer. The following events meant that instead of the pig guts required for that specific ceremony – according to the Eldkhet Decree of 867 AA – measly chicken feet were set on the pyre. This has left a group of very angry clergy and disappointed revelers."
khetism_events.2.a: "Oh dear"
khetism_events.2.b: "Blame it on him then!"

khetism_events.3.t: "A Completely Valid Interpretation"
khetism_events.3.d: "Our great scholars have found a semantic loophole in the words left by Elikhet! Instead of a semicolon, a comma should have been used, and now it claims we own the whole world! While the rest of Halann may not take us seriously, we nonetheless have a newfound confidence and pride that we will bring to the negotiating table when we embark on our next conquests!"
khetism_events.3.a: "Why, this makes complete sense and doesn't sound fake at all!"
khetism_events.3.b: "Don't be ridiculous"

khetism_events.4.t: "We Cannot All Do Great Things…"
khetism_events.4.d: "[Root.Ruler.GetName] was working in [Root.Ruler.GetHerHis] study before [Root.Ruler.GetSheHe] looked out of [Root.Ruler.GetHerHis] window, bored of [Root.Ruler.GetHerHis] endless paperwork and the machinations of the realm. Looking around [Root.Capital.GetCapitalName], [Root.Ruler.GetHerHis] eyes wandered and noticed many things. The children running around on the streets, vendors selling their many wonderful wares, even a local priest giving alms to the poor. [Root.Ruler.GetName]’s eyes lingered on the priest, and coming to the forefront of [Root.Ruler.GetHerHis] mind were memories from when [Root.Ruler.GetSheHe] was a child, of when [Root.Ruler.GetName]’s tutors taught [Root.Ruler.GetHerHim] of the many tenants of Khetism –  specifically, that of charity and giving to the poor. As the [Root.Ruler.GetTitle], the most powerful person in the land and the role model of the people, was [Root.Ruler.GetSheHe] not also supposed to take part in this virtue?"
khetism_events.4.a: "...But we can do small things with great love"
khetism_events.4.b: "...But the world can learn from us"
khetism_events.4.c: "Bah, Humbug!"

khetism_events.5.t: "A Riverside Farm"
khetism_events.5.d: "The people of the Khetist faiths have long since learned to respect rivers great and small –  their ancestors having been taught by the capricious floods of many a great river. Knowing this, Elikhet left many teachings on how to care for them and use them for endeavors such as agriculture, watermills and other production methods. One of our priests, in tandem with a farmer, has managed to use one of these teachings – with a few tweaks – to tremendous effect, creating a spell to promote growth and prosperity on even the smallest of rivers and tributaries. The massive new stocks of grain and livestock must be put to use, but to what end?"
khetism_events.5.a: "For the troops!"
khetism_events.5.b: "For the people!"