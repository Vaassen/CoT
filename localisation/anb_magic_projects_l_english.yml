 magic_project.404.t:0 "§RERROR 404§!: MAGIC PROJECT COMPLETION EVENT NOT FOUND"
 magic_project.404.d:0 "Hello! You appear to have been advancing a project (i.e. had the country flag magic_project), but when the time came to actually complete that event, the system couldn't properly sort you! This is almost certainly because the dev forgot to make an entry in magic_project.0 in events/Magic_Project_Events.txt, which is the event that sorts you into the right ending effect.\n\nOther common issues include: accidentally making a ruler_flag instead of a country_flag (ruler flags and country flags are NOT the same), misspelling either the flag set or check, or forgetting to make this logic part of the giant if-else chain in any of the sorting events.\n\nAlso check the event magic_system.0 in events/Magic_System_Events.txt, to make sure that the project has some in-progress events!"
 magic_project.404.a:0 "Drat! This is a bug!"

