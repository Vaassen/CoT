 theatre_of_simulacra_bonuses:0 "Spirits Present in the Theatre of Simulacra"

 magic_project_theatre_of_simulacra.13.t:0 "The Theatre of Simulacra"
 magic_project_theatre_of_simulacra.13.d:0 "The Theatre of Simulacra! Never was there a structure more grand, more magnificent. They say that it was built without masons, without even an architect! Every night there is a play, put on by yourself. It shows another aspect of your personality, another facet of your highly complex being. It is a deeply confusing play, to tell the truth: actors often speak over one another, or there are even multiple conversations on-stage at once. It sometimes isn't clear whether it's a play, a musical, or an opera, or puppet theatre. Think about it too hard at once and your head starts to hurt. Concentrate on just one or two aspects, however, and it seems to make perfect sense."
