 #Tooltips
 A80_colony_finished_tt:0 "Our colonies will mostly have a human majority, with some halfling or gnome."
 A80_the_last_laughs_tt:0 "§YReaver Coast§! Area with §YReverian§! culture will become §YIochander§!"
 A80_iochandization_tt:0 "Enable the §YEstablish Hezoggdoum§! decision.\nSpecial subject always culture convert if these requirements are met:\n  Is core.\n  Religion in province is state religion.\n  Has no separatism.\n"
 A80_the_kobildmobb_tt:0 "\n§YKobold§! can now appear in our colonies.\n§YKobildmobb§! gains a permanent claim on §YDragon Coast§! Region with §YCavern§! terrain."
 A80_the_heart_of_iochand_tt:0 "Is §YCreek Gnome§! with §YHuman§!, §YHalfling§!, §YKobold§!, §YElf§!, and §YDwarf§! minority at §GCoexisting§! or §TIntegrated§!."
 A80_the_duchy_of_ronroy_tt:0 "If we won this war, §Y[B71.GetName]§! will become a Hezoggdoum."
 A80_oddanray_experiments_tt:0 "§YCloth§! will now be produced in §G4§! highest development §YWool§! provinces owned by §Y[Root.GetName]§! or its non-Tributary Subjects in §YDragon Coast§! Region."
 A80_dragon_coast_farmers_wine_tt:0 "§YWine§! will now be produced in §YDragondowns§! Area with §YFish§!."
 A80_dragon_coast_farmers_tobacco_tt:0 "§YTobacco§! will now be produced in §YDragondowns§! Area with §YFish§!.\nEvery owned province:\nOne of §Y3§! options will happen.\n§Y33.00%§! chance of:\n§GAdds/Increases§! §YKobold Minority Size§!\n§Y33.00%§! chance of:\n§GAdds/Increases§! §YHuman Minority Size§!\n§Y33.00%§! chance of:\n§GAdds/Increases§! §YHalfling Minority Size§!"
 A80_farming_reforms_of_southroy_tt:0 "Every owned province with §YFarmlands§! or §YGrasslands§! terrain gets '§YFarming Reforms Surplus§!' for §Y20 years§!, giving the following effects:\nLocal Goods Produced: §G+1.00§!\n"
 A80_farming_reforms_of_southroy_ttt:0 "Those effects will also apply to our subjects!\n"
 A80_free_the_small_tt:0 "All §YHalfling§! country with capital in §YSmall Country§! Region that is not §Y[A64.GetName]§! and §Y[A65.GetName]§! must has §Y75§! opinion of §Y[Root.GetName]§!."
 A80_free_the_small_ttt:0 "Any §YNon-Halfling§! country that owns at least a province in §YSmall Country§! Region must has a Spy Network of at least size §Y40§! from §Y[Root.GetName]§!."
 A80_free_the_small_tttt:0 "If any §YNon-Halfling§! country has a foothold in §YSmall Country§! Region, we will organize a revolt using spies and lies, with most halflings joining the war on our side."
 A80_agitate_the_small_country_tt:0 "Every §YHalfling§! country except §Y[A64.GetName]§! and §Y[A65.GetName]§! will rise in revolt and allied with us till the end of §YSecond Small War§!.\nEvery §YNon-Halfling§! country with a presence in §YSmall Country§! Region will side our enemy.\n"
 A80_expand_the_theatre_temples_tt:0 "From now, every province with a §YTax Building§! owned by §Y[Root.GetName]§! or our §YSpecial§! subjects gets '§YExpanded Theatre§!' until the end of the game, giving the following effects:\nLocal Unrest: §G-2.00§!\nLocal Tolerance of Heretics: §G+2.00§!\n\nEvery province with a §YTax Building§! cored by §Y[Root.GetName]§! or our §YSpecial§! subjects will be §YIochandized§!."
 A80_the_kingdom_of_paradise_tt:0 "§YDaccasded§! gets §Y[Root.GetName]§!'s national idea."
 A80_the_kingdom_of_paradise_ttt:0 "§RDiverting trade from §YDaccasded§! will slowly become more costly.§!\nAny newly conquered or finished colony in §YRuin Proper§! Subcontinent and §YSoruin§! Region will be transfered to §YDaccasded§!.\nEnable §DConcede Ruin Circle§! peace treaty for §YConquest§! and §YColonialism§! Casus Belli. Using it will force main war enemy to concede §YRuin Proper§! Subcontinent and §YSoruin§! Region to §YDaccasded§!.\n"
 A80_cider_and_perry_tt:0 "§YSmall Country§! Region producing §YWine§! gets '§YCider and Perry§!' until the end of the game, giving the following effects:\nLocal Goods Produced: §G+1.00§!\n"
 A80_our_friends_the_gommo_tt:0 "Any newly conquered or finished colony in §YTorn Gates§! Subcontinent will be transfered to §YThe Triacrchy§!."
 A80_the_trio_of_thinking_tinkerers_tt:0 "§YThe Triacrchy§! is allied with us and has §YImproved Relations§! at least §Y100§!"
 A80_the_trio_of_thinking_tinkerers_ttt:0 "§YGommoport§!, §YZurzumexia§!, and §YMestikardu§! (if they exist) are allied with us and have §YImproved Relations§! at least §Y75§!"
 A80_the_trio_of_thinking_tinkerers_tttt:0 "§YGommoport§!, §YZurzumexia§!, and §YMestikardu§! (if they exist) are allied with us and have §YImproved Relations§! at least §Y100§!"
 A80_the_forest_of_bludd_tt:0 "Enable the §YEstablish Hezoggdoum§! decision for countries in §YRuin Proper§! Subcontinent and §YSoruin§! Region.\nFor every §Y5 Hezoggdoum§! in §YAelantir§!, §Y[Root.GetName]§! gets the following effects:\nMerchants: §G+1§!\nGlobal Trade Power: §G+5.0%§!\nLand Force Limit: §G+5.00§!\nNaval Force Limit: §G+10.00§!"
 A80_animal_crop_farm_tt:0 "§Y6§! random province meeting the requirement will be §YIochandized§!.\nGain §G2 years§! of production income from §YWool§!, §YLivestock§!, and §YFish§! provinces."
 A80_red_roses_and_yellow_tulips_tt:0 "We will send a letter demanding §Y[A09.GetName]§!, §Y[A20.GetName]§!, and §Y[B78.GetName]§! (if they exist) to accept us as the true successor of Lorenan's High Kingdom and become our subjects. If they reject it, we will gain §YSubjugation§! Casus Belli.\n\nHaving over §G100§! opinion of us will improve their chance of accepting.\nThey will §Rreject§! us if they have more than §Y150§! total development."
 A80_the_birds_and_the_bees_tt:0 "§TIf the mission is completed through alliance with §Y[A12.GetName]§!:§!"
 A80_the_birds_and_the_bees_ttt:0 "We will be asking §Y[A12.GetName]§! nicely to become our subjects. If they reject it, we will gain §YSubjugation§! Casus Belli.\n\n§Y[A12.GetName]§! will §Rreject§! us if they have more than §Y150§! total development."
 A80_the_birds_and_the_bees_tttt:0 "§TIf the mission is completed with §Y[A12.GetName]§! as a regular subject:§!"
 A80_lords_of_the_ooberbay_tt:0 "We will be demanding every countries in §YTrollsbay§! Region their fealty to §YDaccasded§!.\n\nAn ally that meets the mission requirement will be guaranteed to accept this.\nHaving less than §G100§! opinion of us will guarantee their rejection. If we subjugate them later, they will automatically become Hezoggdoum subject."
 A80_city_on_the_grodroy_tt:0 "§G10§! random provinces owned by §Y[Root.GetName]§! or our subjects in §YTrollsbay§! Region get the following effects:\n    §GAdds/Increases§! §YGnomish Minority Size§!"
