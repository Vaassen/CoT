 gharmargma.16.t:0 "Devour the Genies"
 gharmargma.16.a:0 "Take their Wealth"
 gharmargma.16.b:0 "Take their Power"
 gharmargma.16.c:0 "Take their Magic"
 magic_list_ogre_spell_5_gharmargma: "Close the Contracts"
 magic_list_ogre_spell_5_gharmargma_desc: "Enact the binding! We will compel all our bound workers, servants, or people to slave away for our state!"
 gharmargma_project_2_complete_tt:0 "The genie-binding project is complete."
 gharmargma_project_1.desc: "§The College of Chains§!\n §g In the scrolls of old we have found details of how to bind and control people, animals, and even gods. We must dediate a branch of our magic towards this end§!"
 gharmargma_project_1: "College of Chains"
 gharmargma_project_1_lookahead: "We will search for lost knowledge and rediscover the secrets of binding and control."
 gharmargma_project_1_level: "College of Chains Progress"
 advancing_gharmargma_project_1_tt: "The [This.GetMagesName] are progressing the §YCollege of Chains§! Magical Project"
