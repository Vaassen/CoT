 OAK_EMBRACE_TOOLTIP:0 "We embrace the Oak, but what will we find in the leaves?"
 A_NEW_FUTURE_DIGOVEDAN:0 "We have become greater than anyone could've known, but so much more awaits us now!"
 DIGOVEDAN_RELIGION_PATH:0 "The Path of religion holds many mysteries, let us unlock them."
 OAK_COMMUNE_TOOLTIP:0 "Commune with the Oak for guidance, following its advice will give us boons no doubt."
