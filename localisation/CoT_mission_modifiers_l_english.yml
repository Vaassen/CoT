 whitescale_begin_the_communion_title:0 "Begin the Communion"
 whitescale_finish_the_communion_title:0 "Finish the Communion"
 whitescale_the_cave_path_title:0 "The Cave Path"
 whitescale_to_ebonshole_title:0 "To Ebonshole!"
 whitescale_command_the_depths_title:0 "Command the Depths"
 whitescale_crush_the_ebon_title:0 "Crush the Ebon"
 whitescale_the_pilgrimage_continues_title:0 "The Pilgrimage Continues"
 whitescale_settling_down_title:0 "Settling Down"
 whitescale_colonize_the_wastes_title:0 "Colonize the Wastes"
 whitescale_a_reformed_religion_title:0 "A Reformed Religion"
 whitescale_reformed_government_title:0 "Reformed Government"
 whitescale_go_through_desc:0 "We will not waste our time diverting the journey, the fastest path is through the traitors and so they shall be destroyed!"
 whitescale_go_past_desc:0 "Leave them in the ashes, and continue our trek South"
 whitescale_go_around_desc:0 "We are not yet strogn enough for a full on assault of the traitors. Let us exercise caution and sneak around their base."
 whitescale_encircle_the_prey_desc:0 "They are encircled with nowhere to run now, it is time to spring the trap and force them into submission."
 whitescale_shroom_path_mission_desc:0 "The fastest path south is via the shroomway, but it is also rumoured to be more dangerous..."
 whitescale_shroom_backdoor_desc:0 "Amongst the dense canopies of shrooms we found a secret backdoor to the Dragon's Lair! We could use this to ambush the Ebonscales, or sneak past them and block it - trapping them in for a later encirclement."
 whitescale_continue_migration_desc:0 "Continue the Migration, we have not yet found a suitable place to settle down."
 whitescale_leave_our_homeland_desc:0 "The Mountain comes with many bad memories, let us run from the entrance where we escaped, and create a new homeland somewhere else!"
 whitescale_the_long_march_desc:0 "We must keep going, against all that wish to stop. We will find a new home for our people to last."
 whitescale_prepare_the_journey_desc:0 "It will be a long journey wherever we decide to go, but we must leave. It is time to prepare and choose our path."
 whitescale_the_path_splits_desc:0 "There are two roads ahead of us, a shorter path via the Mushrooms or the longer trek to the Ebonshole. Let us choose which one to follow."
 whitescale_branching_one_desc:0 "A branching Mission. Choose between going North to escape the mountain, or face the trials in the south for a better reward after a longer time."
 whitescale_face_the_trials_desc:0 "We will face the trials head-on, only cowards win. GO FORWARD, TO THE SOUTH!"
 whitescale_continue_the_trek_desc:0 "Hordes of enemies await us, cut them all down! Nothing will stop us from reaching our true calling!"
 whitescale_treasure_of_deepden_desc:0 "Deepden holds many treasures, the only path through the caves is via these dungeons. Hopefully we find something valuable in the depths to justify such recourses.."
 whitescale_escape_the_mountain_desc:0 "It is time to flee the mountain. We have found an entrance high in the peaks, and a path to traverse down. Our peoples future is not at the whim of some ancient creature."
 whitescale_advance_south_desc:0 "Nothing will stop us, not these rabid kobolds cowering in the dark nor the fetid goblins squatting in OUR mountain. Advance south!! Claim our future!"
 whitescale_clear_the_road_desc:0 "The Goblins sqautted in this road ahead, now under our command we will order them to vacate. This will open the way for our pilgrimage to continue uninterrupted. The last stretch must be done perfectly with no deviations or failure."
 whitescale_block_the_pass_desc:0 "Ensure that no one else will interrupt the final stages of our communion! Create a grand fortress to block the southern pass, and our patrol left in the north shall do the same there! None shall ruin this moment for our people!"
 whitescale_begin_the_communion_desc:0 "It is time to begin the communion with the gods of this mountain. We have worked hard to find this place, but the secret cave has now revealed itself. Our ruler enters alone, what ancient wisdom shall he find?"
 whitescale_finish_the_communion_desc:0 "From the dark the ruler emerges, frozen sweat drenched across his scales like tiny fractal icicles. He stumbles for a moment before looking up at the council in a daze. "They- they are here..." "
 whitescale_the_cave_path_desc:0 "The safer path east is clearly the best, we will not risk our troops and leadership to the grasping reach of the fungus forests."
 whitescale_to_ebonshole_desc:0 "We must refuel our troops at Ebonshole, one of the great holds. The path ahead is blocked by strange creatures dwelling in the dark, it will take all our strength to defeat them."
 whitescale_command_the_depths_desc:0 "The creatures answer to us now! We have done what no other has and reclaimed the great Ebonshole from the dark. Let us expand the frost even further south!"
 whitescale_crush_the_ebon_desc:0 "The Ebonscale Traitors have long thought themselves superior to us, huddling around their forges. Let us freeze their entire people solid, and stop the forges from ever activating again!!!"
 whitescale_the_pilgrimage_continues_desc:0 "The Pilgrimage south must continue. While we have defeated our greatest rivals the Goblins still remain between us and our god."
 whitescale_settling_down_desc:0 "It is time to settle down and stop the migration, our people yearn for stability and a real nation to call their own."
 whitescale_colonize_the_wastes_desc:0 "These artic wastes are uninhabitable to most, but we can live and thrive in them easily. Send out kobolds far and wide to claim these lands for the whitescales!"
 whitescale_a_reformed_religion_desc:0 "We no longer live in the dark, worshipping unnamed deities over campfires and rituals. A modern religion for a modern people should be the benchmark for a society."
 whitescale_reformed_government_title_desc:0 "The time has come to abandon the primitive form of government we once had. Whether a republic, monarchy, or theocracy - any of these shall serve us better than a tribal structure. We are now free to continue our lives however we wish, fully free from our past in the Mountain."
 whitescale_patrol:0 "A Small Whitescale Patrol"
 CoT_dragon_venerated:0 "The Dragon Venerated"
 CoT_elkaesal_venerated:0 "Elkaesal Venerated"
 CoT_eternal_blizzard:0 "The Eternal Blizzard"
 whitescale_scavenge_land:0 "Scavenge the Land"
 CoT_whitescale_long_march:0 "The Long March"
 CoT_escaped_mountain_whitescale:0 "Escaped the Mountain"
 CoT_colonize_the_wastes_whitescale:0 "Colonize the Wastes"
 CoT_ebonscales_defeated_modifier:0 "Ebonscales Crushed "
 CoT_whitescale_vassals:0 "Diplomatic Corps"
 CoT_whitescale_capital:0 "The Whitescale Capital"
 CoT_blood_water_plant:0 "Graveyard of our Warriors"
 desc_CoT_blood_water_plant:0 "Graveyards of our fallen kin make it hard to develop this land, but offer a site for many to pray. Rumours are that ghosts inhabit these places..."
 desc_CoT_eternal_blizzard:0 "An eternal blizzard rages in these halls, making traversal near impossible for any not blessed by the Frost God's touch."
 desc_whitescale_patrol:0 "A small contingent of whitescale soldiers hold this land as the main force migrate South."
 whitescale_mission_events.1.t:0 "North or South?"
 whitescale_mission_events.1.d:0 "We must choose whether to migrate North or South. North would no doubt be considered fleeing and failing the trial given to us by the God of the Mountain, but it would be safer for our people."
 whitescale_mission_events.1.a:0 "Escape the Mountain - North"
 whitescale_mission_events.1.b:0 "Face the Trial - South"
 whitescale_mission_events.2.t:0 "Settle or Migrate?"
 whitescale_mission_events.2.d:0 "We could settle down at our current location, but there could be more desirable spots elsewhere if we spend more time looking..."
 whitescale_mission_events.2.a:0 "It's time to settle!"
 whitescale_mission_events.2.b:0 "The time is not quite right..."
 whitescale_mission_events.3.t:0 "Shroom or Cave"
 whitescale_mission_events.3.d:0 "Do we take the quick and dangerous route via the shrooms, or the long and safe path via the caves to Ebonshole?"
 whitescale_mission_events.3.a:0 "To the Shrooms!"
 whitescale_mission_events.3.b:0 "To the Caves!"
 whitescale_mission_events.4.t:0 "The Trials of the Journey."
 whitescale_mission_events.4.d:0 "We we warned of the dangers of the Journey, hopefully nothing to bad happens on the way..."
 whitescale_mission_events.4.a:0 "Death, Disaster, or Glory."
 whitescale_mission_events.5.t:0 "Through or Around?"
 whitescale_mission_events.5.d:0 "Should we take the quick way through and surprise the traitors head-on, or sneak around and encircle them?"
 whitescale_mission_events.5.a:0 "Go Through!"
 whitescale_mission_events.5.b:0 "Go Around!"
 whitescale_mission_events.6.t:0 "The Ebonscales Defeated."
 whitescale_mission_events.6.d:0 "Our ancestral rivals the Ebonscales are defeated, we may now finish the trial and reach the communion location at the end of the mountain."
 whitescale_mission_events.6.a:0 "We are the greatest kobolds!"
 whitescale_mission_events.7.t:0 "The Trial Complete."
 whitescale_mission_events.7.d:0 "We have reached the end of the mountain, and the trial is complete. All our enemies are vanquished and the Patrols we left have now activated and siezed control of the land they guarded for our nation! Hopefully we invested in these or it will take a while to colonize this mountain..."
 whitescale_mission_events.7.a:0 "It is time for the communion..."
 whitescale_mission_events.8.t:0 "The God of the Mountain."
 whitescale_mission_events.8.d:0 "Our ruler enters the cave, but what god does he find in the frozen depths..."
 whitescale_mission_events.8.a:0 "Elkaesal, The Arctic Force."
 whitescale_mission_events.8.b:0 "Maliak, Son of Malliath."
 claim_the_land_whitescale_tt:0 "This belongs to the Whitescales!"
 claim_the_land_whitescale_title:0 "Set up a patrol to claim the land."
 claim_the_land_whitescale_desc:0 "Use this decision to claim your current capital as Kobold land! When you finish the 1st part of the mission tree all claimed provinces will be automatically taken and cored! Use this wisely and make sure to take as much as possible."
 


 # Eilisin MT expanded
 A15_secure_the_wine_trade_title:0 "Dominate the Bay of Wines"
 A15_secure_the_wine_trade_desc:0 "We are fortunate to be gifted easy access to such a promising trade location, the riches of Sarhal and Aelentir flow to us. We must not squander this natural boon."
 A15_renovating_lorentaine_title:0 "Renovating Eilisin"
 A15_renovating_lorentaine_desc:0 "The Palace is not fit to serve after the recent ritual. We require something... grander."
 A15_fate_of_rubyhold_title:0 "The Fate of Rubyhold"
 A15_fate_of_rubyhold_desc:0 "The dwarves of Rubyhold can not be allowed to sit above us and profit from our lack of control. Besides, they possess great secrets in their hold that our mages are especially interested in. We must secure them as an ally, a vassal, or conquer that place ourselves!"
 A15_forbidden_academy_title:0 "The Forbidden Academy of Lorentaine"
 A15_forbidden_academy_desc:0 "For to long we have let the pathetic whims of 'normality' govern our mages. This can be seen in no place better than the academy of Lorentaine, which has had a ban on necromantic studies for to long. By lifting this ban and constructing a new wing for the art, we shall be able to refine the great feat of magic that was done in Eilisin - and replicate it across the land!"
 A15_forbidden_academy_province:0 "The Forbidden Academy"
 A15_forbidden_academy_province_desc:0 "Grants the effects of level 1 battlemage academy."
 A15_magical_coup_title:0 "The Murmuring of Mages"
 A15_magical_coup_desc:0 "With the support of our magical estate, we will be able to achieve history and create an entirely new type of magic in our lands! There is only one problem, the no-mag getting in our way. We must have a magical ruler as our leader - perhaps the head of the academy of Lorentaine would be a good fit? Traditionally this post is always held by the ruler if they possess magical abilities..."
 A15_monopolize_wine_production_title:0 "Monopolize Global Wine Production"
 A15_monopolize_wine_production_desc:0 "Just the bay of wines is not enough, we need to take control of the global wine trade!! MORE!! MOREEEEE!"
 A15_bottlemaking_monopoly_title:0 "Bottlemaking Monopoly"
 A15_bottlemaking_monopoly_desc:0 "Bottlepoint, known for its bottles unsurprisingly, has come to be the perfect place for large scale shipping and manufacturing. Let us encourage it now, and it will pay dividens later."
 A15_dameshead_desire_desc:0 "The inner coast of the Dameshead is known for its riches, and its imperial squatters. We must shatter the notion of security there, and introduce them to our glorious magical ways."
 A15_dameshead_desire_title:0 "Dameshead Desire"
 A15_institute_of_inhumanity_title:0 "Institute of Inhumanities" 
 A15_institute_of_inhumanity_desc:0 "We have it! The institute of humanities is under our control and appropriately supported. Now, we will fully transition it into a vessel for our magical studies. Experiments and such under the watchful eye of our loyal dwarves will pave the way for greater understanding! The findings shall be sent back to Eilisin for our ruler to examine as soon as they are made!"
 A15_vaela_judgement_title:0 "Vaela's Judgement"
 A15_vaela_judgement_desc:0 "Visitors to the palace say they occasionally hear the caw of a bird, perhaps an eagle? No such creature has ever been spotted, leading to many believing it is a rumour. Perhaps if we can commune with this spirit, we can gain access to useful magical insight or power."
 A15_vaela_judgement_ttip:0 "Upgrades the Necromancy Spell 'Speak with Dead' to give advisor cost and a small amount of mana."
 A15_develop_the_bay_of_wines_title:0 "The Stalwart Southern Coast"
 A15_develop_the_bay_of_wines_desc:0 "Under the horrid rule of Deranne and Sorncost, the southern coast was neglected and discarded in favour of the Bay of Wines. We must remedy this, it is essential that they are capapble of protecting themselves from the pirate menace, and this begins with a development operation focusing on the most deprived and run-down areas."
 A15_the_arsenal_of_bottlepoint_title:0 "The Arsenal of Bottlepoint"
 A15_the_arsenal_of_bottlepoint_desc:0 "It is time to reward the people of Bottlepoint for their loyalty, and their constant maintaining of production facilities across our land. We shall construct a grand shipyard there, to produce the greatest boats Cannor has ever seen! None shall challenge our naval dominion!"
 A15_create_the_lorentish_wine_company_title:0 "Create the Eilisini Wine Institute"
 A15_create_the_lorentish_wine_company_desc:0 "Lorentish wine has had its time and gone, now we are interested in something else - Eilisini wine. It is far superior a product, and should be manufactured and shipped on mass to the rest of the world. Wineport shall become a global hub and a pilgrimage location for all wine lovers. Those that cause trouble or doubt or wine... well, we still require blood to grow."
 A15_iron_mine_title:0 "Lorenith Iron"
 A15_iron_mine_desc:0 "Reports are in, iron has been struck in Lorenith! let us send the surveyors to see the quantity - this could make that hill something more than a useless fortification!"
 A15_trawling_trout_title:0 "Trawling Trout"
 A15_trawling_trout_desc:0 "The coast of the Western Dameshead is a bountiful fishing location, clearly none of the prior owners were properly using magic and cannons in their fishing operations! We shall focus the entire coast on procuring the perfect fish to go with our wine and increase profits both here and at home!"
 A15_blood_transmutation_title:0 "Blood Transmutation"
 A15_blood_transmutation_desc:0 "WE HAVE DONE IT! The secrets of blood transmutation are here. This is a once in a lifetime magical discovery! It is time to rest it for the first time by using a plant growth, according to our numbers it should result in a massively increased yield!"
 better_plant_A15_tt:0 "This will upgrade Plant Growth to +0.3 local goods produced and 30% local goods produced modifier!"
 A15_halfling_harvest_title:0 "Halfling Harvest"
 A15_halfling_harvest_desc:0 "Our magical studies are going well - but we require more test subjects for a new spell that should rapidly grow bloodwine with sufficient quantities of blood. We don't have the space or livestock for this but north of our realm there is a place that has large quantities of both! Any province we take in this land will be a target for our spell, but we will need a large swathe of countryside to begin."
 A15_cot_negate_the_pirate_threat_title:0 "Negate the Pirate Threat"
 A15_cot_negate_the_pirate_threat_desc:0 "For generations pirates have raided our coastlines, both from the North and South. It is time to end this charade of weakness once and for all. A full fortification along the border supported by the greatest navy those dogs have ever seen. They will not dare entering our waters anymore."
 A15_lorentish_supremacy_title:0 "Eilisini Supremacy"
 A15_lorentish_supremacy_desc:0 "Eilisin is supreme! Eilisin is triumphant! This is our age, this is our time! Our lands are prospering and new communities are appearing left and right. Our navy is unparallaled and the wine trade is without peer. It is time to reap the rewards for our good rule and liberal use of magic. This is our golden age!!!"
 A15_the_foundry_of_lorenith_title:0 "The Foundy of Lorenith"
 A15_the_foundry_of_lorenith_desc:0 "Below the iron... we have found something more. Coal! In large quantities! Truly we are blessed, exploit that immediately!"
 A15_necromantik_title:0 "Necromantik"
 A15_necromantik_desc:0 "We have done it, the combination of transmutation and necromancy in a way never done before. I think a first showcase of this power would be useful on the criminals in Lorentaine... We shall differentiatite from traditional necromancy by naming it as the necromantik branch."
 A15_coming_to_rot_title:0 "Coming to Rot"
 A15_coming_to_rot_desc:0 "This magic, it is almost uncontrollable. It demands more, more, more. The only way to keep it satiated, is for our ruler to become an immortal. No one else can ever handle such power. It must be done. A lottery of citizens in Lorentaine, bring them to Eilisin at once. Bring them to the Rot."
 A15_anbennar_emperor_title:0 "Tyranny of Blood"
 A15_anbennar_emperor_desc:0 "It is our fate, we must rule. Eilisin was not meant to serve. Take control or destroy the empire, fuffill our destiny!"
 A15_gut_gawed_desc:0 "The Eagle of the south flies in defiance of our name. Show them we are in control, gut the bird and watch it stain the sky red."
 A15_gut_gawed_title:0 "Gut Gawed"
 A15_tyranny_of_magik_title:0 "Tyranny of Magik"
 A15_tyranny_of_magik_desc:0 "This is the age of Magik! Our studies have gone even further than imagined possiblly now that we are immortal. ALl three schools of magik, weaved into one unified structure. The dwarves have located the Ruby Crown of Lorent. Let us see how it fairs when subject to this ritual. We shall forever taint it, only to be worn by Eilisini blood."
 A15_corrupted_ruby_crown:0 "Ruby Crown - Corrupted"
