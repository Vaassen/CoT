 cot_lorent_cowed:0 "Cowed Appenage"
 cot_lorent_recovering:0 "Lorent Recovering"
 cot_rubenaire_prep:0 "Preparing for a new Roselord"

 digovedan_shrine_to_gods_title:0 "Shrine to the Gods"
 digovedan_shrine_to_gods_desc:0 "We shall construct a shrine to the gods, in honour of our discoveries. Greater than any other shrine the trees have laid eyes upon!"
 digovedan_commune_with_the_oak_title:0 "Commune with the Oak"
 digovedan_commune_with_the_oak_desc:0 "Our gods accepted the call, and approved of our worship, we may now attempt to commune with them at the heart of the forest, the great Oak..."
 digovedan_embrace_the_oak_title:0 "Embrace the Oak"
 digovedan_embrace_the_oak_desc:0 "Their guidance has led us well so far, but it is time to make a move. We must reconvene at the oak and pledge ourselves fully."
 digovedan_path_of_religion_title:0 "Path of Religion"
 digovedan_path_of_religion_desc:0 "The mortals of this world offer nothing compared to our gods! Cast off the shackles of mortality and dedicate ourselves to their goals!!"
 digovedan_skinwalkers_title:0 "Skinwalker Militia"
 digovedan_skinwalkers_desc:0 "Our forces strike fear into the foe, wearing the skins of their dead companions. Nothing inspires fear quite like a face of a friend."
 digovedan_wars_of_the_north_title:0 "Wars of the North"
 digovedan_wars_of_the_north_desc:0 "The trolls are a race borne from war, we have known nothing else. It is any surprise that we have learnt much from such pain?"
 digovedan_skinwalker_leadership_title:0 "A Challenge for the Tribe"
 digovedan_skinwalker_leadership_desc:0 "Our leadership has not gone uncontested, a powerful general has challenged us to a duel!! We have sometime to prepare, or we can ignore him and club his skull in when he arrives."
 digovedan_the_duel_of_fates_title:0 "The Duel of Fates"
 digovedan_the_duel_of_fates_desc:0 "The time has come, the challenger arrives. It's time to destroy this fool! We shall learn techniques from his grave."
 digovedan_path_of_blood_title:0 "Path of Blood"
 digovedan_path_of_blood_desc:0 "We are the Skinwalkers, we feast on mortal flesh, we fight with fear. They know nothing until we descend upon their lines. DEATH COMES, GLORY TO THE SKINWALKERS!"
 digovedan_natural_technologies_title:0 "Natural Technology"
 digovedan_natural_technologies_desc:0 "We need not concern ourselves with 'civilized' institutions or technology. Our people learn from action, not studying. We are a natural force, a natural technology.."
 digovedan_natural_enhancement_title:0 "Natural Enhancement"
 digovedan_natural_enhancement_desc:0 "Our people have augmented themselves with natural remedies, weapons, and strategies. Our eyes are now opening, and even more reveals itself to us. Let us continue the ways of nature, and leave the civilized man behind!"
 digovedan_natural_ascension_title:0 "Natural Ascension"
 digovedan_natural_ascension_desc:0 "It is time to ascend! We have created wonders out of nothing! Look south at those fools huddling around their schools. Our very brains are expanding with the power of the wild every second!"
 digovedan_natural_symbiosis_title:0 "Natural Symbiosis"
 digovedan_natural_symbiosis_desc:0 "We are now one with nature, our every thought mirrored in the surroundings. We have learnt all we can, and they have learnt from us in turn. We may now adopt the ways of society, with all of our power still intact."
 digovedan_pacify_title:0 "Pacify the Natives"
 digovedan_pacify_desc:0 "Our brothers are ignorant, but not unable to learn. Let us welcome them into our lands, and they shall integrate with us gladly."
 digovedan_learn_from_tribes_title:0 "Learn from the Tribes"
 digovedan_learn_from_tribes_desc:0 "Our priests have long communed with the local tribes in an attempt to learn more about the world. A good idea, especially with the newly integrated trolls in our land. Let us try this with their help."
 digovedan_forest_without_a_state_title:0 "Forest without a State"
 digovedan_forest_without_a_state_desc:0 "We are not a state, we are a people, we are the forest. Do not forget this, or you will crack and fall."
 digovedan_learn_from_ancestors_title:0 "Learn from the Ancestors"
 digovedan_learn_from_ancestors_desc:0 "The tribes have taught us all we know, now it is time to look towards our ancestors for guidance. Their wisdom is no doubt greater, and shall lead us to glory."
 digovedan_path_of_freedom_title:0 "Path of Freedom"
 digovedan_path_of_freedom_desc:0 "The way of the future is diplomacy, not war. Endless fighting left us in disaray alone in the woods. We shall never let this happen again, all trolls shall be great."
 digovedan_conquer_title:0 "Conquer the Natives"
 digovedan_conquer_desc:0 "Milennia of wars have taught us one thing, some people must be conquered."
 digovedan_trade_with_trolls_title:0 "The Troll Trade"
 digovedan_trade_with_trolls_desc:0 "We must trade with the locals at the forge, they have been using it themselves for who knows how long. They have offered us something no one else would recieve. Access to Ebonsteel is something we must take."
 digovedan_regular_trading_title:0 "Maintaining Trade Links"
 digovedan_regular_trading_desc:0 "That trade was not a one time thing, they wish to establish a consistent link between our capital and the forge. We may have to invest a small amount now, but the rewards are no doubt worth it."
 digovedan_slaughter_the_south_title:0 "Slaughter the South"
 digovedan_slaughter_the_south_desc:0 "TAKE THEIR SKINS, SPILL THEIR BLOOD!"
 digovedan_raiding_outpost_title:0 "Raiding Outpost"
 digovedan_raiding_outpost_desc:0 "Create an outpost for future raids."
 digovedan_collect_the_skins_title:0 "Collect the Skins"
 digovedan_collect_the_skins_desc:0 "Green and pink skins? I'll take ALL OF THEM!!!"
 digovedan_march_west_title:0 "March West"
 digovedan_march_west_desc:0 "Our people come from the hills, let us take them back from these fools who squat in OUR land."
 digovedan_the_troll_heartland_title:0 "The Troll Heartland"
 digovedan_the_troll_heartland_desc:0 "The valleys where we kept our crops and livestock. These humans clearly think themselves above the animals. Let us show them why they are wrong."
 digovedan_the_forebearers_title:0 "The Forebearers"
 digovedan_the_forebearers_desc:0 "The home of the Giants, our fathers in blood and flesh. Let us reclaim their home and honour them as they deserve."
 digovedan_a_red_herring_title:0 "A Red Herring"
 digovedan_a_red_herring_desc:0 "While south may be the home of the Fjord Trolls, it is not ours. We must explore and find our real home, where OUR people came from."
 digovedan_fortify_home_title:0 "Fortify the Grove"
 digovedan_fortify_home_desc:0 "The most important site to our people deserves a structure worthy of its glory. Build the fort, defend the grove!"
 digovedan_ritual_ceremonies_title:0 "Ritual Ceremonies"
 digovedan_ritual_ceremonies_desc:0 "Prepare the initial ceremonies in our grandest temple. We will directly speak to the gods, not a communion like before, but in the flesh itself."
 digovedan_an_audience_with_the_gods_title:0 "Audience with the Gods"
 digovedan_an_audience_with_the_gods_desc:0 "It is time, start the audience. We shall ascend and our mission made clear."
 digovedan_trade_alliance_title:0 "A Trade Alliance"
 digovedan_trade_alliance_desc:0 "Extend an offer to all Trolls of the north, settled or otherwise, come to our lands for a future."
 digovedan_hunt_mammoths_title:0 "Hunt Mammoths"
 digovedan_hunt_mammoths_desc:0 "The greatest beast of the north is the Mammoth. Few can hunt them but us, let us use this power to make an offer our neighbours cannot refuse..."
 digovedan_cash_out_favours_title:0 "Cash out Favours"
 digovedan_cash_out_favours_desc:0 "We achieved much with our trades, let us cash in the favours for a burst of money and influence."
 skinwalker_outposts:0 "Skinwalker Outposts"
 home_of_the_walkers:0 "Home of the Walkers"
 the_grove_of_ascension:0 "The Grove of Ascension"
 digovedan_mission_events.1.t:0 "The Ideas of the Oak"
 digovedan_mission_events.1.d:0 "While we do not yet know what god exactly is speaking to us, they present a number of good ideas. Should we follow their direction - we shall be rewarded."
 digovedan_mission_events.1.a:0 "The Way of Diplomacy"
 digovedan_mission_events.1.b:0 "The Way of Hostility"
 digovedan_mission_events.1.c:0 "The Way of Neutrality and Strength"
 digovedan_mission_events.1.e:0 "Ignore this Tree!"
 digovedan_mission_events.2.t:0 "The God Reveals Itself"
 digovedan_mission_events.2.d:0 "Our god reveals its true nature! What is it that we see in the leaves?"
 digovedan_mission_events.2.a:0 "The Watchers! Come to bless us with their ancestral wisdom!"
 digovedan_mission_events.2.b:0 "The great spirits of the trees! Come to grace us with their power!"
 OAKWALKERS_NAME:0 "Oakwalkers"
 OAKWALKERS_NAME_ADJ:0 "Oakwalker"
 digovedan_mission_events.3.t:0 "Duel Preparation"
 digovedan_mission_events.3.d:0 "How much should we practice?"
 digovedan_mission_events.3.a:0 "Not at all..."
 digovedan_mission_events.3.b:0 "A bit..."
 digovedan_mission_events.3.c:0 "A lot!"
 digovedan_mission_events.4.t:0 "The Duel's result..."
 digovedan_mission_events.4.d:0 "The challenger arrives, his teeth stained with blood and his grey hide covered in dirt. He is a warrior. He grunts out a quick phrase 'I hope you prepared yourself. Die.' He lunges for the first strike."
 digovedan_mission_events.4.a:0 "Death, Injury, or Glory."
 digovedan_mission_events.5.t:0 "The Path of Religion."
 digovedan_mission_events.5.d:0 "We shall embrace our gods as they have us! By honouring their lands by protecting them as our equals, we shall show our worth."
 digovedan_mission_events.5.a:0 "The Shrines must be Built."
