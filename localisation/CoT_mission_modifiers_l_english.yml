# Modifier descriptions
 desc_development_boom_cot_x53:0 "Reliable water has made space for new courtyards, workshops and homes. Caravans can stop here without consuming the settlement's last reserves."
 desc_X53_final_genie_bound:0 "Three captive genies sustain the council's designs. Their compelled service supports our advisers, strengthens the institutions that command them and draws extraordinary output from the realm."
 desc_X53_second_genie_bound:0 "The College can draw upon two captive wills, distributing their enforced service between the council, its specialists and the workshops of the realm."
 desc_X53_first_genie_bound:0 "A bound genie's knowledge is placed at the disposal of our court. Its advice costs the treasury very little; the prisoner is still discovering the price."
 desc_X53_magical_might:0 "The first successful binding has given our mages an inexhaustible subject for instruction. The ruler and the College learn quickly from a teacher who cannot dismiss them."
 desc_X53_widespread_condemnation:0 "Accounts of the broken bargain and the captive genie have travelled far beyond the bazaar. Foreign courts receive our envoys with particular attention to the wording of every promise."
 desc_X53_debtors_bodies:0 "The creditor's claim has been extended to the debtor's own body. Bound labour pours into the workshops and fields, while anger gathers among those whose arrears have become a sentence."
 desc_X53_compel_the_nation:0 "Binding orders pass through the institutions of the province, directing whole communities towards the production demanded by the state. Unease persists beneath the appearance of orderly work."
 desc_X53_compel_the_workers:0 "The workshops keep a magically enforced pace. Hands return to their tasks at the appointed hour, however thoroughly the workers have exhausted themselves."
 desc_X53_compel_the_servants:0 "The terms of service have been inscribed upon their subjects. Those bound by them labour harder, with ample cause to resent every completed order."
 desc_X53_genie_vitality:0 "A share of the genie's extraordinary vitality sustains our ruler. The contract promises years that a mortal life would seldom possess on its own."
 desc_X53_enriched_bargains:0 "The second wish presses our agreements towards profitable conclusions. Traders and taxpayers supply the resulting wealth, and understand well enough whose advantage the terms now serve."
 desc_X53_enemies_broken:0 "The will to resist is crushed wherever the wish takes hold. Rival institutions yield their influence to the state, and the obedient host advances with an appetite for costly campaigns."
 desc_X53_devour_it_all:0 "Our appetite reaches into strength and magical essence. The realm replenishes itself from what it can consume, while foreign observers become increasingly reluctant to draw near."
 desc_X53_the_feast_of_minds:0 "Knowledge can be taken apart and consumed as surely as flesh. The learning wrested from captive minds gives our rulers and mages a terrible abundance of experience."
 desc_X53_the_grand_bazaar:0 "The exchanges of Gharmargma now reach across many markets. New merchant houses carry the capital's bargains outward, returning with accounts that keep the council very well fed."
 desc_X53_the_sandstone_legion:0 "The host has acquired the steadiness promised by the wish. Its infantry holds together under pressure, each formation another instrument of the council's command."
 desc_X53_ogre_surge:0 "The gathering of the clans has brought a sudden abundance of willing fighters. The council can sustain a larger host while that first enthusiasm lasts."
 desc_X53_development_booming_again:0 "New routes, established workshops and a well-supplied market have made further building easier. The capital's next district already has traders waiting to occupy it."
 desc_X53_expeditionary_force:0 "Forest camps are being supplied from the settled realm. The expedition can open new frontiers, but its demands draw heavily upon normal tax receipts and the flow of available recruits."
 desc_X53_expeditionary_force_two:0 "An enlarged expedition carries settlers and supplies into the forest. New communities can grow quickly under its protection, at a severe continuing cost to the taxpayers and manpower of the older provinces."
 desc_X53_contracted_minorities:0 "The temple extends the terms of its protection through our states, requiring the protected to accept the rites approved by the council. Territories outside those jurisdictions remain beyond the missionary contract."
 desc_X53_cultural_contracts:0 "Local customs are being displaced by the language and practices of the ruling clans. The state recognises fewer exceptions, and permits fewer distinct peoples a secure place within its institutions."
 desc_X53_the_ogre_state:0 "The capital displays the authority and splendour of a realm ordered for its ogre rulers. Its institutions press a common culture and public faith upon the lands they can administer."
 desc_X53_troops_mobilized:0 "The military delegates have put their preparations into effect. Supply orders, marching instructions and new musters give the troops the confidence to move quickly and press their sieges."
 desc_development_boom_cot_x53_big:0 "The capital's great wells and cisterns can sustain a far larger settlement. Water no longer decides which promising district must remain a patch of empty ground."
 desc_X53_binding_wood:0 "Ironwood is cut and inscribed for the markets and the College. The valuable industry produces extraordinary quantities of timber, while its reserved stands and demanding works crowd out other forms of development."
 desc_X53_threefold_binding:0 "Three prison towers sustain a common discipline of magical command. Their records circulate through the College, giving its mages greater reach and its advisers access to the service of the bound."
 desc_X53_ogre_merchants:0 "A new company of ogre merchants has emerged from the capital's lower markets. Its factors carry the bargains of the underground city into the wider world."
 desc_X53_the_second_bazaar:0 "Vaults, workshops and crowded quarters fill the city beneath the capital. Goods move through its passages in extraordinary volume, and its residents provide another great reserve of labour and recruits."
 desc_X53_mana_drain:0 "Maintaining the final binding draws relentlessly upon the ruler's magical reserves. The contract has secured an enduring life; its first years demand a formidable expenditure of power."
 desc_X53_the_black_bazaar:0 "Compelled bargains and captive labour have made Gharmargma an exchange of extraordinary wealth. Beneath the prosperous accounts lies a multitude with good reason to hate the masters of the market."
 desc_X53_the_chained_legion:0 "Elemental commanders and magically enforced discipline give the host terrible cohesion. Its soldiers can break fortified resistance with relentless precision, provided the treasury can sustain the machinery of their service."
 desc_X53_the_ogre_god_king:0 "The immortal ruler receives the service of genies and the devotion demanded by the state. Authority gathers around the throne, while its rites and privileges burden the people who must support them."

# Government reforms
 settled_horde_empowered_X53_reform:0 "The Empowered Clans"
 settled_horde_empowered_X53_reform_desc:0 "The first wish has given the settled clans a greater martial strength. Their authority rests upon the defence of the bazaar and the hosts they can assemble in its service."
 trading_council_empowered_X53_reform:0 "The Enriched Council"
 trading_council_empowered_X53_reform_desc:0 "The first wish has placed the merchant council at the centre of the realm's good fortune. Clan wealth and the institutions of trade shape its deliberations, binding the fortunes of the state to the business of the bazaar."
 mages_empowered_x53_reform:0 "The Ascendant College"
 mages_empowered_x53_reform_desc:0 "The first wish has made magical learning a principal source of authority. The scholars who interpret its gift can establish institutions through which the clans will exercise their new command of the arcane."
