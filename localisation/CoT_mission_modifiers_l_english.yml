 #Erubas
 erubas_nobodies_prey_title:0 "Nobody's Prey"
 erubas_nobodies_prey_desc:0 "For generations, our people survived by hiding from those who were stronger than us. We were driven from our homes, treated as vermin, and forced to accept the cruelties of a world that considered us insignificant. Those days must end. Under Erubigg the Cleverest, we shall gather our warriors, appoint commanders worthy of our new strength, and teach our neighbors that the goblins of Erubas will never again be easy prey."
 erubas_borrowed_discipline_title:0 "Borrowed Discipline"
 erubas_borrowed_discipline_desc:0 "Strength alone is not enough. The Djinn have awakened something greater within our people, but raw power without discipline is little better than helplessness. Our warriors must learn to fight as a single body, guided by capable commanders and hardened by experience. We may have borrowed our strength from powers beyond this world, but the discipline to wield it shall be our own."
 erubas_prepare_the_forts_title:0 "Prepare the Forts"
 erubas_prepare_the_forts_desc:0 "The roads into Erubas must become passages of dread for any who would threaten us. We shall strengthen our frontier fortresses, reinforce our defensive positions, and prepare the surrounding lands to sustain a prolonged defense. The labor and expense will be considerable, but we know the cost of leaving our homes undefended. Never again shall an enemy find our people helpless before their advance."
 erubas_defensive_perimeter_title:0 "The Defensive Perimeter"
 erubas_defensive_perimeter_desc:0 "A handful of fortresses cannot protect a nation whose borders remain exposed. Our influence must extend across the surrounding lands, allowing us to build a defensive perimeter deep enough to exhaust an invader before they reach the heart of our realm. Every settlement within this perimeter must contribute to our security. Let our enemies discover that conquering Erubas is not a single campaign, but a war against the land itself."
 erubas_an_inassailable_land_title:0 "An Inassailable Land"
 erubas_an_inassailable_land_desc:0 "The work of our ancestors was to survive. The work of our generation is to make survival inevitable. With fortresses guarding our approaches and a standing army ready to answer any incursion, Erubas shall become a land that cannot be conquered without terrible sacrifice. Perhaps our neighbors will one day forget why they feared us. Our walls will remind them."
 erubas_a_study_in_survival_title:0 "A Study in Survival"
 erubas_a_study_in_survival_desc:0 "The Djinn changed our bodies, but Erubigg has begun to ask whether the limits of our existence can be changed as well. In the quiet halls of our temples, scholars examine the relationship between the soul, the body, and the forces that bind them together. Survival has always been our people's greatest art. Now our ruler intends to discover whether it can be perfected."
 erubas_anchoring_the_soul_title:0 "Anchoring the Soul"
 erubas_anchoring_the_soul_desc:0 "The body is a vessel, the soul its occupant, and death the moment when their connection is severed. If Erubigg is to transcend mortality, he must first understand what binds him to life. The ritual will require wealth, rare materials, and knowledge that few mortals would dare pursue. Yet the Cleverest has never been content to accept the boundaries imposed upon him. Let the preparations begin."
 erubas_immortality_cometh_title:0 "Immortality Cometh"
 erubas_immortality_cometh_desc:0 "Death has been denied its final victory. Erubigg has crossed the boundary separating the living from the undying, and the throne of Erubas is now occupied by a ruler who need not fear the passing of years. Some will call this an abomination; others will call it the greatest triumph of goblin ingenuity. Whatever judgment history delivers, the Cleverest shall remain to hear it."
 erubas_sleepless_watch_title:0 "The Sleepless Watch"
 erubas_sleepless_watch_desc:0 "An ordinary ruler must sleep, grow old, and eventually surrender the realm to another. Erubigg shall do none of these things. From his tower, the undying sovereign will watch over Erubas without pause, while wards and fortifications are strengthened by his tireless attention. Let the living rest easy behind their walls. Their ruler has no need for sleep, and their enemies shall find no hour in which the kingdom is unguarded."
 erubas_read_the_fine_print_title:0 "Read the Fine Print"
 erubas_read_the_fine_print_desc:0 "The tale of our founding is told as a miracle: a desperate people made a wish, and a Djinn answered. Yet Erubigg knows that a bargain is never merely what its participants claim it to be. Every promise contains assumptions, every gift creates expectations, and every agreement has terms that may be overlooked by the unwary. Our scholars shall examine the original bargain and determine what, precisely, was promised—and what remains owed."
 erubas_a_gift_freely_given_title:0 "A Gift Freely Given?"
 erubas_a_gift_freely_given_desc:0 "The Djinn gave our people strength, but the question of its price remains. Erubigg has begun to unravel the obligations hidden within our founding bargain. For a time, we must devote our wealth and attention to understanding the forces that transformed us. Whether the Djinn intended to help us, to bind us, or simply to satisfy its own curiosity, we shall learn the truth before we make another promise."
 erubas_brass_embassy_title:0 "The Brass Embassy"
 erubas_brass_embassy_desc:0 "Our capital shall become a place where mortal scholarship and genie wisdom meet. Within the Brass Embassy, the presence of our supernatural patron will guide the work of artisans, merchants, and scholars alike. We shall offer the Djinn a place of honor, while ensuring that its counsel strengthens the realm. Let our workshops flourish beneath the gleam of brass, and let every invention remind us that knowledge can turn a gift into an enduring advantage."
 erubas_essential_magic_title:0 "Essential Magic"
 erubas_essential_magic_desc:0 "Walls and soldiers can protect our borders, but magic can protect the very foundations of our existence. Our mages shall develop wards against hostile sorcery, reinforce our towers, and extend their protective enchantments across the surrounding lands. We shall not rely upon the goodwill of supernatural patrons when we can prepare our own defenses. The Djinn may have opened the door to our power, but it is our responsibility to keep our enemies outside."
 erubas_make_good_our_promise_title:0 "Make Good Our Promise"
 erubas_make_good_our_promise_desc:0 "At last, the time has come to settle the matter that has haunted our nation since its founding. The Djinn answered our wish, and Erubas has grown stronger through its gift. Yet the bargain demands a conclusion, whether through the creation of a realm worthy of protection, the defeat of those who once oppressed us, or the mastery of magic sufficient to understand our patron's power. We shall fulfill our promise on our own terms—and ensure that the future of Erubas belongs to its people."
 erubas.1.t:0 "The Vessel of the Undying"
 erubas.1.d:0 "Erubigg has studied the boundary between life and death until even his most trusted scholars struggle to follow his reasoning. Now he prepares to anchor his soul beyond the reach of ordinary mortality. The ritual requires a vessel capable of sustaining what the living body cannot. Three possibilities remain: a forged implement of enchanted metal, a carefully faceted gem capable of holding a fragment of the soul, or a heart fashioned from bone and the remnants of death itself. Each offers a different path to eternity. The choice cannot be taken lightly, for the vessel may shape not only how Erubigg survives, but what he becomes."
 erubas.1.a:0 "Forge a vessel of enchanted metal."
 erubas.1.b:0 "Entrust the soul to a faceted gem."
 erubas.1.c:0 "Build the vessel from bone and death."
 erubas.2.t:0 "The Price of the Wish"
 erubas.2.d:0 "The scholars have returned to the founding bargain and uncovered a question that Erubigg can no longer ignore: what did the Djinn truly ask in return? The answer may never be found in a written contract. Perhaps the Djinn desired a realm worthy of its gift, a people who would never again bow to their oppressors, or a secret that even the genie could not discover alone. Erubigg must decide what his people will offer in fulfillment of their promise. Whatever he chooses, the decision will define the future of Erubas."
 erubas.2.a:0 "We shall build a realm worthy of the gift."
 erubas.2.b:0 "We shall repay the gift through vengeance."
 erubas.2.c:0 "We shall uncover the secret behind all things."
 erubas.3.t:0 "The Debt of the Djinn"
 erubas.3.d:0 "The transformation of our people was no ordinary miracle. The Djinn answered our wish and awakened a strength that had long lain beyond our reach. Yet Erubigg knows that the power of a genie cannot be measured by what it gives alone. Somewhere within the bargain lies an obligation, whether understood by the Djinn, by our ancestors, or by neither. Until its true nature is revealed, Erubas must proceed with caution. We have been granted the strength to stand on our own, but we must discover whether that strength is truly ours."
 erubas.3.a:0 "Record the debt. We shall settle it in time."
 X51_nobodies_prey:0 "Nobody's Prey"
 X51_nobodies_prey_desc:0 "The goblins of Erubas have sworn never again to live at the mercy of stronger neighbors. The memory of their former weakness has united the realm and strengthened its resolve to defend itself."
 X51_borrowed_discipline:0 "Borrowed Discipline"
 X51_borrowed_discipline_desc:0 "The strength awakened by the Djinn must be matched by discipline and military experience. Erubas is training its warriors to turn supernatural potential into battlefield effectiveness."
 X51_fortification_focus:0 "The Defensive Perimeter"
 X51_fortification_focus_desc:0 "Erubas has committed itself to an extensive defensive network. Fortresses, fortified settlements, and prepared approaches make its territory increasingly difficult to invade."
 X51_genie_tutelage:0 "Genie Tutelage"
 X51_genie_tutelage_desc:0 "The wisdom of a genie guides the scholars and artisans of Erubas. Its counsel offers remarkable opportunities, though the full obligations of the founding bargain remain uncertain."
 X51_genie_debt_one:0 "The First Debt"
 X51_genie_debt_one_desc:0 "The Djinn answered the wish that changed the fate of the goblins. Until the terms of the bargain are understood, Erubas must live with the knowledge that its greatest gift may carry an unseen price."
 X51_genie_debt_two:0 "The Debt Deepens"
 X51_genie_debt_two_desc:0 "Erubas has begun to draw more directly upon the Djinn's wisdom. The benefits are real, but so too is the possibility that the nation is becoming more deeply entangled in its patron's designs."
 X51_genie_debt_three:0 "The Final Obligation"
 X51_genie_debt_three_desc:0 "The relationship between Erubas and its genie patron has grown beyond the original wish. The nation must now fulfill its promise, whether through the greatness of its capital, the defeat of its enemies, or the discovery of forbidden knowledge."
 X51_genie_debt_repayed:0 "The Promise Fulfilled"
 X51_genie_debt_repayed_desc:0 "Erubas has fulfilled the obligation born from its founding bargain. The Djinn's gift is no longer merely a debt to be repaid, but a legacy that the goblins may claim as their own."
 X51_dissent_disavowed:0 "Dissent Disavowed"
 X51_dissent_disavowed_desc:0 "The ascension of Erubigg has forced the realm to confront the implications of an undying ruler. His supporters have rejected the doubts of traditionalists and proclaimed his continued reign a necessary safeguard for Erubas."
 X51_magical_focus:0 "The Undying Scholar"
 X51_magical_focus_desc:0 "Death has not ended Erubigg's pursuit of knowledge. Freed from the ordinary limitations of mortal life, he can devote himself to the arcane mysteries that once demanded more time than any living ruler could spare."
 X51_magical_construction:0 "Magical Construction"
 X51_magical_construction_desc:0 "The capital's builders have begun incorporating magical principles into their work. Arcane techniques reinforce structures, improve their resilience, and demonstrate the practical benefits of Erubigg's research."
 X51_fortification_line:0 "The Fortification Line"
 X51_fortification_line_desc:0 "A heavily fortified position anchors the defensive system of Erubas. Its walls and approaches are prepared to delay an enemy advance and give the realm time to mobilize."
 X51_brass_embassy:0 "The Brass Embassy"
 X51_brass_embassy_desc:0 "The genie patron's presence in the capital provides unusual guidance to local artisans and merchants. Its wisdom improves the organization of production and gives the realm access to knowledge beyond ordinary mortal experience."
 X51_center_of_wards:0 "Center of Warding"
 X51_center_of_wards_desc:0 "This mage tower serves as a center for protective enchantments. Its scholars maintain magical wards designed to frustrate hostile sorcery and safeguard the surrounding realm."
 X51_ward_effect:0 "Warded Lands"
 X51_ward_effect_desc:0 "Magical protections extend from a nearby center of warding, strengthening the defenses of this territory against supernatural threats."
 X51_magical_survival:0 "A Study in Survival"
 X51_magical_survival_desc:0 "Erubigg is studying the connection between the soul and the body, seeking to understand whether mortal existence can be preserved beyond its natural limits."
 X51_forged_vessel:0 "Forged Vessel"
 X51_forged_vessel_desc:0 "Erubigg has chosen an enchanted metal vessel to anchor his soul. The ritual emphasizes endurance, structure, and the binding of spiritual power within an enduring form."
 X51_faceted_soul:0 "Faceted Soul"
 X51_faceted_soul_desc:0 "Erubigg has chosen a faceted gem as the anchor for his soul. Its carefully prepared surfaces symbolize the many aspects of his identity and the intricate magic required to preserve them."
 X51_ossuary_heart:0 "Ossuary Heart"
 X51_ossuary_heart_desc:0 "Erubigg has chosen a vessel fashioned from bone and the remnants of death. The ritual embraces the mysteries of necromancy and the thin boundary between the living and the dead."
 X51_sleepless_watch_capital:0 "The Sleepless Watch"
 X51_sleepless_watch_capital_desc:0 "The undying ruler watches over the capital without rest. Its defenses and administration benefit from the sovereign's tireless vigilance."
 X51_sleepless_watch:0 "Under the Sleepless Watch"
 X51_sleepless_watch_desc:0 "This territory is protected by the vigilance of an undying sovereign. Erubigg's servants maintain its defenses under a ruler who never needs to sleep."

 gharmargma_gather_the_clans_title:0 "Gather the Clans"
 gharmargma_gather_the_clans_desc:0 "It is time to decide our future. No more can we be a disparate group of ogres roaming the desert. Our survival depends on it. We must create a force strong enough to rival the Khet and Gnollakaz of the North. These lands are weak and divided. It is time to show them ogre diplomacy!"
 gharmargma_establish_bazaar_title:0 "Build the Bazaar"
 gharmargma_establish_bazaar_desc:0 "Our first step should be creating a Bazaar city in Kunolo. One that is able to act as a center for all local commerce and trade. This will no doubt make us infinitely richer in the long term!"
 gharmargma_sink_the_wells_title:0 "Trap the Trade"
 gharmargma_sink_the_wells_desc:0 "The locals have a poor and useless method of distributing goods. Even just by seizing Kunolo we have already taken a large portion of their control. It should be child's play to corner the market here and make sure all the wealth goes to us!"
 gharmargma_expedition_to_ruin_title:0 "Ravage the Ruins"
 gharmargma_expedition_to_ruin_desc:0 "Find that Jinn! We found rumours that its nearby in one of these old Halfling ruins! Track it down and make it talk - or eat it whole!"

 gharmargma_bazaar_rule_title:0 "Exterminate the Expedition"
 gharmargma_bazaar_rule_desc:0 "Someone else is trying to eat up these weakling natives - the Halflings from the south! We can't let them get a foothold on OUR land. Take it from them by force - and make them pay for denying us dinner."

 gharmargma_prepare_the_contracts_title:0 "Coerce into Contracts"
 gharmargma_prepare_the_contracts_desc:0 "The stupid illiterate natives will happily sign contracts that demand far more than we give them back! We must set up a system for distributing these and use them to enforce compliance, all must worship (or eat) the Jinn!"
 gharmargma_first_wish_title:0 "The First Wish"
 gharmargma_first_wish_desc:0 "We have done it, the Jinn is in our hands. He can only grant us ONE WISH??? It's meant to be three! Fine. See what it has to say."
 gharmargma_secure_the_iron_title:0 "Secure the Iron"
 gharmargma_secure_the_iron_desc:0 "The locals have a large quantity of iron that we can exploit. Truly this land was worth the trek (not). At least lets make these valuable goods worth being here for."
 gharmargma_transport_the_iron_title:0 "Transport the Iron"
 gharmargma_transport_the_iron_desc:0 "We need a proper road network to get the iron to our coastal cities, mostly Kunolo, in order to sell it off. Construct this network and profit greatly."
 gharmargma_golden_age_title:0 "A Golden Age"
 gharmargma_golden_age_desc:0 "We are but a new nation - but this is surely our Golden Age! Embrace the wealth and glory, and let us create an ogre state to span Sarhal itself!"
 gharmargma_prospering_economy_title:0 "A Prospering Economy"
 gharmargma_prospering_economy_desc:0 "Our economy is doing far better than any of our neighbours, and we are close to eclipsing the Gnolls. Once they are gone, only the Khet is left."
 gharmargma_a_new_nation_title:0 "A New Nation"
 gharmargma_a_new_nation_desc:0 "The old tribal structure is simply not sufficient for our current level of governance. We must adapt with the times and change - but to what?"
 gharmargma_race_united_title:0 "The Clans United"
 gharmargma_race_united_desc:0 "We are no longer bound by petty squables and disagreements - all share our goal. To be the richest, and eat the most stuff in the whole of Halann!"
 gharmargma_dao_nako_force_title:0 "Into Dao Nako"
 gharmargma_dao_nako_force_desc:0 "The jungle of Dao Nako holds more secrets and even more wealth than the deserts of the North. We need to fund a proper expedition into the wilderness to discover these before anyone else can..."
 gharmargma_ironwood_bindings_title:0 "Ironwood Bindings"
 gharmargma_ironwood_bindings_desc:0 "One tree (find them!), two trees (bring them all!), three trees - and in the darkness the trees shall bind them!"
 gharmargma_eat_the_dao_title:0 "Eat the Dao"
 gharmargma_eat_the_dao_desc:0 "We have control of most of the Dao - it is time to do what ogres do best. FEAST!"
 gharmargma_cultural_erasion_title:0 "Cultural Erasure"
 gharmargma_cultural_erasion_desc:0 "Erase the locals culture and re-populate it with ogres. In time, all our people must be like us. We cannot trust the natives to govern or lead. They will betray us no doubt."
 gharmargma_the_ogre_state_title:0 "The Ogre State"
 gharmargma_the_ogre_state_desc:0 "This is an empire for ogres, and ogres alone! Summon our kin from across the land. We rule Sarhal now."
 gharmargma_where_to_look_title:0 "Where to Look"
 gharmargma_where_to_look_desc:0 "Where should we look next? Inward, or outward?"
 gharmargma_a_dark_decision_title:0 "A Dark Decision"
 gharmargma_a_dark_decision_desc:0 "The idea of eating a Jinn, it has been tempting for a long time - but should we pursue it?"
 gharmargma_branching_one_title:0 "An Unwritten Contract"
 gharmargma_branching_one_desc:0 "Branching Path. Will open upon completion of 'A Dark Decision'"
 gharmargma_recover_forbidden_contracts_title:0 "Forbidden Contracts"
 gharmargma_recover_forbidden_contracts_desc:0 "The secrets of the Jinn lie further down the coast, on the island squatted on by Halflings. Take that island from them - and uncover the secrets of the dark magic they tried to hide."
 gharmargma_eternal_servitude_title:0 "Eternal Servitude"
 gharmargma_eternal_servitude_desc:0 "We have the details of the contracts now. It is time to establish an organisation to exploit these, the College of Chains."
 gharmargma_debtors_bodies_title:0 "Debtors' Bodies"
 gharmargma_debtors_bodies_desc:0 "The bodies of Debtors are not free from our control anymore. With our new College of Chains, we can exploit their remains for tests and further studies (and perhaps Dinner...)"
 gharmargma_the_second_genie_title:0 "The Second Genie"
 gharmargma_the_second_genie_desc:0 "WE HAVE FOUND IT! THE SECOND GENIE IS IN OUR GRASP!"
 gharmargma_second_wish_title:0 "The Second Wish"
 gharmargma_second_wish_desc:0 "He to, has but one wish to grant. Make sure its a good one."
 gharmargma_achieving_destiny_title:0 "Achieving Destiny"
 gharmargma_achieving_destiny_desc:0 "In order to have the authority to bind the third Genie, we must prove ourselves. Fufill our destiny and show them why they must fear Gharmargma!"
 gharmargma_the_third_genie_title:0 "The Third Genie"
 gharmargma_the_third_genie_desc:0 "We have found the Third Genie! Quickly transport him to the capital of Kunolo, where the prison must be constructed post-haste. Drawing from the life-force of all three has granted our ruler power and lifespan beyond anyone could've imagined!"
 gharmargma_three_prisons_title:0 "Three Rings, Three Prisoners"
 gharmargma_three_prisons_desc:0 "The three prisons, the three cities. These shall define our Empire, and our legacy."
 gharmargma_the_second_bazaar_title:0 "City Beneath the City"
 gharmargma_the_second_bazaar_desc:0 "Kunolo has expanded far beyond what was thought possible. As our people build deeper and deeper, a second city has formed. One for the richer, one for the most hungry, one for those who seek to DEVOUR THE JINN."
 gharmargma_the_third_wish_title:0 "The Third Wish"
 gharmargma_the_third_wish_desc:0 "It is time. Make the Wish. Then Consume the Jinn. Funnel their power into our strongest soldiers, our state, and our ruler themselves!!!"

# Decisions
 summon_the_council_title:0 "Summon the Council"
 summon_the_council_desc:0 "Call together the delegates appointed when the council was last formed. Each will put their recorded expertise at the service of the realm; an unfilled seat will instead provide a small reserve of practical counsel. A formal audience may normally be convened once a decade."
 refresh_the_council_title:0 "Reconstitute the Council"
 refresh_the_council_desc:0 "Review the council's seats and appoint delegates according to our currently employed advisers. The new roster will determine the benefits of future council audiences. Reconstitution is normally available once a decade, while an enhanced civil council can undertake it more frequently. A war council will also use the occasion to prepare the troops for service."

# Events
 gharmargma.1.t:0 "The First Seat"
 gharmargma.1.d:0 "We must decide who from each clan will join the council this decade. Our administrative advisor will be the first."
 gharmargma.1.a:0 "Record the first appointment."
 gharmargma.2.t:0 "The Second Seat"
 gharmargma.2.d:0 "The second advisor shall come from our Caravan Clans. The diplomatic advisor will have this position."
 gharmargma.2.a:0 "Record the second appointment."
 gharmargma.3.t:0 "The Third Seat"
 gharmargma.3.d:0 "Thirdly, our military advisor "
 gharmargma.3.a:0 "Record the final appointment."
 gharmargma.5.t:0 "An Audience of the Council"
 gharmargma.5.d:0 "The council has formed, and we will recieve their guidance until it is time for a new set of advisors."
 gharmargma.5.a:0 "Put their counsel into practice."
 gharmargma.6.t:0 "The First Wish"
 gharmargma.6.d:0 "What do we wish for? Power? Wealth? Magic? Anything is within our grasp!"
 gharmargma.6.a:0 "We wish for strength."
 gharmargma.6.b:0 "We wish for riches."
 gharmargma.6.c:0 "We wish for mastery of magic."
 gharmargma.7.t:0 "Fate of the Ring"
 gharmargma.7.d:0 "Make the choice, use the contract and the prison to bind the Genie. Trap it and siphon its power for our own!"
 gharmargma.7.a:0 "Bind the genie. Its service has only begun."
 gharmargma.8.t:0 "The Second Wish"
 gharmargma.8.d:0 "What is our second wish? We can ask for so much - let us be more specific than last time."
 gharmargma.8.a:0 "Let our enemies break before us."
 gharmargma.8.b:0 "Let every bargain enrich us."
 gharmargma.8.c:0 "We wish to devour everything."
 gharmargma.9.t:0 "Beyond the Forest Camps"
 gharmargma.9.d:0 "The Jungle holds so many secrets - send out more expeditions! Find them!"
 gharmargma.9.a:0 "Bring home the expedition's findings."
 gharmargma.9.b:0 "Send more settlers."
 gharmargma.30.t:0 "Surpassing the Ancients"
 gharmargma.30.desc:0 ""
 gharmargma.30.a:0 "Provide the funds."
 gharmargma.31.t:0 "Shattering Stone"
 gharmargma.31.desc:0 ""
 gharmargma.31.a:0 "Continue with the means available."
 gharmargma.32.t:0 "A Genie Bound"
 gharmargma.32.desc:0 "We have bound a Genie! We now control its power!"
 gharmargma.32.a:0 "Record the binding and claim its service."
