 S45_aristocrats_and_officers_title:0 "Aristocrats and Officers"
 S45_aristocrats_and_officers_desc:0 "It's been a hundred years since we started the transformation from company to country. The officers that supported Kojo I in this endeavour have long since passed and now their descendants are styling themselves as nobles of the realm.\n\nMaybe there are benefits to a traditional nobility, but is it truly our way? Can we not forge a new path on which heritage does not supercede skill? Should the blood in their veins propel them to power? Or should it be the blood they spill in battle?"

