 S45_poison_their_hearts_tt:0 "When we declare war on a country in which we have a spynetwork of size §Y50§!, we fire the event §YPoison Their Hearts§!, either turning their ruler §YCraven§!, killing a random §YGeneral§! or applying §R-25%§! §YMorale Recovery Speed§! for §Y5§! years."
