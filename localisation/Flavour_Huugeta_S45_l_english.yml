 S45_tap_new_markets_title:0 "Tap New Markets"
 S45_tap_new_markets_desc:0 "The prosperity of our state hinges on the success of the Blood-Spurs. While our most prolific customers have declared us obsolete, there is always bloodshed to be found somewhere. We shall tap new markets, so that blood and coin may keep flowing."

