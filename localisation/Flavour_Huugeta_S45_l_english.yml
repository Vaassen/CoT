 S45_mercenary_excellence_desc:0 "Our current §YMercenary Momentum§! is §Y[Root.mercenaryMomentum.GetValue]§!.\nBreakdown:\nManpower and Force Limit Buildings (+1): §Y[Root.mercActionValue_building.GetValue]§!\nWeapons Manufactories and Soldier's Households (+5): §Y[Root.mercActionValue_manufactory.GetValue]§!\nEvery 5 Base Manpower Development (+1): §Y[Root.mercActionValue_dev.GetValue]§!\nOur Condottieri or Mercenaries Won Foreign Wars (+10): §Y[Root.mercActionValue_victory.GetValue]§!\nOur Condottieri or Mercenaries Won Battles (+1): §Y[Root.mercActionValue_battle.GetValue]§!\nOur Condottieri or Mercenaries Won Sieges (+1): §Y[Root.mercActionValue_siege.GetValue]§!\nOur Manpower Traded for Favours (+2): §Y[Root.mercActionValue_favors.GetValue]§!\nMilitary Advisor Hired (once per cycle, +5): §Y[Root.mercActionValue_advisor.GetValue]§!\nTook Mil Tech Ahead of Time: §Y[Root.mercActionValue_tech.GetValue]§!\nEvents: §Y[Root.mercActionValue_event.GetValue]§!\n\n§YBase Momentum§!: §Y[Root.baseMercenaryMomentum.GetValue]§!"
