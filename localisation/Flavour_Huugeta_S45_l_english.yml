 S45_mercenary_excellence_5_desc:0 "[Root.GetHuugetaMercEnterpriseDescription][Root.GetHuugetaMercEnterpriseDescriptionThreshold]"
 S45_mercenary_excellence_desc:0 "Our current §YMercenary Momentum§! is §Y[Root.mercenaryMomentum.GetValue]§!.\n\nActions that generate §YMercenary Momentum§!:\n\nBuildings:\n Manpower and Force Limit Buildings (+1): §Y[Root.mercActionValue_building.GetValue]§!\n Weapons Manufactories and Soldier's Households (+5): §Y[Root.mercActionValue_manufactory.GetValue]§!\nEvery 5 Base Manpower Development (+1): §Y[Root.mercActionValue_dev.GetValue]§!\nOur Manpower Traded for Favours (+2): §Y[Root.mercActionValue_favors.GetValue]§!\nMilitary Advisor Hired (+5): §Y[Root.mercActionValue_advisor.GetValue]/5§!\nTook Mil Tech Ahead of Time (+10): §Y[Root.mercActionValue_tech.GetValue]§!\nCondottieri Rented From Us:\n  Won a War (+10): §Y[Root.mercActionValue_condottieri_victory.GetValue]§!\n  Won a Battle (+1): §Y[Root.mercActionValue_condottieri_battle.GetValue]/20§!\n  Won a Siege (+2): §Y[Root.mercActionValue_condottieri_siege.GetValue]/20§!\nOur Mercenaries Hired by Others:\n  Won a War (+10): §Y[Root.mercActionValue_mercenary_victory.GetValue]§!\n  Won a Battle (+1): §Y[Root.mercActionValue_mercenary_battle.GetValue]/20§!\n  Won a Siege (+2): §Y[Root.mercActionValue_mercenary_siege.GetValue]/20§!\nEvents: §Y[Root.mercActionValue_event.GetValue]§!\n\n§YBase Momentum§!: §Y[Root.baseMercenaryMomentum.GetValue]§!"
 S45_mercenary_excellence_threshold:0 "\n§YNext Reward Threshold§!: §Y[Root.nextRewardThreshold.GetValue]§! [Root.GetHuugetaThresholdCheckmark]"
 S45_mercenary_excellence_maxed:0 "\nMercenary Excellence at Highest Tier"
 S45_mercenary_excellence_threshold_checkmark:0 "£yes£"
 S45_mercenary_excellence_threshold_cross:0 "£no£"
 S45_tamanyouchu_sabotage_tt:0 "When declaring war, all provinces owned by our §Ymain enemy§! and §Yclaimed§! by us will get the following modifier:"
 S45_exploited_dev_tt:0 "§YExploited§! development"
 S45_sack_pechuketema_tt:0 "We will sack §YPechekutema§! area, reducing §Ybase tax§! to §Y1§! in each province. For each point of development removed, we add §R1§! §Ydevastation§! and gain §G20§! §Ycrowns§!."
 S45_nobles_over_officers_bypass_tt:0 "We favoured the §YNobles§! in the mission §YAristocrats and Officers§!"
 S45_officers_over_nobles_bypass_tt:0 "We favoured the §Y§Y[Root.GetAdventurersName]§!§! in the mission §YAristocrats and Officers§!"
 S45_burghers_over_officers_bypass_tt:0 "We favoured the §YBurghers§! in the mission §YLogistics of a State§!"
 S45_officers_over_burghers_bypass_tt:0 "We favoured the §Y[Root.GetAdventurersName]§! in the mission §YLogistics of a State§!"
 S45_officers_over_church_bypass_tt:0 "We favoured the §Y[Root.GetAdventurersName]§! in the mission §YCollect the Wanderers§!"
 S45_church_over_officers_bypass_tt:0 "We favoured the §YChurch§! in the mission §YCollect the Wanderers§!"
 S45_vassalize_mengi_tt:0 "We will vassalize §YMengi§! countries with no more than §Y100§! development."
 S45_mercenary_excellence_3_tt:0 "Our §YMercenary Excellence§! modifier is at least tier §Y3§!."
 S45_more_fierce_negotiator_tt:0 "The §YFierce Negotiator§! personality will become twice as common for our rulers and heirs."
 S45_mercenary_enterprise_tt:0 "We unlock the §YMercenary Enterprise§! system. Through various actions, we gain §YMomentum§!, representing the strength and popularity of our sellswords. Every §Y10§! years, momentum resets, and we can choose a reward.\n\nAt certain breakpoints we will upgrade our §YMercenary Excellence§! modifier.\n"
 S45_logistics_of_a_state_effect_tt:0 "If we complete the mission by granting a monopoly on §YSlaves§!, our §Y[Root.GetAdventurersName]§! will grow more §YPowerful§!.\n\nOtherwise, our monopoly on §YGlass§! will grant §G+1§! §YDiplomatic Reputation§!, our monopoly on §YCloth§! will grant §G+5%§! §YMorale§! and neither will reduce our §YMaximum Absolutism§!."
 S45_horns_and_trumpets_effect_tt:0 "If we complete the mission by granting the §YFree Company Rosters§! privilege, our §Y[Root.GetAdventurersName]§! will grow more §YPowerful§!.\n\nOtherwise, the §YBattlemage Academies§! privilege will no longer cost §YArmy Tradition§! or reduce §YMaximum Absolutism§!"
 S45_aristocrats_and_officers_effect_tt:0 "If we complete the mission by granting the §YCourtiers of Adventure§! and §YEnnoblement of Adventurers§! privileges, our §Y[Root.GetAdventurersName]§! will grow more §YPowerful§!.\n\nOtherwise, the §YAristocratic Counselors§! privilege will no longer increase §YStability Cost Modifier§! or reduce §YMaximum Absolutism§!\n\n§REmpowering our [Root.GetAdventurersName] will grant significant rewards, but they won't materialise until the end of the Mission Tree.§!"
 S45_collect_the_wanderers_effect_tt:0 "If we complete the mission by choosing the §YLip Service§! reform and §YGenerous Quest Rewards§! privilege, our §Y[Root.GetAdventurersName]§! will grow more §YPowerful§!.\n\nOtherwise, the §YReligious Culture§! privilege will grant an additional §G+1§! §YTolerance of the True Fatih§! and no longer reduce §YMaximum Absolutism§!"
 S45_foreign_fodder_effect_tt:0 "If we complete the mission by choosing a §YNon-Human Military Reform§!, our §Y[Root.GetAdventurersName]§! will grow more §YPowerful§!.\n\nOtherwise:"
 S45_merchants_of_death_tt:0 "Using the §YSlander Merchants§! covert action allows us to apply §R-5%§! §YMorale§!, §R-10%§! §YArtillery Combat Ability§! or §R-10%§! §YInfantry and Cavalry Combat Ability§! to the target for §Y5 Years§!"
 S45_mercenary_chapter_tt:0 "Any current and future §YMercenary Home Province§! with a §YManpower Building§!, §YFort§! and §Y5 Base Manpower§! will also receive this modifier."
 S45_telekenid_wars_tt:0 "Our §YCondottieri§! or §YMercenaries§! from our lands were §YVictorious§! in §Y3§! wars between countries holding land in the §YTelekenid§! region. Currently: §Y[Root.telekenidWars.GetValue]§!"
 S45_mercenary_excellence_1_tt:0 "§YMercenary Excellence§! modifier is at least tier §Y1§!."
 S45_poison_their_hearts_tt:0 "When we declare war on a country in which we have a spynetwork of size §Y50§!, we fire the event §YPoison Their Hearts§!, either turning their ruler §YCraven§!, removing a random §YGeneral§! or applying §R-25%§! §YMorale Recovery Speed§! for §Y5§! years."
 S45_convert_5_provinces:0 "Convert §Y5§! provinces\n"
 S45_sky_domain_ae_tt:0 "Every Sky Domain country loses §G50§! aggressive expansion toward us.\n"
 S45_unlock_lion_warriors_tt:0 "We will be able to hire the §YLion Warriors§! mercenary company."
 S45_own_important_madriamilak_parts_tt:0 "We own every §YCentre of Trade§!, §YMercenary Home Province§!, and §YGreat Project§! in §YMadriamilak§! (§YDenibari, Yetefesefi, Telekenid§!)."
 S45_improved_cleanse_sins_tt:0 "The §YCleanse the Sins of the Riyitewag§! religious action will refill §G50%§! of the §YManpower Reserves§! of §YHired Mercenaries§! that currently have less than §Y50%§!."
 S45_replenish_depleted_mercs_tt:0 "§YHired Mercenaries§! that currently have less than §Y50%§! of their §YManpower§! will replenish §G50%§!."
 S45_has_no_non_humans_tt:0 "Has no §YNon-Human Minorities§!."
 S45_has_accepted_non_humans_tt:0 "Has any §GCoexisting§! or §TIntegrated§! §YNon-Human Minority§!."
 S45_free_company_rosters_upgrade_tt:0 "The privilege §YFree Company Rosters§! no longer reduces §YMaximum Absolutism§!"
 S45_unlock_plutocratic_ideas_tt:0 "Allow §YPlutocratic§! Idea Group."
 S45_yetmesiran_advisor_tt:0 "Depending on our §YNational Focus§! we will gain a §YPhilosopher§!, §YStatesman§!, or §YArmy Reformer§!."
 S45_yetmesira_vassalize_tt:0 "If §YYetmesira§! has no more than §Y100§! development, we will §YVassalise§! them. Otherwise, we gain a §YSubjugation Casus Belli§! against them."
 S45_slaves_manpower_tt:0 "We gain §G3§! §YBase Manpower§! in every province producing §YSlaves§!."
