l_english:
 S45_finish_the_job_title:0 "Finish the Job"
 S45_finish_the_job_desc:0 "When we first founded our capital, the lord of Mukis felt he had a royal right to our lands. But we felled his forces, proving his claim bogus.\n\nIn the reign of the late Kojo V, our rivals turned to the darkness for help, slaying our king with a curse sent by the Night Hags. In turn, we crushed their army and seized most of their lands.\n\nBut it seems the lesson has not yet landed, so let us deliver it one final time, in force. MIGHT makes RIGHT."

