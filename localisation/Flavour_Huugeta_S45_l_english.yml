 estate_officers:0 "Mercenary Officers"
 estate_officers_desc:0 "Huugeta, country in name, but mercenary company at heart. Here, the officers of the Blood-Spur company hold considerable sway over affairs of the realm."

 huugeta.0.t: "Debug Event"
 huugeta.0.d: "Debug event to gain max conquest scope or max our Mercenary Momentum."
 huugeta.0.a: "Acquire Madriamilak"
 huugeta.0.b: "Gain Max Momentum"

 huugeta.1.t: "Enterprise Yields"
 huugeta.1.d: "Another cycle has passed, let's extract some profits from our enterprise."
 huugeta.1.a: "Take our share in gold."
 huugeta.1.b: "Move some officers to the national army"
 huugeta.1.c: "Implement what we have learned abroad"

 huugeta.2.t: "Poison Their Hearts"
 huugeta.2.d: "The hidden blade holds great potential, moving unseen among our foes. But a blade need not cut to harm. Let it flash a smile at its victims, poisoning their hearts with fear."
 huugeta.2.a: "Let the ruler know fear."
 huugeta.2.b: "Let the generals know fear."
 huugeta.2.c: "Let the common soldiers know fear."
 huugeta.2.e: "Let the blade stay sheathed for now."

 huugeta.3.t: "Buying and Selling"
 huugeta.3.d: "We buy a bunch of slaves from Yetmesira. They'll be heading into battle soon. Some who come back may be sold back, fetching a high price as accomplished fighters. Or they might become free men in our company."
 huugeta.3.a: "A mutually beneficial deal."

 huugeta.4.t: "A New Empire"
 huugeta.4.d: "We've built a grand realm through violent expansion. We've adopted the symbols of legitimacy to diffuse dissent, but everyone knows it was our sword that won this prize."
 huugeta.4.a: "No more pretense. It is swordsmen who rule."

 huugeta.101.t: "Arming the Blood-Spurs"
 huugeta.101.d: "The Blood-Spurs are the core of our mercenary enterprise, and in dire need of more weapons."
 huugeta.101.a: "They can wait a little longer."
 huugeta.101.b: "Let's acquire some."
 huugeta.101.c: "Do our peasants really need their plowshares?"

 huugeta.102.t: "Small-Time Clients"
 huugeta.102.d: "It's not just states that hire our men. Local lords, merchants and townships make up a significant part of our revenue. Sometimes they get left behind when our focus lies abroad."
 huugeta.102.a: "Our grand ambitions are more important."
 huugeta.102.b: "We must continue to serve the smaller clients."
 huugeta.102.c: "Divert some men right away!"

 huugeta.103.t: "Family Matters"
 huugeta.103.d: "The orphans that traditionally make up the ranks of the Deathsworn seem to be in short supply, and our chapter in Kadmuduuk is struggling. Should we step in?"
 huugeta.103.a: "Not right now."
 huugeta.103.b: "Surely recruits with parents perform just as well?"
 huugeta.103.c: "I think we can find some orphans in our newly acquired lands."

 huugeta.104.t: "Target Practice"
 huugeta.104.d: "The Skybows of the Horn have been found to be slacking, they should get some practice."
 huugeta.104.a: "Surely, they'll organise it themselves?"
 huugeta.104.b: "We've got some lighting-fast guinea fowl they can practice on."
 huugeta.104.c: "They are meant to shoot harpies, no?"

 huugeta.105.t: "Horns of Blasting"
 huugeta.105.d: "Mercs armed with magical weaponry are great, but the damestear required for maintenance is expensive"
 huugeta.105.a: "They should learn to swing a sword."
 huugeta.105.b: "Force our mages to give us some blue rocks."
 huugeta.105.c: "Let's open up some mines in [damestear_province.GetName]"

 huugeta.106.t: "Everything the Lion Touches"
 huugeta.106.d: "The proud Metobesebi mercenaries demand we reward their service by giving their people more land."
 huugeta.106.a: "ou get coin, just like everyone."
 huugeta.106.b: "We can help expand some settlements."
 huugeta.106.c: "You can have [foreign_province.GetName]"

 huugeta.107.t: "Rhino Riders"
 huugeta.107.d: "The Rhino Riders are a band steeped in cumbersome traditions, like letting a steed choose its rider. These traditions often put them at odds with the demands of the enterprise."
 huugeta.107.a: "Traditions are a mercenary's birth right."
 huugeta.107.b: "A compromise should be possible."
 huugeta.107.c: "Threaten their precious rhinos to get their asses in gear."

 huugeta.108.t: "Fieldstalker Sellclaws"
 huugeta.108.d: "The gnolls in our enterprise are a rowdy lot, even for mercenaries. Not everyone is a fan and their contracts are a little sparse."
 huugeta.108.a: "They fight well, that's all we care about."
 huugeta.108.b: "We can invest in some public relations."
 huugeta.108.c: "They can make up the difference through copious looting."

 huugeta.109.t: "Lodge of the Brave"
 huugeta.109.d: "We don't know if it's a lizard thing, a southern thing, or just a weird thing, but the Lodge of the Brave produces a suspicious number of female leaders. Should we allow that?"
 huugeta.109.a: "A man should lead them."
 huugeta.109.b: "Not our business, is it?"
 huugeta.109.c: "Our people could learn from them."

 huugeta.110.t: "Dakinshi Bandits"
 huugeta.110.d: "The line between mercenary and bandit is always a fine one, but in the case of the Dakinshi, it's blurred beyond recognition."
 huugeta.110.a: "But we don't mind a bit of gray."
 huugeta.110.b: "We need to legitimize them in the eyes of potential clients."
 huugeta.110.c: "We need to fire the worst of them."

 huugeta.111.t: "Leopard Warband"
 huugeta.111.d: "The Leopard shifters, while fierce, aren't really getting with the times. A bit more gunpowder would do them good."
 huugeta.111.a: "How does a leopard hold a gun?"
 huugeta.111.b: "Tactics training is in order."
 huugeta.111.c: "They need to adopt our modern way of war."

 huugeta.112.t: "Thunder Runners"
 huugeta.112.d: "Mercs across the world are adapting to a new way of war. There are shining examples and regrettable stragglers. The Thunder Runners are the former, and the latter are causing trouble out of resentment."
 huugeta.112.a: "It'll all work itself out"
 huugeta.112.b: "We'll grease the wheels to calm them."
 huugeta.112.c: "We favour the vanguard of a new age."
