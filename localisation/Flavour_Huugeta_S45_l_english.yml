l_english:
 S45_finish_the_job_title:0 "Finish the Job"
 S45_finish_the_job_desc:0 "As soon as we are able, Mukis needs to be destroyed for good and our grasp on all their lands solidified. Then, learn from their spies."

 S45_repay_the_betrayal_title:0 "Repay the Betrayal"
 S45_repay_the_betrayal_desc:0 "Our former clients thought they could do without us, didn't think us worthy of being their ally. They will pay for this slight."

 S45_take_the_whole_house_title:0 "Take the Whole House"
 S45_take_the_whole_house_desc:0 "In the past, we had to smuggle glass out of Fuulmana, now we're just going to take it all."

 S45_heirs_of_the_dragon_title:0 "Heirs of the Dragon"
 S45_heirs_of_the_dragon_desc:0 "So many lords live in the long shadow cast by Zenidir, even through the centuries. We will claim the dragon's legacy."

 S45_tap_new_markets_title:0 "Tap New Markets"
 S45_tap_new_markets_desc:0 "Our states lives or dies by the success of the Blood-Spurs. With our former clients gone, we must seek new wars to fight in"

 S45_seize_the_golden_valley_title:0 "Seize the Golden Valley"
 S45_seize_the_golden_valley_desc:0 "Grain? Ours.\n\nGold? Ours.\n\nThe Werikgetan spy organisation? Ours too."

 S45_logistics_of_a_state_title:0 "Logistics of a State"
 S45_logistics_of_a_state_desc:0 "What purpose does our economy serve? And whose interests?"

 S45_the_lustre_of_coin_title:0 "The Lustre of Coin"
 S45_the_lustre_of_coin_desc:0 "Many think our endless violence will drain our coffers and make our realm collapse. But our violence generates wealth and wealth begets power."

 S45_expand_the_family_title:0 "Expand the Family"
 S45_expand_the_family_desc:0 "The Deathsworn are incredible fighters and some of them work as mercenaries. Bring them into the fold, they'll pay dividends"

 S45_horns_and_trumpets_title:0 "Horns and Trumpets"
 S45_horns_and_trumpets_desc:0 "The Rhino Riders and Death Trumpets will bolster our mercenary enterprise."

 S45_war_in_the_north_title:0 "War in the North"
 S45_war_in_the_north_desc:0 "There's trouble afoot in the north, that's good for business. Let's see who wants to pay for our help."

 S45_ambition_given_form_title:0 "Ambition Given Form"
 S45_ambition_given_form_desc:0 "It's become clear that the greatest form of legitimacy is violence. With that in mind, we're going to chart a course toward the unification of Madriamilak"

 S45_look_to_us_title:0 "Look to Us"
 S45_look_to_us_desc:0 "Whether we believe in it or not, divine right is a powerful tool for a ruler. We will adopt the appearance of a righteous Mezhi."

 S45_no_one_left_to_deny_us_title:0 "No One Left to Deny Us"
 S45_no_one_left_to_deny_us_desc:0 "The great Mezhi, the pious Semayebaka, the wealthy merchants. All doubted us. But those that are left are forced to acknowledge our achievements."

 S45_aristocrats_and_officers_title:0 "Aristocrats and Officers"
 S45_aristocrats_and_officers_desc:0 "The old guard of officers now style themselves hereditary nobles and are fighting against the rise of new officers"

 S45_collect_the_wanderers_title:0 "Collect the Wanderers"
 S45_collect_the_wanderers_desc:0 "The bands of roaming Riyitewag can often be coralled through religious fervour, though we could also throw gold at them."

 S45_foreign_fodder_title:0 "Foreign Fodder"
 S45_foreign_fodder_desc:0 "Do we care if foreigners, other races even, join the ranks of the Blood-Spurs?"

 S45_our_favoured_peddlers_title:0 "Our Favoured Peddlers"
 S45_our_favoured_peddlers_desc:0 "Yetmesira has become part of our realm and we are making sure their entire slave trade benefits our enterprise."

 S45_enduring_partnership_title:0 "Enduring Partnership"
 S45_enduring_partnership_desc:0 "While some nations forsake us, the slave traders of Yetmesira remain our partners. We buy their slaves to fuel the company and they hire us when needed."

 S45_learn_from_our_partners_title:0 "Learn from our Partners"
 S45_learn_from_our_partners_desc:0 "The recent conflict has demonstrated how green our realm is. We should get some guidance from our trusted partners."

 S45_surpassed_title:0 "Surpassed"
 S45_surpassed_desc:0 "Our partnership has been fruitful, but we have grown far beyond needing Yetmesira. It's time to renegotiate some deals."


