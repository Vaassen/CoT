 S45_mercenary_enterprise_tt: "We will unlock the §YMercenary Enterprise§! system. Through various actions, we gain §YMomentum§!, representing the strength and popularity of our sellswords. Every §Y10§! years, momentum resets, and we can choose to gain a payout of §Ycrowns§!, §Yarmy tradition§! or §Yarmy professionalism§!.\n\nAt certain breakpoints we will upgrade our §YMercenary Excellence§! modifier, granting §Ymercenary discipline§!, §Ymercenary leader army tradition§!, and §Ypower projection from insults§! as well as starting each cycle at higher §YBase Momentum§!\n\nConsult the description of the §YMercenary Excellence§! modifier for a breakdown of your current §YMomentum§!"

