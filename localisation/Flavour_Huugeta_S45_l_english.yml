 S45_more_fierce_negotiator_tt:0 "The §YFierce Negotiator§! personality will become twice as common for our rulers and heirs."
 S45_mercenary_enterprise_tt:0 "We unlock the §YMercenary Enterprise§! system. Through various actions, we gain §YMomentum§!, representing the strength and popularity of our sellswords. Every §Y10§! years, momentum resets, and we can choose a reward.\n\nAt certain breakpoints we will upgrade our §YMercenary Excellence§! modifier.\n"
 S45_logistics_of_a_state_effect_tt:0 "If we complete the mission by granting a monopoly on §YSlaves§!, our §YOfficers§! will grow more §YPowerful§!.\nOtherwise, our monopoly on §YGlass§! will grant §G+1§! §YDiplomatic Reputation§!, our monopoly on §YCloth§! will grant §G+5%§! §YMorale§! and neither will reduce our §YMaximum Absolutism§!."
 S45_horns_and_trumpets_effect_tt:0 "If we complete the mission by granting the §YFree Company Rosters§! privilege, our §YOfficers§! will grow more §YPowerful§!.\nOtherwise, the §YBattlemage Academies§! privilege will no longer cost §YArmy Tradition§! or reduce §YMaximum Absolutism§!"
 S45_aristocrats_and_officers_effect_tt:0 "If we complete the mission by granting the §YCourtiers of Adventure§! and §YEnnoblement of Adventurers§! privileges, our §YOfficers§! will grow more §YPowerful§!.\nOtherwise, the §YAristocratic Counselors§! privilege will no longer increase §YStability Cost Modifier§! or reduce §YMaximum Absolutism§!\n\n§REmpowering our Officers will grant significant rewards, but they won't materialise until the end of the Mission Tree.§!"
 S45_collect_the_wanderers_effect_tt:0 "If we complete the mission by choosing the §YLip Service§! reform and §YGenerous Quest Rewards§! privilege, our §YOfficers§! will grow more §YPowerful§!.\nOtherwise, the §YReligious Culture§! privilege will grant an additional §G+1§! §YTolerance of the True Fatih§! and no longer reduce §YMaximum Absolutism§!"
 S45_foreign_fodder_effect_tt:0 "If we complete the mission by choosing a §YNon-Human Military Reform§!, our §YOfficers§! will grow more §YPowerful§!.\nOtherwise:"
 S45_merchants_of_death_tt:0 "Using the §YSlander Merchants§! covert action allows us to apply §R-5%§! §YMorale§!, §R-10%§! §YArtillery Combat Ability§! or §R-10%§! §YInfantry and Cavalry Combat Ability§! to the target for §Y5 Years§!"
 S45_mercenary_chapter_tt:0 "Any current and future §YMercenary Home Province§! with a §YManpower Building§!, §YFort§! and §Y5 Base Manpower§! will also receive this modifier."
 S45_telekenid_wars_tt:0 "Our §YCondottieri§! or §YMercenaries§! from our lands were §YVictorious§! in §Y3§! wars between countries holding land in the §YTelekenid§! region. Currently: §Y[Root.telekenidWars.GetValue]§!"
