  citadel_cult_aspect_1:0 "Cult of the Citadel"
  desc_citadel_cult_aspect_1:0 "One of the many local sects of the Bulwari Sun Cult. The Cult of the Citadel believes that during the final battle between Surakel and the Malevolent Dark a great army will descend upon Bulwar. The sect sees the restoration and maintenance of Azka-szel-Azka, the Citadel of Citadels, as a religious duty, as its walls will be the shield of Surakel’s Garden. No doubt inspired by the resilience of their northern Ourdi cousins, who have fought demonic invasions in the past, the citadel cultists value martial skill, with every settlement performing combat practices for the young and the adults during an assigned time of the year. Temp Loc"
