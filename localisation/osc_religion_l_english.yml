  hammuraway_cult_aspect_1:0 "Way of Hammura"
  desc_hammuraway_cult_aspect_1:0 "Group of people from Eduz Vacyn, that believe that many of the decisions taken by the Cult of Brasan assumed too much, this group puts the words and lessons of Hammura the wise above all others, and question many of the doctrines of the sun cult that have their origin beyond Hammura Temp Loc"
