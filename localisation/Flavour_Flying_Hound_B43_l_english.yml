#Missions
 B43_home_of_the_stray_title:0 "Home of the Stray"
 B43_home_of_the_stray_desc:0 "We are far from home, but this land can become our homeland if we put on the work."

 B43_and_the_prideful_ones_title:0 "And the Prideful Ones"
 B43_and_the_prideful_ones_desc:0 ""Our growing homeland needs its people to defend it too, we must ensure we can meet the nessecities of our warriors.

 B43_ruins_of_history_title:0 "Ruins of History"
 B43_ruins_of_history_desc:0 "The old Chivalric city of Taranton has been owned by Grasshopper Munchers for a long a wile now, we must see to renovate it."

 B43_knightsmarch_title:0 "Knightsmarch"
 B43_knightsmarch_desc:0 "Western Escann is rightfuly ours to take, under our glory the region shall be build anew with our people."

 B43_warm_walls_title:0 "Warm Walls"
 B43_warm_walls_desc:0 "With Devaced in our hands, its walls would make a better safeplace for our people than our current localtion."

 B43_booming_clan_title:0 "Booming Clan"
 B43_booming_clan_desc:0 "Far away from our land we have found ourselfs a land ready for the taking. We must seek to expand our clan!"

 B43_pride_of_escann_title:0 "Pride of Escann"
 B43_pride_of_escann_desc:0 "Near us, the old city of Vernham still stands. We should claim it and build it up in our image."

 B43_seeking_the_glimmer_title:0 "Seeking the Glimmer"
 B43_seeking_the_glimmer_desc:0 "Elgek wants to find out more about this armored riders of old Escann."

 B43_the_call_of_duty_title:0 "The Call of Duty"
 B43_the_call_of_duty_desc:0 "The words of that fancy book said that the greatest knights were honorful and fought evil, so we shall do so too."

 B43_united_in_battle_title:0 "United in Battle"
 B43_united_in_battle_desc:0 "Goblins together strong! They shall learn the ways of chivalry too! Maybe that way they will see how much we can thrive here."

 B43_break_the_cleaver_title:0 "Break the Cleaver"
 B43_break_the_cleaver_desc:0 "Rotcleaver is the most powerful clan of Orcs near us and they have been threatening us and Grasshoppers for too long!"

 B43_taste_of_honor_title:0 "Taste of Honor"
 B43_taste_of_honor_desc:0 "By sword and at the back of our mounts we shall achieved greatness."

 B43_break_the_deadfangs_title:0 "Break the Deadfangs"
 B43_break_the_deadfangs_desc:0 "To our south the clan of Deathfang still resides, their mere exitances is a thread to all good people of Escann."

 B43_consolidate_the_south_title:0 "Consolidate the South"
 B43_consolidate_the_south_desc:0 "Southern Escann is the place we claimed first as our home, we made this land ours and is now time we make true to that claim."

 B43_union_of_the_strong_title:0 "Union of the Strong"
 B43_union_of_the_strong_desc:0 "The chivalric ways demand we are protectors of all those fair, and that is not just goblins. Our clan is one for all the worthy."

 B43_a_crusade_of_our_own_title:0 "A Crusade of our Own"
 B43_a_crusade_of_our_own_desc:0 "TO WAR! Our Knights are exited at the idea of becoming crusaders. We are not 100% sure what that entails yet but we will give it all anyways!"

 B43_knights_of_the_garden_title:0 "Knights of the Garden"
 B43_knights_of_the_garden_desc:0 "Rise High! Oh Banner of the Hound. Today, we goblins have transcended the stories of old!"

