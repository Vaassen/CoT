 #Estate and Privileges
 B43_chivalric_knights:0 "Chivalric Knights"

 estate_nobles_patronage_of_the_chivalric_ways_privilege:0 "Patronage of the Chivalric Ways"
 estate_nobles_patronage_of_the_chivalric_ways_privilege_desc:0 "To ensure the well being of the realms chivalric culture we have made a deal with the Knight class to help promote the values of the Chivalric Ways."
 estate_nobles_unbreakable_knights_privilege:0 "Unbreakable Knights"
 estate_nobles_unbreakable_knights_privilege_desc:0 "When our goblins march to war they do so knowing they fighting for the glory of Chivalry. When they return home they are honored for their sacrifice, being guaranteed the right to ascension in our military ladder."
 estate_nobles_feed_the_homeland_privilege:0 "Feed the Homeland"
 estate_nobles_feed_the_homeland_privilege_desc:0 "Many are the children of our great clan that march to war, and thus many are the mouths we must keep well fed. Our great court of advisors works tirelessly to ensure we can keep them well fed."


 #Church Aspect
 chivalry_cult:0 "Chivalry Cult"
 chivalry_cult_desc:0 "Emerging from the stories Old Escann, the Cult of Chivalry is a combination of tales, folklore and surviving writings of the old schools of Chivalry and their legendary Knights. Followed by the Goblins of our realm, it also has found a place amongs the humans living in our land as the cult also inherits many teachings from the Cult of Adean."


