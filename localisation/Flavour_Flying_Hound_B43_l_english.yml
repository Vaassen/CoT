l_english:
#Missions
 B43_home_of_the_stray_title:0 "Home of the Stray"
 B43_home_of_the_stray_desc:0 "We are far from home, but this land can become our homeland if we put on the work."

 B43_and_the_prideful_ones_title:0 "And the Prideful Ones"
 B43_and_the_prideful_ones_desc:0 ""Our growing homeland needs its people to defend it too, we must ensure we can meet the nessecities of our warriors.

 B43_ruins_of_history_title:0 "Ruins of History"
 B43_ruins_of_history_desc:0 "The old Chivalric city of Taranton has been owned by Grasshopper Munchers for a long a wile now, we must see to renovate it."

 B43_knightsmarch_title:0 "Knightsmarch"
 B43_knightsmarch_desc:0 "Western Escann is rightfuly ours to take, under our glory the region shall be build anew with our people."

 B43_warm_walls_title:0 "Warm Walls"
 B43_warm_walls_desc:0 "With Devaced in our hands, its walls would make a better safeplace for our people than our current localtion."

 B43_booming_clan_title:0 "Booming Clan"
 B43_booming_clan_desc:0 "Far away from our land we have found ourselfs a land ready for the taking. We must seek to expand our clan!"

 B43_pride_of_escann_title:0 "Pride of Escann"
 B43_pride_of_escann_desc:0 "Near us, the old city of Vernham still stands. We should claim it and build it up in our image."

 B43_seeking_the_glimmer_title:0 "Seeking the Glimmer"
 B43_seeking_the_glimmer_desc:0 "Elgek wants to find out more about this armored riders of old Escann."

 B43_the_call_of_duty_title:0 "The Call of Duty"
 B43_the_call_of_duty_desc:0 "The words of that fancy book said that the greatest knights were honorful and fought evil, so we shall do so too."

 B43_united_in_battle_title:0 "United in Battle"
 B43_united_in_battle_desc:0 "Goblins together strong! They shall learn the ways of chivalry too! Maybe that way they will see how much we can thrive here."

 B43_break_the_cleaver_title:0 "Break the Cleaver"
 B43_break_the_cleaver_desc:0 "Rotcleaver is the most powerful clan of Orcs near us and they have been threatening us and Grasshoppers for too long!"

 B43_taste_of_honor_title:0 "Taste of Honor"
 B43_taste_of_honor_desc:0 "By sword and at the back of our mounts we shall achieved greatness."

 B43_break_the_deadfangs_title:0 "Break the Deadfangs"
 B43_break_the_deadfangs_desc:0 "To our south the clan of Deathfang still resides, their mere exitances is a thread to all good people of Escann."

 B43_consolidate_the_south_title:0 "Consolidate the South"
 B43_consolidate_the_south_desc:0 "Southern Escann is the place we claimed first as our home, we made this land ours and is now time we make true to that claim."

 B43_union_of_the_strong_title:0 "Union of the Strong"
 B43_union_of_the_strong_desc:0 "The chivalric ways demand we are protectors of all those fair, and that is not just goblins. Our clan is one for all the worthy."

 B43_a_crusade_of_our_own_title:0 "A Crusade of our Own"
 B43_a_crusade_of_our_own_desc:0 "TO WAR! Our Knights are exited at the idea of becoming crusaders. We are not 100% sure what that entails yet but we will give it all anyways!"

 B43_knights_of_the_garden_title:0 "Knights of the Garden"
 B43_knights_of_the_garden_desc:0 "Rise High! Oh Banner of the Hound. Today, we goblins have transcended the stories of old!"

 B43_allies_in_the_dark_title:0 "Allies in the Dark"
 B43_allies_in_the_dark_desc:0 "We find ourselfs far from home, we will not be able to survive, at least not alone."

 B43_a_helping_hand_title:0 "A Helping Hand"
 B43_a_helping_hand_desc:0 "Grasshoper still does not trust us, we shall prove to them we are trustworthy allies."

 B43_de_feathering_title:0 "De-Feathering"
 B43_de_feathering_desc:0 "To our south, the clan of the Raven threatens our people with its mere presence. We need to put an end to them."

 B43_glory_of_old_title:0 "Glory of Old"
 B43_glory_of_old_desc:0 "This lands were once the home of some of the greatest warriors of the world. Their stories shall not be forgotten."

 B43_claim_the_gleam_title:0 "Claim the Gleam"
 B43_claim_the_gleam_desc:0 "To the East lies the Bladeskeep, one of the coolest... i mean most respected institutions of the Chivalric World, it shall be ours."

 B43_stewardiest_stewards_title:0 "Stewardiest Stewards"
 B43_stewardiest_stewards_desc:0 "With the Bladeskeep in our hands we now have the duty to repair and protect it. That way we will show we are worthy stewards."

 B43_warrior_culture_title:0 "Warrior Culture"
 B43_warrior_culture_desc:0 "To achieve the dream and become the icons of a new age of chilvary we must ensure our people embody the ideals too."

 B43_children_of_escann_title:0 "Children of Escann"
 B43_children_of_escann_desc:0 "This is our new homeland, we must not only build it up but protect it and make sure our future generations can survive here too."

 B43_high_chivalric_culture_title:0 "High Chivalric Culture"
 B43_high_chivalric_culture_desc:0 "We have come far as a people, the Hounds now fly higher than ever."


#Events
 flavour_flying_hound.1.t:0 "The Feral Cry of Freedom"
 flavour_flying_hound.1.d:0 "Out on the desolate roads of Godsescker sits a tavern that has been left to ruin. But life stirs around this run-down shack. A host of dog riders has gathered here eagerly awaiting the opportunity to join what they believe is a bright path forward. Bursting forth from the tavern door, a goblin clad in leather armor embroidered with a winged dog on its back, accompanied by an entourage of goblins wearing similar leathers. The crowd cheers in a series of howls as Elgek, the new clanboss of the Flying Hound clan stands before them. He looks upon all those who have rallied to his cause and shouts, \n\n“HOUNDS!!!” The crowd grows silent. “Korgus is dead…” The crowd erupts into celebratory cheers but Elgek quickly shushes that. \n\n“...and nothing has changed,” Elgek pauses before continuing. “We are free just as we have always been since the day we stepped foot outside those damned mountains!” \n\n“You see, in those caves we were caged in. Cramped halls always leave you backed in a corner, easy prey to those who would see us in chains.”  \n\n“But here? There's more than enough space! It's so open no one could possibly catch us! Not a horse, warg or spider could match the speeds of our dogs!” \n\n“And that's the truth, we have been free for decades now! But only with Korgus’ death can we see that it was fear that held us back all those years! As long as we have had our rides, we have been free in this land!” \n\n“So Let’s finally show these orcs that we are not slaves! Let’s show these adventurers that we belong in this land! And let's stop behaving like cowards and show that when you back a Flying Hound into a corner, you get bit!” \n\nCheers erupt as Elgek makes his way from the tavern entrance through the crowd, receiving slaps on the back from his fellow riders along the way, towards his ride. Hopping on, Elgek lets out a final rallying cry."
 flavour_flying_hound.1.a:0 "Come on you dogs! Let's ride!!"
 flavour_flying_hound.2.t:0 "Amongs the Ruins"
 flavour_flying_hound.2.d:0 "Elgek and a bunch of Gobbos go to Devaced to pillage it. Theres a bit of tencion between them and the Orcs that where already there but it does not escalate. Pillaging the city, someone finds an old book. They show it to Elgek and although he cannot understand a single word of what the book says bit he gets enamorated by the drawins, thinking of them as the escanni equivalent to the great goblin spider riders of the spine. He wants to learn more."
 flavour_flying_hound.2.a:0 "We must learn more"
 flavour_flying_hound.3.t:0 "Visions of the Epic"
 flavour_flying_hound.3.d:0 "In [Root.getflying_hound_occupied_capital] the goblins have found even more information about this great riders of old, wearing shinny armor. This time they force a captive to tell them what it sais. They learn of the military tactics of old, of the great chivalric knights that made Escann famous and of their dids. Elgek believes this is their calling, they have to prove themselves better than this great warriors. In really hes just fanboying over the knights and wants to immitate them very much."
 flavour_flying_hound.3.a:0 "We must learn more"
 flavour_flying_hound.4.t:0 "Tales, Pretty Little Things"
 flavour_flying_hound.4.d:0 "We have been studying the stories of Old Adenica for a while now. The Grasshopper clan has put much effort to make sure they take care of Taranton i recent time, and doing so have come to adopt many of the traditions of the old Chivalric Kingdom. As of today, their clan has rebranded, seeking to better embody this legacy. They now seek our approval."
 flavour_flying_hound.4.a:0 "There is much Wisdom in the Old"
 flavour_flying_hound.4.b:0 "We must Carve our own Path"
 flavour_flying_hound.4.c:0 "Devote yourselfs to the First of all Knights"
 flavour_flying_hound.5.t:0 "STOP SCREAMING"
 flavour_flying_hound.5.d:0 "Said the leader of the expedition. The orcs, chained and angry, did not obey. They could be heard saying all sorts of grose things to their captors. They soon arrived to the camp where our ruler is. He has to now decide what to do with the Orcs."
 flavour_flying_hound.5.a:0 "Let them Live, but they must be loyal to us now"
 flavour_flying_hound.5.b:0 "Dead to the Monsters!"
 flavour_flying_hound.6.t:0 "The First Covenant"
 flavour_flying_hound.6.d:0 "Goblins from Western Escann come together to discuss the future of their people. The Chivalric ways have proven succesful, and thus they now seek to forge their realm anew under this idea."
 flavour_flying_hound.6.a:0 "We shall be true knights!"
 flavour_flying_hound.7.t:0 "At the Beasts Grave"
 flavour_flying_hound.7.d:0 "Our knights have striken a decisive victory against the Orcs of Deadfang. We have marchet into their former capital of Beastgrave to take what we can and defeat. We have to choose what to do with the Humans and the Orcs. Theres 2 plans presented by our advisors."
 flavour_flying_hound.7.a:0 "Plan A. Help both groups leave and Orcs leave"
 flavour_flying_hound.7.b:0 "Plan B. Give them a Home in our Land"
 flavour_flying_hound.7.c:0 "Plan C. This Beasts Deserve no Mercy"
 flavour_flying_hound.8.t:0 "The Raven Calls"
 flavour_flying_hound.8.d:0 "Leader of the Raven Banner has seen an opportunity to use the Goblins newfound Chivalric ways in his favor. He has come to the clanleader and has begged for help freeing the Corvurian people from the tyrany of the masquarade. The gobbos eat it all up, having big dreams of becoming known as Crusaders and truly enshrining themselves amongs the great chivalric knights. They accept with the condition that the Raven Banner joins the clan."
 flavour_flying_hound.8.a:0 "Rally to Arms!"
 flavour_flying_hound.9.t:0 "Midnight Ends"
 flavour_flying_hound.9.d:0 "We kicked some vampire ass alright. Now is time to purge Corvuria of vampires. We shall proclaim the ruler of the Raven Banner/March as the new King of Corvuria. He now asks how he can repay us."
 flavour_flying_hound.9.a:0 "Empty the Coffers, we must pay our knights"
 flavour_flying_hound.9.b:0 "Tell our Story! Let our Tale be Known"
 flavour_flying_hound.9.c:0 "Nothing, you will need all the resources you can use"
 flavour_flying_hound.10.t:0 "Assemble the Round Table"
 flavour_flying_hound.10.d:0 "The most powerful and well respected goblins of the land have come together to conform the round."
 flavour_flying_hound.10.a:0 "It is time for Goblins to Make their place in the World"
 flavour_flying_hound.10.b:0 "For a better Escann, the Blade marches on!"
 flavour_flying_hound.10.c:0 "WE ARE CHIVALRY, WE ARE KNIGHTLYHOOD, WE ARE ADEANS CHOOSEN"
 flavour_flying_hound.11.t:0 "We Shall Endure"
 flavour_flying_hound.11.d:0 "That was Elgeks first words in his message to his kin. The Clanbosses from Earworm and Grasshopper Munchers had been presented with a letter of alliance written by Elgek himself. Earworm accepted, seeing their position challenged by the Marcher lords. Grasshopper Munchers however denied, siting their distrust of other goblins. Elgek is not ready to give up on them however, we shall prove we are trustworthy allies."
 flavour_flying_hound.11.a:0 "They shall come to like us too"
 flavour_flying_hound.12.t:0 "The Ravens Chicks"
 flavour_flying_hound.12.d:0 "Our war against the Ravens Banner has been a success and we have capture those who we recognized as "Goblin Hunters" coming into ours and Earworms land to kill our folk. The goblins want their heads on a plate but we are not so sure if that is a good idea. We could use this as an opportunity to show our better ways."
 flavour_flying_hound.12.a:0 "If they are to die give them a trial at least"
 flavour_flying_hound.12.b:0 "No, we must show some compasion"
 flavour_flying_hound.12.c:0 "Let them Stay! They shall teach us Chivalry"
 flavour_flying_hound.13.t:0 "Broken Blade"
 flavour_flying_hound.13.d:0 "We have entered the gates of the Bladeskeep seeking whatever we could find about its old inhabitants. Doing so we learned of the stories of Calidanl, the Gleaming Blade and its Stewards. (RULER NAME) things this is compleatly Rad and wants to become a steward himself. To do so he must first get the blade reforged."
 flavour_flying_hound.13.a:0 "Get our best Goblins to work on it"
 flavour_flying_hound.14.t:0 "Blinding Gleam"
 flavour_flying_hound.14.d:0 "The pieces have been gathered and the blade has been reforged. Upon the gates of the Bladeskeep our ruler and the ruler of Earworm have come to offer it back to the human guardians of the Bladeskeep. The humans took the blade, wondering how a goblin could ever see the blade reforged. The answer? They didnt. The blade was poorly put back together, sticked with a home made glue and painted over with a grey material. At first they felt insulted, but seing the proud smiling faces of the goblins they felt there was no bad intent on them, it was a genuine attempt to fix the blade. It was then that one of the humans stepped forward holding the blade, the 2 goblin clanleaders bowed and where tus knighted as the new Stewards of Calindal."
 flavour_flying_hound.14.a:0 "I HAVE THE POOOWEEEEEEER"
 flavour_flying_hound.15.t:0 "Atop the Hills of Gleam"
 flavour_flying_hound.15.d:0 "Our ruler and the ruler of Earworm are atop a hill overlooking the works being done to the Bladeskeep. Earworm ruler talks about how his clan has become very attached to the thing and is now seeking to reform the clan to embrace the values of honor the bladeskeep represents. Wants our opinion."
 flavour_flying_hound.15.a:0 "Embrace the Blade"
 flavour_flying_hound.15.b:0 "Raise your head up, Prideful Goblin"
 flavour_flying_hound.15.c:0 "Like the Cannorian God, we are ligth encarnate"
 flavour_flying_hound.16.t:0 "Organize the New Sons"
 flavour_flying_hound.16.d:0 "As our population grows so does the people that want to join the battle to answer the call of Chivalry. Over the years we have organized them as best as we can but now this simply wont do. We must now decide if we want to further our peoples training or embrace a doctrine of mass assault."
 flavour_flying_hound.16.a:0 "Train the Warriors"
 flavour_flying_hound.16.b:0 "Embrace Mass Assault"

 flavour_flying_hound.100.t:0 "Sack of [flying_hound_occupied_capital.GetName]"
 flavour_flying_hound.100.d:0 "Traditionally advancing armies have been expected to supply themselves from what they can plunder in the area they move through. This is often the only way for soldiers to survive in wartime as payments from the [Root.GovernmentName] treasury can rarely be brought in a timely manner to the men. In fact, by paying retroactively many also avoid the strain of paying for the fallen.\nAs [flying_hound_occupied_capital.GetName] fell it was therefore expected that our soldiers be allowed to loot the city to enrich themselves. What was less expected was the total and utter destruction of the city that took place. Refusing to follow orders our men descended upon the helpless burghers, doing despicable things and ruining the area for a long time to come."

 flavour_flying_hound.300.t:0 "Favored by Chivalric Pride"
 flavour_flying_hound.300.d:0 "Many of the worshipers of the Cult of Chivalry had felt more connected to the stories told. Yet even amongs them our ruler can clearly be seen as more connected with the Spirit of Chivalry than many other: Should our ruler dedicate himself to the teachings of the blade?"
 flavour_flying_hound.300.a:0 "I shall become a Knight of Pride"
 flavour_flying_hound.300.b:0 "I shall become the Embodiment of Chivalry"
 flavour_flying_hound.300.c:0 "I dont have time for this"
 flavour_flying_hound.301.t:0 "Emulant - [Root.GetChivalryDedication]"
 GetChivalryDedication_A:0 "Knights of Pride"
 GetChivalryDedication_B:0 "Excellent Chivalry"
 flavour_flying_hound.301.d:0 "Loc changes depending the choice. Its been 5 years and we can now show what we have learned."
 flavour_flying_hound.301.a:0 "I am great"
 flavour_flying_hound.301.b:0 "I am great"




#Tournament Events
 flavour_flying_hound.1000.t:0 "Call of the Mighty"
 flavour_flying_hound.1000.d:0 "Our ruler is dead. Time to organize a Tournament where the greatest among us shall fight to see who comes out ontop."
 flavour_flying_hound.1000.a:0 "Begin the Preparations"
 flavour_flying_hound.1001.t:0 "A Test of Dexterity"
 flavour_flying_hound.1001.d:0 "The contenders are now being tested in their ability to ride their mounts and do combat at the same time."
 flavour_flying_hound.1001.a:0 "Cool"
 flavour_flying_hound.1002.t:0 "A Test of Glory"
 flavour_flying_hound.1002.d:0 "An important part of being a chivalric knight is being able to pose and look glorious whiles slaying your enemies. This test determines a contenders capability to strike power with their pure appearance."
 flavour_flying_hound.1002.a:0 "Cool"
 flavour_flying_hound.1003.t:0 "A Test of Skill"
 flavour_flying_hound.1003.d:0 "Test of general combat skills, they do jousting here and such."
 flavour_flying_hound.1003.a:0 "Cool"
 flavour_flying_hound.1004.t:0 "Tournaments End"
 flavour_flying_hound.1004.d:0 "And the Winner Is..."
 flavour_flying_hound.1004.a:0 "A Goblin from the Royal Academy"
 flavour_flying_hound.1004.b:0 "A Goblin from the Flying Knights School"
 flavour_flying_hound.1004.c:0 "A Goblin from the School of Taranton"
 flavour_flying_hound.1004.e:0 "A Prideful Goblin from the Bladeskeep"
 flavour_flying_hound.1004.f:0 "A Human Knight"




