#Events
 flavour_flying_hound.1.t:0 "The Feral Cry of Freedom"
 flavour_flying_hound.1.d:0 "Out on the desolate roads of Godsescker sits a tavern that has been left to ruin. But life stirs around this run-down shack. A host of dog riders has gathered here eagerly awaiting the opportunity to join what they believe is a bright path forward. Bursting forth from the tavern door, a goblin clad in leather armor embroidered with a winged dog on its back, accompanied by an entourage of goblins wearing similar leathers. The crowd cheers in a series of howls as Elgek, the new clanboss of the Flying Hound clan stands before them. He looks upon all those who have rallied to his cause and shouts, \n\n“HOUNDS!!!” The crowd grows silent. “Korgus is dead…” The crowd erupts into celebratory cheers but Elgek quickly shushes that. \n\n“...and nothing has changed,” Elgek pauses before continuing. “We are free just as we have always been since the day we stepped foot outside those damned mountains!” \n\n“You see, in those caves we were caged in. Cramped halls always leave you backed in a corner, easy prey to those who would see us in chains.”  \n\n“But here? There's more than enough space! It's so open no one could possibly catch us! Not a horse, warg or spider could match the speeds of our dogs!” \n\n“And that's the truth, we have been free for decades now! But only with Korgus’ death can we see that it was fear that held us back all those years! As long as we have had our rides, we have been free in this land!” \n\n“So Let’s finally show these orcs that we are not slaves! Let’s show these adventurers that we belong in this land! And let's stop behaving like cowards and show that when you back a Flying Hound into a corner, you get bit!” \n\nCheers erupt as Elgek makes his way from the tavern entrance through the crowd, receiving slaps on the back from his fellow riders along the way, towards his ride. Hopping on, Elgek lets out a final rallying cry."
 flavour_flying_hound.1.a:0 "Come on you dogs! Let's ride!!"
 flavour_flying_hound.2.t:0 "Amongs the Ruins"
 flavour_flying_hound.2.d:0 "Elgek and a bunch of Gobbos go to Devaced to pillage it. Theres a bit of tencion between them and the Orcs that where already there but it does not escalate. Pillaging the city, someone finds an old book. They show it to Elgek and although he cannot understand a single word of what the book says bit he gets enamorated by the drawins, thinking of them as the escanni equivalent to the great goblin spider riders of the spine. He wants to learn more."
 flavour_flying_hound.2.a:0 "We must learn more"
 flavour_flying_hound.3.t:0 "Visions of the Epic"
 flavour_flying_hound.3.d:0 "In [Root.getflying_hound_occupied_capital] the goblins have found even more information about this great riders of old, wearing shinny armor. This time they force a captive to tell them what it sais. They learn of the military tactics of old, of the great chivalric knights that made Escann famous and of their dids. Elgek believes this is their calling, they have to prove themselves better than this great warriors. In really hes just fanboying over the knights and wants to immitate them very much."
 flavour_flying_hound.3.a:0 "We must learn more"
 flavour_flying_hound.4.t:0 "Tales, Pretty Little Things"
 flavour_flying_hound.4.d:0 "We have been studying the stories of Old Adenica for a while now. The Grasshopper clan has put much effort to make sure they take care of Taranton i recent time, and doing so have come to adopt many of the traditions of the old Chivalric Kingdom. As of today, their clan has rebranded, seeking to better embody this legacy. They now seek our approval."
 flavour_flying_hound.4.a:0 "There is much Wisdom in the Old"
 flavour_flying_hound.4.b:0 "We must Carve our own Path"
 flavour_flying_hound.4.c:0 "Devote yourselfs to the First of all Knights"
 flavour_flying_hound.5.t:0 "STOP SCREAMING"
 flavour_flying_hound.5.d:0 "Said the leader of the expedition. The orcs, chained and angry, did not obey. They could be heard saying all sorts of grose things to their captors. They soon arrived to the camp where our ruler is. He has to now decide what to do with the Orcs."
 flavour_flying_hound.5.a:0 "Let them Live, but they must be loyal to us now"
 flavour_flying_hound.5.b:0 "Dead to the Monsters!"
 flavour_flying_hound.6.t:0 "The First Covenant"
 flavour_flying_hound.6.d:0 "Goblins from Western Escann come together to discuss the future of their people. The Chivalric ways have proven succesful, and thus they now seek to forge their realm anew under this idea."
 flavour_flying_hound.6.a:0 "We shall be true knights!"
 flavour_flying_hound.7.t:0 "At the Beasts Grave"
 flavour_flying_hound.7.d:0 "Our knights have striken a decisive victory against the Orcs of Deadfang. We have marchet into their former capital of Beastgrave to take what we can and defeat. We have to choose what to do with the Humans and the Orcs. Theres 2 plans presented by our advisors."
 flavour_flying_hound.7.a:0 "Plan A. Help both groups leave and Orcs leave"
 flavour_flying_hound.7.b:0 "Plan B. Give them a Home in our Land"
 flavour_flying_hound.7.c:0 "Plan C. This Beasts Deserve no Mercy"
 flavour_flying_hound.8.t:0 "The Raven Calls"
 flavour_flying_hound.8.d:0 "Leader of the Raven Banner has seen an opportunity to use the Goblins newfound Chivalric ways in his favor. He has come to the clanleader and has begged for help freeing the Corvurian people from the tyrany of the masquarade. The gobbos eat it all up, having big dreams of becoming known as Crusaders and truly enshrining themselves amongs the great chivalric knights. They accept with the condition that the Raven Banner joins the clan."
 flavour_flying_hound.8.a:0 "Rally to Arms!"







 flavour_flying_hound.300.t:0 "The Raven Calls"
 flavour_flying_hound.300.d:0 "Many of the worshipers of the Cult of Chivalry had felt more connected to the stories told. Yet even amongs them our ruler can clearly be seen as more connected with the Spirit of Chivalry than many other: Should our ruler dedicate himself to the teachings of the blade?"
 flavour_flying_hound.300.a:0 "I shall become a Knight of Pride"
 flavour_flying_hound.300.b:0 "I shall become the Embodiment of Chivalry"
 flavour_flying_hound.300.c:0 "I dont have time for this"
 flavour_flying_hound.301.t:0 "Emulant - [Root.GetChivalryDedication]"
 GetChivalryDedication_A:0 "Knights of Pride"
 GetChivalryDedication_B:0 "Excellent Chivalry"
 flavour_flying_hound.301.d:0 "Loc changes depending the choice. Its been 5 years and we can now show what we have learned."
 flavour_flying_hound.301.a:0 "I am great"
 flavour_flying_hound.301.b:0 "I am great"




#Tournament Events
 flavour_flying_hound.1000.t:0 "Call of the Mighty"
 flavour_flying_hound.1000.d:0 "Our ruler is dead. Time to organize a Tournament where the greatest among us shall fight to see who comes out ontop."
 flavour_flying_hound.1000.a:0 "Begin the Preparations"
 flavour_flying_hound.1001.t:0 "A Test of Dexterity"
 flavour_flying_hound.1001.d:0 "The contenders are now being tested in their ability to ride their mounts and do combat at the same time."
 flavour_flying_hound.1001.a:0 "Cool"
 flavour_flying_hound.1002.t:0 "A Test of Glory"
 flavour_flying_hound.1002.d:0 "An important part of being a chivalric knight is being able to pose and look glorious whiles slaying your enemies. This test determines a contenders capability to strike power with their pure appearance."
 flavour_flying_hound.1002.a:0 "Cool"
 flavour_flying_hound.1003.t:0 "A Test of Skill"
 flavour_flying_hound.1003.d:0 "Test of general combat skills, they do jousting here and such."
 flavour_flying_hound.1003.a:0 "Cool"
 flavour_flying_hound.1004.t:0 "Tournaments End"
 flavour_flying_hound.1004.d:0 "And the Winner Is..."
 flavour_flying_hound.1004.a:0 "A Goblin from the Royal Academy"
 flavour_flying_hound.1004.b:0 "A Goblin from the Flying Knights School"
 flavour_flying_hound.1004.c:0 "A Goblin from the School of Taranton"
 flavour_flying_hound.1004.e:0 "A Prideful Goblin from the Bladeskeep"
 flavour_flying_hound.1004.f:0 "A Human Knight"




