 B43_embrace_high_chivalry_reform:0 "Embrace High Chivalry"
 B43_embrace_high_chivalry_reform_desc:0 "The Greatest Goblins from our land have come together to forge a mighty Conclave, giving birth to the High Chivalric Crown. The title of ruler is given to the winner of a chivalric tournament."
 B43_knightly_goblinoid_kingdom_reform:0 "Knightly Goblinoid Kingdom"
 B43_knightly_goblinoid_kingdom_reform_desc:0 "The Highest Amongs all Kingdoms of Escann. The Goblins of the Flying Hound clans have risen above all others to embody the true might of the chivalric ways. The title of ruler is given to the winner of a chivalric tournament."
 
