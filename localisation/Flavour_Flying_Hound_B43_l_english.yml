 #Church Aspect
 chivalry_cult:0 "Chivalry Cult"
 chivalry_cult_desc:0 "Emerging from the stories Old Escann, the Cult of Chivalry is a combination of tales, folklore and surviving writings of the old schools of Chivalry and their legendary Knights. Followed by the Goblins of our realm, it also has found a place amongs the humans living in our land as the cult also inherits many teachings from the Cult of Adean."


