 uesrennu.17.a:0 ""

 uesrennu.18.t:0 "A New Dawn"
 uesrennu.18.d:0 "A month has passed since the final defeat of the King of Kompu; not a day since has been without banquets, parties and festivities of all kinds. With the heavy boulder of tyranny lifted, the spirit of every good elf in the nation soared, singing its love of life high up in the sky.\n\nBut smiles and fun are not the only things returning to our nation. A flurry of industriousness engulfed the country, as everybody wants to do his part in rebuilding his wounded homeland: destroyed fields are sowed and planted in by communal farms, districts in cities everywhere are getting rebuilt from the ground up; the mines are being renovated, to make them a place fit to work in, a work adequately compensated, decent enough for any free elf. A special zeal is reserved for destroying all symbols of the old regime, the infinite kotakompu statues that littered Taychend; volunteers rush in droves everytime.\n\nThose enemies that during the war spontaneously surrendered have been treated with some degree of magnanimity; no quarter has been given to the rest, too much pain and death occurred, no forgiveness was possible.\n\nAnd what about the rats? Many discussions have been had about the kotakompus, the first among the Aruakompu's symbols, the most effective of their weapons; but in the end it was decided that the beasts were as much victims as we were, forced from the litter into a violent temperament, in a perversion of their nature. They'll keep having a central place in our nation, but not as war tools, not as the Swarm.\nThey'll be beasts of peace, lightening the burden of hard work for the common elf.\n\nEven when the sky is clearest, a single cloud can be found in the sky though. The few that met both the rat tyrant and Silverspite do not fully bask in the joy of victory: their interactions with Silverspite always leave them uncomfortable, with a pinch of fear mixed in. Silverspite is a hero. But, at times, a hint of the same madness that plagued the Aryakompus seeps through. Only time will tell if he'll be able to resist it or if he'll fall prey to the illness clutches…"
 uesrennu.18.a:0 "We'll shine high and bright!"

 uesrennu.19.t:0 "A Kompu King - Literally"
 uesrennu.19.d:0 "Everybody knew the rat would never be a king. The old king's body was still warm, but his cousin was already preparing the coronation speech - the games of power had all been played during the last stages of the king's illness.\n\nThe newly enthroned Aryakompu had already moved his rat "rival" back to the palace enclosure, when the old court mage, Rannaraikazhil, asked for audience.\nNobody knows what he told the king, but the very next day, the Flesh-Gnasher of Mlerek was proclaimed once again official heir of the realm."
 uesrennu.19.a:0 "You lucky rat, you!"