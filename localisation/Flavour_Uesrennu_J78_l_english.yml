l_english:
 J78_expand_our_feed_title:0 "Expand our Feed"
 J78_expand_our_feed_desc:0 "a"

 J78_use_their_all_title:0 "Use their All"
 J78_use_their_all_desc:0 "The kotakompu. Is there any animal on this planet more useful than him? Obedient, untiring, can be fed anything and will multiply in the shortest of timespans. You're hungry? Their milk is tasty. You're tired? They're strong enough to bring you home? You're lonely? They're affectionate companions.\nEven in death they'll still be helpful: the skin can clothe you and their claws and teeth will bolster any magic rituals. The best of the beasts!"

 J78_it_hungers_title:0 "It Hungers"
 J78_it_hungers_desc:0 ""One rat, eating a pear; two rats, climbing a stair.\nFive rats, the pie is close; ten rats, gnawing your toes!\nFifty rats, scouring our garden; hundreds of rats, scaring the warden.\nThousands of rats, the food's going down! The swarm is coming, coming to town!"\n-Uesrennu children's song\n\nThe kotakompus hunger, always. Send them towards our enemies' food reserves, before they empty ours. The [Root.Monarch.GetTitle] wouldn't let us stop them."

 J78_free_to_burrow_title:0 "Free to Burrow"
 J78_free_to_burrow_desc:0 "8th of Nerament: 3 kotakompus moved out of the royal kitchens\n15th of Nerament: cleaned the chancellor residence of a rat infestation\n22th of Nerament: thrown out a family of rodents that took residence in the public baths\n2nd of Truefrost: fished a mole-rat out of the Olhokar temple's well\n10th of Truefrost: sent the whole garrison to dislodge a kotakompu queen from the southern granary\n12th of Truefrost: took down [Root.Monarch.GetName] companion from the tree it climbed onto\n24th of Truefrost: finally ====== moved the last of the rats that ======== were living inside the garrison\n-Uesrennu city guard's log\n\nWe should expand the space reserved for the kotakompus in the mines."

 J78_legacy_of_vaokanur_title:0 "Legacy of Vaokanur"
 J78_legacy_of_vaokanur_desc:0 "For centuries, Vaokanur was the terror of the Lower Kalavend. Masters of blood magic, instead of uncountable slaves being thrown to the depths of Uesrennu, they were sacrificed to the city’s infamous blood-pits instead. When they were finally scoured by one of their own, the high stone walls and bloody banners of Vaokanur were reduced to ruins – now due south of Uesrennu. Their legacy of dark power remains, however – and the Aryakompus have become very interested in it indeed. It is said the Blue House holds remnants of their knowledge – perhaps it is time to reach out, and see if there are others who share that interest?"

 J78_the_ritual_title:0 "The Ritual"
 J78_the_ritual_desc:0 "Central tower? Rising high in the city center. Mages of the Blue House? "Convinced" to help. Conduit shrines? Built with our best lapis lazuli. The kotakompus? Fed. Rannaraikazhil? On the field, preparing to cast. [Root.Monarch.GetName]? Anxiously waiting, by his side. The ritual? Beginning!"

 J78_life_in_the_hills_title:0 "Life in the Hills"
 J78_life_in_the_hills_desc:0 "The old Katalmarai – the hundreds of small walled villages, ruled by farmers and hunters – is gone. It took the resources of an Empire and hundreds of thousands of slaves to crack into the riches below ground, and now the mine-cities sprawl beneath the earth, pick and claw extracting the hidden mineral wealth of the foothills, eclipsing the towns aboveground, now only useful for food and firewood. But the mines consume as many slaves as they take – and they hunger for more and more and more – luckily for them, the Aryakompu are eager to provide."

 J78_a_city_of_rats_title:0 "A City of Rats"
 J78_a_city_of_rats_desc:0 "The Great City! A testament to the old ones power, and ingenuity. Rises higher, expand wider than any other city… and delve deeper. Pity about its current inhabitants, soulless drones without a drop of ambition - a bunch of rats, without any of the qualities the kotakompu has. We'll correct this.\nFor a long time the Aryakompu dynasty eyed the city - like every other Taychendi ruler, to be sure - but with a specific design in mind for it. A secondary kotakompu center, outside the capital's hills, deep in Nanru Nakar undercity. The Queens shall rule in the underground just as the Kompu kings do on the surface. Their example will teach the local population the proper way to live."

 J78_armored_warfare_title:0 "Full Metal Rodent"
 J78_armored_warfare_desc:0 "Initially a mercenary company, the Varaendi kotakompu division has grown to be an elite unit within our army. It's time to formalize that and have them sign an exclusive contract with us. To sweeten the deal we'll make them an offer hard to refuse: will procure them the best weapons and armors.\nWhat's more scary than a horde of kotakompu charging at you? An horde of heavily armoured ones of course!"

 J78_unite_minds_and_bodies_title:0 "Unite Minds and Bodies"
 J78_unite_minds_and_bodies_desc:0 "This always was what our nation was destined for. Since the day Varamzhil founded his country, we have always been two people living in harmony, elf and rat together, each doing his best for the other.\nIn the last decades we've ramped up this unity and got closer than ever before; thanks to our research in old magic rudimental communication with our lovely rodents is not a dream anymore, but reality!\nWe're now ready to take yet another step toward mutual understanding, a new glorious evolution in our relationship with the kotakompus."

 J78_a_carrot_for_the_rich_title:0 "A Carrot for the Rich"
 J78_a_carrot_for_the_rich_desc:0 "The riches of rock are worthless without someone to buy them. Uesrennu’s customers were first the cities of the Gophiran Empire, then the cities of the Kalavend – but they were always troubled by the Aryakompu’s excesses… especially when they were the reason they needed all that stone to rebuild. Now, of course, they don’t have the freedom to act on those troubles – but there is no reason to let them think about revolt. Its time to treat the cities as we would our Kotakompu-queens, and throw them a hunk of flesh."

 J78_the_teeth_for_the_rest_title:0 "The Teeth for the Rest"
 J78_the_teeth_for_the_rest_desc:0 "Of course, the wealthy cities are not our only new subjects – and in our Kotakompu-horde, we do not only have queens, but warriors. Those warriors need to be sated, and those subjects need to be taught a lesson – so let’s sic the swarm on the ungrateful, and teach those who survive the price of rebellion!"

 J78_strengthen_the_breed_title:0 "Strengthen the Breed"
 J78_strengthen_the_breed_desc:0 "For a long time Marhed Rayodana had a one-sided rivalry towards us, competing in the kotakompu market; we have always been so far ahead of them that we mostly ignored their Varaendi pack, but that was an error.\nAll kotakompus are worthy of our attention, no one excluded. They're all part of our big family. We shall integrate the Varaendi pack in our nation, and crossbreed them with our rodents. The swarm will grow larger, and stronger."

 J78_prepare_the_succession_title:0 "Prepare the Succession"
 J78_prepare_the_succession_desc:0 ""Uesrennu is going through momentous changes. We're not a small realm confined to our hills anymore. We're the premiere power of Taychend! New times require new ideas, and new people. This is the reason why I've decided to nominate a new heir, who will succeed me in governing our expanding realm. Don't worry good people of Uesrennu, your future king was handpicked amongst many candidates, selected for his many qualities: strength in the face of adversities, proven loyalty to our nation, great love for his people. You'll see, you'll come to love him like I do."\n\nThe good people of Uesrennu worried."

 J78_heir_companion_title:0 "A Companion for [Root.Heir.GetName]"
 J78_heir_companion_desc:0 ""You see my son, what value do those "diplomats" and "ambassadors" have? Words are useless, only strength matters. And our kotakompus have plenty of it. Look at that one, the one in the center, did you see how he wrestled the best place to eat from the others, allowing him to get all the choicest pieces? That one will be your personal kotakompu, your most loyal friend - you'll learn from him more than from any of those dusty tutors."\n\nThe bones of the ambassador would make a sickly "Crunch!" sound every time one of the mole-rats took a bit out of them."

 J78_warladies_title:0 "Warladies"
 J78_warladies_desc:0 "The court of Uesrennu is abuzz with the fervid preparations for the planned feast. The [Root.Monarch.GetTitle] [Root.Monarch.GetName] declared it will be the grandest one that will ever happen in his reign, and everybody that counts something is invited.\nThe participants will be so numerous that the banquet will be held in the park outside the palace: renovations are in full swing, and an ad hoc structure is being built to repair the guests - even a place to house the monarch's favorite kotakompus is being constructed.\nThe occasion is a great announcement our ruler wants to make, about great changes for the realm that - he said - will elevate the glory of this court to pinnacles not even the damned Gophirans could dream of."

