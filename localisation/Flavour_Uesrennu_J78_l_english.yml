 uesrennu.18.t:0 "A New Dawn"
 uesrennu.18.d:0 "A month has passed since the final defeat of the King of Kompu; not a day since has been without banquets, parties and festivities of all kinds. With the heavy boulder of tyranny lifted, the spirit of every good elf in the nation soared, singing its love of life high up in the sky.Every fighter is being hailed as a hero, each of them seen as a paragon of glory, by Oren Nayru faithfuls and followers of the old Cults alike.\n\nBut smiles and fun are not the only things returning to our nation. A flurry of industriousness engulfed the country, as everybody wants to do his part in rebuilding his wounded homeland: destroyed fields are sowed and planted, districts in cities everywhere are getting rebuild from the ground up; new plans for the mines are being drafted, making them a place fit to work into, a work adequately compensated, decent enough for any free elf. A special zeal is reserved for destroying all symbols of the old regime, from royal palaces to the infinite kotakompu statues that littered Taychend; volunteers for the task rush in droves everytime.\n\nThose enemies that during the war spontaneously surrendered have been treated with some degree of magnanimity: while they won't be allowed to forget the role they played for as long as they lived, they were allowed to return to their homes. No quarter has been given to the rest, too much pain and death occurred, no forgiveness was possible. Many of ours enjoyed the violence and the release of vengeance.\n\nAnd what about the rats? Many violent discussion have been had about the kotakompus, the first among the Aruakompu's symbols, the most effective of their weapons; but in the end it was decided that the beasts were as much victims as we were, forced from the litter into a violent temperament, in a perversion of their nature. They'll keep having a central place in our nation, but not as war tools, not as the Swarm. They'll be beasts of peace, lightening the burden of hard work for our farmers, our builders, our miners.\n\nEven when the sky is clearest, a single clouds can be found in the sky though. The very few that met both the rat tyrant and Silverspite do not fully bask in the joy of victory: their interactions with Silverspite always leave them uncomfortable, with a pinch of fear mixed in. Silverspite is a good man, a hero. But, at times, a hint of the same madness that plagued the Aryakompus seeps through. Only time will tell if he'll be able to resist it or if he'll fall prey to the illness clutches…"
 uesrennu.18.a:0 "We'll shine high and bright!"

