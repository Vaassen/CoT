 uesrennu.1.t:0 "The Swarm Beckons"
 uesrennu.1.d:0 "The slaves heave, the picks strike, the stones crack. “Work for ya’ lives!” The heat burns, the slaves heave, the sweat beads, the picks strike, the dust sticks, the stones crack. “Slack ‘n taste the bite!” The whip comes down, lash and heave and strike and cry and crack–! The mines of Uesrennu, spurred, drive on.\n\nBut it isn’t just the shackled and the slavers who fuel Uesrennu – fuel the mine-cities of the Katalmarai. For the slaves heave, the drivers cry, and the Kotakompu chatter and bite and dig and devour! Half-haired rat-beasts! The frame of a capybara, the fecundity of a mole-rat, the size and strength of a war-hound! Make a deal with a queen, offer meat, warmth, room to grow? You can take her spawn as your own.\n\nA trainer does just that in a queen-chamber in Uesrennu now, giving tribute, taking tax. Handlers, in Entislula and Caiyamkq and the off-tunnels of the capital-mine, spur their rats further into the rock, to search for metal and mineral both. And, of course, the slave-driver holds both whip and leash, to lash elves to their work and beasts to his side, and let-em-loose when terror calls!\n\nThe last point is new in Taychend. For a hundred years, the Gophiran Empire sent millions of slaves to claw into the Katalmarai, used sabre and steel alone to keep them there. They gave the Kotakompu trainers benefits – but not freedom. A mistake. Amidst the Death Throes of Gophira, the greatest rat-trainer of them all rose up, as Varamzhil, the Liberator. He tasted freedom’s light – but was thrust back into the dark.\n\nWhen he rose once more, he rose not as trainer nor liberator, but King of the Kompu! Dread-slaver, dead-devourer! The Copper-Born-Biter! A rodent horde at his back, the Kalavend at his mercy! A century, and now the Seventh Varamzhil, wearing the skins of his sickle-toothed brethren and the bones of his enemies, overlooks his underground domain; watches the countless slaves toiling away in his underground cities, the growing masses of war-kotakompu bred by the dark’s captive-queens, and smiles…"
 uesrennu.1.a:0 "…for Taychend awaits – and the swarm beckons!"
 uesrennu.1.tt:0 "We'll be able to mitigate the devastation."

 uesrennu.2.t:0 "Let 'Em Loose"
 uesrennu.2.d:0 "The walls lay broken, shattered, the city inside now truly captives of their homes. The decision to surrender had been made the day before, notice given – one more night under a free sky, and they would surrender. The defenders despaired as they tucked their children to bed.\n\nUnder darkness, the King of the Kompu let ‘em loose.\n\nThousands, ten thousand maybe. More than the doomed city could handle. Grown over decades, multiplying still, against the stress of toil and battle. Left half-starved, the Kotakompu horde knew what to do – they surged over the breaks in the walls, under the river-gate, clawed through the ground itself. And then, they devoured.\nWhen dawn rose, the horde was contented. Their trainers and handlers and drivers collected them, put them back under leash as they dozed, gorged on elf-flesh, white sickle-teeth painted red. A full meal rarely gained, for their trainers fed them sparingly, out of strategy… and necessity. It was difficult enough to feed the kotakompu in the mines, but so many, out in the open? And then more for the queens, to replace the losses.\n\nThe swarm grows by the day – and if the Aryakompus do not throw them their meat? Satiate their hunger…? They will devour Taychend itself to fill their need."
 uesrennu.2.a:0 "But a bit more restraint could be used."
 uesrennu.2.tt:0 "Gain §R5§! aggressive expansion with every nation in Taychend.\n\nEvery time we let the swarm loose, we'll find reprieve from the devastation in our provinces. The other nations will still not like it."
 uesrennu.2.tt2:0 "We'll prevent this devastation in the future."

 uesrennu.3.t:0 "Death in the Mines"
 uesrennu.3.d:0 "Jopan couldn't feel his feet. He was grabbed in the middle of the night, inside his home, by a group of soldiers. Most of his townsmen suffered the same fate; and his village was then thoroughly sacked, at the first lights of the day. After they were done with that, the march began, seasoned by whippings, and beatings. He had lost count of the days since, just as he lost sight of any known face, as the sad parade kept swelling day by day, of new victims and tormentors, the friends and acquaintances of a lifetime dispersed among a multitude of other desperates.\nThey were close to their destination it seemed; that afternoon they stopped the march early, and, for the first time since forever, he was properly fed, with finally enough food to call it a dinner. Maybe his suffering was near the end - or at least the worst of it was over.\n\nHe stared at the dark abyss under him. They were being lowered down in it - a small group of eight prisoners - deep inside the hill; side tunnels kept opening up along the shaft. Noises could be heard from there, but never voices: only the sound of the pickaxes meeting the stone, skittering noises from some of the tunnels. And the stench of dead air.\n\n"New arrivals, grab one of the pickaxes and follow the tunnels to its end! Then start using them, like your life depended on it. Because it does!" And so they went, him and his companions - not prisoners no, but slaves. The air was irrespirable, the light a dim candle, and on the tunnel's walls holes opened up, with many glowing eyes inside, staring at them.\nJopan now knew, he would die here."
 uesrennu.3.d1:0 ""The new batch of slaves arrived? Finally! It's already been almost a week since that big group went and got themselves killed in the tunnel collapse… Useless idiots, no matter how much time you tell them how to mine they don't learn! And I'll be the one paying the consequences of that! The higher ups are always asking for more gems and metals, but they don't put any effort in procuring the arms to do it.\nSend these down, and send for more. What? Don't you know that the needs of the mine are paramount?""
 uesrennu.3.a:0 "Keep us informed on the mines progress."
 uesrennu.3.b:0 "The mines work well without us taking a personal interest in it."
 uesrennu.3.c:0 "More people, in the dark, forever."
 uesrennu.3.d:0 "The veins have been all tapped. The hills' insides have more holes than a cheese, the mines more people than most cities."
 uesrennu.3.tt1:0 "Every §Y2§! development exploited outside the §YUesrennu§! area, we'll gain §G1§! production in a province of our capital state. With enough development gained this way the mines will improve.\n\nEvery time one of the mines improve, we'll get notified."
 uesrennu.3.tt2:0 "Every §Y2§! development exploited outside the §YUesrennu§! area, we'll gain §G1§! production in a province of our capital state. With enough development gained this way the mines will improve.\n\nDon't show this event again."
 uesrennu.3.tt3:0 "We won't be able to expand the mines any more. Nor gain bonus development there."

 uesrennu.4.t:0 "The Tunnels' Darkness"
 uesrennu.4.d:0 "A struck match in an off-tunnel, and darkness gave way to light. Five elves met – all slaves, but only one still in bondage, and one able to free him. The slave-priest held two hands up. One palm out, sabre-steel in the other – a rare sight, in the mines.\n“Do you still hold the fire of freedom within you?”\nKal remembered when his warmth came from the sun above, not the fires of the earth. “I do.”\n“Does the rage of righteous hatred still course through your blood?”\nKal remembered the first time he felt the bite of his chains, the first lash of the whip. His fist clenched, lips turned to scowl. “I do.”\n“And do you swear to carry that fire, that rage, within you? Until your last dying breath, or that of the last slaver to stain this world?”\nKal did not need to remember to answer “I do!”\nThe slave-priest smiled. “Then hold out your hand, and shed your last blood as an unfree soul.”\n\n- - -\n\nThe King of the Kompu was playing with one of his companions when one of his lieutenants walked in. [Root.Monarch.GetName] only acknowledged him with a glance, before he turned back to his closer ally before him – he was teaching the war-kompu how to leap, tear throats.\n\n“Aryakompu,” the lieutenant began, a tremble in his voice. “There have been some troubling reports… miners going missing in the off-tunnels. Consistently. Its starting to become a drain…”\n\nThe Aryakompu laughed, as his lieutenant froze in fear. “Miners die all the time – they were probably fed to the swarm! You’re missing slaves? Get more!”"
 uesrennu.4.a:0 "Yes, King… it will be done."

 uesrennu.5.t:0 "The Cult of Vherenar is on the Move"
 uesrennu.5.d:0 "Varamzhil I Aryakompu was not the only elf fighting for freedom amidst the Death Throes of Gophira. Taken captive in the subjugation of the great Larankarha Revolt, the Dyamari warrior Vherenar fought for the cause of liberty and the breaking of chains across Taychend, after he escaped bondage himself. But as Vherenar forged a secret society that would spread among the slaves of Taychend, and became in death the Freesword, Varamzhil betrayed the slaves he had once rose alongside, subjugated them with his rodent swarms, and became Aryakompu, the Copper-Born-Biter.\n\nAs Uesrennu’s armies and the terrors that accompany them have swept across Taychend, slaves and abused peasants alike have searched for relief and resistance – and in the Cult of Vherenar, they have found it. Organised into decentralised “cells”, led by their Kavalali warrior-priests, the Cult has proved an elusive and tenacious thorn in the side of the Aryakompus, worship of Vherenar and the god-hero’s dream of liberty a pandemic sweeping the realm’s slave-stock."
 uesrennu.5.a:0 "Upstart slaves!"

 uesrennu.6.t:0 "Our Kotakompu Will Fit Right In"
 uesrennu.6.d:0 "A whole city moving. That's what it felt like these last few days.\nBecause months of siege weren't enough. Because the brutal sacking that followed wasn't enough. Because nights upon nights of abject terror, awake in fear of being taken away as "rebels" or "insurgents" by the new overlords' ratty minions wasn't enough.\nNo, the Kompu has a new brilliant idea to torment us with: entire neighborhoods, and the best part of the inhabited undercity will from now on be dedicated to housing his mangy beasts. The people living there? Us? Sent to other districts. Living where? Living how? The Kompu King does not care. We're not rats after all. And anyone that refuses or tries to put up even the smallest act of resistance gets rounded up, like many others in the last weeks, and sent to their mines.\n\nBut no, we are not rats, and this tyrant will be made aware of this fact in due time. Not today, most people's spirits are too broken right now. Nor tomorrow, the kotakompu patrols are still too many and too vigilant. But in the not so far future the Aryakompu will lower [Root.Monarch.GetHerHis] guard and in that moment [Root.Monarch.GetSheHe] will learn. Nanru Nakar is a city of elves, and this city won't forget. Nor forgive."
 uesrennu.6.a:0 "Look at them! Putting their cute lil muzzles everywhere! Excitedly exploring their new home!"

 uesrennu.7.t:0 "A King and his Queens"
 uesrennu.7.d:0 ""
 uesrennu.7.a:0 ""

 uesrennu.8.t:0 "Disappearing Mothers"
 uesrennu.8.d:0 "The King of the Kompu fell to his knees at the sight, screamed bloody curses of loss and vengeance, as his kotakompu brethren circled around, snuggled close, consoled him in his grief. One of the queens had been stolen – it was not the first to disappear. Once the madness had subsided, he turned to the driver that had been on watch. “How could you have let this happen?”\n\n“I– we kept the lash close, watched the trainers– but when the shifts changed, t-they–” [Root.Monarch.GetName] rose, walked over. The driver sputtered, stammered. “A-And– they were gone before we could do anything! The queen, the trainers– h-her– her cubs–!”\n\n“WRETCH!” The King struck the driver across the face– kicked him away, sent him tumbling to the floor. Then a raged order in their chitter-chatter tongue – “KITAKITA– KAAAAGH!” Blood curdling screams accompanied the driver’s death throes as the Kotakompu pounced – devoured him alive.\n\n[Root.Monarch.GetName] turned to his lieutenants now, grabbed one, shook him as he cried his commands. “Death– death– DEATH–! Go into the mines– sabres out, lashes out, kompu-teeth– DEVOUR!” A look of confusion on the lieutenant’s face – the Aryakompu struck him, sent the others running. “GO! The tunnels run RED today– a blood price– for my queens, BLOOD–!”"
 uesrennu.8.a:0 "Thousands died – but the Kotakompu queens were not found."

 uesrennu.9.t:0 "Old Magic"
 uesrennu.9.d:0 ""
 uesrennu.9.a:0 ""

 uesrennu.10.t:0 "Mother's Visage"
 uesrennu.10.d:0 "Kottar Orenkoraim was packed full of people. The small island saw a huge influx of people, rushed in to see the restored Giant. The works around the Gathyanavaida had been going on for more than a year by now, and the secrecy around it - the statue was fully boxed by wooden scaffolding - had everyone talking about it. It didn't help that the sculptors involved were constantly changing, many of them running away from the city in the middle of the night.\n\nBut today all of that didn't matter, it was a joyous day for everyone present. Even the [Root.Monarch.GetTitle] arrived for the inauguration, and was preparing a speech. "For centuries the Giant of the Gate stood tall guarding the sea. But a sentinel without a head is like an Aryakompu without his rats. To amend this, we've finally given the Gathyanavaida its visage back and, at the same time, honoured the right hand of our great founder, the Copper-Born-Biter. I'm proud to present to you the restored statue, from now on named the Gnawing Mother of the Gate!"\nA low murmur could be heard in the plaza. The King of Kompu seemed to stare at each one of the presents, even if it was impossible. "Well?""
 uesrennu.10.a:0 "A great applause then started, so loud it almost felt forced."

 uesrennu.11.t:0 "Blood-Bound"
 uesrennu.11.d:0 "Nagar Vyechei is dead.\n\n"It worked!" the giddiness and joy of [Root.Monarch.GetName] was such that [Root.Monarch.GetSheHe] looked like another [Root.Monarch.GetWomanMan], a better one. "All of my babies, my lovelies, I can feel them, the far away kotakompus as close as those near me!"\n"I can know them now, TRULY know! How they feel, what they like, their thoughts! And as I hear them, they hear me! They understand me now! Fully! This is the best day of my life!"\nTo anybody who knew the [Root.Monarch.GetWomanMan], even the most loyal and steelhearted follower, such a spectacle could only provoke immense disgust.\n\n"And you! Rannaraikazhil, my court mage, my friend! You're the one I must thank for this amazing feat. What Bloody Fingers! I name you Blessed Hands! Anything you desire - anything! - you can ask me, and I'll happily give it to you. You deserve that and more! But after that - you must promise! - you will join me to plan the next glorious step!""
 uesrennu.11.a:0 "In the city, not even the buzzing of the flies could be heard."

 uesrennu.12.t:0 "Only One Came Out"
 uesrennu.12.d:0 "In a dark evening, with heavy clouds coming from the south, seemingly chasing him, the notorious personal mage of [Root.Monarch.GetName] arrived at the Uesrennu's royal palace.\nRannaraikazhil had been away for quite some time, busy with some secret task assigned to him by the [Root.Monarch.GetTitle]. [Root.Monarch.GetName] looked pleased to see him, as always, but a nervous tension was also apparent in [Root.Monarch.GetHerHim]. As for Rannaraikazhil, his habitual gravitas and grimness were completely gone: whatever the blood-mage saw or went through in his last mission took a heavy toll on him; the person who entered the throne room was a spent old man that has seen too much. After a quick banquet in the court mage honor, both the ruler and the mage retired in private council.\nHour passed, and everybody retired to their chambers. A single servant was stationed in front of the door to attend to his sire needs, should any arise.\n\nWhat follows is his recounting of that night happenings, given the morning after: "The whole time I never heard anything from inside, filthy weather would have covered many noises tho. It was the dead of the night when the door busted open and the bloody mage and [Root.Monarch.GetName] came out. Them looks was haunted, really wild-eyed. Didn't see me, both of them. After them, was trotting the "heir", [Root.Heir.GetName]. The damn rat looked the saner of the bunch. Everything inside me was screaming "Get the hell away from 'ere", but I still followed the trio. You know how the [Root.Monarch.GetTitle] gets. Couldn't risk it. So I went after 'em"\n\n"They went down in the dungeons and barred the door. After a while, the most terrifying noises began coming outta there. So loud that I couldn't hear the thunder no more. The [Root.Monarch.GetTitle] screams, claws scraping against the stone, the mage shoutings, animal yowlings. I put my hands in ma ears, 'twas horror to listen to. Then, silence. While I sit there not knowing what to do, the barred door gets uprooted from its hinges and this monster comes out. Me, I'm not big, but this thing was at least twice as tall as I was. Arms like logs, long claws on the feet, short rough hair everywhere. An elven face, but beast-like snout. And red eyes. They looked at me.\n\n"You. Go and clean." Almost a growl. But the tone was [Root.Monarch.GetName]'s. I went. The view was horrible: the dismembered body of the mage was scattered around the room, and blood was everywhere, too much to be only the mage's. The kotakompu's or the king's bodies, I didn't see. I lowered me head and cleaned the mess.""
 uesrennu.12.a:0 "All Hail the Dhivukompu! All hail the Rodent-Emperor!"

 uesrennu.13.t:0 "The Oppressed Rise"
 uesrennu.13.d:0 "Good people! Thank you for coming here so numerous! You're a multitude! Whether you're long time members of the Vherenar Cult, new Oren Nayiru faithfuls, or just people, sick and tired of the Rat King's tyranny, who heard whispers of the coming Day of the Dawn, welcome! Everybody's accepted here, because everyone's equal under the light of the One Sun. And all of you are here with the same goal: to bring down the hammer of justice upon the Aryakompu, [Root.Monarch.GetName]!\n\nFor decades the Cult of Vherenar worked in the darkness against the Uesrennu's [Root.GovernmentName]: in the depths of the mines, saving as many slaves as possible; in the devastated fields devoured by the swarm, bringing the little food we had, to help the common people survive the season; in every province of the nation, hiding anybody that attempted even the smallest of resistances.\nAnd the power resented us for that, persecuting us with everything it had! Too many of our companions died; but for each sacrifice, we learned, improved our tactics, and found new ways to hit the Kompu kings where it hurted them the most.\nNow we're ready, with our ranks filled to the brim of new courageous fighters, and our hearts united by the fire of a single purpose: extirpate the weed that is [Root.Monarch.GetName]!\n\nEverywhere in the nation, from the great city of Nanru Nakar, to the humblest of hamlets, plazas like this are full of people like you, ready for the fight to come!\nPeople that lost parents to the mine, children to the hunger, friends to the rats!\n\nPeople! The Day of the Dawn is near, for WE will make it come! By the strength of our arms, the fierceness of our faith and the fury of our anger, the One Sun will rise!"
 uesrennu.13.a:0 "Whatever. Sic the rats on 'em."
 uesrennu.13.tt:0 "Every province that suffered under our rule will convert to §YOren Nayiru§!"

 uesrennu.14.t:0 "Carrion and Empty Pens"
 uesrennu.14.d:0 ""...the raids were organized, my [Root.Monarch.GetTitle], coordinated strikes happening at the same time all around the nation, in most places the ruffians were repulsed, but in some they…" "THEY TOOK MY QUEENS! MY QUEENS THE WARRIORS AND THE WORKERS TOO!" [Root.Monarch.GetName] anger was terrible to behold, [Root.Monarch.GetHerHis] fury made [Root.Monarch.GetHerHim] appear larger than [Root.Monarch.GetSheHe] already was, a fallen god out of ancient legend. "They will pay, I'll make them suffer pain they are not even aware existed, I will make them plead for mercy, for the sweet release of death, and NEGATE IT TO THEM EVERY TIME! AND YOU! USELESS WASTE OF AIR! KITAKITA… ah why bother." the King of the Kompu suddenly deflated, a small and curved husk of what was before, while the minister quickly hurried out of the room.\n\n"They've taken my family, I couldn't protect them… What's a king that can't defend [Root.Monarch.GetHerHis] subjects? An abject failure, a fraud! Poor dears… And yet… And yet! They were not killed, but captured! But a Kotakompu is strong! They should have fought off the aggressors, why didn't they? Did they abandon me? They betrayed me! The ungrateful bastards, after everything I've done for them, THEY'D LEAVE ME FOR ANOTHER? No… no, that's not possible. They must have been forced, or deceived. The lovelies are so naive and trusting…"\n\nThey heard [Root.Monarch.GetHerHim] ramble on the whole night."
 uesrennu.14.a:0 "We've got our own kotakompus now. The Rat-Tyrant will know how it is to face a swarm."

 uesrennu.15.t:0 "A Call We Must Answer"
 uesrennu.15.d:0 "I fought monsters of all kinds in my life. Gnolls, hell bent on enslaving and sacrificing a continent - our homeland - to invoke their demonic patron in Halann and devastate it; goblins, at the times a hungry swarm of looters and pillagers; that orc with a messiah complex, with his immeasurable ambition and the uncountable horde that was following him.\n\nBut all of them, even the most despicable, were fighting for their own people, or believed so at least.\nThese people - elves, like us - don't even manage to do that. They commit the most atrocious crimes against their own people. They blindly follow their crazy Kompu King in every act of brutality his sick, twisted mind devises.\nAnd for what! Some overgrown RATS?\n\nWe came to the old world with the goal of helping our cousins that got left behind in the continent, while we - or our parents - took refuge in the Remnant Fleet.\nNow we hear word that the subjects of this mad tyrant are revolting against his evil rule.\nWill we stay idle, and let this avatar of the Malevolent Dark roam free? Or will we help purge the world of his existence forever?"
 uesrennu.15.a:0 "The Exemplars will respond to the call!"
 uesrennu.15.b:0 "We're not prepared right now…"

 uesrennu.16.t:0 "Against the Malevolent Dark"
 uesrennu.16.d:0 ""I fought monsters of all kinds in my life. Gnolls, hell bent on enslaving and sacrificing a continent - our homeland - to invoke their demonic patron in Halann and devastate it; goblins, at the times a hungry swarm of looters and pillagers; that orc with a messiah complex, with his immeasurable ambition and the uncountable horde that was following him.\n\nBut all of them, even the most despicable, were fighting for their own people, or believed so at least.\nThese people - elves, like us - don't even manage to do that. They commit the most atrocious crimes against their own people. They blindly follow their crazy Kompu King in every act of brutality his sick, twisted mind devises.\nAnd for what! Some overgrown RATS?\n\nWe came to the old world with the goal of helping our cousins that got left behind in the continent, while we - or our parents - took refuge in the Remnant Fleet.\nNow we hear word that the subjects of this mad tyrant are revolting against his evil rule.\nWill we stay idle, and let this avatar of the Malevolent Dark roam free? Or will we help purge the world of his existence forever?"\n-Ecaris speech in front of his soldiers, before entering Kamrayakval's War"
 uesrennu.16.a:0 "We'll throw these interlopers back in the sea they came from."

 uesrennu.17.t:0 "Mourn the Fallen"
