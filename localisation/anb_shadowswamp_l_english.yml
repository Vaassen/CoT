 ###events

 shadowswamp.101.t:0 "The Black Coffee Jitters"
 shadowswamp.101.d:0 "The people of Sarhal are no strangers to coffee.  From the plentiful coffee of the Balawamuni coast to the famed “Sun Coffee” of Azka-Sur, the drink stands as part of daily life.  At least for those that can afford it.  In the Shadow Swamp a cultivar of coffee exists that is not imbued with the brine of the salty Balawamuni shores or the fine roasting of the Bulwari sun, but with decay and shadows.  Legends about the origin of this peculiar strain of coffee state the bean was a product of magic and breeding by the Coven of Yezel Mora themselves. Balawamuni traders even tell ancient tales of hags sweeping down on the coast to steal the precious plant from its ordained home. What is certain is that this coffee, colloquially called Black Coffee because of its pitch black color even before roasting, provides a much greater stimulant effect than other variants.  However, the strangeness of this coffee is making it very difficult for our non-native farmers to grow successfully."
 shadowswamp.101.a:0 "Damn this cursed swamp!"
 shadowswamp.101.b:0 "Admit defeat and ask for help from local experts."
 shadowswamp.101.c:0 "With the matriarch purified, we have gained many insights into this swamp."
 shadowswamp.101.e:0 "Luckily we know just how this coffee is grown."

 shadowswamp.102.t:0 "The Fire's Caterwaul"
 shadowswamp.102.d:0 "The Blood Palm of the Shadow Delta is a common enough tree for those living in and around the Shadow Swamp.  Often prized for its oily crimson sap that is used as a fuel source and cooking fat, the tree has one peculiar property: when burned, it makes a faint screaming noise.  With little dry ground to settle on in the swamp, a small hamlet has sprung up in an elevated copse of Blood Palm. This proximity was practical for the villagers until an errant spark of a cook's hearth started a small fire. When would-be rescuers arrived, the screeching of the boiling palm oil could not be distinguished from the cries of the could-be survivors.  Farm hands hacked down shed walls only to find a flaming stack of wood instead of the crying babe they thought they heard.  The screams of a family went ignored because they were trapped in a cellar, presumed to have been nothing more than a burning pile of stored wood.  Many more perished than typical for a fire of this size."
 shadowswamp.102.a:0 "At least this cleared the land."
 shadowswamp.102.b:0 "Use this as an opportunity to let the farmers plant for themselves."

 shadowswamp.103.t:0 "Lurkers in Foul Water"
 shadowswamp.103.d:0 ""There it is! Dig that trench a little deeper, boys. The field's almost drained" called the foreman to his workhands while swatting at the incessant flies buzzing around his face. \n\nIt had been weeks of backbreaking digging and log felling, but the task of damming a small section of swamp was almost complete. While the paltry incline provided little more than a slightly shallower pit of mud, it was the closest thing to a hill the villagers had seen for miles. Here, they would plant their personal gardens to provide sustenance while the scant share of easily arable land was claimed by those with more coin or men. \n\nAs the hands shifted a massive log of jagged palm into place, the foreman spotted movement just beyond the frantic activity. What initially looked like a cloud of swamp gas came into focus as a pocked mass surrounded by a swarm of insects. They emerged from an irregular lattice-work of cavities on a giant creature's head and back, reminiscent of maggots writhing out of a block of rotted cheese. In seconds, the faces of the workmen were engulfed by the spindly-bodied insects, which gnashed at their quarries' eyes. Just as the workers were overwhelmed, a massive jaw snapped the leg off of the foremost man. Blinded by the bloodflies, none escaped the jaws of the disturbed crocadilians who made their home beside the now dry patch of land."
 shadowswamp.103.a:0 "Forego this foolish endeavor in this forsaken swamp."
 shadowswamp.103.b:0 "Build fortifications with the help of the locals. We will tame this hellish bog."
 shadowswamp.103.c:0 "These creatures will wreak havoc on our enemies."
 shadowswamp.103.e:0 "Let a tribe deal with them and they can keep that patch of mire."
 shadowswamp.103.f:0 "Let the adventurers deal with them and they can keep that patch of mire."

 shadowswamp.104.t:0 "The Last Wish"
 shadowswamp.104.d:0 "Among the strange and shadow-touched flora and fauna of the Shadow Swamp, The Last Wish is among the most otherworldly and dangerous. This common bud looks no different from an average flower, save the monochrome palette that afflicts everything endemic to the swamp. However, when disturbed, hallucinogenic pollen fills the air and puts any unfortunate enough to breathe it into a comatose state. The few who have survived this describe the dream-like state as filled with multitudinous pleasures, but more often than not all that remains of the drugged is a decomposed corpse set upon by the swamp and its creatures. It seems villagers all around the province are being drawn in great numbers to this flower and falling prey to the swamp."
 shadowswamp.104.a:0 "What do you expect when you settle in a cursed swamp?"
 shadowswamp.104.b:0 "With the swamp tamed, we can harvest this plant."
 shadowswamp.104.c:0 "Send a regiment to deal with this... And tie cloths around their mouths."
 shadowswamp.104.e:0 "Why not turn a profit on this plant?"

 shadowswamp.105.t:0 "Undead Swarm [Root.GetName]"
 shadowswamp.105.d:0 "The veil between planes is at its thinnest in the Shadow Swamp, and small disturbances can temporarily shear that veil. A thunderstorm has passed through the province and brought forth malevolent spirits from the Shadow Plane. Seizing the corpses of deceased men and swamp creatures alike, these spirits have begun attacking our settlements in the area."
 shadowswamp.105.a:0 "Hire some adventurers."
 shadowswamp.105.b:0 "Set the tribes on them."
 shadowswamp.105.c:0 "This is what pitchforks are for."

 shadowswamp.106.t:0 "The Shambling Mounds"
 shadowswamp.106.d:0 "As the sprawling, diseased limbs of the Shadowroot Matriarch continue to hang over large swathes of the swamp, her fruits fall among our people. Unlike the fruits of common trees, these giant fig-like bodies drop to the ground and quickly turn from pliable flesh to a tangled mass that appears more human than fruit. They then proceed to lash out at any passers-by unfortunate enough to cross their paths. While immobile, these mounds clog the roads, canals and fields and must be dealt with. A common tactic is fire, but this costs manpower and resources, even more so in the dank swamp. The other option is to let nature, or what passes for nature in this place, take its course. Horncaps and other fungi will deal with the mounds in time."
 shadowswamp.106.a:0 "Organize regular foraging parties to reach them before they grow."
 shadowswamp.106.b:0 "Ask the natives to burn them!"
 shadowswamp.106.c:0 "Have our bravest prove themselves with fire and burn them to the ground!"
 shadowswamp.106.e:0 "Let nature take its course."

 shadowswamp.107.t:0 "Nightmares"
 shadowswamp.107.d:0 "[GetShadowswampNightmares] \n\nThen the village awoke.  Were these dreams harbingers of doom to come, or just illusions spurred by the deceitful magic of the swamp? Those with means are leaving in boats and on horseback, while those without are packing up their meagre belongings and trying to leave on foot using ill-constructed roads and paths. How should this be dealt with?"
 shadowswamp_nightmares_desc_a:0 "The voice would not stop. All in the village now heard it. What it commanded was unthinkable, but the alternative was utter destruction… to sacrifice one child a night lest the beast savage the entire town. Third and fourth children were judged as chaff to be discarded into the maw of the monster's incessant gnashing jaws. Riders for help never returned. Neighbors turned on neighbors. Madness spread until the village consumed itself in fires and fratricide, even before the beast had the chance to satiate its hunger."
 shadowswamp_nightmares_desc_b:0 "The village green was surrounded. The quivering masses of sinewy tendrils ran from the top of the squat crier's tower to hundreds of heaps on the ground. What were those featureless masses? They looked like clumps of worms, or arteries. But when one looked at them, ecstasy burned in their gorge. The urge to touch them, become one with them, was overwhelming. Villagers plunged their hands into the masses. They cried out as they covered themselves with the tendrils. Finally, the village green was silent once more, save for the faint rustling of even more quivering masses."
 shadowswamp_nightmares_desc_c:0 "Too many eyes. An impossible number of legs. None could catch more than a mere glimpse of the creature's matted coat of quill-like hair as it bounded out of the village.  What was seen clearly, was the remains of the victims. Sinews of livestock hide draped from the fences of their pens. A liver, likely human, half devoured and left in a puddle to rot.  Too many dead.  No place to run."
 shadowswamp.107.a:0 "Let them leave if they are not brave enough."
 shadowswamp.107.b:0 "They are in the swamp for a reason, they stay!"
 shadowswamp.107.c:0 "With the Shadowroot Matriarch purified, we can now explain the source of these dreams."
 shadowswamp.107.e:0 "Let us discuss the portents of these dreams."

 shadowswamp.108.t:0 "A Break in the Grey"
 shadowswamp.108.d:0 "The first thing any inhabitant of the Shadow Swamp must get used to is the complete lack of color caused by the swamp's pigment devouring magic. Those who have lived their whole lives there think stories of green grass and blue sky are little more than tales to enchant children. The only proof of the world of color beyond the grey swamp is the tchoken, a squat lizard-like creature with vividly colored scales. Considered one of the dullest of Hallan's creatures, what the tchoken lacks in simple awareness it makes up for in hardiness in the form of immunity to almost all magic. These bumbling creatures seldom wander into the Shadow Swamp, but when they do they stand out as a bastion of green life against the drab surroundings. \n\nWhile carrying out the tasks of their daily drudgery, a group of villagers chanced across one of these tchoken beaming through the ashen mire. These morose denizens of the swamp beg to have the tchoken captured and brought into their homes as a symbol of the colorful life of the outside world."
 shadowswamp.108.a:0 "We will aid in its capture."
 shadowswamp.108.b:0 "If you like them so much, we will buy you a herd."
 shadowswamp.108.c:0 "Bring some tchoken from outside herders… as a gift to the crown."
 shadowswamp.108.e:0 "Back to work in your grey swamp."

 shadowswamp.109.t:0 "A Break in the Grey"
 shadowswamp.109.d:0 " "ITS… NOT THIS" \n\nOotz exclaimed, waiving his hands about at his surroundings. \n\n "ITS… BRIGHT!" \n\nOotz had been going on about this bright creature all night, and the other trolls were tiring of his insistence that something exists here that is full of… color.  Even the concept of color was not one a swamp troll often had to contend with, having been born in the monochrome Yezel Mora. Raiding parties and warbands often told tales of the brightness outside, but those were things for burning and looting, unbecoming of the swamp itself. \n\nRegardless, Ootz would not shut up. \n\nAnd who knows? Maybe this bright creature would make for a tasty lunch."
 shadowswamp.109.a:0 "We will have a delectable meal."
 shadowswamp.109.b:0 "Maybe we can turn its hide into a flag to prove our mastery of the outside world?"

 shadowswamp.110.t:0 "Hattiatia Grove Discovered"
 shadowswamp.110.d:0 "All throughout the swamp, alien flora and fauna befog our people. However, not all of these mysteries are wholly destructive. Hattiatia, which grows as a vine among the towering Latunga pine, causes mild effects on those who partake in its smoke for its mind-altering properties. Too much use leaves the body necrotized with the mind having wandered to the Shadow Plane itself, but this does not stop many from seeking out the plant. Careful harvesting of Hattiatia can bring many benefits among the magical and rich."
 shadowswamp.110.a:0 "Let us harvest the root for our Mages."
 shadowswamp.110.b:0 "Let us sell the plant to the highest bidder."
 shadowswamp.110.c:0 "Can we propagate their growth?"
 shadowswamp.110.e:0 "Let us give the trove to our tribes."

 ### modifiers
 
 shadowswamp_land_cleared:0 "Land Cleared"
 desc_shadowswamp_land_cleared:0 "The recent fires caused by Blood Palm oil has cleared a large tract of land.  This has made development easier, at least until the swamp reclaims the land."
 shadowswamp_croc_guards:0 "Crocadilian Guards"
 desc_shadowswamp_croc_guards:0 "We have harnessed the Crocadilian population to help make the swamp even more dangerous for our enemies."
 shadowswamp_last_wish:0 "The Last Wish"
 desc_shadowswamp_last_wish:0 "A seemingly innocuous flower that once touched, rustled or disturbed sends out a cloud of hallucinogenic pollen. Our subjects are falling prey to this in great numbers."
 shadowswamp_shambling_foragers:0 "Shambling Foragers"
 desc_shadowswamp_shambling_foragers:0 "If picked before they grow large, the Shambling Mounds of the Shadow Swamp are a delicious food source. We are sending out foraging parties for them."
 shadowswamp_shambling_mounds:0 "Shambling Mounds"
 desc_shadowswamp_shambling_mounds:0 "Actually just figs of the Shadowroot Matriarch, these Shambling Mounds quickly grow into humanoids that fight anything that comes within range of them."
 shadowswamp_tchoken_mascot:0 "Tchoken Mascot"
 desc_shadowswamp_tchoken_mascot:0 "A tchoken is being used as a mascot to bouy the spirits of the inhabitants."
 shadowswamp_tchoken_meal:0 "Tchoken Meal"
 desc_shadowswamp_tchoken_meal:0 "Tchoken is a delicacy for the trolls of Yezel Mora, and a feast of it is heartening"
 shadowswamp_hattiatia_farm:0 "Hattiatia Farm"
 desc_shadowswamp_hattiatia_farm:0 "We have managed to cultivate the hattiatia plant."

