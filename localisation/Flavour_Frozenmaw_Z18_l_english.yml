 flavor_frozenmaw.14.t:0 "The Death of Frida Vrorensson"
 flavor_frozenmaw.14.d:0 "The abnegation of her own will by Frida Vrorensson and later sanctification of that act can be seen as the original sin of Grombari patriarchy. In the first case, she, even as little more than a child, sacrifices not just control of her body, but even the right to protest that lack of control, in the interests of both her blood and (forcible) legal families. Further, she becomes identified with Esmaryal, herself a double-symbol of female servitude, both as the figurehead of female submission and as the result of Halanna's final act: the providence of a new spouse that her husband not be left alone. Preamble to "The Grombari Woman," by Susan B. Orcthony and Lucretia Mossmouth, during their 1870 exile in Gaweton, Extremely Noncanonical Press (Placeholder?)"
 flavor_frozenmaw.14.a:0 "rip queen, you deserved better (Placeholder)"

