l_english:
 z18_fridas_preaching_title:0 "Frida's Preaching"
 z18_fridas_preaching_desc:0 ""It was one of the few times that Brasûr was not off on some campaign crushing dissenters and ensuring loyalty that the discussion took place. Well, I say discussion… Most discussions between the two were icy at best, and full blown arguments at worst. This was more an argument, about what he had heard of Frida’s preaching about Esmaryal. Causing concern amongst the tribes, demanding she stop. She fired back, saying that he wasn’t just the warchief of Gray Orcs anymore - and besides, he couldn’t deny that her work was helping the burden of governance…\n\nSo that’s why you’re seeing more of those priests of Esmaryal about. What do I make of it? I’m just the queen’s bodyguard, I’m no theologian, unlike her… But I must say, the priests have done a lot to help. We share this land now, much as some on either side are bothered by that, so we got to respect each other." \n -Bosun Bloodbite, Frida’s bodyguard, in conversation with other Gray Orcs"

 z18_take_care_of_victims_of_war_title:0 "Take Care of Victims of War"
 z18_take_care_of_victims_of_war_desc:0 ""Esmaryal was created to care for the gods. She was born so that they might have a mother looking after them, providing for them and seeing to their needs. She has cared for us, provided us with the warmth of the hearth, the bounty of the harvest, and the joy of starting our own families. Her purpose is to provide for the Gods and for us, and for that, we worship her.\n\n Frida did much the same for us. She rebuilt our homes, so that our hearths may burn once more. She cleared our fields, so the crops may grow again. And she showed us all the sacrifices she was willing to make for her family. She cared not for herself, only for her people. She gave her body to Brasûr, so that we may find peace. And she stayed her brother’s hand so that peace could be maintained.\n\nHer actions can lead to only one question: how can one learn of her and not recognise an Avatar of Esmaryal at work?"\n-Sermon delivered by a priest of the House of Comfort"

 z18_cult_of_the_gentle_dawn_title:0 "Cult of the Gentle Dawn"
 z18_cult_of_the_gentle_dawn_desc:0 ""When we half-orcs came of age, there were but two choices before us - we could join the military, as many did, bolstering the ranks and earning our place via war. Or, we could remain in the Cult that raised us, and become its servants and priests. Though I chose the latter, and my sister the former, we both still carried the teachings of the Cult of the Gentle Dawn with us. Where I converted via the care our temples provided and the sermons I preached, she converted through proving the strength of our convictions in the crucible of war.\n\nBut with us, the cult spread, first to our fellow half-orcs, and then to our orcish parents and siblings. Many chose for pragmatic reasons - our temple provided for them, gave them care where it was needed and services when required. But I like to believe there was a deeper conviction, too - that they had entered a new land, and that they must find a new faith to suit it."\n-From the Journals of Morik Mintirley, Priest of Esmaryal"

 z18_embrace_new_gods_title:0 "Embrace New Gods"
 z18_embrace_new_gods_desc:0 "As our rule has stabilised and our people adapted to life amongst and with the White Reachmen, we have had to adopt new cultural practices and ways of thinking. This has not remained limited to matter of dress and style as the Cult of the Gentle Dawn, espousing Esmaryal and her virtues, has spread rapidly across our lands. It has cut across species lines, with Reachmen, Orc, and half-orc alike following the cult and its teachings.\n\nThis has put Brasûr and his closest advisors in an awkward position, made more awkward by Frida’s constant demands that he give his official patronage to the church. But now that the cult is entrenched and the Old Dookanites hold little power, the time seems ripe to proclaim the Regent Court as our faith. While it will cause issues amongst those who still follow the old ways, it shall help us to integrate with the Cannorians and have them accept us as something more than monstrous invaders."

