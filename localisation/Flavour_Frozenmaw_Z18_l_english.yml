 z18_crush_ebonfrosts_title:0 "Ruins of an Empire"
 z18_crush_ebonfrosts_desc:0 "The Alcarssons of Eskerborg have in their possession several sets of a strange looking armor which shines and defects blade attacks unlike any other armor we have seen. When pressed on how they came to possess such valuable equipment, they shared with us some of their ancestral tales.\n\nAs they put it, centuries ago, they were once subjects to an ancient dynasty of reaver-kings from the north. These so-called "Ebonfrosts" were not only lords over the Reach but in fact controlled an empire which spanned over all of Escann. A realm that the humans refer to as "Castanor" which, if the tales are to be believed, had existed for nearly two thousand years. Their empire was brought down in a devastating war of magic and sorcery. In the aftermath of the destruction, the surviving Ebonfrosts retreated north, back to their ancestral homelands in the Urviksten Mountains, where they rule a rump state that remains to this day.\n\nThe strange sets of armor are the product of a secretive forging technique which only the Ebonfrosts know of and these forges are supposedly still actively in use within their lands. None of our conquests thus far have presented such valuable loot. The Urviksten Mountains seem ripe for the taking and our warriors are eager to share the spoils.\n\nIt is time for the last remnant of the Ebonfrost empire to come to an end."

