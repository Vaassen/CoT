 z18_new_breed_of_warriors_title:0 "Establish the Bazrani"
 z18_new_breed_of_warriors_desc:0 ""We are the forsaken children of our families. Born unwanted, left uncared for. We have had to fight our own way through life - and we continue to fight, in service to our Warchief. But this fight has not been in vain, for it is in this cause we have found our true family; brothers and sisters, like us in countenance and in background. It is here that we have forged our bonds, and it is on the field of battle that we shall prove our worthiness - so that all may see the strength of Frozenmaw’s next generation.\n\nAlready I see our future, my comrades, my family. We shall lead our people to greatness, to glory, and to wealth. We shall be respected, feared and celebrated. And we will found our own families then, who shall serve as we did. May our names carry on through their deeds, and may we achieve this glorious dream."\n-A speech from 'Artorian Pureblood', a popular play named after the first half-orc general of Frozenmaw"

