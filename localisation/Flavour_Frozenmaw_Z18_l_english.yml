 #events 
 flavor_frozenmaw.2.t:0 "Caught Between Worlds"
 flavor_frozenmaw.2.d:0 ""What is my name, Dad? Because Mommy calls me Drazad and you call me Elrac?"  Dad looks at me, sighs, and leaves the room. I ask this question to my tutors, to the guards, even to the jester, and they all leave or claim they have important business and can't be bothered. Nobody answers my question. I go back to my room and play with my toys. Even then, this just brings more questions. All the toy soldiers look human, while all the evil monsters look like Orcs, no toy I have is like me.  If the good are human and the monsters are Orcs then what am I? Why did mom and dad get together if they are from opposite sides? I know it's not love as they are never together. Nanny later arrived and told me that soon all would change that he would make things right again, put people like mom in their place again, that I shouldn't worry, that despite having their blood, he will treat me well. I remember Mom saying to tell her if anyone said anything bad about orcs or anything that was treasonous to the "warchief", because soon I must pick a side."
 flavor_frozenmaw.2.a:0 "Which side am I on?"

 flavor_frozenmaw.3.t:0 "Price to be Paid"
 flavor_frozenmaw.3.d:0 ""

 flavor_frozenmaw.4.t:0 "Bakram Winterwind"
 flavor_frozenmaw.4.d:0 "They say that to be an Orc is to fight; if so, then perhaps Bakram Winterwind is no true Orc. No one has seen him using a weapon, he never took part in raids, he looked older than his age and frail. But what he lacked in physical strength, he made up for with the gift of a silver tongue and the capacity to read people. He spoke little and preferred to listen, but a handful of his words solved dozens of conflicts within the clans. He solved deadly feuds that spanned centuries in just one afternoon, with all sides somehow happy with the outcome.\n\nPerhaps Bakram Winterwind is a new kind of Orc: his fights happen not on the field of battle but in the fields of politics and diplomacy, where he can show his ability. As a Shaman, he dedicated little time to the religious rituals, preferring to get into the problems of the physical, and as Chief Shaman, this attitude has begun to rub off on Brasûr, who now entertains the idea of giving other faiths equal weight to the Dookanism of his forefathers."
 flavor_frozenmaw.4.a:0 "Will Bakram make New Orcs of us all?"

 flavor_frozenmaw.8.t:0 "Giant's Manse Uprising"
 flavor_frozenmaw.8.d:0 "They're out for blood tonight\nThey're the widow-makers\nKiller Elite, Olavish Fighters\n\nA motley crew in the line of fire\nA raging horde of criminal pilgrims\nMurder Patrol of heavy Berserkers\n\nBurning all on the road to ruin\nThis is the dark chapter in Olavish History\nBut no one cares, where is the reader now?\nThe words are gone somehow, but I just can't take it, so"
 flavor_frozenmaw.8.a:0 "Break the chains one final time."

 flavor_frozenmaw.9.t:0 "Zuruborun Dignity"
 flavor_frozenmaw.9.d:0 "As our soldiers work alongside the Gray Orcs of the Ironwall Company, they begin to see them as something more than monsters. They begin to see them as comrades in arms."
 flavor_frozenmaw.9.a:0 "Could an orc truly fight with honor?"
 
