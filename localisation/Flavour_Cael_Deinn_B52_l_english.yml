l_english:
 cael_deinn.1.t:0 "The Grey Grimoire"
 cael_deinn.1.d:0 "Mage elf protag finds an old cellar in the ruins of a mage tower as they are rummaging for something to gain an edge. Inside they “hear” a whisper that leads to the book."
 cael_deinn.1.a:0 "Definitely not evil or foreboding."
 cael_deinn.2.t:0 "The Bloodpact"
 cael_deinn.2.d:0 "Years of research by mage elf protag has led to learning of a ritual. Unlike the fey stuff they knew, this is devilish. Dangerous, but if they mastered it, they could save their people and assure dominance."
 cael_deinn.2.a:0 "Deal"
 cael_deinn.2.b:0 "No Deal"