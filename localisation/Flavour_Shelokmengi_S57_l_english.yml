 #Breadbasket Events
 S57_flavor_shelokmengi.t: "Harvest Report"
 S57_flavor_shelokmengi.tt: "Your level of §GBreadbasket§! has changed!"
 S57_flavor_shelokmengi.100.d: "My [Root.Monarch.GetTitle], dire news from the Yenaze Mezhi! This year’s harvest has come in and… in effect, it has not. What meagre fields we possess are insufficient or simply lie fallow due to lack of sufficient labour, and are barely enough for the peasantry to sustain themselves with. We have been reduced to importing grain from other nations, much to our dismay. The populace is outraged, branding us “cereal killers” after a spate of deaths to starvation. Private granaries are being ransacked by hungry peasants even as nobles are being beaten in the streets for their failure to ensure a good harvest, and this trend looks likely to continue until we resolve this issue."
 S57_flavor_shelokmengi.100.b: "No longer inform me about this"
 S57_flavor_shelokmengi.100.tt: "RThis decision is permanent!"
 S57_flavor_shelokmengi.100.a: "Damn those inbread fools!"

 S57_flavor_shelokmengi.101.d: "My [Root.Monarch.GetTitle], news from the Yenaze Mezhi. This year’s harvest has come in, and our reports show that it was more or less adequate. Our farmland is doing just fine, and the people are able to feed themselves well enough - at a cost, to be certain, but an expected one. As such, our food supply appears stable, and our people thus appear content."
 S57_flavor_shelokmengi.101.a: "The bread and butter of any state."

 S57_flavor_shelokmengi.102.d: “My [Root.Monarch.GetTitle], news from the Yenaze Mezhi. This year’s harvest has come in, and our reports show that it was in line with our projections. Our farmland is doing just fine, and the people are able to feed themselves well enough - at a cost, to be certain, but one below average. We have even begun to exploit these low prices to stockpile enough grain to ward against future famines. As such, our food supply appears stable, and our people thus appear content.”
 S57_flavor_shelokmengi.102.a: "The bread and butter of any state."

 S57_flavor_shelokmengi.103.d: “My [Root.Monarch.GetTitle], good news from the Yenaze Mezhi. This year’s harvest has come in, and our reports show that we have a modest surplus. Our sizeable fields are lush with healthy grain, bolstered by the Samayebaka's prayers. The people are well-fed and happy, as our granaries can spare some grain for a stipend to the poor and needy. This has allowed our populace to thrive, and many predict we will see a slight increase in the population should this continue.”
 S57_flavor_shelokmengi.103.a: "Give them today their daily bread!"

 S57_flavor_shelokmengi.104.d: “My [Root.Monarch.GetTitle], good news from the Yenaze Mezhi. This year’s harvest has come in, and our reports show that we have a substantial surplus. Our sizeable fields are lush with healthy grain, bolstered by the Samayebaka's prayers. The people are well-fed and happy, as our granaries can provide a considerable amount of grain as a stipend to the poor and needy - as well as to our military, should they go off on campaign. This has allowed our populace to thrive, and many predict we will see a moderate increase in the population should this continue.”
 S57_flavor_shelokmengi.104.a: "Give them today their daily bread!"

 S57_flavor_shelokmengi.105.d: “My [Root.Monarch.GetTitle], good news from the Yenaze Mezhi. This year’s harvest has come in, and our reports show that we have a great surplus. Our sizeable fields are lush with healthy grain, bolstered by the Samayebaka's prayers. The people are well-fed and happy, as our granaries can donate more than enough grain as a stipend to the poor and needy - as well as to our military, should they go off on campaign. This has allowed our populace to thrive, and many predict we will see a moderate increase in the population should this continue.”
 S57_flavor_shelokmengi.105.a: "Give them today their daily bread!"

 S57_flavor_shelokmengi.106.d: “My [Root.Monarch.GetTitle], great news from the Yenaze Mezhi! This year’s harvest has come in, and our reports show that we have a huge surplus! Our vast fields are flush with grain; a combination of good management, the benevolence of Amilak, and new production methods making them more fertile than ever before. Not a single man or woman starves thanks to the grain stipend, and the population will be able to grow quickly if this abundance continues. This has of course been a boon to the army, with more men than ever freed up from farm labour. It appears our agricultural policies have been bearing, if not fruit, then grain.”
 S57_flavor_shelokmengi.106.a: "We know which side our bread is buttered on."

 S57_flavor_shelokmengi.107.d: “My [Root.Monarch.GetTitle], great news from the Yenaze Mezhi! This year’s harvest has come in, and our reports show that we have an immense surplus! Our vast fields are flush with grain; a combination of good management, the benevolence of the Amilak, and new production methods making them more fertile than ever before. Not a single man or woman starves thanks to the grain stipend, and the population will be able to grow quickly if this carries on. This has of course been a boon to the army, with more men than ever freed up from farm labour. It appears our agricultural policies have been bearing, if not fruit, then grain.”
 S57_flavor_shelokmengi.107.a: "We know which side our bread is buttered on."

 S57_flavor_shelokmengi.108.d: “My [Root.Monarch.GetTitle], great news from the Yenaze Mezhi! This year’s harvest has come in, and our reports show that we have more than we could ever need! Our vast fields are flush with grain; a combination of good management, the benevolence of Amilak, and new production methods making them more fertile than ever before. Not a single man or woman starves thanks to the grain stipend, and the population will be able to grow rapidly if this carries on. This has of course been a boon to the army, with more men than ever freed up from farm labour. It appears our agricultural policies have been bearing, if not fruit, then grain.”
 S57_flavor_shelokmengi.108.a: "We know which side our bread is buttered on."

 S57_flavor_shelokmengi.109.d: “My [Root.Monarch.GetTitle], excellent news from the Yenaze Mezhi! This year’s harvest has come in, and our reports show that we have enough grain to feed not just ourselves, but all of our neighbours too! The Samayebaka have brought about such great rains that we have turned barren lands into more fertile fields for the greatest harvests we’ve ever seen, helped by able management and innovations in agriculture. Our well-fed population has entered a period of rapid growth, while our traders ply the land and sea to offload our excess (much to the resentment of foreign farmers). This has been a great boon to not just our economy but our army, able to field thousands more recruits even after suffering losses.”
 S57_flavor_shelokmengi.109.a: "It’s good to be the breadwinner!"

 S57_flavor_shelokmengi.110.d: “My [Root.Monarch.GetTitle], excellent news from the Yenaze Mezhi! This year’s harvest has come in, and our reports show that we have enough grain to feed not just ourselves, but our neighbours and those across the Gulf too! The Samayebaka have brought about such great rains that we have turned barren lands into more fertile fields for the greatest harvests we’ve ever seen, helped by able management and innovations in agriculture. Our well-fed population has entered a baby boom, while our traders ply the land and sea to offload our excess (much to the resentment of foreign farmers). This has been a great boon to not just our economy but our army, able to find thousands more recruits even after suffering losses.”
 S57_flavor_shelokmengi.110.a: "It’s good to be the breadwinner!"

 S57_flavor_shelokmengi.111.d: “My [Root.Monarch.GetTitle], amazing news from the Yenaze Mezhi! This year’s harvest has come in, and our reports show that we produced enough grain to rival entire continents! Endless miles of golden fields stretch out to the horizon in parts, sustained by life-giving rains even where nothing once grew, and harvested and milled with the most advanced methods we know of. At this point, even exporting grain across the Gulf of Rahen can barely stop our granaries from overflowing! The population has recently been absolutely booming, reaching numbers far higher than anyone ever expected without any risk of famine - something which has been reflected in the immense number of men we’ve been able to raise into our armies. Truly, there has never been a better time to be Mengi than there has been now.”
 S57_flavor_shelokmengi.111.a: "This is great! Why, it’s the greatest thing since… since…"

 S57_flavor_shelokmengi.112.d: "This is a handler event for the breadbasket, you are not intended to see this. Please, proceed."
 S57_flavor_shelokmengi.112.a: "PROCEED! PROCEED WITH THE GRAIN!"

