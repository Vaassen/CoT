l_english:
 # Missions
 # Incident
 F80_mission_playing_on_rivalries_title: "Playing on Rivalries"
 F80_mission_playing_on_rivalries_desc: "Leaning on the rivalry between Hytiranyalen and Ayarallen to sow the seeds for the former to betray the latter."
 F80_tt_playing_on_rivalries_chosen_decrease: "\nIf this mission is completed before §YOur Southern Cousins§!:"

 F80_mission_firanyalen_uprising_title: "Firanyalen Uprising"
 F80_mission_firanyalen_uprising_desc: "Considering that most outsiders refer to the Harpies of the Harpy Hills as 'Firanyan Harpies', it is no surprise that the Firanyalen flocks see themselves as the rightful rulers of the Hills. This can be exploited."
 F80_tt_firanyalen_uprising_effect: "The first time we or [F33.GetName] declare war on Ayarallen, the Firanyalen flock will declare independence and join our war against Ayarallen.\n"
 F80_tt_firanyalen_uprising_chosen_decrease: "If this mission is completed before §YRight Words, Right Ears§!:"

 F80_mission_invite_the_namensar_title: "Invite the Namensar"
 F80_mission_invite_the_namensar_desc: "It is the duty of Nansalen to spread the Light of Surael to all Harpies. However, we lack support from the wider Sun Cult. Convince them to support us in enlightening the other harpies."
 F80_tt_invite_the_namensar_trigger: " of [561.GetName], [565.GetName], [601.GetName], [631.GetName], and [643.GetName] are owned by a country with [dyn_loc_F80_invite_the_namensar_advisor]"
 dyn_loc_F80_invite_the_namensar_advisor_yes: "§Y75§! opinion or who has had relations improved by at least §G+50§! with [Root.GetName] or [F33.GetName]"
 dyn_loc_F80_invite_the_namensar_advisor_no: "§Y100§! opinion or who has had relations improved by at least §G+75§! with [Root.GetName] or [F33.GetName].\n\nIf we are employing a Theologian, an Inquisitor, or any §YAdministrative§! Advisor with at least Skill §Y2§!, decrease these requirements by §G25%§!"

 F80_mission_a_divine_queen_title: "A Divine Queen"
 F80_mission_a_divine_queen_desc: "Taking the mantle of strongest matriarch within the Harpy Hills, and taking the Queen's Throne."
 F80_tt_a_divine_queen_chosen_decrease: "\nIf this mission is completed before §YThe Wedding of Queen Aras§!:"

 F80_mission_standing_tall_title: "Standing Tall"
 F80_mission_standing_tall_desc: "Akalses and Nansalen rising together."

 F80_mission_our_southern_cousins_title: "Our Southern Cousins"
 F80_mission_our_southern_cousins_desc: "Though it is hardly needed, we should nevertheless reaffirm our bonds with [F33.GetName], with Ninsara taking one of Aras' cousins as her primary consort, in return for aid in overthrowing our heathen overlords."
 F80_tt_our_southern_cousins_effect: "If [F33.GetName] does not have a truce or is already at war with Ayarallen, they will join our wars against Ayarallen.\n"
 F80_tt_our_southern_cousins_chosen_increase: "If this mission is completed before §YPlaying on Rivalries§!:"

 F80_mission_right_words_right_ears_title: "Right Words, Right Ears"
 F80_mission_right_words_right_ears_desc: "While Karodir I is a great mage, his statesmanship is less impressive. As such, our kin in [F33.GetName] effectively run much of Varamhar, and they could ensure that Karodir joins our war against Ayarallen."
 F80_tt_right_words_right_ears_effect: "If [F42.GetName] does not have a truce or is already at war with Ayarallen, they will join our wars against Ayarallen.\n"
 F80_tt_right_words_right_ears_chosen_increase: "If this mission is completed before §YFiranyalen Uprising§!:"

 F80_mission_the_wedding_of_queen_aras_title: "The Wedding of Queen Aras"
 F80_mission_the_wedding_of_queen_aras_desc: "Helping Aras marry Karodir and establishing [F33.GetName] as the senior partner in the union. Totally normal diplomacy."
 F80_tt_twin_empire_effect: "Note that we will not be able to join wars against nations with which we have a truce.\n\nOnce the Incident §YKings and Queens, Kneeling§! is completed, [F33.GetName] will become our Twin Empire."
 F80_tt_the_wedding_of_queen_aras_chosen_increase: "\nIf this mission is completed before §YA Divine Queen§!:"

 # Post-incident
 F80_mission_our_duty_title: "Our Duty"
 F80_mission_our_duty_desc: "The Divine Duty of Queens to unite harpies. However, bringing them under our banner is not enough; they must also be made to see the light of Surael, starting with the major flocks."
 F80_tt_our_duty_effect: "Building Temples in §YHarpy§! provinces will give a §Gsmall Decrease of Monstrosity§!, as well as applying the following modifier if the current province religion is §YThe Hunt§!:"

 F80_mission_our_song_title: "Our Song"
 F80_mission_our_song_desc: "Spreading our version of the Song of Firayan, compatible with the new rule."
 F80_tt_our_song_effect: "After this modifier has expired, future casts of the Song of Firayan will also provide the following:"

 F80_mission_back_into_the_flock_title: "Back into the Flock"
 F80_mission_back_into_the_flock_desc: "Despite living on the edge of Bulwar and being long separated from us, it is the Divine Duty of Nansalen to rule all Harpies in Bulwar, and so the Siadunan Harpies must be brought under our wing."
 F80_tt_if_or_when_culture_conversion_2094: "If or when §Y[2094.GetName]§! is converted to §YFiranyan Harpy§! culture:"
 F80_tt_if_or_when_culture_conversion_2908: "If or when §Y[2908.GetName]§! is converted to §YFiranyan Harpy§! culture:"
 F80_tt_if_or_when_culture_conversion_2921: "If or when §Y[2921.GetName]§! is converted to §YFiranyan Harpy§! culture:"

 F80_mission_royals_not_monsters_title: "Royals, Not Monsters"
 F80_mission_royals_not_monsters_desc: "Being acknowledged as no longer being monsters, and using this legitimacy to get people to agree that harpies should probably rule the Harpy Hills."

 F80_mission_akalses_restored_title: "[F33.GetName], Restored"
 F80_mission_akalses_restored_desc: "Nansalen uniting the Harpy Hills after many, many years, while [F33.GetName] restores most of its ancient borders. And then? Then it is time to push further."

 F80_mission_securing_the_heartland_title: "Securing the Heartland"
 F80_mission_securing_the_heartland_desc: "Securing a safe realm, and a solid foundation for further expansion."
 F80_tt_securing_the_heartland_bulwar_effect: "For every province in the §YBulwar Superregion§! owned by [F80.GetName], [F33.GetName], or a subject of either, [F80.GetName] and [F33.GetName] gains 1 Prestige, with excess Prestige being converted into each type of §YMonarch Power§!."
 F80_tt_securing_the_heartland_claims: "We gain §YPermanent Claims§! on all §YHarpy§! provinces in the §YFar Salahad§! region, while [F33.GetName] gains §YPermanent Claims§! on all other provinces in the region."
 F80_tt_securing_the_heartland_golden_highway_sharing_effect: "[F80.GetName] and [F33.GetName] can start construction of §YGolden Highway§! segments in Bulwar, so long as all provinces in the segment are owned by either country or their subjects."

 F80_mission_not_so_far_anymore_title: "Not So Far Anymore"
 F80_mission_not_so_far_anymore_desc: "Rebuilding the Golden Highway."
 F80_tt_not_so_far_anymore_golden_highway_trigger: "The rebuilding of the §YGolden Highway§! has been begun throughout all of Bulwar."
 F80_tt_not_so_far_anymore_ash_palace_monument_copies: "When [F33.GetName] upgrades §YThe Ash Palace§!, this modifier will be upgraded to mirror the Global Modifiers provided the monument, other than the extra Administrative Possible Policies."
 F80_tt_not_so_far_anymore_golden_highway_extension_effect: "[615.GetName], [616.GetName], [618.GetName], [619.GetName], [609.GetName], [666.GetName], [663.GetName], and [660.GetName] will all become part of the §YGolden Highway§!."

 F80_mission_our_kin_in_akalses_title: "Our Kin in [F33.GetName]"
 F80_mission_our_kin_in_akalses_desc: "Play into the long-standing ties between Nansalen and the Aras royal house to rehabilitate Nansalen's image, and reaffirm our intentions to aid [F33.GetName] in restoring their ancient borders."
 F80_tt_our_kin_in_akalses_conquest_effect: "So long as we own no provinces outside the §YHarpy Hills§!, we will gain a §Gsmall Decrease of Monstrosity§!."
 F80_tt_our_kin_in_akalses_claims: "[F33.GetName] claims their ancient lands."

 F80_mission_the_palace_of_wisdom_title: "The Palace of Wisdom"
 F80_mission_the_palace_of_wisdom_desc: "Sending students to Eka-Idulnazzar."
 F80_tt_the_palace_of_wisdom_eka_idulnazzar_monument_copies: "When [F33.GetName] upgrades §YEka-Idulnazzar§!, this modifier will be upgraded to mirror the Global Modifiers provided the monument."

 F80_mission_invite_dwarven_migrants_title: "Invite Dwarven Migrants"
 F80_mission_invite_dwarven_migrants_desc: "Getting Dwarves to settle in Nansalen lands to help mine and process ore."
 F80_tt_invite_dwarven_migrants_effect: "In all current and future provinces within the §YHarpy Hills§! with a §YWorkshop§! or §YCounting House§! will gain a small dwarven minority, if one is not already present. If a §YWeapons Manufactory is built, a §Ylarge§! dwarven minority will be added."

 F80_mission_bahari_highlands_title: "Bahari Highlands"
 F80_mission_bahari_highlands_desc: "Saving Bahar from its decades of devastation by uniting it under our rule, and convincing Ovdal Tûngr that their future is best secured by siding with us."
 F80_tt_ovdal_tungr_ally: "If we complete this mission while allied to §Y[F23.GetName]§!:"
 F80_tt_bahari_highlands_effect: "For the next 25 years, current and future §YFledgling Roosts§! and §YFlourishing Roosts§! in the §YBahari Region§! will get §G-5%§! and §G-20§! Local Development Cost, respectively, for 25 years."

 F80_mission_divine_duties_fulfilled_title: "Divine Duties Fulfilled"
 F80_mission_divine_duties_fulfilled_desc: "Nansalen and [F33.GetName] fulfilling their duty, and uniting Bulwar. As a result, Harpies have finally been acknowledged as equal in essence to humans and elves."

 F80_mission_seeing_far_and_wide_title: "Seeing Far and Wide"
 F80_mission_seeing_far_and_wide_desc: "Building infrastructure to help our farseers, so that they can help the nation defend itself."

 F80_mission_what_the_hills_hold_title: "What the Hills Hold"
 F80_mission_what_the_hills_hold_desc: "Uniting the Harpy Hills and getting the most out them, by finding new seams of ore which might otherwise never have been discovered."
 F80_tt_what_the_hills_hold_effect: "Future casts of §YDeposit Divination§! will cause a random province producing §YWool§!, §YLivestock§!, §YGrain§!, or §YFish§! within the §YHarpy Hills Region§! to instead produce §YIron§! or §YCopper§!, if the level of §YMagical Infrastructure§! is at least one. Repeat this for every level of §YMagical Infrastructure§!."

 F80_mission_lifting_together_title: "Lifting Together"
 F80_mission_lifting_together_desc: "Vainvaria has greatly benefitted from the lifts created by Pyrite dwarves. Not only do they allow non-harpies to traverse the many-layered city easily, but they also simplify construction. Let us spread this to all of our roosts."
 F80_tt_lifting_together_current_and_future: "In all current and future §YFlourishing Roosts§!:"
 F80_tt_lifting_together_minority_and_cost: "Furthermore, dwarven minorities will be established, if not is not already present.\nHowever, creating §YFlourishing Roosts§! will now §Ycost§! §R250.00§! Crowns"
 F80_tt_lifting_together_doubled: "These modifiers will be doubled in §Y[619.GetName]§! and §Y[660.GetName]§!."

 F80_mission_auxillary_corps_title: "Auxillary Corps"
 F80_mission_auxillary_corps_desc: "[F33.GetName] has a long history of allying with other races to augment their military. We shall mimic them to incorporate dwarves into our military, to prepare for further wars to come."

 F80_mission_peering_past_the_pass_title: "Peering Past the Pass"
 F80_mission_peering_past_the_pass_desc: "Working to reestablish the trade route with the Lake Federation, so that we might once more fill our coffers from trade through the Invader's Pass."

 F80_mission_securing_the_path_title: "Securing the Path"
 F80_mission_securing_the_path_desc: "If we want to truly prosper from trade, it is imperative that we secure the lands between the Invader's Pass and Niimhahuder, to ensure that the final stretch of the route to the Lake Federation is safe for traders."

 F80_mission_wingborne_news_title: "Wingborne News"
 F80_mission_wingborne_news_desc: "Like knowledge can decide wars, it can also make or break trade ventures, as prices can change rapidly. We must establish resting stations towards the Lake Fed, so that news can travel at the speed of flight and we can profit."

 F80_mission_the_gate_of_bulwar_title: "The Gate of Bulwar"
 F80_mission_the_gate_of_bulwar_desc: "Ensuring that trade between Bulwar and the Forbiddan Plains thrives... and that we profit immensely off of it."
 F80_tt_gate_of_bulwar_current_and_future: "The following modifier will be applied to all current and future provinces owned by [F80.GetName], [F33.GetName], or their subjects in the §YBulwar Superregion§!, if they produce §YGold§!, §YSugar§!, §YSilk§!, §YSpices§!, or §YCoffee§!:"

 # Events

 flavor_nansalen.1.t: "Kings and Queens, Standing Tall"
 flavor_nansalen.1.d: "We've overthrown our lieges, yay."
 flavor_nansalen.1.a: "Huzzah!"
 F80_tt_akalses_twin_empire_and_akalses_pu: "§Y[F42.GetName]§! has joined a §YPersonal Union§! under §Y[F33.GetName]§!, while §Y[F33.GetName]§! becomes our §YTwin Empire§!."
 F80_tt_akalses_twin_empire: "§![F33.GetName]§! becomes our §YTwin Empire§!."
 F80_tt_irregular_demonsterization: "\nWe will start Demonsterization. However, rather than receiving events which reduce our Monsterization, we will be able to decrease it through mission rewards."

 flavor_nansalen.2.t: "Hunt Holdouts"
 flavor_nansalen.2.d: "Hunt faithful seeing that their coreligionists are converting to the New Sun Cult, and rise up to try to reverse this trend, led by the Ayarallen and Firanyalen matriarchs."
 flavor_nansalen.2.a: "They shall see the Light of Surael!"

 flavor_nansalen.3.t: "We Are Royals"
 flavor_nansalen.3.d: "(Re)coronation of ruler in Queen's Throne, with diplomatic advances meaning that most Bulwari states at least send a representative, if not a member of the royal family, with most agreeing that it would be quite natural for the Harpy Hills to be owned by, y'know, harpies, so long as they follow Surael's Light."
 flavor_nansalen.3.a: "Pretty sweet, huh?"
 F80_desc_until_end_of_age: " until the §Yend§! of the §YAge of Monsters§!."
 F80_tt_royals_reform_progress_gain: "If we would lose §YMonstrosity§!, instead gain an equivalent amount of §YReform Progress§!."

 flavor_nansalen.4.t: "The Coronation of Queen Aras"
 flavor_nansalen.4.d: "Akalses being proclaimed restored, with the ruler being (re)crowned in Arasbar, but with a far more impressive turnout than just a few decades ago.\n\nIncludes reaffirmation of bonds between Nansalen and Akalses, and an agreement to play to strenghts: Nansalen ruling the hills and highlands, while Akalses rules the flatlands."
 flavor_nansalen.4.a: "Long May We Reign"
 F80_tt_akalses_restored_claims: "[F33.GetName] gains permanent claims over the §YBulwar Proper§! region, as well as the areas of §YEduz-Vacyn§!, §YUpper Suran§!, and §YAzka Sur§!. Furthermore, [F80.GetName] gains permanent claims over the the §YSur Mountains§!."
 F80_tt_current_and_future_harpy_NSC: "The following will be applied to all current and future §Ynon-primary§! Harpy culture provinces upon conversion to §YBulwari Sun Cult§!:"

 flavor_nansalen.5.t: "Equal in Essence"
 flavor_nansalen.5.d: "Nansalen Harpies being acknowledged as equal in Essence to Bulwari Humans, capable of possessing not only Order but also Light, something that has only previously happened with the Sun Elves."
 flavor_nansalen.5.a: "Finally, our piety has been recognized!"
 F80_tt_harpies_now_chosen: "Harpy Nations can now be §HChosen§!."

 flavor_nansalen.6.t: "Dwarven Auxillaries"
 flavor_nansalen.6.d: "Flavor about Dwarven siege engineers joining the Nansalen forces, including a quite skilled Copper General."
 flavor_nansalen.6.a: "Their expertise will be put to good use."

 flavor_nansalen.7.t: "What Lies Beyond"
 flavor_nansalen.7.d: "Flavor about the Forbidden Plains being quite hostile, with landmarks being few and far between, but divination being quite useful for dealing with that."
 flavor_nansalen.7.a: "Let the skies and sights guide us."
 F80_tt_forbidden_plains_divination_discovery_and_trade: "Casting §YGuidance§!, §YEye for Talent§!, or §YScrying§! will reveal neighboring §Yprovinces§!, §Yareas§!, or §Yregions§! of known provinces in the §YForbidden Lands§! subcontinent, respectively. Furthermore, for 5 years, we will gain §Y25§!, §Y50§!, or §Y100§! trade power in Trade Nodes in the subcontinent where we have a Merchant, respectively."

