 # Misc
 F80_tt_every_roost_mage_tower: "\nIn every §YRoost§! with a §YMage Tower§!:"
 F80_tt_fp_divination_discovery_province: "Discover neighboring §Yprovinces§! of known provinces in the §YForbidden Lands§! subcontinent. Furthermore, gain §Y25§! trade power for §Y5§! years in Trade Nodes in the subcontinent where we have a Merchant."
 F80_tt_fp_divination_discovery_area:     "Discover neighboring §Yareas§! of known provinces in the §YForbidden Lands§! subcontinent. Furthermore, gain §Y50§! trade power for §Y5§! years in Trade Nodes in the subcontinent where we have a Merchant."
 F80_tt_fp_divination_discovery_region:   "Discover neighboring §Yregions§! of known provinces in the §YForbidden Lands§! subcontinent. Furthermore, gain §Y100§! trade power for §Y5§! years in Trade Nodes in the subcontinent where we have a Merchant."
 F80_tt_fp_divination_trade_bonus_25:   "\nGain §Y25§! trade power for §Y5§! years in §YForbidden Lands§! Trade Nodes where we have a Merchant."
 F80_tt_fp_divination_trade_bonus_50:   "\nGain §Y50§! trade power for §Y5§! years in §YForbidden Lands§! Trade Nodes where we have a Merchant."
 F80_tt_fp_divination_trade_bonus_100:  "\nGain §Y100§! trade power for §Y5§! years in §YForbidden Lands§! Trade Nodes where we have a Merchant."

 F80_KEY_DIVINED_TRADE_BONUS: "Divined Prices "

 estate_mages_F80_privilege_divined_defenses: "Divined Defenses"
 F80_tt_privilege_divined_defenses: "Casting a §YDivination§! spell will increase the defensiveness of §YRoosts§! where §YMage Towers§! are present. The duration of the spell will be equal to 1 year per 25 base mana cost of the spell."