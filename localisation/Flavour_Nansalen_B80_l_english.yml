 # Custom wargoal
 cb_F80_enthroning_aras: "Enthroning Araš"
 cb_F80_enthroning_aras_desc: "While Karodir I Varamzuir is a prodigious mage and a skilled scholar, as a ruler he has... shortcomings as a ruler. It would be better for all involved parties were he to marry Araš Araškaysit and let her handle the day-to-day administrations, establishing a Personal Union with Akalšes as the senior partner."
 F80_WAR_NAME_ENTHRONING_ARAS: "Enthroning Araš"
 F80_wargoal_enthroning_aras: "Take the capital"
 F80_wargoal_enthroning_aras_desc: "War goal is to take the capital."
 po_F80_enthroning_aras: "Enthrone Araš"
 po_F80_enthroning_aras_desc: "Have Araš and Karodir I Varamzuir marry, establishing a §YPersonal Union§! with Akalšes as the Senior Partner!"
 CB_ALLOWED_po_F80_enthroning_aras: "Enthrone Araš"
 PEACE_po_F80_enthroning_aras: "Enthrone Araš"

 # Subject type
 F80_F33_loyal_subject_title: "Other Half of a Whole"
 F80_F33_loyal_subject_desc: "For more than a millennium, the Araškaysit dynasty and the Nanšalen Matriarchs have been closely intertwined, frequently marrying and aiding another. Now that we have thrown off our shackles, it is time for us to rise ever further, with our Other Half being willing to follow our lead on how to achieve this."
 F80_F33_loyal_subject_is_our: "$NAME|Y$ is our Other Half of a Whole"
 F80_F33_loyal_subject_title_plural: "Other Halves"
 F80_F33_loyal_subject_long_desc: "For more than a millennium, the Araškaysit dynasty and the Nanšalen Matriarchs have been closely intertwined, frequently marrying and aiding another. Now that we have thrown off our shackles, it is time for us to rise ever further, with our Other Half being willing to follow our lead on how to achieve this."

