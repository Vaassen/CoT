  #Xhazobkult/Gnoll Privileges
  estate_mages_sacrifice_for_power:0 "Sacrifice For Power"
  estate_mages_sacrifice_for_power_desc:0 "Beyond the veiled rift lay beings that eternally hunger, beings that gladly give power to those whom ease their torment even but a little."
  estate_mages_demon_summoning:0 "Demon Summoning Rituals"
  estate_mages_demon_summoning_desc:0 "The art of demon-summoning is less magic and more chanting names of demons while engaging in various activities that might lure their attention. We can have our soldiers perform these en-masse in order to become demonhosts."
  estate_mages_demon_summoning_tt:0 "Enables a decision to summon a demonic regiment."
  xhazobkult_summon_title:0 "Perform Demon Summoning Ritual"
  xhazobkult_summon_desc:0 "Give the necessary sacrifice to summon an empowered, demonic regiment. Demon regiments improve at tech 6/12/18/24."
  estate_nomadic_cull_weak_gnolls:0 "Cull Weak Gnolls"
  estate_nomadic_cull_weak_gnolls_desc:0 "In lesser packs the weak are used as breeders, workers, or slaves, but we know that allowing such weakness to persist only weakens our kin. Cull these weak when they are young, so that only the strong remain."
  estate_nomadic_krah_rights:0 "Establish Krah Right To War"
  estate_nomadic_krah_rights_desc:0 "Before the great Xhaz came, it was common practice to let the Krah beg to their dead gods and cling to their backwards ways so long as they gave a tithe of soldiers to serve as fodder for our front lines."
  estate_nomadic_krah_rights_tt:0 "Every owned province that has an unaccepted non-gnollish culture will have it's manpower and sailor penalties negated."
  estate_nomadic_krah_rights_mod:0 "Local Krah Right to War"
  
  # Demon units
  demons_1_demonhosts:0 "Demonhosts"
  demons_1_demonhosts_desc:0 "Early rituals have attracted dretchs and other low ranking demons to inhabit the bodies of our sacrificed soldiers."
  demons_6_demonhosts:0 "Empowered Demonhosts"
  demons_6_demonhosts_desc:0 "Using reagents and sacred herbs, our newly empowered rituals have begun to call forth demons of increased power, such as Hala and Babau demons, who eagerly inhabit the bodies of our offered men in order to wreck havoc on the mortal world."
  demons_12_demonhosts:0 "Improved demonhosts"
  demons_12_demonhosts_desc:0 "Stronger demons have begun to answer the call, tales of bloodshed attracting them from the depths of the Abyss without any extra cajoling on our part."
  demons_18_demonic_aspirants:0 "Demonic Aspirants"
  demons_18_demonic_aspirants_desc:0 "Our summoning rituals have become that the soldiers and demons have begun to merge together, their unified essence an aspiring candidate to be chosen by the Xhazob to join the ranks of the Greater Demons."
  demons_24_xhazob_chosen:0 "Xhazob Chosen"
  demons_24_xhazob_chosen_desc:0 "The perfect blending of mortal and demon, these Chosen of the Xhazob exist equally in the Abyss and upon the material plane, sustained on violence and hatred, capable of rending apart steel and calling forth the fires of the Abyss to burn their foe alive."
 
