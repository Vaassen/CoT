l_english:

 #Missions
 G46_care_for_our_youngest_title: "Care For Our Youngest"
 G46_care_for_our_youngest_desc: "Degakheion needs to help strengthen eneion to further their own goals in the Devand."
 G46_end_the_experiment_title: "End the Experiment"
 G46_end_the_experiment_desc: "Amgremos has been able to sustain itself as an independent state, this cannot be allowed as it will give our own Nekhei ideas of independence."
 
 G46_teachings_of_a_child_title: "Teachings of a Child"
 G46_teachings_of_a_child_desc: "Eneion has learned a lot through their diplomatic corps and has amassed a large sum of knowledge. Seeing as we can learn from them, we should."
 G46_keeping_a_child_in_line_title: "Keeping a Child In Line"
 G46_keeping_a_child_in_line_desc: "Though Eneions expansion has been beneficial for them and us, we need to make clear to them that they are dependent on us and will not leave our bond."
 
 G46_betrayal_on_ever_front_title: "Betreyel on Every Front"
 G46_betrayal_on_ever_front_desc: "Our old ally Ormam has betreyed us in our most recent war for supremacy over Alecand and Oktíkheion has taken Kimabhen land that was meant to be ours, we must crush them both."
 G46_rock_and_a_hard_place_title: "Rock and a Hard Place"
 G46_rock_and_a_hard_place_desc: "The Mages to the north present a fierce defense against us, so too do the Forgelords of Kherka and the philosophers of Lokemeion. We must overcome their strengths in order to prove ourselves masters over Alecand."
 G46_secure_the_interiour_title: "Secure The Interior"
 G46_secure_the_interiour_desc: "Though our rival Kheion have been crushed, the tribes to the west, those free of the death winds, still present a threat that stands in our way of supremacy over Alecand."
 G46_construct_the_goliath_title: "Construct The Goliath"
 G46_construct_the_goliath_desc: "We have been triumphant over our foreign and interiour rivals, let us build a monument that will leave all in awe and will present a valuable place for military parades."
 G46_guardian_of_the_kheions_title: "Guardian of The Kheions"
 G46_guardian_of_the_kheions_desc: "Once again we have become Guardians/Wardens over the Kheionai, now we need to secure it with the proper defenses to make sure we keep the Kheionai forever."
 
 G46_the_strateodegis_academy_title: "Strateódegis Academy"
 G46_the_strateodegis_academy_desc: "We have always had a martial code and enforced it among all soliders and officers, though beyond martial superiourity, we also need sound strategy, thus we will construct an academy that will ensure we have officers and generals that know about the ever changing tide of warfare and strategy."

 G46_secure_the_state_title: "Secure The State"
 G46_secure_the_state_desc: "Though Oktíkheion has left us the rear end of Kimabhen land, we can still make use of it as it presents us with the valuable manpower we need for our conquests."
 G46_thirst_for_iron_title: "Thirst For Iron"
 G46_thirst_for_iron_desc: "Our war machine needs to be fed with iron for swords and spears. Luckily prospectors have found several iron veins on the slopes of the mountain."
 G46_philosophical_strengthening_title: "Philosophical Strengthening"
 G46_philosophical_strengthening_desc: "Our philosophy has always been a military one of our homeland, though perhaps we can strengthen our philosophers and educators by fully embracing any of the military philosophies that exist in the Kheionai."
 G46_institute_the_daografi_title: "Institute The Daografí"
 G46_institute_the_daografi_desc: "There has long been a need for manpower and especially well trained manpower in Degakheion, thusly we will institute a new way to count our people and setting up military camps to conduct surveys of populations and training them."
 
 G46_the_drivos_kryphane_title: "The Drivos Kryphane"
 G46_the_drivos_kryphane_desc: "The Drivos Kryphane, or lower house, of Degakheion needs to be empowered and strengthen in order to ensure equal rights for our citizens."
 G46_allow_the_flow_of_ideas_title: "Allow The Flow of Ideas"
 G46_allow_the_flow_of_ideas_desc: "The phylaxana have long been not accepting of ideas of their fellow Kheionai elves, we shall remedy this issue by establishing in our constitution the right for every Kheionai to be able to express and spread their own ideas."
 G46_reform_the_military_title: "Reform The Military"
 G46_reform_the_military_desc: "The military of Degakheion has long been under the whims of the Phylaxana and their masculine dogmas. We are not animals going out on a hunt, but civilized and advanced beings who know and understand the modern kinds of warfare, thus we shall change our military education accordingly."
 
 G46_prisoners_once_more_title: "Prisoners Once More"
 G46_prisoners_once_more_desc: "The thought of independence is a vile one and can only be accepted among the highest ranking phylaxana of Degakheion. We need to eradicate any independent sentiment and put the people under our boot or behind bars if necesary."
 G46_ethonaltian_code_title: "Ethonaltian Code"
 G46_ethonaltian_code_desc: "The Ethonaltian Code is a several page long legal code which punishes even the most minor crimes, such as stealing an apple from a market fare. Any crime shall be met with death and any rebellion met with torture before death."
 G46_codify_martial_supremacy_title: "Codify Martial Supremacy"
 G46_codify_martial_supremacy_desc: "The supremacy of the bodies of our Phylaxana has long been evident and we shall grant this knowledge and education upon all of our soldiers. By whip and stick."
 
 #Events
 flavour_degakheion.1.t: "Betreyal on every Front"
 flavour_degakheion.1.d: "We need to kill our neighbours who wronged us."
 flavour_degakheion.2.t: "Pirates Captured"
 flavour_degakheion.2.d: "The Pirates of Amgremós are a pest and we are glad to have finally been able to capture them."
 flavour_degakheion.2.a: "Recruit the pirates"
 flavour_degakheion.2.b: "Kill the pirates"

 flavour_degakheion.3.t: "An Eye For An Eye"
 flavour_degakheion.3.d: "The forge lords, philosophers and mages have been a pest upon Alecand and we can only deal with these rebels in the most horrific ways imaginable."
 flavour_degakheion.3.a: "Kill the bastards!"

 flavour_degakheion.4.t: "Returned Guardianship"
 flavour_degakheion.4.d: "Degakheion was the home of all Guardians over the Kheionai. We guarded the cities and protected them, for the good of the people living in them. The day has finally returned where we have been able to claim the whole Kheionai as our own once again."
 flavour_degakheion.4.a: "At long last, we are returned"

 flavour_degakheion.5.t: "Goliath Constructed"
 flavour_degakheion.5.d: "The great towering monument soars above the skies to present our glorious conquest over our enemies on the outside and inside."
 flavour_degakheion.5.a: "What a beautiful lighthouse"

 flavour_degakheion.6.t: "The Finishing Touches"
 flavour_degakheion.6.d: "The reforms have been arduous and the compromises draining. Though we have come a long way to make the kheionai a bettwe place by finishing these reforms."
 flavour_degakheion.6.a: "Finally..."

 flavour_degakheion.7.t: "Days of Torment"
 flavour_degakheion.7.d: "The guards of the Kheionai have been storming into every home of suspected rebels and slaughtered every single one of them. Families are gone, the streets are running with blood and the farms have been running out of peasants. This gruesome display shall serve to let the people know who is in charge."
 flavour_degakheion.7.a: "At long last we are supreme."

 #Karkares Upheaval Event Chain
 flavour_degakheion.9.t: "Karkares Upheavel!"
 flavour_degakheion.9.d: "The Karkares are revolting! We must decide if we will have the Phylaxana side with them or enforce their own dogmatic rule."
 flavour_degakheion.9.a: "Karkares"
 flavour_degakheion.9.b: "Phylaxana"

 flavour_degakheion.10.t: "Winds of Change"
 flavour_degakheion.10.d: "The Phylaxana have sided with the Karkares and are rapidly enacting reforms to placate them and allow them into the upper house."
 flavour_degakheion.10.a: "Hooray!"

 flavour_degakheion.11.t: "The Finishing Touches"
 flavour_degakheion.11.d: "The reforms are nearly finished, we only need to touch on some loopholes in the law and cement the previously reformed laws."
 flavour_degakheion.11.a: "Double Hooray!"

 flavour_degakheion.12.t: "The Greatest Riot"
 flavour_degakheion.12.d: "Not only are the Karkaress revolting, they are also rioting. This is the greatest riot we have ever seen in our country and it needs to be squashed as soon as possible."
 flavour_degakheion.12.a: "Kill the traitors!"

 flavour_degakheion.13.t: "The People, Subdued"
 flavour_degakheion.13.d: "Once more we have made the people subject to the rule of the Phylaxana."
 flavour_degakheion.13.a: "Prisoners once more"
 
