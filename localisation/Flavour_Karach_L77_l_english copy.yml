 ######Tooltips
 karach_farmers_plea_reward_tt:0 "The Zytagaxta Estate Privilege "Nobles in the Officer Corps" will now also increase +5% Morale of Armies\n\nThe Zytagaxta Estate Privilege Livestock Monopolies will now also target Grain Provinces and will increase the Local Trade Power of the affected monopolies by +20%. The Income you gain from the monopoly will also be increased to give 100% of the Goods Income rather than 80%."

 karach_buff_traderights_fortification_tt:0 "The Zytagaxta Estate Privilege "Expand the Fortifcation" will now give 20% Defensiveness rather than 10%\n\nThe Enkaxta Estate Privilege "Exclusive Trade Rights" Will now also give +10% Trade Steering"


 karach_axta_speaker_tt:0 "We will unlock the Axta Speaker, Which will rotate between the Unlocked Axtas every 6 years, and will give bonuses depending on our chosen Axta Candidate."

 karach_axta_speaker_Enkaxta_tt:0 "The Enkaxta will now be availiable as one of the Unlocked Axtas for the Axta Speaker Position, with the 2 following Candidates: Trader's Enkaxta and Artisan's Enkaxta."

 karach_dgp_monopoly_tt:0 "The Enkaxta Estate Privilege Monopolies on Dyes,Paper and Glass will now increase the Local Trade Power of the affected monopolies by +20%. The Income you gain from the monopoly will also be increased to give 100% of the Goods Income rather than 80%."


 karach_chieftains_exile_trigger_tt:0 "Have Dealt with the Bloodcurse"

 karach_axta_speaker_together_tt:0 "For every Axta Speaker Candidate we have unlocked the Regency Council's Stats will be increased by 1."

 karach_smelting_monopoly_tt:0 "The Zytagaxta Estate Privilege "Monopoly on Mining and Smelting" will now also give +20% Local Trade Power in the affected provinces. The Income you gain from the monopoly will also be increased to give 100% of the Goods Income rather than 80%."

 karach_embroidery_reward_tt:0 "The Enkaxta Estate Privilege "Monopoly on Textiles" will now also give +50% Local Trade Power in the affected provinces. The Income you gain from the monopoly will also be increased to give 100% of the Goods Income rather than 80%."\n\n All Monopoly Privileges of the Enkaxta will be upgraded so that they now give +50% Local Trade Power in the affected provinces instead of 20%"

 karach_canvas_claws_strength_trigger_tt:0 "Either Claw or Canvas has at least 5 strength, the amount of strength and how to gain strength can be checked by hovering over the Ashhana Government Bar"

 karach_workshop_event_unlock_tt:0 "Unlocks the Workshop Event, Whenever we expand a certain good producing provinces for the first time we will gain a Workshop Event, which will give us a temporary modifier."

 karach_workshop_event_unlock_no_dlc_tt:0 "Unlocks the Workshop Event, Whenever we develop certain good producing province that has at least 15 development for the first time we will gain a Workshop Event, which will give us a temporary modifier.
 #Vague on Purpose to avoid spoiling the Disaster
 karach_Expand_Infrastructure_Canvas_tt:0 "Whenever we Expand a province's Infrastructure for the first time we will gain 2 Canvas Strength, also the province will become more resistant to the Bloodcurse"
 karach_Expand_Infrastructure_Canvas_no_dlc_tt:0 "Whenever we develop a province with more than 15 development for the first time we will gain 2 Canvas Strength, also the province will become more resistant to the Bloodcurse"

