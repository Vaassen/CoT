 mykx.41.d:0 "Gnolls demand or raid"
 mykx.41.a:0 "Im scared"
 mykx.41.b:0 "Nah cringe"
 mykx.42.t:0 "More Than What We Left Behind"
 mykx.42.d:0 "We are better new, new cool school"
