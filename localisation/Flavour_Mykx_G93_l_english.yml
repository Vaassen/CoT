 mykx.43.b:0 "Honesty is the greatest virtue."
 mykx.43.c:0 "BLOOD BLOOD BLOOD BLOOOOOD!!!"
 mykx.43.e:0 "Hell rides along with us!"
 mykx.43.f:0 "Our current title is fine."
