l_english:

# Missions
R54_mystic_ministers_title: "Mystic Ministers"
R54_mystic_ministers_desc: "Alongside Acay's secret heirs comes Hemantsen's consort Rani Jira, who has a particular interest in new and fantastic ideas. She utilizes her connection to the Starry Eye to begin introducing mages to the ministries"


R54_from_the_depths_title: "From The Depths"
R54_from_the_depths_desc: "The raj has fallen far since its peak. We have come to its rescue many times before. Let's cash in on that good will and try and pull the raj together under our rule."
R54_from_the_depths_tt1: "One of the following must be true:\n  §yThe Raja§! has an §yImproved Relations§! modifier of +50 from you.\n  §yThe Raja§! has 150 opinion of you."
R54_from_the_depths_tt2: "This modifier will be removed if you fall below §y25% Crownland§!."

R54_staple_diplomacy_title: "Staple Diplomacy"
R54_staple_diplomacy_desc: "Treat the allied senaptia like business partners, using them to filter a growing supply of food to your loyalists, gathering momentum"
R54_staple_diplomacy_tt1: "Have the §yEstablish Communities§! Trade Policy active in at least 2 Raj trade nodes."
R54_staple_diplomacy_tt2: "Every ally gains §y2 years of Manpower§! and §y1 Stability§!.\nEvery allied senapti owes you §y+20 Favors§! and gains §y+10 Trust§! with you.\n\nAll §yRaj§! nations gain a quickly decaying +50 opinion of you."

R54_the_new_wave_title: "The New Wave"
R54_the_new_wave_desc: "Utilize your majority affinity with the senapti and your significant control over the food of central rahen to bolster your side, persuading fickle defectors."
R54_the_new_wave_tt1: "Each Rival and Non-Allied Senapti are Embargoed by us."
R54_the_new_wave_tt2: "Each Rival has an advisor §ydefect to us§! for §v50%§! cheaper and gets '§yCourt Defectors§!' for §y10 years§!, reducing their Global Spy Defence by §R-30%§!."


R54_reveal_your_hand_title: "Reveal Your Hand"
R54_reveal_your_hand_desc: "Reveal the secret heirs of a previous raja and instantly become a serious threat to the standing administration"

R54_the_frontrunner_title: "The Frontrunner"
R54_the_frontrunner_desc: "Establish a lobby The Halls Of Endless Debate to help you justify consolidation within the raj. You think better, you fight better, you rule better. You should own this stuff. Lets start with the grain and the gardens"

R54_borrowing_blades_title: "Borrowing Blades"
R54_borrowing_blades_desc: "Petition the Raja to help reinstate control over the area, using deceptive or diplomatic methods to sweeten the deal"

R54_the_first_step_title: "The First Step"
R54_the_first_step_desc: "Climb the first rung on the ladder and firmly establish your presence in the raj. Expand the lobby in the HOED to justify pushing into the comfort zone of the raja"

R54_mutual_beneficiaries_title: "Mutual Beneficiaries"
R54_mutual_beneficiaries_desc: "Convince the Raja, struggling under your momentum and losing favor with their subjects, to assist in improving the gardens and increase their standing"
R54_mutual_beneficiaries_tt1: "§y1000 crowns§! (every §y10 favors§! you have with the §yRaja§! will have the §yRaja§! pay 100 of this cost for you, up to §y50 favors§!)."

R54_the_breaking_point_title: "The Breaking Point"
R54_the_breaking_point_desc: "The raja joins against you during your war to claim the vizierate, allowing for an opportunity to take them both out"

R54_the_iron_heart_title: "The Iron Heart"
R54_the_iron_heart_desc: "A majority of the corruption from the ministries has been pulled out by the roots, now it is time to make some changes."
R54_the_iron_heart_tt1: "§yRule Of The Iron Raja§! will remain active while you have Hemantsen I's dynasty.\n"

R54_a_daughters_benefactor_title: "A Daughter's Benefactor"
R54_a_daughters_benefactor_desc: "Honor Harimar by maintaining the garden of his daughters"

R54_the_unsworn_title: "The Unsworn"
R54_the_unsworn_desc: "Utilize your momentum to persuade defectors from the raja to join your cause, sending a couple \"instigators\" to push them along"
R54_the_unsworn_tt1: "A §ySpymaster§! of lv2 is currently employed."
R54_the_unsworn_tt2: "A military advisor of lv2 is currently employed."

R54_divisions_of_the_iron_stripe_title: "Divisions Of The Iron Stripe"
R54_divisions_of_the_iron_stripe_desc: "Implement techniques from the Iron Stripe into standard military drills"

R54_the_consorts_cause_title: "The Consort's Cause"
R54_the_consorts_cause_desc: "Rani Jira utilizes the newfound mage influence among the ministries to push for the establishment of magical infrastructure for all nations within the raj"
R54_the_consorts_cause_tt1: "All Raj subjects get:\n  §v+100§! Mana\n  A §v50%§! cheaper §yCourt Mage§! Advisor\n  A §ySpecial Infrastructure Requirement§! for Magical Infrastructure lv1"

R54_we_require_more_minerals_title: "We Require More Minerals"
R54_we_require_more_minerals_desc: "Hemantsen and Jira team up to utilize magic to instate the Farrum Arcanum, a nationalized forging industry using magic to assist in forging large amounts of iron and steel"

R54_the_iron_mind_title: "The Iron Mind"
R54_the_iron_mind_desc: "Rani Jira's final goal was to create a centralized seat of mage power within the Raj where all can practice."

R54_plight_of_the_barons_title: "Plight Of The Barons"
R54_plight_of_the_barons_desc: "Hemantsen's work is not done. His public announcement of his intentions lead to worry among many. He must make sure to pursue this tactfully, lest the populace get too upset."
R54_plight_of_the_barons_tt1: "Hemantsen has announced his intentions."

R54_green_giants_title: "The Green Giants"
R54_green_giants_desc: "Our valuable fields are being wasted on cotton. To regain centralized control of the Raj we must feed our subjects."

R54_the_iron_spirit_title: "The Iron Spirit"
R54_the_iron_spirit_desc: "As all the barons stir with disapproval, it boils to revolt. Put them down and build a new empire atop what's remains of their 'rebellion'."
R54_the_iron_spirit_tt1: "The consequences of the decrees have passed and the Barons have been dealt with."
R54_the_iron_spirit_tt2: "Up to 10 provinces with manufactories gain 2 production development."

R54_iron_footfalls_golden_paths_title: "Iron Footfalls, Golden Paths"
R54_iron_footfalls_golden_paths_desc: "The bounds of our empire strain our newfound momentum. We must expand outwards to continue to extend our influence among Rahen. Our newfound Golden Highway allows us to move our armies south with terrifying efficiency."
R54_iron_footfalls_golden_paths_tt1: "The Rahen Coast Golden Highway has been finished."
R54_iron_footfalls_golden_paths_tt2: "§yRegroup§! is active."
R54_iron_footfalls_golden_paths_tt3: "If you completed this with §ySpy Network§!, gain permanent claims on the Avhavubhiya, Sarkhashabid, and Ascension Cape areas.\n\nIf you completed this by subjugation, the §ylargest subject§! with their capital in these areas will §ycede their provinces in Rahen§! to you, cease to be your subject, and grant you §r-1§! Diplomatic Reputation for §y10 years§!."

R54_burning_the_black_flags_title: "Burning The Black Flags"
R54_burning_the_black_flags_desc: "Moving our trade towards the Rahen Coast has been very lucrative. However, our influence in the market is under significant threat by the rampant piracy. We must push them out and claim the riches of the gulf"

R54_the_pride_of_the_gulf_title: "The Pride Of The Gulf"
R54_the_pride_of_the_gulf_desc: "We have conquered the coast and secured our influence. Fueled by the riches of trade, this will serve as the anchor of our empire."
R54_the_pride_of_the_gulf_tt1: "Every owned Center of Trade in the §yGulf of Rahen§! Region gets '§yHeart of the Empire§!' until the end of the game, giving the following effects:\nLocal Trade Power Modifier: §v+25.0%§!\nLocal Goods Produced Modifier: §v+10.0%§!"

R54_worthiness_title: "Worthiness"
R54_worthiness_desc: "Is it peak or is it bleak?"
R54_worthiness_tt1: "Have we finally proven ourselves?"

R54_meeting_the_oracle_title: "Meeting The Oracle"
R54_meeting_the_oracle_desc: "Investigate the missive. The High Augur tells us about The 3 Omens"
R54_meeting_the_oracle_tt1: "Has opinion modifier §ySent Gift§! of 25."

R54_the_iron_raj_rises_title: "The Iron Raj Rises"
R54_the_iron_raj_rises_desc: ""

R54_the_schism_title: "The Schism"
R54_the_schism_desc: "Suhan's movement has split the philosophy in two and tensions are at their maximum. It's time to force some reason into this conflict and find an amicable solution"
R54_the_schism_tt1: "Reformation tensions are too high to ignore."
R54_the_schism_tt2: "At least 2 Reformation Centers are in the Raj."
R54_the_schism_tt3: "Lowers Reformation Tensions."

R54_placate_the_praxic_title: "Placate The Praxic"
R54_placate_the_praxic_desc: "The Praxic are not evil. Misguided maybe, but still rightful denizens of the Raj. They must be given proper respect and safe places to practice"
R54_placate_the_praxic_tt1: "All provinces that have/had Suhan's Praxis Reformation Centers in Rahen are owned by you."
R54_placate_the_praxic_tt2: "The Praxic stop revolting."
R54_placate_the_praxic_tt3: "All §yReformation Centers§! in §yRahen§! will disappear. All owned provinces that have/had §ySuhan's Praxis Reformation Centers§! in §yRahen§! convert to Suhan's Praxis and get '§yPraxis Havens§!' until the end of the game, giving the following effects:\nLocal Unrest: §v-3§!\nMonthly Splendor: §v+1§!\nLocal Missionary Strength: §r-100%§!\nLocal Religious Unity Contribution: §v-100%§!"

R54_release_the_reactionaries_title: "Release The Reactionaries"
R54_release_the_reactionaries_desc: "The rise of the Praxis has sparked a significant amount of malice in the most zealous groups of our true faith. Hostility towards the crown will not be tolerated, as a diverse group of opinions is a core tenet of debate."
R54_release_the_reactionaries_tt1: "You have invited at least 3 §ydifferent§! scholars."
R54_release_the_reactionaries_tt2: "The High Philosophers stop revolting."

R54_the_iron_soul_title: "The Iron Soul"
R54_the_iron_soul_desc: "With the majority of the tensions dispersed, the rights of the praxic and the reign of the high philosophers stand resolute."
R54_the_iron_soul_tt1: "Reformation Tensions have gone."

R54_white_spears_of_rahen_title: "White Spears Of Rahen"
R54_white_spears_of_rahen_desc: "Sacred to our culture, the temples will become a centerpiece of our military. We will construct military outposts around them to keep them maintained and protected."
R54_white_spears_of_rahen_tt1: "Gain a unique province button, granting the ability to §yBuild Temple Outposts§! on repaired §yHigh Temple Complexes§! in §yRahen§!."

R54_reasoned_warfare_title: "Reasoned Warfare"
R54_reasoned_warfare_desc: "The concept of combat may be steeped in tradition, but we cannot afford to stagnate. Debate is holy, and the topic of warfare is too important to be excluded."
R54_reasoned_warfare_tt1: "Upgrade your Tactical Maneuvers."

R54_the_map_to_hope_title: "The Map To Hope"
R54_the_map_to_hope_desc: "The auspicious lotus calls. Begin the search in the cities along the fault line."

R54_throne_war_and_sisters_title: "Sisters, Wars, And The Lost"
R54_throne_war_and_sisters_desc: "The First Omen tells the the tale of the Harimraj splitting in two along the fault line of the empire. This auspicious lotus may yet await us."
R54_throne_war_and_sisters_tt1: "§yOverwhelm§! is active."
R54_throne_war_and_sisters_tt2: "Gain a unique '§yThe Iron March§!' casus belli against all nations with provinces in §yRahen§!."

R54_gods_pillars_and_end_title: "Gods, Pillars, And The End"
R54_gods_pillars_and_end_desc: "The Third Omen tells the tale of the apocalypse. From what, we do not know. All we know is that the gods are gone. We don't know how much time we have. We must act as fast as possible."
R54_gods_pillars_and_end_tt1: "§yOutlast§! is active."
R54_gods_pillars_and_end_tt2: "Enable the Godswall Tunnel monument."

R54_an_army_worthy_of_harimar_title: "A Force For His Will"
R54_an_army_worthy_of_harimar_desc: "The hobgoblins have a core society value based on familial bonds, not unlike the Orange Sash. Perhaps we can learn from them and make our resplendent legions show no fear, no end, and no quarter."
R54_an_army_worthy_of_harimar_tt1: "Boar, Wolf, or Lion Hobgoblin is an accepted culture."
R54_an_army_worthy_of_harimar_tt2: "§y1000 Military Power§!, reduced by 100 for every §y10% Army Professionalism§! you have."
R54_an_army_worthy_of_harimar_tt3: "Have the largest army in Haless."
R54_an_army_worthy_of_harimar_tt4: "All other nations in Haless lose §r-50§! §yPower Projection§!.\n"
R54_an_army_worthy_of_harimar_tt5: "Upgrade your Tactical Maneuvers.\n"
R54_an_army_worthy_of_harimar_tt6: "Upgrade your province button, allowing you to upgrade temple outposts to §yNitikamarja Drillgrounds§!."

R54_demonstration_of_destiny_title: "Demonstration Of Destiny"
R54_demonstration_of_destiny_desc: "Remind them what might truly looks like"
R54_demonstration_of_destiny_tt1: "All countries with over 300 development in the §yYanshen§!, §yVimdatrong§!, and §yGozengun§! subcontinents have been §yinsulted by you§!.
R54_demonstration_of_destiny_tt2: "The Blood Lotus is dead."
R54_demonstration_of_destiny_tt3: "Your ruler becomes a §y100 Army Tradition general with +1 to all stats§!. If they are already a general, they instead become a §yLegendary Conqueror§!.\n"
R54_demonstration_of_destiny_tt4: "Declare §yThe Great War§! against all nations in Haless. If a nation §yloses control of their capital§! and reaches §y-40% warscore§!, they will be expelled from the war, defeated."

R54_the_third_harimraj_title: "The Third Harimraj"
R54_the_third_harimraj_desc: "You did it, hope you feel cool :)"
R54_the_third_harimraj_tt1: "You have won The Great War."
R54_the_third_harimraj_tt2: "§yParusahan Saya§! will gain §v10.00§! Power Projection (permanent).\n"

R54_bow_mage_and_fall_title: "Fates, Mages, And The Fall"
R54_bow_mage_and_fall_desc: "The Second Omen tells the tale of Jagaddipendra and the fall of the first Harimraj. We should utilize our affinity with the mages to attempt to assimilate the oracles."
R54_bow_mage_and_fall_tt1: "Court Mage of lv3 is currently employed."

R54_philosophical_studies_title: "Philosophical Studies"
R54_philosophical_studies_desc: "With the advent of new technologies and unified communications, High Philosophy is no longer constricted to practice and debate, but can now be applied to scientific study"
R54_philosophical_studies_tt1: "For the rest of the game, constructing a §yUniversity§! in a province upgrades an existing §ySchool§! to an §yAcademy§! for free.\n"

R54_frontiers_to_frontlines_title: "Frontiers To Frontlines"
R54_frontiers_to_frontlines_desc: "The buffer armies that protected the Raj begin to lose their purpose as the interior gains strength. It's time for them to join the ranks properly."
R54_frontiers_to_frontlines_tt1: "Inherit all provinces in §yRahen§! that your §ySenapti§! own at the cost of §y4 Diplomatic Power§! per development, demoting them to §yPrabhi§! if they still exist.\n"
R54_frontiers_to_frontlines_tt2: "The position of §ySenapti§! is removed from the Raj.\n"

R54_the_last_remnant_title: "The Last Remnant"
R54_the_last_remnant_desc: "The last remnant of the old Raj remains. For this administration to truly be reborn, something must be done. This will not be easy, the Vizier has many allies in court and ties to many central aspects of government. Move carefully and make them a generous offer."
R54_the_last_remnant_tt1: "Has opinion modifier §ySent Gift§! of 25."

R54_a_court_worthy_of_harimar_title: "A Court For His Wisdom"
R54_a_court_worthy_of_harimar_desc: "The court is whole. Many minds speak with a single voice. Our influence is undisputed, and our grandness is absolute."
R54_a_court_worthy_of_harimar_tt1: "The Vizierate has been reformed.\n"
R54_a_court_worthy_of_harimar_tt2: "Have the highest Diplomatic Reputation in Haless."
R54_a_court_worthy_of_harimar_tt3: "All other nations in Haless lose §r-100§! §yPrestige§!.\n"
R54_a_court_worthy_of_harimar_tt4: "All of your subjects gain §v+999§! Opinion of you.\n"
R54_a_court_worthy_of_harimar_tt5: "\nYour ruler and heir get §v+1§!/§v+1§!/§v+1§!, granting §y50 Monarch Power§! of relevant stats that overflow."

R54_a_throne_worthy_of_harimar_title: "A Throne For His Rule"
R54_a_throne_worthy_of_harimar_desc: "The Final Throne is finally found and it shall be the crown jewel of our empire. A shining gemstone to adorn the diadem of the new Harimraj."
R54_a_throne_worthy_of_harimar_tt1: "The Dhujat Golden Highway has been finished."
R54_a_throne_worthy_of_harimar_tt2: "Have the highest Development in Haless."
R54_a_throne_worthy_of_harimar_tt3: "All other nations in Haless lose §r-50§! §yLegitimacy§!.\n"
R54_a_throne_worthy_of_harimar_tt4: "Repurpose Sarisung, causing it to lose §yall production development but 1§!, gaining §y50 Crowns§! per development lost.\n"

