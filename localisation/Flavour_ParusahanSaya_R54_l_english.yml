# Estate Privs
estate_raj_ministries_the_iron_heart: "The Iron Heart"
estate_raj_ministries_the_iron_heart_desc: "§yAdvisors§! also provide additional bonuses based on their level:\n  §yAdministrative§!: Income From Vassals §v+5%§! per level\n  §yDiplomatic§!: Improve Relations §v+5%§! per level\n  §yMilitary§!: Stability Cost Modifier §v-5%§! per level\n\nDisables §yCeremonial Ruler Act§! Ministries privilege.\nDisables §yDelegate Territorial Management§! Ministries privilege."

estate_raj_ministries_the_iron_mind: "The Iron Mind"
estate_raj_ministries_the_iron_mind_desc: "§yMage Towers§! also provide additional modifiers:\n  Local Cosntruction Cost §v-15%§!\n  §MMana Regen§! §v+1%§! (Up to §v+20%§!)\n\nDisables §yMinisterial Tithes§! Ministries privilege.\nDisables §yModernize Ministerial Curriculum§! Ministries privilege."

estate_raj_ministries_the_iron_spirit: "The Iron Spirit"
estate_raj_ministries_the_iron_spirit_desc: "Owned §yGolden Highways§! also provide:\n  Local Development Cost §v-5%§!\n  Local Production Efficiency §v+20%§!\n\nDisables §yRoyal Intrigue Keepers§! Ministries privilege.\nDisables §yEstablish Ministry of War§! Ministries privilege.\nDisables §yAllow Personal Fortunes§! Ministries privilege."

estate_raj_ministries_the_iron_soul: "The Iron Soul"
estate_raj_ministries_the_iron_soul_desc: "Building a §ySchool§! grants §v+25§! Prosperity. Building an §yAcademy§! grants §v+2§! Tax Development in prosperous provinces. Each effect can only apply once per province.\n\nDisables §yClerical Ministers§! Ministries privilege.\nDisables §yExtend Education Grants§! Ministries privilege."
estate_raj_ministries_the_iron_soul_desc_2: "Building a §ySchool§! grants §v+25§! Prosperity. Building an §yAcademy§! grants §v+2§! Tax Development in prosperous provinces. Each effect can only apply once per province.\n\n§vUpon being granted, these effects will apply retroactively to owned provinces!§!\n\nDisables §yClerical Ministers§! Ministries privilege.\nDisables §yExtend Education Grants§! Ministries privilege."

