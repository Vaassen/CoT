l_english:
 
 # Missions
 R54_mystic_ministers_title:0 "Mystic Ministers"
 R54_mystic_ministers_desc:0 "Alongside Acay's secret heirs comes Hemantsen's consort Rani Jira, who has a particular interest in new and fantastic ideas. She utilizes her connection to the Starry Eye to begin introducing mages to the ministries"

 R54_from_the_depths_title:0 "From The Depths"
 R54_from_the_depths_desc:0 "The raj has fallen far since its peak. We have come to its rescue many times before. Let's cash in on that good will and try and pull the raj together under our rule."

 R54_staple_diplomacy_title:0 "Staple Diplomacy"
 R54_staple_diplomacy_desc:0 "Treat the allied senaptia like business partners, using them to filter a growing supply of food to your loyalists, gathering momentum"

 R54_the_new_wave_title:0 "The New Wave"
 R54_the_new_wave_desc:0 "Utilize your majority affinity with the senapti and your significant control over the food of central rahen to bolster your side, persuading fickle defectors."

 R54_reveal_your_hand_title:0 "Reveal Your Hand"
 R54_reveal_your_hand_desc:0 "Reveal the secret heirs of a previous raja and instantly become a serious threat to the standing administration"

 R54_the_frontrunner_title:0 "The Frontrunner"
 R54_the_frontrunner_desc:0 "Establish a lobby The Halls Of Endless Debate to help you justify consolidation within the raj. You think better, you fight better, you rule better. You should own this stuff. Lets start with the grain and the gardens"

 R54_borrowing_blades_title:0 "Borrowing Blades"
 R54_borrowing_blades_desc:0 "Petition the Raja to help reinstate control over the area, using deceptive or diplomatic methods to sweeten the deal"

 R54_the_first_step_title:0 "The First Step"
 R54_the_first_step_desc:0 "Climb the first rung on the ladder and firmly establish your presence in the raj. Expand the lobby in the HOED to justify pushing into the comfort zone of the raja"

 R54_mutual_beneficiaries_title:0 "Mutual Beneficiaries"
 R54_mutual_beneficiaries_desc:0 "Convince the Raja, struggling under your momentum and losing favor with their subjects, to assist in improving the gardens and increase their standing"

 R54_the_breaking_point_title:0 "The Breaking Point"
 R54_the_breaking_point_desc:0 "The raja joins against you during your war to claim the vizierate, allowing for an opportunity to take them both out"

 R54_the_iron_heart_title:0 "The Iron Heart"
 R54_the_iron_heart_desc:0 "A majority of the corruption from the ministries has been pulled out by the roots, now it is time to make some changes."

 R54_a_daughters_benefactor_title:0 "A Daughter's Benefactor"
 R54_a_daughters_benefactor_desc:0 "Honor Harimar by maintaining the garden of his daughters"

 R54_the_unsworn_title:0 "The Unsworn"
 R54_the_unsworn_desc:0 "Utilize your momentum to persuade defectors from the raja to join your cause, sending a couple "instigators" to push them along"

 R54_divisions_of_the_iron_stripe_title:0 "Divisions Of The Iron Stripe"
 R54_divisions_of_the_iron_stripe_desc:0 "Implement techniques from the Iron Stripe into standard military drills"

 R54_the_consorts_cause_title:0 "The Consort's Cause"
 R54_the_consorts_cause_desc:0 "Rani Jira utilizes the newfound mage influence among the ministries to push for the establishment of magical infrastructure for all nations within the raj"

 R54_we_require_more_minerals_title:0 "We Require More Minerals"
 R54_we_require_more_minerals_desc:0 "Hemantsen and Jira team up to utilize magic to instate the Farrum Arcanum, a nationalized forging industry using magic to assist in forging large amounts of iron and steel"

 R54_the_iron_mind_title:0 "The Iron Mind"
 R54_the_iron_mind_desc:0 "Rani Jira's final goal was to create a centralized seat of mage power within the Raj where all can practice."

 R54_plight_of_the_barons_title:0 "Plight Of The Barons"
 R54_plight_of_the_barons_desc:0 "Hemantsen's work is not done. His public announcement of his intentions lead to worry among many. He must make sure to pursue this tactfully, lest the populace get too upset."

 R54_green_giants_title:0 "The Green Giants"
 R54_green_giants_desc:0 "Our valuable fields are being wasted on cotton. To regain centralized control of the Raj we must feed our subjects."

 R54_the_iron_spirit_title:0 "The Iron Spirit"
 R54_the_iron_spirit_desc:0 "As all the barons stir with disapproval, it boils to revolt. Put them down and build a new empire atop what's remains of their 'rebellion'. "

 R54_iron_footfalls_golden_paths_title:0 "Iron Footfalls, Golden Paths"
 R54_iron_footfalls_golden_paths_desc:0 "The bounds of our empire strain our newfound momentum. We must expand outwards to continue to extend our influence among Rahen. Our newfound Golden Highway allows us to move our armies south with terrifying efficiency."

 R54_burning_the_black_flags_title:0 "Burning The Black Flags"
 R54_burning_the_black_flags_desc:0 "Moving our trade towards the Rahen Coast has been very lucrative. However, our influence in the market is under significant threat by the rampant piracy. We must push them out and claim the riches of the gulf"

 R54_the_pride_of_the_gulf_title:0 "The Pride Of The Gulf"
 R54_the_pride_of_the_gulf_desc:0 "We have conquered the coast and secured our influence. Fueled by the riches of trade, this will serve as the anchor of our empire."

 R54_worthiness_title:0 "Worthiness"
 R54_worthiness_desc:0 "Is it peak or is it bleak?"

 R54_meeting_the_oracle_title:0 "Meeting The Oracle"
 R54_meeting_the_oracle_desc:0 "Investigate the missive. The High Augur tells us about The 3 Omens"

 R54_the_iron_raj_rises_title:0 "The Iron Raj Rises"
 R54_the_iron_raj_rises_desc:0 ""

 R54_the_schism_title:0 "The Schism"
 R54_the_schism_desc:0 "Suhan's movement has split the philosophy in two and tensions are at their maximum. It's time to force some reason into this conflict and find an amicable solution"

 R54_placate_the_praxic_title:0 "Placate The Praxic"
 R54_placate_the_praxic_desc:0 "The Praxic are not evil. Misguided maybe, but still rightful denizens of the Raj. They must be given proper respect and safe places to practice"

 R54_release_the_reactionaries_title:0 "Release The Reactionaries"
 R54_release_the_reactionaries_desc:0 "The rise of the Praxis has sparked a significant amount of malice in the most zealous groups of our true faith. Hostility towards the crown will not be tolerated, as a diverse group of opinions is a core tenet of debate."

 R54_the_iron_soul_title:0 "The Iron Soul"
 R54_the_iron_soul_desc:0 "With the majority of the tensions dispersed, the rights of the praxic and the reign of the high philosophers stand resolute."

 R54_white_spears_of_rahen_title:0 "White Spears Of Rahen"
 R54_white_spears_of_rahen_desc:0 "Sacred to our culture, the temples will become a centerpiece of our military. We will construct military outposts around them to keep them maintained and protected."

 R54_reasoned_warfare_title:0 "Reasoned Warfare"
 R54_reasoned_warfare_desc:0 "The concept of combat may be steeped in tradition, but we cannot afford to stagnate. Debate is holy, and the topic of warfare is too important to be excluded."

 R54_the_map_to_hope_title:0 "The Map To Hope"
 R54_the_map_to_hope_desc:0 "The auspicious lotus calls. Begin the search in the cities along the fault line."

 R54_throne_war_and_sisters_title:0 "Sisters, Wars, And The Lost"
 R54_throne_war_and_sisters_desc:0 "The First Omen tells the the tale of the Harimraj splitting in two along the fault line of the empire. This auspicious lotus may yet await us."

 R54_gods_pillars_and_end_title:0 "Gods, Pillars, And The End"
 R54_gods_pillars_and_end_desc:0 "The Third Omen tells the tale of the apocalypse. From what, we do not know. All we know is that the gods are gone. We don't know how much time we have. We must act as fast as possible."

 R54_an_army_worthy_of_harimar_title:0 "A Force For His Will"
 R54_an_army_worthy_of_harimar_desc:0 "The hobgoblins have a core society value based on familial bonds, not unlike the Orange Sash. Perhaps we can learn from them and make our resplendent legions show now fear, no end, and no quarter."

 R54_demonstration_of_destiny_title:0 "Demonstration Of Destiny"
 R54_demonstration_of_destiny_desc:0 "Remind them what might truly looks like"

 R54_the_third_harimraj_title:0 "The Third Harimraj"
 R54_the_third_harimraj_desc:0 "You did it, hope you feel cool :)"

 R54_bow_mage_and_fall_title:0 "Fates, Mages, And The Fall"
 R54_bow_mage_and_fall_desc:0 "The Second Omen tells the tale of Jagaddipendra and the fall of the first Harimraj. We should utilize our affinity with the mages to attempt to assimilate the oracles."

 R54_philosophical_studies_title:0 "Philosophical Studies"
 R54_philosophical_studies_desc:0 "With the advent of new technologies and unified communications, High Philosophy is no longer constricted to practice and debate, but can now be applied to scientific study"

 R54_frontiers_to_frontlines_title:0 "Frontiers To Frontlines"
 R54_frontiers_to_frontlines_desc:0 "The buffer armies that protected the Raj begin to lose their purpose as the interior gains strength. It's time for them to join the ranks properly."

 R54_the_last_remnant_title:0 "The Last Remnant"
 R54_the_last_remnant_desc:0 "The last remnant of the old Raj remains. For this administration to truly be reborn, something must be done. This will not be easy, the Vizier has many allies in court and ties to many central aspects of government. Move carefully and make them a generous offer."

 R54_a_court_worthy_of_harimar_title:0 "A Court For His Wisdom"
 R54_a_court_worthy_of_harimar_desc:0 "The court is whole. Many minds speak with a single voice. Our influence is undisputed, and our grandness is absolute."

 R54_a_throne_worthy_of_harimar_title:0 "A Throne For His Rule"
 R54_a_throne_worthy_of_harimar_desc:0 "The Final Throne is finally found and it shall be the crown jewel of our empire. A shining gemstone to adorn the diadem of the new Harimraj."

