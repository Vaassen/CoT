 ar_tx_restore_tree_title:0 "Begin the Second Landing"
 ar_tx_restore_tree_desc:0 "Load Thalaxotika's mission tree into this campaign."
 ar_tx_secure_escort_title:0 "Secure an Anchorage: Escorted Ward-Builders"
 ar_tx_secure_escort_desc:0 "Choose an island province to ward. Station four infantry there and pay 20 military power and one eighth of a year's income. The work takes 90 days, or 60 after the Saltward Compact."
 ar_tx_secure_magic_title:0 "Secure an Anchorage: Abjuration Ritual"
 ar_tx_secure_magic_desc:0 "Choose an island province to ward. Pay 30 magical mana and one eighth of a year's income. Talented abjuration from our ruler or estate is sufficient. The work takes 90 days, or 60 after the Saltward Compact."
 ar_tx_resume_ward_title:0 "Resume the Warding Project"
 ar_tx_resume_ward_desc:0 "Resume the existing project without paying again. Restore ownership, control and safety, and either the four-infantry escort or access to abjuration. A fresh 90-day work period begins, shortened to 60 days after the Saltward Compact."
 ar_tx_cancel_ward_title:0 "Abandon the Warding Project"
 ar_tx_cancel_ward_desc:0 "Cancel the unfinished project. Its initial payment is not refunded. Completed wards remain intact."
 ar_tx_reset_selection_title:0 "Close the Anchorage Selection"
 ar_tx_reset_selection_desc:0 "Clear the unfinished province selection so another decision can be used. This does not cancel or refund a paid project."
 ar_tx_scattered_fleet_title:0 "Call the Scattered Fleet"
 ar_tx_scattered_fleet_desc:0 "Call the wandering fleet home for recruits and sailors, or a contribution to the treasury. Usable once every twenty years."
 ar_tx_beacons_reward_tt:0 "Clear Qeyikul warbands from our capital and one other coastal island city. Both gain permanent wards. Unlock the Secure an Anchorage decisions."
 ar_tx_upgrade_reward_tt:0 "Existing and future island wards also grant §G+20.0%§! local defensiveness. Clear §G25§! devastation from each owned island province."
 ar_tx_network_reward_tt:0 "The network automatically clears warbands and establishes wards in future island acquisitions and colonies. It does not destroy existing rebel armies."
 ar_tx_harbours_reward_tt:0 "Three island ports each gain §G1§! base tax, §G1§! base production and §G+25.0%§! local trade power."
 ar_tx_belt_reward_tt:0 "Gain permanent claims on coastal provinces in up to two areas adjoining our recovered homeland."
 ar_tx_scattered_reward_tt:0 "Unlock Call the Scattered Fleet: every twenty years, choose §G5,000 manpower and 5,000 sailors§!, or §G2 years of income§!."
 ar_tx_colony_upkeep_tt:0 "Receive §G0.5 ducats per active colony each month§! towards colonial upkeep, equivalent to a quarter of standard base maintenance. Additional colony penalties are unchanged."
 ar_tx_island_dev_tt:0 "Our completed island provinces have at least §Y100§! total development. Current island development: §Y[Root.ar_tx_island_development.GetValue]§!."
 ar_tx_old_coast_peace_tt:0 "Unrest is at or below §Y0§! in provinces §Y5571, 5572, 5573 and 5574§!."
 ar_tx_combat_10_tt:0 "Have at least §Y10 combat ships§!, including at least §Y2 heavy ships§!. Transports do not count."
 ar_tx_combat_20_tt:0 "Have at least §Y20 combat ships§!, including at least §Y5 heavy ships§!. Transports do not count."
 ar_tx_home_share_30_tt:0 "Have at least §Y30%§! trade power in our home trade node."
 ar_tx_home_share_50_tt:0 "Have at least §Y50%§! trade power in our home trade node."
 ar_tx_home_merchant_tt:0 "Have a merchant in our home trade node."
 ar_tx_external_trade_tt:0 "Have at least §Y10%§! trade power in each of §Ytwo different nodes outside our home node§!."
 ar_tx_escort_decision_tt:0 "Select a province. On confirmation, pay §R20 MIL§! and §Rone eighth of a year's income§!; keep four infantry there while work proceeds."
 ar_tx_magic_decision_tt:0 "Select a province. On confirmation, pay §R30 magical mana§! and §Rone eighth of a year's income§!; maintain access to abjuration while work proceeds."
 ar_tx_resume_tt:0 "Resume without another payment. A new work period of 90 days begins, or 60 after the Saltward Compact."
 ar_tx_cancel_tt:0 "Abandon the unfinished project without a refund. Completed wards remain."
 ar_tx_site_title:0 "Secure [ar_tx_site.GetName]"
 ar_tx_site_desc:0 ""
 ar_tx_site_confirm:0 "Build the ward here."
 ar_tx_site_next:0 "Consider another anchorage."
 ar_tx_site_cancel:0 "Leave the selection."
 ar_tx_site_confirm_tt:0 "Pay the selected method's costs and begin the warding project. Clear all Qeyikul warbands when the work finishes; the province gains −1 local unrest and −0.25 monthly devastation."
 ar_tx_fleet_people_tt:0 "Gain §G5,000 manpower§! and §G5,000 sailors§!. Starts the twenty-year cooldown."
 ar_tx_fleet_money_tt:0 "Gain §G2 years of income§!. Starts the twenty-year cooldown."
