 orenvalyam_events.200.t: "Protector"
 orenvalyam_events.200.desc: "Here, Silverspite is the hero, he's awesome, he's an archangel, he's golden age Griffith. Intro to him saving a soldier from battle, then introduce Velara and the Taychendi High Kavalal who assessed him at Uesrennu, Ceboranbu the Warden, in the aftermath, the former questioning the destruction, the latter waving it away - this is the first of Silverspite's ends justify the means. Generally, he is still very heroic though."
 orenvalyam_events.200.a: "TODO"

 orenvalyam_events.201.t: "Emancipator"
 orenvalyam_events.201.desc: "Silverspite is walking calmly through a village alongside that Uesrenni High Kavalal, observing those around, free, grateful, prosperous. They talk about the Oren Nayiru, what it means to Silverspite - how it feels to truly be doing something right. Righteous. How that used to be such a foreign feeling to him, when he'd worked as a mercenary. The Uesrenni High Kavalal questions him on some of his recent actions, like his disparaging behaviour towards the Kavalakuttam, but they are still cordial - he compliments Silverspite, says there are some who say he is imbued with Nayiru's spirit. Finally, the High Kavalal reveals what he brought him out to tell him - they'd found his father. He'd flunked out of the Exemplars, was drinking himself half to death. He asks Silverspite if he wants to see him... to confront him. And Silverspite says no. His father lost Silverspite's mother too ... and in the end, watching his son surpass him, do what he failed to do, without him, without the Exemplars? That's punishment enough. And Silverspite would like it very much if his father would be around to suffer it."
 orenvalyam_events.201.a: "TODO"

 orenvalyam_events.202.t: "Liberator"
 orenvalyam_events.202.desc: "Cold open on Silverspite standing, armour clad, as a teenage girl is ripped away from him, having just tried to assassinate him. She's screaming "you killed my papa" over and over. Velara is very disconcerted, Silverspite stares blankly - but inside, he's going over his own past. Some time later, he's standing before a crowd - Velara wants him to bring down the heat. He is about to go through the motions - but then he remembers that girl... and he remembers that vow, to never let what happened to him happen again - and he gets angry. Instead of what Velara wanted, he tells the crowd that there are those that want to slow down, to restrain the advance of the Oren Nayiru - but you cannot listen to them. If Orenvalyam is to truly liberate the world, then they must be prepared to do everything they can to do so - even through pain, and doubt, and fear. That is what it means to be Taychendi - and with their Kamrayakval at the tip of their spear, they will not falter as they use that unwavering determination for justice, for liberation! For Dawn! Silverspite turns from the cheering crowd, renewed and rejuvenated. Velara is stricken, hopeless."
 orenvalyam_events.202.a: "TODO"

 orenvalyam_events.203.t: "Tragedy at the Fateweaver!"
 orenvalyam_events.203.desc: "Short interlude that triggers 5a. Short event, reporting that when the Kamrayakval and his second-in-command Velara visited the Fateweaver of Korrimutren to recieve a prophecy, a plot to assassinate the Kamrayakval killed Velara, and DESTROYED the Fateweaver. All Orenvalyam mourns Velara's loss. Every Taychendi mourns the Fateweaver's."
 orenvalyam_events.203.a: "TODO"

 orenvalyam_events.204.t: "Traitor"
 orenvalyam_events.204.desc: "Velara is dead, murdered, and Silverspite saw her body, can't get the picture of her out of his head. As he strides into the Kavalakuttam, fully armoured, he is starting to truly, properly show his instability, megalomania... and heavy repression of something. He openly intimidates the kavalali, warning them that he is the Kamrayakval, the chosen of Dawn - and it is by his grace that they are alive to exercise their liberties. Then he finishes his speech by dragging out a Kavalal he says orchestrated the murder, and publically executing him - sharing a look with Ceboranbu as he does."
 orenvalyam_events.204.a: "TODO"

 orenvalyam_events.205.t: "Avatar"
 orenvalyam_events.205.desc: "Short flashes of Silverspite now - a terror on the battlefield, leading his men from the front, conquering, laying low the enemies of Orenvalyam, turning all before him into gore. At last, he stands before a host of his soldiers - and he thinks about the mounting opposition to him, people decrying him as a tyrant. They call him the Void-Clad, the Slave-Emperor, the Scream-of-Eclipse. More anger, more spite. But as the opposition increases, so too do those who would give everything to fulfill his command. He makes a speech before them - says that the very meaning of tyranny is incompatible with him. That everything they are doing, the violence and destruction, is so that all can be free, not subjugated. He tolerates no dissent because any dissent against Nayiru's will is by definition the work and word of Darkness - he pauses, briefly recalls the image of something Velara said to him, then continues - and any dissent against him, is dissent against Surael's will. Because as was revealed from on high, delivered by fate, he IS Surael. In the flesh, incarnate, reborn on Halann as the warrior of Dawn, avatar of the Divine. So do not dither, do not hold back, do not show quarter - not because your Kamrayakval orders it, but because Surael demands it. For the ultimate goal. For the final victory. The crowd is silent for a moment as they take it in. Then they begin to cry "Nayiru! Nayiru! Nayiru!""
 orenvalyam_events.205.a: "TODO"

 orenvalyam_events.206.t: "Murderer"
 orenvalyam_events.206.desc: "Elrandar visits the Kavalakuttam, where Ceboranbu is waiting for him. He pleads with him to reign in his impulses - talks of how those in Orenvalyam who still have sense can see his instability. They call it madness - but Ceboranbu knows it is sickness. He tells Elrandar that whatever he is suffering through, he must confront it head on - "you are Taychendi!" Elrandar shrugs him off at first, still in the throes of his madness - but when Ceboranbu tells him that, something snaps. He tells him that Velara had said something similar. Tells him that after he'd visited the Fateweaver, recieved his prophecy from the priestess, he hadn't understood what it was telling him. He couldn't get it. When he went back to commune with it personally, the armour roared at the intrustion, the pain... but Elrandar saw the vision clear. And he couldn't deal with what it told him. He hacked the Fateweaver apart in his spite, in the dragon's rage. And then Velara arrived... saw, and she'd had enough. Said that he was a failure, dooming the world because he couldn't let go of his past, all in the name of some righteous mandate. Said that he was just like Ecaris. He had murdered her, for that. But she was wrong- and so is he, now. Silverspite looks up, tells him that he is not Taychendi anymore - he is Surael. He must be. How else could he have done all this? Ceboranbu's pleading look is replaced with a stern one, a resigned one. Silverspite tells Ceboranbu that he saw that look in her eyes, too. The pity. In spite of his nerves, Ceboranbu tells Silverspite "no," and draws his sword with a shaking hand, as the Oren Neraghul appear, ready to confront a tyrant. "It is the courage." Silverspite kills them all."
 orenvalyam_events.206.a: "TODO"

 orenvalyam_events.207.t: "Elrandar"
 orenvalyam_events.207.desc: "Silverspite sits on a throne in the Vanetavanem. He recalls the prophecy the Fateweaver had shown him. He had stood atop a world of corpses, of blood, and ruin, and a figure he knows is Ecaris - armour of bronze, body of fire, cape flowing blood - stood against him and raised his sword of light. Then nothing - a challenge, a possibility of death, or victory. Silverspite is having a moment of lucidity - he realizes that the armour is corrupting him, pushing him. Gods know why - but it doesn't matter. When he thinks back to what he did to Velara, he knows that was all him - the dragon may have pushed him, but he stepped to the ledge. He takes out a knife, and contemplates killing himself - to be or not to be. Then he remembers what the Oren Nayiru thought of him, at first - what he wanted to be. A weapon for righteousness. He swore an oath, to that effect - to bring Dawn, no matter the cost. That was the trade. He speaks to the armour, puts the knife to the slave collar around his neck - and asks to make a pact, as Jaher once did with the Phoenix. As Ecaris did. Silverspite knows that Sedamurax lives a torturous life - that he wants vengeance, he wants the world to give him what he wants, for once. Silverspite tells him that he feels the same - but that the world will never give them what they want. And they will never be fulfilled. They are the villains of the piece - but together... if they strive to keep fighting, keep doing wrong to make right, they can make all the evil they have done mean something. It is the only way for it to mean something. Silverspite feels a lightness for a moment - the burden lifted. But he presses the knife closer to his neck... and then the rage comes on, hotter than ever. Silverspite throws the knife away, stands, and smiles as he dons the armour."
 orenvalyam_events.207.a: "TODO"

 orenvalyam_events.210.t: "Purification"
 orenvalyam_events.210.desc: "Event gives a brief overview of Silverspite's forces do as they conquer territories - throw show trials for old elites, ransack estates and cities and either redistribute the looted wealth to their allies in the region or send it back to Taychend to fuel the war effort, rapidly reorganise land and rights, free any slaves or serfs they come across. This naturally causes quite a bit of upheaval - but delaying and dithering trying to find a morally satisfying solution is the Exemplar way, not Silverspite's - and so the faith advances."
 orenvalyam_events.210.a: "Cool"
 orenvalyam_events.210.b: "DontShowAgain"

 orenvalyam_events.211.t: "A Line in Scorching Sand"
 orenvalyam_events.211.desc: "A group of High Kavalali meet in a secret location, each signing a blood oath never to speak of this conversation. They despair over Silverspite's violent outburst, despite his loss - though the fact that the moderating Velara is gone is still terrible. For the first time, they talk of the unthinkable - removing Silverspite as Kamrayakval, by censure... or assassination. But some are far more cautious - Silverspite has won them so much success, and advanced the will of Nayiru so much, it would be mad to remove him. They all agree that they ought to make plans... and maybe try to contact Ecaris, who disappeared shortly after Velara's murder, and who they know to be running around - even as some suspect he knows something about what happened to Velara. Naturally, they know they must be very cautious about how they go about doing so."
 orenvalyam_events.211.a: "TODO"

 orenvalyam_events.212.t: "The Duskbringer Conspiracy"
 orenvalyam_events.212.desc: "Just a short event going over what the conspiracy entails, who is supporting Silverspite's removal etc."
 orenvalyam_events.212.a: "TODO"

 orenvalyam_events.213.t: "The Duskbringer Conspiracy Foiled"
 orenvalyam_events.213.desc: "TODO"
 orenvalyam_events.213.a: "TODO"

 orenvalyam_events.214.t: "Grim Betrayal"
 orenvalyam_events.214.desc: "The High Kavalali meet to discuss Silverspite's madness. When he is not flying over heartland and frontier alike, burning cities and slaying thousands as he crushes dissent, he is isolated, alone, brooding in darkened rooms. They decide that this has gone way, way too far, and that if they do not act now Silverspite will destroy the faith for good, but they still question how they can remove him. One of the High Kavalali answers - if Silverspite was once a weapon to advance the faith, they need an equivalent weapon to save it. At his command - "Interloper!" - Ecaris steps out of the shadows."
 orenvalyam_events.214.a: "TODO"

 orenvalyam_events.215.t: "Dour Failure"
 orenvalyam_events.215.desc: "Silverspite gets ambushed in the Kavalakuttam chambers by Ecaris, wielding Dazinkion. Silverspite and Ecaris share some words - Ecaris says that if he had been there with Corin he would have whooped Korgus' ass (yeah ok buddy) and that he will not make the same mistake again, shirk his duty. Silverspite responds that showing up isn't enough - you gotta win, and he's gonna win and put Ecaris in the dirt, annihilate him so completely they won't be able ot seperate his name from the word failure. They fight, but Silverspite still nears victory. One of the Oren Neraghul calls on Ecaris for Plan B - and the former Herald unleashes Dazinkion at the ceiling, bringing the building down on their heads.\n\nTrapped under the rubble - and hearing a mortally wounded Ecaris quietly praying to himself - Silverspite tries to claw his way out... but then he feels a boiling liquid hit his skin. As the Conspirators above set the oil alight, Silverspite burns to death, the dragon roaring as Elrandar curses them."
 orenvalyam_events.215.a: "TODO"

 orenvalyam_events.216.t: "Foul Murder"
 orenvalyam_events.216.desc: "The Kavalakuttam meet outside the capital, the burning stone of the old Kavalakuttam building burning in the background. As they haul the blackened, lifeless armour of the Kamrayakval out (and the charred husk that used to be Ecaris), they denounce Silverspite as a tyrant, justly removed - many are clearly relieved... though there are some who aren't.\n\nThe Kamrayakvalists storm out, claiming that this foul murder will not go unpunished - if the traitors will not give themselves up to justice, they will take them to it - and, of course, the Kavalali will have to deal with those who liked him."
 orenvalyam_events.216.a: "TODO"

 orenvalyam_events.217.t: "Victor"
 orenvalyam_events.217.desc: "Same as above, but this time he is able to push them back. As Ecaris readies himself to use Dazinkion, however, Silverspite grabs the blade and stabs him in the gut. Ecaris dies, and Silverspite wins.\n\nThe next night is one of fire and blood. Any member of the Kavalakuttam who isn't a supporter of Silverspite is lynched by soldier-mobs, alongside their families. Silverspite simply stands idle in the  Kavalakuttam chambers, as his supporters dump the bodies of the Kavalali before him, silently contemplating Ecaris' body."
 orenvalyam_events.217.a: "TODO"

 orenvalyam_events.218.t: "Messiah"
 orenvalyam_events.218.desc: "Some quickly described scenes of Orenvalyam under Silverspite. A Kavalali is dragged from his house by soldiers accusing him of treason for questioning Silverspite's continued rule; A freed slave works her farm in peace, a free woman at last; soldiers massacre captured enemies without quarter, simply cutting their throats and piling them into a mass grave; an aged veteran tells some children about how Surael himself once saved him from the enemy - how standing with the Kamrayakval, he helped deliver them all from tyranny.\nThen to Silverspite, for the last time. He is holding Ecaris' helmet in his hands, unarmoured, sees the glimmer of his reflection in the gilded metal - his blackened eyes, iron-slag creeping across his skin, filling his scars. He reflects on all he accomplished, compares himself to the failures who came before him - when he sees Velara's face for a moment beneath the helm, he abruptly dons his armour and crushes it. Looking out over Orenvalyam, besieged, betrayed, but still standing, still fighting, still liberating the oppressed and vanquishing Dawn's enemies, he allows himself to smile again. At last, he'd proven them wrong - everyone who had stood for what they believed and did not have the stomach to see it through. He had not fallen, like them. Instead, he rose ascendant as he buried them in the dirt.\nSome time later, Silverspite stands before a crowd of hundreds of thousands - his warriors, his flock, his purpose. As he raises his sword, they hail him "Messiah!""
 orenvalyam_events.218.a: "TODO"

 orenvalyam_events.219.t: "Condemner"
 orenvalyam_events.219.desc: "Not a narrative event, just explains what happens after his death (silverspite's arc is over, basically). The Armour is locked away, as nobody could hope to match Silverspite's power, and according to Silverspite's wishes, the Kavalakuttam is restored... albeit with the Kamrayakvalists dominance assured. The Oren Nayiru is more zealous and militaristic than ever - who knows what can stop them now."
 orenvalyam_events.219.a: "TODO"

 orenvalyam_events.300.t: "Monasticists Refuse to Fight"
 orenvalyam_events.300.desc: "Monasticist Kavalali refuse to join the war, they think his campaigns have gone too far and are now of conquest, not liberation. Effects are doubled if devotion is less than 50."
 orenvalyam_events.300.a: "Let them go"
 orenvalyam_events.300.b: "Crack Down"

 orenvalyam_events.301.t: "Soldiers turn to Loot and Plunder"
 orenvalyam_events.301.desc: "With the ideals of the faith in tatters, many soldiers (and even some of the Kavalali leading them) have turned to banditry and brigandage. Effects are doubled if devotion is less than 50."
 orenvalyam_events.301.a: "We can't stop them"
 orenvalyam_events.301.b: "Hang anyone caught doing this"

 orenvalyam_events.302.t: "Ideals Fracture"
 orenvalyam_events.302.desc: "With the ideals of the faith in tatters, society is becoming increasingly corrupt, as people attempt to take advantage of Silverspite's conquests for their own personal gain. Effects are doubled if devotion is less than 50."
 orenvalyam_events.302.a: "TODO"

 orenvalyam_events.303.t: "Outrage Spreads"
 orenvalyam_events.303.desc: "Rather than joy at the news of victory, every report of victory in battle or the fall of a city is met with revulsion and outrage."
 orenvalyam_events.303.a: "Not a good trend"

 orenvalyam_events.304.t: "Opposition in the Kavalakuttam"
 orenvalyam_events.304.desc: "The Kavalali in the Kavalakuttam - even those who support Silverspite and are quite fervent Kamrayakvalists, are increasingly disgusted with the way the body is being treated, with displays of intimidation and contempt being common."
 orenvalyam_events.304.a: "Its their right"
 orenvalyam_events.304.b: "This is a sign of their treason"

