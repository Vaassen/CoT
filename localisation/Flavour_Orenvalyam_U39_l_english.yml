 orenvalyam_events.34.t: "The True Heirs of Corin"
 orenvalyam_events.34.desc: "the integration of so many Cannorians into Orenvalyam has led to the tales of Corin, their recently ascended war-god, to spread throughout the faithful. While many still look to her worship as having justified countless atrocities and colonial invasions, it is difficult to deny the achievements and righteous qualities of the goddess herself. Through a great act of sacrifice, she slew the tyrannical Dookanson, and through hope and good morals, inspired many to the cause of true justice. Some Oren Nayiru, calling themselves the Campurana Corintar, or Sect of the Corintar, are saying that they wish to form a new knightly order of crusaders, not fighting for bloodthirst or base ambition, but for Dawn, which they believe Corin was aligned with. While the Kavalalists support it, the Monasticists warn that they would still be too close to retreading the example of the Exemplars and Istralorians. Instead, they say Corin should be worshipped for her shield, not her sword."
 orenvalyam_events.34.a: "They can have their order!"
 orenvalyam_events.34.b: "Reject them"

 orenvalyam_events.35.t: "Day of the Dove"
 orenvalyam_events.35.desc: "The Emperor of Anbennar has called a massive meeting of the Imperial princes, to discuss the recent assassinations across the Empire. However, he then inexplicably begins to launch a tirade against the "tyrant princes", and all those who have profitted off of serfdom, slavery or colonial misadventures, denouncing the ideals of Anbennar as a shroud for their real ideals - ambition, pride, hubris. When one of the Princes speaks up and questions his sanity, and how he suddenly became such a bleeding-heart radical, the Emperor laughs, makes a pun, and then snaps his fingers - revealing his true form, a Taychendi elf armoured in black and orange, and the true form of the emperor - hanging by his foot from the ceiling, the spear-shafted banner of Orenvalyam ran through his heart. The Taychendi elf smiles, as his comrades throw off their glamours and draw their swords. He proclaims that the Day of the Dove is over, and that one day, all tyrants will be overthrown."
 orenvalyam_events.35.a: "TODO"

 orenvalyam_events.36.t: "And the Days of Blood"
 orenvalyam_events.36.desc: "While the Doveday Massacre, as it has come to be called, has been seen as a glorious victory across Orenvalyam, it has not been taken as expected in Anbennar. Rather than inspiring the serfs and peasantry to overthrow their masters, the massacre has been taken as a heinous attack by a foreign power, and a wave of anti-Ruinborn sentiment has swept not just Anbennar, but Cannor. Reports of vicious pogroms from Westport to Nathalaire being carried out by not only vengeful nobles, but lowly peasants and labourers, has unsettled both the Oren Neraghul and the Kavalakuttam. As a new Emperor is elected and the wave of patriotism allows the aggrieved princedoms to perservere, many are questioning whether the attack was a good idea at all."
 orenvalyam_events.36.a: "TODO"

 orenvalyam_events.37.t: "Ideals Overstretched"
 orenvalyam_events.37.desc: "The experiences of the Haraf'ne and Eordan ruinborn with conjuration magic and beings from other planes has challenged Orenvalyam's previous ideas about conjuration magic. In Taychend, it was seen as an evil art, most infamously used by the Cennayakuta to oppress the slaves - in the climactic final years of the Death Throes, the lover-tyrants Ulwathi & Lanahasha used the arts to conduct one of the largest mass sacrifices - and mass killings of slaves - ever seen on Halann. But in Haraf, and now Eordand, the advance guard of Dawn has encountered undeniable proof that the energies of other planes can be used not just for evil, but good.\nTwo High Kavalals, one Taychendi, one Kheionai, sent on an exploratory mission from Taychend, muse on this while they speak to a new Haraf'ne High Kavalal. Overlooking the Tunnels of Renewal, they voice their concerns - but eventually concede that the further north they go, the more previous ideals seem to be fraying. They allow the Haraf'ne to pursue the restoration of the Tunnels of Renewal - a test case for a new Paradigm"
 orenvalyam_events.37.a: "TODO"

 orenvalyam_events.38.t: "The Ynnic Heresy"
 orenvalyam_events.38.desc: "In the Ynn, converts to the ON from Ynn River Worship have adopted as a "New Tenet" the belief that the Ynn is also a surviving Elusive One, equal to Nayiru, and who returned a thousand years earlier, at the start of the Age of Glory. As the Oren Nayiru has spread through the continent, the Kavalakuttam has permitted efforts to equate creator dieties with Nayiru, or else dead Elusive Ones, and wholeheartedly accepted those who keep to their old gods in the new framework of the Oren Nayiru's cosmology. And, of course, nobody can know the whole of Nayiru's truth but Nayiru themselves. Still, to many the "Ynnic Heresy" simply goes too far, and flies in the face of what the followers of the religion are supposed to believe. But is what people are "supposed to believe" fundamentally rooted in the ideals of the Taychendi? Would enforcing those Taychendi ideals make Orenvalyam just another Interloper state?"
 orenvalyam_events.38.a: "First one's heart strays, then one's actions - this must be surpressed as a threat to Dawn"
 orenvalyam_events.38.b: "We must protect the intentions of Nayiru as we understand it, but do so through debate"
 orenvalyam_events.38.c: "Who cares about their theology, so long as they align with our ideals?"

 orenvalyam_events.39.t: "The Dragon Kavalal?"
 orenvalyam_events.39.desc: "Varlengielt judges the choices the Oren Nayiru have made over the years favourably, and asks to become a Kavalal."
 orenvalyam_events.39.a: "Based"
 orenvalyam_events.39.b: "We won't allow anyone to be enslaved by dragons again, reject him"

 orenvalyam_events.40.t: "The Living Relics"
 orenvalyam_events.40.desc: "Funny event where a few High Kavalals have a conversation with an Insyaan Mechanim leader. He does the "this unit has a soul" schtick, and the High Kavalal is like "yes, yes! You do!" because this happens to fit quite nicely with the Doctrine of the Elvenness of Relics. The kavalal explains this - the Mechanim just just looks befuddled, says that if that is the path he wants to take to accept them as people, so be it... even if it's a little odd. The other Kavalali ask if they could help make more of their kind - the Mechanim says yes, under certain conditions: they must be free, overseen by Insyaan mechanim, and totally equal to living people. The Kavalali accept."
 U39_living_relics_tt: "§CWhen they returned to Insyaa, Roaring-Defiant argued against the agreement with Orenvalyam. In the Kavalal’s eyes, they saw the glint of world-changing ambition that had once created them as tools, not people. But their brethren judged the Oren Nayiru differently. If the descendants of their creators truly had vanquished slavery, truly did believe the Mechanim to be equal… how could it hurt, to give those that had come so far the benefit of the doubt?§!"
 orenvalyam_events.40.a: "TODO"

 orenvalyam_events.41.t: "Answer Me These Riddles Three"
 orenvalyam_events.41.desc: "A Kavalalist, Kamrayakvalist, and Monasticist High Kavalal ventures into the Domandrod for an audience with the fey. Its like the Immarel event but they're testing, not cursing them. They ask a riddle, and the Three High Kavalali all give totally different and contradictory answers. The massive chorus of fey voices register their answers... then descend into mindless arguing about how to respond. Eventually, the Kavalals reach a compromise - they'll keep the Domandrod safe, will not venture into the Forest's heart, will respect the fey, and in return, they can "bring their god's light" wherever they wish. The Fey agree."
 U39_riddles_three_tt: "§CAnd thank Nayiru they did – it took eighteen votes, five sub-committees, six months and seven mental breakdowns to come up with a pact that rhymed!§!"
 orenvalyam_events.41.a: "Unlock the Domandrod Gates"
 orenvalyam_events.41.b: "Unlock the Domandrod Gates"

