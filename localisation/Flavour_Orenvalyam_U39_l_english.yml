 orenvalyam_events.31.t: "Offer From Valorpoint"
 orenvalyam_events.31.desc: "Seeing Orenvalyam's decision not to expel the Cannorians, Valorpoint have reached out to secure an alliance. They share similar stances on slavery, and are generally pro Ruinborn - in fact, many of them seem to have Boek blood, with their leaders having encouraged intermarriage with the natives. The Kavalali very much want to sign - and the Kamrayakvalists are quite interested in their military strength and zeal.\n\nBut... as the monasticists have been pointing out, the Exemplars too intermarried with the Ruinborn, and it did not magically remove their Interloper Status. Unlike the Ozgar, the Valormen came to colonize Aelantir of their own free will. The Monasticists already see the campaigns in North Aelantir as a dangerous provocation - to dilute the faith's ideals would be a step too far."
 orenvalyam_events.31.a: "Accept"
 orenvalyam_events.31.b: "Reject"

 orenvalyam_events.32.t: "Moral and Meaning"
 orenvalyam_events.32.desc: "A woman in a gnollish slave pen is shaken awake by her brother. He tells her that he has no idea what is going on, but that they have to go, now. There are elves, apparently, who have come to save them! In the middle of Faungaula! And they have beards!\n\nThe two escape the pen, ushered along by a Taychendi elf who don't even speak their language. They see the Oren Nayiru band's leader duel a gnollish slaver - cut off his head with a flourish of his sabre. They also notice there are just as many Taychendi dead as gnollish.\n\nThe woman stops- she has to ask the Taychendi why he is doing this. Why he's here. The Taychendi doesn't understand exactly - but he gets the general idea. He raises the shackle tied to her hand, breaks it open with an almighty blow, then grins, and says: "Taychendi!""
 orenvalyam_events.32.a: "TODO"

