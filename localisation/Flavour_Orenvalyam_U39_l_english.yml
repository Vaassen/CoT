 orenvalyam_events.43.t: "The Last Interloper"
 orenvalyam_events.43.desc: "In light of the decision to cancel the invasion of Halcann, the Kamrayakval gives a speech, where he says that the great crusade in Nayiru's name is over - but that doesn't mean they can rest. There is still work to be done. Aelantir must be protected, the people must be given what they want - and even if they would not burn the world, they cannot stand idle whiel evil exists across in it. There is much to be done - but Dawn doubtless approaches, not bloody, but brilliant. The Last Interloper has been defeated."
 U39_last_interlopers_tt: "§CThe vote was firm in favour of cancelling the invasion – but it was not unanimous. Across Orenvalyam, Nayiru’s faithful breathed a sigh of relief at the news, wary of war; Nayiru’s faithful raged at the betrayal, at the cowardice of the Kavalakuttam; Nayiru’s faithful learned for the first time there was going to be an invasion at all.\n\nBut the fight is not over. There is still poverty, there is still inequality. The enemies of Orenvalyam still gather on the periphery. Evil and injustice still exists overseas. If Dawn is still possible, we must strive for it.§!"
 orenvalyam_events.43.a: "TODO"

