 orenvalyam_events.13.t: "Fate of the Heralds"
 orenvalyam_events.13.descSilverspite: "Silverspite visits Ecaris unexpectedly. Ecaris is doing main character things, probably sharpening his sword or praying. Things are immediately tense, and soon the two are very tersely arguing with each other, through gritted teeth.\n\nIt is clear Ecaris thinks Silverspite (he keeps calling him "Kalinzuir") is a dangerous wildcard, his heart gripped tight by the Dark, and that he is one bad day from falling to it, and dragging the world with him. Silverspite calls Ecaris a failure, blind to his position, obsessed with the idea that he is righteous, that he is doing his duty, when he's only trying to outrun his mistakes, and making more. Castonath, Bulwar, now Taychend. And one of those mistakes killed his mother, and he will NEVER forgive him for it. But, Silversite concedes, it was Ecaris' failure that made him. The Exemplars are irrelevant - they're doomed, they're useless. Ghosts given a message to deliver from on high, and incapable of more. A whisper on the wind. One day, they'll blow away. Doesn't matter if someone helps them along or not. So Silverspite is letting it be a free vote - its up to Ecaris, its ON Ecaris, to save his people. "Try not to fail at that, too.""
 orenvalyam_events.13.descElse: "The Jaherian Exemplars were the catalyst for the faith's founding, but there are those who really don't like them, and tensions have flared up over the years, particularly over the Exemplars' "Interloper" status, their championing of "order" as a virtuous thing, and their interest in artificery.\n\nThe Kavalali unlock integrating them, the Monasticists unlock tolerating them, and the Kamrayakvalists unlock both tolerating or purging them. If Silverspite is leader, then the Kamrayakvalists will not tolerate, if Silverspite is not leader then a dissident Monasticist will stand and say that the Interloper Exemplars are the opposite of everything the Monasticists stand for and should leave Aelantir, unlocking purge"
 orenvalyam_events.13.a: "Integrate"
 orenvalyam_events.13.b: "Tolerate"
 orenvalyam_events.13.c: "Purge"

 orenvalyam_events.14.t: "Legacy"
 orenvalyam_events.14.descIntegrate: "Ecaris is on the battlefield, the enemy in front of him. He's musing on Orenvalyam, but he's broadly at peace. Maybe the ON are different, maybe they're a little chaotic, but they have a noble goal. With the Herald's Wisdom, maybe they can be kept on the straight and narrow. He raises Dazinkion and annihilates the enemy with it.\nOR if Velara Denazuir is your heir, then it is a conversation between her and Ecaris where he asks about the differences between Rez and Orenvalyam. They conclude: not wide enough. Ecaris says that he guesses he's the Jaher to her Taelarios. He doesn't believe in the doctrine or the specificities. They do. But he won't forget his vows, ideals, faith in Surael, nor will he apologize for acting on them, no matter what he is called for it. Velara adds, somberly: neither will they."
 orenvalyam_events.14.descTolerate: "Karodir is talking with Ecaris in Rezankaz, lamenting how the Exemplars have been reduced to mere adventurers, and how Karodir can't do any cool artificery experiments without a kavalal shouting at him about it. Ecaris basically tells him that if he doesn't like it, tough - the Exemplars gave the Taychendi a choice between them and the Oren Nayiru... and they chose to reject them. Chaos over order. Karodir asks Ecaris whether giving them a choice was a mistake - he doesn't answer."
 orenvalyam_events.14.descPurgeSilverspite: "Ecaris (who has defended an evacuation ship) is talking with Karodir, who says he is leaving with the rest. Ecaris meanwhile insists on staying, cause he's gonna do underground travelling hero stuff - he made an oath to save Aelantir from darkness - and if Orenvalyam is heading into the abyss, he can't sit by and do nothing. He also laments how this is all his fault, and that he should never have let the Oren Nayiru get so strong. Ecaris vows to "finish what he started" (set up for later)"
 orenvalyam_events.14.descPurgeElse: "A meeting of the Kavalali is called to discuss the exile of the Exemplars - they are discussing whether to denounce their influence for good, and ditch the name "Surael" for Nayiru in all offiical things, completing splitting from the influence of the heralds. There is a back and forth, arguments to and fro, etc etc"
 orenvalyam_events.14.a: "TODO"
 orenvalyam_events.14.b: "TODO"
 orenvalyam_events.14.c: "TODO"
 orenvalyam_events.14.d: "TODO"
 orenvalyam_events.14.e: "TODO"

 orenvalyam_events.15.t: "Relics of Servitude"
 orenvalyam_events.15.desc: "The Oren Nayiru have assaulted and scoured the Nila Tenvach. A group of High Kavalali oversee the many Precursor Relics within being taken out, catalogued, blessed, then sent for containment. They even drag a gigantic Chall'maton dragon out... in pieces - it is quickly exorcised as it tries to bind itself together. The Blue House was the greatest symbol of how the immoral magics of the Slaver-Noble persisted after the Ruin, obssessed with unravelling the secrets of their relics, when their true nature was abundantly clear the whole time - products of slavery, magic and otherwise. Now a new age of magic has dawned. While relics may be used out of necessity, attempts to determine their secrets will be outlawed - Orenvalyam will not fall into the same trap the Exemplars did and mess about with the follies of the past"
 orenvalyam_events.15.a: "TODO"

 orenvalyam_events.16.t: "From Shadows"
 orenvalyam_events.16.desc: "One of the targeted rulers is relaxing in their office when a voice starts talking and admonishing them for their crimes. Its very phantom thief. As the targeted ruler starts to panic, a Taychendi elf suddenly appears out of the shadows. They draw their swords as they promise that this execution is going to be anything but private - because while the Oren Neraghul may strike from shadow, the cause they serve will never be thrust into the dark again. The next day, they find the ruler hanging in the central square - the bladed-sun of the Oren Nayiru carved into his chest."
 orenvalyam_events.16.a: "TODO"

 orenvalyam_events.17.t: "The Technicolour Rays of Dawn"
 orenvalyam_events.17.desc: "Event talking about how much of an absolutely chaotic mess Orenvalyam is. In the kheions, the kavalali are elected by the masses, vetted for candidacy by a tribunal of "impartial" religious scholars. Among the devandics, the shamans espouse both the myriad paths to dawn and some of their old ideas. To the Advakhalla, the Kavalali are delegate priests, beholden to their faithful flock in all manners except religious ones. In Sthanan ith Vussam and Nanru Nakar, the Kavalali - ancient dynasties, adopting new ways - are more like theocratic kings... but not tyrants, kept in rigorous check as they are by both their subjects and fellow kavalali. In Uesrennu and Rakkabuttai and the Matchlock-and-Mage banners that cross Taychend, the most zealous soldiers return home to take the rites by popular acclimation and military experience, and return to the frontlines to lead their troops. The rays of dawn shine in a million fantastic colours... some dimmer, some brighter. But all shine. As in chaos, comes true freedom."
 orenvalyam_events.17.a: "TODO"

 orenvalyam_events.18.t: "The Interloper's Sentence"
 orenvalyam_events.18.desc: "The Kavalakuttam has met in the ruined Synkletos Chamber of Ameion (if you have not completed suffer no interloper, some additional loc about how the Oren Nayiru brought "justice" to the city), and the Kavalali voted to establish that the Cycle of Dawn has not yet come, and that they must liberate the world in Nayiru's name before the Dawn comes. The monasticists protest that they will only invite destruction - that each individual killed is one that cannot be saved, that the reports of battlefield successes are reports of equal tragedy and bloodily-wrought hatred, and that they need only wait for Nayiru to bring dawn for them - but the Kamrayakval just answers that they are Taychendi, and they won't shy away from a fight. The cycle is turning, the apocalypse is nigh. All of Aelantir must be liberated.  Outmaneuvered, the Monasticists storm out - they say that they will not plod along while the rest set it alight."
 orenvalyam_events.18.a: "TODO"

 orenvalyam_events.19.t: "Negotiating Liberty"
 orenvalyam_events.19.desc: " Intro event. Grand conclave, filled with Chendhyans coming to negotiate - on equal terms - with the leaders of Orenvalyam. There is great potential here, and if the negotiations are successful, Orenvalyam may be able to bring the entire steppe into the fold, without conflict. The more demands the Oren Nayiru refuse, however, the more tribes will refuse to join the Kavalakuttam.\n\nAs an opening demand, a coalition of Chendhyan tribes want assurances the Kavalakuttam will protect their way of life. No being forced into Taychendi style towns or cities, or adopting the centralised High Kavalal / Cell structure - they will govern themselves according to their own wishes."
 orenvalyam_events.19.a: "Agree"
 orenvalyam_events.19.b: "The High Kavalali are pillars of the faith - they cannot be dispensed with"

 orenvalyam_events.20.t: "Negotiating Vengeance"
 orenvalyam_events.20.desc: "The Chendhyans want vengeance on the slaver cities that surround the Chendhya."
 orenvalyam_events.20.a: "Agree"
 orenvalyam_events.20.b: "Tell them that they will need to bury the hatchet with the frontier cities."

 orenvalyam_events.21.t: "Negotiating Zealotry"
 orenvalyam_events.21.desc: "As the last demand of the more traditionalist Devandics, the  the Chendhyans and Mteibhar want their religion protected"
 orenvalyam_events.21.a: "Agree"
 orenvalyam_events.21.b: "TODO"

 orenvalyam_events.22.t: "From Words to Action"
 orenvalyam_events.22.desc: "TODO"
 orenvalyam_events.22.a: "TODO"

 orenvalyam_events.23.t: "A Question of Priority"
 orenvalyam_events.23.desc: "As an addendum to the main negotiations, a coalition of pro-Orenvalyam Mteibhar and Basobhar delegates want their own land prioritised when considering the integration of border tribes."
 orenvalyam_events.23.a: "Agree"
 orenvalyam_events.23.b: "Reject them"

 orenvalyam_events.24.t: "Questions of Constitution"
 orenvalyam_events.24.desc: "Sparked by the ever politically-aware Kheionai converts to the Oren Nayiru, A great debate has errupted over what powers the Kamrayakval, as the leader of the faith, should have over local Kavalali."
 orenvalyam_events.24.a: "The Kamrayakval has supremacy over the regional Kavalali"
 orenvalyam_events.24.b: "The Kamrayakval should stay out of local politics completely"
 orenvalyam_events.24.c: "The High Kavalali must take the reigns of local governmen"

 orenvalyam_events.25.t: "Souls of the Singing Jungle"
 orenvalyam_events.25.descExemplars: "One of them has brought the chieftain of an Effelai tribe, who (through his translations) pleads for the Kavakaluttam not to burn the Effelai. The Kavalali discuss her sincerity - one of them (if the exemplars are integrated, this is literally Ecaris) says this is madness, the grip of the Dark is a terrible one, she's clearly being controlled by the jungle in some way. The others aren't so sure."
 orenvalyam_events.25.descElse: "One of them has brought the chieftain of an Effelai tribe, who (through his translations) pleads for the Kavakaluttam not to burn the Effelai. The Kavalali discuss her sincerity - one of them (if the exemplars are integrated, this is literally Ecaris) says this is madness, the grip of the Dark is a terrible one, she's clearly being controlled by the jungle in some way. The others aren't so sure."
 orenvalyam_events.25.a: "TODO"
 orenvalyam_events.25.b: "TODO"

 orenvalyam_events.27.t: "Chasing Spectres"
 orenvalyam_events.27.desc: "One of the Vairaghul teams up with Khaara, an Ozgar Orc from clan Grimshadow, to scope out a plantation in the ruined sea, hoping to rescue the slaves and bring them to Ozgarom. VERY slightly different loc is Ozgarom is a vassal vs directly conquered. They get to talking about Orenvalyam's march north, how they're dedicated to spreading the ideals of the faith beyond South Aelantir - Khaara, alongside many Ozgar, think it sounds like a good idea - but she warns the Vairaghul that as the Dookanson found out, the further a crusade advances, the more its enemies change, grow, until its difficult to tell who is on which side, and who ought to be. If Orenvalyam is not careful, then they may end up becoming the very same type of interloper they once fought against. The Vairaghul tells her not to worry - in his head, he wonders how much truth her words hold."
 orenvalyam_events.27.a: "TODO"

 orenvalyam_events.28.t: "The Twilight Approach"
 orenvalyam_events.28.desc: "A reticent young kavalal stands on the shore, looking north - another, stalwart Kavalal comes to get him, for a meeting he is currently missing. They are both Taychendi. Unprompted, the reticent Kavalal starts monologuing. He says that to him - as a Taychendi - Orenvalyam, the entire Oren Nayiru, it is not "redemptionary", as some say. It is the Taychendi proving a power they have always possessed. And there have always been slave revolts, a desire for freedom - Vehasha's Revolt, for instance. But what he really means is that... "heroic capability", to do what must be done, to rise to the challenge, no matter the cost. His favourite story is the Battle of the Phenied Cloth. Kadradar Blood-Hand's forces were unstoppable, and with mists of magic-plague he had laid waste to Taychend. Everyone banded together to defeat him - the warlords and their retinues, of course, armoured and protected, who stood a chance of survival. But also the commonfolk. The peasants, the bereaved. Hundreds of thousands of them gathered, charged forth into certain death, because they knew it was the only chance to defeat him. So many of them died, most of them - but they did enough. Their sacrifice meant something - allowed Kadradar to be slain by the Dumruktams.\nThe stalwart Kavalal asks the reticent one his point. He shrugs. He supposes that he wants so much to be fighting Kadradar. He wants that... lack of complication. An evil villain to be slain, a sacrifice to be made to do it. But that is not possible. There is no simplicity, anymore - and it is not just the Taychendi that cannot claim it, but all people. For the people in the North, Twilight Approaches. They say it will bring dawn - but the light dims at dusk as well.\nThe stalwart Kavalal finally gets his meaning - reassures him that their faith is a just one. A righteous one. The reticent Kavalal replies: how many others have said the same? The stalwart Kavalal responds simply: "how many others would ask?""
 orenvalyam_events.28.a: "TODO"

 orenvalyam_events.29.t: "Vindicator"
 orenvalyam_events.29.desc: "Opens on a flashback from the past. Elrandar Kalinzuir is being tended to by his mother. He is bloody, bruised... he'd saw a boy from the village getting picked on by some of older bullies for one of his toys, something expensive. He rushed in to save him - and ended up getting the shit kicked out of him instead. And they beat up the boy anyway. Elrandar is pouting, upset he didn't do anything. His mother is obviously proud of him for going in, even if he should pick his battles better. She tells him about how you can't win all the time. Sometimes things just don't turn out your way. The thing is picking yourself up after it. Fighting on. Never compromising your ideals. That's what his father does. Elrandar doesn't get it, though. "What's the point, if you don't win? If nothing changed?" His mother just shrugs. "I bet those kids feel great, with their shiny new toy. They won't feel so great when I come round with my soldiers, and make them give it back. Sometimes, your means prevent your ends. What are they left with, now? Two beaten kids, and no toy. You might think YOU got nothing. That's wrong. You got that boy's respect. And mine, too."\n\nThen back to the present. Elrandar Silverspite is on a beach in South Aelantir's northern shore, before dawn, taking in the tranquil water. He closes his eyes, remembers that day - and then another, months after, when those two bullies showed up in the mob that murdered his mother. Silverspite knows that she'd hate what he'd become. That his means would have shattered her respect. But with South Aelantir at peace? Orenvalyam secured? Slavery destroyed? It doesn't matter. The end was achieved. For the first time he lets the terror, loss, grief wash over him, as he opens his eyes to the rising sun.\nHe was sure of it now. Orenvalyam would conquer the world, and he made it happen. He won. And when all is said and done, that is all that matters."
 orenvalyam_events.29.a: "TODO"

