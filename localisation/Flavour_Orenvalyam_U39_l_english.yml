 orenvalyam_events.47.t: "The End of the World"
 orenvalyam_events.47.desc: "Two elderly High Kavalali, both Taychendi, are sitting watching the Kalavend. Barges on the river, sailing full in the still water, children at play in the furrowed fields... idyllic. Beautiful. They take in the sight, for a moment, smiling, basking in the good stuff they've done. Suddenly, the Stalwart Kavalal asks the other what future generations will think of them - of those who... finished the job. Liberated all Aelantir, then went no further.\nThe reticent Kavalal is about to launch into a big monologue about how oh they're be thought of like X or Y or Z - but then he stops himself, shrugs. Says that well, yeah, they'll be arguments. They'll be accusations and narratives and histories and questions... so many questions - the stalwart one completes his sentence: "but that's what its all about, isn't it." The reticent Kavalal nods - they just enjoy the sights a bit more.\n\nFinally, the reticent Kavalal speaks, one last time. He says that there might be another turn. They might pick that old crusade back up, go out, conquer the world. They might not. Whatever. He'll keep arguing that this was the right move, until he drops dead. Won't be long now. But to that moment, he'll know... he'll understand... that all this? Sitting in the bright of the sun, the children playing, the people free? If it isn't Dawn, then he doesn't know what is. The End of the World, the Turning of the Cycle... and he thinks, in his heart-of-hearts, that he helped make it happen, standing by his kin, against the tide, against adversity, no matter the cost. The Taychendi way. And that's something to be proud of."
 orenvalyam_events.47.a: "TODO"

 orenvalyam_events.48.t: "The Rumbling"
 orenvalyam_events.48.desc: "Describes the massive preparations made by Orenvalyam to invade Halcann. Millions of elves, masses of weaponry, armadas assembled, invasions planned. Then you have the Kamrayakval at the head of it all.\n\nThe Kamrayakval heads down into the depths of Nanru Nakar, where they keep the more secret relics - here, he finds Yodhan's collar locked up, ark of the covenant style. He takes, it, then puts it on. When he stands before the amassed invasion fleets, he dons the armour for the first time. As the Drathakamrakar emerges from the smoke, the Apocalypse begins."
 orenvalyam_events.48.a: "TODO"

 orenvalyam_events.49.t: "Dawn"
 orenvalyam_events.49.desc: "Goes over the continents conquered by Orenvalyam, the damage to them and what happened after, from the perspective of 2000 years in the future.\nIn Cannor, tens of millions die, as the Kamrayakvalists repay the ravages visited on Aelantir by the Cannorians ten-fold - anyone with a connection to the old colonies is considered a criminal: as are the cities they made their homes. But after the blood of the tyrants furrows the fields, the continent begins its long road to recovery - the peasantry and urban poor now on top.\nIn Sarhal, things are slightly better - though in Madriamilak, many die by famine as the priests resist, and their destruction throws the weather into chaos. The gnolls are scoured, Khetarata's slaves freed, then turned against their masters - with much difficulty, they eventually find a way to wipe out the Khet. The Lizardfolk are well-treated, though the Naga are torn down from their old positions\nIn Haless, a hundred million die. A third of the population - maybe half. Orenvalyam empowers the Praxis - then destroys the caste system, hangs the eunuchs, sunders the command entirely. The wars to do so tear apart Haless' infrastructure. When the Oren Nayiru hack apart the temples to free the spirits, the Rending kills many more. But eventually, a few centuries later, the population has recovered, the castes are memory, all - spirits included - live or unlive free.\n\nOver the next thousand years, the world recovers, then blooms. Remade.\n\nWas it worth it?"
 orenvalyam_events.49.a: "Who alive would say no?"

