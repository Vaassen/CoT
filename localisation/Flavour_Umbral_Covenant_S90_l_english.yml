S90_soul_empowerment_slot_unlock_tt: "Activates the §PSoul§! Category of §PShadow Empowerments§!."
S90_cultural_assimilation_unlock_tt: "Enables the §YCultural Assimilation§! Mechanic.\n\nCulture Groups can be assimilated by §YUmbral Covenant§! under the following conditions:\nAll provinces belonging to the culture in Sarhal are:\nOwned by §YUmbral Covenant§! or §YYezel Mora§!\nAre §YShadow Pact§!\nHave the §YThe Fog§! Province Modifier"
S90_alignment_tt: "Activates a Second Expansion Mission Slot.\nActivates the §PSoul§! Category of §PShadow Empowerments§!.\nYou may now select §YTwo§! §PShadow Empowerments§! per Category."
S90_akasi_assimilated_tt: "The §YAkasi§! Culture Group has been §YAssimilated§!."
