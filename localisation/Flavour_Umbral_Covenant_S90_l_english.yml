magic_project_umbral_covenant.65.t: "Divide and Conquer"
magic_project_umbral_covenant.65.d: "KOMINA joins our cause, influenced by the knowledge gained from the cube. Our bond will shape the outcome."
magic_project_umbral_covenant.65.a: "Welcome her fully"

magic_project_umbral_covenant.102.t: "Souls for the Spellcraft"
magic_project_umbral_covenant.102.d: "umorozi suggests using some subjects to fuel the ritual. Their advice could speed progress."
magic_project_umbral_covenant.102.a: "We still need them"
magic_project_umbral_covenant.102.b: "Unto the altars they go"

magic_project_umbral_covenant.103.t: "Mana Manipulation"
magic_project_umbral_covenant.103.d: "Cheni proposes channeling arcane power into the ritual. Sacrificing spellcasting may accelerate progress."
magic_project_umbral_covenant.103.a: "We need magic still"
magic_project_umbral_covenant.103.b: "The arcane serves my desire"

magic_project_umbral_covenant.104.t: "Unbind the Beasts"
magic_project_umbral_covenant.104.d: "Ikomeye suggests unbinding shadow warriors to fuel the ritual. Their strength may now serve us elsewhere."
magic_project_umbral_covenant.104.a: "They serve better in battle"
magic_project_umbral_covenant.104.b: "What we gave, we take again"

magic_project_umbral_covenant.105.t: "All I Am"
magic_project_umbral_covenant.105.d: "KOMINA proposes channeling my personal shadow to fuel the ritual. I must decide how far to give."
magic_project_umbral_covenant.105.a: "I will not surrender myself"
magic_project_umbral_covenant.105.b: "I give to become greater yet"



