#project events:
# SECRETS OF THE SPIRES - Magical Project 1

magic_project_umbral_covenant.1.t: "Monuments to What?"
magic_project_umbral_covenant.1.d: "What are the Zatsarya? I cannot yet fathom their purpose, but we must investigate."
magic_project_umbral_covenant.1.a: "Begin our inquiry"

magic_project_umbral_covenant.2.t: "Unearthly"
magic_project_umbral_covenant.2.d: "The Zatsarya's composition is alien. umorozi suggests careful study or perhaps a controlled blast."
magic_project_umbral_covenant.2.a: "Study cautiously"
magic_project_umbral_covenant.2.b: "Blast it and see what resists"
magic_project_umbral_covenant.2.c: "I will blast it myself (requires legendary evolution)"

magic_project_umbral_covenant.3.t: "Plumbing the Interior"
magic_project_umbral_covenant.3.d: "Ikomeye helps map the Zatsarya’s interior. Magical insight may reveal hidden pathways."
magic_project_umbral_covenant.3.a: "Study internally"
magic_project_umbral_covenant.3.b: "Hire extra teams for mapping"
magic_project_umbral_covenant.3.c: "Use legendary divination to see the unseen"

magic_project_umbral_covenant.4.t: "Drawn from Starlight"
magic_project_umbral_covenant.4.d: "Cheni channels power to probe the Zatsarya’s energy source."
magic_project_umbral_covenant.4.a: "Study the energy flow"
magic_project_umbral_covenant.4.b: "Portents might reveal the way"
magic_project_umbral_covenant.4.c: "Drain it directly using legendary necromancy"

magic_project_umbral_covenant.5.t: "A Relay?"
magic_project_umbral_covenant.5.d: "The Zatsarya may be a conduit—but to what? Testing with raw magic is tempting."
magic_project_umbral_covenant.5.a: "Just a small zap"
magic_project_umbral_covenant.5.b: "A concentrated surge"
magic_project_umbral_covenant.5.c: "Unlimited power"

magic_project_umbral_covenant.10.t: "The Bigger They Are"
magic_project_umbral_covenant.10.d: "The Zatsarya explodes! Its remains form a massive energy battery. Lizardfolk will never forgive us."
magic_project_umbral_covenant.10.a: "Rebuild and harness its power"
magic_project_umbral_covenant.10.custom_tooltip: "Unlocks Shattered Zatsarya monument"

# BORN OF ASHEN SKIES - Magical Project 2

magic_project_umbral_covenant.51.t: "The Weak Link"
magic_project_umbral_covenant.51.d: "The genie cube reacts to magic, but remains sealed. KOMINA's loyalty may be key to unlocking it."
magic_project_umbral_covenant.51.a: "Begin unlocking the cube"

magic_project_umbral_covenant.52.t: "Grounding"
magic_project_umbral_covenant.52.d: "Applying earth energy to the cube. EXTRA effort increases progress but costs resources."
magic_project_umbral_covenant.52.a: "Normal power"
magic_project_umbral_covenant.52.b: "Extra power (nation suffers until project end)"

magic_project_umbral_covenant.54.t: "Sublimation"
magic_project_umbral_covenant.54.d: "Fire energy courses through the cube. Powerful application may yield greater insight."
magic_project_umbral_covenant.54.a: "Normal power"
magic_project_umbral_covenant.54.b: "Extra power (nation suffers until project end)"

magic_project_umbral_covenant.55.t: "Hydration"
magic_project_umbral_covenant.55.d: "Water energy invigorates the cube. Riskier effort accelerates progress."
magic_project_umbral_covenant.55.a: "Normal power"
magic_project_umbral_covenant.55.b: "Extra power (nation suffers until project end)"

magic_project_umbral_covenant.56.t: "Vapourise"
magic_project_umbral_covenant.56.d: "Air energy is applied to the cube. Greater exertion may break its locks."
magic_project_umbral_covenant.56.a: "Normal power"
magic_project_umbral_covenant.56.b: "Extra power (nation suffers until project end)"

magic_project_umbral_covenant.53.t: "Come With Me"
magic_project_umbral_covenant.53.d: "I attempt to convince KOMINA to hear my side. Introducing friends may sway her."
magic_project_umbral_covenant.53.a: "Diviner"
