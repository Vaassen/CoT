#tooltips
S90_true_faith_tol_tt: "Tolerance of the True Faith at least §Y6§!."
S90_exploitation_tt: "All provinces meeting the conditions get '§YThorough Exploitation§!' until the end of the game, giving the following effects:\nLocal Goods Produced: §G+1.00§! and §R+5§! Local Unrest."
S90_immaterial_fabrication_unlock_tt: "Enables the §YImmaterial Fabriciation§! §PShadow Empowerment§!"
S90_female_advisor: "Have an employed Skill §Y3§! Female Advisor"
S90_tajan_unlock_tt: "Enables the §YTajan The Stormcaller§! §PShadow Empowerment§!"
S90_trick_of_the_light_unlock_tt: "Enables the §YTrick Of The Light§! §PShadow Empowerment§!"
S90_enchanting_embassy_unlock_tt: "The §YEnchanting Embassy§! Spell now increases §YTrade Efficiency§! by §G+10%§! per level and allows access to the §YImprove Inland Routes§! Trade Policy regardless of trade share."
S90_even_souls_kneel_unlock_tt: "Enables the §YEven Souls Kneel§! §PShadow Empowerment§!"
S90_festival_spell_buff_tt: "§YRituals§! now make the next spell cast §G50%§! Cheaper."
S90_the_end_tt: "§RThe Ritual is Complete§!"
S90_the_end_effect_tt: "§RYou Lose The Game.§!"
S90_shadow_empowerment_system_unlock_tt: "Enables the §PShadow Empowerment§! system, and unlocks the Spirit, Shadow and Dusk slots.\nShadow Empowerments may be selected via the Shadow Empowerment tab, accessible through the Government screen. Each §PShadow Empowerment§! has an upkeep cost in §PShadow Essence§!.\nConquer more regions to increase §PShadow Essence§! Capacity."
S90_fog_succor_tt: "§YRituals§! now reduce Corruption by §G2§! in addition to their usual effects.\nThe first time §YThe Fog§! is applied to a friendly province, it applies §YAfraid Of The Dark§! for 10 years, which has the following effect:\n§G-0.2§! Monthly Autonomy."
S90_harnessing_entropy_unlock_tt: "Enables the §YHarnessing Entropy§! §PShadow Empowerment§!"
S90_the_fog_unlock_2_tt: "Upgrades §YThe Fog§! Modifier, improving the effects and spreading it further. TODO"
S90_writings_of_serpent_king_tt: "Enables the §YWritings of the Serpent King§! §PShadow Empowerment§!"
S90_the_fog_unlock_tt: "Enables §YThe Fog§!.\n§YThe Fog§! is spread by forts into adjacent provinces.\nForeign provinces get reduced warscore cost and increased unrest, whilst friendly provinces get increased tax income and reduced unrest."
S90_what_lurks_in_the_dark_tt: "Enables the §YWhat Lurks In the Dark§! §PShadow Empowerment§!"
S90_viscus_of_the_desert_unlock_tt: "Enables the §YViscus of The Desert§! §PShadow Empowerment§!"
S90_war_for_the_mantle_of_shadow_complete_tt: "Have won the §PWar For The Mantle Of Shadow§!"
S90_fail_region_tt: "We have failed to secure enough of the region for ourselves to generate a rift."
S90_fueled_by_suffering_unlock_tt: "Enables the §YFueled By Suffering§! §PShadow Empowerment§!"
S90_soul_empowerment_slot_unlock_tt: "Activates the §PSoul§! Category of §PShadow Empowerments§!."
S90_cultural_assimilation_unlock_tt: "Enables the §YCultural Assimilation§! Mechanic.\n\nCulture Groups can be assimilated by Umbral Covenant under the following conditions:\nAll provinces belonging to the culture in Sarhal are:\nOwned by Umbral Covenant or Yezel Mora\nAre §YShadow Pact§!\nHave the §YThe Fog§! Province Modifier"
S90_alignment_tt: "Activates a Second Expansion Mission Slot.\nActivates the §PSoul§! Category of §PShadow Empowerments§!.\nYou may now select §YTwo§! §PShadow Empowerments§! per Category."
S90_akasi_assimilated_tt: "The §YAkasi§! Culture Group has been §YAssimilated§!."
S90_shadow_warrors_max_tt: "Have unlocked all 6 §YShadow Warrior§! upgrades."
S90_adrimya_assimilation_tt: "The §YBaashidi§! Culture Group has been §YAssimilated§!."
S90_witch_king_points_tt: "The Vile One has a §MMagical Infamy§! higher than Paragon."
S90_witch_king_points_event_tt: "§GEvent Insight:§!\nGreater Infamy may lead to greater rewards - afterall, what cares the lion for the thoughts of sheep?"
S90_secrets_of_the_spires_unlock_tt: "Enables the §YSecrets of the Spires§! Magical Project."
S90_spire_shatter_unlock_tt: "The §YZatsarya§! explodes, destroying the monument and replacing it with the §YShattered Zatsarya§! Monument.\nUnlocks the ability to destroy Spires via the province UI interface. Destroying Spires gives 300 Mana and removes the monument."
S90_all_i_am_tt: "Disables ALL §PShadow Empowerments§! for the duration of the §YMagical Project§!."
