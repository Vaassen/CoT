S90_shadow_empowerment_system_unlock_tt: "Enables the §PShadow Empowerment§! system, and unlocks the Spirit, Shadow and Dusk slots.\nShadow Empowerments may be selected via the Shadow Empowerment tab, accessible through the Government screen. Each §PShadow Empowerment§! has an upkeep cost in §PShadow Essence§!.\nConquer more regions to increase §PShadow Essence§! Capacity."
S90_fog_succor_tt: "§YRituals§! now reduce Corruption by §G2§! in addition to their usual effects.\nThe first time §YThe Fog§! is applied to a friendly province, it applies §YAfraid Of The Dark§! for 10 years, which has the following effect:\n§G-0.2§! Monthly Autonomy."
