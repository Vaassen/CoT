 #Events
 flavour_pashaine.1.t:0 "The Virtue Of Governance"
 flavour_pashaine.1.d:0 "The state we want to model can't be just anything. It needs to have virtue at its back. It needs to be *immaculately perfect*."
 flavour_pashaine.1.a:0 "We shall emulate the best!"
 flavour_pashaine.2.t:0 "Canonade Over Istralore"
 flavour_pashaine.2.d:0 "You need to be a lion and a fox, this time we were foxes and through our subterfuge we managed to convince the Empire that they are unable to protect themselves, let alone the rest af the Empire."
 flavour_pashaine.2.a:0 "What a pity..."
 flavour_pashaine.3.t:0 "The Chancellor Of The Empire"
 flavour_pashaine.3.d:0 "Whose legacy is the greater: the hero or the statesman? This is the principle question posed by centuries of thought along the Luna River, among the marginal Pashainéy who formed assembled bodies of aldermen and technocrats and produced very few legends. In other lands, the people dream of the rider at the head of the column, the one who charges forth. In Pashainé, we revere the clever seneschal.\n\nHe leaves his mark not in stories but in legislation; he may speak eloquently, but rarely stirringly. And yet, we must ask ourselves this: whose rules do we follow, many centuries hence, when we wake and go to market and must pay a penny on our daily wares? The hero wins a half hour of your attention at the tavern, at most. The statesman reaches into your purse, every single day of your life.\n\nThis is the principle of our new Imperial chancellorship. The tedious and the foolish question why we would forgo the opportunity to claim the Empire for ourselves – they do not recognise that we already have. Let foppish aristocrats sprawl their legs across the throne itself, while we rebuild the palace around them.\n\nThe first of our chancellors rises to [Root.Monarch.GetHerHis] feet. The ceremony is not terribly well-attended; it takes place in a wing of the Imperial palace more generally used for housing guests. No matter. The Empire will soon come to know the import of this moment."
 flavour_pashaine.3.a:0 "I solemnly swear..."
 flavour_pashaine.4.t:0 "Sons Of Wyvern And Sons Of Luna"
 flavour_pashaine.4.d:0 "As the Duchy of Verne is on the verge of destruction, we have to face a difficult question. What do these people mean for us? What is our connection in this mortal comedy? Are we..."
 flavour_pashaine.4.a:0 "...their brothers and protectors?"
 flavour_pashaine.4.b:0 "...their sons and successors?"
 flavour_pashaine.4.c:0 "Or perhaps naught but neighbors"
 flavour_pashaine.5.t:0 "Chancellor's Contest"
 flavour_pashaine.5.d:0 "Preposterousl After being nominated as the Chancellor of the Empire of Anbennar, Pashainéy have already started to leverage their position and contest our conquestsl They say that Acrcmton and Plumwall were illegal conquest in some fancy legalese."
 flavour_pashaine.5.a:0 "I guess we have to fold..."
 flavour_pashaine.5.b:0 "We cannot spit on the legacy of Lothane!"
 flavour_pashaine.6.t:0 "The Blue Luna"
 flavour_pashaine.6.d:0 "We dance in the halls of Port Munas, for the not just the Basin, not just whole Luna - the Loop, but the heart and the mouth of it. As we dance along the Luna, we look on it pearly waters and wonder is there anything that can break our ascension?"
 flavour_pashaine.6.a:0 "Just Dance"
 flavour_pashaine.7.t:0 "Legacy We Write"
 flavour_pashaine.7.d:0 "Some flavour about governments changing, Virtues changing and one of them being more focused. Will be very cool, like a treatise or a dialogue"
 flavour_pashaine.7.a:0 "Let Pashainé be Pashainéy!"
 flavour_pashaine.7.b:0 "We are the children of the Dame!"
 flavour_pashaine.7.c:0 "Bravery is our second name!"
 flavour_pashaine.7.d.1:0 "Restraint in all things"
 flavour_pashaine.8.t:0 "Pashainéy Fleet Doctrine"
 flavour_pashaine.8.d:0 "While we are primany a an - ocuse nation, our recent acquisitions of Port Cities on the Dameshead caused a rise of naval thought. There are two main ideas that clash -which one should we support?"
 flavour_pashaine.8.a:0 "Strike them quick, strike them hard!"
 flavour_pashaine.8.b:0 "We need to rely on elite captains!"
 flavour_pashaine.9.t:0 "Uncovering The Roots Of Rot"
 flavour_pashaine.9.d:0 "This rot, it wasn't something that has started in our halls, it must've been brought by some others. Some who wish our downfall. Who might they be?"
 flavour_pashaine.9.a:0 "We must get to the bottom of this!"
 flavour_pashaine.10.t:0 "Rummaging The Magisterium's Archives"
 flavour_pashaine.10.d:0 "While looking throuoh the letters from Mages residing in Luna Riverr we have indeed started to see a suspicious activity. At one point, the Magisterium noticed a large influx of Luna mages with tuitions payed by some guildsmen from Upper Luna. They all have ended their studies roughly a year before the attempted Coup"
 flavour_pashaine.10.a:0 "Destroy the archives, we got what we came for"
 flavour_pashaine.11.t:0 "The Trial"
 flavour_pashaine.11.d:0 "In the courthouse of Capital we have githered Mages that were caught during he Coup. As we start to interrogate them, it becomes more apparent that the leaders are awfully sure of themselves."
 flavour_pashaine.11.a:0 "Let the trial commence"
 flavour_pashaine.12.t:0 "Last Flight Of Mages"
 flavour_pashaine.12.d:0 "We knew they can't be trusted. We knew they were scum. Yet when the trial has started, they have begun by breaking the glass behind the judger killing him in the process with a ball of fire."
 flavour_pashaine.12.a:0 "So be it"
 flavour_pashaine.13.t:0 "The Verdict"
 flavour_pashaine.13.d:0 "We tried to be nice to them. We tried to reconcile our differences in a manner that suits our state. We have tried far too long. We have been too lenient. We have conceded too much. Mages have no place amongst us."
 flavour_pashaine.13.a:0 "Verdict: Hang Them All"
 flavour_pashaine.14.t:0 "Wexonard Secrets"
 flavour_pashaine.14.d:0 "Wex didn't participate in the Coupr at least it doesn't appear so. Nevertheless, they were trying to conquer the Luna River with Lothane gearing up to it. They however didn't expect that we would crush them first."
 flavour_pashaine.14.a:0 "We know a bit more...Destroy the rest of it"
 flavour_pashaine.15.t:0 "Promising Rumours"
 flavour_pashaine.15.d:0 "We have heard that Halessi mages are terrified of a thing celled Black Demestear, supposedly able to destroy the magical energies. We need to investigate it further."
 flavour_pashaine.15.a:0 "Send an expedition to Haless!"
 flavour_pashaine.16.t:0 "Tough Crowd"
 flavour_pashaine.16.d:0 "Our inquiry into the matter wasn't as easy as we had hoped it would be. It seems due to atrocities of The Command, the topic of Black Damestear, locally known as Korashi, is very sensitive."
 flavour_pashaine.16.a:0 "Scour the battlefields for remnants!"
 flavour_pashaine.16.b:0 "Attempt to seek informations on the markets"
 flavour_pashaine.16.c:0 "Abduct and interrogate someone"
 flavour_pashaine.17.t:0 "Korashi, One And Only"
 flavour_pashaine.17.d:0 "During our investigation, we finally managed to find an Oni that shared just enough with us, that we know where is the font of the material we covet."
 flavour_pashaine.17.a:0 "It will be ours!"
 flavour_pashaine.18.t:0 "Issue The Pashainéy Grievances"
 flavour_pashaine.18.d:0 "We must go to the imperial court to issue our grievances"
 flavour_pashaine.18.a:0 "Will they hear us?"
 flavour_pashaine.19.t:0 "The Pashainéy Outburst"
 flavour_pashaine.19.d:0 "Lucius síl Vallusna is a tall, spindly figure – from a distance it seems he might snap, were he to be dropped too aggressively. Yet even at rest there is a storm in his expression. A heavy brow wrinkles over a large, hooked nose, and even before he takes the rostrum, the bass thrumming of his powerful voice can be heard across the chamber.\n\n“Diet!” He does not honour this place with flattery. He calls the chamber’s name as though it were a duellist’s challenge.\n\n“Those among you who know your letters may know of my ancestor, the esteemed Tomás, who between his many works of statecraft once wrote, in a letter to a friend, that the guest who has been wronged must not allow the evening to end before confronting his host. It was the lightest of soirée advice, my fellow delegates, and yet it stays with me now.\n\n“This Empire is rotting, delegates! In Pashainé, we have watched as the mages of this Empire conspire to overthrow our legitimate government in service of an agenda which presses, in all places and at all times, against the will of the people. Perhaps you have looked upon us, fellow delegates, and smirked to see such perfidy trouble the folk of the Luna Valley! Indeed, I know you have! You scoff at the thought of scholar-mages planning anything beyond their next dissertation, just as the victims of Nichmer scoffed.\n\nMark my words, the rot will come for you. And when you ask, as we asked, for the natural aid of your rightful Emperor, you will find that the wood of the throne itself has been chewed right through – that the Empire upon which you rely is nothing but a patsy of the Towers, and that it is too late. Your apparently innocent scholars have friends in a hundred lands, and they despise the rule of any other.\n\nPashainé will not die with you, Emperor! When you cringe at the feet of whichever Witch-King rises from this abominable treason, we will not kneel alongside you! For shame!”\n\nIt is a staged movement, in its own way - the last act of the Imperial Pashainéy. The entire delegation leaves in unison, choreographed, yet the fury in their faces is real."
 flavour_pashaine.19.a:0 "This tottering Empire’s days are numbered"
 flavour_pashaine.20.t:0 "Chastening Of Pashainé"
 flavour_pashaine.20.d:0 "Pashainé have overstep in their role and caused a scandal during the Imperial Diet, directly threatening the Emperor and the Empire itself! For this grave insult only a war is enough."
 flavour_pashaine.20.a:0 "Glorious day for the luna river!"
 flavour_pashaine.21.t:0 "Demands Of The Second Nichmer"
 flavour_pashaine.21.d:0 "The second Nichmer, the flea-ridden pigeon that calls himself 3 Dove, the lapdog of mages, the jexisian tyrant has declared that we are to be chastened with spell and steel for our perpetration against the dignity of the Empire. It only confirms our presumptions - the rot has begun by infecting the head."
 flavour_pashaine.21.a:0 "Then that head needs to be cut off.."
 flavour_pashaine.21.b:0 "With this blade..."
 flavour_pashaine.22.t:0 "Chastening Of Pashainé"
 flavour_pashaine.22.d:0 "The Emperor has called an Imperial Wer against Pashainé due to their actions during the Imperial Diet. It seems that every Prince needs to decide on who they support - radicalists of Pashainé or the absolutist rule of the Emperor."
 flavour_pashaine.22.a:0 "Towards a prosperous Empire"
 flavour_pashaine.22.b:0 "The Empire forsakes its virtues!"
 flavour_pashaine.22.c:0 "This is none of our concern"
 flavour_pashaine.23.t:0 "Not Better Than Them"
 flavour_pashaine.23.d:0 "Scared by Mages rebellion, estates donrt want another overambitious group to rule. While some of them go as far as tp demand Artificers being kicked out, most of them ask for strict regulation and total state subservience of Artificers."
 flavour_pashaine.23.a:0 "We can control them"
 flavour_pashaine.24.t:0 "Ending The Shadow Play"
 flavour_pashaine.24.d:0 "We Pashainéy have made virtue of our discretion, but there is a point where discretion becomes mere meekness. The canny hostess may allow a slight or two to glance off her armour of lace, but there comes a point where her spine must not bend. This Empire! Our machinations and our legalisms have kept it upright; we have lacquered the rotting wood of this great structure with our fine words, enforced the rule of law upon so many petty princes, all in the name of a throne on which we agreed we would not sit.\n\nNo more! An end to clever metaphor, to fine words chosen carefully! We have been repaid for our imperial service with the machinations of mages, with the rancid plotting of the Tower, enabled by the Imperial Diet. Once we believed that the agenda of the would-be Witch Kings was simply a weevil in the grain, a regrettable malady which could be isolated and cauterised.\n\nWe were wrong.\n\nThis Empire has never truly purged the rot of Nichmer, the threat of arcane tyranny - the shaky consensus achieved at the end of the Wars of Rule simply left the mages to connive in their towers for centuries. No more will we play the part of the courtier, who seeks by subtle means to reform the realm. Instead we will forge the realm anew, sweep away the corruption of the magocratic establishment and replace it with a state of the people, constituted of the bodies and estates which make it great.\n\nThere will be no more Emperor, no more wheedling agents of magical autocracy. Instead, there will be unity."
 flavour_pashaine.24.a:0 "The dream is not dead - by these means, it is preserved."
 flavour_pashaine.25.t:0 "Blackpowder Trade Deal"
 flavour_pashaine.25.d:0 "We've bought Black Damestear from oni. Some people claim we made a deal with the devils. We claim that infernal pacts already exist in their nation and they are called"
 flavour_pashaine.25.a:0 "Ruin has come for them"
 flavour_pashaine.26.t:0 "Blackpowder Heist"
 flavour_pashaine.26.d:0 "We stole some Black Damestear. We can reverse engineer it and become a terrible enemy to all of the Mages."
 flavour_pashaine.26.a:0 "Ruin has come for them"
 flavour_pashaine.27.t:0 "Sack of [8.GetCapitalName]"
 flavour_pashaine.27.d:0 "Traditionally advancing armies have been expected to supply themselves from what they can plunder in the area they move through. This is often the only way for soldiers to survive in wartime as payments from the [Root.GovernmentName] treasury can rarely be brought in a timely manner to the men. In fact, by paying retroactively many also avoid the strain of paying for the fallen.\nAs [8.GetCapitalName] fell it was therefore expected that our soldiers be allowed to loot the city to enrich themselves. What was less expected was the total and utter destruction of the city that took place. Refusing to follow orders our men descended upon the helpless burghers, doing despicable things and ruining the area for a long time to come."
 flavour_pashaine.27.a:0 "We must punish the perpetrators!"
 flavour_pashaine.27.b:0 "We need better payment routines and harder discipline!"
 flavour_pashaine.27.c:0 "Such are the rules of warfare."
 flavour_pashaine.28.t:0 "Debate On Secular"
 flavour_pashaine.28.d:0 "Veridicals have engaged on a discussion about the organization af Ravelian State. Thev agree that we are the natural protector and that only we can make sure that Ravelianism will rise!"
 flavour_pashaine.28.a:0 "Speaker! It is only natural that you should come under our protection"
 flavour_pashaine.29.t:0 "The Union Of Secular And Divine>"
 flavour_pashaine.29.d:0 "[From.GetName] has proposed for us to become their subject, seeing as we cannot hope to defend ourselves from great threats of this world."
 flavour_pashaine.29.a:0 "Speaker! It is only natural that you should come under our protection"
 flavour_pashaine.29.b:0 "Who do they think they are!"
 flavour_pashaine.30.t:0 "The Union Of Secular And Divine"
 flavour_pashaine.30.d:0 "loc depending on rejected or not"
 flavour_pashaine.30.d.1:0 "loc depending on rejected or not"
 flavour_pashaine.30.a:0 "Virtous and Holy!"
 flavour_pashaine.30.b:0 "This wasn't a question"
 flavour_pashaine.31.t:0 "Unity"
 flavour_pashaine.31.d:0 "As the last sounds of cannons and muskets fall silent, they are replaced by a triumphant roar of soldiers. Gone is the old Empire, rotten and broken. The time has come for a stater a state for all Anbennarians!"
 flavour_pashaine.31.a:0 "Unity at long last"
 flavour_pashaine.32.t:0 "The Symbols Of New Anbennar"
 flavour_pashaine.32.d:0 "The soldiers have haphazardly come to the generals and civil leaders. Pashainéyr occasional Damerians. All Vernman, wearing similar colours, but not the same. If we want to achieve true unity, we need also a unifying symbol."
 flavour_pashaine.32.a:0 "We will done the shade of Blackpowder"
 flavour_pashaine.32.b:0 "We will carry on the Silver Legacy"
 flavour_pashaine.32.c:0 "We will bear the colour of Luna"
 flavour_pashaine.33.t:0 "New Age Of Virtue"
 flavour_pashaine.33.d:0 "As the principles of Enlightenment reach our state, we realise that our values must change accordingly. Simply staing in the past will cause us to wither and die like other states of Cannon We must adapt and overcome the chellenges of our times!"
 flavour_pashaine.33.a:0 "We are the spears that breaks the ancien regime!"
 flavour_pashaine.34.t:0 "One People, One Faith"
 flavour_pashaine.34.d:0 "Republic = a walk through one of many parks of the city and comparing ruling over the state to ruling over the souls and vice- versa, much more down to earth."
 flavour_pashaine.34.d.1:0 "Monarchy - Napoleon crowning moment"
 flavour_pashaine.34.a:0 "We must carry on the torch of Ravelianism and Freedom"
 flavour_pashaine.35.t:0 "Cry The Cries Of Freedom"
 flavour_pashaine.35.d:0 "A speec a out t e poor co cruze people of Aelantir who toil for the swines in Can nor. Government of ROOT thus organizes e campaign to inform them thatr in factf they could and should rebel against their opressors."
 flavour_pashaine.35.a:0 "Rise against your opressors"
 flavour_pashaine.36.t:0 "Unity Realized"
 flavour_pashaine.36.d:0 "We are Anbennar, from many - one. None may stand against us - the world revolves around our whim - now actino in unison."
 flavour_pashaine.36.a:0 "Towards a brighter future!"


 #Disaster Events
 flavour_pashaine.1000.t:0 "On Power Of Magic And State"
 flavour_pashaine.1000.d:0 "Calling Escann the wild corner of Cannor is certainly justified by what has happened there. As time has passed, the kingdoms founded by adventurers strayed further and further from rules imposed by Magisterium. The effect? Crazy Witch-Kings. Some madman has published a book about this that recently has gotten great traction."
 flavour_pashaine.1000.a:0 "Launch a counter campaign!"
 flavour_pashaine.1000.b:0 "It will be fine..."
 flavour_pashaine.1001.t:0 "Secret Conclaves Of Magi"
 flavour_pashaine.1001.d:0 "Mages never were the most integrated part of our government, but recently they have started to conduct an alarming amount of conclaves without the possibility to inquire about the contents of them."
 flavour_pashaine.1001.a:0 "Order them to stop this madness"
 flavour_pashaine.1001.b:0 "It will be fine..."
 flavour_pashaine.1002.t:0 "Troubling News"
 flavour_pashaine.1002.d:0 "Our spies have reported to us that during one of the conclaves they managed to break into, they here overheard the term "Prelude to Greatness". It seems the Mages plan to start a coup through planting their own people in the government."
 flavour_pashaine.1002.a:0 "Tough times await us"
 flavour_pashaine.1003.t:0 "The Game Is Set"
 flavour_pashaine.1003.d:0 "We who know the value of a game deftly played are also well-placed to recognise when the game has escaped our control. It is a subtle thing, this shift in mood. Judgements we expected to go our way at the Diet are suddenly adverse; doors close where they once opened. Our merchants are isolated, our envoys turned away. Educated opinion, that herdable thing, turns in favour of the mage elite.\n\nThe fear we feel now is a one we know well, for it is the kind we usually intend to inflict. These smoke-filled rooms into which we cannot see, the private organisation of mages and their lackeys – their scheming has placed them well ahead of us, and we must reluctantly come to terms with the plain truth that they know our disposition better than we know theirs.\n\nThe curtain must fall. We can no longer hope to tiptoe around, to end this threat by the subtle manipulation of politics. The magocrats have finally taken their place at the table – it would be unspeakably rude to deny them their game."
 flavour_pashaine.1003.a:0 "Let us play"
 flavour_pashaine.1004.t:0 "The Game Ends"
 flavour_pashaine.1004.d.1:0 "The mages are defeated. Their grætness blotted before it has started to shine, We rise from the conflict wounded, but not deed. Different Loc depending on if took Emergency Powers or not."
 flavour_pashaine.1004.d.2:0 "The mages are defeated. Their grætness blotted before it has started to shine, We rise from the conflict wounded, but not deed. Different Loc depending on if took Emergency Powers or not."
 flavour_pashaine.1004.a:0 "Greatness Achieved"
 flavour_pashaine.1005.t:0 "A Way Out?"
 flavour_pashaine.1005.d:0 "Our administration and parliament are riddled with hostile elements who wish to destroy our nation. The only step we can do is for central authority to seize the power for the time being in order to deal with the internal enemy that we face, lest we all perish."
 flavour_pashaine.1005.a:0 "We shall do what has to be done"
 flavour_pashaine.1006.t:0 "Curbing Influence Of Mages"
 flavour_pashaine.1006.d:0 "Our administration and parliament are riddled with hostile elements who wish to destroy our nation. The only step we can do is for central authority to seize the power for the time being in order to deal with the internal enemy that we face, lest we all perish."
 flavour_pashaine.1006.a:0 "We shall do what has to be done"
 flavour_pashaine.1007.t:0 "Breaking Their Powerbase"
 flavour_pashaine.1007.d:0 "A mage tower is not merely a building. It is a symbol of secrecy, of aloofness, of unaccountability, For centuries, these spires have risen unchecked across our borders: silent fortresses of a rival order where arcane cabals write their own laws, train their own heirs, and chert their own futures without so much as a glance toward Pashainé."
 flavour_pashaine.1007.a:0 "Tear them down!"
 flavour_pashaine.1008.t:0 "The Artificers Reach Out"
 flavour_pashaine.1008.d:0 "In our fight against unbound sorcery, we have too Iono ignored our allies not of spell or staff, but of gear, gauge, and guided flame. Artificers, engineers, mechanicians these are minds untainted by conjuration, yet capable of invention beyond the grasp of even the oldest spellbooks."
 flavour_pashaine.1008.a:0 "Perhaps we have just found our greatest ally"
 flavour_pashaine.1009.t:0 "Taking Their Reagents Away"
 flavour_pashaine.1009.d:0 "The time has come to recognize that the war upon sorcery is not waged solely in open field or parliamentary wordplayn It creeps in the holds of foreign ships, in the pouches of wandering healers, in vials hidden among bolts of cloth and amphorae of wine."
 flavour_pashaine.1009.a:0 "Our markets will recover. Mages will not."
 flavour_pashaine.1010.t:0 "Steel Before Sorcery"
 flavour_pashaine.1010.d:0 "We bled for this land with spear and sword, musket and cannon. Our tactics were born in mud, not conjured in ivory towers. Yet today, we are told that valor is obsolete. Magic is not progress, for a republic of laws must not be defended by constructs without loyaltyy nor commanded by those who know nothing of command."
 flavour_pashaine.1010.a:0 "We salute thee, brave guards of Order"
 flavour_pashaine.1011.t:0 "Lifting The Air Of Mistrust"
 flavour_pashaine.1011.d:0 "The internal mistrust that permeates the parliament makes it impossible to act in any unified manner. If we want to end this farce of mages, we need to keep our members of parliament as safe as possible in a grand complex, fit with wards. until this madness ends, they shall not leave."
 flavour_pashaine.1011.a:0 "Bid farewell to your families"
 flavour_pashaine.1012.t:0 "Advisor Is A Mage-Aligned Traitor"
 flavour_pashaine.1012.d:0 "Thee recent actions of one of our advisors have provoked suspicion among the populace. They say hat they are a mage-aligned traitor, who wishes or magocratic elements to overthrow the rightful government of Pashainé, While they say that this notion is ridiculous, we are not sure."
 flavour_pashaine.1012.a:0 "Oust him immediately!"
 flavour_pashaine.1012.b:0 "They can't be a traitor!"
 flavour_pashaine.1013.t:0 "Suspicious Guest"
 flavour_pashaine.1013.d:0 "A new foreign emissary has arrived at the capital, but their behavior seems off. They speak cryptically and have a strangely calm demeanor, even when confronted with matters of state. Rumors circulate that they may be more than just a diplomat."
 flavour_pashaine.1013.a:0 "Kill them at once and search quarters!"
 flavour_pashaine.1013.b:0 "We must respect the protocols"
 flavour_pashaine.1014.t:0 "Ruler Conspires With Mages"
 flavour_pashaine.1014.d:0 "In the midst of rising tensions, the chamber is left divided, A few whisper that the ruler has made e pragmatic decision in times of need, others believe darker motives may lurk beneath the surface, suggesting the beginning of a secretive pact that could alter the course of the realm. One is certain ruler was seen to close to the mages."
 flavour_pashaine.1014.a:0 "What!? Baseless rumors!"
 flavour_pashaine.1014.b:0 "Death to the old order!"
 flavour_pashaine.1015.t:0 "Unexplained Failures In Key Infrastructures"
 flavour_pashaine.1015.d:0 "Key infrastructure projects, such as bridges or military supply routes, are failing under mysterious circumstances. Some blame sabotage, while others claim it's the work of rogue mages seeking to destabilize the realm. The exact cause is still unclear, but the disruptions are starting to have severe consequences."
 flavour_pashaine.1015.a:0 "Blast it!"
 flavour_pashaine.1015.b:0 "We need to counteract it!"
 flavour_pashaine.1016.t:0 "Losing Faith In the Government"
 flavour_pashaine.1016.d:0 "The tension in the capital is palpable. Across the cityy from the grand halls of Parliament to the crowded markets, murmurs of dissatisfaction have reached a boiling point, Citizens who once trusted the government now question its decisions, particularly as the influence of mages and secretive dealings seem to grow,"
 flavour_pashaine.1016.a:0 "We have it under control!"
 flavour_pashaine.1016.b:0 "Shoot down the dissidents"
 flavour_pashaine.1017.t:0 "Magic-Fueled Psychosis In The Streets"
 flavour_pashaine.1017.d:0 "The streets have become a hotbed of strange occurrences: spontaneous fires, objects moving 'without explanation, and strange voices in the air Some believe it's a sign of growing mage power in the city, while others claim itrs a deliberate act of sabotage to spread fear and confusion. Either way, public unrest is rising."
 flavour_pashaine.1017.a:0 "Damned mages!"
 flavour_pashaine.1018.t:0 "Importing Illegal Magical Goods"
 flavour_pashaine.1018.d:0 "Smugglers have found ways to bypass customs checks, bribing officials or using clever disguises to hide their shipments of forbidden reagents, enchanted weapons, and dangerous artifacts. The black market is thriving, and these contraband goods are quickly making their way into the hands of mages, criminals, and other shady factions."
 flavour_pashaine.1018.a:0 "Cube damn it"
 flavour_pashaine.1019.t:0 "Recruits Fear The Mages"
 flavour_pashaine.1019.d:0 "As the corrupt agenda of the mage lobby has become increasingly clear, the rank-and-file soldiery of Pashainé have become increasingly wary of their mage comrades, fearing the undue influence of these mages and the possibility of illusionary subversion or even simple extortion. Mages have long held themselves apart from other sections of the military, reserved for special operations, and this distinction continues to breed profound distrust.\n\nDesertion rates grow, as does a grassroots military movement arguing for the removal of mages from the ranks altogether. It is clear that the mage cadres are growing increasingly unpopular."
 flavour_pashaine.1019.a:0 "We don't need craven recruits"
 flavour_pashaine.1019.b:0 "Sweeten the enlistment packages"
 flavour_pashaine.1020.t:0 "Charmed MoPs"
 flavour_pashaine.1020.d:0 "It is a testament to the strength of our Parliamentary system that it continues to function during crisis – that we have not fallen prey to the autocrat fallacy which pervades the arrogant Witch-Kings of this world. Our openness is vulnerability as well as strength, however, and we must be ever vigilant against the mind-altering corruption of the School of Illusion, which seeks to subvert the representative process.\n\nIn recent days, the corporatist clique have brought us alarming reports of a Member voting against his clique to weaken the privileges of the Arkwright’s guild in Napesbay. Such a profound reversal in a Member who is normally staunchly defensive of guild rights is a worrying sign of magical alteration, and many are calling for the Member to be immediately impeached."
 flavour_pashaine.1020.a:0 "Revoke his rights!"
 flavour_pashaine.1020.b:0 "Launch an investigation only!"
 flavour_pashaine.1021.t:0 "Appeal To The Emperor"
 flavour_pashaine.1021.d:0 "We Pashainéy have done much for the Empire. As active participants in Imperial decision-making and enthusiastic self-advocates, we have greased the wheels of the Diet and built up both a strong reputation for diplomacy and a respect for our tenacity. It is time we cashed these in.\n\nThe situation in Pashainé cannot be allowed to continue. Magical subversion and the anti-democratic influence of magical lobbies undermine our very way of life, eroding the institutions which make Pashainé great. We will not be made into some arcane autocracy, chafing under the whim of some addled, megalomaniacal scholar. We must call upon the Empire to intervene in our favour, chastening the mages and bringing seditious elements to heel.\n\nThe letter is signed; the Diet is addressed. Soon, we will know if the Empire truly values those who hold it up."
 flavour_pashaine.1021.a:0 "We must hope for the best"
 flavour_pashaine.1022.t:0 "Letter From Pashainé"
 flavour_pashaine.1022.d:0 "The petition arrived in Anbenncost draped in alarm: a frantic letter from one of the Empire's many fractious states, claiming that mages have infiltrated its institutions and that civil order teeters on collapse. It pleads for troops, decrees, and intervention."
 flavour_pashaine.1022.a:0 "The Empire trusts in your ability to restore order without our direct involvement"
 flavour_pashaine.1023.t:0 "Ask For Imperial Help"
 flavour_pashaine.1023.d:0 "Weeks pass. Finallyr a sealed letter arrives bearing the Imperial seal. The message within is formal and polite—but resolute. The Emperor will not intervene. In "internal troubles" the missive states, "must be resolved by internal strength. The Empire is a shield, not a crutch." Different Loc, more about betrayal if allied."
 flavour_pashaine.1023.d.1:0 "Weeks pass. Finallyr a sealed letter arrives bearing the Imperial seal. The message within is formal and polite—but resolute. The Emperor will not intervene. In "internal troubles" the missive states, "must be resolved by internal strength. The Empire is a shield, not a crutch." Different Loc, more about betrayal if allied."
 flavour_pashaine.1023.a:0 "You bastards!"

