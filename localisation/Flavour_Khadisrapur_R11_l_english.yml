 #Events
 khadisrapur.0.t:0 "The Lone Hero"
 khadisrapur.0.desc:0 "The last ones of the first ones” Is how everyone describes us after the savage Orcs and their Hoggoblin commanders smashed their way through the Shamakhad kingdoms on an almost unending invasion. Only ruins are left after The Command got tired, and the dust settles. Only Ruins and... US...\n\nWe, as much as our cousins, enjoyed decades of decadence, as we traded, bickered, and occasionally schemed and fought against each other. But none of those past conflicts were anything like what the Command brought to Rahen. Armies after armies, settlements after settlements were sieged and defeated and ruined. All pleas and wishes to organize landed on deaf ears as panic between our kingdoms spread much like the Command's troops...\n\nBut that´s the past. This defeat is a wake-up call for the last of us. We will rebuild upon the remains and take down the Command! With a clear goal on the horizon, and revenge burning within our hearts, much like the settlements that Command conquered. We shall challenge the very fate itself! But one question remains, my lord...\n\nShall we challenge fate and fortune alone, or shall we assemble a mighty coalition and defeat the Command with other brave heroes?"
 khadisrapur.0.a:0 "Our people failed to stop the Command once. And our people shall rectify that!"
 khadisrapur.0.b:0 "Only a coalition of heroes can take down such savage power!"
 khadisrapur.1.t:0 "The Return of Himmat the Hero"
 khadisrapur.1.d:0 "During the apex of the hobgoblin invasion in 1434, a number of nobles revolted against the ruling Jamma II Pirvand, rising in support of crown prince Balkevir Pirvand. The younger son of Jamma II, Balke became crown prince when his older brother, Himmat, relinquished his claims to the throne and chose the life of an adventurer. The young Balke was concerned by his aging father's reluctance to aid the faltering kingdom of Raghajandi, whose king was his wife's father. But Balke did not have the support of the army, which remained fiercely loyal to Jamma, and so he, his wife, and their supporters were defeated and sentenced to exile. In this way did Jamma II lose both of his sons.\n\nThat was a decade ago, and Khadisrapur has endured much in these ten long years. Now, though, the elder scion of the royal family has returned. The long-lost Himmat Pirvand has made his way to his father's court and now kneels before his father's throne to offer his services to his ailing fatherland. He is not alone; accompanying Himmat are the many mercenaries and adventurers he befriended in his travels. The man has changed - gone is the flamboyant firestarter, eager to prove himself. Instead, Himmat is now an experienced veteran and a hero of the people. He comes with radical ideas to modernize the military and has only one condition for his aid - that his younger brother be allowed to return to fight by his side."
 khadisrapur.1.a:0 "All heroes are welcome! Pardon Balke!"
 khadisrapur.2.t:0 "The Last Princess"
 khadisrapur.2.desc:0 "The tale of princess Kerita Deryajandi is one of dignified tragedy. Born into the bosom of the royal family of Sarilavhan, she grew up surrounded by her parents, siblings, aunts, uncles and a whole gaggle of cousins. Yet the hobgoblin invasion mercilessly culled the Deryajandi dynasty until only Kerita was left, saved only due to her being in the safety of the royal palace in Khadisrapur with her husband prince Balkevir.\n\nNow that we have wrested control over our ancestral lands back from the Command, restoring the princess to her family’s throne is not only the honorable thing to do, but chasing the hobgoblins from their stronghold in Sarilavhan as our next step in the reclamation of Shamakhad is essential for our own long-term survival.\n\nAs there is no other legitimate claimant to the lands of Sarilavhan, establishing Balkevir and Kerita as governors of her former homeland under the throne of Khadisrapur - once the hobgoblins have been vanquished once more -  should not be met with serious opposition, neither from the people of Sarilavhan nor our neighbors. This way, we can redress an injustice and expand our reach in one fell swoop."
 khadisrapur.2.a:0 "We shall serve justice on your behalf, Princess."
 khadisrapur.3.t:0 "The Northern March"
 khadisrapur.3.desc:0 "The lands to the east of the upper Yanhe have for the longest time been ruled by the kingdom of Ghatasak. But as with many other former ruin kingdoms, Ghatasak was inundated by the tidal wave of hobgoblins pouring out of their mountains.\n\nOnly by sheer luck did part of the royal family of Ghatasak manage to escape the demise of their homeland and eventually found their way to Khadisrapur. Of course we were honorbound to grant them shelter at our royal court.\n\nNow, as the hobgoblin chimera has been forced to retreat and cede many territories they have unjustly occupied, the head of the Ghatasaki royal family in exile has come before [Root.Monarch.GetName] to plead their case.\n\nThey offer to swear fealty to the throne of Khadisrapur and serve loyally as our governors of their homeland, legitimising our control over Ghatasak, if only we lend them the support of our valiant armies and banish the Command from their former lands."
 khadisrapur.3.a:0 "Onwards to Ghatasak, brave warriors of Khadisrapur!"
 khadisrapur.4.t:0 "Our Southern Comrades"
 khadisrapur.4.desc:0 "Reinvigorated by our recent successes against the Command, the brave heroes of Tilathi have expressed their fervent desire to join us in our next campaign against the hobgoblin menace and regain their lost eastern lands. When news of this reached the royal court it was met with enthusiastic approval.\n\nYet it appears that their masters in Sarnavan have other plans and are firmly opposed to any action that might bring the Command’s retribution down on them. So whatever their original intentions, it appears that the stalwart people of Tilathi might have to free themselves from their chains before they can liberate their eastern brethren."
 khadisrapur.4.a:0 "Who are we to keep them from fighting to regain what is rightfully theirs?"
 khadisrapur.5.t:0 "Onwards!"
 khadisrapur.5.desc:0 "Only a scant few years ago it appeared as if the yellow-bellied naysayers and gutless would-be collaborators might be proven right. Khadisrapur, the last, greatest heroic realm of Shamakhad, was pushed to the brink. Yet the flame of true courage never ceased to burn brightly within the breasts of all true Khadisrapuri patriots, and under the inspired guidance of [Root.Monarch.GetName] we achieved what no one but us thought possible - we not only halted the hobgoblins in their seemingly inexorable advance, but we pushed them back and freed many lands whose inhabitants had suffered under their yoke.\n\nOne such land was Sarilavhan, which has since flourished under the gentle yet firm rule of its last princess and her heroic spouse, both of whom have proven their value to our cause over and over."
 khadisrapur.5.a:0 "This is but the first of many victories!"
 khadisrapur.6.t:0 "Voice of Tilathi"
 khadisrapur.6.desc:0 "The brave men of Tilathi have been in a dire situation not unlike ours, having lost much of their homeland to the dread hobgoblin chimera and its minions. Yet fate has blessed us, as we did not have to bear the chains of servitude to Sarnavan as well.\n\nBut their voice still rings out loud and clear, calling upon all righteous lords to join them and bring the fight to the Command. Those with courageous hearts cannot but see the justness of their cause, yet their chicken-hearted masters in Sarnavan have closed their ears to the pleas of those they swore to defend and protect.\n\nThis will stand no longer - the court and the people stand united and are ready to march in aid of liberating our brave Tilathi brothers from the shackles keeping them from joining us in our righteous campaign against the Command. The only question that remains is whether we should rely upon the honour of Sarnavan’s allies to stay out of this fight, or if we need to apply our considerable prestige gained by our recent victories to shame them into doing the right thing."
 khadisrapur.6.a:0 "Our place is at the side of the daring Tilathi, let them all try to stop us!"
 khadisrapur.6.b:0 "The struggle of Tilathi is righteous and shame on everyone who attempts to keep them down!"
 khadisrapur.7.t:0 "Heroes End Slavery!"
 khadisrapur.7.desc:0 "We have foolishly handed control over our slaves to the adventurers, many of whom believe themselves heroes of the underclass. Now one faction seeks to manumit them by force, while another is okay with paying us for a promise to not enslave more people."
 khadisrapur.7.a:0 "Try it and see!"
 khadisrapur.7.b:0 "We'll take that deal..."
 khadisrapur.8.t:0 "Thunder Strikes, Blood Spills!"
 khadisrapur.8.desc:0 "The Command did not bring only destruction upon our lands. But also Orcs! Savage tribals from the mountains that are only blessed with strength, and that´s all. With no commanders that bark orders at them like dogs, and that's not the only trait, they are lost like puppies too. Barely understand us, barely know how things work around, and only have a penchant for fighting, and surprisingly, honor too. Poor fools, forced to live in strangers' lands.\n\nAs much as their very livelihoods are sad, we can't let them live in our core lands... But there is hope. Those who are loyal to us, to our cause, and swear upon their honor to stay loyal or be punished by death, shall be given a new home in the highlands of Shamakhad. Those who disobey shall be reintegrated into the very ground from whence they came from.\n\nThe decision is final and we shall message the surviving orcs."
 khadisrapur.8.a:0 "We won't kill you, but you can't stay here..."
 khadisrapur.9.t:0 "The Long March Begins"
 khadisrapur.9.desc:0 "With the recent event, and dealing with the Orcs and the few remaining leaders. They started to assemble in huge cohorts and groups. Preparations before their march towards the Highlands shall start soon. As we made it clear, the highlands are theirs, their new homes. Giving some desperately needing space between our and their people to calm down spirits.\n\nBut such journey won't be easy, at least for us Shamakhadi people. Roads and forests are filled with bandits, wanna be heroes, wolves, and potential spirits. But the Orcs? They are hardy people. Both Bloodsong and Thunderfist Orcs have shown their prowess on the battlefield. We still had our doubts, but the moment that they heard about them getting a home, they suddenly gained a spark of life within their hollow eyes. A determination to live, and no obstacle will stop them in their long journey ahead. With only a handful of guides, they make their way to their new future."
 khadisrapur.9.a:0 "It's for the best to give them a new home."
 khadisrapur.10.t:0 "The Journey North Continues"
 khadisrapur.10.desc:0 "The march continues. Nothing that the Orcs did not experience in the past with the hobgoblins. Wolves are turned into food and pelts, bandits merely combat practice, and the occasional foolish hero is shown his place. Either by the documents our guides provided or the martial strength of the Orcs. But the biggest obstacle on their journey is the terrain and the hobgoblin settlements. The highlands offer solid defence to anyone inhabiting these lands. Not to mention to undeveloped roads up high cause plenty of casualties to the Orcs too.\n\nWhen they arrived on top, our guides were worried about the well defended remaining hobgoblin settlements. But unlike the roads and paths up the highlands. The Hobgoblins were but a minor annoyance to the Orcs. They smash through the gates of these settlements like they were made of paper. The hogbolin guards were torn to bits by their savage hands. Seeing them getting revenge upon their past overlords causes them to enter into a blissful rage. Roars of hate and joy echoed through the highlands for days and months onwards as they took over, settlement by settlement."
 khadisrapur.10.a:0 "Seems like it was a wise choice to give the Orcs their personal space…"
 khadisrapur.11.t:0 "The Long Journey North"
 khadisrapur.11.desc:0 "Orcs and Rahen are an oddwordly combinations. Same goes with the interaction between Raheni people and the Orcs as they travel our freed countryside. The only thing that they seem to respect and honor are our temples, but even that are at odds with their rather loud ways of pay what we assume respect, or them destroying precious pottery and porcelain as an offer to the spirits…\n\nThe oddest encounters are with orcs and bandits. Which can go both ways as orcs pay most of their attention in strength matches or duels. In one moment these Orcs can help lone Heroes or caravan guards attacking bandits. In some other cases They help the bandits when the bandit leader takes down the opposing leader, be it a guard, soldier, adventurer or even Hero. Does not matter who it is, but the stronger one is the righteous one in their eyes…\n\nOur advisors are similarly confused about how to deal with them. Some advocate teaching and converting them to our religion to bring understanding and unity between our people. Others recommend letting them continue their Orcish practices and perhaps learning something from their religious practices to strengthen our unity. What shall we do?"
 khadisrapur.11.a:0 "One faith united the people in Rahen, so shall it with the Orcs too!"
 khadisrapur.11.b:0 "Unity through plurality!"
 khadisrapur.12.t:0 "The Letter of Triumph"
 khadisrapur.12.desc:0 "Several days and nights were spent on writing this letter of triumph over the Command. Careful thinking about each word, each letter, and its impact upon the letter as a whole. More time was spent on thinking alone than writing. Countless pieces of precious paper were wasted. The grandeur, the length, and any errors were harshly dealt with, and yet no words came out from the pen. How could a writer even describe what happened in Shamakhad? How we gloriously defeated The Command with. How each battle was carefully chosen, how each siege was planned for days.Armies dancing back and forth through our lands. There was simply no way to put all that into one simple and cohesive letter. But after several sleepless days. The writer finally got an idea.\n\n“We were the last among the first to be defeated by the Command. Now we are the first to claim the victory over them, I hope you won´t be the last to come and see our triumph.”"
 khadisrapur.12.a:0 "Sincerely, [Root.Monarch.GetTitle] [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName]"
 khadisrapur.13.t:0 "An Unexpected Reply"
 khadisrapur.13.desc:0 "Among all letters coming into the capital, [Root.Monarch.GetName]  did not expect to receive one from the Bloodsong Orcs. At first [Root.Monarch.GetName] thought that this might be a prank or someone jealous of our Heroic victory over the Command.\n[Root.Monarch.GetName] wanted to toss the letter into the trash, but… curiosity struck the Elephant, and got up and took a quick read. Ahem:\n\n“The only thing first that you guys are is biting the dust on the battlefield! After we come back, we make sure that there will be only dust too in your lands!”\n\n[Root.Monarch.GetName] eyes were twitching. Quickly, crumbling the letter and tossing it to the side, and sitting down. Hunched forward with an annoyed look as they took some time on what to do or reply. One of the many courtiers picked up the letter. After all, there is no littering, but at the same time also took a quick glance at the latter. His face went pale before turning red with hate as he remembered his home in Tilathimen was burned down by the Bloodsong Clan. “MY LORD!” he barely managed to wrangle out some words, but [Root.Monarch.GetName] knew already the answer."
 khadisrapur.13.a:0 "TIME TO DESTROY THEM!"
 khadisrapur.14.t:0 "Dissolution of the Bloodsong"
 khadisrapur.14.desc:0 "We've occupied the Bloodsong. Now we will hunt down those savages until they no longer exist"
 khadisrapur.14.a:0 "Oof"
 khadisrapur.15.t:0 "A Heroic Victory"
 khadisrapur.15.desc:0 "We can form our formable now! In the future this might screw with our MT but right now it's A-OK."
 khadisrapur.15.a:0 "The sword and the mantle!"
 khadisrapur.16.t:0 "Cowardly Peons"
 khadisrapur.16.desc:0 "It pains me, your most humble servant, to bother you, my most noble lord, with the insignificant troubles encountered by this most unworthy servant. Yet I would be remiss in my duties if I did not report the worrisome developments that agitate the orcish laborers in your mines as of late. They are an honest and hardworking lot, yet desperately superstitious, and rumours of inexplicable noises and half-seen beings haunting the deepest mine shafts have made the rounds among them, driving them into a frenzy of superstitious dread where some even dare to refuse to enter these parts of the mine. I would have dismissed these reports as fanciful delusions if I did not receive credible reports that other mines in this and neighboring provinces are suffering from similar unrest.\n\nWhile for now the miners continue to do their duty, I fear what may happen if these mysterious disturbances were to persist. As the deepest parts of our mine is filled with clefts connecting them to deep caverns leading to places only the High Gods may know, it is beyond the abilities of this humble servant and his capable retinue of overseers to uncover the cause of these hauntings.\n\nIt is with a heavy heart that I therefore implore you to send aid, we are in desperate need of courageous heroes who can put an end to these unwanted intrusions.\n\n   -report of Balbir Janda, chief mine overseer, Khuhatamba mining camp, Tamvihar province"
 khadisrapur.16.a:0 "Hand out the spelunking gears!"
 khadisrapur.17.t:0 "The Treaty of Sarnihanpur"
 khadisrapur.17.desc:0 "Border and boundary agreement with [rajnadhaga_or_was_rajnadhaga_target.GetName]"
 khadisrapur.17.a:0 "Signed"
 khadisrapur.18.t:0 "Aves Son of Maji the Quilter"
 khadisrapur.18.desc:0 "Aves was born into a modest household, raised by a humble and honest quilter in the town of Taraja, south of Khadisrapur. In his younger years, he proved himself a formidable thrower in the local ball-throwing games, even challenging one of the old Sharaajaghaal champions and nearly defeating him. Yet the life of a sportsman was not his calling, and Aves soon found himself taking on various maintenance jobs for wealthier patrons.\n\nOne day, while repairing a magelight caster for a prominent local mage, Aves had an idea. If these magelights could be stored in some sort of bubble, and infused with enough mana within that same container to sustain the spell, it might be possible to illuminate an entire room using a single, basic enchantment. Intrigued, the mage agreed to let Aves experiment with some of his tools.\n\nAt sunset one evening, near the mage’s modest shop in the bazaar, a curious crowd began to gather. After many failed experiments, Aves stood ready, holding a long, thick cord made of carefully woven silk, several shimmering bubbles suspended along its length.\n\nHe tied the string between two pylons, the glowing orbs swaying gently in the air. Stepping back, he gave the mage a small nod. The mage took an unusually long time to cast his spell—but then, suddenly, the bubbles flared to life, bursting with radiant light. The entire square was transformed. The crowd stood in astonishment as new possibilities—vast as the sky—dawned upon them."
 khadisrapur.18.a:0 "Yippee!"
 khadisrapur.19.t:0 "Heroes Guild of Rahen"
 khadisrapur.19.desc:0 "All across Halann adventurers gather in guildhalls, contract markets or even alehouses and caravanserais to receive recompense for a quest fulfilled, look out for new clients, recruit new blood to replace fallen comrades, gather allies for a daring raid and boast of their deeds to a sympathetic audience.\n\nBut nowhere are they held in such high esteem as in Khadisrapur, heart of the heroic realms. Let the boisterous Vernmen, the prideful Harklumi or the ruthless Dekkhangi claim otherwise, we know that they are no mere adventurers, but true heroes, with a brave heart, iron will and pure spirit.\n\nTales of the many courageous deeds of the heroes of our realm have spread far and wide, and all across Haless the Heroic Guilds of Khadisrapur have gained an exalted reputation, and rightfully so! Quest givers travel from distant lands to recruit one of our noble heroes to solve issues their own adventurers have failed to take care of.\n\nIt is only fitting that we have gathered all the guilds across our land under one roof, and established the Heroes Guild of Rahen, to set an example for the rest of Haless and beyond.\n\nIn its branch guildhalls our heroes will from now on receive board and lodging whenever needed, may train under experienced veterans to sharpen their skills, acquire equipment of superior quality and modest prices and negotiate their contracts with quest givers with guild officials ensuring they are not taken advantage of.\n\nThe headquarters of this most noble guild will of course be erected in Khadisrapur, a shining beacon drawing aspiring heroes from all corners of Haless."
 khadisrapur.19.a:0 "Pass me the rice beer, friend! Today is a day for celebrations, for tomorrow we quest again!"
 khadisrapur.20.t:0 "In Search of the Dwarves"
 khadisrapur.20.desc:0 "The adventuring heroes we sent out into the caves beneath the Serpentspine mountains to our north have ascertained that the rumours of unusual activity in this subterranean realm were true. Hobgoblins and their former goblin servants appear to be embroiled in a fierce struggle for supremacy, with tribes and clans constantly aligning with each other and betraying these alliances for temporary gain.\n\nOur human and harimari heroes are however not suited for this environment and thus were unable to penetrate deeply into the labyrinthine network of caverns and tunnels. Reaching the fabled holds hidden deep beneath the surface to ascertain their current state has therefore remained beyond our capabilities.\n\nWe have gone to some lengths to recruit amethyst and peridot dwarves willing to lead further expeditions into the mountain's depth, but for all their innate affinity for this environment, they are no more familiar with it than our human heroes. Emissaries sent out to the secluded nephrite dwarves of Verkal Ozovar in hope of acquiring ancient maps from the time of the Jade Empire have returned empty handed.\n\nJust as we were ready to concede defeat and cancel any further expedition into the depths, news of an unexpected offer has been relayed by one of the scouting parties. A small tribe of goblins have offered us their services as scouts in return for protection from the hobgoblins constantly harassing them and threatening to utterly obliterate them."
 khadisrapur.20.a:0 "Let’s see if these short goblins stay true to their word, else our blades shall keep them honest."
 khadisrapur.21.t:0 "Treaty of Pirvand"
 khadisrapur.21.desc:0 "Solidification of dual rule over Shamakhad"
 khadisrapur.21.a:0 "Yippee!"
 khadisrapur.22.t:0 "Opening of the Grand Guildhouse"
 khadisrapur.22.desc:0 "Wandering the streets of Khadisrapur Ranjit was all too aware of his mudstreaked boots and the dust covering his clothes after the long journey, but he could not imagine delaying for rest and a hot bath in one of the many inns he passed along his path, not when his goal was so close.\n\nFinally, he reached the Heroes’ Plaza and stared in awe at the grand portal of the new headquarters of the Heroes Guild, an arched gateway clad in black Khadisrapuri marble and decorated with nephrite inlets and gold filigree. Behind this portal was not just a massive complex of assembly halls, training rooms, supply depots and arsenals carrying everything an aspiring adventurer might need, the quest offices where supplicants both foreign and domestic were matched with adventurers suitable for the task and many other amenities for the visiting guild members, but most importantly for Ranjit, the central registrar office, where he could present his credentials and at last begin the process of becoming a full member of the guild in good standing.\n\nIn any other city of Rahen the guildhall would be considered a palace fit for aristocrats, but here in Khadisrapur it was a point of pride to house their heroes in such a sumptuous environment. As he wandered along the corridors in search of his destination, attempting not to be too obvious staring at the marvels that surrounded him, he noticed traces of the decorations used for the grand opening ceremony only a week prior still laying around. If only his journey had not been delayed by the plight of a local village threatened by malignant boar spirit, he could have joined in on the grand festivities, but what kind of hero would he be if he had not responded to such a clear call for aid?"
 khadisrapur.22.a:0 "This will truly be the beginning of a new golden age of heroes!"
 khadisrapur.23.t:0 "Opening a Local Heroes Guild?"
 khadisrapur.23.desc:0 "Ever since the miraculous recovery of Khadisrapur from the brink of defeat, their local adventurers and heroes have played an integral part in the defense of their realm and securing the lands they have wrested from the Command. The occupation of adventurer, already traditionally quite prestigious in the heroic kingdoms of the north, has thus seen it reputation elevated even further, and the Khadisrapuri have devoted their efforts towards the establishment of a Heroic Guild tasked with training prospective adventurers, providing them with the resources and equipment to fulfill their quests and, probably most important, hold them accountable for their deeds and ensure that only those of proper moral rectitude receive the coveted label of ‘Hero of Khadisrapur’.\n\nNow we have received the offer to turn our own adventurers guilds into branches of the Heroes Guild, ensuring a strict training regiment and high standards for our local adventurers going forth. While some at court scoff at the suggestion that we are lacking in this regard, others are clearly intrigued by the possibilities such a move might bring with it."
 khadisrapur.23.a:0 "Who better to prepare our own adventurers for their quests than the famed heroes of the north!"
 khadisrapur.23.b:0 "What a generous offer, but we do not need remedial lessons in heroism."
 khadisrapur.24.t:0 "Half-Orcish Industry"
 khadisrapur.24.desc:0 "Event about how the half-orcs have taken the reins of mining and resource extraction from their parents and they work smarter and more efficiently and so on."
 khadisrapur.24.a:0 "Uhhhh hm. okay."
 khadisrapur.25.t:0 "Never Again!"
 khadisrapur.25.desc:0 "It was the arrogance and folly of the past rulers of the ruin kingdoms that have allowed the hobgoblin menace to sweep through their defenses as if they were made from paper. Instead of maintaining their fortifications and warding their borders, they wasted their treasury on decadent feasts and debauched celebrations.\n\nExpelling the invaders from our lands once they had become entrenched there has cost us blood, sweat and tears. And still, decades after the Command has been vanquished, the land still bears the scars of their occupation.\n\nIt was a bitter, hard earned lesson and one we are not inclined to forget anytime soon. All across the lands of Shamakhad that are now under our protection we have therefore erected new, massive fortifications designed to stop any would-be invader in their tracks. Never again shall we be caught unprepared, anyone who dares to enter our lands with ill intent will be crushed by the might of Khadisrapur!"
 khadisrapur.25.a:0 "Rise, proud sons of Khadisrapur, and guard our precious home against all foes!"
 khadisrapur.26.t:0 "A Monument to Defiance"
 khadisrapur.26.desc:0 "Naraka. Just mentioning the word is enough for any true son of Khadisrapur to recall the exemplary display of heroism, endurance and loyalty shown both by the defenders of this most stalwart fortress and the heroes bravely marching to its rescue in the face of untold orcish warbands and hobgoblin banners barring their way.\n\nEven grizzled adventurers have been known to shed a tear or two when listening to the epic poem recalling these most dire days of Tilathi, when all seemed lost in the face of unrelenting hobgoblin aggression. But even the darkest of nights has to end with the glorious rise of dawn. And in the depth of night, salvation came in the form of the valiant Khadisrapuri heroes who dispersed the besiegers and greeted the light of dawn arm in arm with their Tilathi brothers.\nThe days of the hobgoblin menace are fortunately long behind us now, but the memory of the sacrifices endured by our predecessors in defense of all of Shamakhad should never be forgotten.\n\nThus, the provincial governor of Naraka has gathered an impressive amount of funds to turn the old fort into an enduring monument of the valor shown by these finest of warriors.\n\nUnsurprisingly, it has become one of the major destinations for adventurers and aspiring heroes visiting our lands on a pilgrimage. Standing high up on the walls of the fort, meditating on the feats of heroism these stones have witnessed, they hope to be blessed with even a modicum of the valiant spirit demonstrated by the heroes of old."
 khadisrapur.26.a:0 "The heroes of Naraka are truly an inspiration for us all!"
 khadisrapur.27.t:0 "Half-Orcish Military"
 khadisrapur.27.desc:0 "Half-Orcs have proven themselves hardy and intelligent. There's an increasing number of them who wish the join the army."
 khadisrapur.27.a:0 "Recruit all the half-orcs!"
 khadisrapur.27.b:0 "Commission them as officers!"
 khadisrapur.28.t:0 "Rajkevir of Piranpur"
 khadisrapur.28.desc:0 "Every couple of generations a universal genius is born who is destined to leave their mark for centuries to come. Rajkevir of Piranpur is one such exceptional talent. Born into a prosperous merchant family, his voracious appetite for knowledge was soon noticed when he could flawlessly recite epic poems at only five years of age.\n\nUrged on by his family, he soon became a sought-after architect known for the seamless blend of artistry and functionality of his creations, taking inspiration from traditional building styles from all over Shamakhad and beyond but merging them into a new marvellous aesthetic.\n\nYet it was his poetry that drew the attention of his aristocratic patrons and ultimately the royal court itself. As with his architectural aesthetic, he took centuries-old lyrical conventions and poetic style and blended them into something new and inspiring, expressing the zeitgeist of contemporary Shamakhadi poetry in a uniquely captivating way.\n\nBoth his interest in the architecture and poetry of Shamakhad fuelled the passion that would define his later life - the history of his homeland and the political philosophy he derived from his studies of the ancients. Using the patronage of his aristocratic benefactors he began to gather an impressive collection of ancient texts and historical artifacts and even conducted the first archaeological excavations in Rahen to shed light on the lost history of early Shamakhad.\n\nThe passionate and erudite accounts of his historical findings and the philosophical treatises based on his studies have spread like wildfire amongst our people, no matter which caste they belong to, fostering a sense of unity and pride in their heritage and achievements amongst the peoples of Shamakhad. It is therefore quite fitting to consider Rajkevir the father of contemporary Shamakhadi culture."
 khadisrapur.28.a:0 "A toast to the sacred brotherhood of all Shamakhadi!"
 khadisrapur.29.t:0 "Sir Arthurian Blacktower"
 khadisrapur.29.desc:0 "Sir Arthurian Blacktower, an daring adventurer hailing from distant Escann, has found his way to our lands in search of new discoveries and adventures. Blessed with a voluptuous mustache worthy of a true Khadisrapuri, or, in his own words ‘the envy of Vernemen everywhere’, he cuts a dashing figure and has shown to possess the skills of a true hero.\n\nSoon after his arrival it became apparent that he possesses a thorough understanding of the latest military tactics employed in the far western realms beyond the deserts of the Bulwari.\n\nHis stated goal is to be the first of these Cannorians to explore the mysterious lands beyond the Godswall, but rumour has it that a certain lady of our court has caught the eye of this veteran adventurer, so there might be a way to convince him to extend his stay in our realm, possibly even indefinitely, and utilize his knowledge to modernize our military."
 khadisrapur.29.a:0 "Warfare in the far west is making extensive use of artillery, you say?"
 khadisrapur.30.t:0 "Establish a Standing Army"
 khadisrapur.30.desc:0 "One of the first reforms Sir Arthurian Blacktower insisted on was the reform of our recruitment and mobilisation efforts. Instead of depending on peasant levies raised only in times of war and otherwise relying entirely on mercenaries as is customary for the heroic realms, he declared the establishment of a standing army the cornerstone of all his efforts to modernize our armies.\n\nHowever, as the detractors of his ambitious plan were swift to point out, maintaining a standing army is certainly a pricey endeavour - an argument that has gained some traction amongst the more conservative elements of the general staff and courtiers alike. Faced with such obstinate opposition Sir Arthurian has staked his reputation on the success of his reform proposal and stated that if his experienced advice is no longer required, he is more than ready to resume his original plans of adventure and exploration."
 khadisrapur.30.a:0 "If we do not want to risk falling behind once more we need to build up a professional army."
 khadisrapur.30.b:0 "What has been good enough for our brave ancestors is certainly good enough for us!"
 khadisrapur.31.t:0 "Logistics and Supply Hubs"
 khadisrapur.31.desc:0 "With the army reform in full swing and barracks and recruitment centers erected all over the country, Sir Arthurian Blacktower has taken to travelling through our vast yet beautiful realm. These travels are however not undertaken for the sheer pleasure of it, but serve a concrete military purpose. By documenting the current state of the road network and identifying terrain features relevant for a potential military campaign he has laid the groundwork for a complete overhaul of our military supply system. Proper maintenance of the main roads and the establishment of supply depots in strategically important locations will ensure that our forces can be swiftly deployed to any corner of our realm.\n\nBut his efforts do not stop there, as he has proposed to restructure the basic organisational units of our armies and model them on the Cannorian concepts that have proven their value in conflicts across Halann."
 khadisrapur.31.a:0 "We are not content with timid half measures, continue the reforms!"
 khadisrapur.31.b:0 "What utter folly, we are Raheni and not Cannorians!"
 khadisrapur.32.t:0 "Order of Battle"
 khadisrapur.32.desc:0 "The latest suggestion coming out of the office of Sir Arthurian Blacktower is sure to - once again - ruffle some feathers amongst the general staff. His latest project is the establishment of military academies with a standardized curriculum to train the coming generations of officers to overcome any foe we are likely to encounter with superior tactics, cunning stratagems and a rigorous training regime for our troops. All mirroring the practices of the Cannorian powers where he himself received his military education.\n\nThis time however, some dissenting voices can be heard amongst his cadre of promising young officers who have risen in prominence during the implementation of his reforms. They are convinced that with some effort, our traditional Raheni formations can be improved to the point where they are the equal of their Cannorian counterparts on the battlefield."
 khadisrapur.32.a:0 "Sir Arthurian has yet to provide us with wrong advice, let us fully implement his suggestions."
 khadisrapur.32.b:0 "We want the most modern Raheni army, but it should remain a Raheni army."
 khadisrapur.32.c:0 "This has gone far enough, let’s leave it at that."
 khadisrapur.32.d:0 "This has clearly been a pipedream, let us revert this folly!"
 khadisrapur.33.t:0 "The Adventurer Forum"
 khadisrapur.33.desc:0 "The Purple Crescent Forum, where adventurers known across Halann gather to give constructive input on laws governing supernatural affairs (and each other), was in full, chaotic swing. The newly appointed Minister, Avamaran of the Looming Claw—a famously composed warlock and allegedly “good mediator”—stood at the center of the open ring, once again wondering why he hadn’t just turned into a tree and vanished like his predecessor.\n\nThe day’s topic? “On the Ethical Deployment of Summoned Entities in Densely Populated Urban Areas”\n\n“Order!” Avamaran roared, banging a rune-inscribed rod that had long since stopped glowing. “We are here to debate Motion Forty-Two: On the Regulation of Summoned Entities in Urban Districts. You will all behave like certified professionals!”\n\nSomeone in the stands screamed, “Suck a mimic’s arse, Avamaran!” A cheer followed.\n\nFirst to speak was Gragrama the Red, a half-orc beast wrangler with half a functioning eye. “If your dainty wards can’t handle a fire lizard in the marketplace, maybe you should get a new godsdamned marketplace.”\n\n“I live in that marketplace!” screeched a robed enchanter, standing on a bench. “Your lizard pissed lava into my spice stand!”\n\n“Sounds like a you problem,” Gragrama grinned.\n\n“Your summons wrecked a temple, you dull-eyed mongrel!”, a shout heard from the other side claimed.\n\nMore shouting erupted. Someone threw a boot. A spectral cat walked across the center and vanished.\n\n“Point of order!” yelled a cloaked figure who hadn’t spoken all session. “Can we please define what qualifies as a summoned being? My situation is... legally complex.”\n\nThe Minister raised both hands. “If you cannot undo it with a counterspell or kill it with a shovel, it’s summoned!”\n\n“Then so’s my ex-wife!” came another voice, followed by full-blown howling.\n\nBy the time the rune bell exploded from sheer overuse, the Minister had stormed off muttering, “Let them all be eaten by their own bloody demons.”\n\nThe Forum adjourned shortly after, with no resolution. Two new motions were proposed in the chaos: one to ban summoning in taverns, and another to require it, “for entertainment purposes.”\n\nBoth motions were approved."
 khadisrapur.33.a:0 "Cheers!"
 khadisrapur.34.t:0 "A Timeless Performance"
 khadisrapur.34.desc:0 "To say we and our neighbors to the southwest share the same roots would be an understatement—a falsehood spun by ignorant scholars and poorly inked records in Ghundaghar’s dusty library. We are sons of the same father, daughters of the same mother—heroes, all of us.\n\nTo honor our shared blood, culture, and history, the Bansuri & Drums Society of Ghattub organized a grand celebration, inviting poets, dancers, famed musicians—and their wealthy patrons—to witness the performance of the century.\n\nLady Ramaheera opened the night. Renowned across the north for her voice like flowing silk, she took the stage in a black-and-gold silken skirt that caught every flicker of torchlight. She began with a quiet hymn—singing of the river Kharunyana’s winding path, of snowmelt from the Spine trickling through the earth. The bansuri’s hum echoed as she spun in slow circles, each step perfectly measured.\n\nThen—mid-turn—she snapped into motion. The hem of her skirt whipped behind her, the gold catching firelight like embers. She waved sharply to the drummers.\n\nFaster.\n\nAnd then, breaking from melody, she spoke:\n “This is not a show. This is a declaration. Politicians fear what we know: that though the north holds two nations, it shelters only one people. Tonight, we make that truth known.”\n\nCheers rang out. The drummers struck harder. From the crowd emerged her fiercest rival—Candi, clad in crimson. Ramaheera extended a hand.\n\nThe crowd roared.\n\nWhat followed was more battle than dance. Twirls like duels. Anklets like weapons. Hair flying, feet crashing down in rhythm. Some watched, dumbstruck by grace. Others couldn’t help themselves—rising from their seats, swept into the fever.\n\nChildren climbed onto shoulders. Vendors abandoned their stalls. Foreign guests locked arms with strangers. A minor noble was last seen belly-dancing atop a fruit cart. There was no stopping it now.\n\nThe bansuri screamed, the drums howled, and the music—never faltering—carried on until dawn. It was, in every sense, a timeless performance."
 khadisrapur.34.a:0 "Whoooooo"
 khadisrapur.35.t:0 "Sins of their Fathers"
 khadisrapur.35.desc:0 "The hobgoblins were a menace upon Shamakhad for a thousand years before our forefathers drove them out and banished them to the dark crevices of the Jade Mountains. Much has changed since then—the world today is not the world of that old war.\n\nWhen we established the state of Jademarch under local goblin oversight, the hobgoblins were condemned to the mines, made to pay for the sins of their fathers. Years passed. Decades. There was no rebellion, no unrest—only a quiet acceptance of defeat. To them, it wasn’t penance for a crime, but punishment for weakness.\n\nThe latter was never our intention. And now, we must make that clear. From this day forth, none of their kin shall labor without pay, and insults to their kind will no longer be tolerated. The people of Shamakhad once saw them as oppressors and invaders. Today, they see them as reliable, honorable, and brave folk who work for their living.\n\nIt is time to place them where they can excel. The army of Jademarch has long suffered in quality. That ends now. We shall promote hobgoblins to serve with pride—live with honor—and stand to protect the homes they now rightfully claim."
 khadisrapur.35.a:0 "We are a heroic realm. We do not punish people for bravery, we reward them."
 khadisrapur.36.t:0 "An Exchange of Arms"
 khadisrapur.36.desc:0 "Unbeknownst to [Root.Monarch.GetTitle] [Root.Monarch.GetName], rising tensions had misled some of our generals into doubting the eternal bonds with the Nadimraj. Convinced war was inevitable, they moved thousands of troops to the border—and the Nadimraj did the same.\n\nThen, the unexpected happened. On a quiet night, instead of forming ranks for a standoff, soldiers on both sides reached out across the line. Their field commanders, less removed from reality than their superiors, allowed it.\n\nWhat followed felt like a fairy tale. Soldiers and heroes, once prepared to clash, shared food, told stories, played matches by torchlight, danced, and sang songs that echoed across both camps. It was clear—they did not want war. They were one people under two banners, and they no longer wished to be divided. They wanted peace, and a shared future.\n\nWhen news reached the [Root.Monarch.GetTitle], a meeting was called. Discussions were long and grave. Then an offer: two realms, united under one monarch, equally represented. The heirless [R73.Monarch.GetName] did not resist. He named [Root.Monarch.GetName] heir apparent, protector of both lands.\n\nAnd so was born a union—to last a millennium."
 khadisrapur.36.a:0 "We live in wonderous times."
 khadisrapur.37.t:0 "Age of Heroes and Legends"
 khadisrapur.37.desc:0 "We have not reached the end—no, we stand at the beginning. Before us lies a long and wonder-filled road, one that stretches from the storied lands of the Hero-Lords, winds along the sacred waters of the Kharunyana, twists beyond the shadow of mighty Mount Tughayasa, and spills forth into every distant corner of Haless.\n\nThis is no ordinary chapter in our history. Upon us is an age where legends draw breath, where heroes are forged not just in battle, but in vision, in unity, in unshakable purpose. Progress marches beside us, not behind.\n\nAt the vanguard of this new era stands a realm once thought the stuff of fairy tales. A land whispered in lullabies, dreamed of by children and old warriors alike. Here, a farmer’s truth holds weight equal to a prince’s decree. Here, the long-fractured North has been bound together, not by steel alone, but by shared hope.\n\nThis is Shamkhad.\nA nation born of myth, tempered by struggle, and fated to endure.\nWe do not walk toward greatness.\nWe ride headlong into it."
 khadisrapur.37.a:0 "Embrace the Shamakhadi Identity, TO GLORY!"
 khadisrapur.37.b:0 "Once A Heroic Realm, Always a Heroic Realm!"

