 R11_organize_companies_effect_tt:0 "Whenever we §YDesignate March§! a vassal, it becomes a §YFree Company§!."
 R11_golden_age_effect_tt:0 "From now own, §YPhilosopher§! advisors will also grant us §G+2%§! Manpower in Primary Culture Provinces per skill level.\n\nSo long as we are §YEmpowering the New Caste§!, provinces we own of §YUpper Raheni§! culture will gradually convert to §YShamakhadi§!."

