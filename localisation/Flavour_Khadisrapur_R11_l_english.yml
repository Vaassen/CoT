 #Estates
 estate_adventurers_organization_heroes_guild:0 "Adventurer Organization: Heroes' Guild"
 estate_adventurers_organization_heroes_guild_desc:0 "The Heroes Guild of Rahen is the most powerful adventuring guild in Rahen. Originating from the lands of Shamkhad in the north where the Heroic Realms heavily utilize the adventurers to perform various tasks across the realm, it offers a structured framework for quest and rewards distribution, titles, social safety, and even stipends for distinguished retired adventurers."
 heroes_guild_subjects_tt:0 "§YMarches§! with this privilege will not take up a diplomatic relations slot."
 enable_estate_action_RECRUIT_ADDITIONAL_HEROES_ADVENTURERS_tt:0 "[Root.EnableEstateDecisionText] §YAdventurers: Recruit Additional Heroes§!"
 disable_estate_action_RECRUIT_ADDITIONAL_HEROES_ADVENTURERS_tt:0 "[Root.DisableEstateDecisionText] §YAdventurers: Recruit Additional Heroes§!"
 estate_adventurers_recruit_additional_heroes_decision_title:0 "§YAdventurers: Recruit Additional Heroes§!"
 estate_adventurers_recruit_additional_heroes_decision_desc:0 "Recruit additional heroes to remove some of the more dangerous supernatural activity from our lands."
 RECRUIT_ADDITIONAL_HEROES_ADVENTURERS_effect_tt:0 "Remove all instances of §YAdventurers Wanted§! maluses from our lands"
 estate_adventurers_escort_missions:0 "Trade Escort Missions"
 estate_adventurers_escort_missions_desc:0 "Many adventurers complain about the tedium of escort and delivery missions, but some in our government suspect this is due to the low and unworthwhile rewards offered by the guilds. While the guilds might not pay much attention to the matters of trade, for our treasury minister these are a lifeline - and to ensure the safety of our trade and other travellers, the government has issued a baseline reward for all Escort-type quests completed by the adventurers, which will be awarded on top of whatever the guilds were offering, this not only incentivizes more quest takers, but might also attract some mid-level or even veteran adventurers looking for a (mostly) peaceful questline to embark on while listening to bards perform their favorite rhymes."
 estate_adventurers_escort_missions_gt:0 "Every owned §YCenter of Trade§! gains the following effect:"
 estate_adventurers_escort_missions_rt:0 "The modifier '§YTrade Escort Missions§!' is removed from all §YCenters of Trade§!"
 trade_escort_missions_mod:0 "Trade Escort Missions"
 estate_adventurers_mining_quests:0 "Mining and Extraction Quests"
 estate_adventurers_mining_quests_desc:0 "Many adventurers complain about the tedium of escort and delivery missions, but some in our government suspect this is due to the low and unworthwhile rewards offered by the guilds. While the guilds might not pay much attention to the matters of trade, for our treasury minister these are a lifeline - and to ensure the safety of our trade and other travellers, the government has issued a baseline reward for all Escort-type quests completed by the adventurers, which will be awarded on top of whatever the guilds were offering, this not only incentivizes more quest takers, but might also attract some mid-level or even veteran adventurers looking for a (mostly) peaceful questline to embark on while listening to bards perform their favorite rhymes."

 estate_uppercastes_khedarid_architecture:0 "Khedarid Architecture: Highland Retreats"
 estate_uppercastes_khedarid_architecture_desc:0 "The natural vistas of our highlands areas are a sight to behold, while difficult to traverse, with enough investment into infrastructure, construction of bridges, roads, watch towers and rest points, we can ease access to some of the more remote yet untouched parts of our lands, these areas are especially desired by wealthier members of the upper caste looking to build retreats for themselves and their families."
 estate_uppercastes_khedarid_architecture_gt_1:0 "Every owned §YMoutain§! province in §YShamakhad§! gains the following effect:"
 estate_uppercastes_khedarid_architecture_gt_2:0 "Every owned §YHills and Highland§! province in §YShamakhad§! gains the following effect:"
 estate_uppercastes_khedarid_architecture_rt:0 "All Upper Caste '§YKhedarid Architecture§!' modifiers will be removed from §YShamakhad§!."
 uppercastes_khedarid_architecture_mod_1:0 "Khedarid Architecture: Mountain Retreat"
 uppercastes_khedarid_architecture_mod_2:0 "Khedarid Architecture: Highland Retreat"
 estate_middlecastes_khedarid_architecture:0 "Khedarid Architecture: Roads and Caravanserais"
 estate_middlecastes_khedarid_architecture_desc:0 "The lowlands which is known as the Northern Plains are vast and experience extreme temperature changes during various times of the day and night cycle. To ease traversal of the great plains we have taken the initiative to build Caravanserais with specially provided heat and cold controls, these expensive magical devices which require little maintenance apart from the occasional recharge, these devices can keep the temperatures inside controllable.\n\nFurthermore a system of roads connecting these crucial caravanserais is of utmost importance, the roads need to be well maintained, patrolled, and expanded if existing ones are not up to the task."
 estate_middlecastes_khedarid_architecture_gt_1:0 "Every owned §YWinter§! province in §YShamakhad§! gains the following effect:"
 estate_middlecastes_khedarid_architecture_gt_2:0 "Every owned §YDesert§! province in §YShamakhad§! gains the following effect:"
 estate_middlecastes_khedarid_architecture_gt_3:0 "Every owned §YFlatlands§! province in §YShamakhad§! that does not fulfill either of the previous requirements gains the following effect:"
 estate_middlecastes_khedarid_architecture_rt:0 "All Middle Caste '§YKhedarid Architecture§!' modifiers will be removed from §YShamakhad§!."
 middlecastes_khedarid_architecture_mod_1:0 "Khedarid Architecture: Winterproof Roads"
 middlecastes_khedarid_architecture_mod_2:0 "Khedarid Architecture: Desert Caravanserais"
 middlecastes_khedarid_architecture_mod_3:0 "Khedarid Architecture: Flatland Infrastructure"
 estate_lowercastes_khedarid_architecture:0 "Khedarid Architecture: Civil Service and Spiritual Aid"
 estate_lowercastes_khedarid_architecture_desc:0 "Satisfaction of pilgrims is core to spiritual clarity, to this end, a new minister shall be appointed whose duty is that of keeping the high temples and their periphery clean and well maintained, everything from replacing broken tiles on the floor to keeping the waste out and tending to the road-sick is within this minister’s jurisdiction, ensuring that our cities, especially those hosting the esteemed high temples, are pristine and ready to host pilgrims."
 estate_lowercastes_khedarid_architecture_gt_1:0 "Every owned §YHigh Temple§! in §YShamakhad§! gains the following effect:"
 estate_lowercastes_khedarid_architecture_gt_2:0 "Every owned §YUrban§! province or province with §Y30§! development in §YShamakhad§! gains the following effect:"
 estate_lowercastes_khedarid_architecture_rt:0 "All Lower Caste '§YKhedarid Architecture§!' modifiers will be removed from §YShamakhad§!."
 lowercastes_khedarid_architecture_mod_1:0 "Khedarid Architecture: Spiritual Aid"
 lowercastes_khedarid_architecture_mod_2:0 "Khedarid Architecture: Civil Service"

