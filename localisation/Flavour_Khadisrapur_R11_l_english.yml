l_english:
 R11_no_hope_title:0 "No Hope Found"
 R11_no_hope_desc:0 "They say the Heroic Realms are no more.\nKhadisrapur still stands—but barely.\nThe southern courts grow fat and forgetful, blind to the edge we balance on.\nIf we fall, Rahen falls with us.\n\nBut we've long stopped waiting for rescue.\nThere’s no hope lost—\nand no hope found.\n\nOnly us."

 R11_voice_tilathi_title:0 "The Voice of Tilathi"
 R11_voice_tilathi_desc:0 "If there is one realm all too aware of the existential threat the Command poses, it is Tilathi. If not for the failed siege of Nakara, all of Tilathi might have fallen under the shadow of the Command.\n\nSo when the brave people of ancient Sir rose up in open revolt against the hobgoblin yoke, they were eager to take the fight to the enemy while the chimera was faltering. Yet the cowardly Sarnavani, thinking themselves safe behind their high walls and unwilling to risk drawing the ire of the Command, prohibited any intercession on behalf of the brave rebels of Sir.\n\nIt is clear to us that Sarnavan is undeserving of the fealty of the brave warriors of Tilathi. They will be far better off standing side by side with us against the dread chimera and its orcish minions. We shall act where Sarnavan only dithers."

 R11_letter_south_title:0 "A Letter South"
 R11_letter_south_desc:0 ""Hear ye, hear ye! All hope is not lost! Your homes are still guarded from the rampage of the monstrous chimera! A realm of heroes bars the path of the hobgoblin fiends! Khadisrapur, praised be its ardent courage; Khadisrapur, praised be its iron will; Khadisrapur, praised be its gallant might! May the High Gods bless the heroes of the north, the champions of us all!\nThis is a call upon all whose heart still beats for freedom, all who refuse to suffer under the hobgoblin yoke - lend your aid to the valiant heroes who fight for us all!"\n\n    -  Proclamation overheard in Khiraspid"

 R11_inform_sharaja_title:0 "A Missive to Sharaja"
 R11_inform_sharaja_desc:0 "Salutations to the most glorious lord of Rajnadhaga, Protector of Sarnihanpur, Shield of the North, Defier of the Lotus Throne from his beloved brother, the most exalted raja of Khadisrapur.\n\nYou will be most glad to hear that the fierce warriors of Khadisrapur have not squandered the gift of freedom you have granted us by standing by our side against the vile hobgoblin chimera. We have taken the fight to the dread enemy, spilling their blood to cleanse our rightful lands tainted by their vile presence. For once, the march of the Command has been turned into a retreat, and we stand guard along the new border, ready to repel any attempt to retake our ancestral lands.\n\nWill you stand beside us once more? Will you lend the strength of your arms to our common cause, and work to free every square inch of Shamakhadi soil of hobgoblin stench?"

 R11_eradicate_bloodsong_title:0 "Eradicate the Bloodsong"
 R11_eradicate_bloodsong_desc:0 "The Bloodsong tribe earned their moniker ‘Butcherers of Tilathi’ through their vile deeds during the attempted conquest of valiant Tilathi by the Boar Command. Frustrated by their inability to defeat the stalwart defenders of Nakara, the rapacious hobgoblins let their orcish minions loose on the countryside, plundering towns and villages, burning the fields and massacring the people who lived there for untold generations.\n\nSuch crimes cannot go unpunished, and who better to deliver true justice than us, the vanguard of Rahen, the stouthearted saviors of Shamakhad! We shall not rest until the filthy stain of Bloodsong is cleansed from the sacred soil of our homeland."

 R11_defenders_khadisrapur_title:0 "Defenders of Khadisrapur"
 R11_defenders_khadisrapur_desc:0 "While court intrigues pitted his royal father and younger brother against each other, Himmat Pirvand - the hero prince of Khadisrapur - fought with all his might to stem the advancing hobgoblin tide threatening to drown his homeland.\n\nHaving traversed the lands of Haless after relinquishing his claim on the throne, he had gathered an impressive host of allies amongst the heroes roaming these lands. And when he sent out his call, they answered!\n\nMighty warriors singlehandedly slew plundering orcish warbands ravaging the countryside and raised the faltering morale of many a conscript bataillon at the eve of battle, dwarven siege engineers devised ingenious traps and reinforced long neglected fortifications in record time, and even some elven warriors, who found a new home in our lands after the rest of their kin returned to the west, fought by his side, using their tactical acumen honed over the centuries to lay devastating ambushes.\n\nNow their considerable talents are at our disposal and already work has begun to turn the walls of Khadisrapur into an impenetrable fortress ready to withstand all the hobgoblins might throw against it."

 R11_reign_lowlands_title:0 "Reign in the Lowlands"
 R11_reign_lowlands_desc:0 "Shamakhad has always been the land of two rivers. The mighty Kharunyana in the west and the resplendent Yanhe in the east.\n\nWith Sarilavhan now firmly under our control and its surroundings no longer subjected to the depredations of the Command, we are finally in a position to solidify our hold over the fertile lands along the banks of the upper Yanhe.\n\nKey to this is control over venerable Sir, the City of Crossroads, home to the fabled Library of Sir. If we want to ensure our recent successes do not become a cautionary tale of tragic heroism, we need to make it clear to the current lords of Sir and all others that we and no one else are the rightful overlords of all Shamakhad."

 R11_resettle_refugees_title:0 "Resettle the Refugees"
 R11_resettle_refugees_desc:0 "The long nightmare for the many peoples of Shamakhad is finally over. The chimera has been chased from these lands, allowing it to heal.\n\nWith the righteous might of Khadisrapur shielding them from any harm, the myriad displaced former inhabitants, who were scattered like so much flotsam by the hobgoblin advance, have finally begun to return to their ancestral homes.\n\nYet they are not the only ones who have begun to consider these wartorn lands their home - those brave orcs who defied their vile masters and joined us in our righteous struggle have found the green dales and foothills of the Jade Mine mountains much to their liking, taking over the settlements of their former owners and making them theirs as our stalwart wardens of the north."

 R11_heroic_victory_title:0 "A Heroic Victory"
 R11_heroic_victory_desc:0 "Against all odds, we have prevailed! Arise, brave souls! We have done what none could do, we have withstood the storm, we have put the bear down to the ground. Today, Khadisrapur stands on top of the world, the true hero and saviour of all Haless, nay, all Halann!\n\nLet the people know, let them celebrate, let them dance in the streets, let the poets sing of our bravery, of our ascendance! Khadisrapur is now The Heroic Realm of the plains - that which mothers told the young of Rahen about during bedtime, and we shall persevere, we shall not repeat the mistakes of the past, we shall build, we shall sow, and we shall rise to higher highs!\n\nSoldiers, Heroes! We have reached the peak, now, let us fly!"

 R11_thunder_strikes_title:0 "Thunder Strikes!"
 R11_thunder_strikes_desc:0 "When the hobgoblins poured out of their mountains, they were not alone. With them, they brought their dreaded orcish slave-warriors. Many a hero of Shamakhad fell under their blades during the following years, and the people had learned to fear the sound of orcish war drums.\n\nBut not all these orcs were brutish savages, who delight in doing their masters’ bloody work for them.\n\nUnlike their cruel cousins of the Bloodsong tribe, the clans of the Thunderfist tribe have shown time and again that they have a sense of honor, attempting to spare the helpless victims of their masters’ seemingly inexorable advance.\n\nNow that we hold Ghilakhad, the lands the Thunderfist orcs have been settled in is now under our protection, and as their brave warriors have chosen to fight on our side to thwart their former masters, we are in turn honorbound to shield our newest subjects from the ire of the Command."

 R11_cripple_command_title:0 "Cripple the Command"
 R11_cripple_command_desc:0 "The dreaded chimera of the Hobgoblin Command is truly a monster deserving of abject revulsion. And to slay such a foul beast, as we all know, a true hero is needed. And who better suited for that role than the lord of the heroic realms, Khadisrapur?\n\nWith mighty arms and undaunted spirit we have rolled back the seemingly unstoppable advance of the Command, and pushed them out of Shamakhad. Now we need to undo the harm they have wrought and restore the proper order. No matter what stubborn resistance they might show, the age of the hobgoblin in Shamakhad is over!"

 R11_journey_north_title:0 "The Long Journey North"
 R11_journey_north_desc:0 "Even our most ardent enemies are forced to concede that we are the very image of chivalric gallantry. An honorable foe, once defeated, will receive nothing but the most proper treatment from us. And those who once stood against us, not out of their free will but because they were enthralled to a greater evil? They deserve our succor.\n\nThus we were honorbound to protect the courageous Thunderfist orcs who stood up to their former hobgoblin masters and protect them from the wrath of the Command.\n\nWith the chimera chased from our homeland, the highlands lying at the feet of the Jademine mountains are in dire need of loyal wardens always on the lookout for a return of the hobgoblin menace, just as our orcish friends are in desperate need of a place to finally call home. Such a serendipitous coincidence is clearly a gift from the gods, and we are not such fools as to refuse it."

 R11_rajnadhaga_gambit_title:0 "Rajnadhaga's Gambit"
 R11_rajnadhaga_gambit_desc:0 "The rajas of Rajnadhaga have always seen themselves as the rightful heirs and protectors of the legacy of the long lost Nadimraj. Now, with the old order that sprung up after the fall of the Phoenix Empire in the east irrevocably shattered by the hobgoblin incursion, and the hobgoblins themselves pushed back to the mountains they crawled out from, they consider it an opportune moment to turn that claim from hollow boast to actual reality. And who better to share that glory than the victorious heroes of Khadisrapur?\n\nEmissaries have been journeying back and forth between the two courts under the seal of secrecy for many months now, to negotiate an agreement that is both bold proclamation and binding treaty, dividing up all of Shamakhad into complementary spheres of influence to be ruled over by the brother realms of Rajnadhaga and Khadisrapur. Yet what the current owners of these lands have to say to these plans has not been given much consideration, so there may be some resistance to this bold gambit."

 R11_consolidation_shamakhad_title:0 "Consolidation of Shamakhad"
 R11_consolidation_shamakhad_desc:0 "What has been derided as either an opportunistic power grab or a delusion born from equal parts nostalgia and megalomania has become the new reality for all of Shamakhad. Under the enlightened rule of the twin realms of Khadisrapur and Rajnadhaga, all of vast Shamakhad has been united for the first time in many centuries, with all its inhabitants enjoying the hard-won fruits of peace and prosperity after the dark decades of ruin that preceded our rise.\n\nWe are no longer the disparagingly named Ruin Kingdoms, but worthy heirs to the first empire of all Rahen, sacred guardians of the birthplace of Raheni civilization. Noone can doubt the favor the High Gods have bestowed upon us, or that we are the rightful rulers and wardens of Shamakhad. It is now time to reaffirm the close ties to Rajnadhaga and thus secure our western borders so that we may look outwards."

 R11_secure_borders_title:0 "Secure the Borders"
 R11_secure_borders_desc:0 "The fertile lands along the course of the upper Yanhe have quickly become an integral part of our realm. Yet unlike our northern possessions, where only a few entrances to the caverns below the mountains need to be warded, or our western heartlands, secure and surrounded by friends and allies, they are vulnerable to hostile incursions from the south and east.\n\nWhile propping up one of the warrior monk states of the Xianjie to act as our shield along our southern flank is rather simple, securing the eastern border requires different measures.\n\nBordering our lands are the Demon Hills, wrapped in eternal fog and mystery both, home to the dreaded Oni and their minions.\n\nAs long as these redskinned fiends are free to plot and raid across our borders, our eastern borderlands will not be safe. It will take a truly heroic realm to subdue the Oni."

 R11_organize_companies_title:0 "Organize Free Companies"
 R11_organize_companies_desc:0 "Fortunately for us the harimari of Hubao are stalwart warriors who know through centuries of experience how to deal with the oni. Granting them control over the Demon Hills in return for an oath of vassalage has both secured our lands and gained us a loyal and strong vassal.\n\nWe would be a negligent overlord, however, if we would not provide these intrepid wardens of the east in their famed fortress with the proper tools to perform their duties. Having adventurers supplement our traditional military and act as flexible and enthusiastic enforcers of our order has been a key part of our astonishing rise over the last decades.\n\nOur loyal vassals like Hubao stand to benefit enormously if we nudge them towards adopting a similar stance and grant their homegrown heroes a prominent voice in governance."

 R11_see_west_title:0 "See to the West"
 R11_see_west_desc:0 "For as long as Raheni civilization has existed, its northwestern border was formed by the imposing peaks of the eastern Serpentspine. What lies beyond these forbidding mountains has been a mystery for untold generations, but ambitious - and somewhat foolhardy - adventurers both born in our lands and visiting from far flung lands to the west have shown an increasing interest in exploring what may lie beyond the Godswall.\n\nSuch an adventurous spirit should be encouraged, and we have thus constructed a series of towers and stairs carved into the cliff face to aid in the ascent to the plateau beyond. That this lets us decide who may be allowed the ascent and provides us with exclusive first access to all reports from returning sojourners is of course merely a welcome side benefit of our noble gesture."

 R11_what_valley_title:0 "What is in the Valley?"
 R11_what_valley_desc:0 "The tales brought back by adventurers daring to explore the barren plains and steep mountain ridges of the Nomsyulhan plateau are truly astonishing. A wild land teeming with hobgoblins, harpies and ogres lies beyond the Godswall, filled with a truly exotic fauna and flora that appears as if from another world. And scattered throughout are relics of a long bygone age that bear a remarkable similarity to the most ancient parts of our sacred High Temples.\n\nIt is only fitting that the heroes of Shamakhad should be the ones exploring this remarkable land, but for this we need a proper foothold beyond the Godswall. The inhabitants of this strange land above the clouds will, if not now, then in due time, become proud and grateful subjects of the marvel that is Khadisrapur."

 R11_restore_pirvandi_title:0 "Restore the Pirvandi Estate"
 R11_restore_pirvandi_desc:0 "The ruling house of Khadisrapur, the esteemed Hero-Lords which hail from Pirhakhad, have ruled the realm ever since the fall of the old Jaherian order, they were the only ones with enough foresight to invest into the realm’s defence, while other realms of the north put their heads under the sand in negligence.\n\nThis was no easy feat however, while other royal houses inherit rich realms and make them poor by siphoning its soul, House Pirvand sold its own assets and treasures in order to uplift the impoverished realm, making their own holdings small and unbecoming of such a great title. No longer! With the realm stable and our coffers restored, it is time to rebuild the grand Pirvandi Estate in Pirhakhad, we shall rename the whole town in order to honor their dedication, and build a grand complex worthy of receiving foreign dignitaries!"

 R11_four_season_title:0 "A Four-Season Realm"
 R11_four_season_desc:0 "A triangular realm nestled between the blessed Kharunyana river in the south, the mighty Yanhe river to the north and east, and the imposing Serpentspine mountains in the west and the northwest, Khadisrapur hosts diverse landscapes, from dry Deserts to breathtaking evergreen highlands, extremely cold glaciers, and rainy floodplains.\n\nThis makes ours a truly four-season realm - inspiring, beautiful, and full of natural bounty. Bundled with the many blessings are also dangers, rare beasts and monsters lurking around, remnants of the Dark Master’s foul creations, and hidden alcoves leading down towards the abyssal depths of the dwarven realms. We should invest into our infrastructure, put patrols out on the roads, build caravansaries and install quest boards at every stop, for there shall be no end to caravans looking for shelter and quests for adventurers to take."

 R11_pragmatic_splendor_title:0 "Pragmatic Splendor"
 R11_pragmatic_splendor_desc:0 "The lands of Khadisrapur are marked by a fierce, untamed natural beauty. Creeks cascading down pittoresque waterfalls, imposing cliffs decorated by colourful striations, hidden lakes covered with lotus flowers and water lilies, or steep rocks jutting out of the gently rolling hillscape providing a perfect panoramic view of the surrounding countryside.\n\nGiven this abundance of natural splendor, the nobility of Khadisrapur does not put as much value on precisely landscaped artificial gardens as their southern cousins, instead preferring to integrate the natural marvels found on their lands in the design of their estates.\n\nIt is only fitting that we establish a new royal palace in the magnificent highlands of Khadisrapur to commemorate our ascension as the latest hegemon of Shamakhad and awe anyone petitioning our court with the unmatched beauty of our homeland."

 R11_temple_crowd_title:0 "The Pilgrim’s Path"
 R11_temple_crowd_desc:0 "With the collapse of the Command many ancient and sacred temples that were inaccessible to the devout adherents of Darsanasara have become the destination of devout pilgrims once more. Yet many of the ancient pilgrim roads have fallen into disrepair during the decades of chaos at the hands of the hobgoblin invaders.\n\nIt is our most solemn duty to ensure the safe and swift conduct of all pilgrims who wish to travel our lands. Restoring the roads, erecting pilgrim’s inns and encouraging the establishment of enterprises catering to the needs of the pilgrims has not only proven to be a boon to the local economy of our cities and hamlets along the pilgrim routes, but has allowed us to showcase our unique Khadisrapuri style of architecture to the wider world."

 R11_golden_age_title:0 "The Northern Golden Age"
 R11_golden_age_desc:0 "The latter half of the 14th century is remembered as the ‘Great Northern Age’ by scholars; those were the good days for Shamakhad. Dashing heroes of all callings and races took arms to protect the innocent, root out evil, and provide for their families. The courts were packed with guests and lavish feasts, cities celebrated, the lower castes had more wealth than some merchants in less fortunate parts of Rahen and order was preserved by the city guards, while raiding parties took care of external threats.\n\nBut that’s what led to the downfall of the old order; ignorance. They were too blind to see the threats lurking about, and the greedy grins of monstrous hordes who’d see their happiness turned to sorrow. At that time, Khadisrapuri monarchs were looked upon suspiciously and called paranoid for wanting to have a functional levy system. Well, who’s laughing now?\n\nAlas, times have changed, Khadisrapur is now ascendant, and the north is in peace, we have proven to the people of Shamakhad that we can fight, but now it is time to also prove we can make them happy, a time to provide for the weak and encourage the ambitious, a time to shed our bloody clothes and done our party attire, and declare a Second Northern Age!"

 R11_fellowship_sentiment_title:0 "The Ties That Bind Us"
 R11_fellowship_sentiment_desc:0 "When looking at a map of northern Rahen, one can be forgiven at a superficial glance to think it divided between two competing claimants to the title of hegemon, bitter rivals at each other’s throat. But nothing could be further from the truth, for the bonds between Khadisrapur and its southwestern neighbor Rajnadhaga are deep and enduring, forged from millennia of shared history, culture and traditions.\n\nBetween the two realms, the rich and enduring culture of Shamakhad has bloomed once again. Poets and Artists, Musicians and Dancers from both realms are engaged in a constant but unspoken game of one-upmanship, challenging themselves to ever greater heights in the process while ushering in a new shared golden age of Shamakhadi culture."

 R11_unification_title:0 "Sons of Nadimraj"
 R11_unification_desc:0 "The people of Shamakhad are as brothers and sisters to each other, no matter on which side of the border they happen to live. Trade flows freely between our two realms, poets and musicians travel from one side of the border to the other in pursuit of rapt audiences for their craft and the common people are secure in the knowledge that our ties are far too close for petty ambitions of any ruler to risk tearing apart the bonds uniting us all.\n\nIt is only natural then, that an overwhelming sentiment of unity is sweeping across both our lands, calling for both thrones to be inextricably linked so that in time all of Shamakhad may be ruled by a reborn Nadimraj."

 R11_heroes_army_title:0 "Heroes in the Army"
 R11_heroes_army_desc:0 "Our glorious victories have turned the lands of Shamakhad from a war torn nomansland suffering under the hobgoblin boot once more into the gem of Raheni civilization. And with the return of civilization, a new order has arrived.\n\nWhile some veteran adventurers may mourn the exhilarating freedom that came with questing in a lawless land, most have welcomed the peace and prosperity our rule has brought to the long-suffering people of Shamakhad.\n\nMany of these veterans have now found a place within our armies, where they can continue to help the innocents and where their experience and skill are honored and put to good use."

 R11_expand_contracts_title:0 "Expand Contracts"
 R11_expand_contracts_desc:0 "The cooperation between the Khadisrapuri military and irregular militias composed of adventurers and their retinue is a long-standing tradition and arguably the reason for the continued existence of the realm during the dark years of the hobgoblin onslaught. \n\nGiven the recent enlargement of our realm, our military administration is hard-pressed to keep up with its expanded duties. Instead of futilely trying to field new armies without sufficient recruits or equipment, our generals have unanimously proposed to fall back on a readily available resource - the many valiant heroes of our realm. By offering long-term contracts to the larger adventuring troupes, uniquely skilled mercenaries are at our disposal."

 R11_heroes_plaza_title:0 "The Heroes' Plaza"
 R11_heroes_plaza_desc:0 "The now-city of Khadisrapur itself is built on the foothills of mount Behadir, plateaued between its mighty gaze and a few fortified hills in the city’s immediate east, which in turn watch over an endless stretch of farmlands. Some time ago, the ministry for the interior allocated a batch of land downhill in the eastern side of the city to the realm’s most prominent adventurer organization, The Heroes Guild of Rahen.\n\nDue to uneven terrain, however, the Guild has been struggling to expand beyond its initial boundaries, and so they have put forward a plan involving the mages guilds and the builders guilds, according to these construction blueprints - the plans are wild and ambitious, the heroes guild is trying to construct a momentous central plaza which will surround their main building, this will be a place for heroes and adventurers to gather, rest, collect new quests, create a raiding party or look for a group. Everything from housing to food to gambling and pleasure houses is accounted for and the plaza is expected to be able to accommodate up to twenty thousand adventurers at the same time, a number the size of a small army!"

 R11_adventurers_pilgrims_title:0 "Adventurers, Pilgrims!"
 R11_adventurers_pilgrims_desc:0 "The tales of our heroic deeds have spread far and wide, and Khadisrapur is known across all the lands of Haless as the realm of heroes. And rightfully so!\n\nHere the masters of this most noble trade have gathered to sharpen their considerable skills even further in friendly competition, and many have begun to pass on their hard-earned wisdom to students they consider worthy.\n\nIs it any wonder then, that up-and-coming adventurers eager to make a name for themselves have begun to travel to our lands in pursuit of their dreams? This practice has become so established that many adventurer's guilds across Haless have begun to require proof of such a pilgrimage as well as the completion of a number of quests before accepting someone as a full member."

 R11_vote_confidence_title:0 "A Vote of Confidence"
 R11_vote_confidence_desc:0 "The Adventurers are now a powerful force in all of Rahen, most of all the north. It is time we acknowledge their advances, and give them the means to protect the realm.\n\n[Root.Monarch.GetTitle] [Root.Monarch.GetName] has taken the initiative and proposed a plan of governmental reform, unlike the south where the ministries reign supreme, here in the north words of a monarch are absolute, so predictably the plan has not faced much opposition. It is however, unconventional, for a monarch to voluntarily cede their own power to another estate.\n\nThe plan outlines new legislation to create an open forum in the style of the Hall of The Endless Debates were adventurers who hold a valid certification can sit and have a civil conversation about how to relieve the realm of unconventional threats, they shall elect a Minister of Supernatural Affairs and issue edicts, these edicts being legally binding given they meet certain conditions and after being ratified by the [Root.Monarch.GetTitle]."

 R11_embassies_guild_title:0 "Embassies of the Guild"
 R11_embassies_guild_desc:0 "Our noble Adventurer’s Guild is truly a marvel to behold. Coordinating the efforts of countless heroes roaming our lands and beyond, serving as an advisory body to the throne itself and establishing proper training regimes and study courses for aspiring heroes, it has become an integral part of our society and a source of pride for all Khadisrapuri.\n\nWhy should we not offer the benefits of this most noble institution to our friends in Rahen, who surely have a need for true heroes as well?"

 R11_age_heroes_title:0 "Age of Heroes and Legends"
 R11_age_heroes_desc:0 "We have arrived to a point, not the end of the line, but the start of a long, wonderous road, one which goes from the lands of the Hero-Lords, follows the great Kharunyana, twists and turns beyond the great Mount Tughayasa, and leads to all corners of Haless.\n\nUpon us is a time where legends live, heroes are born, and progress is unstoppable. Heralding this new age is a land of myths, one from fairy tales and bedtime stories, one any man’s word goes as far as that of a prince, one which unified the long fractured northern realms into one, and made a nation to last; Shamkhad."

 R11_orc_mines_title:0 "Orc the Mines"
 R11_orc_mines_desc:0 "While our stalwart Thunderfist subjects have proven that the orcish atma possesses a noble essence, the vile deeds of their Bloodsong cousins have left the original inhabitants of Khadisrapur hesitant to share their villages with them. We are therefore forced to establish new communities for our new orcish subjects.\n\nSerendipitously they have shown a particular aptitude to the hard labor required to mine the ores hidden beneath Khadisrapurs soil, and have shown to be able to thrive in even the harshest terrain of our homeland. If we are to regain our former glory and stand strong amongst the realms of Shamakhad, their work in our mines will be invaluable. When a people is so obviously suited to such an occupation, we would be amiss to prevent them from following their calling and thus find their way towards their Nitikamarja.\n\nAn essential part of this is proper penance through labor, so they may reflect on their misdeeds to gain Dekhana and to demonstrate their contrition through Pichka.\n\nThese orcs are in desperate need of proper spiritual guidance if they are to have a hope of ever reaching Purtara, and our mines need strong arms to wrest their buried treasures from the ground."

 R11_labor_loyalty_title:0 "Labor of Loyalty"
 R11_labor_loyalty_desc:0 "The orcs serving penance for the misdeeds performed by them and their forebears have demonstrated true remorse and taken to the hard but honest life of a miner with ferocious determination.\n\nWhile many were initially dubious regarding the sincerity of their change of heart, by now even some of their former victims in Tilathi have become their determined advocates.\n\nIt is thus only right and proper that we recognise their sincere efforts to adhere to their Nitikamarja and allow them to join the Hitiyari Prikarti or lower caste, ending their status as casteless outsiders of our society."

 R11_casteless_title:0 "The Casteless"
 R11_casteless_desc:0 "With the admission of orcs into the Adesi caste system an issue has developed we have never had to face before.\n\nUnlike relations between harimari and humans, those between humans and orcs may produce offspring, leaving us with the question of the proper place for the results of such an union within the Adesi. Until now, those half-orc children have been considered casteless, sad creatures without a true purpose or Kartya, devoid of the ties to the greater whole that association with a Prikarti offers - but this is neither an honorable nor practical long-term solution.\n\nIn a sense, we Khadisrapuri are responsible for their existence, and it cannot be denied that these half-orcs show a great aptitude for working in our mines, foundries and forges.\n\nOfficially recognising the realities in our mining towns and sanctioning the existence of these new children of Khadisrapur by granting them a legitimate place in our society is not only the right but also the smart thing to do."

 R11_halforc_arms_title:0 "Half-Orcish Arms"
 R11_halforc_arms_desc:0 "Just as we had hoped for, granting the offspring of our orcish and human subjects a proper place within our society has allowed them to blossom and cultivate the best of both sides of their heritage.\n\nOrcish strength coupled with human cunning has proven to be a combination exhibited by many of these half-orcs, with many of our most promising blacksmiths and military engineers hailing from their ranks.\n\nAnd not only our weapons forges benefit from their contributions - many have shown a particular aptitude to the warrior's path and have bolstered the ranks of our troops in recent years."

 R11_proof_concept_title:0 "Proof of Concept"
 R11_proof_concept_desc:0 "While our blacksmiths and miners, whether they be human, dwarf, orc, goblin or hobgoblin, are truly skilled craftsmen who have access to trade secrets refined over many millennia, they are not the only ones with such a venerable tradition in Rahen. Along the eastern foothills of the Paravimvata, the Ghankedheni have pulled up the riches hidden beneath the earth for as long as anyone can remember, and in the process have developed a unique talent for prospecting hidden ore veins.\n\nIt only stands to reason that an equal exchange can only benefit both sides, and spur further innovation to fuel our nascent industries hungry for metals."

 R11_raheni_coal_title:0 "The Black Gold of Rahen"
 R11_raheni_coal_desc:0 "The ground upon which Raheni civilization has grown contains many treasures, which our ancestors have learned to extricate in furtherance of their Nitikamarja, enriching our lands in the process.\n\nBut one of these treasures has stubbornly hidden its true value until now. The unassuming coal might not be glittering like gold or shining like a polished gem, but to our craftsmen and artisans who form the backbone of our economy it might as well be. Its incomparable value as a fuel for furnaces has been only recently discovered, but stands to revolutionize our entire economy, propelling us into a new era of prosperity and affluence."

 R11_sophisticated_system_title:0 "Sophisticated System"
 R11_sophisticated_system_desc:0 "Here in Khadisrapur, the engine of state is a marvel of unmatched complexity and precision, with countless gears and pivots interlocking to propel the entire realm into a glorious future. Here in valorous Khadisrapur there is a place for everyone, and everyone has their place, contributing to the best of their ability for the common good. Human peasants feed the realm, harimari administrators oversee its intricate bureaucracy, and orcish workers extract the raw materials their half-orcish offspring turn into superbly manufactured tools and weapons, while the fierce hobgoblins stand guard at our borders to prevent anyone from disturbing the inner workings of this most sublime of engines."

 R11_chaos_caverns_title:0 "Chaos in the Caverns"
 R11_chaos_caverns_desc:0 "A hero’s work is noble, gallant and fit to be praised in song. But it can be quite disruptive to the status quo as well, and bring unintended consequences with it.\n\nOne such consequence of our slaying of the chimera has been the utter chaos engulfing the labyrinthine warrens found beneath the serene mountains of the Jade Mines.\n\nWithout a harsh overlord to keep everyone in check, the inhabitants of this underground world have swiftly descended into anarchy, with roaming warbands of goblins, scattered remnants of hobgoblin battalions and even some vengeful dwarven companies out for blood threatening to turn this sunless realm into a desolate wasteland.\n\nWe may not have intended this, but it is nonetheless our duty to put an end to the depredations and restore order."

 R11_eradication_command_title:0 "Eradication of The Command"
 R11_eradication_command_desc:0 "All the most seasoned hunters know that a cornered beast can be the most dangerous, even if wounded.\n\nThe chimera might have been chased away from its hunting grounds back into its lair, but that did not mean it was slain. It was merely licking its wounds and biding its time to reemerge and bring chaos and despair over Shamakhad once more.\n\nWho amongst the Khadisrapuri would argue against the necessity of venturing deep into the dark underbelly of the mountains to hunt down the beast and slay it once and for all?\n\nEspecially once it became known that the hobgoblins did not just enslave orc and human alike, but their distant kin as well - the myriad goblins dwelling in the caverns beneath, yearning for someone to free them from the hobgoblin yoke."

 R11_bruised_beaten_title:0 "Bruised and Beaten"
 R11_bruised_beaten_desc:0 "The centuries of internecine squabble between the goblin tribes of the Jade Mines have proven remarkably hard to subdue, but we Khadisrapuri do not shy away from daunting tasks.\n\nUnder our firm guidance, and sometimes a swift backhand slap, these myriad grudges accumulated over the generations have been, if not settled, then at least calmed to a degree that allows for a cautious cooperation between our goblin subjects.\n\nLeaving the murky depths of the mountains to those more than suited to it has thus become a real option, and a Jademarch comprised of those goblin tribes under our rule has been set up to rule the subterranean warrens in our name.\n\nThe fact that it would now be goblins lording over their hobgoblin kin in a stunning reversal of fortune might have sweetened the deal considerably."

 R11_civilizing_rabble_title:0 "Civilizing the Rabble"
 R11_civilizing_rabble_desc:0 "The goblin tribes of the Jade Mines have for the most part of their history alternated between carving out a meagre existence beneath the deep shadow cast by the dwarven holds or roaming the caverns and dwarven ruins as tribal hordes only a half-step above utter barbarism. Their utter subjugation forced upon them by their hobgoblin kin has not helped matters, leaving them scrambling to maintain a semblance of an organized society.\n\nBut all this must change if we are to truly make them a part of our large family of nations and races united under the throne of Khadisrapur. Bringing the blessings of Raheni culture and civilization, grown over millennia in a much more forgiving environment to the gloomy halls and crevices beneath the mountains will require many adjustments and provide a challenge to even the most determined teacher, but who but us will be up to this visionary challenge?\n\nBringing the realm beneath the mountain and the lands above together as one is a task that will live on in the legends of both our peoples."

 R11_laws_indenturement_title:0 "Laws of Indenturement"
 R11_laws_indenturement_desc:0 "The hobgoblins have brought indescribable suffering and devastation to both the lands of Shamakhad and their former home beneath the mountain. Enforcing their penance for these crimes is a matter of justice and aiding them to find their long way towards Nitikamarja and eventual Purtara. But most of those who actually committed these foul deeds have already perished on the battlefield or succumbed to old age. Keeping their descendants in eternal bondage would make a mockery of justice and bar the path towards Purtara for anyone who would enforce this. Instead, the laws of indenturement have been established, ensuring that the hobgoblins work for their redemption and the fruits of their labor are used to repair the damage they and their kin have caused, but allowing those who serve diligently and demonstrate their remorse to eventually finish the terms of their indenture and become a free subject of Khadisrapur."

 R11_god_hope_title:0 "God Lost, Hope Found"
 R11_god_hope_desc:0 "Just like the orcs and goblins before them, the hobgoblins have shown their willingness and ability to become peaceful members of the great family of Rahen, united in their devoted pursuit of Nitikamarja. Who are we to deny them the hope of attaining Purtara? Who are we to cast judgment on them for the sins committed by their forefathers?\n\nLeft to their own devices, they misinterpreted the teachings of High Philosophy and became Godlost, but under our benevolent guidance, they have found their way onto the path of Nitikamarja. Seeing this profound change in a race that only decades ago was feared and pilloried across all of Haless is truly a marvel to behold. It is therefore only right to phase out the laws of indenturement, as they have served their purpose, and ensure that every hobgoblin is born free from now on - a sign of hope for all of us."

