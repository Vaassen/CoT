 #CoT Week 0-1 Truthteller Flatstompa
 cot_terash_horsebutcher:0 "Terash the HorseButcher"
 cot_terash_horsebutcher_desc:0 "Terash has gained such a reputation of decimating Centaur Chiefs in battle that his legacy has become defined by it, and the promise of looting the Centaur's ill-gotten gains afterwards!"
 cot_is_nalla_our_chief:0 "Is Nalla Our Chief?"
 cot_is_nalla_our_chief_desc:0 "While Terash has gained a reputation as a fighter, his constant companion has gained her own reputation. Time and again she has glibly engaged in activity without reprisal that would've earned any orc a thorough trashing. It also has not gone unnoticed on the lads that Nalla has gone from saying 'your' tribe to 'our' tribe, also without Terash saying anything. It has led many to the conclusion that Nalla, for whatever reason, has been given the position of subchief in the Flatstompa lands, and speaks with the same authority as Terash if he is not present."
 cot_gozruks_fortress:0 "Gozruk's Fortress"
 cot_gozruks_fortress_desc:0 "A steaming pile of crap to look upon, this mighty fortress is deceptively resilient, a bastion of pure Dookan malice that has seen the demise of tens of thousands of hobgoblins within a decade of it's construction, the fortress' master offering each corpse to his bloodthirsty god."

