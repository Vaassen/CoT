 dartaxagerdim_legion_reform_tt: "Unlocks a unique decision to reform our armies into the Dartaxian Legions, a professional army to rival the Phoenix Legion of old after curbing the Šebhuliam."
 dartaxagerdim_legion_sebhuliam_reform_tt: "Unlocks a unique decision to reform the tribal and decentralized Šebhuliam into a massive army of the faithful after curbing the Šebhuliam."
 dartaxagerdim_sebhuliam_heir_tt: "Our heir will become a general!"
