 magic_system.86.t:0 "Abandon Magical Advancement?"
 magic_system.86.d:0 "Abandoning our current pursuits could allow us to focus on more important things. But are we certain it is the right course of action?"
 magic_system.86.a:0 "Yes, abandon whatever it is we're working on."
 magic_system.86.b:0 "Perhaps not."