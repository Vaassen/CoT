l_english:

 #Events
 yudunyovi.1.t: "Winds of Ancestry"
 yudunyovi.1.desc: "The movement of humans into the steppes has caused many to seek knowledge of their ancestors from their lost homeland.\nMany seek to find and discover the cultures of the lost and maybe find something else in this search.\nIn doing so, many swear to have seen a mysterious entity show up in their dreams."
 yudunyovi.1.a: "Interesting Indeed"

 yudunyovi.2.t: "A Shine Long Lost"
 yudunyovi.2.desc: "Locals have begun coming together to tell the tales of the old inhabitants of the steppes found in the Ustiq’lik and the dreams of this mysterious dream entity.\nThe name Soiti was rediscovered and associated with this apparition.\nThey tell of a land of fire and winds, on shine unmatched and beauty unrivaled.\nThey began telling the tale of…"
 yudunyovi.2.a: "…The Wordly Gods."

 yudunyovi.4.t: "The Enlightenment of the Steppes"
 yudunyovi.4.desc: "It spread like a wildfire amongst the citizens of the plains. Not just humans but centaurs too began to spread this new faith across the land as many see this as a return to a time of light.\nHumans and Centaurs pray to these deities now, not as individuals but as a pantheon of gods.\nThe Yudunyovi Pantheon has been reborn."
 yudunyovi.4.a: "And I too now see the light."
 yudunyovi.4.b: "Blasphemy!"

 yudunyovi.5.t: "The Worldly Gods"
 yudunyovi.5.desc: "The Yudunyovi Pantheon has been reborn and now we can choose to convert."
 yudunyovi.5.a: "And I too now see the light."
 yudunyovi.5.b: "Blasphemy!"

 yudunyovi.10.t: "Gods of the People"
 yudunyovi.10.desc: "Yudunyovi has a total of 9 gods. You start with one, depending on your origin.\nTo gain the ability to worship the other gods you must first prove yourself worthy of their worship.\nTo do this, you must complete a challenge related to this god"
 yudunyovi.10.quit: "Leave"
