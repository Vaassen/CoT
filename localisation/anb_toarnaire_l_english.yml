l_english: 
 # Missions
 toarnaire_wineries_title:0 "The Wineries"
 toarnaire_wineries_desc:0 "Pushed underground by the Magisterium, the old magical institution of Toarnaire survive in a network of laboratories hidden as wineries. Named "The Fifth Family", they maintain the Roilsardi tradition of Blood Magic alive."
 toarnaire_bloody_rebirth_title:0 "Bloody Rebirth"
 toarnaire_bloody_rebirth_desc:0 "A cultural revolution spread around Cannor. Everywhere it goes, forgotten knowledge resurface. So many domaine are affected, art, science, politic... And of course, magic. There is not a single mage in Toarnaire that do not want to known what these ancient tradition can bring to their craft."
 toarnaire_mageblood_title:0 "Mageblood"
 toarnaire_mageblood_desc:0 "Mageblood can replace Damestear"
 toarnaire_hidden_secrets_title:0 "Hidden Secrets"
 toarnaire_hidden_secrets_desc:0 "Most magical artifacts, alongside Roilsard most isoteric knowledge, were hidden in Tedertoar, the ancestral hall of the Sil Vivin family to prevent them from falling into the hand of the Magisterium. The Fifth Family call on us to open the castle's archive to them, so they could once more make use of the secrets hidden there."
 toarnaire_red_street_title:0 "The Street Runs Red"
 toarnaire_red_street_desc:0 "You though other would not try to take your place?"
 toarnaire_gather_the_league_title:0 "Gather the League"
 toarnaire_gather_the_league_desc:0 "The Lilac Wars have offered us respite, a time to grow while others killed eachother. But that time has ended and the wolves have recovered from their wounds. Lets not fall for the illusion of peace and gather the cities to the defense of the League."
 toarnaire_thorns_must_stand_title:0 "Stand as One"
 toarnaire_thorns_must_stand_desc:0 "Disunity ended Roilsard. The nobles, instead of fighting together, decided to save themself and doomed the duchy in the process. We will not make the same mistake, we will stand as one in the face of any hardship, even if it mean working with these nobles. We only need to distract them from their ambition."
 toarnaire_tasteful_gift_title:0 "A Tasteful Gift"
 toarnaire_tasteful_gift_desc:0 "Under Wineport leadership, we thrived. Lets repay [A16.Monarch.GetName] for the help brought to our city. Lets send him our best bottle of wine as a thanks."
 toarnaire_old_capital_title:0 "The Old Capital"
 toarnaire_old_capital_desc:0 "Roilsard is ours. And with it, more of our brothers and sisters are free from tyranny. Including more nobles from the old capitals..."
 
