 flavor_toarnaire.2.t:0 "The City of Envy"
 flavor_toarnaire.2.d:0 "People are envious of each other"
 flavor_toarnaire.2.a:0 "Truly the city of Envy"
 flavor_toarnaire.2.b:0 "A Canturian City"
 flavor_toarnaire.3.t:0 "A Taste of Blood"
 flavor_toarnaire.3.d:0 "Lol, get outplayed"
 flavor_toarnaire.3.a:0 "Seize Power"
 flavor_toarnaire.3.b:0 "We must be quick"
 flavor_toarnaire.3.c:0 "I will lead the league through these hard time"
 toarnaire_city.1.t:0 "Wine is cool"
 toarnaire_city.1.d:0 "We are awesome"
 toarnaire_city.1.e:0 "Yeah"
 toarnaire_city.2.t:0 "Minorities Gather in Toarnaire"
 toarnaire_city.2.d:0 "As the city of Toarnaire grows, the races of Cannor gather to start a new life here. How should we respond to these peoples?"
 toarnaire_city.2.a:0 "Encourage this! Toarnaire shall rival Anbenncóst!"
 toarnaire_city.2.b:0 "Allow this. More subjects are always welcome."
 toarnaire_city.2.c:0 "Drive them away! Toarnaire is for our kind only!"
 toarnaire_city.3.t:0 "Toarnaire Prospers"
 toarnaire_city.3.d:0 "The city of Toarnaire has continued to prosper, and fortunes continue to look up for it. It has now become one of the most developed cities in Cannor. We can take advantage of the momentum and see the city rise ever-higher."
 toarnaire_city.3.a:0 "Push further, the city's splendor is still matched by others!"
 toarnaire_city.3.b:0 "A job well done already!"
 toarnaire_city.4.t:0 "Toarnaire Triumphant"
 toarnaire_city.4.d:0 "In recent days, Toarnaire has become more wealthy and prosperous than even the legendary city of Anbenncóst. This fact is not lost on the peoples of Cannor, who now rightfully regard Toarnaire as one of the great cities of the continent. Only multi-segmented urban area such as Viswall or Castonath or the deep Dwarven holds can now compare to the glory of Toarnaire."
 toarnaire_city.4.a:0 "True glory has come to the Bay of Wine."
