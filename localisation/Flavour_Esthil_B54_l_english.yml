 B54_mission_breaking_new_ground_title: "Breaking New Ground"
 B54_mission_breaking_new_ground_desc: "Experiment with binding orc/goblin souls to animal corpses, as that might provide a stronger zombie/skeleton with a more suitable shape for some tasks."

 B54_mission_necrocrats_title: "Necrocrats"
 B54_mission_necrocrats_desc: "Empowering experienced necromancers and giving them land grats where they control the undead, as well as ensuring that they have a small retinue of bound spirits from learned people to advise them on "mundane" matters."

