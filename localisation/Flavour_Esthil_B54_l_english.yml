 B54_mission_the_deadmines_title: "The Deadmines"
 B54_mission_the_deadmines_desc: "Mining is backbreaking work: perfect for the undead."

 B54_mission_dealing_with_saboteurs_title: "Dealing with Saboteurs"
 B54_mission_dealing_with_saboteurs_desc: "Because locking up dissidents is surely the sign of an enlightened nation."

 B54_mission_legitimize_our_rule_title: "Legitimize Our Rule"
 B54_mission_legitimize_our_rule_desc: "Getting Patricians to go 'yo, these people are cool'."

 B54_mission_within_white_walls_title: "Within White Walls"
 B54_mission_within_white_walls_desc: "If we control the White Walls and the lands within, it becomes much safer and easier to dev."

 B54_mission_order_of_the_sapphire_eye_title: "Order of the Sapphire Eye"
 B54_mission_order_of_the_sapphire_eye_desc: "Letting the Sapphire Eye back in, if they say nice things about us."

 B54_mission_inviting_claimants_title: "Inviting Claimants"
 B54_mission_inviting_claimants_desc: "Figuring out who should technically own land we want, and then inviting those people to our nation to give us excuses to take it."

 B54_mission_needs_must_title: "Needs Must"
 B54_mission_needs_must_desc: "We need gold, so we'll take it."

 B54_mission_gleam_no_more_title: "Gleam No More"
