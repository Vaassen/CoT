 # Missions
 B54_mission_gather_canrecs_texts_title: "Gather Canrec's Texts"
 B54_mission_gather_canrecs_texts_desc: ""Canrec the Defiler they called him, a visionary that lost himself and brought about the White Pestilence only when Aldresia and her army cornered him like the mad dogs they were. For this folly she was rewarded with an entire order, now following her blind stupor, while Canrec’s work was locked away. But from the small fragment I chanced to find in a fallen tower, it is obvious that there was much more to his machinations than mindless evil.\n\nThe Aldresians would never willingly part with Canrec's work, and if the rumors are true, they never managed to destroy it. Perhaps it is time for a kindred spirit to liberate what was once thought lost to time?"\n\nThe Diary of Varina"

 B54_mission_lodge_of_necromancers_title: "Lodge of Necromancers"
 B54_mission_lodge_of_necromancers_desc: ""Cortaz visited me again today, to discuss the logistics of the upcoming exam. While our territory grows, so too does the size of the invaders within our borders. It is a welcome respite when I see Cortaz's face and I find someone who agrees on what must be done. When he mentioned that many more than I thought possible shared my sentiment, it gave me an idea.\n\nTomorrow we will prepare for the first Esthili Evaluation of The Lodge, to find those mages who possess the ability and will to orchestrate our Necronomics."\n\nThe Diary of Varina"

 B54_mission_in_morgurax_footsteps_title: "In Morgurax' Footsteps"
 B54_mission_in_morgurax_footsteps_desc: ""To 'Follow in Morgurax’ Footsteps requires utmost devotion to what comes next. Ideally one should treat it with as much venerance as one's own funeral, a passing from life to unlife. Care must be taken in every aspect, especially when fashioning the Phylactery: It is to be the home of your spirit, and thus must resemble it in the moment of transfer, else it will feel like an irritating itch for the rest of time. Shamefully, I know this from experience. Curse you, Venac, and your jokes, the spiting joviality is gnawing at the base of my skull, even as I write this."\n\nA treatise on Ascension, by Canrec the Carrion Lord"

 B54_mission_a_source_of_power_title: "A Source of Power"
 B54_mission_a_source_of_power_desc: "While it’s obvious that Necromancy is the finest school of magic - for what other school bestows mastery over life and death, which ultimately allows mastery of all that follows? - the other branches of magic still have their merit, even when it comes to Necronomics. For while Necromancy is the only school that can allow one to create an untiring, unceasing workforce from the ceaseless bodies produced by the Greentide, the others cannot be disregarded.\n\nNo, for the Deadmines and Reapfields to reach their full potential, they should be augmented by the powers found within Divination and Transmutation. Of course, utilizing magic at the scale required to adequately support the Necronomic apparatus is no small feat, and but one which will require a significant amount of magical infrastructure in place... which will not only allow said spells to be deployed at the necessary scale, but also aid our necromancers in improving their skills in the lesser schools of magic."

 B54_mission_the_invaders_title: "The Invaders"
 B54_mission_the_invaders_desc: "According to reports from what envoys still arrive at our court, the question of what to do with the orcs is causing discord in other Escanni realms. Apparently, some foolish individuals are preaching that orcs can be rehabilitated, pointing to examples of orcs that have been cowed into existing alongside humans, but disregarding the fact that these monsters would happily slaughter those humans, if given even half the chance. Others with a modicum of sense warn them of their folly, but whether due to weakness or misplaced sympathy merely advocate for deportation of the monstrous races.\n\nBut expulsion is not good enough for the orcs and goblins. They are nothing more than invaders, and had their numbers allowed it, they would happily have swept across Cannor and continued into Bulwar, leaving nothing but death and devastation in their wake. No, they must be hunted down and killed... but why stop there? Let us reanimate them and put them to work, fixing the damage they have wrought, whether that be by swinging pickaxes in mines or pulling ploughs in fields."

 B54_mission_breaking_new_ground_title: "Breaking New Ground"
 B54_mission_breaking_new_ground_desc: ""It turns out that the undead Orcs and goblins aren't as efficient at ploughing as oxen. Complaints are streaming in from farms, complaining their harvests aren't as bountiful as they used to be, that their new servants are 'scaring the children'. Can't they see that we are helping them get back to their peaceful lives, where the heavy burdens of manual labour will be relegated to the dead, so they may be spared broken bones and bent backs?\n\nI am seeing Cortaz tomorrow. He said that he knew just how to cheer me up, and that he has an idea on how to solve these problems."\n\nThe Diary of Varina "

 B54_mission_necrocrats_title: "Necrocrats"
 B54_mission_necrocrats_desc: "In Anbennar, it is accepted 'wisdom' that mages are unable to effectively govern much in the way of land without compromising their magical studies, needing to rely either on bureaucrats or petty nobles. Yet that need not be the case in Esthil. For where mages elsewhere might find themselves unable to dedicate themselves adequately to statecraft without lagging behind in magical studies, we can easily call on…assistants to speed their progress along.\n\nExperienced necromancers can simply summon souls of those who know how to rule and harness the knowledge they garnered in life, rather than needing to spend years upon years honing their own administrative skills. Let us empower those experienced in the school of Necromancy, giving them parcels of land to rule from mage towers, and letting them govern by calling upon the expertise of a retinue of bound spirits to advise them on mundane matters. This will allow these Necrocrats to not only rule well, but also do so without inhibiting their magical studies."

 B54_mission_reapfields_title: "Reapfields"
 B54_mission_reapfields_desc: "While the Deadmines were an immediate success, our efforts at similarly augmenting agriculture with undead labor saw more mixed results. Regular livestock seemed to recoil from the undead, and most farmers were similarly averse to the skeletons that had been sent to toil at their fields; they believed farming required more hands-on expertise than simply telling a zombie to swing a scythe.\n\nWith our Necrocrats established, however, we can devote entire parcels of land to cultivation by the dead, and if the farmers nearby are unwilling to be reduced to oversee and guide while the dead do the labor in the fields? Why, it is fortunate that there are plenty of spirits for the Necrocrats to call back to serve those roles instead. These farms, dubbed the Reapfields, will help us ensure that Esthil will never again be at the risk of starvation due to the narrow-mindedness of others."

 B54_mission_the_eastern_tower_title: "The Eastern Tower"
 B54_mission_the_eastern_tower_desc: ""To many the White towers of the Magisterium are seen as a comforting ‘beacon of hope’. But in reality it is blinding, burning to those who do not fall in line with the mantra of the Magisterium. At every floor sits a jailer, watching over those below, just as they have jailers above them, all to the very top, where an old fool sits as the ultimate warden of his little tower. Books are hauled higher and higher, so that no one can read and learn from them without enslaving themselves to this very system.\n\nBut I will build my own tower, black as the shade that provides comfort and respite to those fleeing the burning sun. A place that welcomes all creeds to coexist and study, with no oppressive, shortsighted authority determining what can and cannot be studied."\n\nThe Diary of Varina"

 B54_mission_the_castonath_academy_title: "The Castonath Academy"
 B54_mission_the_castonath_academy_desc: "A state cannot be built by mages alone. As such, we have begun the process of rebuilding the disparate educational facilities of Castonath, now to be unified under the banner of the Castonath Academy.\n\nThis institution will be a haven for those deemed too radical by the change-fearing lackwits who deem themselves 'orthodox' - in other words, those who simply fear that change will see their pathetic shreds of power stripped from them, and so hold back the betterment of mankind for their own agenda. But for those radicals, those who dare question the status quo? We shall reach out to them and shelter them, so that they may in turn help us prosper."

 B54_mission_the_esthil_academy_of_magic_title: "An Academy of Magic"
 B54_mission_the_esthil_academy_of_magic_desc: "Even here in Escann, some mages seem unwilling to free themselves from the shackles forced onto them by the magisterium and explore magic without any inhibitions. Perhaps they fear that the magisterium could reach them even here? A foolish notion, of course, but not everyone is made for the work that must be done. Let us establish an Academy where such mages can teach what magic they do know to new and less fettered generations."

 B54_mission_castonath_restored_title: "Castonath, Restored"
 B54_mission_castonath_restored_desc: "To rule Castonath is to be the true ruler of Escann. The city is the heart and throne of the region, making its state of disrepair even more of a blight. The enormity of Balgar's edifices make any repairs prohibitively labor-intensive. Fortunately, we happen to have a ready source of labor available in the orcish invaders.\n\nThey shall be put to work restoring what they ruined, carrying out the shattered stones their kind left behind, and ensuring that Castonath is once again the envy of all Escann."

 B54_mission_necronomic_theory_title: "Necronomic Theory"
 B54_mission_necronomic_theory_desc: "At the invitation of the Estil Academy, I have undertaken an examination of a question ignored by the contemporaries of our age: whether the labor of the dead may, with firm direction, be rendered conducive to the prosperity of the living.\n\nIt is granted that the undead require neither sustenance, rest, nor recompense, and thus may be employed by industry both rural and urban in perpetuity. In this we are presented with a new species of labor hitherto unexamined, whose introduction into a system of commerce must therefore alter the customary relations of production and exchange.\n\nIt is my firm belief that such an alteration will create a newfound prosperity for the common man, but more study is required to ensure it does not result in a disruption of the social order. So I beseech you my friend, travel to Esthil and lend your expertise to this grand endeavour.\n\n- Excerpt from a letter sent by Artur Ritach, former priest of Ara"

 B54_mission_from_souls_to_steel_title: "From Souls to Steel"
 B54_mission_from_souls_to_steel_desc: "Smoothly transitioning to a new system of labor allocation requires the preempting of any bottlenecks that might disrupt the flow of goods. Professor Ritach has already identified one such issue which would hinder the expansion of our mining operations if left unaddressed: a lack of adequate tooling. The dead cannot simply pry ore from the ground, and must be furnished with picks and shovels, our supply of which is being stretched thin by the influx of new labor.\n\nConsequently, a deal has been struck with the Steelhyl scions, assisting them with the restoration of their ruined foundries in exchange for them prioritizing the forging of new and better tools, as well as the establishment of a network of smaller foundries around the Deadmines that shall provide local support with production and repairs."

 B54_mission_the_practice_of_necronomics_title: "The Practice of Necronomics"
 B54_mission_the_practice_of_necronomics_desc: "The implementation of our necronomic programs has, upon the whole, advanced with a great degree of success. The enterprises of extraction, or more boorishly the Deadmines, are already operating at considerable scale, and the accounts of the overseers, corroborated of course by our own auditors, attest to a steady augmentation of output.\n\nIn the cultivation of the land, progress has been more gradual. Certain prejudices among the husbandmen have slowed the adoption of undead labor, but after that dreadful revolt over the new tax was put down, such resistance has dropped to a tolerable degree. The use of deadstock is now the standard across the nation. Thus, with the principal arrangements established, all that remains is to assess the yield of the coming harvest.\n\n- Excerpt from a report to Varina Escer by Artur Ritach, Head of the Necronomics Department at the Castonath Academy"

 B54_mission_the_deadmines_title: "The Deadmines"
 B54_mission_the_deadmines_desc: "It has long been observed that the work of the miner is mayhaps the most dangerous of the common occupations, second only to the soldier in times of conflict. The strains and hazards of such work consume the strength and, in time, the life of the miner at a prodigious rate. Thus, it is an optimal candidate for the introduction of undead labor, as in addition to the general benefits of a tireless and disposable workforce, the details of which I have already expounded at length, the consumed labor of the miners may be redirected to other, less individually destructive pursuits.\n\n- Excerpt from 'On the Productive Employment of Undead Labor' by Artur Ritach. The text was swiftly banned throughout the Empire of Anbennar, and Ritach was stripped of his position as a priest of Ara."

 B54_mission_dealing_with_saboteurs_title: "Dealing with Saboteurs"
 B54_mission_dealing_with_saboteurs_desc: "Despite the explanations for the necessity of the Death Tax and the benefits it would bring, revolts against the state have broken out, and attempts at halting Necronomic activities have become wide-spread. While these rebels and saboteurs must be dealt with, it would be a waste to simply kill them.\n\nBy standing in the way of Varina's vision, they have marked themselves as narrow-minded, regressive fools, and while it would be an exaggeration to say that they were little better than orcs, their actions if left unchecked would inhibit Varina's attempt at bringing utopia to Escann. As such, when a request arrives from the Black Sepulcher to turn Ardent Keep into a prison for dissidents, orc apologists, and other blights upon society so that they can serve as a supply of more varied souls for the Lodge's experiments... why, Varina sees no reason not to deny the request."

 B54_mission_legitimize_our_rule_title: "Legitimize Our Rule"
 B54_mission_legitimize_our_rule_desc: ""My Dear Varina, I write to inform you of the success of our meetings with the representatives of the Patricians within Castanor. At your behest I employed the enchanted honey cakes to great effect. I expected the Patricians to have been more suspicious after all these years under siege of Orcs, but as it turns out it never struck their mind that we would use enchantment magic to tip the scales in our favour. Or perhaps it was desperation for decadent treats after all this time having been cut off?\n\nAlas, they return to their families with gift baskets and more treats to mull over the deal. We have their full support, even if it feels a bit too easy. We will keep a watchful eye on them.\n\nYours truly\nCortaz""

 B54_mission_within_white_walls_title: "Within White Walls"
 B54_mission_within_white_walls_desc: "'Even white walls cast dark shadows, son... Remember that before you venture into Escann these days.'\n - Retired adventurer, now Tavernkeep from Menibór\n\nTo ensure the peace, freedom, justice and security of our new empire, we need protection. Protection from orcish filth that still remains outside of our borders. Protection from foolhardy would-be reclaimers that would thwart Varina's ambitions. And, of course, protection from the backwater fools in the Magisterium when they inevitably descend from their Ivory Towers and attempt to impose their narrow-minded ways upon us. What would serve this purpose better than the legendary White Walls of Castanor, ripe for the taking?"

 B54_mission_order_of_the_sapphire_eye_title: "Order of the Sapphire Eye"
 B54_mission_order_of_the_sapphire_eye_desc: "It seems our growing importance in the region did not go unnoticed; the chivalric Order of the Sapphire Eye has reached out to us with a missive.\n\n'For the greater good...' '...united and in the spirit of chivalry...' '...overjoyed at the news of recent victories...'\n\nAll Varina could think about these lofty declarations was reduced down to a single word - weak. The Order ultimately failed to protect Escann, having promoted a naive practice of resolving conflict through trial-by-combat instead of waging wars. This left the land peaceful, but weak and vulnerable to the Greentide and its devastation.\n\nDespite the surviving members of the Order being vain and naive fools clinging to the past, they somehow still enjoy a high standing and prestige, given their long chivalric tradition. While Varina herself is busy carving out the future, catering to such relics and those that admire them could help improve Esthil's image, even if associating with such fools is distasteful."

 B54_mission_inviting_claimants_title: "Inviting Claimants"
 B54_mission_inviting_claimants_desc: "While we have established ourselves as the foremost power in Escann, we cannot stop there. If we are to not just last, but prosper, we have to expand lest we perish like the many kingdoms that came before us. However, rapid and unjustified expansion would bring unwelcome attention, given the biases acting against us. We are in luck, though, for there are many displaced nobles, heirs, landowners and the like that saw their lands lost in the Greentide.\n\nIf we invite these these claimants and conquer not for ourselves, but for the 'noble' reason of returning the stolen lands to their rightful owners, we can paint ourselves as liberators,even if these claimants then turn around and swear fealty to Varina.\n\nAnd as it happens, the Order of the Sapphire Eye and the Patricians are well-suited for this task, and willing to lend their aid. Their reputations and prestige, paired with our strong and increasingly stable position, shall create an irresistible lure for those whose claims we wish to... co-opt."

 B54_mission_needs_must_title: "Needs Must"
 B54_mission_needs_must_desc: "The grain situation has become an issue we can no longer ignore. Until we can manage a more permanent solution, we are reliant on foreign merchants who are all too happy to gouge us on prices. What's more, the lack of internal gold supply forces us to rely on foreign merchants for bullion, harming our economy by leaving us at the whim of greedy opportunists.\n\nVarina can tolerate this state of affairs no longer. Fortunately, a solution might be at hand: were we to seize the rich gold mines of Gulenhyl and put our untiring labors to work there, we shall have plenty of gold. This will allow us to not only reliably mint our own coins, but also permit the state to subsidize the import of grain, to offset the harm that the extortionate prices charged by foreign merchants is doing to our realm."

 B54_mission_gleam_no_more_title: "Gleam No More"
 B54_mission_gleam_no_more_desc: "Calindal, the gleaming blade, remains a relic of an older order, one that places legitimacy beyond our control; one that was used against us once, and cannot be allowed to do so again. As long as it endures in its current form, so too does the authority it represents. Its current wielder stood among the coalition that rose against us, their presence lending strength and resolve at a critical moment. So long as such symbols can be turned against us, the blade remains a threat beyond mere steel.\n\nBy dismantling the enchantments bound within Calindal and reforging its essence into a sceptre, we will transform a symbol of judgment into an instrument of rule. One that will grant Varina the focus of power she needs, while shattering the legacy that once inspired our enemies.\n\nAnd the hero that led these backwater fools in resistance against our rise? He shall march again against our enemies, with no mind to think, no will to break, no voice to cry suffering. Born of death and suffering, he will return as a hollow knight, demoralizing those he once emboldened."

 B54_mission_putting_down_zealots_title: "Putting Down Zealots"
 B54_mission_putting_down_zealots_desc: "Zealots of Corin have been a thorn in Varina's side ever since the inception of our fledgling state. But what can you expect from a group of half-witted vagabonds led by a lowly half-orc spawn? Lothane Silmuna... "Bluetusk," they call him. What a sad and ironic state of affairs it is for a heroine who led all of us in the killing of orcs to be represented by one of them in the end, and for a noble line such as the notorious Silmunas to be sullied with orcish blood.\n\nRegardless of what delusional fanatic they elect to lead them, however, the time has come to finally put this nuisance to an end, once and for all. Their actions pose a real threat to the stability of Varina's rule, and while there is nothing worse than the accursed, backwater fools in the Magisterium, the equally backwater fools with delusions of grandeur from Corintar could give them a run for their money.\n\nAs such, If Varina is to succeed, if Esthil is to succeed...\n\nThe Corintar. Must. Fall. "

 B54_mission_zaamalot_title: "Zaamalot"
 B54_mission_zaamalot_desc: ""The archetypal black dragon, Zaamalot the Black, was the very pinnacle of cruelty and malevolence. Incredibly sadistic, (...) he was said to thrive in chaos, for it allowed him to dominate those beneath him as an apex predator. (...) At times, as in his one-sided battle against Alos the Copper, he would allow his prey to flee - whether so he might torment them again later, or so that they might remind others of his terrible deeds."\n- Encyclopedia Draconika, Kromwell Print\n\nAccording to the Patricians, the corpse of Zaamalot the Black can be found deep beneath Castanor - but unearthing the fallen dragon will not be easy. While catacombs and a few hastily dug tunnels allowed the Patricians to verify the presence of the corpse, much more digging will need to be done if Zaamalot is to be used against anything but ancient debris and walls of earth.\n\nAlready, Varina can imagine the glorious sight it would be for it to tear its way free and roam the skies once more, putting the backwater past behind us and paving the way to the future."

 B54_mission_rule_from_the_skies_title: "Rule from the Skies"
 B54_mission_rule_from_the_skies_desc: ""Pack your things - only what’s important - now! We are leaving for our family in Anbenncost."\n\n"But mom... why do we have to leave? I thought the orcs were defeated?"\n\n"Don't ask questions and do as I say! Gods, the age of darkness is upon us..."\n\n- Unnamed family fleeing a village near Escinn.\n\nDespite the oppressive Magisterium, despite the ignorant Corinites, and despite the shortsighted ambitions of other adventuring kingdoms, Esthil has prevailed, and the hour of our triumph is nigh.\n\nWith our opposition beaten back, all that remains is for Varina to extend her reach across Escann, and with Zaamalot acting as her steed and Calindal reforged as her Sceptre, any who would stand in her way will meet a swift death.\n\nAnd should the embers of rebellion simmer after she has left? Why, the dread citadel of Morgurax - the greatest feat of magical engineering Cannor has ever seen - can be deployed to remind the people of why defying Varina's rule is a great folly.\n\nFinally, Varina is positioned to usher in a new, enlightened age. The Age of Esthil. The Age of Varina."

 B54_mission_the_traitors_due_title: "The Traitor's Due"
 B54_mission_the_traitors_due_desc: "Despite the enemies already arrayed against Esthil, the so-called Floodborn Council have struck at Varina and failed to kill her, though not for lack of trying. For this brazen treason, Varina would dearly love to see them consigned to a slow and tortuous existence until their souls - nay, their very selves - are entirely spent after decades of immense suffering.\n\nUnfortunately, indulging in such gratification would be a waste of resources. No, while these traitors must be dealt with, their punishment will be to act as the catalyst in a great ritual that shall enable the state to turn the tides against those who stand against us. Of course, they do need to die to power the ritual, but the manner of said death? Why, it being immensely painful will hardly detract from rite."
 flavor_esthil.23.insight: "\n§GEvent Insight:§!\nThe soul of a singular Mage is strong. Hundreds of Floodborn souls? With that sort of power... the dead may turn back our enemies."

 B54_mission_morgurax_title: "Morgurax"
 B54_mission_morgurax_desc: "As our territory expands, alongside Varina's ever-growing list of plans and ambitions, it is becoming increasingly tiresome to dwell on petty unrest and the opposition of the narrow-minded within our realm.\n\nA host of solutions has been proposed by numerous talented individuals vying for Varina's favor - including, but not limited to, conventional torture, paying henchmen, or using petty enchantment spells - but she already has her eyes set on another, much more ambitious feat that would allow her to send a message to all dissidents that the righteousness of her reign is not to be questioned.\n\nThat feat of magical engineering is Morgurax - an imposing flying fortress that could be stationed at any place in Esthil that currently requires some additional "persuasion".\n\nThe Northern Citadel, one of the most iconic symbols of old times in Escann, shall serve as the basis for this impressive project, so that this crumbling carcass of architecture from the past shall serve as a foundation for Varina's future."

 B54_mission_black_empire_rising_title: "Black Empire Rising"
 B54_mission_black_empire_rising_desc: "Had she been allowed, Varina would have been content letting time spread her utopia across Escann and, eventually, the rest of Cannor. If left to prosper for decades, exporting an enormous amount of ore and grain, the rest of Cannor would have been forced to acknowledge her ideals as the future... but that had not come to pass.\n\nNo, Cannor had made it clear that if she wanted to realize her dream of a society where only the dead needed toil and do hard labor - the one she had shared with Cortaz so long ago - she would need to do so at the head of what the rest of Cannor would label a 'Black Empire'. Already, she knew what people called her when they thought her agents weren't listening. In the future, she would be known as the visionary who brought upon a golden age where the dead toiled so that the living might prosper. But for now? Let Escann know her by one dread moniker..."

 B54_mission_let_the_drowned_serve_title: "Let the Drowned Serve"
 B54_mission_let_the_drowned_serve_desc: "If one good thing came of the War of the Black Tower, it was that the Floodborn showed their hand. Had they waited for decades, amassing more experience and skill to go with their great potential for raw magic, their attempt at usurping leadership would likely have been successful... and Varina has no intention of permitting another generation of Floodborn to learn from the mistakes of their predecessors and succeed where the Floodborn Council failed.\n\nThus, a vast network of Mage Towers must be set up across Escann and combined with great prowess in Divination to detect when Drownings occur, and ensure that those who survive it are slain soon after. Of course, it would be wasteful to simply let their souls pass on, so the Mage Towers will serve not only to detect Drownings, but also act as a node in a great network directing these souls to Castonath, where they will be trapped in a Well of Souls and used for the benefit of the state."

 B54_mission_inner_circle_everliving_title: "Inner Circle, Everliving"
 B54_mission_inner_circle_everliving_desc: "With every new mage born within Escann subject to Drownings, and thus ultimately either a liability or a resource to be harvested, the future of the Lodge of Necromancers is in a precarious position. While Esthil does regularly grant refuge to mages wanting to flee the oppressive rules and regulations laid down by the Magisterium, relying solely on this to replace aging members of the Lodge of Necromancers is not sustainable.\n\nThus, Varina must ensure that the aging members of the Lodge of Necromancers need no longer suffer from said aging. Though Varina is unwilling to share the full secrets of the Lichdom ritual, she is willing to share a pared-down version of it with trusted members of the Lodge of Necromancers, so that they may share in immortality, though unlike Varina they will perish if their physical form is slain."

 ## Events
 # Regular Events
 flavor_esthil.2.t: "An Ambitious Plan"
 flavor_esthil.2.d: "Canrec the Defiler, acolyte of the Sorcerer-King and architect of the White Pestilence. While the name might strike fear or anger into some, for Varina, it held neither. A certain amount of healthy respect, of course, but in truth, she would have loved to have met the man in his time.\n\nInstead, she has settled for reading his works. Copied by the furtive hands of acolytes and poseurs who wished to emulate him or keep his knowledge in circulation, pages and documents written by the man have survived in secret places. But while the collection she holds in her hands now is great, perhaps greater then any before, they are not enough. Key texts are missing, and the only place in the world they might rest is in the original copy of Canrec's biography: the §O(Grimoire of the Defiler)§!. In the hands of the Orda Aldresia who defeated Canrec so long ago.\n\nThe only way forward is to take what they have locked away."
 flavor_esthil.2.a: "It shall be done."

 flavor_esthil.3.t: "The Question of Agents"
 flavor_esthil.3.d: "While the Orda Aldresia is but a shadow of its renowned past, relegated to being ceremonial bodyguards of the Emperor of Anbennar, directly attacking the Orda Aldresia is still out of the question, so the only other reasonable solution is to take by stealth what cannot be taken by force. To that end, Varina considers her options carefully. A single professional thief could get the job done, but would be expensive. Some of the locals of the Order's territory may be bribable, and that would be cheap, but how effective could they really be?\n\nAnother possiblity is the use of not one professional, but a band of them. Such a group would almost certainly be able to finish the job, but would be much more expensive.\n\nOf course, Varina could always put her trust in her magical skills."
 flavor_esthil.3.a: "Let us hire a true professional. A master thief."
 flavor_esthil.3.b: "A group of local thugs will do. The Order doesn't rule well."
 flavor_esthil.3.c: "Only the best of the best will do. Where one thief might fail, five shall not."
 flavor_esthil.3.e: "Only the best of the best will do... luckily I have just the spell!"

 flavor_esthil.4.t: "A Way In"
 flavor_esthil.4.d: "With the choice made, the agents must come up with a plan to get through the front door of the castle-monastery; this is made more difficult by the fact that the Orda Aldresia is designed, by its very nature, to be paranoid of upstart mages attempting just what Varina is. Every armor has a weak-point, however.\n\nThe most straight forward solution would be to try and breach Arca Aldresia by night. If successful, perhaps no one would ever know they were there at all.\n\nA less parsimonious action might be to simply bribe the custodian in charge of the vault. A small fortune for the man should make him forget any vows he had, especially if we are vague about why exactly we want to get in. The Order has become infamous for corruption, but even that goes only so far.\n\nWhere stealth and bribery may fail, guile may win out. Esthíl is a legitimate state, after all, and such states often send out diplomat missions; most diplomats double as spies, and everyone does it anyway. A delegation sent under the guise of official business could easily be left to their own devices for a few hours ...."
 flavor_esthil.4.a: "Let none know you were there; sneak in at nightfall."
 flavor_esthil.4.b: "We shall bribe the Order custodians. All things glitter."
 flavor_esthil.4.c: "Perhaps a disguise would be best. Ready the documents!"

 flavor_esthil.5.t: "The Vault"
 flavor_esthil.5.d: "The Vault is no mere room for storage; instead it is a complex of individual cells and storage areas, meant to contain a mixture of magical items, both the rare and highly dangerous. Individual cells can themselves be a complex, and Varina's agents find themselves faced a labyrinthian maze made all the more dangerous by various traps.\n\nThe only way forward is through the traps; several solutions offer themselves, but only three allow for speed. Setting off the traps from a safe vantage point might do it, but could be very loud and potentially fatal. Disabling or moving through them safely must be an option, or else the Orda could not check on their charges; and at first glance, there are many artifacts magical in nature that could very well disable, or at least nullify, the traps."
 flavor_esthil.5.a: "Discharge them - hopefully this wont be too loud."
 flavor_esthil.5.b: "No system is perfect; they can find a way through, silently."
 flavor_esthil.5.c: "Perhaps we can use one of the other stored items to get rid of the traps?"

 flavor_esthil.6.t: "In Our Grasp"
 flavor_esthil.6.d: "The final lock is as mundane as could be. Complex, but mundane. Near silence fills the otherwise empty vault as clothed hands carefully manipulate tumblers until, with a soft click, the lock releases.\n\nInside the box, so carefully warded and protected, is a plain looking leather journal. Was this it? The infamous §O(Grimoire of the Defiler)§!? To the eyes of the agents it would be as indiscernable from any other tome, but no, this was it. Now they simply needed to extract the item they were hired to, hopefully without being found out."
 flavor_esthil.6.a: "It is ours, and with it, knowledge"
 flavor_esthil.6.b: "Our getaway was not as clean as we had hoped; the world trembles in anger and fear"

 flavor_esthil.7.t: "The Assembly"
 flavor_esthil.7.d: "At long last, the Iron Sceptre has achieved its goals; through conquest, diplomacy, and adventuring, the ragged band of former magisters, adventurers, and explorers is now in position to stake a claim - not merely as a company, but as a country. Houses replace tents; warcamps become forts; and forage land becomes farmland.\n\nWith their end goal clearly in sight, a great assembly is called of various influential company members, captains, explorers, magisters, and settler-folk with no less a goal then the establishing of a new Escanni nation. One of the first, but most important decisions, is who will lead them in the coming years."
 flavor_esthil.7.a: "Let us hope for a swift decision."

 flavor_esthil.8.t: "The Deadlock"
 flavor_esthil.8.d: "After days of arguments, negotiations, votes, and decisions, it all ends in a deadlock.\n\nOn one side sits Ardor. An old hand in the company, and a former professor from the Magisterium, he is well known amongst the veterans and seems to have the vote of many of the more conservative elements of the company. The Iron Sceptre has flourished under men like him, and many members who have served alongside him spread talk of the celebrations which were held after victories. His opponents vary in opinion, from those who simply find him too conservative, to those who dislike his tendency to meddle and enter choleric tempers, while some of the older members of the company recall the rumors of abuse of his substantial skill in enchantment.\n\nOn the other sits Varina. A relative newcomer to the company, she has nonetheless shown competence in leadership and strategy. While many of the more conservative members of the Iron Sceptre remain ill at ease with her methods, her ability cannot be denied. A necromancer of exceptional talent, her actions on the field have led to more than one victory. She is ruthless to her enemies, and holds a burning hatred of the orcs occupying the land, which is no penalty amongst the Iron Sceptre. Her base is largely comprised of the young, the radical, and those truly seeking to break the chains that held magic back for so long. Had her mindset been allowed, they argue, perhaps the Greentide would have failed.\n\nWith a hush, the final voter raises their voice, and calls out for..."
 flavor_esthil.8.a: "Varina. Her ideas will leads us through a new age."

 flavor_esthil.9.t: "A New Dawn"
 flavor_esthil.9.d: "Varina giving a speech about how killing orcs is just, but how Esthil needs to go further: need to not only kill the Orcs and Goblins, but also animate them - despite this causing excrutiating pain to their souls - as recompense for damage they caused to Esthil. Yes, she's a blatant necromancer, but she promises to only use necromancy against orcs and goblins, so it's fiiiine."
 flavor_esthil.9.a: "Long Live Varina!"

 flavor_esthil.10.t: "Reactions abroad"
 flavor_esthil.10.d: "People abroad don't like Varina being a blatant necromancer."
 flavor_esthil.10.a: "We'll show them!"

 flavor_esthil.11.t: "Fleeing Peasants, Rising Prices"
 flavor_esthil.11.d: "Peasants are fleeing due to our use of the dead, making food prices rise."
 flavor_esthil.11.a: "One day the dead will work their fields!"

 flavor_esthil.12.t: "Noble Demands"
 flavor_esthil.12.d: "Nobles who are apparently the 'rightful' rulers of much of the lands we rule are asking to be reinstated."
 flavor_esthil.12.a: "Fuck 'em."
 flavor_esthil.12.b: "They can have a few rights."
 flavor_esthil.12.c: "Fine, restore many of their rights."

 flavor_esthil.13.t: "Where Few Dare Tread"
 flavor_esthil.13.d: "By now, Varina had lost count of how many orcs and goblins she had personally dispatched. Hundreds, easily. Thousands? Probably. So why was she hesitating? Why had she not already slit the throat of the immobilized goblin in front of her and fed it to her phylactery?\n\nShe knew why.\n\nWhile this creature would be the first of an endless stream of its misbegotten kind to fuel her immortality, it was not the first victim of her immortality.\n\nDecades ago, he had promised Varina his heart and had stood steadfastly by her side ever since, even as the world turned against her. And for that...\n\nFor that, she had... She had claimed his heart. She had thanked her Cortaz that fateful day. Had kissed him gently, had caressed his face, had lulled him to sleep with his face in her lap, a small, content smile on his lips.\n\nShe had tried to make it painless. She had. But any magic would have interfered with the process, and the sedatives she had slipped into his meal had not been strong enough to counteract the pain as she opened his chest and carved out his still-beating heart.\n\nHer skin was still a few days away from sloughing off, so she could yet close her eyes as she remembered his expression as he bled out. Oh, if only she could have eased the process, but no... she had had to watch the life fade from his eyes, her voice quivering as she promised that she would create a new and better world, as they had always dreamed of doing.\n\nAnd then... she had had to violate him further still. Not only had she needed to craft the potion vessel from his heart, the only way to guarantee success had been to use Cortaz' soul for the spells, to use up not only his heart but also his very soul, his self.\n\nWith a snarl, she broke out of her reverie and slit the throat of the goblin, then ended the spell that kept it paralyzed. With grim satisfaction, she watched it grasp at its throat, futilely trying to stem the bleeding, before it dropped over, letting her claim its soul and feed it to her phylactery.\n\nCortaz was gone, but so long as she lived, his dreams and hopes lived on through her. Compared to that, what did the life of a single goblin matter?"
 flavor_esthil.13.a: "And if a million more must follow, so be it."

 flavor_esthil.14.t: "The Restoration"
 flavor_esthil.14.d: "The dead marching through Castonath not to fight, but to repair. Surely this will be a reassuring sight!"
 flavor_esthil.14.a: "Huzzah!"

 flavor_esthil.15.t: "Craven Merchants"
 flavor_esthil.15.d: "Merchants are fleeing from Castonath in large numbers, and the ones who remain or visit now charge higher prices for their goods, including prices."
 flavor_esthil.15.a: "How could this happen?"

 flavor_esthil.16.t: "The Theory of Necronomics"
 flavor_esthil.16.d: "Yes, Varina promised to not use necromancy on humans, but for necronomics to be sustainable she needs to bend that a liiitle bit. Some necromancers will try to see how much pain souls will be in if they are real careful and considerate while raising them. Besides, just being alive is painful, isn't it? Hunger, thirst, aches, and so on. Your soul being used to animate your body might not be all that bad in comparison!"
 flavor_esthil.16.a: "Surely necromancers will prove up to this task."

 flavor_esthil.17.t: "Death Tax"
 flavor_esthil.17.d: "Magibabble, necromancers have determined the minimum level of pain suffered by animated souls which... is still pretty painful. But hey, if they let animated humans go after a few years rather than using them until their soul disintegrated like they would with orcs, it's fiiine. The souls will even have most of their memories and sense of self left afterward! Time to tell the people about this new tax, and how it's for the glory of Esthil!"
 flavor_esthil.17.a: "Surely they will not mind too much."

 flavor_esthil.18.t: "Death Tax Revolt"
 flavor_esthil.18.d: "The people don't like the Death Tax."
 flavor_esthil.18.a: "Well, time to kill some people."

 flavor_esthil.19.t: "Theft within the Vaults"
 flavor_esthil.19.d: "The Custodian of the Vaults went about his grim business, his underlings bringing him a steady string of reports from the vault beneath as they checked the security systems. Someone had broken through, and now came the audit, to find what was taken.\n\nWith a falling silence echoing up the corridor, the custodian looked up to see one of the young members of the order, his face drained of all blood. The Custodian looked at him, then down at the great ledger, his hand trembling as he traced his finger down to the one unaccounted for item.\n\nThe Grimoire of the Defiler, the personal research notes of Canrec the Defiler, was gone."
 flavor_esthil.19.a: "We must prepare for the worse."

 flavor_esthil.20.t: "Skull Keep"
 flavor_esthil.20.d: "Establishing a prison for political dissidents and the like. Oh, and if they are so fond of orcs, treat them like orcs, and use their souls for whatever experiments you like."
 flavor_esthil.20.a: "The necromancers liked that very much."

 flavor_esthil.21.t: "Zaamalot Rising"
 flavor_esthil.21.d: "Raising Zaamalot as a skeleton dragon, by having thousands of skeletons dig him out of the hole he fell in, and then sacrificing their souls to reanimate him. He's big and scary and knocks over a bunch of stuff when reanimated."
 flavor_esthil.21.a: "I shall ride him into battle!"
 flavor_esthil.21.b: "I shall ride him into battle!"
 flavor_esthil.21.c: "Maybe at a later point."

 flavor_esthil.22.t: "Lich-Queen of Escann"
 flavor_esthil.22.d: "Varina ruling all of Escann with a skeletal, iron fist."
 flavor_esthil.22.a: "This is a good end, right?"

 flavor_esthil.23.t: "The Traitor's Due"
 flavor_esthil.23.d: "Using the traitor Floodborn as a source of power to cast army of the dead, and using traitor Patricians as a link to the lands within the White Walls."
 flavor_esthil.23.a: "Rise!"

 flavor_esthil.24.t: "A Tribute of Knowledge"
 flavor_esthil.24.d: "The loyal patricians are quite scary and would prefer not to be killed, so they made themselves useful by digging through ancient books and figuring out where the black dragon Zaamalot is buried, deep within Castonath."
 flavor_esthil.24.a: "Huh, useful patricians. How quaint."

 flavor_esthil.50.t: "Floodborn Potential"
 flavor_esthil.50.d: "Floodborn lore dump. TL;DR after the Crimson Deluge, mages in Escann would undergo something called 'The Drowning' that probably killed them, but if they survived they would become very powerful. Their power means that they can be quite useful to us."
 flavor_esthil.50.a: "Excellent."

 flavor_esthil.51.t: "Death of a Dream"
 flavor_esthil.51.d: "Varina has died, and though her achievements will remain, the rulers that come after her share neither the dream nor the drive to drive [B54.GetName] to the same heights as Varina would have done."
 flavor_esthil.51.a: "A tragic end."

 # War of the Black Tower buildup
 flavor_esthil.30.t: "The Fruits of Undead Labor"
 flavor_esthil.30.d: "Varina receiving reports about how Necronomics is making the price of grain crater, making food much cheaper."
 flavor_esthil.30.a: "Huzzah!"

 flavor_esthil.31.t: "Milling Around"
 flavor_esthil.31.d: "A farmer trying to get his grain milled, but so much grain is being made that the mills are backed up, so he has to try to go farther and farther away from his home trying to get his grain milled, eventually agreeing to trade grain to a mill owner for flour... but less than he should have gotten."
 flavor_esthil.31.a: "Ah well."

 flavor_esthil.32.t: "The Death Tax"
 flavor_esthil.32.d: "The same farmer's father has died during the winter, weakened due to the family not having enough to eat. By law, the family has to report this so that necromancers can raise the father for undead labor. The family is debating whether to try to hide the death, when they hear a knock at the door."
 flavor_esthil.32.a: "And when they opened the door, a wizened man entered."

 flavor_esthil.33.t: "Old Comrades"
 flavor_esthil.33.d: ""Lothane, we face an evil even worse than the Greentide. They, at least, only killed their victims. Esthíl, meanwhile," Dominic shook his head, trying to put the horrors wrought by the necromancers into words, "It is Nerat's responsibility to judge souls, but Esthíl traps the souls of slain orcs and goblins, then consumes them utterly to power their fell works, and treats its own citizens only slightly better."\n\n"What would you have us do, my friend? We are old," stated Lothane, gesturing at the mantle behind him. There, the sword he had wielded during the Greentide rested... rust set upon it. "I am no warrior anymore, nor do I command armies. All I do is write about more heroic days, waiting for death to claim me."\n\nTo call the half-orc wizened would be an understatement. His skin was wrinkled, his hair a stark white, and his movements slow. Dominic knew he was little different. As a young man, he had sometimes caught himself indulging in vanity, but now he was a prune of a man. One hundred and... something.\n\nHe should have died years ago, withered away from old age like so many of his friends or peers, but Nerat seemed to favor him.. and Lothane too. Dominic had no other way to explain their age, advanced well beyond what should have been possible for them.\n\n"These are dark, dreary days. Escer's forces have swept across much of Escann, smothering opposition. The people do not need a warrior, not even a commander... they need someone to inspire them." Dominic's smile turned wry. "Founder of the Faith I might be, but your writings always resonated more with the people."\n\n"But what more is there to write? Your memoirs are already a cornerstone of the Faith. Would you add 'Musings of an Old Man, Waiting for Death', to the scripture?" Dominic's words were mocking, but if that was what it took to rouse his friend, so be it. "Rally the people, Lothane. You think the Circle chose you to lead the Corintar because you were closest to Corin? No, were always the best of us, that's why. So my friend, rally, and prove to the world once more that you are the Hand of Corin. Call upon the faithful to rally, and remind them of her mission: To fight evil."\n\nSeconds trickled by, and just as Dominic feared that he had failed, Lothane rose, glancing back at the rusted sword on the mantle. "I shall need a new weapon.""
 flavor_esthil.33.a: ""You know where to find one to inspire the people, and a shield too.""

 flavor_esthil.34.t: "Silmuna Solidarity"
 flavor_esthil.34.d: "Rogieria or remnants of it attacking Esthil, due to Lothane's words."
 flavor_esthil.34.a: "Let them come."
 flavor_esthil.34.b: "Let them come."

 flavor_esthil.35.t: "Chivalric Resistance"
 flavor_esthil.35.d: "Order of Sapphire Eye rallying many of the nobles of the realm against the 'evil' Varina."
 flavor_esthil.35.a: "They think they stand a chance?"

 flavor_esthil.36.t: "The Breach of Skull Keep"
 flavor_esthil.36.d: "Dominic and Lothane breaking into Skull Keep, where they find some very incriminating records about horrific experiments performed on human souls."
 flavor_esthil.36.a: "Whoops."

 flavor_esthil.37.t: "The War of the Black Tower"
 flavor_esthil.37.d: "Varina PoV. Declarations of war coming in from all of Escann, with demands for Varina and her necromancers to surrender themselves for justice. Varina being decried as a would-be Sorcerer-Queen."
 flavor_esthil.37.a: "It begins."

 flavor_esthil.38.t: "Magisterial Intervention"
 flavor_esthil.38.d: "Magisterium sending mages to help against Esthil."
 flavor_esthil.38.a: "Boo, they suck."

 flavor_esthil.39.t: "Magister-Militant Mobilization"
 flavor_esthil.39.d: "Magisterium having mobilized forces too."
 flavor_esthil.39.a: "More boo!"

 flavor_esthil.41.t: "Floodborn Betrayal"
 flavor_esthil.41.d: "Floodborn betrayed Esthil, but Varina won! Still, if they attacked her they likely knew where her phylactery was, so she needs to go and defend it."
 flavor_esthil.41.a: "My phylactery!"

 flavor_esthil.42.t: "The Vault"
 flavor_esthil.42.d: "Varina arriving at the vault where her phylactery is guarded. Floodborn are fighting and winning against older mages loyal to Varina, but Varina's arrival turns the tables. However, the Floodborn were in league with some of the Patricians, and large parts of the city have risen against Varina's rule."
 flavor_esthil.42.a: "Damn them!"

 flavor_esthil.43.t: "Floodborn Betrayal"
 flavor_esthil.43.d: "Floodborn betrayed Esthil and Varina lost. As her physical form is shattered, she worries that they might know where her phylactery is hidden, since otherwise they likely wouldn't have struck."
 flavor_esthil.43.a: "Oh no!"

 flavor_esthil.44.t: "The Flight"
 flavor_esthil.44.d: "Varina resurrecting not in the vault her phylactery was in, or even in Castonath, but rather in the deepest levels of Esthil, the tower. Mages loyal to her managed to get her phylactery out of the vault and out of the city, with the help of some loyal patricians, before the Floodborn could destroy it and kill Varina for good. However, traitor Floodborn and Patricians now control all of Castonath."
 flavor_esthil.44.a: "Curses!"

 flavor_esthil.45.t: "Let There be Light"
 flavor_esthil.45.d: "Someone emerging with a reforged Calindal, greatly increasing the morale of the anti-Esthil coalition."
 flavor_esthil.45.a: "Even more curses!"

 # Necronomics events
 flavor_esthil.101.t: "Toiling Souls Depleted"
 flavor_esthil.101.d: "You ran out of souls to work Deadmines and Reapfields, RIP. Well, you don't allow souls to rest in peace, that's the whole point!"
 flavor_esthil.101.a: "Duly noted."
 flavor_esthil.101.b: "Do not bother me with this in the near future."
 flavor_esthil.101.c: "Never bother me about this again."

 flavor_esthil.102.t: "Toiling Souls Depleted"

 flavor_esthil.103.t: "Toiling Souls Depleted"
 flavor_esthil.103.d: "You tried to spend more soils than you had, so Support Construction has been disabled."
 flavor_esthil.103.a: "Duly noted."
 flavor_esthil.103.b: "Do not bother me with this in the near future."
 flavor_esthil.103.c: "Never bother me about this again."

 flavor_esthil.106.t: "Toiling Souls Depleted"
 flavor_esthil.106.d: "You tried to spend more soils than you had, so Support Development has been disabled."
 flavor_esthil.106.a: "Duly noted."
 flavor_esthil.106.b: "Do not bother me with this in the near future."
 flavor_esthil.106.c: "Never bother me about this again."

 # Magic Project events
 magic_project_esthil_necronomics.0.t: ""
 magic_project_esthil_necronomics.0.d: ""
 magic_project_esthil_necronomics.0.a: ""

 magic_project_esthil_necronomics.1.t: "Necronomic Experiments"
 magic_project_esthil_necronomics.1.d: "While the pinnacle of Necromancy is Morgurax' Lichdom ritual, the most iconic spell is Animate Dead, which has its roots in ancient and revered Milcorissia. While Morgurax himself reworked what was once an elaborate and time-consuming ritual into a spell that could be cast in a minute or two by even a middling mage, he did not change the core application: reanimating a humanoid corpse, most generally by binding the soul that originally inhabited the body. Since then, necromancers have frequently found themselves hunted by the ignorant and narrow-minded, and so were relied on the Animate Dead spell to create bodyguards to protect themselves.\n\nHowever, here in Esthíl, we have the luxury to consider what purposes the spell can be put to, other than bodyguards. Already, there have been discussions as to what labor could instead be performed by untiring and complaint undead. A few initial experiments have been carried out in fields, such as making skeletons pull ploughs in the place of oxen, but several skeletons were required to replace even a single ox.\n\nThis inspired a question: what if we could bind orc souls to animal corpses, such as oxen or horses? In theory, such bodies should have greater strength, and while they would be unable to use tools, their bodies should be more suitable for a great deal of work, whether that be pulling ploughs, hauling carts, or even just being used as pack animals. The necromancers are eager to experiment with this idea, and have asked for plenty of souls to be made available for these experiments.\n\n- Monthly report of the Black Sepulcher, [GetMonthName] of [GetYear]"
 magic_project_esthil_necronomics.1.a: "Make do with what you have."
 magic_project_esthil_necronomics.1.b: "You shall have them."
 magic_project_esthil_necronomics.1.c: "You shall have what you ask for, and more."
 magic_project_esthil_necronomics.2.t: "Beastly Souls for Beast Bodies"
 magic_project_esthil_necronomics.2.d: "As expected when breaking new ground, experiments yielded not only expected results, but also unexpected ones. Among the expected results is that while the animal bodies are indeed more suitable for labor, it seems that the souls of orcs are not as well-suited to being bound to animal bodies as they are to humanoid ones, resulting in their souls unravel faster than if they were simply bound to orc or even goblin bodies, and also seem noticeably less responsive. This is fortunately not an issue for most straight-forward tasks, such as simply pulling a plough or cart, but anything more complex than that is infeasible.\n\nOne unexpected result is that while all souls used in necromantic spells suffer for it, this suffering seems to be significantly amplified when they are bound to bodies different from those they inhabited in life. When interrogating them, significantly more pain is required to compel them to stop bemoaning their suffering and answer questions.\n\nIt is naturally difficult to quantify exact levels of pain, but by inflicting a standardized and significant level of suffering upon orcs before they are executed and used for reanimation, it has been discovered that souls bound to animal bodies suffer roughly four times as much pain as if they were simply bound to their own bodies. For the sake of curiosity, orc souls were bound to goblin bodies and vice versa, but the increase in suffering was high enough to be measurable.\n\nWork continues apace, with the latter discovery viewed as a good thing, as it means greater suffering for the orcs and goblins, as retaliation for the devastation they have wrought upon Escann.\n\n- Monthly report of the Black Sepulcher, [GetMonthName] of [GetYear]"
 magic_project_esthil_necronomics.2.a: "Carry on the good work."
 magic_project_esthil_necronomics.2.b: "Bring the head researcher to court."
 magic_project_esthil_necronomics.3.t: "Prototypes ready"
 magic_project_esthil_necronomics.3.d: "One of the benefits of undead labor is that they will untiringly heed any commands... that they can carry out. This latter point is an important distinction. Simple commands like 'pick up that sword and hack at that orc' will work, but more complex commands like 'go to that field and plough it' are unlikely to work with orc souls as few orcs knew what ploughing is, and must instead to firest be directed to pick up a plough, and then use it on the field. However, any tasks requiring intricate work are also unfeasible, as the souls are not responsive enough to be able to carry out such tasks.\n\nAll of this is complicated further when dealing with humanoid souls bound to animal corpses, as while these souls do know how to move a body, the body the soul is used to is different from the one it is bound to. Thus, the movements of such undead are frequently jerky and uncoordinated. While this is not an issue so long as the task is simple and the field is level - such as hauling a cart on a road - the attempts at ploughing an abandoned nearby field have shown that its unevenness will cause the reanimated oxen to frequently stumble and fall. This not only slows down the overall process, but also risks damaging the plough.\n\nTo try to ameliorate this issue, testing will need to be conducted on different fields with different levels of unevenness, as well as with a variety of plough, to determine whether solving this problem is present feasible, or if - as some within the Sepulcher are insisting - the focus should be put on more simple usages such as hauling carts or carrying goods.\n\n- Monthly report of the Black Sepulcher, [GetMonthName] of [GetYear]"
 magic_project_esthil_necronomics.3.a: "You will have to find more abandoned fields."
 magic_project_esthil_necronomics.3.b: "The state will requisition a few fields for you."
 magic_project_esthil_necronomics.3.c: "Force entire provinces to be a testing ground."
 magic_project_esthil_necronomics.4.t: "Ghoulstock"
 magic_project_esthil_necronomics.4.d: "Researchers presenting the finished product to Varina, who listens with interest as they describe the many tasks these newly dubbed 'Ghoulstock' can perform better than a skeleton or zombie."
 magic_project_esthil_necronomics.4.a: "Orc souls put to good use."

 magic_project_esthil_necronomics.5.t: "Death Wards"
 magic_project_esthil_necronomics.5.d: "The art of Necromancy is, fundamentally, the manipulation of life energy. The most well-known example is draining a soul to animate a corpse, but it is also possible to manipulate life directly. A skilled necromancer can snuff out unprotected souls given a captive victim, though the mana required to do so could fuel several fireballs, while simply slitting a throat is faster and requires no mana at all. As such, direct killing using Necromancy is a rather underdeveloped field.\n\nHowever, a promising young necromancer - taught without having Magisterial propaganda shoved down his throat before he cast his first cantrip - proposed a novel idea: creating a ward calibrated to eventually kill rats, rather than trying to kill fully grown men instantaneously. Initial experiments indicate that the premise is sound, with rats thrown into the prototype wards perishing within a dozen seconds. Exposing living orcs and goblins to the ward resulted in them suffering a moderate - but not incapacitating - pain, with actual death taking a while to occur. A starved goblin perished after an hour or two, while healthy orcs lasted a day or two before succumbing.\n\nHowever, multiple issues lie between theory and actual implementation:\n- The first issue is that grain is even more vulnerable to the death ward than vermin. In theory, this could be solved by only making small death wards covering the entrance to granaries, but doing so would mean that cracks or other small openings missed while setting up death wards would leave otherwise protected granaries vulnerable.\n- The second issue is that the mana required for even a vermin-killing ward are relatively high, with souls used to power them being consumed within days, making wide-scale deployment impractical.\n- Third, while vermin are indeed killed, the presence of their corpse might very well cause grain to rot, even if the grain itself was protected from the effects of the ward.\n\nDespite these issues, the leadership at the Black Sepulcher believe this line of inquiry promising. To investigate this, a series of granaries to perform field tests would be appreciated. See the appendix for further resource requests.\n\n- Monthly report of the Black Sepulcher, [GetMonthName] of [GetYear]"
 magic_project_esthil_necronomics.5.a: "A few decrepit granaries will be made available."
 magic_project_esthil_necronomics.5.b: "Dozens of active granaries will be commandeered for this."
 magic_project_esthil_necronomics.5.c: "Food security is secondary."
 magic_project_esthil_necronomics.6.t: "On the Pain of... Pain"
 magic_project_esthil_necronomics.6.d: "For almost a year, steady - if slow - progress was being made to the Death Wards. The efficiency of the ritual was increased, with the duration of the ward while being powered by an average orc soul being extended from mere days to several weeks. However, when setting up the wards on actual granaries, the predicted issues arose: extending the ward over grain would make it wither within minutes, while trying to simply cover the entrances to granaries was better than nothing, but would sometimes lead to vermin getting in through cracks and other small openings, whereupon they would spoil the grain.\n\nAfter much contemplation, it was realized that inflicting death upon vermin was not actually necessary to protect the grain: a ward to deter vermin from entering the granaries would be sufficient. Thus, the focus of the project changed from 'Death Ward' to 'Pain Ward'.\n\nThe initial, fumbling attempts at creating such Pain Wards showed great promise: the fact that they deterred vermin, rather than killing them, prevents carcasses from accumulating near grain, and the duration of these wards was higher than even the best-performing Death Wards. However, secondary to these improvements is that the grain does not suffer from the ward.\n\nThere is still much work to be done in the way of prolonging the duration of a Pain Ward before the soul powering it expires, but the project is now on a much more promising track. To ensure that progress continues smoothly, the leadership at the Sepulcher requests that a plentitude of souls to be made available so that theories for variants of wards can be easily put to the test to speed up Pain Ward development.\n\n- Monthly report of the Black Sepulcher, [GetMonthName] of [GetYear]"
 magic_project_esthil_necronomics.6.a: "The state cannot spare anything."
 magic_project_esthil_necronomics.6.b: "Allocate some Souls to ease testing."
 magic_project_esthil_necronomics.7.t: "Maximizing Suffering, not Complexity"
 magic_project_esthil_necronomics.7.d: "Since the initial status report on Pain Wards, a great number of variants on the ritual have been tested. The initial version simply siphoned the life energy from the soul powering the ward to create a field of pain in a straight-forward but inefficient manner. Iteration upon the core concept swiftly led to increases in duration, but the most promising innovation was made by another promising young necromancer, unburdened by Magisterial norms and propaganda. It was realized early on that the Pain Ward does not actually need to generate pain from nothing, as it can simply project the pain that the soul powering it is already suffering.\n\nHowever, this line of research was discarded, as initial experiments showed that this projected pain was not sufficient to deter determined vermin. The innovation laid in deliberately mangling the process of binding the soul to the granary, while still just barely succeeding. Doing so significantly increased the pain suffered by the soul and projected by the ward.\n\nWhile this process does speed up the unravelling of the soul - and is thus usually undesirable, even for orc souls - wards simply projecting the pain felt by such souls last between two and threee times as long as souls siphoning life energy and turning that into pain.\n\nWhile it will likely take decades before the ritual is considered perfected, the lead Necromancers reckon that a few more years of testing and iteration should be sufficient to make the Pain Ward a viable option for wide-scale deployment. Of course, this timetable could be sped up, were additional resources diverted.\n\n- Monthly report of the Black Sepulcher, [GetMonthName] of [GetYear]"
 magic_project_esthil_necronomics.7.a: "Carry on, as you are."
 magic_project_esthil_necronomics.7.b: "Very well, you shall have what you ask for."
 magic_project_esthil_necronomics.8.t: "Pain Wards"
 magic_project_esthil_necronomics.8.d: "Ward ritual/spell finalized, with researchers animatedly telling Varina about the gruesome things they have done to maximize soul suffering to make the pain ward even better, while only speeding up the rate at which the soul frays slightly."
 magic_project_esthil_necronomics.8.a: "A fitting punishment for their sins."

 magic_project_esthil_necronomics.9.t: "A Curious Discovery"
 magic_project_esthil_necronomics.9.d: "There are, naturally, a great many experiments running at the Black Sepulcher at any given time. The prevailing fascination for the past few months has been trying to create combat-viable Death Wards. However, these experiments invariably run into the same problem: making a ward powerful enough to kill soldiers would drain a soul in a matter of seconds, making it impractical for field usage.\n\nA few enterprising youngsters, however, have asked whether soldiers really need to be killed within moments or even kill at all, or if simply causing prolonged low-level harm to enemies of the state would be just as effective. As such, they applied a Death Ward with significantly reduced strength to one of the holding cells, and then extracted a few orcs every day to determine whether there was a gradual decrease in their fighting strength. Unfortunately, no such decrease was observed.\n\nThat experiment might very well have ended there, if not for the fact that a few of the orcs were slain, reanimated as zombies, and set to guard their former kin as warnings to the other subjects to behave. Normally, the flesh of a zombie begins to visibly decay and begin rotting within a few days, but the necromancers realized that the zombies they had created and left within the effect of the Death Ward showed no decay at all!\n\nIt is not yet clear what is causing it, but exposing zombies to Death Wards have shown that the phenomenon is consistent, and that the decay of zombies ceases while within such wards. Given the greater strength of zombies compared to skeletons, it is believed that this discovery could be of great use for fieldwork, since the usage of zombies for such purposes has until now been inhibited by the fact that their rotting flesh would risk spoiling crops. To speed up these investigations, a healthy supply of souls and prisoners would be required.\n\n- Monthly report of the Black Sepulcher, [GetMonthName] of [GetYear]"
 magic_project_esthil_necronomics.9.a: "Nothing can be spared."
 magic_project_esthil_necronomics.9.b: "Your request for resources has been approved."
 magic_project_esthil_necronomics.10.t: "Initial successes"
 magic_project_esthil_necronomics.10.d: "Initial investigations into the phenomenon labelled as 'undecaying zombies' were focused on trying to determine why, exactly, the zombies were not decaying. The first experiments carried out were to place newly raised zombies into Death Wards of differing power. In these experiments, every single Death Ward proved strong enough to stave off decay, though no matter the strength of the ward, the zombies still suffered from decay after being removed from them, albeit at a slower rate than regular zombies.\n\nThe next steps taken were to produce even weaker Death Wards, an effort that was surprisingly difficult, considering that the goal was to produce a weaker effect. In addition to simply putting less power into the ritual, several steps were also deliberately performed shoddily, as to weaken the effect further. The result of this was a dozen Death Wards of decreasing power. Even the strongest of these were unable to kill simple flies, but still served to stave off the decay of zombies. All but the weakest two were also capable of preventing decay from occurring, though those two still slowed down the process significantly.\n\nEfforts to determine why, exactly, this is the case have been unsuccessful in anything but provoking arguments between the researchers. The leading theory is that some kind of animal too small to perceive is responsible for the decay and is killed by any but the very weakest of Death Wards, though there are several competing theories. Regardless, the phenomenon is consistent and repeatable, and so the focus has shifted to figuring out how to use a soul already powering an Animate Dead spell to simultaneously power a Death Ward, as to permit the creation of zombie laborers who do not decay, so that their strength can be harnessed for field work. To this end, an allocation of magical resources would be appreciated.\n\n- Monthly report of the Black Sepulcher, [GetMonthName] of [GetYear]"
 magic_project_esthil_necronomics.10.a: "No such resources are available."
 magic_project_esthil_necronomics.10.b: "They shall be allocated."
 magic_project_esthil_necronomics.11.t: "The Undecaying Dead"
 magic_project_esthil_necronomics.11.d: "The first steps towards deployment of Undecaying Zombies was, naturally, to establish a baseline for efficiency. Thus, a series of weak souls were used to power both the classical Animate Dead, as well as a Death Ward just strong enough to produce the phenomenon. While the specifics varied a bit from soul to soul, the general trend was that doing so reduced the time taken for the soul to unravel by approximately a third. Far from a negligible decrease, and if it was the best that could have been achieved, it might have called into question whether the increased strength was worth the reduced time of activity. Fortunately, as noted, this was simply done to determine the baseline that future iterations would be judged against. To try to improve these results, a variety of experiments were conducted, with most researchers adhering to one of two camps.\n\nThe first sought to create a ritual combining both the animation of the corpse and the creation of the ward, hoping that the two effects had resonances and redundancies that would lead to a combined ritual being less draining on the soul.\n\nThe second camp, meanwhile, observed that the fields created by basic Death Wards are spherical and that trying to change this would decrease efficiency, while humanoid and animals are shaped more like cylinders. One of their proposed 'solutions' was to make humanoid zombies crouch perpetually, which would significantly reduce the area that the Death Ward needed to cover to stave off decay. While the sight of orc zombies crouching and crawling around was quite satisfying to witness, their labor effectiveness was significantly reduced. A more promising solution was to not create one large Death Ward capable of covering the entire zombie, but rather to distribute several smaller wards at different parts of the body, reducing wasted coverage. \n\nFortunately, it was possible to combine the two approaches, with the final result being a ritual that only reduces the expected duration of a soul by a tenth. The next stage is field testing, which would be simplified by a stipend to ensure cooperation from peasants.\n\n- Monthly report of the Black Sepulcher, [GetMonthName] of [GetYear]"
 magic_project_esthil_necronomics.11.a: "Make do with what you have."
 magic_project_esthil_necronomics.11.b: "Funds will be made available."
 magic_project_esthil_necronomics.12.t: "Undecaying Zombies"
 magic_project_esthil_necronomics.12.d: "Researchers proudly presenting a zombified - i.e. with fless infact - animal corpse that have been animated with the new spell variant. Under Varina's gaze, they test the undecaying zombified ox against a skeletal variant, with the zombified ox performing better. The strength should be useful in the fields, and now the undecaying nature means that these zombies can be put there without rotting the crops."
 magic_project_esthil_necronomics.12.a: "Better fieldwork, yay."

