 # Custom tooltips for mission effects
 heirs_powerful_mage_chance_extra_stats_tt:0 "All future heirs gain §G+1§! in a random stat, and will have a §Y40%§! chance to be a §TPowerful Mage§!" # placeholder specify 40%?
 subjugation_cb_kheterata_region_tt:0 "[Root.GetName] gains a §YSubjugation§! Casus Belli on §Yevery country§! with a capital in §YKheterata§!.\nThese Casus Belli will last for §G20§! years."
 cheaper_flourishing_roots_retroactive_tt:0 "Constructing a §YFlourishing Roost§! now requires §Y15§! less Development. This discount will apply retroactively to our existing §YRoosts§!."
 F98_develop_roost_bonus_tt:0 "Developing a province with a §YRoost§! will add the §YHarpy Len§! modifier for §Y10§! years. Each development will refresh that duration."
 F98_nilelista_project_tt:0 "Unlock the §YNilelista§! Magical Project\nThe §YRender Unto§! government power will now transfer §G+10§! §MMana§! per subject to [Root.GetName]"
 F98_hunt_power_refund_tt:0 "Using a §YThe Hunt§! power will now refund §G25§! Church Power"
 harpylen_crane_upgrade_tt:0 "Improves the §YDoctrine of the Crane§! with the Aspect of the Gull. If the ruler follow the Crane, §YSeek Prosperity§! will give an additional §G40§! crowns per total development; §YSeek Clarity§! will give an additional §G50§! monarch power."
 wood_unveiled_tt:0 "The nation fulfilling the requirements with the most development will become our §Gvassal§! and §Ghistorical friend§!.\nEvery §Yexotic wood§! province fullfilling the requirements will get a §Yfledgling roost§!."
 harpylen_under_leaf_tt:0 "Will inherit every province in the §Ydeepwoods§! not held by us."
 harpylen_under_leaf_tt2:0 "Allow us to use of §YCiranmyna§! monument."
 harpylen_peacock_done_tt:0 "We have traced the §YP'zerang Migration§!."
 harpylen_soothed_feathers_tt:0 "§Soothed Ruffled Feathers§! in the last §Y5§! years."
 harpylen_diploaction_unlock:0 "Enable the §YEncourage Migration§! and §YSoothe Ruffled Feathers§! custom diplomatic actions."
 harpylen_oddest_hunt_tt_hunt:0 "§YEduz-Ginakku§! monument will be usable regardless of our secondary religion\n§YSeek What You Will§! will also grant §G4§! innovativness"
 harpylen_oddest_hunt_tt_hunt:0 "§YEduz-Ginakku§! monument will be usable regardless of our secondary religion\nUnlocking a new technology will grant §G2§! innovativness"
 
