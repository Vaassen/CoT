 harpy_queendom_ui_custom_tt:0 "§YQueendom's Claim§!: §Y[Root.QueendomOverallVar.GetValue]§!\n--------------\nWe gain §G[Root.QueendomAdditionVar.GetValue]§! §YQueendom's Claim§! each month, with a maximum of §Y100.00§!\nBase: §G+0.50§!\nFrom §YFlourishing Roosts§!: §G[Root.QueendomRoostCountVar.GetValue]§!\nFrom §YThe Queen's Throne§! Monument levels: §G[Root.QueendomMonumentVar.GetValue]§!\nFrom Ruler §YDiplomacy§! skill: §G[Root.QueendomRulerVar.GetValue]§!\n\nAt Maximum Power, §YQueendom's Claim§! has the following effects:\nAggressive Expansion Impact: §G-10.0%§!\nDiplomatic Reputation: §G+2.00§!"

harpylen_queendom_dictates_tt: "Dictates of the Matriarch\n--------------\nIf §YFocusing§! Admin:\nAll Subjects Lose §G10§! Liberty Desire\nOur highest development §YSubject§! without §YHonour The Matriach§! gets §YHonour The Matriach§! for §Y25§! years, giving:\n§G+50%§! Taxation Efficiency and §G-25%§! Liberty Desire.\n\nIf §YFocusing§! Diplo:\nLose §G10§! Aggressive Expansion\nOur highest development §YSubject§! without §YBreathing The Incense§! gets §YBreathing The Incense§! for §Y25§! years, giving:\n§G-15%§! Development Cost and §G-15%§! Construction Cost.\n\nIf §YFocusing§! Mil:\nGain a Random §YPowerful General§!\nOur highest development §YSubject§! without §YSongs Of Battle§! gets §YSongs Of Battle§! for §Y25§! years, giving §YMarch§! bonuses."

