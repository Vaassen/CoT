 #############################
 ### CONJURATION (200-299) ###
 #############################

 conjuration_0_0_spell:0 "Summon Familiars"
 conjuration_0_0_spell_desc:0 "§gAll Conjuration is fundamentally teleportation. It is the act of bringing close two points in the material of reality, folding space over itself until one thing exists in two places. The first thing most novices conjure is a friend.§!"
 conjuration_1_0_spell:0 "Summon Animals"
 conjuration_1_0_spell_desc:0 "§gRather than conjure directly from a distant plane, it tends to be easier to perform a series of shorter jumps. The easiest act of conjuration therefore is to summon what already exists, by bringing it to another plane and back.§!"
 conjuration_1_1_spell:0 "Conjure Supplies"
 conjuration_1_1_spell_desc:0 "§gThe journeyman conjures by using reality as a map, studying physical objects closely and summoning a copy of it. The master relies instead on his mind and imagination, making real the fantastic.§!"
 conjuration_2_0_spell:0 "Summon Elementals"
 conjuration_2_0_spell_desc:0 "§gElementals are beings of "characteristic energy" pulled from conceptual planes to temporarily serve a master in our world. They tend to be pre-sentient, only partially physical in nature, and extremely upset.§!"
 conjuration_2_1_spell:0 "Aid Construction"
 conjuration_2_1_spell_desc:0 "§gThrough the power of the mind many mages find work in the labourious task of construction. Conjuration can act as a unique form of transportation, enabling building techniques that would otherwise be impossible.§!"
 conjuration_3_0_spell:0 "Extraplanar Contact"
 conjuration_3_0_spell_desc:0 "§gThe mind of the mage, groping clumsily through the Empyreal, is unlikely to ever make contact with anything significant. By definition, whomever of consequence they met must have intended on being found.§!"

 conjuration_0_0_mod:0 "Conjuration: Summoned Familiars"
 conjuration_1_0_spell_effect_tt:0 "Gain access to the §YFeral Animals§! mercenary company for §Y5§! years"
 conjuration_1_0_mod:0 "Conjuration: Summoned Feral Animals"
