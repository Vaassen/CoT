 ############################
 ### DIVINATION (300-399) ###
 ############################

 divination_0_0_spell:0 "Guidance"
 divination_0_0_spell_desc:0 "§gThe primary skill of Divination is to know something one oughtn't know, to know it without explanation and cause. This first manifests only as a gut feeling, yet it is their trust in that feeling which defines the Diviner.§!"
 divination_1_0_spell:0 "Eye for Talent"
 divination_1_0_spell_desc:0 "§gDiviners are best-known for their ability to identify people, picking out certain individuals that are set apart from the rest. These so-called "chosen ones" are rarely prophesied heroes, but they are often useful in some way.§!"
 divination_1_1_spell:0 "Deposit Divination"
 divination_1_1_spell_desc:0 "§gThe importance of what is inside the earth varies by location. Aul-Dwarov sought out mithril ("True-steel"), whereas Mašnsih "water-witches" help maintain permanent settlement. In Vimdatrong, "dragon lines" are identified as suitable places for new chi wellsprings.§!"
 divination_2_0_spell:0 "Scry"
 divination_2_0_spell_desc:0 "§gScrying is the act of interpreting a medium to ascertain information across space and time, gaining insight on far-away events or even foretelling the future. Pyromancy, haruspicy, and oracle-bones are all types of scrying.§!"
 divination_2_1_spell:0 "Manipulated Fortune"
 divination_2_1_spell_desc:0 "§gAny good fighter can guess where their opponent's sword will fall, but to know it for certain, even on a subconscious level, elevates one to the status of master. Uncharitably, these preternatural instincts are often referred to as luck.§!"
 divination_3_0_spell:0 "Foresight"
 divination_3_0_spell_desc:0 "§gThe gift of Foresight is unlike prophesy, giving one the ability to see the near future rather than predict distant posterity. A wise ruler accepts the trade, knowing that today is but kindling for a brighter tomorrow.§!"

 divination_1_0_spell_effect_tt:0 "Find a §Gdiscounted§! advisor with skill level equal to one plus our §YMagical Infrastructure§!"
 divination_1_1_spell_effect:0 "Every owned §YMineable§! good gets the following effect:"
