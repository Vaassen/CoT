 #############################
 ### ENCHANTMENT (400-499) ###
 #############################

 enchantment_0_0_spell:0 "Enchanting Embassy"
 enchantment_0_0_spell_desc:0 "§gWhile Enchantment gives good control over the minds of individuals, mages struggle to expand the number of targets. Therefore, a clever, directed use of magic at single influential people best suits the Enchanter.§!"
 enchantment_1_0_spell:0 "Mass Charm"
 enchantment_1_0_spell_desc:0 "§gThe Charm spell simply makes its target more receptive to the caster's words and actions. The basic nature of its control means one can effectively create an aura of Charm that can affect entire buildings and beyond.§!"
 enchantment_1_1_spell:0 "Command Animals"
 enchantment_1_1_spell_desc:0 "§gMany a Cannorian princess retreats daily to the forested areas of her family's manse, attracting a flock of small woodland creatures to her side. Those in the know understand this is her practicing Enchantment magic.§!"
 enchantment_2_0_spell:0 "Mass Charm II"
 enchantment_2_0_spell_desc:0 "§gA powerful Enchanter can plumb the depths of their target's mind, allowing them to even rewrite memories. Continual use of this power weakens self-identity in the target, creating a blank slate for the caster to reshape.§!"
 enchantment_2_1_spell:0 "Enchanting Embassy II"
 enchantment_2_1_spell_desc:0 "§gBy turning Enchantment magic inwards, it becomes a form of imbuement rather than control. In addition to being a less controversial use of the power, it also allows powerful enchanters to impact more targets at once.§!"
 enchantment_3_0_spell:0 "Dominate to Surrender"
 enchantment_3_0_spell_desc:0 "§gEnchantment is a battle of wills, where the stronger mind completely overtakes the weaker. Even against a defending army, a caster can force them to lay down their arms and throw open the gates, so long as their will is stronger.§!"

 enchantment_0_0_mod:0 "Enchantment: Enchanting Embassy"
 enchantment_1_0_mod:0 "War Magic: Mass Charm"
