 magic_spell.401.t:0 "Enchantment Spell Hysteria"
 magic_spell.401.d:0 "Rumours have reached our advisors that the seeds of mass-hysteria have begun to fester. Widescale paranoia has spread across the populace fearing that their minds may not have been their own for a long time, and that [Root.Monarch.GetName] and [Root.Monarch.GetHerHis] gang of [Root.GetMagesName] is the cause of it!"
 magic_spell.401.a:0 "We maintain the masquerade."
 magic_spell.401.b:0 "Deny such accusations!"
 magic_enchantment_hysteria:0 "Enchantment Spell Hysteria"
 
 magic_spell.402.t:0 "$ESTATE_MAGES$ Blackmail Over Enchantment"
 magic_spell.402.d:0 "The disloyal $ESTATE_MAGES$ of our realm has accused [Root.Monarch.GetName] of wide-scale Enchantment, accusing [Root.Monarch.GetHerHim] of being Nichmer the Sorcerer-King reincarnate!\n\nThey do however, understand our concerns, and for a meagre donation to their institutions will keep this incident quiet."
 magic_spell.402.dloyal:0 "The $ESTATE_MAGES$ of our realm has accused [Root.Monarch.GetName] of wide-scale Enchantment, accusing [Root.Monarch.GetHerHim] of being Nichmer the Sorcerer-King reincarnate!\n\nThey do however, understand our concerns, and for a meagre donation to their institutions will keep this incident quiet."
 magic_spell.402.a:0 "Bribe the $ESTATE_MAGES$"
 magic_spell.402.b:0 "Refuse!"
 magic_spell.402.c:0 "Punish them for disloyalty"
 EST_VAL_MAGES_PUNISHED:0 "Mages Punished: §Y$VAL$%§!"

 magic_spell.405.t:0 "Province Dominated!"
 magic_spell.405.desc:0 "The minds of lesser men are susceptible to the whims of powerful mages. In this case, the mages of our enemies have convinced the defenders of [dominated_province.GetName] to fling open the gates! the siege ended without so much as a sortie."
 magic_spell.405.a:0 "Damnation!"

 ###########################
 ### EVOCATION (500-599) ###
 ###########################

 evocation_0_0_spell:0 "Fireball"
 evocation_0_0_spell_desc:0 "§gEvocation is nothing less than command over raw energy. Working similarly to a trebuchet, a powerful mage can create a ball of flame the size of a small house to fling across enemy walls and battlements.§!"
 evocation_1_0_spell:0 "Shock and Awe"
 evocation_1_0_spell_desc:0 "§gUnsurprisingly, the most common use of Evocation is on the battlefield. War Magic is the catch-all term for using offensive magics to alter the course of battle, from flinging fireballs to calling down lightning strikes.§!"
 evocation_1_1_spell:0 "Flaming Munitions"
 evocation_1_1_spell_desc:0 "§gAn Enchanter's magic, poured into an object, imbues it with the mind of its creator. An Abjurer's magic protects its physical form, whereas a Transmutater modifies it. An Evoker's magic turns objects into pure screaming.§!"
 evocation_2_0_spell:0 "Meteor Swarm"
 evocation_2_0_spell_desc:0 "§gTrading precision for punctuation, the Evoker can blindly channel energy downwards. Dragging the Prime Material itself, airborne dust particles coalesce into massive missiles and strike whatever might be standing underneath.§!"
 evocation_2_1_spell:0 "Tearfall"
 evocation_2_1_spell_desc:0 "§gThe tenth month is Tearfall, when Damestear meteorites fall to Halann in great number. Smaller fragments of meteor, left in the upper atmosphere, can be directed earthwards with only minimal effort and collateral damage.§!"
 evocation_3_0_spell:0 "Elemental Fury"
 evocation_3_0_spell_desc:0 "§gEvocation magic tends to work best when fueled by the strong emotions of its caster. Strong positive emotions can work wonders, but on the battlefield nothing sustains itself quite like panic, grief, and rage.§!"

 evocation_0_0_spell_effect_tt:0 "Increase the siege progress in §Y[This.GetName]§! by §Y+2§!"
 evocation_0_0_buffed_spell_effect_tt:0 "Increase the siege progress in §Y[This.GetName]§! by §Y+3§!"
