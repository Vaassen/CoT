 ############################
 ### ABJURATION (100-199) ###
 ############################

 abjuration_0_0_spell:0 "Combat Ward"
 abjuration_0_0_spell_desc:0 "§gDefensive wards come in all shapes and fashions, from enhancing the resistance of objects, to creating magical shield and barriers, to glyphs and runes that act as traps. The most basic ward consists of only a single word: Halt.§!"
 abjuration_1_0_spell:0 "Ward"
 abjuration_1_0_spell_desc:0 "§gMost contemporary castles had some sort of ward, at least to protect them from low-level magic attacks like fireballs or magic missiles. This was a source of steady work for many beginner mages.§!"
 abjuration_1_1_spell:0 "Protected Journey"
 abjuration_1_1_spell_desc:0 "§gThroughout the 15th and 16th centuries, the Cannorian presence in Aelantir experienced explosive growth of both state-funded settlements and adventuring bands. The development of localized mobile wards big enough to encompass entire ships was key to their success.§!"
 abjuration_2_0_spell:0 "Mass Ward"
 abjuration_2_0_spell_desc:0 "§gMost magical advancements focused on improving the concentration of the mage, and thus the power of their magic. The breakthrough came by turning this thinking on its head: the same basic spell, cast repeatedly, created efficiencies that outscaled the drop in quality.§!"
 abjuration_2_1_spell:0 "Mage Armor"
 abjuration_2_1_spell_desc:0 "§gThe proliferation of black damestear bullets in the 1700s put an end to the "one-man armies" that had defined Cannorian warfare since the Crimson Deluge. The Camiran Doctrine (introduced by Camir I Silmuna) positioned mages behind the front line, casting powerful wards in between rifle volleys.§!"
 abjuration_3_0_spell:0 "Field of Forbiddance"
 abjuration_3_0_spell_desc:0 "§gThere are many ways to diffuse a magical field: localized variants require only eyesight of the caster, while larger versions tap into carefully placed runes and magic circles. It is said, however, that the most legendary of mages impose their will through memory alone.§!"

 abjuration_0_0_mod:0 "War Magic: Combat Ward"
