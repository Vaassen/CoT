 magic_spell.500.title:0 "Tearfall!"
 magic_spell.500.d:0 "Damestear at an affordable price? Satisfactory!"
 magic_spell.500.a:0 "Yippee!"

 magic_spell.501.t:0 "Defenders Blasted by Fireball!"
 magic_spell.501.desc:0 "Working similarly to a trebuchet, a powerful mage can create a ball of flame the size of a small house to fling across enemy walls and battlements. This unexpected boon of firepower to our enemies threatens to lay out the defenders of [fireball_province.GetName]"
 magic_spell.501.a:0 "Send reinforcements! The siege is not lost!"

 magic_spell.502.t:0 "Fortifications Falls to Meteors!"
 magic_spell.502.desc:0 "In a truly grotesque display of magical prowess, our enemies' war wizards have evoked a meteor shower directly onto our battlements! The fortress at [meteor_province.GetName] has been destroyed, the defenders sure to fall soon after..."
 magic_spell.502.a:0 "What is the aim? To rule over ruins?"

 ##########################
 ### ILLUSION (600-699) ###
 ##########################

 illusion_0_0_spell:0 "Invisibility"
 illusion_0_0_spell_desc:0 "§gThe first target of Illusion magic is the caster themself. This is true in both senses of the phrase: not only are the most basic glamours aimed at one's own body, but the Illusionist can rarely see through their own tricks.§!"
 illusion_1_0_spell:0 "Fear and Loathing"
 illusion_1_0_spell_desc:0 "§gAny journeyman Illusionist can tell you that Illusion magic is basically advanced lying. Lying to yourself, your target, and the universe, until the lie is indistinguishable from truth. The simplest lie is this: your suspicions are correct.§!"
 illusion_1_1_spell:0 "Bread and Circuses"
 illusion_1_1_spell_desc:0 "§gIllusion magic can often be found at carnivals, providing bright displays of color and aiding the magician's performance. Illusion is therefore reliant on misdirection, both in sleight of hand and in politics.§!"
 illusion_2_0_spell:0 "Assimilation Program"
 illusion_2_0_spell_desc:0 "§gWithout society, Illusion has no significance. It is the mistaken belief in a shared reality that allows the unreal to take hold. Therefore, the most important myth to reinforce is the correctness of the dominant social paradigm.§!"
 illusion_2_1_spell:0 "Shadows in the Night"
 illusion_2_1_spell_desc:0 "§gThe enemy of Illusion is scrunity. The clever Illusionist therefore keeps to shadows, preferring hoary rumor to proven fact. The Enchanter cultivates a person, whereas the Illusionist cultivates an environment.§!"
 illusion_3_0_spell:0 "Lead the Crowds"
 illusion_3_0_spell_desc:0 "§g"Memorable events in history are but the visible effects of invisible changes in collective thought-patterns. These collectives are unreasonable, impulsive, and in a state of expectant attention which enables mass hallucination. They may be stirred, calmed, but above all they must be led."\n --Gelmon síl Vivin, "The Crowd" (1795)§!"

 illusion_0_0_mod:0 "Illusion: Invisibility"
 illusion_2_0_mod:0 "Illusion: Assimilation Program"
 illusion_2_1_mod:0 "Sabotage: Shadows in the Night"
 desc_illusion_2_1_mod:0 "One of our war enemies or rivals has sabotaged us!"
 illusion_3_0_mod:0 "Illusion: Lead the Crowds"

