 magic_spell.401.t:0 "Enchantment Spell Hysteria"
 magic_spell.401.d:0 "Rumours have reached our advisors that the seeds of mass-hysteria have begun to fester. Widescale paranoia has spread across the populace fearing that their minds may not have been their own for a long time, and that [Root.Monarch.GetName] and [Root.Monarch.GetHerHis] gang of [Root.GetMagesName] is the cause of it!"
 magic_spell.401.a:0 "We maintain the masquerade."
 magic_spell.401.b:0 "Deny such accusations!"
 magic_enchantment_hysteria:0 "Enchantment Spell Hysteria"
 
 magic_spell.402.t:0 "$ESTATE_MAGES$ Blackmail Over Enchantment"
 magic_spell.402.d:0 "The disloyal $ESTATE_MAGES$ of our realm has accused [Root.Monarch.GetName] of wide-scale Enchantment, accusing [Root.Monarch.GetHerHim] of being Nichmer the Sorcerer-King reincarnate!\n\nThey do however, understand our concerns, and for a meagre donation to their institutions will keep this incident quiet."
 magic_spell.402.dloyal:0 "The $ESTATE_MAGES$ of our realm has accused [Root.Monarch.GetName] of wide-scale Enchantment, accusing [Root.Monarch.GetHerHim] of being Nichmer the Sorcerer-King reincarnate!\n\nThey do however, understand our concerns, and for a meagre donation to their institutions will keep this incident quiet."
 magic_spell.402.a:0 "Bribe the $ESTATE_MAGES$"
 magic_spell.402.b:0 "Refuse!"
 magic_spell.402.c:0 "Punish them for disloyalty"
 EST_VAL_MAGES_PUNISHED:0 "Mages Punished: §Y$VAL$%§!"

 magic_spell.405.t:0 "Province Dominated!"
 magic_spell.405.desc:0 "The minds of lesser men are susceptible to the whims of powerful mages. In this case, the mages of our enemies have convinced the defenders of [dominated_province.GetName] to fling open the gates! the siege ended without so much as a sortie."
 magic_spell.405.a:0 "Damnation!"

 ###########################
 ### EVOCATION (500-599) ###
 ###########################

 evocation_0_0_spell:0 "Fireball"
 evocation_0_0_spell_desc:0 "§gEvocation is nothing less than command over raw energy. Working similarly to a trebuchet, a powerful mage can create a ball of flame the size of a small house to fling across enemy walls and battlements.§!"
 evocation_1_0_spell:0 "Shock and Awe"
 evocation_1_0_spell_desc:0 "§gUnsurprisingly, the most common use of Evocation is on the battlefield. War Magic is the catch-all term for using offensive magics to alter the course of battle, from flinging fireballs to calling down lightning strikes.§!"
 evocation_1_1_spell:0 "Flaming Munitions"
 evocation_1_1_spell_desc:0 "§gAn Enchanter's magic, poured into an object, imbues it with the mind of its creator. An Abjurer's magic protects its physical form, whereas a Transmutater modifies it. An Evoker's magic turns objects into pure screaming.§!"
 evocation_2_0_spell:0 "Meteor Swarm"
 evocation_2_0_spell_desc:0 "§gTrading precision for punctuation, the Evoker can blindly channel energy downwards. Dragging the Prime Material itself, airborne dust particles coalesce into massive missiles and strike whatever might be standing underneath.§!"
 evocation_2_1_spell:0 "Tearfall"
 evocation_2_1_spell_desc:0 "§gThe tenth month is Tearfall, when Damestear meteorites fall to Halann in great number. Smaller fragments of meteor, left in the upper atmosphere, can be directed earthwards with only minimal effort and collateral damage.§!"
 evocation_3_0_spell:0 "Elemental Fury"
 evocation_3_0_spell_desc:0 "§gEvocation magic tends to work best when fueled by the strong emotions of its caster. Strong positive emotions can work wonders, but on the battlefield nothing sustains itself quite like panic, grief, and rage.§!"

 evocation_0_0_spell_effect_tt:0 "Increase the siege progress in §Y[This.GetName]§! by §Y+2§!"
 evocation_1_0_mod:0 "War Magic: Shock and Awe"
 desc_evocation_1_0_mod:0 "We can only have one §YWar Magic§! spell active at a time! Casting another §YWar Magic§! spell will remove this one."
 evocation_1_1_mod:0 "War Magic: Flaming Munitions"
 desc_evocation_1_1_mod:0 "We can only have one §YWar Magic§! spell active at a time! Casting another §YWar Magic§! spell will remove this one."
 evocation_2_1_spell_trigger_tt:0 "We are NOT currently attempting to evoke a §YDamestear Meteor§!"
 evocation_2_1_spell_effect_tt:0 "The next time the month becomes §YTearfall(10)§!:"
 evocation_2_1_spell_effect_2_tt:0 "Summon §YDamestear§! to strike a random owned province. That province will lose §Y1§! of each development."
 evocation_3_0_mod:0 "War Magic: Elemental Fury"
 desc_evocation_3_0_mod:0 "We can only have one §YWar Magic§! spell active at a time! Casting another §YWar Magic§! spell will remove this one."

 has_evocation_war_magic_tt:0 "Any Evocation §YWar Magic§! is active"

 magic_spell.500.title:0 "Tearfall!"
 magic_spell.500.d:0 "Damestear! And so soon?"
 magic_spell.500.a:0 "Yippee!"

 magic_spell.501.t:0 "Defenders Blasted by Fireball!"
 magic_spell.501.desc:0 "Working similarly to a trebuchet, a powerful mage can create a ball of flame the size of a small house to fling across enemy walls and battlements. This unexpected boon of firepower to our enemies threatens to lay out the defenders of [fireball_province.GetName]"
 magic_spell.501.a:0 "Send reinforcements! The siege is not lost!"

 magic_spell.502.t:0 "Fortifications Falls to Meteors!"
 magic_spell.502.desc:0 "In a truly grotesque display of magical prowess, our enemies' war wizards have evoked a meteor shower directly onto our battlements! The fortress at [meteor_province.GetName] has been destroyed, the defenders sure to fall soon after..."
 magic_spell.502.a:0 "What is the aim? To rule over ruins?"

 ##########################
 ### ILLUSION (600-699) ###
 ##########################

 illusion_0_0_spell:0 "Invisibility"
 illusion_0_0_spell_desc:0 "§gThe first target of Illusion magic is the caster themself. This is true in both senses of the phrase: not only are the most basic glamours aimed at one's own body, but the Illusionist can rarely see through their own tricks.§!"
 illusion_1_0_spell:0 "Shadows in the Night"
 illusion_1_0_spell_desc:0 "§gThe enemy of Illusion is scrunity. The clever Illusionist therefore keeps to shadows, preferring hoary rumor to proven fact. The Enchanter cultivates a person, whereas the Illusionist cultivates an environment.§!"
 illusion_1_1_spell:0 "Bread and Circuses"
 illusion_1_1_spell_desc:0 "§gIllusion magic can often be found at carnivals, providing bright displays of color and aiding the magician's performance. Illusion is therefore reliant on misdirection, both in sleight of hand and in politics.§!"
 illusion_2_0_spell:0 "Assimilation"
 illusion_2_0_spell_desc:0 "§gWithout society, Illusion has no significance. It is the mistaken belief in a shared reality that allows the unreal to take hold. Therefore, the most important myth to reinforce is the correctness of the dominant social paradigm.§!"
 illusion_2_1_spell:0 "Terror"
 illusion_2_1_spell_desc:0 "§gAdvanced Illusion magic is adaptive, providing not a single alternative fact but an individualized reality. This allows the Illusionist to shift focus from cause to effect, creating a single shared emotion across a massive population.§!"
 illusion_3_0_spell:0 "Smoke-Filled Rooms"
 illusion_3_0_spell_desc:0 "§gThe apogee of Illusion magic is a place where nothing is quite real, where you can't quite hear what is being said, where you squint but can't make out the words. Only one thing's for sure: that's your signature on the page.§!"

 illusion_0_0_mod:0 "Illusion: Invisibility"
 illusion_1_0_mod:0 "Sabotage: Shadows in the Night"
 desc_illusion_1_0_mod:0 "One of our war enemies or rivals has sabotaged us!"
 illusion_1_1_mod:0 "Illusion: Bread and Circuses"
 illusion_2_0_mod:0 "Illusion: Assimilation"
 illusion_3_0_mod:0 "Illusion: Smoke-Filled Rooms"

 illusion_2_1_effect_tt:0 "All war enemies and rivals get the following effect:"
 illusion_3_0_spell_effect_tt:0 "This will retroactively remove much of the separatism in our provinces!"

 magic_spell.600.t:0 "Shadows in the Night..."
 magic_spell.600.desc:0 "One of our enemies is sabotaging us with illusion magic!"
 magic_spell.600.a:0 "Damnation!"

 magic_spell.601.t:0 "Terror and Panic!"
 magic_spell.601.desc:0 "One of our enemies is sabotaging us with illusion magic!"
 magic_spell.601.a:0 "Damnation!"

 ############################
 ### NECROMANCY (700-799) ###
 ############################

 necromancy_0_0_spell:0 "False Life"
 necromancy_0_0_spell_desc:0 "§gTo deal with life is to deal with death. Most novice Necromancers stumble onto their expertise in frustrated attempts to create healing magic. Artificial animation is the first step on their journey.§!"
 necromancy_1_0_spell:0 "Steal Vitality"
 necromancy_1_0_spell_desc:0 "§gEventually, each novice Necromancer discover the same truth: life cannot be created, only transferred. There are alternatively noble and selfish distributions, but to be a necromancer is to decide who deserves life.§!"
 necromancy_1_1_spell:0 "Contagion"
 necromancy_1_1_spell_desc:0 "§gTo survive, a creature may kill another. Plague is a living being, growing and feasting and dying. Therefore, it is no sin for plague to kill a man to sustain itself. Nor is it a sin to father disease, raise it to maturity, and set it loose.§!"
 necromancy_2_0_spell:0 "Speak with Dead"
 necromancy_2_0_spell_desc:0 "§gIn 1751, the Rending of Realms brought ghosts of Halessi ancestors back to the Prime Material. Efforts to measure the casualties were all futile: what is a casualty, besides an arbitrary distinction between living and dead?§!"
 necromancy_2_1_spell:0 "Ghoulish Grandeur"
 necromancy_2_1_spell_desc:0 "§gThe best understanding of Necromancy is as a single extended act of self-aggrandizement. More than any other school, Necromancy positions its wielder as all-powerful and enables them to profit from the death of others.§!"
 necromancy_3_0_spell:0 "Army of the Dead"
 necromancy_3_0_spell_desc:0 "§gThe living are fundamentally unreliable; they are more useful dead. The dead are capable of creating more dead. Any Necromancer will eventually put two and two together. All that remains is to follow through.§!"

 necromancy_0_0_spell_effect_1_tt:0 "£no£Has §YArmy of the Dead§!:"
 necromancy_0_0_spell_effect_2_tt:0 "£yes£Has §YArmy of the Dead§!:"
 necromancy_0_0_mod:0 "Necromancy: False Life"
 necromancy_1_0_mod:0 "Necromancy: Steal Vitality"
 necromancy_1_0_alternative_mod:0 "Necromancy: Bestow Vitality"
 necromancy_1_0_effect_req_tt:0 "If [This.Monarch.GetName] is a §YLich§!:"
 necromancy_1_1_mod:0 "Necromancy: Contagion"
 necromancy_2_1_mod:0 "Necromancy: Ghoulish Grandeur"
 undead_military:0 "Necromancy: Army of the Dead"
 undead_military_hint:0 "§YUndead Armies§! will not lose morale in battle so long as they have units in reserve. To achieve this, field more regiments in a province than combat width would normally allow!"

 magic_spell.701.t:0 "Undead Recruits from Battle"
 magic_spell.701.d:0 "The army of the dead does not kill, it recruits. An experienced necromancer will tell you that out of every ten deceased littering the battlefield, nine will be brutalized to the point of unusability. What this leaves is one in ten that are suitable for necromantic purposes. Not every corpse has to be fresh: curiously enough, the heuristic of one in ten holds true for both the re-unanimated corpse and the newly dead.\n\nA recent battle has fielded more potential undead soldiers to join in your unholy ranks. Picking through the unburied bodies, you decimate their population to add to your charnel house."
 magic_spell.701.a:0 "Rise!"
 magic_spell.701.b:0 "Rise! (But hide undead army pop-ups from now on)"
 magic_spell_raise_undead_tt:0 "Gain §G[Root.raise_undead.GetValue]§! Manpower from reviving the fallen!"

 magic_spell.702.t:0 "Out of Control Undead Army!"
 magic_spell.702.d:0 "The recent death of our ruler has seen the undead servants of our realm falter and lose their minds, attacking and eating other subjects of the realm!\nThankfully the magic that keeps them unliving will soon wane, but gods know when that will happen. If we don't do anything our country will be left to the hands of the hungering dead!"
 magic_spell.702.a:0 "We've lost control! Aaaagh!"
 magic_spell.702.b:0 "Bring them under my will!"
 magic_spell.702.c:0 "The Necromancers remain in control."
 undead_army_becomes_threat_tt:0 "Where once armies stood, wandering zombies will threaten the countryside!"

 magic_spell.704.t:0 "Undead Army Annihilated!"
 magic_spell.704.desc:0 "The slow, shambling forces of the dead do not feel fear, and thus will never properly retreat. A recent battle has resulted in the total loss of all necromantic agents, and enemy armies have prevented our necromancers from reaching the battlefield to salvage forces."
 magic_spell.704.a:0 "Let us survey the damage."
 magic_spell.704.b:0 "I don't want to hear about this again! (Hide pop-ups)."

 magic_spell.710.t:0 "Magical Plague!"
 magic_spell.710.desc:0 "Our enemies have set a plague upon their own province of [contagion_province.GetName]! They would rather bring death upon all its residents than see us conquer its walls."
 magic_spell.710.a:0 "Damnation!"

 ###############################
 ### TRANSMUTATION (800-899) ###
 ###############################

 transmutation_0_0_spell:0 "Longstrider"
 transmutation_0_0_spell_desc:0 "§gSome Transmuters cast Longstrider with a pinch of dirt, others with a coiled spring, yet others use the sole of a shoe. The shoe-casters take the spell's name very literally. No one likes the shoe-casters.§!"
 transmutation_1_0_spell:0 "Plant Growth"
 transmutation_1_0_spell_desc:0 "§gApprentices first practice Transmutation magic on plants before graduating to animals or people. A talented mage can use this rudimentary skillset to great advantage, producing flourishing fields of crops.§!"
 transmutation_1_1_spell:0 "Mass Enlarge"
 transmutation_1_1_spell_desc:0 "§gGiants were once the hegemons of the old world, and brought an end to the Rule of Dragons. Against such a foe, even the most fortified bastion would be nothing more than a children's toy.§!"
 transmutation_2_0_spell:0 "Rite of Conception"
 transmutation_2_0_spell_desc:0 "§gThe Rite of Conception is not a single act, but a series of rituals thought to increase one's chances at a magically gifted child. To what extent any one of them is efficacious is unclear, but in sum there is a noticeable effect.§!"
 transmutation_2_1_spell:0 "Reshape Terrain"
 transmutation_2_1_spell_desc:0 "§gTransmutation differs from the other schools of magic in that its effects persist long after the magic ends. There is no dispelling a tilled field, no countercurse for trees.§!"
 transmutation_3_0_spell:0 "Philosopher's Stone"
 transmutation_3_0_spell_desc:0 "§gIn theory, any element can be made into another given time and energy. The trick is making it worthwhile: by developing the right catalyst, massive amounts of material can be transmuted with minimal effort.§!"

 transmutation_0_0_mod:0 "Transmutation: Longstrider"
 transmutation_1_0_spell_effect_tt:0 "Every owned §YPlant§! good gets the following effects:"
 transmutation_1_0_local_mod:0 "Transmutation: Plant Growth"
 transmutation_1_0_cooldown_mod:0 "Transmutation: Plant Growth"
 transmutation_1_1_local_mod:0 "Transmutation: Mass Enlarge"
 transmutation_2_1_mod:0 "Transmutation: Reshape Terrain"
 transmutation_3_0_spell_effect_1_tt:0 "From provinces with metal goods"
 transmutation_3_0_spell_effect_2_tt:0 "A random owned province currently producing a non-gold metal will have its trade good §Gtransmuted into gold§!!"
