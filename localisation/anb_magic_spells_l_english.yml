 ############################
 ### NECROMANCY (700-799) ###
 ############################

 necromancy_0_0_spell:0 "False Life"
 necromancy_0_0_spell_desc:0 "§gTo deal with life is to deal with death. Most novice Necromancers stumble onto their expertise in frustrated attempts to create healing magic. Artificial animation is the first step on their journey.§!"
 necromancy_1_0_spell:0 "Steal Vitality"
 necromancy_1_0_spell_desc:0 "§gEventually, each novice Necromancer discover the same truth: life cannot be created, only transferred. There are alternatively noble and selfish distributions, but to be a necromancer is to decide who deserves life.§!"
 necromancy_1_1_spell:0 "Contagion"
 necromancy_1_1_spell_desc:0 "§gTo survive, a creature may kill another. Plague is a living being, growing and feasting and dying. Therefore, it is no sin for plague to kill a man to sustain itself. Nor is it a sin to father disease, raise it to maturity, and set it loose.§!"
 necromancy_2_0_spell:0 "Speak with Dead"
 necromancy_2_0_spell_desc:0 "§gIn 1751, the Rending of Realms brought ghosts of Halessi ancestors back to the Prime Material. Efforts to measure the casualties were all futile: what is a casualty, besides an arbitrary distinction between living and dead?§!"
 necromancy_2_1_spell:0 "Ghoulish Grandeur"
 necromancy_2_1_spell_desc:0 "§gThe best understanding of Necromancy is as a single extended act of self-aggrandizement. More than any other school, Necromancy positions its wielder as all-powerful and enables them to profit from the death of others.§!"
 necromancy_3_0_spell:0 "Army of the Dead"
 necromancy_3_0_spell_desc:0 "§gThe living are fundamentally unreliable; they are more useful dead. The dead are capable of creating more dead. Any Necromancer will eventually put two and two together. All that remains is to follow through.§!"

 necromancy_0_0_spell_effect_1_tt:0 "£no£Has §YArmy of the Dead§!:"
 necromancy_0_0_spell_effect_2_tt:0 "£yes£Has §YArmy of the Dead§!:"
 necromancy_0_0_mod:0 "Necromancy: False Life"
 necromancy_1_0_mod:0 "Necromancy: Steal Vitality"
 necromancy_1_1_mod:0 "Necromancy: Contagion"
 necromancy_2_0_mod:0 "Necromancy: The Dead Speak!"
 necromancy_2_1_mod:0 "Necromancy: Ghoulish Grandeur"
 undead_military:0 "Necromancy: Army of the Dead"
 undead_military_hint:0 "§YUndead Armies§! will not lose morale in battle so long as they have units in reserve. To achieve this, field more regiments in a province than combat width would normally allow!"

 magic_spell.701.t:0 "Undead Recruits from Battle"
 magic_spell.701.d:0 "The army of the dead does not kill, it recruits. An experienced necromancer will tell you that out of every ten deceased littering the battlefield, nine will be brutalized to the point of unusability. What this leaves is one in ten that are suitable for necromantic purposes. Not every corpse has to be fresh: curiously enough, the heuristic of one in ten holds true for both the re-unanimated corpse and the newly dead.\n\nA recent battle has fielded more potential undead soldiers to join in your unholy ranks. Picking through the unburied bodies, you decimate their population to add to your charnel house."
 magic_spell.701.a:0 "Rise!"
 magic_spell.701.b:0 "Rise! (But hide undead army pop-ups from now on)"
 magic_spell_raise_undead_tt:0 "Gain §G[Root.raise_undead.GetValue]§! Manpower from reviving the fallen!"

 magic_spell.702.t:0 "Out of Control Undead Army!"
 magic_spell.702.d:0 "The recent death of our ruler has seen the undead servants of our realm falter and lose their minds, attacking and eating other subjects of the realm!\nThankfully the magic that keeps them unliving will soon wane, but gods know when that will happen. If we don't do anything our country will be left to the hands of the hungering dead!"
 magic_spell.702.a:0 "We've lost control! Aaaagh!"
 magic_spell.702.b:0 "Bring them under my will!"
 magic_spell.702.c:0 "The Necromancers remain in control."
 undead_army_becomes_threat_tt:0 "Where once armies stood, wandering zombies will threaten the countryside!"

 magic_spell.704.t:0 "Undead Army Annihilated!"
 magic_spell.704.desc:0 "The slow, shambling forces of the dead do not feel fear, and thus will never properly retreat. A recent battle has resulted in the total loss of all necromantic agents, and enemy armies have prevented our necromancers from reaching the battlefield to salvage forces."
 magic_spell.704.a:0 "Let us survey the damage."
 magic_spell.704.b:0 "I don't want to hear about this again! (Hide pop-ups)."

 magic_spell.710.t:0 "Magical Plague!"
 magic_spell.710.desc:0 "Our enemies have set a plague upon their own province of [contagion_province.GetName]! They would rather bring death upon all its residents than see us conquer its walls."
 magic_spell.710.a:0 "Damnation!"

 ###############################
 ### TRANSMUTATION (800-899) ###
 ###############################

 transmutation_0_0_spell:0 "Longstrider"
 transmutation_0_0_spell_desc:0 "§gSome Transmuters cast Longstrider with a pinch of dirt, others with a coiled spring, yet others use the sole of a shoe. The shoe-casters take the spell's name very literally. No one likes the shoe-casters.§!"
 transmutation_1_0_spell:0 "Plant Growth"
 transmutation_1_0_spell_desc:0 "§gApprentices first practice Transmutation magic on plants before graduating to animals or people. A talented mage can use this rudimentary skillset to great advantage, producing flourishing fields of crops.§!"
 transmutation_1_1_spell:0 "Mass Enlarge"
 transmutation_1_1_spell_desc:0 "§gGiants were once the hegemons of the old world, and brought an end to the Rule of Dragons. Against such a foe, even the most fortified bastion would be nothing more than a children's toy.§!"
 transmutation_2_0_spell:0 "Philosopher's Stone"
 transmutation_2_0_spell_desc:0 "§gWhereas Herbalism uses natural ingredients such as plants and fungi in their whole form, Alchemy breaks things down to their components and reconstructs them in new ways. Practiced for centuries in regions like Yanshen, the scientific approach taken by Alchemists can be seen as progenitor of Artificery.§!"
 transmutation_2_1_spell:0 "Reshape Terrain"
 transmutation_2_1_spell_desc:0 "§gTransmutation differs from the other schools of magic in that its effects persist long after the magic ends. There is no dispelling a tilled field, no countercurse for trees.§!"
 transmutation_3_0_spell:0 "Rite of Conception"
 transmutation_3_0_spell_desc:0 "§gThe Rite of Conception is not a single act, but a series of rituals thought to increase one's chances at a magically gifted child. To what extent any one of them is efficacious is unclear, but in sum there is a noticeable effect.§!"

 transmutation_0_0_mod:0 "Transmutation: Longstrider"
 transmutation_1_0_spell_effect_tt:0 "Every owned §YPlant§! good gets the following effects:"
 transmutation_1_0_local_mod:0 "Transmutation: Plant Growth"
 transmutation_1_0_cooldown_mod:0 "Transmutation: Plant Growth"
 transmutation_1_1_local_mod:0 "Transmutation: Mass Enlarge"
 transmutation_2_0_spell_effect_1_tt:0 "from provinces with metal goods"
 transmutation_2_0_spell_effect_2_tt:0 "\nA random owned province currently producing a non-gold metal will have its trade good §Gtransmuted into gold§!! This effect will prioritize lower-value metals, and will end when the province is next §Rsieged down by foreign invaders§!."
 transmutation_2_0_local_mod:0 "Transmutation: Philosopher's Stone"
 desc_transmutation_2_0_local_mod:0 "This province has gold from a §YPhilosopher's Stone§!, creating an endless supply of riches for its inhabitants. The object, however, also proves a great attractor to ransacking armies looking for spoils...\n\n§TSieging down this province will award us with riches!§!"
 transmutation_2_1_mod:0 "Transmutation: Reshape Terrain"
 transmutation_2_1_buffed_mod:0 "Transmutation: Enhanced Reshape Terrain"
 transmutation_3_0_cooldown_mod:0 "Transmutation: Rite of Conception"
 transmutation_3_0_trigger_tt:0 "We are NOT currently attempting a §YRite of Conception§!"

 has_cast_reshape_terrain:0 "The spell '§YReshape Terrain§!' is active"

 
 magic_spell.800.t:0 "The Golden Child"
 magic_spell.800.d:0 "There has always been controversy around the performance of the rites of conception, owing in part to the great regional variation that accompanies the practice. In some cultures, the rites extend to the imbibing of certain potions and the inhalation of certain smokes by the pregnant party. In others, the rites require the conceiving of twins, one of whom must kill the other in the womb. In the years to come, there will be rumors about the nature of this one's conception and birth. There will be no question, however, as to their magical talent. From a golden-colored pool, the child emerges. Their eyes are already open, peering curiously at you with preternatural sight."
 magic_spell.800.a:0 "This child is our new heir!"
 magic_spell.800.b:0 "I've changed my mind. Our existing heir will serve well."
 magic_estate_magical_elite_heir:0 "We will disinherit our current heir, [Root.Heir.GetName]. Due to the Magical Elite government reform, this will not cost us anything."
 magic_estate_disinherit_heir:0 "We will disinherit our current heir, [Root.Heir.GetName]."

 magic_spell.801.t:0 "The Laughing Magician"
 magic_spell.801.d:0 "Oh dear. Something has gone wrong with this one, surely. No child of yours could be so difficult on the eyes, so sickly in their cough, so feeble in their countenance. It is as though their life is a grotesque parody of the one they were meant to live. Some cultures practice the rite of conception by conceiving twins and having one kill the other. In this case, it seems the wrong child survived.\n\nThe babe stares one wicked eye at you, and emits a brutish, hacking laugh. My magic was stronger, they seem to say. My magic survived."
 magic_spell.801.a:0 "This is my child. Who said those things? Banish them."
 magic_spell.801.b:0 "There must have been some mistake! We should start over."
 magic_spell.802.t:0 "Complications During Childbirth..."
 magic_spell.802.d:0 "My [Root.Monarch.GetTitle]! You are wanted in the chamber, quickly now, there isn't much time! The child is about to be born, but--there's been complications, you see... we don't know if they'll make it, it's too close to call. Am I talking about the child or the parent? Both, I suppose! Please, [Root.Monarch.GetTitle], you must come see... There is a hard choice to be made here, the doctors cannot save everyone."
 magic_spell.802.a:0 "We have no choice but to let the child go."
 magic_spell.802.b:0 "Let [Root.Consort.GetTitle] [Root.Consort.GetName] go. Save the child."
 magic_spell.802.c:0 "Borrow my life force, save them!"
 magic_spell.803.t:0 "Power Overwhelming"
 magic_spell.803.d:0 "(Placeholder) Tughayasa enters inside you and grants you immesurable magic power"
 magic_spell.803.a:0 "Yippee!"
 magic_spell.804.t:0 "An Abomination!"
 magic_spell.804.d:0 "Our pursuit of magic has borne poisonous fruit. Our rites must have been done improperly, or perhaps they were tainted from the start--is it any great surprise that of the many ancient flesh-rituals we followed, one of them might have been aimed towards unseemly ends? All matter of unguents were applied to the [Root.Consort.GetTitle], flesh grafted and rituals spoken that even we half-understood. Now here are the effects of it all: on the date of the birth, when celebrations were being prepared just downstairs, the child delivered itself via bisection, and crawled out of its mother's throat fully-grown.\n\nIt has eyes where it ought to have teeth, and teeth where it ought to have hair. Not a single person present to witness the delivery survived, and the guards are still unable to bring it down."
 magic_spell.804.a:0 "Grieve violently."
 magic_spell.805.t:0 "Philosopher's Stone Ransacked!"
 magic_spell.805.d:0 "The Philosopher's Stone in the province has been snatched away by invading soldiers, melted down and sold for scrap by barbarians who hardly understand its true value! With this, the province of [Root.GetName] must revert its mine back to its old form..."
 magic_spell.805.a:0 "Drat!"
 magic_spell.806.t:0 "Philosopher's Stone Established in [Root.GetName]"
 magic_spell.806.d:0 "(Placeholder) The Philosopher's Stone in this province has been integrated into its supply chain, providing its inhabitants with riches beyond measure!"
 magic_spell.806.a:0 "Let's just hope nothing happens to it..."