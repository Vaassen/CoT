noukahi_pantheon.100.t:0 "Something Unwell with the Wells"
noukahi_pantheon.100.d:0 "As you travel through the countryside, you come across a small village stricken by sickness and famine. All wells in the area have become infested with some vile disease, all who drank from them fell deadly sick, all plants touched by their water quickly rot. The source of the curse is revealed by the desperate townspeople, in their greed they denied water to a thirsty wandering Griot, and the Gods have punished them accordingly. Now their children die of the same thirst they refused to quench for that holy man. The people of the village beg you, could you share your water supplies with them, while they await for the gods to hear their prayers and grant them forgiveness? That would force you to buy extra water in the next town, an unaccounted expense."
noukahi_pantheon.100.a:0 "I will give you the charity you refused to others."
noukahi_pantheon.100.b:0 "I dare not defy the gods’ will."
noukahi_pantheon.100.c:0 "Water is fetching quite a price these days…"
noukahi_pantheon.100.d1:0 "I will keep you in my prayers instead."

noukahi_pantheon.101.t:0 "The Serpopard and the Warrior"
noukahi_pantheon.101.d:0 "You meet a young warrior on the road. He tells you he is preparing to battle a Serpopard, a terrible beast that devastates all on its path, and is said to feed on the warrior spirit of the adventurers and heroes that perish trying to slay it. The enthusiastic warrior wants to destroy the beast, which is still merely a youngling, before it can grow further and threaten the nearby villages. His cause is noble, but you suspect he is unprepared, and might end up feeding the creature vile power even further rather than destroy it."
noukahi_pantheon.101.a:0 "My best men will join you in your quest."
noukahi_pantheon.101.b:0 "I will pray for your success."
noukahi_pantheon.101.c:0 "Forget that thing and join my retinue instead."
noukahi_pantheon.101.d1:0 "We will destroy this monster together!"
noukahi_pilgrimage_injury_ruler_modifier:0 "Injury"
noukahi_pilgrimage_injury_ruler_modifier_desc:0 "This ruler suffered grave injuries combating a vile monster during a pilgrimage."

noukahi_pantheon.102.t:0 "An Aged Memory"
noukahi_pantheon.102.d:0 "You share your dinner with a fellow pilgrim, an old Griot, and spend the night listening to his stories. It seems clear that age has affected the memory of the man, he is quite struggling to remember a popular tale, one you must have heard a million times. It seems clear you are not the only one that has noticed, some among your retinue share mocking smiles and even some poorly hidden laughs are heard.  The embarrassment and sadness in the face of the storyteller does nothing but grow."
noukahi_pantheon.102.a:0 "Distract them by telling an embarrassing story about yourself."
noukahi_pantheon.102.b:0 "Keep your mouth shut."
noukahi_pantheon.102.c:0 "Shut the old man up and tell the story yourself."
noukahi_pantheon.102.d1:0 "I loved your story, would you like to join our court?"
noukahi_pantheon.102.e:0 "Subtly guide him towards the details he is forgetting."

noukahi_pantheon.103.t:0 "Neutral Mediator?"
noukahi_pantheon.103.d:0 "You come across two men, irately debating about a religious controversy. They request your mediation, and you tell them that they can share campment tonight, and you will reflect about it and reveal which side you have come to see as most correct in the morning. In the middle of the night, one of the men approaches, and offers a small bribe in exchange for supporting his side. Obviously, the moral thing would be to reject it, but the thing is, you had already reached the conclusion that his side was the correct anyway. Now you face a moral conundrum, you do not want to support a dishonest man, nor do you want to lie about your conclusion. You could refuse to give an answer at all in the morning, but it would reflect poorly on your position as ruler if you cannot even give an answer to a simple dilemma. Or perhaps you could just take the bribe and move on?"
noukahi_pantheon.103.a:0 "I cannot answer with my neutrality compromised."
noukahi_pantheon.103.b:0 "Reject the bribe, pick either answer and move on."
noukahi_pantheon.103.c:0 "Well, if you insist on paying me..."

noukahi_pantheon.104.t:0 "Seal Attack"
noukahi_pantheon.104.d:0 "You separate from your retinue to see the sights of a nearby river. There, you are horrified to witness a pack of rotund yet bloodthirsty river seals, ferociously mauling a fisherman. You could try to intervene, but are you willing to risk suffering the seals’ wrath?"
noukahi_pantheon.104.a:0 " Leave this man alone you fiendish pinnipeds!"
noukahi_pantheon.104.b:0 "Call someone to deal with these seals!"
noukahi_pantheon.104.c:0 "His fate is sealed."
noukahi_pantheon.104.d1:0 "Wait a second, we don't have river seals in Sarhal."
noukahi_seal_attack_1:0 "The seals respect your bravery, and after a brief but intense seal combat, they release their prey."
noukahi_seal_attack_2:0 "No one came, but at least you tried. The seals triumphally gallumph away."
noukahi_seal_attack_3:0 "Your silence is rewarded with a share of the fish bounty."
noukahi_seal_attack_4:0 "Their cover blown, the seals quickly disperse."
noukahi_pilgrimage_sealious_injury_ruler_modifier:0 "Sealious Injury"
noukahi_pilgrimage_sealious_injury_ruler_modifier_desc:0 "Seal bites are a nasty thing, and this ruler has learned that the hard way."

noukahi_pantheon.105.t:0 "A Drink Too Many"
noukahi_pantheon.105.d:0 "A fellow pilgrim invited you and your retinue to a few drinks in a tavern last night. You paid the next round in return, he insisted on paying a third one, you did not want to seem ungrateful… A thing led to another, and you ended up drunk as a halfling in a beer barrel. A Griot scolds you like a child, and your hangover self is barely able to stand it. "A ruler should lead by example, be a paragon of moderation! Long tales have been written about the importance of this virtue, I can quite see you need to hear one right now!""
noukahi_pantheon.105.a:0 "Suffer through the tale and promise to change your ways."
noukahi_pantheon.105.b:0 "Quickly apologize and excuse yourself."
noukahi_pantheon.105.c:0 "Shut him up and drown the hangover with another bottle."
noukahi_drinking_buddy:0 "You meet an interesting drinking buddy."

noukahi_pantheon.106.t:0 "A Modest Shrine"
noukahi_pantheon.106.d:0 "A shrine to a local hero lies on your path. It looks abandoned and ruinous, a condition that one of your accompanying Griots greatly laments. “Oh my liege, I know of the hero this shrine is dedicated to, a paragon of virtue beyond compare, and it saddens me greatly to see his shrine in this sorry state. Please, once we return to the realm, you must grant me funds to build a great shrine to this hero in our lands, we cannot allow his memory to fade there too as it has here!” As the Griot starts going on and on about his plans, you realize this is going to be a very, very, very expensive shrine."
noukahi_pantheon.106.a:0 "No cost would be too great to honor this great man!"
noukahi_pantheon.106.b:0 "We already have a lot of shrines in [Root.GetName]."

noukahi_pantheon.107.t:0 "The Spear of a Hero?"
noukahi_pantheon.107.d:0 "You have crossed paths with a traveling merchant during your pilgrimage, and he has taken this as a sale opportunity. He says he is offering you a “wonderful relic of a great hero” as he shows you an old and jaded spear, which he assures you belonged to the great hero Pokelgato. You have never heard of such an individual, nor have any of your Griots, but the seller swears up and down that this is the magic weapon of one of the greatest heroes to ever exist. He says that while he treasures it more than anything, he is willing to part with it so that it can be owned by a hero almost to the level of the legendary Pokelgato, that is, you. Provided you pay a merely symbolic fee, just to prove you really want it, of course."
noukahi_pantheon.107.a:0 "This sounds pretty fishy."
noukahi_pantheon.107.b:0 "I simply must have this amazing weapon."
noukahi_pantheon.107.c:0 "Guards! Seize this great relic!"
noukahi_bought_spear:0 "If the weapon turns out to be real, perhaps it will turn you into a great hero too."
noukahi_stole_spear:0 "Thievery is rather unheroic, but that won't stop you from seizing the rest of the  weapons supply of the merchant too."

noukahi_pantheon.108.t:0 "A Feast of Vultures"
noukahi_pantheon.108.d:0 "A cloud of circling vultures clouds the heavens. On the ground, dozens already feast on the plentiful carcasses. At least 20 men lay dead, together with a half a dozen horses. A bandit dispute, according to your guide, and neither side cared enough about their dead to do anything but leave them to rot. You suggest burying them, but he spits in the ground. These men were good for nothing but robbing and killing in life, he says, let them be useful in death, even if it is as carrion. Your men seem to be in agreement. You worry, perhaps showing kindness to these dead wretches could be interpreted as sentimental weakness, that could cause you trouble once you are back home."
noukahi_pantheon.108.a:0 "Even the lowest of fiends deserves a proper final rest."
noukahi_pantheon.108.b:0 "Vultures need to eat too I guess."

noukahi_pantheon.109.t:0 "The Woes of a Peasant"
noukahi_pantheon.109.d:0 "You pass through a humble house, and notice a crying young woman on its doorstep. Eager to find a task to prove your worthiness, you approach and question her for the source of her woes. She tells you her family is facing ruin and destitution, as a combination of a bad harvest and the high tributes the local lord demands has left them with almost nothing. You reach for your purse to give some alms, but she stops you. "You are a great lord in your land aren’t you? I’m not your responsibility, your people are, if you truly feel sorry for my state, when you get back to your kingdom, cut the taxes, protect peasant rights and distribute bread among the needy, let no family in your domains suffer as mine does.""
noukahi_pantheon.109.a:0 "You are right, I will be a kind ruler."
noukahi_pantheon.109.b:0 "I’m just going to leave the money here and pretend i didn’t hear the last part."
noukahi_pantheon.109.c:0 "Impertinent mouse! You are lucky i dont have you beheaded."
noukahi_pantheon.109.d1:0 "Guards! Behead her!"
noukahi_pilgrimage_increased_peasants_rights:0 "Increased Peasant Rights"
noukahi_pilgrimage_increased_peasants_rights_desc:0 "After a fateful encounter during a pilgrimage, this ruler decided to introduce several reforms increasing peasant rights."
noukahi_pilgrimage_scourge_of_the_peasants:0 "Scourge of the Peasants"
noukahi_pilgrimage_scourge_of_the_peasants_desc:0 "This ruler is known for squeezing peasants dry with taxes, and executing any who dares complain."

