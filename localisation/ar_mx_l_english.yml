 ar_mx_exam_slot_tt:0 "The Register is open, this faculty is not yet certified, and no other examination is running or suspended."
 ar_mx_course_practice_tt:0 "Cast at least one spell from this school after opening the Eightfold Register."
 ar_mx_choice_1_a_tt:0 "Adopt the §YPublic Charter§!: §G+5% production efficiency§! and §G+10% improve relations§! permanently."
 ar_mx_choice_1_b_tt:0 "Adopt the §YInner Conclave§!: §G+10% estate magic experience§! and §G+1 advisor pool§! permanently."
 ar_mx_choice_2_a_tt:0 "Create §YFederated Towers§!: §G+1 diplomatic relation§! and §G+10% improve relations§! permanently."
 ar_mx_choice_2_b_tt:0 "Adopt §YCentral Accreditation§!: §G+10% estate magic experience§! and §G+5% tax§! permanently."
 ar_mx_choice_3_a_tt:0 "Adopt §YJoint Magical Oversight§!: §G+1 diplomatic reputation§! and §G+10% global garrison growth§! permanently. Orda Aldresia gains §G+30 opinion§! of us if it exists, decaying by 1 per year."
 ar_mx_choice_3_b_tt:0 "Claim §YExclusive Jurisdiction§!: §G+0.5 yearly army tradition§! and §G-10% land attrition§! permanently. Orda Aldresia gains §R-30 opinion§! of us if it exists, decaying by 1 per year."
 ar_mx_research_unlocked_tt:0 "Unlock §YFaculty Accreditation§! decisions. Cast spells through the normal magic menu after this mission to record practical demonstrations. Eight one-year examinations complete the curriculum; only one examination runs at a time. A sealed legal curriculum can replace practical necromancy."
 ar_mx_college_unlocked_tt:0 "Unlock §YCharter an Associate College§!. Friendly foreign colleges count towards the network; conquest is not required."
 ar_mx_workshop_unlocked_tt:0 "Unlock §YLicense an Enchanted Workshop§!. Licences initially give §G+10% local goods produced§!."
 ar_mx_ward_unlocked_tt:0 "Unlock §YInspect and Renew a Ward§!. Initial wards give §G+20% local defensiveness§! and §G+10% garrison growth§!."
 ar_mx_workshops_upgraded_tt:0 "Existing owned licensed workshops and future licences now give §G+15% local goods produced§! and §G+10% local tax§!, replacing the earlier workshop modifier."
 ar_mx_wards_upgraded_tt:0 "Existing owned inspected wards and future inspections now give §G+30% local defensiveness§! and §G+25% local garrison size§!, replacing the earlier ward modifier."
 ar_mx_course_cost_tt:0 "Pay §Y40 magical mana§! and §Ythree months of income§! for a §Y365-day§! faculty examination. Success grants its certificate, §G5 prestige§! and §Yfive years§! of Peer-Reviewed Research. Occupation or unavailable magic suspends completion; resume for a §Y90-day§! review at no extra cost."
 ar_mx_sealed_cost_tt:0 "Pay §Y50 administrative power§! and §Ysix months of income§! for a one-year examination in the history and law of necromancy. This grants its faculty certificate without casting forbidden spells or lifting a ban."
 ar_mx_college_cost_tt:0 "On confirmation, pay §Y25 diplomatic power§! and §Ysix months of income§!. Establish an associate college: §G+25% institution spread§! and §G+10% local tax§!. A foreign host receives §Y25 ducats§!."
 ar_mx_workshop_cost_tt:0 "On confirmation, pay §Y25 magical mana§! and §Y0.2 years of income§! to license this workshop. Cancelling or confirming a now-ineligible site spends nothing."
 ar_mx_ward_cost_tt:0 "On confirmation, pay §Y40 magical mana§! and §Ythree months of income§! to inspect this ward. Cancelling or confirming a now-ineligible site spends nothing."
 ar_mx_register_status_tt:0 "Faculty certificates: §Y[Root.ar_mx_certificates.GetValue] / 8§!.\nThe decisions list all uncertified faculties. One examination can run at a time. Suspended examinations have a Resume decision.\n\nA college network mission counts each current friendly owner country once, including ourselves. Foreign owners must retain at least §Y50 opinion§! and remain at peace with us.\n\nThe final reward adds §G+1 monthly magical mana§!, §G+2 estate spell-level capacity§!, §G+5% estate loyalty equilibrium§! and §G+1 yearly prestige§!."
 ar_mx_courses_2_tt:0 "Accredit at least §Y2 of the eight faculties§!."
 ar_mx_courses_4_tt:0 "Accredit at least §Y4 of the eight faculties§!."
 ar_mx_courses_6_tt:0 "Accredit at least §Y6 of the eight faculties§!."
 ar_mx_courses_8_tt:0 "Accredit at least §Y8 of the eight faculties§!."
 ar_mx_colleges_3_tt:0 "Maintain associate colleges in at least §Y3 distinct friendly countries§!, counting our own country once."
