 ar_mx_colleges_6_tt:0 "Maintain associate colleges in at least §Y6 distinct friendly countries§!, counting our own country once."
 ar_mx_colleges_8_tt:0 "Maintain associate colleges in at least §Y8 distinct friendly countries§!, counting our own country once."
 ar_mx_cast_5_tt:0 "Cast at least §Y5 spells§! through the magic system after opening the Eightfold Register."
 ar_mx_cast_15_tt:0 "Cast at least §Y15 spells§! through the magic system after opening the Eightfold Register."
