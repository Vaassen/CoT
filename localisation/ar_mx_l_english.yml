 ar_mx_course_abjuration_title:0 "Accredit the Abjuration Faculty"
 ar_mx_course_abjuration_desc:0 "Complete a one-year, independently examined abjuration programme. We need at least Proficient knowledge of the school and must cast one of its spells after opening the register. Cost: §Y40 magical mana§! and §Ythree months of income§!. Only one faculty examination can run at once."
 ar_mx_course_conjuration_title:0 "Accredit the Conjuration Faculty"
 ar_mx_course_conjuration_desc:0 "Complete a one-year, independently examined conjuration programme. We need at least Proficient knowledge of the school and must cast one of its spells after opening the register. Cost: §Y40 magical mana§! and §Ythree months of income§!. Only one faculty examination can run at once."
 ar_mx_course_divination_title:0 "Accredit the Divination Faculty"
 ar_mx_course_divination_desc:0 "Complete a one-year, independently examined divination programme. We need at least Proficient knowledge of the school and must cast one of its spells after opening the register. Cost: §Y40 magical mana§! and §Ythree months of income§!. Only one faculty examination can run at once."
 ar_mx_course_enchantment_title:0 "Accredit the Enchantment Faculty"
 ar_mx_course_enchantment_desc:0 "Complete a one-year, independently examined enchantment programme. We need at least Proficient knowledge of the school and must cast one of its spells after opening the register. Cost: §Y40 magical mana§! and §Ythree months of income§!. Only one faculty examination can run at once."
 ar_mx_course_evocation_title:0 "Accredit the Evocation Faculty"
 ar_mx_course_evocation_desc:0 "Complete a one-year, independently examined evocation programme. We need at least Proficient knowledge of the school and must cast one of its spells after opening the register. Cost: §Y40 magical mana§! and §Ythree months of income§!. Only one faculty examination can run at once."
 ar_mx_course_illusion_title:0 "Accredit the Illusion Faculty"
 ar_mx_course_illusion_desc:0 "Complete a one-year, independently examined illusion programme. We need at least Proficient knowledge of the school and must cast one of its spells after opening the register. Cost: §Y40 magical mana§! and §Ythree months of income§!. Only one faculty examination can run at once."
 ar_mx_course_necromancy_title:0 "Accredit the Necromancy Faculty"
 ar_mx_course_necromancy_desc:0 "Complete a one-year, independently examined necromancy programme. We need at least Proficient knowledge of the school and must cast one of its spells after opening the register. Cost: §Y40 magical mana§! and §Ythree months of income§!. Only one faculty examination can run at once."
 ar_mx_course_transmutation_title:0 "Accredit the Transmutation Faculty"
 ar_mx_course_transmutation_desc:0 "Complete a one-year, independently examined transmutation programme. We need at least Proficient knowledge of the school and must cast one of its spells after opening the register. Cost: §Y40 magical mana§! and §Ythree months of income§!. Only one faculty examination can run at once."
 ar_mx_sealed_necromancy_title:0 "Establish the Sealed Chair"
 ar_mx_sealed_necromancy_desc:0 "Accredit necromancy through a sealed historical and legal curriculum. This alternative requires no necromancy skill, no necromantic spellcasting and no lifting of a ban. It grants the same faculty certificate after one year. Cost: §Y50 administrative power§! and §Ysix months of income§!."
 ar_mx_resume_research_title:0 "Resume the Faculty Examination"
 ar_mx_resume_research_desc:0 "Once Adrail is secure and magic is available, finish the suspended examination with a §Y90-day§! review. Its original costs are not charged again."
 ar_mx_cancel_research_title:0 "Abandon the Faculty Examination"
 ar_mx_cancel_research_desc:0 "Cancel the running or suspended examination. Completed certificates remain. The unfinished examination grants no certificate and its costs are not refunded."
 ar_mx_research_overview_title:0 "Review the Eightfold Register"
 ar_mx_research_overview_desc:0 "Review the eight school certificates and the state of our examination programme. Certificates completed: §Y[Root.ar_mx_certificates.GetValue] / 8§!."
 ar_mx_college_decision_title:0 "Charter an Associate College"
 ar_mx_college_decision_desc:0 "Choose a capital, university or mage tower in Cannor's continent with at least §Y12 development§!. Its owner must have a Mage Estate and at least §Y125 opinion§! of us, or be us. A college grants its province §G+25% institution spread§! and §G+10% tax§!. Foreign hosts also receive §Y25 ducats§!. Cost: §Y25 diplomatic power§! and §Ysix months of income§!. Only one college per friendly country counts towards network missions; continued friendship requires §Y50 opinion§! and peace."
 ar_mx_college_site.t:0 "Charter an Associate College: [ar_mx_site.GetName]"
 ar_mx_college_site.d:0 ""
 ar_mx_workshop_decision_title:0 "License an Enchanted Workshop"
 ar_mx_workshop_decision_desc:0 "Choose an owned, controlled province with a workshop or counting house and at least §Y10 development§!. Cost: §Y25 magical mana§! and §Y0.2 years of income§!. A province can be licensed once. Completing A Charter for Every Craft upgrades existing and future licences."
 ar_mx_workshop_site.t:0 "License an Enchanted Workshop: [ar_mx_site.GetName]"
 ar_mx_workshop_site.d:0 ""
 ar_mx_ward_decision_title:0 "Inspect and Renew a Ward"
 ar_mx_ward_decision_desc:0 "Choose an owned, controlled fort of at least §Ylevel 2§!. Cost: §Y40 magical mana§! and §Ythree months of income§!. A province can be inspected once. Completing An Unbroken Ward upgrades existing and future wards."
 ar_mx_ward_site.t:0 "Inspect and Renew a Ward: [ar_mx_site.GetName]"
 ar_mx_ward_site.d:0 ""
 ar_magisterium.1.t:0 "The Charter of Magic"
 ar_magisterium.1.d:0 ""
 ar_magisterium.1.a:0 "A public charter: knowledge must serve the realm."
 ar_magisterium.1.b:0 "An inner conclave: the colleges shall govern their own."
