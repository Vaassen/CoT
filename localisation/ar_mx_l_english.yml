 ar_magisterium.2.d:0 ""
 ar_magisterium.2.a:0 "A federation of autonomous towers."
 ar_magisterium.2.b:0 "One standard, examined from Adrail."
 ar_magisterium.3.t:0 "The Aldresian Question"
 ar_magisterium.3.d:0 ""
 ar_magisterium.3.a:0 "Recognise a place for independent mage-knights."
 ar_magisterium.3.b:0 "Magical jurisdiction belongs to the council."
 ar_magisterium.4.t:0 "The Future Held in Trust"
 ar_magisterium.4.d:0 ""
 ar_magisterium.4.a:0 "Let the eight schools answer for what comes next."
