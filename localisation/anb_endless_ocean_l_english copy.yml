 endless_ocean_chronicle_pilgrimage_to_the_sea_tt:0 "Start Chronicling Pilgrimage to the Sea giving the following benefits:\n\n§YChronicled Pilgrimage to the Sea§!\nNational Supply Limit Modifier: §G+10.0%§!\nLand Attrition: §G-15.0%§!\n"
 endless_ocean_chronicle_kiamoa_worship_tt:0 "Start Chronicling Kiamoa Worship giving the following benefits:\n\n§YChronicled Kiamoa Worship§!\nFort Maintenance: §G-10.0%§!\nDefensiveness: §G+10.0%§!\n"
 endless_ocean_chronicle_great_voyages_tt:0 "Start Chronicling Great Voyages giving the following benefits:\n\n§YChronicled Great Voyages§!\nAll Power Cost: §G-2.5%§!\n"
 endless_ocean_chronicle_to_act_as_the_sea_tt:0 "Start Chronicling To Act as the Sea giving the following benefits:\n\n§YChronicled To Act as the Sea§!\nShock Damage: §G+10.0%§!\nInfantry Shock: §G+0.2§!\n"
 endless_ocean_chronicle_sight_of_mist_tt:0 "Start Chronicling Sight of Mist giving the following benefits:\n\n§YChronicled Sight of Mist§!\nCost of Advisors with Ruler's Religion: §G-10.0%§!\n\n§YAdditional Effects:§!\nWhile active Sight of Mist causes Court Mage Advisors to give an addtional Innovativeness Gain: §G+20.0%§! per Level.\n"
 endless_ocean_chronicle_veneration_of_heroes_tt:0 "Start Chronicling Veneration of Heroes giving the following benefits:\n\n§YChronicled Veneration of Heroes§!\nPrestige Decay: §G-1.0%§!\n\n§YAdditional Effects:§!\nWhile active Veneration of Heroes causes Heroic Generals events to trigger giving Powerful Generals following in the Legacy of the Heros of Kanolowele.\n"
