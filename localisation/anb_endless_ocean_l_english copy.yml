 endless_ocean_chronicle_a_way_back_tt:0 "Start Chronicling A Way Back giving the following benefits:\n\n§YChronicled A Way Back§!\nGlobal Trade Power: §G+15.0%§!\nReduced Trade Penalty on Non Main Trade Nide: §G+25.0%§!\n"
