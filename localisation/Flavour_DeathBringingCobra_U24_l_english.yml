#events

# The First Gift
flavor_dbc.1.t: "The First Gift"
flavor_dbc.1.d: "“I want nothing,” Kuende says. She stands in a quiet place before Granny Ilfanill, Wisest of the Wise Three, hag of the Coven of Yezel Mora, and she offers up a weapon. It is the life in her womb, the child itself.\n\n“Nothing?” Granny asks, cocking her head. Women who promise their young to the hags always seek something in return; power, freedom, life extension.\n\n“Only for you to do what you already wish,” Kuende says, her voice hoarse. “You will make her strong?”\n\n“Yes,” Granny says.\n\n“And you will unleash her on Sarhal. This is your intent.” Kuende has seen it; the shadow has told her through its portents.\n\n“It is.”\n\n“There is power in something freely given, no?” Kuende speaks stiffly, through rigid misery. The man who gave her this child is dead; her mother, who would recoil in horror at this, is dead too. There is nobody left to judge Kuende or to stop her.\n\n“The most powerful ritual is voluntary,” agrees Granny Ilfa. “Stronger than that which is transactional.”\n\nKuende nods. She steps forward, casting off her silk wrapper. She seizes Granny Ilfa’s wrist and tugs it to her; Granny’s eight spindly fingers dance across the slight bump of Kuende’s belly.\n\n“I felt her so early, Wise One. I felt her magic.” Kuende’s vision swims with tears, but few on Halann have ever looked so intently into Granny’s ancient eyes. “I give her to you, Granny Ilfanill, to do with as you will.”"
flavor_dbc.1.a:0 "May all Halann suffer."

