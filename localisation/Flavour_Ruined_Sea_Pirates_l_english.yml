 #GENERIC MISSON TREE EVENTS
 flavour_RSP.1.t:0 "Expanding Our Scope"
 flavour_RSP.1.d:0 "The tavern in [Root.Capital.GetName] was loud, which was very fortunate indeed, as Captain Brannick did not believe in speaking quietly. His burly hands slammed a dagger onto the map of the Ruined Sea, tainted with droplets of rum that spilled from his beard.\n“Eight landlubbers want us hanged, shot, or politely dissected! That's something I can get behind.” he said, taking another golden Crown from the small chest below his feet, tossing it to the bartender and turning to Captain Cara sitting just across the table. “We're starting to gain a name for ourselves, don't we love?”\n\nCara swirled her rum, leaned back, boots on the table and smirked. “Eight flags angry, coffers heavy, but you seem to not be satisfied Brannick? Why do those bushy brows of yours permanently frown, even in the face of success?”\n\n“Aye, it's a success,” he admitted. “But it's a small success. We raid, we run, we patch the hull with whatever remains after a cannonade and then we go off on our merry way, some treasure in pockets, some treasure buried in the sand, waiting for better days. We're a nuisance.”\n\nCara raised her brow. “A profitable nuisance.” To which Brannick quickly responded “But only a nuisance. Well… That is unless [Root.Monarch.GetName] moves [Root.Monarch.GetHerHis] arse and proposes something a tad bit… bigger.”\n\nThe woman smirked again, rolling one of the freshly stolen coins in her knuckles. “So you suggest we stop being small… we reinvest like some proper landowners? My, my, didn't take you for a responsible man, Brannick.”\n\nBrannick, visibly pleased with himself, opened his mouth and showed his hole-ridden toothing. “I've learned over the years, lassie.” He swung his tankard and downed what was left in it in one pull. “To expansion!”\n\nCara followed in suit, exclaiming, “And to pissing off at least four more before the year's out!” Yet this shout was lost in the sound of saw from the outside, for the docks were already being filled with salvaged timber and captured cannons."
 flavour_RSP.1.a:0 "It seems the nuisance has ambitions."
 flavour_RSP_1_a:0 "§YRaiding Coasts§! will have a chance to §YBury a Treasure§! in it!\n\nEvery §Y4 years§!, §Y[Root.GetName]§! will get a §YMap§!, pointing the way to one §YBuried Treasure§!.\n\nOccupying the province with the §YBuried Treasure§! will grant handsome rewards!\n"

 flavour_RSP.2.t:0 "Another Busy Day in [Root.Capital.GetName]"
 flavour_RSP.2.d:0 "Daniel Seagold, captain of the Black Reavers of [Root.GetName], stood on the deck of his flagship with spyglass in hand. It had been another successful voyage- his scurvy band had sailed all across the sea. They'd captured several prize ships sailing out of the Trollsbay, running them down like dogs catching gulls. Now all they had to do was sell their goods in a place worth selling them, and they could get to dividing up the plunder.\n\nAs it happened, that was precisely where they were headed.\n\nA speck appeared on the horizon. Then it became a smear. Then, slowly, it became home, and what a home it had grown into. The smell of woodsmoke and salt fish reached them before the island did. New towns dotted the bay, their fishing boats already out on the morning water. The hammering of construction rang across the harbour, and merchant banners Seagold didn't recognise snapped in the breeze above the docks. He lowered the spyglass and allowed himself a smile.\n\nAt long last, the ship managed to find a place to moor itself on the bustling docks. 'Unload the cargo, men!' Seagold cried. 'We're home at last!' A ragged cheer rose up from his weary sailors. Seagold kicked down the gangplank, prepared to step ashore, and found his way blocked by a man wearing an official looking sash, clutching a clipboard with what looked like religious reverence. He had a stern expression.\n\n'Stop right there, cap'n,' the man began. '[Root.CapitalScope.GetName] is a land of order, law, and justice! We can't have any smuggled goods sold on these fair shores. Please present your ship manifest immediately, with justification for your cargo listed.'\n\nThe two men looked at each other for a long moment. They began to snicker.\n\nThey collapsed to the dock laughing, tears running down their faces. When Seagold finally got up, he clapped the man on the shoulder, decided that his quartermaster could handle the unloading, and went to find a tavern. There were many, many taverns in [Root.CapitalScope.GetName], and he needed a drink and a chance to gamble some of his newly earned money away."
 flavour_RSP.2.a:0 "What a time to be alive!"

 flavour_RSP.3.t:0 "A Daring Heist"
 flavour_RSP.3.d:0 "“Convoys ain't enough!” [Root.Monarch.GetName] struck the table hard enough to rattle the cutlery. “We raid a Calassani convoy? They send two more. We snatch a VG brig? They write it off and raise their rates. Deranne sails in neat little lines and calls it a loss in next season's ledger! And do you know what that bloody bastard Alloy Dwarf told me lately when we've asked him about their shipping lines? That they don't give a rat's dick about it and shrug it off with interest. INTEREST! We risk our necks and they balance it on a page!”\n\n“We're chasing crumbs!” an old sailor shouted. “We nip at the sails, while they have 10 spare ones!” another voice joined. “They don't treat us seriously, bloody landlubbers!” Others voices rose in anger “You bunch of wankers, you have more booty than you could've imagined and fools among you want to ruin the most lucrative business for nothin'!”\n\nMere seconds later, doors exploded inward. Wind and rain burst through as a young captain strode inside, cloak snapping behind him, boots dripping with seawater. Onto the central table he threw four scrolls which unfurled as they landed. Detailed maps of Cas Colunn, New Calas, Asraport and Ricardsport - the great trade arteries of the Ruined Sea. Silence smothered the tavern.\n\n“You old bastards think that stealing from carts will grow us rich. The gold's in the counting houses, vaults, docks and warehouses.”\n\n[Root.Monarch.GetName] narrowed [Root.Monarch.GetHerHis] eyes. “Ports are fortified.”\n\nThe captain answered with a smirk - “Yes. But beaches are not. Ever seen those Mykx dogs launch straight from hull to sand? No siege, no warning. Blink and corsairs are already inside. And it just so happens we know of all the correct beaches to strike.”\n\nThe tavern stirred and erupted in heated argument. “That's suicide!”, “That's war!”, yet grin appeared on the face of the [Root.Monarch.GetTitle]."
 flavour_RSP.3.a:0 " “That's bloody brilliant.” [Root.Monarch.GetSheHe] said."

 flavour_RSP.4.t:0 "Blood, Gold and Salt"
 flavour_RSP.4.d:0 "Around noon, [Root.Monarch.GetTitle] is brought. The sun shines high above the newly expanded shipyards of [Root.Capital.GetName]. Despite their relative freshness, the whole place already reeks of sap and tar.\n\n“Mind the sawdust,” mutters the chief shipwright, an old Derranic sailor, already walking in the direction of the [Root.Monarch.GetTitle]. “She's already taking shape.”\n\nAll around them mallets ring against pegs. Adzes bite into the oak. Ropes creak as ribs of timber are hoisted upright like a rib-cage of some colossal sea-beast being un-butchered.\n\n“Keel first,” the shipwright says, patting the long spine laid firm along the blocks. “This lovely piece of timber supposedly comes from the Reaper's Coast, strong like a bastard of ogre and a troll.”\n\nThe [Root.Monarch.GetTitle] walks the length of it. Freshcut timber - no rot, no foreign maker's mark burned into the grain, no lingering smell of blood on the wood. Along it, frames rise. Curved ribs locked into place, one after another. Caulkers follow close behind, hammering oakum into seams. Tar bubbles in giant iron pots. The hull begins to take form, wide in the belly, lean at the bow.\n\n“Built to carry weight,” the shipwright knocks the wood. “Gold hold below, powder mid-deck. A compartment for rum, so boys don't grow thirsty on the seas. And enough guns to argue with an Amber Dwarf and win,” he slaps massive copper and iron mortars. Nearby, carpenters shape the gunports - evenly and tightly, reinforced with beams that brace the broadside.\n\nOn trestles, masts lie ready, already stripped and smoothed. Sailmakers stretch canvas across the yard and cut cloth for sails that will carry only our insignia - [Root.GetInsignia]. The shipwright stops to look at the ship and says in half-voice “She's no borrowed prize, capn' - she's ours. You know capn', ship is measured by blood it spills, gold it carries and salt it withstands."
 flavour_RSP.4.a:0 "“And this beauty will do it all,” [Root.Monarch.GetName] answers."
 flavour_RSP_4_a:0 "Enable the §YUnique Flagship Modification§! of §Y[Root.GetName]§! and of all §YDominated Aelantiri Pirates§!.\n\nEvery owned province with the '§YDen of Piracy§!' province modifier:\n   §YProvince(s)§! gets their §YDock Building§! upgraded. If §YDrydocks§! is present, gain §G500§! Sailors.\n   §YProvince(s)§! gets their §YShipyard Building§! upgraded. If §YGrand Shipyard§! is present, gain §G500§! Sailors."
