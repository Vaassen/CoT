l_english:
 RSP_just_adventuring_title:0 ""Just" "Adventuring""
 RSP_just_adventuring_desc:0 "It's amazing to see the places you can go if you act like you belong there. We once heard of a pirate crew who sailed out of the Trollsbay, who sailed off with an entire DTC ship by sneaking into their port and dressing like merchants. The ship was full of cabbages, aye, but that's not the point of the story.\n\nThe point of the story is that you can get anywhere you want with a winsome smile and a bit of panache. Our teeth are too rotted to smile much anymore, but if panache was gold we'd all be retired by now. But of course, we aren't the only ones who know the value of a bit of guts, a bit of perseverance, and the swagger that comes from your lucky piece of eight.\n\nIn Cannor, there are people like us, who just need a passage over and a crew berth to make something of themselves and make us rich. That's a bargain if we've ever heard one! We can provide them with the passage and the berth. All they'll have to provide is the courage to step on it, and the sense to act like they belong."
 RSP_just_adventuring_unlock_estate_privilege_tt:0 "Enable the §Y[Root.GetAdventurersName]§! privilege '§YSwashbuckling Expertise§!'.\n"

 RSP_what_we_do_best_title:0 "What We Do Best"
 RSP_what_we_do_best_desc:0 "When we pirates were wee lads who sat on our papas' knees, he told each of us that everyone has special gifts, and that these gifts are what make the world go 'round. Some people can smith great swords of metal, and some are good at making the numbers add up. Some people make big fancy works of art, which sell for lots of money. Some are nobles, who have special gifts for sitting around all day. He said that once we find our gift, we'd be able to add something to the world ourselves. Of course we had one- we just had to find out what it was. \n\nAnd now that we're grown, we certainly have found our specialty, across many years of searching. What we do best is stealing! The world is a great feast, and if none of it belongs to us, we'll take our share anyway. The colonists and companies of the Ruined Sea certainly don't have anyone whose special gift is securing their valuables.\n\nGather the mateys! Stock the ship with rum! A great adventure is about to begin!\n\nWe'll hoist the black flag, and we'll paint the world gold!"
 RSP_what_we_do_best_ei:0 "\n§GEvent Insight§!\nThe captains of [Root.GetName] grow restless with small-scale raiding, whispering of fleets thick with timber and cannons enough to shake the horizon. The time may have come to wager your plunder on something greater - to carve the name of [Root.GetName] into the Ruined Sea as more than just a passing curse.\n\n§gThis event will enable finding §YBuried Treasures§! in §YRaided Coasts§!.§!"

 RSP_protect_our_loot_title:0 "Protect Our Loot"
 RSP_protect_our_loot_desc:0 "Once you've been as far around the sea as we have, you begin to collect something of a nest egg. Every pirate does something different with it. Some are saving up for a little house of their own, and some drink each nest egg away the moment they step ashore. Some just like to look at it.\n\nBut the one thing that every pirate needs is a way to keep that loot safe. You could bury it, but we've seen how that story ends far too many times. No, what a pirate needs is a way to stash that hard-stolen plunder somewhere safer than the bottom of the Ruined Sea, and also easier to get to. \n\nIt might make sense to build ourselves a little fort where we store our gold. We'll ask the lads to chip in for a big stone castle, and we'll put big spiky sticks on the places ashore where some people like us might land to try and steal it. \n\nIt might be fun, trying to protect something for a change! And once we have, new crewmates will flock to us like flies."

 RSP_learning_the_ropes_title:0 "Learning the Ropes"
 RSP_learning_the_ropes_desc:0 "Every pirate knows something about knots. We teach them to the cabin boys as soon as they can swab the deck without dropping the mop. We can tie them blindfolded. We can tie them single-handed, as many a hook-hand pirate can prove.\n\nAnd the reason for that is simple: there's an easy rhythm to knots. Rope over rope, pull and tuck, and your fingers remember what your mind no longer needs to think about. Eventually, the pattern lives in your bones. A lot of things are that way. Perhaps commerce could be too. Cargo in, cargo out. Coin changing hands. Ships arriving full and leaving fuller. Learn the pattern, keep the rhythm, and the work begins to tie itself.\n\nIf we learn the ropes, perhaps we'll be able to reap the rewards as we sit about and gamble."
 RSP_learning_the_ropes_ei:0 "\n§GEvent Insight§!\nThe hidden anchorage of [Root.Capital.GetName] has grown into a roaring pirate haven, its docks choked with prize ships and new-built taverns. Coins flow freely, and though 'officials' may prattle of 'order', this is a port where plunder speaks louder than rules."

 RSP_homemade_title:0 "Homemade"
 RSP_homemade_desc:0 "Something people don't often know about pirates is that we don't just spend all our time stealing things: we have all the talents it takes to build and maintain ships. The repairs may be a little ramshackle, but we don't have much alternative besides striding into some rich colonial town and asking them to do the repairs for us. Someone tried that once. We don't hear much from him anymore.\n\nWe also build fine ships, as long as you don't mind a carpenter going to sleep in the hull every now and then. Of course, nobody ever buys them, because who would ever buy a ship from a pirate? But that just frees us up to make some really good ships! We need a lot from a good ship that a landlubber might not think of: a place to store the rum, decks and decks of cannons, plenty of room to hold the loot, sails light enough to speed ahead in a chase, a place to store the rum, and naturally, a place to store the rum.\n\nThe scurvy shipwrights back home can make ships for us however we need, and if we need more we can always steal them."
 RSP_homemade_ei:0 "\n§GEvent Insight§!\nIn the tar-thick air of the [Root.Capital.GetName] shipyards, new warships rise, heavy with guns, and marked only with [Root.GetAdjective] own insignia. No stolen prize nor patched relic, but vessels built to carry gold, powder, and glory enough to carve new legends into the Ruined Sea.\n\n§gThis event will upgrade §YDock Buildings§! and §YShipyard Buildings§! of our §YDens of Piracy§!.§!"

 RSP_isle_of_mists_title:0 "Isle of Mists"
 RSP_isle_of_mists_desc:0 "To the far east just before you hit the high sea lies the isle of Endralliande. Mists roll across it night and day, and they fill the place with a sense of foreboding. Its shores are pocked with hidden coves so deep in fog that if we hadn't already found them, we'd never find them in a hundred years. It is a great hub of trade, and every ship bound to or from Cannor at some point finds itself passing through the land of Endralliande. It's everything a pirate could want.\n\nThe colonial overlords of the place don't see it that way. They think of the mist as something to be sailed around, or worse, dispelled. Everything that's special about the place is sucked out of it by taxes with fancy names, and the sailors of Endralliande barely have enough to eat.\n\nWhat landlubber bilge rat foolishness! We'll go to Endralliande, and we'll show the people there that there's a better way to live, on the high seas! We'll steal the taxes of Cannor right back out of their fancy ships, and we'll toss that booty around like sacks of flour in a ship's galley. The people of Endralliande are perfect pirates. They just don't know it yet."
 RSP_isle_of_mists_effect_tt:0 "One province in the §YEndralliande§! Region that meets the requirements:\n   Gain §G2§! Base Tax in §YProvince(s)§!.\n   Gain §G4§! Base Production in §YProvince(s)§!.\n   Gain §G3§! Base Manpower in §YProvince(s)§!.\n   §YProvince(s)§! gets their §YShipyard Building§! upgraded. If no building is present, add §YShipyard§!, and if §YGrand Shipyard§! is, gain §G500§! Sailors.\n   §YProvince(s)§! gets their §YDock Building§! upgraded. If no building is present, add §YDocks§!, and if §YDrydocks§! is, gain §G500§! Sailors.\n   §YProvince(s)§! gets '§YDen of Piracy§!' until the end of the game, giving the following effects:\n   Land Force Limit: §G+2.00§!\n   Naval Force Limit: §G+4.00§!\n   Hostile Fleet Attrition: §G+1.00§!\n   Naval Combat Local Bonus off owned coast: §G+1.00§!\n"

 RSP_lord_of_pirates_dominate_fleets_ctt:0 "Has used the '§YDominate the Fleets§!' to §Ydominate§! all other §YAelantiri Pirates§!."
 RSP_lord_of_pirates_largest_fleet_ctt:0 "Have a fleet equal or larger than all countries with their capital in the §YRuin Proper§! Subcontinent."
 RSP_lord_of_pirates_ei:0 "\n§GEvent Insight§!\nThe plunder grows vast, the seas crowded, and rival captains pull in a dozen directions while empires fatten on the chaos. If piracy is to rule more than scattered coves, the Driftcourt must choose a true King of the Pirates to command the fleets.\n\n§gThis event will make the requirements of the '§YBecome the King of the Pirates!§!' decision easier... or be the final moment to leave piracy behind.§!"

 RSP_piratical_diplomacy_title:0 "Piratical Diplomacy"
 RSP_piratical_diplomacy_desc:0 "We have somewhat of a reputation, but there are many good things about us pirates. We're very good at tying knots. When we sing out of tune, the rest of the crew drown us out. We bathe, sometimes even as much as once a month if we want to be all fancy about it.\n\nBut for all these things, the best thing about pirates is that we're direct. We'll always tell you what we think, and at gatherings of the pirate fleets, we don't have to act like prissy princelings going off to boarding school. It's very easy to make friends with another pirate, you see. All you need is a story to swap, or else a couple pieces of gold. Pirate chums are the best type of chums, and once you make one you've made a friend for life.\n\nAnd of course, it's also very easy to make a pirate enemy. Just stand on his table at the tavern, call him a right rotten blighter, kick over his tankard, and run off!"
 RSP_piratical_diplomacy_ctt:0 "§Y[Root.GetName]§! is the only §YPirate Republic§! in §YAelantir§!."
 RSP_piratical_diplomacy_effect_tt:0 "\nGain §G2000§! Sailors for every Rival or Enemy §YPirate Repblic§!.\n\n(Every Pirate Republic Ally):\n   Add §G10§! Trust towards §Y[Root.GetName]§!.\n   §YCountry§! owes §Y10§! more favors to §Y[Root.GetName]§!."

 RSP_strenghtening_our_grasp_title:0 "Strenghtening Our Grasp"
 RSP_strenghtening_our_grasp_desc:0 "People hear we pirates as we yo ho ho across the sea and count our money, and they assume that the life of a pirate is easy. They're wrong, of course: a pirate's life isn't all sunshine and rum.\n\nAcross the Ruined Sea, there are many of us pirates, 'tis true, but there are warships in abundance too, fielded to sea by men far away who want to pile more on top of their dragons' hoards. Whenever we see a really juicy prize or a good piece of loot, some Asraport or DTC fop with a fancy three-decker ship will emerge out of nowhere, and fire off his cannons at us until we're forced away. It's a big game of cat and mouse, really.\n\nFortunately, the cats are dumb and the mice know every nook of the house, but that doesn't mean this has to be the natural order of things. What we need is more ships and more pirates, everywhere we can get them. We'll run, hide, and build up our strength, until one day those DTC ships will see one of us in the distance, move to chase, and they won't notice the pirate fleet rising up behind them.\n\nIf we were the cats, imagine how we could fill our bellies!"
 RSP_strenghtening_our_grasp_ei:0 "\n§GEvent Insight§!\nNo longer content with gnawing at convoys, the captains set their sights on the fat hearts of empire - counting houses, docks, and gilded vaults heavy with unguarded fortune."

 RSP_cut_the_purses_title:0 "Cut the Purses"
 RSP_cut_the_purses_desc:0 "Imagine for a moment a very rich bloke who has to walk through a very bad part of town. He knows that all around him are people who could live for a month off one of the buttons on his coat. He isn't stupid. So what does he do? He arms up. He buys a bunch of muscly bodyguards, and he stacks them around him like bars of a cage.\n\nBut the bad part of town has an advantage. They know the land. They're willing to risk more. All they have to do is find one single, solitary moment to strike. So there's nothing to prevent some enterprising soul from dodging in, cutting the rich man's purse from his belt before he can blink, and making off into the night.\n\nEven if the bodyguards follow, they're going to have to fan out to find us. They're going to have to go on the waves, and the waves are ours. We can take the fight to them when we can, run away when we can't, and eventually we'll have ourselves a bounty so large we won't be able to spend it all.\n\nIt's going to be hard to take on the trading companies, aye. But we don't have to run roughshod over them. All we'd have to do is reach out, slash the ropes of that fat money bag, and watch as the coins drop into our hands. Imagine how they'd jingle!"
 RSP_cut_the_purses_effect_tt:0 "For every target of this mission (up to §Y4§!) the following effect happens:\n   Gain §G25§! Prestige.\n   Gain §G250.00§! Crowns.\n   Get §Y5 '§GSunchasers§!' Light Ships§! in §Y[Root.Capital.GetName]§!.\n"

 RSP_the_liquid_gold_title:0 "The Liquid Gold"
 RSP_the_liquid_gold_desc:0 "The Ruined Sea holds treasure in abundance, aye. We could live like kings off its wrecked ships dripping with underwater riches or its fat trade fleets bound for Cannor alone, but something would be wrong. We wouldn't feel complete.\n\nA real pirate knows that, for all the good that gold and silver do, there's a little something else that we need to sail the high seas. We need sugar in abundance, the tools to press it, and a place to distill the juice.\n\nAfter all, how are we supposed to Yo Ho Ho without a bottle of rum?"
 RSP_the_liquid_gold_ei:0 "\n§GEvent Insight§!\nWhen the rum runs dry, even the fiercest pirates forget about gold and glory, because nothing stirs sea-dogs' blood like an empty cask.\n\n§gThis event will replace §YGrain§! with §YSugar§! in our owned provinces, provided they have adequate infrastracture.§!"

 RSP_to_the_depths_title:0 "To the Depths"
 RSP_to_the_depths_desc:0 "We pirates tend to be peaceful folk when there's nothing to steal, given that there's not much sense in risking your neck otherwise. But on occasion, a disagreement with another band of pirates clouds your judgement, and you strap on your cutlass even when there's nothing to be stolen.\n\nThere are codes for these times, and you've got to be sure to follow the rules. First, you've got to parley. Sit down with the other captain on neutral ground, and attempt to hash out your differences. Be civilized-like about it, since there's no sense in spilling blood that doesn't need to be. Keep that cutlass close anyway.\n\nIf that fails, hopefully you've been preparing your crew, or at least your cannons. You aren't supposed to during parley, of course, but everyone does. Some rules are unwritten."
 RSP_to_the_depths_effect_tt:0 "\n§Y[Root.GetName]§! gains a permanent claim on all Areas containing §YAelantiri Pirates' Home Ports§!.\n\nEnable the '§YDominate the Fleets§!' decision, that allows us to reign in other §YAelantiri Pirates§!, improving the '§YDominated Fleets§!' modifier and unlocking their §YUnique Flagship Modification§!."

 RSP_pillaging_the_shores_title:0 "Pillaging the Shores"
 RSP_pillaging_the_shores_desc:0 "The sea is a wonderful place. We'd spend our whole lives out there if all the treasure wasn't on land, but as it is the rest of the world tends to build their houses on solid ground. And so, we must pose a great question to the pirate philosophers. All the booty is on land. We're on sea. How to get one to the other?\n\nThe answer which pirates have relied on since time immemorial is a good old-fashioned pillage, to haul the goods of foreign towns away to sea. There's nothing quite like a pillage, of course. Walking down the fancy streets where the rich folk live as they run away screaming, with a slice of their fresh-baked bread in your mouth and their finest silver cups in your bag- it makes you feel like you can conquer the world.\n\nAnd with the booty question resolved, we must refer again to the wisdom of the pirate philosophers. There's so much to steal, but there's so little time. All we can do is steal as much as we can!"
 RSP_pillaging_the_shores_effect_tt:0 "Enable the '§YPillage Coastal Defense§!' Peace Option, that allows §Y[Root.GetName]§! to destroy foreign §YCoastal Defense§! Buildings and gain §G20.00§! Crowns per destroyed Building.\n\nDeclaring a war against a country removes the '§YRaided Coast§!' province modifier from all its owned provinces.\n\n[Root.GetUniqueRaidingEffect]"
 rhasail_raiding:0 "§YRaiding Coasts§! will give §G0.01%§! Army Professionalism per province raided."
 lamentaire_raiding:0 "§YRaiding Coasts§! will give §G0.5§! Church Power per province raided." 
 trollshaunt_raiding:0 "§YRaiding Coasts§! will give §T0.5§! Mana per province raided."
 palegold_raiding:0 "§YRaiding Coasts§! will give §G0.01§! Innovativeness per province raided."

 RSP_living_legends_title:0 "Living Legends"
 RSP_living_legends_desc:0 "Every pirate captain knows that a good story is worth all the gold you got while living it. On sun-bleached days and drunken nights, the scallywags and swashbucklers of the Ruined Sea will assemble in a hundred different places to swap some of their greatest feats. Tales of bravery and the open sea! Tales of battles well-won, and scrapes barely escaped! Tales of gold most of all. When we tell a story, we embellish as much as we please: sometimes you have to make a few things up to get to the truth of the matter.\n\nThese tales are what carry sway among us pirates. We don't care who you're from, or who you know. We care what you've done, and what you're going to do. On occasion a pirate will amass so many tales to swap that he becomes a tale in and of himself. The sea has legends aplenty, but everyone on the Ruined Sea hankers to make a few of their own.\n\nGold is a wonderful thing, but all the gold in the world would be that much sweeter with immortality on the side."
 RSP_living_legends_buried_treasures_ctt:0 "Has found at least §Y4§! Buried Treasures."
 RSP_living_legends_effect_tt:0 "§Y[Root.Monarch.GetName]§! will gain the status of §YLegendary Pirate§! or if [Root.Monarch.GetSheHe] already is one, gain §G100§! of each Monarch Power.\n\nWinning wars against §YGreat Powers§!, while all eligible provinces on their capital's continent have the '§YRaided Coast§!' province modifier now has a §G25%§! chance to grant our §Y[Root.Monarch.GetTitle]§! the status of §YLegendary Pirate§!."

 #RHASAIL
 RSP_rhasail_letters_of_marque_title:0 "Letters of Marque"
 RSP_rhasail_letters_of_marque_desc:0 "How fortunate, that circumstances have aligned in our favour! The Ruined Sea can be such a perilous place, and a number of the powers of Cannor have decided that its natural desirability is undermined somewhat by its multitude of criminal elements. The men of Rhasail have experience in dealing with such riff-raff, and we have promised at several splendidly adorned soirees to several very important people that if we were to be given the resources to deal with the problem, the benefit would well outweigh the cost.\n\nAs such, we have been granted a special license! We are to hunt enemies of the colonial powers, and we will receive only the most courteous treatment from their officials while we dock in their ports. How fortunate that the governors of these civilized and esteemed lands have seen fit to align themselves with us.\n\nCertaintly, the money we paid them did not hurt."
 RSP_rhasail_letters_of_marque_ctt:0 "At least §Y2§! countries with their capital on the §YCannor§! continent:\n   Has opinion modifier §YSent Gift§! of at least §Y10§!.\n   Has opinion modifier §YImproved Relations§! of at least §Y50§!.\n   Rival:\n      Has any province in §YAelantir§!."
 RSP_rhasail_letters_of_marque_tt:0 "As long as '§YGentlemanly Conduct§!' country modifier is active, finding a §YBuried Treasure§! will improve opinion of a §Yrandom Cannorian colonizer§! by §G50§!.\n\nEnable the §YNobility§! Estate and rename it to §YMarquers§!."

 RSP_rhasail_charming_rogues_title:0 "Charming Rogues"
 RSP_rhasail_charming_rogues_desc:0 "It is rather easy to prove oneself in the arena of wit and charm. It is a skill that may be cultivated like any other, and one a gentleman must never be without if he hopes to woo a gracious lady.\n\nOne must know how to dance a good minuet, of course. The jollier dances may be fine for the riff-raff, but the higher folk must never be seen to stoop to such base amusements. Remember: knees locked, eyes forward, and for all that is good in the world remember to keep time with the music. If you're having fun, you're doing it wrong.\n\nAs you dance, you may receive the opportunity to talk with your partner in a quiet and genteel manner. What she says is not of importance. Just smile, nod, and laugh- if you have polished your conversational skills enough, your replies to anything she says should be automatic. The most important thing is the smile. Smile wide.\n\nAt this point, you may- and understand this is not to be taken lightly- break social convention. You are a buccaneer! You are dashing, handsome, and witty! The young lady you dance with is itching to leave, and is only restraining herself for the sake of her social status. You may leave with her now. \n\nIn fact, you may leave with as many ladies as you like. Put all of Cannor on your dance card, young man!"

 RSP_rhasail_yours_truly_title:0 "Yours Truly"
 RSP_rhasail_yours_truly_desc:0 "My dearest, most esteemed, and most highly respected Governor:\n\nI have received word from a ship in my fleet which was never much liked by the rest of us anyway that diplomatic protocol has been breached. Apparently, the captain of that ship disobeyed my direct orders, and lucratively plundered a settlement which was under the control of the crown of your nation. I hope those crown jewels which had been put on display in the settlement were not of much value. We certainly did not know they were present. Rest assured, the parties responsible have been punished harshly, although we did have to examine our code of conduct to determine the appropriate action. Such infractions are, of course, very rare within our fleet.\n\nEven so, we are so very, very sorry. These words do not do our anguish justice, and understand that we will do anything possible to repair our diplomatic ties and make things right. Understand that one day I hope to reunite with you as the fondest of friends, when we may laugh together about any of the wrongs that one of us may or may not have done the other.\n\nUnderstand that the money has already been spent, so restitution regrettably will not be available to you at this time."

 RSP_rhasail_honour_among_thieves_title:0 "Honour Among Thieves"
 RSP_rhasail_honour_among_thieves_desc:0 "The Ruined Sea contains scoundrels in abundance. Pirates who care nothing for the niceties of civil society! Religious zealots! Gnolls who sell, shall we say, illicit substances. It truly weighs heavy on the soul.\n\nIn our wondrous Prize Court, Rhasail shows such scallawags what honour means. Every captain comes before it with the utmost confidence that he will be treated as fairly as he allows, and accepts its ruling without complaint. It is adorned with the finest architectural flourishes of the day. Its builders went to very good schools. Within its walls, enemies may act as friends, secure in the confidence that a higher law protects them both.\n\nHonour means treating one's fellow buccaneer by the rules of the Prize Court, and conducting oneself there with only the highest degree of propriety. Honour means treating one's crew by the terms set out in their contracts in front of the Prize Court, and paying them every coin they are owed in the timeliest manner. Honour admits no loopholes, no embellishments, no private interpretations. It is the utter moral rectitude expected of our fair brotherhood.\n\nVery often, honour means being good friends with the judge."
 RSP_rhasail_honour_among_thieves_ei:0 "\n§GEvent Insight§!\n"

 RSP_rhasail_lord_of_pirates_title:0 "Lord of Pirates"
 RSP_rhasail_lord_of_pirates_desc:0 "Pirates are pirates for a reason: we're uncouth, and we don't take kindly to authority. But not all authority is the same. There's the authority of a noble lord, surveying everything he sees with a haughty stare, and then there's the authority of an old friend, or a mentor.\n\nSometimes, when the moon hangs just right over the Driftcourt, and when there's an opportunity for gold, glory, or both, we pirates will elect someone to help us get there: a lord of the pirates. It can't be just anyone, of course. It has to be someone powerful, rich, and canny enough to get a hundred different crews rowing in the same direction.\n\nBut more importantly, it has to be one of us. It's got to be an old salt who's seen every last part of the Ruined Sea, and who's hated by the fancy merchant lords and the stuck-up colonial governors. It's got to be someone who'd spit in the face of the wind. When life gives them lemons, they kick life in the lower cargo.\n\nA lord of pirates doesn't come around by happenstance, and we don't see their kind often. But when we do, greatness is soon to come. Their reign might bring the wealth of continents, it might end with every single member of the crew on the gallows, but whatever it is it won't be boring."

 #LAMENTAIRE
 RSP_lamentaire_establish_the_stormmaidens_title:0 "Establish the Storm-Maidens"
 RSP_lamentaire_establish_the_stormmaidens_desc:0 ""
 RSP_lamentaire_establish_the_stormmaidens_tt:0 "As long as '§YDevout of Uelos§!' country modifier is active, finding a §YBuried Treasure§! will convert random coastal province religion to §YCult of Uelos§!.\n\nRename the §YClergy§! Estate to §YStorm-Maidens§!."

 RSP_lamentaire_praise_be_to_uelos_title:0 "Praise Be to Uelos"
 RSP_lamentaire_praise_be_to_uelos_desc:0 ""
 RSP_lamentaire_praise_be_to_uelos_ctt:0 "Has used at least §Y2 Religious Actions§! of the §YCult of Uelos§! Religion."

 RSP_lamentaire_worthy_servants_title:0 "Worthy Servants"
 RSP_lamentaire_worthy_servants_desc:0 ""
 RSP_lamentaire_worthy_servants_tt:0 "Whenever §Y[Root.GetName]§! uses a §YReligious Action§! of the §YCult of Uelos§! Religion, a §YKraken Sea Beast§! will appear in the §Y[Root.Capital.GetName]§!, up to §Y10§! per §YGovernment Rank§! of §Y[Root.GetName]§!.\n\nUpgrade the '§YVolaces, the Lightning Sailfish, Momentum of Uelos§!' Religious Action to '§YThalythes, the Shifting Nautilus, Metamorphosis of Uelos§!' Religious Action, which will grant additional §G+1.00§! Shock Pips and §G+1.00§! Fire Pips to the created Admiral."

 RSP_lamentaire_recover_the_sunken_temple_title:0 "Recover the Sunken Temple"
 RSP_lamentaire_recover_the_sunken_temple_desc:0 "Of all the commandments of the sea that all the captains of Lamentaire follow as scripture, the most important is this: what is given to Uelos shall remain with Uelos forever. Of course, this might make our current course of action seem as folly.\n\nThe sea has its hidden places. Hollows no chart has ever marked. Depths that swallow light and sound alike. Among them stands a temple beneath the waves- stone older than our grandfathers' grandfathers, with pillars crusted in salt and bone. No minstrel sings of it. No dockside fool scrawls it into a cheap ballad. It is not for landsmen's tongues.\n\nUelos has given this place to his faithful, and yet we do not wish to be ungrateful servants. We will not take it from Uelos: we will offer him a trade.\n\nWe are pockmarked, salt-cracked, and rum-soaked. We are the rejects and cast-offs of every shore. And yet we are his, from our sun-bleached hair to our sodden boots. Let us hope this is enough."

 RSP_lamentaire_lord_of_pirates_title:0 "Lord of Pirates"
 RSP_lamentaire_lord_of_pirates_desc:0 "Pirates are pirates for a reason: we're uncouth, and we don't take kindly to authority. But not all authority is the same. There's the authority of a noble lord, surveying everything he sees with a haughty stare, and then there's the authority of an old friend, or a mentor.\n\nSometimes, when the moon hangs just right over the Driftcourt, and when there's an opportunity for gold, glory, or both, we pirates will elect someone to help us get there: a lord of the pirates. It can't be just anyone, of course. It has to be someone powerful, rich, and canny enough to get a hundred different crews rowing in the same direction.\n\nBut more importantly, it has to be one of us. It's got to be an old salt who's seen every last part of the Ruined Sea, and who's hated by the fancy merchant lords and the stuck-up colonial governors. It's got to be someone who'd spit in the face of the wind. When life gives them lemons, they kick life in the lower cargo.\n\nA lord of pirates doesn't come around by happenstance, and we don't see their kind often. But when we do, greatness is soon to come. Their reign might bring the wealth of continents, it might end with every single member of the crew on the gallows, but whatever it is it won't be boring."

 #TROLLSHAUNT
 RSP_trollshaunt_dreaded_mists_title:0 "Dreaded Mists"
 RSP_trollshaunt_dreaded_mists_desc:0 "We have arrived at last at the Ruined Sea, and our great sea-sailing longships have docked at a place we might be able to call home. There is only one problem: it is strange here. The trees are filled with birdsong, and the skies are an insufferable shade of blue. Our men long for Gerudia. The land was a frozen waste, aye, but it was our frozen waste, and we loved it.\n\nAnd yet, there might still be a way to bring something of our heritage to the land we now call home. In the land of Endralliande they say that a peculiar type of fog rolls across the water to choke the land. It makes the sky a miserable grey, and it fills the people there with fear. They cannot escape their fear through sleep, for they do not dream.\n\nIt sounds just like home! We should send our mages to learn of this fog, so that they can bring it to Trollshaunt. And once we have made something of this land, there are other avenues of improvement we might pursue. All within the Ruined Sea will learn the name of Trollshaunt, and they will grow to fear us."
 RSP_trollshaunt_dreaded_mists_tt:0 "As long as '§YStudying Eldritch Mists§!' country modifier is active, finding a §YBuried Treasure§! will give §G50§! Magic Experience.\n\nRename the §YArcane Tricksters§! Estate to §YHexxers§!."

 RSP_trollshaunt_focus_the_magic_title:0 "Focus the Magic"
 RSP_trollshaunt_focus_the_magic_desc:0 "Before we came to the Ruined Sea, we learned something of magic in Gerudia. The skalds ruled over the magic of our land, and they organized their magic into cloistered towers.\n\nFrom their towers came mages and spells, but the main product of those lands was not power, it was rules. There were so, so many rules. Rules about what you could do and how to do it, rules about what you could not do and the consequences for doing it anyway, rules about the wonders you could build from the magic that was supposed to be yours.\n\nThese are weak rules for weak men. The skalds sing of winters of tougher times as they sit in their warm towers with plenty to eat. They have let their abundance make them soft. They have forgotten the harder stuff of magic, and the joys of domination.\n\nNow that we have come from the frozen north to the Ruined Sea, we will not make the same mistakes. We have the power, we have the will. All we need is the materials. We will steal what we need, and then we will build whatever we please, far away from anyone who would tell us differently.\n\nIn Trollshaunt, there will be no rules."

 RSP_trollshaunt_the_army_of_the_wretched_title:0 "The Army of the Wretched"
 RSP_trollshaunt_the_army_of_the_wretched_desc:0 "At last, our army is assembled! Its soldiers are not made of the strongest stuff, but they do not need to be when they are so many.\n\nThey come from all walks of life- they are settlers, soldiers, and merchants. They emerge from our Beacon in shambling rows, with jerky steps in unbroken lines. The skin on their faces has congealed into oozing, awful sores.\n\nBest of all, they will go wherever we want, and throw themselves into enemy formations with reckless abandon. We do not have to pay them, we do not have to reward them: the only reward they desire is a second death. In whatever remains of their feeble brains, we have told them that if they perform well enough in enough battles, the pain will stop, and they will be provided final rest.\n\nWe were lying.\n\nAnd once they emerge from our dread mists to take the enemy by surprise, we will make more soldiers from the men they kill. Conquest will fuel conquest, plunder will bring plunder, and pain will bring pain, all across the Ruined Sea. The mists of Trollshaunt will spread themselves, and we will stand above them as unchallenged lords."
 RSP_trollshaunt_the_army_of_the_wretched_ctt:0 "At least §Y30 000§! units have perished in our battles, since '§YThe Beacon§!' event has happened. (Currently: [Root.total_land_units_killed.GetValue])"
 RSP_trollshaunt_the_army_of_the_wretched_effect_tt:0 "'§YInvisibility§!' will have its duration shortened to §Y5 years§!, but will also give '§YKraken's Kiss Prepared§!' for §Y5 years§!, giving the following effects:\nNaval Barrage Cost: §G-50.0%§!\n\nUsing §YNaval Barrage§! while '§YKraken's Kiss Prepared§!' is active will consume it to give the '§YDreaded Mist§!' to the besieged province for §Y3 years§!, giving the following effects:\nLocal Attacker Dice Roll Bonus: §G+2.00§!\nLocal Fort Assault Ability: §G+50.0%§!\n\nSieging a province with '§YDreaded Mist§!' will consume it to spread '§YLesser Dreaded Mist§!' to all neighbouring provinces for §Y2 years§!, giving the following effects:\nLocal Attacker Dice Roll Bonus: §G+1.00§!"

 RSP_trollshaunt_the_beacon_title:0 "The Beacon"
 RSP_trollshaunt_the_beacon_desc:0 "Of all the tales the skalds sing, there is one in particular that is pleasing to the ear. It comes in many forms. It sings of a land in the middle of the sea, where the sorrows and hardships of the sea bleed away. Its residents live illuminated lives- they are blessed. They want for nothing. The best part is, if you are willing to sail bravely to distant lands, you might live there too. It welcomes all comers.\n\nThere is no such place, of course. Not everything the skalds sing is true. But belief in the blessed land is real, and sailors cling to it in times of desperation.\n\nThey might cling closer to it when the sky turns grey- when the mists close in around them and the hope in the air begins to bleed away. When the world seems like it will never be happy again. Wouldn’t anyone?\n\nWe should give them a place to go, to rest their weary heads. We will give them a light in the ocean, a beacon for lost souls. When they arrive, they may discover our light in the darkness is not like their stories. That it casts a sickly glow, and that there is a screaming in the air they could not hear before. By then it will be too late."

 RSP_trollshaunt_lord_of_pirates_title:0 "Lord of Pirates"
 RSP_trollshaunt_lord_of_pirates_desc:0 "Pirates are pirates for a reason: we're uncouth, and we don't take kindly to authority. But not all authority is the same. There's the authority of a noble lord, surveying everything he sees with a haughty stare, and then there's the authority of an old friend, or a mentor.\n\nSometimes, when the moon hangs just right over the Driftcourt, and when there's an opportunity for gold, glory, or both, we pirates will elect someone to help us get there: a lord of the pirates. It can't be just anyone, of course. It has to be someone powerful, rich, and canny enough to get a hundred different crews rowing in the same direction.\n\nBut more importantly, it has to be one of us. It's got to be an old salt who's seen every last part of the Ruined Sea, and who's hated by the fancy merchant lords and the stuck-up colonial governors. It's got to be someone who'd spit in the face of the wind. When life gives them lemons, they kick life in the lower cargo.\n\nA lord of pirates doesn't come around by happenstance, and we don't see their kind often. But when we do, greatness is soon to come. Their reign might bring the wealth of continents, it might end with every single member of the crew on the gallows, but whatever it is it won't be boring."

