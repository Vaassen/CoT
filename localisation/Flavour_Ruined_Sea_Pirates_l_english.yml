 flavour_RSP.5.t:0 "Tavern Brawl"
 flavour_RSP.5.d:0 "It was a night like any other. The Sodden Salt, the sixth or seventh finest tavern in [Root.Capital.GetName], was filled with clients. Everywhere, the Salt was a swarm of activity.\n\nCustomers were packed cheek to jowl. A mob had formed around a man in one of the booths of the tavern, where a pirate captain returned from Alecand was holding court on what he saw. Of course, he was so drunk that most of what he said was misremembered, and the rest was lies. Along the far wall, a group of pirates competed at knife throwing, where their knives clattered against the handles of knives already stuck. The seats around them were mostly empty.\n\nAt the centre of the Salt stood its pride and fame: the rum cask. Oh, the rum! It was made of the sixth or seventh finest type of sugarcane in the Ruined Sea. The Salt prided its rum on being almost drinkable. It was surrounded by a mob of pirates, all clamouring for their next mug of rum.\n\nBut then, the unthinkable happened. A pirate shoved his way to the space in front of the rum tank, opened its flow of rum, and nothing came out.\n\nA curious hush spread out from the rum tank. Activity stopped. It grew quieter, and quieter, until the pirate stood up on a table. The whole tavern was silent, their eyes fixed on him. He was wearing a red doo-rag. He posed a question to the air. A forbidden and terrible question.\n\n'Why's the rum gone?' - The Sodden Salt heard these words, and reacted with grace. A few fights broke out on the spot. The rest of the pirates began to break out into a chant.\n\n'Why's the rum gone? Why's the RUM GONE?!'\n\nIf the atmosphere in the tavern was strange before, it was getting otherworldly now. The tavern filled further with an unthinking kind of rage- the rage that drives men to do desperate things. A conspicuously empty tankard hit a bartender in the face.\n\nBut then, deliverance! From the back of the tavern came a new cask of rum, even larger and more drinkable than the last. It was placed in the centre of the tavern. The pirate poked at it. Cautiously, fearfully, he turned on the spigot. Rum came out.\n\nThe cheers could be heard from the next island over."
 flavour_RSP.5.a:0 "Easy lads and lasses, we've got plenty enough!"
 flavour_RSP_5_a:0 "\nAll owned §YGrain§! provinces with at least §Y6§! Base Production and a §YProduction Building§! will change trade goods to §YSugar§!.\n\nDistribute §G5§! £dip£ development among owned §YSugar§! provinces.\n\nOne §YSugar§! province with the most development:\n   Add §YProduction Manufactory§! to §YProvince(s)§!."

 flavour_RSP.6.t:0 "Coronation"
 flavour_RSP.6.d:0 "On the Isle of Melted Detritus, every scallawag, cutthroat, and brigand of the Driftcourt assembled. Its courtiers streamed in as stowaways on other ships, and its nobility arrived on stolen and creaking galleons. The Driftcourt did not have cause to assemble often, but the issue which it faced today required a great ruling that would be heard across all of Aelantir. The procession continued to the outcropping of rocks where the great decisions were made. The ship bells heralded its arrival. Around the stones, the captains of standing assembled. They cut different statures and conducted themselves in very different ways, but here they were united. \n\nThe First Mate of the court began to speak. 'Listen up, you salt-marked lot! We of the Driftcourt have got a problem. Money is flowing through our fingers!' The courtiers jeered. 'We stand apart now. Every one of us is looting for all we can, but the colonists flow through our cracks. Cannor is growing richer, off our land!' The First Mate paused. 'There's only one thing we can do, if we want to get richer. This pirate court must become a pirate crew. We need a King of the Pirates!'\n\n[Root.GetCoronation]"
 flavour_RSP.6.a:0 "[Root.GetQueenOfPiratesKingofPirates]- I like it!"
 flavour_RSP.6.b:0 "Raiding will lead to nothing! It's time to remove the Black Flag."
 RSP_queen_of_the_pirates:0 "Queen of the Pirates"
 RSP_king_of_the_pirates:0 "King of the Pirates"
 rhasail_coronation:0 "There was only ever one choice for the position: the captain of Rhasail. [Root.Monarch.GetSheHe] strode into the centre of the circle, flanked by [Root.Monarch.GetHerHis] trusted lieutenants, and surveyed [Root.Monarch.GetHerHis] new subjects. 'Good fellows,' [Root.Monarch.GetSheHe] began, 'I am humbled by your consideration for this great responsibility.' [Root.Monarch.GetHerHis] gaze swept over the captains, and one by one, they stood a little taller. 'But do not mistake this for the moment I assume power. Think of it as the moment we all become kings, forged not by blood, but by the fire of our battles and the shores we've claimed since the first pirate set foot in Aelantir.' The crew of Rhasail unfurled their banners, the brilliant red of Rhasail rippling in the air. 'A new age of glory is upon us, and I shall lead you to it!'"
 lamentaire_coronation:0 "There was only ever one choice for the position: the captain of Lamentaire. [Root.Monarch.GetSheHe] appeared in the centre of the circle as though [Root.Monarch.GetSheHe] had always been there, [Root.Monarch.GetHerHis] presence timeless. [Root.Monarch.GetHerHis] voice echoed across the water, reaching every ear in the Driftcourt with unsettling clarity. 'I am no ruler,' [Root.Monarch.GetSheHe] said, 'but a puppet. Your true king is Uelos, and always has been. Only now do you see it.' The Driftcourt's wood creaked and split, veins of white bone creeping across its surface. The stones themselves twisted into great arches, and impossibly many fish flung themselves from the sea, piling up in the circle. The captain climbed to the top of the writhing mass, the moonlight casting a cold glow upon [Root.Monarch.GetHerHim]. 'We are all servants,' [Root.Monarch.GetSheHe] continued, 'all puppets. But we serve Uelos the Drowned King, and a good king rewards his own.'"
 trollshaunt_coronation:0 "There was only ever one choice for the position: the captain of Trollshaunt. [Root.Monarch.GetSheHe] entered the centre of the stone circle with mist on [Root.Monarch.GetHerHis] heels. 'As pirates,' [Root.Monarch.GetSheHe] said, 'we do not wait for opportunity to find us. We go wherever we need to, and steal from whoever is present. We do as we please. The life of a pirate is one ruled by strength, and we live by this creed until we die.' A scratching came from beneath [Root.Monarch.GetHerHis] feet. The pirate captains of the past emerged from the ground of the circle, stripped to bone. 'But now, I offer you all a great gift: the chance to live on beyond death. Through your strength and ours, we will return the pirates of the past to the earth. And when the time comes for each of us to die, it will not be a final death. It will be a beginning.' The mist swirled higher, grasping with greedy tendrils."
 palegold_coronation:0 "There was only ever one choice for the position: the captain of Port Palegold. But where was [Root.Monarch.GetSheHe]? Murmurs rippled through the crowd. Then, with a flash, the captain descended from the sky, swinging down on a rope from the clouds. [Root.Monarch.GetSheHe] swooped around the hull of a wrecked ship and landed in the centre of the circle with a thud. [Root.Monarch.GetSheHe] sprang to [Root.Monarch.GetHerHis] feet, grinning. 'Apologies, mates! Seems I'm still shaking the rust off.' [Root.Monarch.GetSheHe] shrugged, almost sheepishly. 'But listen up: when I'm in charge, we'll forget the old ways. Port Palegold has the best guns, the best tools, and we share them with our crew.' [Root.Monarch.GetSheHe] raised a lantern high. From the sea, a cannon's roar split the air, and a heavy metal crate crashed into the Driftcourt. 'We'll start now! Pick your weapons, you scurvy dogs! The Ruined Sea waits for no one!'"

 flavour_RSP.7.t:0 "The Colour of Glory"
 flavour_RSP.7.d:0 "My scurvy subjects, with this Driftcourt convened, I now make my first decree as [Root.GetQueenofPiratesKingofPirates]. A single fleet needs a single colour to sail under, and this is no small matter.\n\nWe must choose a colour that shall honour all the pirates before us, who never got the chance to reap the vast plunder that will come in by our fleets. But we are a band of pirates all our own, and this colour must too represent us, in all the glory we’ll swindle and swashbuckle our way to. We now choose a colour that will be feared across the Ruined Sea: that will appear over every bay, inlet, and cove. And when our colour soars on those horizons, the people there will rush to hide their valuables. Or try, anyway. We won’t give them the chance!\n\nThere are many pirates at this court tonight, aye, but ‘twas [Root.GetName] that assembled all the pirates of the Ruined Sea into a great federation. And so it falls to this court to decide: will we carry forward all those flags of the past, or bring one brilliant, blazing flag into the future?\n\nThe decision is made. I say to you now, my friends, that…"
 flavour_RSP.7.a:0 "The black flag is for all pirates, and so it will be for us!"
 flavour_RSP.7.b:0 "We will sail under the red of pirate royalty!"
 flavour_RSP_7_b:0 "\nKeep the country colour of §Y[J95.GetName]§!"
 flavour_RSP.7.c:0 "The blue of Uelos will protect our fleets!"
 flavour_RSP_7_c:0 "\nKeep the country colour of §Y[J96.GetName]§!"
 flavour_RSP.7.e:0 "We will sail under the deathly white of eerie mists!"
 flavour_RSP_7_e:0 "\nKeep the country colour of §Y[J97.GetName]§!"
 flavour_RSP.7.f:0 "Gold’s what we seek, and gold’s the only colour for us!"
 flavour_RSP_7_f:0 "\nKeep the country colour of §Y[J98.GetName]§!"

 #TREASURE HUNT SYSTEM EVENTS
 flavour_RSP.10.t:0 "Another Treasure Map!"
 flavour_RSP.10.d:0 "There's only so much plunder a ship can swallow before it starts sailing like a drunken pig. Holds fill, pockets sag and even the most ambitious pirates must admit that stealing six gilded statues and the governor's wine cellar might be “excess.”\n\nSo, after one of our raids provoked the vigorous rearranging of valuables in [treasuremapprovince.GetName], one enterprising captain did the very sensible thing of burying the overflow - chests of coin, strings of pearls, jewel-studded idols, tomes of spells and more! All tucked neatly beneath the sand, to be reclaimed once the ship rode light again.\n\nYet, the captain never returned. Storm? Mutiny? Card game gone wrong? Not that we care about it. What matters is that we have the map they have left and somewhere in [treasuremapprovince.GetName], there's a treasure that already belongs to us - it just hasn't realized it yet."
 flavour_RSP.10.a:0 "Fetch the shovels!"
 flavour_RSP_10_a:0 "Occupying §Y[treasuremapprovince.GetName]§! will §YUncover the Treasure§!!"
 flavour_RSP.11.t:0 "Uncovered Treasure!"
 flavour_RSP.11.d:0 "Thud.\n\nNo sound in the world can quite match it - a shovel striking wood beneath honest earth. For a heartbeat, the digging stops. Then the sand flies twice as fast.\n\nAnother strike. Another. Shouts of excitement coming from both the hardened sea-dogs and the cabin boys. Finally, wood splinters. A lid cracks and the groan of rusted hinges is loud on the shores. The sun shining shyly through the canopies lends its golden rays to the pirates favourite finding - gold.\n\nEnough of it for the coins to spill between fingers. Pearls tumble into the dirt, someone lifts a mysterious occult idol and declares it to be a quite perfect gift for the lassie that waits for him in the ports of [Root.Capital.GetName]. Judging by the cheers echoing across the beaches, the craw shall be insufferable about the finding for weeks. Rightfully so!"
 flavour_RSP.11.a:0 "The treasure is ours now!"
 flavour_RSP_11_a:0 "One of §Y4§! options will happen.\n§Y25.00%§! chance of:\nGain §G200.00§! Crowns per §YGovernment Rank§! of §Y[Root.GetName]§!.\n§Y40.00%§! chance of:\nGain §G150.00§! Crowns and §G25§! Prestige per §YGovernment Rank§! of §Y[Root.GetName]§!.\n§Y25.00%§! chance of:\nGain §G100.00§! Crowns and §G30§! of each Monarch Power per §YGovernment Rank§! of §Y[Root.GetName]§!.\n§Y10.00%§! chance of:\nGain §G25§! Prestige and §G30§! of each Monarch Power per §YGovernment Rank§! of §Y[Root.GetName]§!."

 #UNIQUE MISSION TREE EVENTS
 flavour_RSP.20.t:0 "The Ritual"
 flavour_RSP.20.d:0 "The Captain stood on [Root.Monarch.GetHerHis] deck in the black of night. [Root.Monarch.GetSheHeCap] knew the words, of course- all [Root.Monarch.GetSheHe] had to do was say them.\n\n'Uelos the Destroyer, Uelos the Hunger of Waves, Uelos of the Darkest Deep, we supplicants have come to exalt you. We cannot give ourselves to you, for we are already yours. We ask for your blessing, and ask for your mercy. We ask for your temple.'\n\nIt was done. The captain returned to [Root.Monarch.GetHerHis] helm, and began to trace the path [Root.Monarch.GetSheHe] was born to sail. The wind whispered like teeth on bone, but it carried another sound: the storm maidens had picked up [Root.Monarch.GetHerHis] chant. They echoed in rounds, and made the Captain's prayer into a song older than the waves. Their breath smelled of seaweed.\n\nThe path turned in on itself in an impossible geometry. The helm alone could not trace it, but the helm was guided by something that lived deeper than the ship that night.\n\nThe singing echoed in rounds.\n\nThe air began to fill with fog as the sea began to leave. The Captain did not know to where it left, and yet it did, and in its place rose pillars hewn from salt-encrusted coral and black stone, spiraling and impossible, bending the eye, writhing like they were breathing. The lanternlight did not fall upon them; it recoiled. The surface of the waves rippled with unnatural reflections.\n\nThe temple yet rose, and the Captain docked at a stair that was never meant to stand above the waves. The earth was shaking, but the Captain had found [Root.Monarch.GetHerHis] purpose and not even the world's end would deter [Root.Monarch.GetHerHim] from it. [Root.Monarch.GetSheHeCap] began to climb, and the air grew wetter as [Root.Monarch.GetSheHe] withdrew further from the waves.\n\nThe song of the storm maidens followed [Root.Monarch.GetHerHim]. It was deafening.\n\nThe Captain could hear nothing but song and [Root.Monarch.GetSheHe] could see nothing but fog, and yet [Root.Monarch.GetSheHe] stepped forward in utter faith. At the top of the temple, a statue loomed. Its gaze was eternal and maddening. It saw all of the captain. If it was capable of joy, it would have appeared pleased.\n\nThe Captain did not recoil. Here was Uelos."
 flavour_RSP.20.a:0 "Here was the end of our path."

 flavour_RSP.23.t:0 "The Hammer Falls!"
 flavour_RSP.23.d:0 "The gentlemen stood by the dock in clothing that was as fashionable as it was expensive. The outfits had been purchased special for this day, of course- last year's garments may be suitable for navigating, swashbuckling, or dining with provincials, but only the most urbane and eloquent captains walked away from the Prize Court with their fair share in gold.\n\nOne of them was adorned in a half mask, and he was known through the Ruined Sea for his habit of sampling the finest spices from the richly equipped merchant caravans he raided for his own table. He was Elvorno the Black.\n\nThe other wore a cloak that reached from his shoulders to his ankles, and he could shoot the spotter out of a crow's nest at 200 paces. His pistols were made of the most sumptuous rosewood money could buy. He treated them like his own children. He was Davi the White.\n\nFour captured ships stood behind them.\n\nTheir cargo was mostly sugarcane and copper, but the sugar of the first ship was of a rare varietal that would flourish in the plantations of Endralliande. They would pay extravagantly for the seedlings. Only Davi knew of this.\n\nThe fourth ship contained a false bottom, and within that bottom were held several precursor relics of great value to the Gommo. Only Elvorno knew of this.\n\nThe judge emerged in a robe redder than Sorncosti wine. ‘Let these proceedings now commence!' He performed a peculiar bow. ‘These two captains, Elvorno and Davi, in good standing in the eyes of the Prize Court, now come before it to divide their spoils and reward their crew.'\n\nThe judge cleared his throat. ‘The Prize Court, having reviewed the claims of Captains Elvorno and Davi, finds no deficiency in conduct, no imbalance in valour, and no procedural fault in seizure. By Case 1312, such ships shall be awarded by ceremonial standing. Captain Elvorno takes the first and second vessels. Captain Davi, the third and fourth.'\n\nThe judge raised his hands.\n\n‘It is finished. The wine gardens await you, gentlemen.'\n\nThe implications of the ruling crashed over the captains at once. Both captains began furiously racking their brains for a justification to challenge the ruling of the Prize Court. Neither could find one."
 flavour_RSP.23.a:0 "Both captains paled."

 #MODIFIERS
 RSP_scrapping_the_flotsam:0 "Scrapping the Flotsam"
 RSP_scrapping_the_flotsam_desc:0 "Waste not, want not is the pirate's way, and we've started applying this to the hulking shipwrecks that litter the Ruined Sea. The ships we build from the flotsam might be leaky from the start, but that's just part of their charm."
 RSP_grabbing_last_scraps:0 "Grabbing Last Scraps"
 RSP_grabbing_last_scraps_desc:0 "There are very many reputable, safe organizations that seek to recolonize Aelantir. We are not one of them, so our colonists tend to be the ones no one else wanted. They're poor, they're downtrodden, they're sodden scurvy dogs. Fortunately, so are we."
 RSP_lust_for_gold:0 "Lust for Gold"
 RSP_lust_for_gold_desc:0 "A pirate doesn't want gold. To want something is to imply you can go without it. Every second a pirate doesn't have his gold, he feels a hollow sensation in his chest cavity. His fingers begin to tingle. The only cure is gold, or silver if he isn't too picky."
 RSP_corsair_warfare:0 "Corsair Warfare"
 RSP_corsair_warfare_desc:0 "Some nations may fight with honour, but we aren't one of them. We'll hit and run, we'll fly under false flags, we'll scratch and claw and fight for our plunder. We'll hit our targets hard and fast, like a proper pirate does."
 RSP_pirates_favourite:0 "Pirates' Favourite"
 RSP_pirates_favourite_desc:0 "A pirate is thirsty a very large amount of the time. He can hardly drink the water that's crawling with worms, and saltwater just makes him thirstier. No, the pirate needs something that settles in his chest, that makes him want to burst out singing when the shanties strike up, that makes him feel like the king of the seas! In other words - a pirate needs rum!"
 RSP_all_the_loot:0 "All of the Loot"
 RSP_all_the_loot_desc:0 "'Gentlemen, our goal is not to plunder some of the loot. It is not to raid a port, and come back with a couple treasures. We are not trying to preserve hold space on the ship. Our goal is to plunder all of the loot. All of the loot. Do you understand?'"
 RSP_den_of_piracy_capital:0 "Den of Piracy"
 RSP_den_of_piracy_capital_desc:0 "In other ports, piracy is a blight on industry, and the merchant captains in power clamour to have the pirates rooted out. Here, piracy is the industry, and the merchant captains in power are also pirates. Should anyone be foolish enough to attempt to root these pirates out, they'd run up against walls higher than a ship from crow's nest to keel."
 RSP_den_of_piracy:0 "Den of Piracy"
 RSP_den_of_piracy_desc:0 "In other ports, piracy is a blight on industry, and the merchant captains in power clamour to have the pirates rooted out. Here, piracy is the industry, and the merchant captains in power are also pirates. Should anyone be foolish enough to attempt to root these pirates out, they'd run up against walls higher than a ship from crow's nest to keel."
 RSP_x_marks_the_spot:0 "X Marks the Spot!" 
 RSP_x_marks_the_spot_desc:0 "Treasure's here, ye seadogs! Why are you still reading the map? Come and dig it up!\n§g§YRuined Sea Pirates§! can occupy §Y[This.GetName]§! to uncover a §YBuried Treasure§!.§!"
 RSP_bustling_port:0 "Bustling Port"
 RSP_bustling_port_desc:0 "The port in [This.GetName] is so thronged with people that you can barely see the wooden planks of the docks. Anything can be bought or sold here. It's a perfect place for a grand voyage to begin."
 RSP_dominated_fleets_4:0 "Dominated Fleets"
 RSP_dominated_fleets_4_desc:0 "Our ships are fit to burst with the pirates of other fleets. We'll put their captains aboard great ships, and plunder the high seas together! Fish are happiest when they swim in schools."
 RSP_dominated_fleets_3:0 "Dominated Fleets"
 RSP_dominated_fleets_3_desc:0 "Our ships are fit to burst with the pirates of other fleets. We'll put their captains aboard great ships, and plunder the high seas together! Fish are happiest when they swim in schools."
