 RSP_potential_pirate_home_port_rhasail:0 "Potential Pirate Home Port"
 RSP_potential_pirate_home_port_rhasail_desc:0 "This island has shipbuilding timber in plenty, defensible bays that might be ringed with cannons, and hidden coves in which to do illicit deals. In short, it is the perfect place for a band of pirates.\n§gThe Pirate Republic of §Y[J95.GetName]§! can seize this province, if the following requirements are met:\n[This.GetPirateReq1] At least §Y63§! provinces in the §YEndralliande§!, §YRuined Isles§!, §YNorth Ruined Isles§! and §YRavenous Isle§! Regions are cities.\n[1100.GetPirateReq2] §YLocal Privateers§! have at least §Y5%§! of the trade power in the §Y[1100.GetTradeNodeName]§! Trade Node.§!"
 RSP_potential_pirate_home_port_lamentaire:0 "Potential Pirate Home Port"
 RSP_potential_pirate_home_port_lamentaire_desc:0 "This island has shipbuilding timber in plenty, defensible bays that might be ringed with cannons, and hidden coves in which to do illicit deals. In short, it is the perfect place for a band of pirates.\n§gThe Pirate Republic of §Y[J96.GetName]§! can seize this province, if the following requirements are met:\n[This.GetPirateReq1] At least §Y63§! provinces in the §YEndralliande§!, §YRuined Isles§!, §YNorth Ruined Isles§! and §YRavenous Isle§! Regions are cities.\n[1082.GetPirateReq2] §YLocal Privateers§! have at least §Y5%§! of the trade power in the §Y[1082.GetTradeNodeName]§! Trade Node.§!"
 RSP_potential_pirate_home_port_trollshaunt:0 "Potential Pirate Home Port"
 RSP_potential_pirate_home_port_trollshaunt_desc:0 "This island has shipbuilding timber in plenty, defensible bays that might be ringed with cannons, and hidden coves in which to do illicit deals. In short, it is the perfect place for a band of pirates.\n§gThe Pirate Republic of §Y[J97.GetName]§! can seize this province, if the following requirements are met:\n[This.GetPirateReq1] At least §Y63§! provinces in the §YEndralliande§!, §YRuined Isles§!, §YNorth Ruined Isles§! and §YRavenous Isle§! Regions are cities.\n[2135.GetPirateReq2] §YLocal Privateers§! have at least §Y5%§! of the trade power in the §Y[2135.GetTradeNodeName]§! Trade Node.§!"
 RSP_potential_pirate_home_port_palegold:0 "Potential Pirate Home Port"
 RSP_potential_pirate_home_port_palegold_desc:0 "This island has shipbuilding timber in plenty, defensible bays that might be ringed with cannons, and hidden coves in which to do illicit deals. In short, it is the perfect place for a band of pirates.\n§gThe Pirate Republic of §Y[J98.GetName]§! can seize this province, if the following requirements are met:\n[This.GetPirateReq1] At least §Y63§! provinces in the §YEndralliande§!, §YRuined Isles§!, §YNorth Ruined Isles§! and §YRavenous Isle§! Regions are cities.\n[1099.GetPirateReq2] §YLocal Privateers§! have at least §Y5%§! of the trade power in the §Y[1099.GetTradeNodeName]§! Trade Node.§!"

 #UNIQUE MT MODIFIERS
 RSP_rhasail_gentlemanly_conduct:0 "Gentlemanly Conduct"
 RSP_rhasail_gentlemanly_conduct_desc:0 "Is it always the case that a gentleman is honest, or fair? Goodness, no! He may be as dishonest as he pleases, but he must never be seen that way."
 RSP_rhasail_prize_court_country:0 "Prize Court"
 RSP_rhasail_prize_court_country_desc:0 "The Prize Court has brought an end to the fiendish scheming and backstabbing that happened between brother pirates in the era before. Now the stabbing happens in the front, and it is done by a judge wearing very nice robes, which instills some discipline in our buccaneers."
 RSP_rhasail_prize_court_province:0 "Prize Court"
 RSP_rhasail_prize_court_province_desc:0 "This province is the home of the Prize Court, where the noble buccaneers of Rhasáil divide their spoils. It is the finest building in the Ruined Sea. Come ready to be wined and dined, to dance in the ballrooms of the gentleman pirates, and, if you're lucky and smart, to walk away with a doubloon or two."

 RSP_lamentaire_devout_of_uelos:0 "Devout of Uelos"
 RSP_lamentaire_sunken_temple_of_uelos:0 "Sunken Temple of Uelos"

 RSP_trollshaunt_studying_eldritch_mists:0 "Studying Eldritch Mists"
 RSP_trollshaunt_krakens_kiss_prepared:0 "Kraken's Kiss Prepared"
 RSP_trollshaunt_dreaded_mist:0 "Dreaded Mist"
 RSP_trollshaunt_lesser_dreaded_mist:0 "Lesser Dreaded Mist"

 #FLAGSHIP MODIFICATIONS
 RSP_mykx_unique_flagship:0 "Demonfire Cannons"
 RSP_mykx_unique_flagship_desc:0 "The flames of the Xhazobs can be used to conquer the sea just as easily as they can conquer the land, but no one has perfected this quite like the corsairs of Mykx."
 RSP_rhasail_unique_flagship:0 "Admiral's Pavillon"
 RSP_rhasail_unique_flagship_desc:0 "The quarters of the admirals of Rhasail provide not just the best facilities, but space for entertaining and reflection. The investment is great, but it is repaid by the loyalty and competence of Rhasail's well-treated officer corps."
 RSP_lamentaire_unique_flagship:0 "Bounty of the Sea"
 RSP_lamentaire_unique_flagship_desc:0 "Imagine, there are those who find it hard to live at sea! The sea rewards devotion, and that is something which we possess in limitless supply. As we sail the seas which are our birthright as children of Uelos, our journey is hastened and we are given food in plenty."
 RSP_trollshaunt_unique_flagship:0 "Kraken's Kiss"
 RSP_trollshaunt_unique_flagship_desc:0 "The cannons of the flagship of Trollshaunt are much like their namesake: they are vast, oppressive, and often watery. They are very, very much unwelcome"
 RSP_palegold_unique_flagship:0 "Smuggler's Bay"
 RSP_palegold_unique_flagship_desc:0 "Before Port Palegold, markets were markets and ships were ships, and the two kept far apart. Now, the artificer-pirates of Port Palegold will buy your stolen treasure on the open sea, so you can get paid quicker and they can get to you before anyone else."

 #ESTATES
 RSP_swashbucklers:0 "Swashbucklers"
 RSP_relic_smugglers:0 "Relic Smugglers"
 RSP_arcane_tricksters:0 "Arcane Tricksters"
 RSP_hexxers:0 "Hexxers"
 RSP_stormmaidens:0 "Storm-maidens"
 RSP_marquers:0 "Marquers"
 estate_adventurers_RSP_swashbuckling_expertise:0 "Swashbuckling Expertise"
 estate_adventurers_RSP_swashbuckling_expertise_desc:0 "Every pirate worth their salt on the Ruined Sea can handle a sword, but our swashbucklers take their swordplay to the next level. They parry and slash with a dazzling expertise, and when it comes time to board the enemy's ship they're always first over the gunwale. The Swashbucklers of [Root.GetName] know even more of combat than most, and are always willing to volunteer their expertise."

 #ARTIFICERY INVENTION
 artifice_invention_clockwork_rope_swingers:0 "Clockwork Rope Swingers"
 artifice_invention_clockwork_rope_swingers_desc:0 "It's never easy to use a grappling hook. There are just too many opportunities for it to get caught on something, or hit your mate in the face. We've built grappling hooks that throw themselves, so we can board ships and cross rivers right the first time, every time."
 artifice_clockwork_rope_swingers:0 "Clockwork Rope Swingers"
 artifice_clockwork_rope_swingers_desc:0 "It's never easy to use a grappling hook. There are just too many opportunities for it to get caught on something, or hit your mate in the face. We've built grappling hooks that throw themselves, so we can board ships and cross rivers right the first time, every time."
 artifice_clockwork_rope_swingers_tt:0 "[Root.GetName] loses '§YClockwork Rope Swingers§!', giving the following effects:\nCombat Penalty when landing: §G-2.00§!\nDisembark Speed: §G+100.0%§!\n§YAffects only Artificer Regiments§!\n"

 #PEACE OPTION
 CB_ALLOWED_po_pillage_coastal_defense:0 "Pillage Coastal Defense"
 PEACE_po_pillage_coastal_defense:0 "Pillage Coastal Defense"
 po_pillage_coastal_defense_desc:0 "All §YCoastal Defense§! Buildings in [From.GetName] will be destroyed, with [Root.GetName] gaining §G20§! Crowns per Building destroyed."

 #DECISION
 RSP_dominate_fleets_decision_title:0 "Dominate the Fleets"
 RSP_dominate_fleets_decision_desc:0 "There's no need to fight among us pirates: a good pirate thinks only in gold, and if we have more of it than the other captains on the Ruined Sea we'll throw it at them until they beg for mercy. Then we'll take what they do best, have them do it for us, and we'll both be happy."
 RSP_dominate_fleets_decision_master_ctt:0 "One of the §YAelantiri Pirate Fleets§! was §Ydominated diplomatically§! or §Ydominated militarily§!.\n\nTo §Ydominate diplomatically§!, all of the following must be true:\n   §YCountry§! is allied with §Y[Root.GetName]§!.\n   §YCountry§! has at least §G+150§! opinion of §Y[Root.GetName]§!.\n   §YCountry§! has at least §G75§! Trust towards §Y[Root.GetName]§!.\n   §YCountry§! has less than §Y30§! Total Development.\n\nTo §Ydominate militarily§!, §Y[Root.GetName]§! must own the §YHome Port§! of the other fleet and one of the following must be true:\n   §YCountry§! was humiliated by §Y[Root.GetName]§!.\n   §YCountry§! is a subject of §Y[Root.GetName]§!.\n   §YCountry§! does NOT exist.\n\n§YAelantiri Pirates§! and their §YHome Ports§!:\n[Root.GetMIBypassYesNo] §Y[J95.GetName]§! with §YHome Port§! in §Y[1100.GetName]§!\n[Root.GetMIBypassYesNo] §Y[J96.GetName]§! with §YHome Port§! in §Y[1082.GetName]§!\n[Root.GetMIBypassYesNo] §Y[J97.GetName]§! with §YHome Port§! in §Y[2135.GetName]§!\n[Root.GetMIBypassYesNo] §Y[J98.GetName]§! with §YHome Port§! in §Y[1099.GetName]§!\n[Root.GetMIBypassYesNo] §Y[G93.GetName]§! with §YHome Port§! in §Y[1077.GetName]§!"
 RSP_upgrade_dominated_fleets_effect_tt:0 "\n[Root.GetName] upgrades '§YDominated Fleets§!' until the end of the game, giving the following effects:\nMorale of Navies: §G+2.5%§! to §G+10.0%§!\nMax number of Flagships: §G+1.00§! to §G+4.00§!\nCoastal Raiding Range: §G+1.00§! to §G+2.00§!\n"

