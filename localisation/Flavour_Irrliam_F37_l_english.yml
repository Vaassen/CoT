l_english:
 irrliam_flavour.1.t:0 "Change of Capital"
 irrliam_flavour.1.d:0 "Our great realm has made great successes recently, by both expanding our borders and incorporating our more autonomous states. We have come to possess the biggest and the richest cities of Bulwar, which we have already developed greatly, and many wonder what shall become of them now? Perhaps one of these grand cities shall become the new capital of our growing empire?"
 irrliam_flavour.1.a:0 "Bulwar was the capital of Phoenix Empire, it should rightfully be our capital too."
 irrliam_flavour.1.b:0 "Brasan is of great importance to legacies of both Jaher and Taelarios, lets move there."
 irrliam_flavour.1.c:0 "Let us honour the Irrliazuir dynasty by establishing a capital in Irrliam."
 irrliam_flavour.1.f:0 "Anzabad was the first capital of Irrliam, and we shall return there."
 irrliam_flavour.1.e:0 "Like a phoenix from its ashes, the empire shall rise again from where it died in Kalib!"

 irrliam_flavour.2.t:0 "End Of An Era"
 irrliam_flavour.2.d:0 "Taelarios wondered about his ancestors, who are said to have been immortal. He was 'only' four centuries old, one of the oldest living elves, and felt the time affecting his mind. And yet, the Precursors lived for thousands of years? How does one not get tired of this?\n\nTaelarios certainly was tired. He did not wish to have this throne, the one he relinquished to his now deceased daughter. Imariel was a wonderful child, her deep blue eyes always filled with kindness... wait, weren't her eyes green? Ah, that doesn't matter, Taelarios is too busy trying to remember such small details. There is still so much to do. Bulwar is still in peril - gnolls, harpies, heretics and other scum. And he had to protect Irrliam. What did his mother use to say? 'Always count your eggs one at a time', was it? No, not quite like that. Taelarios tries to remember her words, her voice, even her face... but almost nothing comes to mind.\n\nTaelarios quickly discarded those thoughts. They were tiresome. And he has been tired for so long now. He needed some rest, even though he did take a nap recently. Maybe another one would help? Yes, a good long nap would be great. Anything for the tiniest bit of rest...\n"
 irrliam_flavour.2.a:0 "And thus, he closed his eyes for one final time."

 irrliam_phoenix_rising_tt:0 "We are the only Sun Elven nation who owns land in Bulwar"
 irrliam_no_slaves_tt:0 "Our holy orders have ended the practice of slavery in newly conquered lands"

 irrliam_newfound_zeal:0 "Newfound Zeal"
 irrliam_convert1:0 "Northern Conversion"
 irrliam_phoenix_rising:0 "New Phoenix Rising"
 irrliam_vassal_loyalty:0 "Loyal Vassals"
 irrliam_trade:0 "Deals With Merchants"
 irrliam_convert2:0 "Cultural Dominance"
 irrliam_brasan_development:0 "Brasanni Development Scheme"
 irrliam_benevolent_liberation:0 "Benevolent Liberation"

 irrliam_first_ruler:0 "Rule of Taelarios Irrliazuir"
 desc_irrliam_first_ruler:0 "Following the assassination of Jexis and the subsequent collapse of her empire Bulwar collapsed both politically and religiously. The Jexisian Empire kept the Cult of Jaher inherited from the days of the original Phoenix Empire, but with the loss of Jaher's children the cult had its foundation cut out from under it.\n\nIt only survived due to the guidance, and reformation, of Taelarios Irrliazuir. Having allied himself with many influential nobles, clergymen and landowners elven and human alike, he united various theological doctrines which appeared after Jaher's death into one single faith that was coded and ratified with the Treaty of Brasan. In the centuries since, Taelarios remained a spiritual leader of the New Sun Cult."

 irrliam_end_of_an_era_title:0 "End of An Era"
 irrliam_end_of_an_era_desc:0 "Taelarios Irrliazuir is dead. The man who is the responsible for the rise of New Sun Cult and the founder of our nation is no more. While many are still shaken by this tragic loss,[Root.Monarch.GetName] has decreed that a time for a change has come. A time for Irrliam to take its rightful place as the leader of all Sun Elves and end the chaos which has been plaguing Bulwar for decades!"
 irrliam_control_south_coast_title:0 "Control Southern Coast"
 irrliam_control_south_coast_desc:0 "Sun Elves from Elizna have long lost the true cause, preying on instead of protecting humans and weakening Kheteratan people for gnolls to enslave. We should deal with them... but not now. Taking southern coast of Bulwar which they control and thus limiting their direct contact with other, more righteous elves would suffice."
 irrliam_control_north_coast_title:0 "Control Northern Coast"
 irrliam_control_north_coast_desc:0 "Birzartanšes has failed the Sun Elven people and the New Sun Cult faithful. They have warred against fellow Elves, allowing pesky goblins to invade and bring ruin to Bahar. They have failed to get rid of old sun cultists, allowing heretical ideas to spread in Bulwar. The people of northern Bulwar cry out for help and we shall answer this call and protect them from darkness like all Sun Elves must."
 irrliam_troubled_north_title:0 "The Troubled North"
 irrliam_troubled_north_desc:0 "The north has suffered much in recent years. The so-called goblin exodus devastated the region. With Baharkand failing to stop this invasion, some local humans have started thinking that Sun Elves are not fit to rule over them. These wrongful ideas should not be allowed to exist, the time has come for us to help these misguided people by placing them under our protection."
 irrliam_gates_of_cannor_title:0 "Gates of Cannor"
 irrliam_gates_of_cannor_desc:0 "With the conquest of Bahar complete we now control the entirety of Bulwari coast. Our merchants and traders look at the Divenhal sea, towards Cannor and the potential profit which may come from these lands. Trading with the empire would be beneficial for both of us, we should encourage our merchants to exchange goods with Anbennarians."
 irrliam_drive_back_the_gnolls_title:0 "Drive Back The Gnolls"
 irrliam_drive_back_the_gnolls_desc:0 "Gnollish slavers led by Tluukt have gathered up at the lands to the south of Irrliam. It is our duty as children of Surael to bring his holy light to these savages and free all the poor humans that have been enslaved there."
 irrliam_light_of_liberation_title:0 "Light of Liberation"
 irrliam_light_of_liberation_desc:0 "The rich central cities of Bulwar have been raided by gnolls and without proper protection for quite some time. With our success against gnollish menace in the south we should bring the light of liberation to the humans of central Bulwar too. They may not appreciate it at first, but we will surely convince them living under our protection is better."
 irrliam_ashes_of_the_phoenix_title:0 "Ashes of the Phoenix"
 irrliam_ashes_of_the_phoenix_desc:0 "Sareyand, the place where Jexis rose from is now a mere shadow of itself. This land is ruled by the weak dynasty which has failed to stop both the gnolls and the desert heretics. In honour of Jexis we should put them out of their misery and supervise Sareyand directly."
 irrliam_phoenix_rising_title:0 "Irrliamic Phoenix Rising"
 irrliam_phoenix_rising_desc:0 "Failed elven states defeated, humans brought back under control, gnolls and goblins pushed back. A new phoenix is on the rise... our phoenix. Irrliam proved to be upholding the true Sun Elven ways and established near total control over the region. With the help of our loyal subjects, zealous clergy and shrewd merchants we shall forge a new empire and make sure it is eternal."
 irrliam_vassal_loyalty_title:0 "Reestablish Vassal Loyalty"
 irrliam_vassal_loyalty_desc:0 "Lack of initiative coming from Irrliam and vast instability in the rest of Bulwar are among many causes for our vassal disloyalty. We should reinforce our position with them before it is too late."
 irrliam_land_route_title:0 "Land Route to Brasan"
 irrliam_land_route_desc:0 "Our land connection to Brasan currently passes through marsh provinces, making it significantly harder to transfer goods between us and them. The better land route would be going through the lands currently owned by Elizna. Perhaps we could 'convince' them that these provinces would be better under our control?"
 irrliam_brasan_title:0 "Bewitching Brasan"
 irrliam_brasan_desc:0 "Brasan is a city of an extreme importance to both humans and sun elves. Named after Brasan the Emancipator, a genie who has freed humans of Bulwar from the djinn. For us the city is important as the place where the treaty was signed, establishing both Irrliam as a state and the New Sun cult as a religion. As an act of good faith between our two races we should establish several development programs in the city. "
 irrliam_bulwar_title:0 "Blossom of Bulwar"
 irrliam_bulwar_desc:0 "Bulwar is definitely the most important city in this region, at least culturally. While they rejected out previous attempts at bringing them into the fold they finally understood their folly and have become our subject. Unfortunately, not all citizens of Bulwar think that. We should construct several administrative building there to better supervise our new vassal."
 irrliam_eastern_development_title:0 "Eastern Development"
 irrliam_eastern_development_desc:0 "We have reached the eastern end of Bulwar Proper and the beautiful city of Harklum. The poor state was not treated well in the past and had several cases of gnollish raids and invasions. We will develop Harklum and prove to the locals that the bad days are over now that Irrliam is here."
 irrliam_kalib_title:0 "Goods of Kalib"
 irrliam_kalib_desc:0 "Kalib is a neighbouring state of Bulwar, whom the city often considers rival. Unfortunately, Bulwar has been far more successful than Kalib in terms of population and general prosperity. Despite that, Kalib still produces several goods very important to our merchants. We will invest into these goods production and help our subject even the odds with their rival."
 irrliam_zansap_title:0 "Zealous Zanšap"
 irrliam_zansap_desc:0 "Humans of Zanšap have long been among our most favourite subjects. Loyal and extremely zealous, the Zanšapi soldiers often form the bulwark of our human armies. We should make use of this extreme zeal by providing locals more and better opportunities to fight for Irrliam. \n\n §OIrrliam's MT has been made so that it can function with Zansap, Re'uyel, Gelkalis, and Eduz-Vacyn or Avamezan as subjects permanently, and vice versa.§!"
 irrliam_drolakand_title:0 "Dockyards of Drolakand"
 irrliam_drolakand_desc:0 "Drolas peninsula has long been wasted by Elizna. They have allowed a place with great potential to lay dormant without a use. Some of our advisors have been suggesting on constructing several dockyards and naval production workshops along the tip of the peninsula to better sponsor our growing navy."
 irrliam_bahar_title:0 "Restoring Glory of Bahar"
 irrliam_bahar_desc:0 "With our control spreading to the richest cities of Bahar the time has come to finally undo the decades of devastation. It will be costly but very beneficial to our new subject as it will show Bahari humans that Irrliam is here to save them and restore Bahar's old glory."
 irrliam_kumarkand_title:0 "New Breadbasket"
 irrliam_kumarkand_desc:0 "Historically we never had a problem with food supply. Our people and our subjects have been well fed and we do not intend for any of them to hunger. But our recent expansions have started putting food supplies to the limit and we need a new place to provide food from. Our vassals from Kumarkand have suggested expanding their farm. With enough money and time spent we might turn Kumarkand into a new breadbasket of Bulwar. "
 irrliam_anzabad_title:0 "Promote Anzabadi Style"
 irrliam_anzabad_desc:0 "Anzabad is important to Irrliam for several reasons - naval routes to Brasan, trade routes across Divenhal, location near our capital and more. But the city is also important for our human subjects as the place which makes beautiful clothing. We should promote Anzabadi style across all of Bulwar. "
 irrliam_deals_with_merchants_title:0 "Deals With Merchants"
 irrliam_deals_with_merchants_desc:0 "Merchants and traders are among the most loyal and important supporters of the crown, but recently we haven't showed them much favour. Perhaps a few deals here, a couple of favours there would provide better cooperation between us and them?"
 irrliam_faith_and_coin_title:0 "Faith and Coin"
 irrliam_faith_and_coin_desc:0 "If we are to be successful in uniting Bulwar under our control we must not just have large sways of land, we must have support of the people. There are two things that helped us strengthen Irrliam's stability before - the faith and the coin. Our zeal and devotion to Surael will inspire others, while our merchants would convince that true prosperity lies with Irrliam."
 irrliam_establish_total_control_title:0 "Establish Total Control"
 irrliam_establish_total_control_desc:0 "Our efforts at spreading cultural influence across Bulwar have been successful. Irrliamic traders can be found in almost every town and our churches are full with devout subjects. With this much support across Bulwar it is much easier for us to find any misguided souls working against the crown and convince them - either by coin or with the help of an inquisitor - to join us instead."
 irrliam_capital_worth_an_empire_title:0 "Capital Worth an Empire"
 irrliam_capital_worth_an_empire_desc:0 "Despite controlling some of the richest cities in Bulwar our capital is currently lacking and is no way or shape good enough for the empire we build. Perhaps time has come to change that?"
 
 #CoT
 #Missions
 irrliam_cot_gelkari_hills_title:0 "The Gelkari Hills"
 irrliam_cot_gelkari_hills_desc:0 "The Gelkari Hills have for too long been dominated by the insidious Harpies. It's time to restore control to the proper, Surael-fearing folk."
 irrliam_cot_untroubled_north_title:0 "Untroubled North"
 irrliam_cot_untroubled_north_desc:0 "The north has been a source of headache since the time of Taelarios. It is now, finally, under control once again. We now have the regional peace needed to end the harpy menace once and for all."
 irrliam_cot_restoring_east_title:0 "Restoring the East"
 irrliam_cot_restoring_east_desc:0 "The Holy temples of the east are besieged by heretics, cultists, demon worshippers, and the corrupt. The remaining faithful there must be wrapped in the bussom of our safe embrace, before it is too late."
 irrliam_cot_phoenix_enshrined_title:0 "Phoenix Enshrined"
 irrliam_cot_phoenix_enshrined_desc:0 "As it was before, so it is again. The Phoenix spreads it's protective wings over all of Bulwar, the legacy of Jaher and Jexis secured forevermore."
 irrliam_cot_prosperous_bulwar_title:0 "Prosperous Bulwar"
 irrliam_cot_prosperous_bulwar_desc:0 "Luck has it that in our pursuit of the sanctity of our faith and kindred, many of the most lucrative cities and trade routes have fallen under our protection. If any need concrete proof that ours is the one true faith, they need only look at the prosperity we bring to our people just by our mere guiding presence."
 irrliam_cot_mil_title:0 "Irrliazuir Royal Academy"
 irrliam_cot_mil_desc:0 "Our gracious guidance has brought many talented and stalwart would-be generals and administrators to our capital. A particularly enterprising advisor has brought the suggestion of making an academy named for our founding dynasty. This will serve both to make our leaders more effective and deepen their ties to our glorious realm."
 
 #Events
 irrliam_flavour.3.t:0 "An offer from Irrliam"
 irrliam_flavour.3.d:0 "The illustrious diplomat of Taelarios's domain approached the council chamber's speaking platform and bowed, a splendid brocade of silks and jewels tumbling around her as if to announce the prosperity that comes to those who serve the Irrliazuir throne. After a precisely appropriate moment of silence, she stood and spoke: \n\n 'Re'uyel once served as a governorship of the Phoenix Empire, benefiting from the protection and authority of the highest of the Chosen of Surael. The House Irrliazuir asks if Re'uyel will once more take up governorship over Bahar, as faith and duty would compel.' \n\n §OBy accepting this offer you will become a unique, powerful vassal capable of your own wars, which cannot be annexed... but a vassal nonetheless.§!"
 irrliam_flavour.3.a:0 "Irrliam has no right to ask this of us!"
 irrliam_flavour.3.b:0 "Re'uyel shall give itself to this great task!"
 
 irrliam_flavour.4.t:0 "Re'uyel replies..."
 irrliam_flavour.4.d:0 "[Root.Monarch.GetName], a reply from the Re'uyel council arrived today."
 irrliam_flavour.4.a:0 "So it shall be."
 
 irrliam_flavour.5.t:0 "The Fate of the Gelkari"
 irrliam_flavour.5.d:0 "The Gelkari have long and loyally served Surael's Chosen. Their zeal and bravery is second only to the Sadnatu among our human servants, and many believe they deserve to be rewarded with a proper governorship for their centuries of service. On the other hand, there is no doubt that some among them consort with the Harpy-demons, and it could be claimed that they have failed to properly contain that winged menace for centuries. \n\n §OMaking Gelkalis a governor will give them all of Harpy Hills under your control.§!"
 irrliam_flavour.5.a:0 "They are unworthy to Govern, tainted by the Harpy."
 irrliam_flavour.5.b:0 "As Surael rewards our best, and forgives our worst, so shall we."
 
 irrliam_flavour.6.t:0 "Fate of Zealous Zansap"
 irrliam_flavour.6.d:0 "The Zansap have been the most zealous, loyal, and steadfast of the servants of Surael's Chosen. While the Vamrahari, Sareyandi, and others grew fat in their estates, the Sadnatu of Zansap bleed to protect us from the Gnolls. There is little doubt that had they received any reinforcements from the other princes they would have held the hills against the gnollish menace... but still, by denying them a governorship our elvish political rivals may be appeased for a time.\n\n §OIf you choose to make them a governor you will not be able to annex them later.§!"
 irrliam_flavour.6.a:0 "Zealous, but defeated. Politics demand thus."
 irrliam_flavour.6.b:0 "Loyal faith are the wings upon which we soar."
 
 irrliam_flavour.10.t:0 "Fate of the Drolokand"
 irrliam_flavour.10.d:0 "Drolokand is of vital economic and strategic importance. The piratical masses that inhabit this region well know this fact to play powers off each other, and in so doing have become expert seamen the perfect tool to be used. \n\nNow that we control the region, a leader from amongst them has come to petition for rights to autonomy and governorship, in exchange for their loyalty and expertise. §OIf you choose to make them a governor you will not be able to annex them later.§!"
 irrliam_flavour.10.a:0 "They are pirates and scum. They will submit."
 irrliam_flavour.10.b:0 "The Drolokandi are best left governing themselves."
 irrliam_flavour.10.c:0 "Autonomy, eh? Our Re'uyeli Governor has autonomy."
 
 irrliam_flavour.11.t:0 "An offer from Irrliam"
 irrliam_flavour.11.d:0 "We received a simple letter today, escorted by a strong contingent of Elvish elites from the Irrliazuir realm. It is a simple letter with a simple, but profound message - we will open our borders to their missionaries and take in their council. True converts, it seems, will be given all of Drolokand. Refuse the missionaries and we are 'part of the darkness'."
 irrliam_flavour.11.a:0 "Elvish Cavalry? Ha! Guess I've seen the light."
 irrliam_flavour.11.b:0 "I like yer bluntness elf, we can do business."
 irrliam_flavour.11.c:0 "U wot?! Git out and stay out"
 irrliam_flavour.11.e:0 "We shall submit to the larger pack."
 irrliam_flavour.11.f:0 "That they send a letter is proof they fear us."
 
 irrliam_flavour.12.t:0 "The Dwarves respond"
 irrliam_flavour.12.d:0 "Our recent letter demanding the dwarves allow our missionaries into their hold has been met with a response."
 irrliam_flavour.12.a:0 "They... actually converted? Very well."
 irrliam_flavour.12.b:0 "They agreed, though only some of the humans seem to have converted."
 irrliam_flavour.12.c:0 "Doesn't matter, we crush them."
 
 irrliam_flavour.13.t:0 "The Gnolls respond"
 irrliam_flavour.13.d:0 "Our missionary-conquistadors have sent word from Gnollakazar..."
 irrliam_flavour.13.a:0 "The gnolls have seen the light! Praise Surael!"
 irrliam_flavour.13.b:0 "The gnolls submitted? How meek."
 irrliam_flavour.13.c:0 "Seems we'll have to crush the mutts."
 
 irrliam_flavour.14.t:0 "Arrives a diplomat from Taelarios' house..."
 irrliam_flavour.14.d:0 "The illustrious diplomat of Taelarios's domain approached the council chamber's speaking platform and bowed, a splendid brocade of silks and jewels tumbling around her as if to announce the prosperity that comes to those who serve the Irrliazuir throne. After a precisely appropriate moment of silence, she stood and spoke: \n\n 'Your mighty realm once served as a governorship of the Phoenix Empire, benefiting from the protection and authority of the highest of the Chosen of Surael. The House Irrliazuir asks if you will once more take up governorship over Far Bulwar, as faith and duty would compel.' \n\n §OBy accepting this offer you will become a unique, powerful vassal... but a vassal nonetheless.§!"
 irrliam_flavour.14.a:0 "Eduz-Vacyn will guard the temples of the reborn Phoenix!"
 irrliam_flavour.14.b:0 "Avamezan will serve once more."
 irrliam_flavour.14.c:0 "By Surael our people will not bow to a false prophet!"
 
 irrliam_flavour.15.t:0 "Word from the East"
 irrliam_flavour.15.d:0 "It has been days since your overt gesture to the east, impatience rife on your mind despite your best attempts otherwise. Deciding to get some fresh air you step from your study, only to be met by the sight of a flustered messenger hurrying to you."
 irrliam_flavour.15.a:0 "We are commited then. Summon the faithful to war!"
 irrliam_flavour.15.b:0 "Bah, diplomacy was Taelarios' game anyway."
 
 irrliam_flavour.16.t:0 "As promised..."
 irrliam_flavour.16.d:0 "As promised it is time to invest our newest governor."
 irrliam_flavour.16.a:0 "Not even Taelarios was so politically adept!"
 
 irrliam_flavour.17.t:0 "Academy Innovation"
 irrliam_flavour.17.d:0 "A recent debate among the first crop of our new royal academy is turning heads of our generals and advisors. It seems everyone is agreeing that our military structure is in need of reform, but none agree how it should be done. \n\n Perkule, a Zansapi noble, has suggested that he and his human kin should serve as a bulwark while our elvish cavalry and the cannons rip our enemy formations to shred. \n\n Taelaro, a distant relative of yours, has instead suggested that we begin restricting our army's ranks to only the best and most disciplined - be they human, elf, gnoll, dwarf, whomever. \n\n Lastly, Ynvettika, a member of elvish nobility from Bulwar is suggesting that, given our many enemies, we should focus on swelling our ranks with greater conscription."
 irrliam_flavour.17.a:0 "This Perkule provides a fascinating suggestion."
 irrliam_flavour.17.b:0 "Taelero sees the truth. We need soldiers, not rabble."
 irrliam_flavour.17.c:0 "Pragmatic Ynvettika is the wisest of the bunch."
 irrliam_flavour.17.e:0 "Let the children yap. Our military is fine."
 
