 spirit_ambition_aspect:0 "Spirit of Ambition"
 desc_spirit_ambition_aspect:0 "This Spirit embodies the Ynnic view of dragons as ambitious creatures and emphasises a drive for improvement in status through hard work and cleverness."

 spirit_authority_aspect:0 "Spirit of Authority"
 desc_spirit_authority_aspect:0 "This Spirit focuses on how unity and loyalty under the Dragon God brings safety and prosperity to the lives of the Rzentur, and emphasises mutual quality of life improvement through law abiding and consistency in morals."

 spirit_introspection_aspect:0 "Spirit of Introspection"
 desc_spirit_introspection_aspect:0 "This Spirit speaks to how Drozmagog and Varlengeilt were wise due to understanding themselves, it places importance on individuals contemplating their behaviour and thinking to better understand themselves and their place in the world."

