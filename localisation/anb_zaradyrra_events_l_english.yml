 zaradyrra.4.title:0 "The Right Jelli for the Job"
 zaradyrra.4.desc:0 "The morning mists still rise from the river banks when news reaches the princely palace - this year's convocation of the Jelli at the Tree of Tales has ended. Many tales have been shared, and a plethora of new poems and songs will spread all over Fangaula in the coming months. And with it the latest crop of students at the Yirisunsiir have finished their apprenticeship and have become master storytellers in their own right. Amongst them, one prodigy has caught the interest of court officials, who have been lobbying to swiftly secure his services before he catches the notice of rival courts who might well outbid us in an attempt to gain his loyalty."
 zaradyrra.4.a:0 "Let him tell tales of Aro Makaya, Kanhati and the other great totem spirits!"
 zaradyrra.4.b:0 "On second thought, we are somewhat lacking in entertainment."
 zaradyrra.4.c:0 "Maybe it might be even better to have an emissary speak on our behalf to foreign lords?"
 zaradyrra.4.d:0 "Or might he serve us better by listening when more foolish men talk?"
 
 zaradyrra.5.title:0 "Gathering Students like Pearls on a String"
 zaradyrra.5.desc:0 "While once other schools of the Jelli tradition might have challenged the primacy of the Tree of Tales, by now thanks to our continued efforts the Yirisunsiir is the undisputed heart of the Jelli craft and being granted the opportunity to study here is the dream of many a prospective Jelli. Wooden platforms and staircases left to molder in the humid climate have been restored, new teaching chambers have been constructed and formerly unremarkable structures have been adorned with delicate carvings and striking pearl inlay mosaics. We now have the pick of some of the most talented Jelli to recruit for our service."
 zaradyrra.5.a:0 "Our people might benefit from being reminded of the foundations of our faith."
 zaradyrra.5.b:0 "The people crave stories from faraway realms and tales of heroes from our past."
 zaradyrra.5.c:0 "We need someone to spread tales of our might and benevolence far and wide across the lands."
 zaradyrra.5.d:0 "Passing through many lands and welcomed into many homes a Jelli makes an excellent spy."
 zaradyrra.5.e:0 "In uncertain times we shall use magic to safely navigate the murky waters of tomorrow."
 
 zaradyrra.6.title:0 "The Winds whisper of many Wondrous Tales"
 zaradyrra.6.desc:0 "It is done! After many years of toil and effort the Yirisunsiir has grown from a mere gathering place for roaming raconteurs into not only the undisputed heart of the Jelli tradition but a symbol of peaceful cooperation all over western Sarhal. Whenever there is a need for a summit location to find peaceful solutions for simmering conflicts the Tree of Tales and with it the town of Jirad is the obvious first choice. And with every new Jelli leaving the teaching halls and stages of the Yirisunsiir for the wider world its reputation only grows. And just as birds like the stork travel far away only to return each year, the Jelli bards gather in ever-increasing numbers each year to share the latest wondrous tales from faraway lands. It is only proper that we may obtain the service of the most talented among them to further our own ambitions."
 zaradyrra.6.a:0 "Our people are in dire need of spiritual guidance to calm their spirits."
 zaradyrra.6.b:0 "Let our court become a celebrated center of poetry and the arts!"
 zaradyrra.6.c:0 "The honey-sweet voice of the most accomplished Jelli shall spread tales of our glory."
 zaradyrra.6.d:0 "What is needed is a masterful webweaver to gather the secrets of friends and foes alike."
 zaradyrra.6.e:0 "A master of Light-Tongue magic is needed to ensure the continued prosperity of our realm."

