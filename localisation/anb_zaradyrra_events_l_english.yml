 #Coven's Bargain: 20-33 written by De Sterrennacht, 34 and 35 written by Scamp
 zaradyrra.20.t:0 "Coven's Bargain: The Loan"
 zaradyrra.20.d:0 "You toss and turn in your chambers. You haven’t been able to sleep in what feels like an eternity; the state of [Root.Country.GetName] has consumed not only your waking moments, but your sleeping moments as well. You wish you could say it was entirely out of your control, but you know that can’t be true. This is your fault, and now [Root.Country.GetName] is teetering on the edge of bankruptcy.\n\nYou drift off, and find yourself in a fog-filled marsh. Your breath hitches as you recognise the plants; this is the Shadow Swamp. You strain your eyes, and see a glimmer of gold off in the distance. Something in you takes over, some primal greed, and you scramble for the faint glimmer, running until you see a giant boulder of solid gold in front of you. You marvel at its size. If only you could take this with you out of the dream, then all [Root.Country.GetName]’s debts would be solved. But it can’t be that easy, can it?\n\n‘But what if it is that easy?’ you hear someone whispering. ‘What if you could just take the gold, and everything would be better? Would it hurt to try?’"
 zaradyrra.20.a:0 "This feels off"
 zaradyrra.20.b:0 "Take the gold"
 zaradyrra.21.t:0 "Coven's Bargain: Time to Collect"
 zaradyrra.21.d:0 "You lay down in your chambers and smile. Five years to the day, you woke up from a dream you barely remember, and all of [Root.Country.GetName]’s debts were solved. You don’t fully understand how, but every creditor simply…forgot. You checked the country’s financial records and found nothing but carefully-written profit and good financial management where ruinous debt should have been scrawled in desperation. Tonight, like every night for the past five years, you sleep peacefully.\n\nYou open your eyes, and find yourself in the Shadow Swamp again. You look around, but see no glimmer of gold. Then you try to take a step, and your legs fail to move.\n\nYou look down. Your legs are encased in solid gold.\n\nYou hear a distant cackle, and the same voice from five years ago speaks. ‘Because of your incompetence, you were offered a loan by myself, Ilfanill Gloomweaver. You’re very familiar with loans, I’m sure. Your creditor has come to collect. I request the prosperity of only the last three years; a very fair price, wouldn’t you say? As interest, I demand all of the future prosperity of your nation as well. Harsh, but the loan was offered to the least trustworthy debtor I’ve ever seen! And, of course, if you default, I’ll take everything I gave you. I’m sure your old creditors won’t be happy to see these debts again.’"
 zaradyrra.21.a:0 "I will not sell [Root.Country.GetName]’s future!"
 zaradyrra.21.b:0 "Pay your debts"
 zaradyrra.22.t:0 "Coven's Bargain: An Intruder"
 zaradyrra.22.d:0 "With the unrest throughout [Root.Country.GetName], your advisors have suggested you barricade the doors to your estate; you’ve taken this advice to heart. One day, as you pace your entrance hall, empty of petitioners and filled with guards, you hear a crack on your front door. Then another. Then another, then another, then your door bursts open. Your guards jump to attention, and a hulking cloaked figure steps through the opening where your door once was. It speaks in a booming voice as your guards shake in fear. ‘I can bring you peace. I can slay your enemies, crush the traitors, quell sedition. Yes or no?’"
 zaradyrra.22.a:0 "No"
 zaradyrra.22.b:0 "Yes"
 zaradyrra.23.t:0 "Coven's Bargain: A Pound of Flesh"
 zaradyrra.23.d:0 "You sit in your chambers. Your advisors have told you that the unrest that plagued your country shows signs of beginning again. The traitors within [Root.Country.GetName] arm themselves, and your rule is resisted at every turn. You hear a crack on your bedroom window, and then a loud boom, and you jump up, seeing the cloaked figure from five years ago climbing through. She flips her hood off and reveals her face; it is Hireet Smoketusk, one of the three hags of Yezel Mora, and her smile terrifies you even more than her size... ‘The pendulum swings back. What I did for you will lead to more unrest, even worse than before. Unless you pay the price. A pound of flesh from every child in [Root.Capital.GetName], and your eternal fealty.’ She licks her lips and grins even wider. ‘And a few choice morsels to myself.’"
 zaradyrra.23.a:0 "I do not need your help again!"
 zaradyrra.23.b:0 "Convert to Shadow Pact"
 zaradyrra.24.t:0 "Coven's Bargain: Nine Months After"
 zaradyrra.24.d:0 "You sigh. Your courtiers dragged you to this festival, with nobles from across the realm and many of your own family members attending. Your lack of an heir is worrying them, and they beg you every day to have a child, or to appoint a relative. But you don’t want a child, and all of your relatives are idiotic sycophants unfit to rule [Root.Country.GetName]. You’ve stayed in the corner, fending off requests to speak or dance from power-hungry relatives and attractive young women alike. Then you see her; the most beautiful woman you’ve ever seen, approaching you. She extends her arm and requests a dance, and you know you’ve fallen in love. You spend the rest of the night getting to know her in every possible sense. When you awake, however, she is gone.\n\nAll of this happened nine months ago. Today, just outside your chambers, you see her, bearing an infant child, and you recognise his eyes as yours."
 zaradyrra.24.a:0 "I cannot raise this child, begone!"
 zaradyrra.24.b:0 "Make him my heir, and make her my queen"
 zaradyrra.25.t:0 "Coven's Bargain: Hanged"
 zaradyrra.25.d:0 "[Root.Monarch.GetName] was found dead in his chambers today, hanging from a noose he tied himself. His consort and heir have vanished mysteriously, leaving nothing behind, and rumours are beginning to spread that they were somehow responsible. The court is in chaos, and a distant cousin has been appointed to the throne."
 zaradyrra.25.a:0 "This bodes ill..."
 zaradyrra.26.t:0 "Coven's Bargain: Consort & Heir Vanish"
 zaradyrra.26.d:0 "After your monarch died, his consort and heir vanished mysteriously, leaving nothing behind, and rumours are beginning to spread that they were somehow responsible. The court is in chaos, and a distant cousin has been appointed to the throne."
 zaradyrra.26.a:0 "This bodes ill..."
 zaradyrra.27.t:0 "Coven's Bargain: Return of the Heir"
 zaradyrra.27.d:0 "The boy who stands before you has his father’s eyes. It makes the hatred with which he stares at you feel even more disorienting. ‘I am the rightful [Root.GetTitle] of [Root.Country.GetName], and I have come to reclaim my birthright,’ he says. ‘I have thousands of men willing to fight for me. Give me the throne, or I will take it.’\n\nYou steal a glance at his mother in the corner. She’s flanked by armed men, and she smiles at her son. She’s dropped the disguise she used to seduce his father, and you recognise her as the hag Komina Riftwhisper, one of Yezel Mora’s rulers. You have no doubt that her son obeys her every command. If you give him the throne, he’ll follow her dark designs."
 zaradyrra.27.a:0 "He fled the nation, this throne is not his to take!"
 zaradyrra.27.b:0 "Abdicate for the rightful [Root.GetTitle]"
 zaradyrra_text:0 "Festival" 
 zaradyrra_finished_scholar_tt:0 "Has hosted a scholar for 10 years"