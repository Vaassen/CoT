 flavour_zokka.60.t:0 "SURAKEL IS DEAD"
 flavour_zokka.60.d:0 "Pamphlets spread around Bulwar and the Divenhal like wildfire, the claims printed there more inflammatory than the hottest embers: Surakel, or some say, Surael, the last remaining god of the Bulwari Pantheon, is dead.\n\nPublished by the remnants of the Order of Judges, the printings detail the recent devouring of Sarnagir - the legendary Phoenix of Bulwar - by Zokka, alongside the failure of the forces of the Light to deter the encroaching [F29.GetName], and the massive loss of territories held by the various denominations of the Sun Cult. Town criers as far as the Empire of Anbennar shout the words from the rooftops: Surael is Dead.\n\nIn addition to the rapidly spreading pamphlets, a radical group of apprentice mages from the Kelmaxherho - scholar-slaves totally devoted to Zokka's cause - demonstrated a rare willingness to work alongside their technical owners, planning and carrying out what is likely to be the largest mass sacrifice ever held on Halann. Thousands of Sun Cult worshippers, imprisoned and enslaved for years after resisting conversion to the Xhazobkult, were tied to grand pyres constructed across Bulwar and lit in unison. The light of the hellfire was seen on the horizon as far away as Gaweton, and the pained, desperate screams of the now-deceased were allegedly heard from Tianlou to the tip of the Dragon Coast.\n\nThe shock and horror at the mass sacrifice - known to the masses as the Throes of Surael - has reverberated throughout Halcann, with many now struggling to feel safe in their homes. Others demand answers and guidance from their religious leaders, most of whom are just as shocked as their congregations. All the while, the question of the [F29.Monarch.GetTitle]'s true intentions remain murky - was it a bid for total religious unity? Or, more concerningly, a message for those that continue to resist the Xhazobkult's call, that they could be next?"
 flavour_zokka.60.a:0 "Soon, the whole world will unravel around us..."
 flavour_zokka.60.b:0 "It's hard to feel that the whole world isn't unraveling around us..."
 flavour_zokka.60.c:0 "A worrying development... but still - surely - our gods reign supreme."
 flavour_zokka.69.t:0 "In The Days Of The Kult's Conception"
 flavour_zokka.69.d:0 "Whence shall the lessons be learned?"
 flavour_zokka.69.a:0 "The First faced dragonfire twice before her death." #Hellfire
 flavour_zokka.69.b:0 "Harpy, Pyreclaw, Fieldstalker; the First's subjugations were of iron and faith alike." #Chains
 flavour_zokka.69.c:0 "Elikhet struck deep, but the First endured. Her legacy is written in her conquests." #Blood
 flavour_zokka.69.e:0 "From Sarhal, from Kheterata, the tithe was paid in steel and silver." #Gold
 flavour_zokka.69.f:0 "The First's lieutenants ensured her vision did not die with her." #Eyes
 flavour_zokka.70.t:0 "In The Days Of The Failures Three"
 flavour_zokka.70.d:0 "Whence shall the lessons be learned?"
 flavour_zokka.70.a:0 "Flame still burns in the grave of the Drowned." #Hellfire
 flavour_zokka.70.b:0 "The Blighted's slave army crumbled when tested, for their uses lay elsewhere." #Chains
 flavour_zokka.70.c:0 "Blood feuds do not a Xhazobine make, yet the Draconic found value in what they inspire." #Blood
 flavour_zokka.70.e:0 "As The Blighted's successor learned - once gold runs dry, loyalty swiftly follows." #Gold
 flavour_zokka.70.f:0 "The Drowned saw the battles to follow, but was blind to the war." #Eyes
 flavour_zokka.71.t:0 "In The Days Of The Garden's Master"
 flavour_zokka.71.d:0 "Whence shall the lessons be learned?"
 flavour_zokka.71.a:0 "Anzarzax fell, for the Red blazed brighter." #Hellfire
 flavour_zokka.71.b:0 "Steel won the Red a throne, and the Xhazob's blessings saw it grow." #Chains
 flavour_zokka.71.c:0 "The Red claimed a Suncrown's name and a Suncrown's right." #Blood
 flavour_zokka.71.e:0 "The warlock whispered, and the Red listened, and the Red was rewarded." #Gold
 flavour_zokka.71.f:0 "The Red saw herself an Empress, yet fell to the Phoenix." #Eyes
 flavour_zokka.72.t:0 "In The Days Of The Sisters-Bound"
 flavour_zokka.72.d:0 "Whence shall the lessons be learned?"
 flavour_zokka.72.a:0 "Fire does not bow to prophets false." #Hellfire
 flavour_zokka.72.b:0 "The Winderhowlers were turned with iron." #Chains
 flavour_zokka.72.c:0 "Blood unites, yet the Twin was born of possession, not lineage." #Blood
 flavour_zokka.72.e:0 "To speak with one voice is to weave one lie." #Gold
 flavour_zokka.72.f:0 "She struck at the Empire's weakness, blind to her own." #Eyes
 flavour_zokka.73.t:0 "In The Days That Were, That Are, That Have Yet To Be"
 flavour_zokka.73.d:0 "For I am the Once and Future Xhazobain, and this shall be my lesson."
 flavour_zokka.73.a:0 "Mine is the felflame that lights the way." #Hellfire
 flavour_zokka.73.b:0 "Mine is the chain that encircles the world." #Chains
 flavour_zokka.73.c:0 "Mine is the blood that unites gnollkind." #Blood
 flavour_zokka.73.e:0 "Mine is the voice that echoes in the mind." #Gold
 flavour_zokka.73.f:0 "Mine are the eyes that witness all." #Eyes
 flavour_zokka.666.t:0 "This Is A Terrible Idea"
 flavour_zokka.666.d:0 "Are you sure you want to do this?"
 flavour_zokka.666.a:0 "I repent!"
 flavour_zokka.666.b:0 "This is a new way! A better way!"
