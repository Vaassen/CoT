# Events
 flavour_zokka.1.t:0 "Dawn"
 flavour_zokka.1.d:0 "Zokka watches from across the great pyre. His gaze follows as the Pack Lord paces back and forth, maw dripping, saliva sizzling where it falls from his lips and hits the blackened ground. The air is ripe with the scent of elf and harpy flesh, half-cooked over the hellfire. To the assembled gnolls - his father's greatest generals and advisors - this is a feast, celebrating the greatest victory the pack has claimed thus far.\n\nBut to Zokka, son of Zokka, the smell is repulsive.\n\nHe knows he is a disappointment. He knows his proclivities are unlike the rest of peers, preferring quiet contemplation and meatless meals over the savage brutality they favour. A vegetarian gnoll. What a joke. What a failure.\n\nHe knows all of this well. And yet, no matter how hard he tries, he cannot change.\n\nHis father lifts a hunk of flesh, almost as large as Zokka's head. Blood still coats the muscle and sinew in a sticky, sickening glaze. The boy almost gags, but keeps his composure.\n\n"The future belongs to us. We all know it." The Pack Lord speaks, voice guttural. All chatter ceases, replaced by jeering and hollering. Zokka's own cheer is half-hearted, easily drowned out by the din. "But the First Sun still rises. My work is not done." The celebration rises to a fever pitch, but his father's words echo around the pyre, as audible as ever.\n\n"Just as Xhurtivert before us and the Great Xhaz before them, Bulwar is ours to claim!" Zokka shivers, despite the growing heat of the fire. "At dawn, with the light of hundred pyres, I will proclaim the new Xhaz - the last Xhaz! And all shall know! All shall fear us - shall fear me!"\n\n"Because...""
 flavour_zokka.1.a:0 ""...bloodshed is a universal language!""
 flavour_zokka.1.b:0 ""...our intentions cannot be twisted if use their own tongue!""
 zokka_tempclaims_tt:0 "All §Ypermanent claims§! gained from Zokka's missions will be §Ytemporary§! instead."
 zokka_permaclaims_tt:0 "All of Zokka's §Yexisting claims§! will become §Ypermanent§!."
 zokka_no_mandate_tt:0 "Zokka would sooner §Reat the Khetarch§! then claim the §YStewardship of the Sorrow§!."
 flavour_zokka.2.t:0 "Father And Son"
 flavour_zokka.2.d:0 "Andrellion had seen his father die.\n\nHe had cleanly finished off his own assailents, letting their bodies fall into the growing pile of gnoll corpses around him. He had swept his gaze across the battlefield, taking in the horror, valiantly ignoring the pit in his chest and the wounds in his side. His eyes had halted on his father. An elf larger then life - the strongest, smartest, most competent man he had ever known.\n\nHe watched the man cry out. He heard the crunch of teeth meeting teeth, breaking through skin and skull and brain. He fell to his knees, lungs empty. He had begged Surakel, begged for the wretched moment to have been a simple trick of the light, even as enemies swarmed him, shattering his ankles and scorching his torso with their foul fire.\n\nNow, he is here.\n\nAndrellion didn't know how, exactly, he had broken free. The rusted chains that had cut into his wrists lie shattered in the sand. His assigned guard lies next to them, throat wet with still-warm blood matching the ichor staining his own teeth. He crawls, dragging himself through the dust, until his fingers fail to curl and the sun begins to rise. Then, and only then, does he cry out, voice dry and cracking yet still, somehow, managing to summon aid.\n\nHe is given no time to recover. Unable to protest, he is slung across the back of one of the Mašnsih that had found him. They walk for days - for weeks - evacuating villages of humans, elves, and harpies alike, swelling their numbers a hundredfold. Then, and only then, do they cross into Davharral, and then Rahen proper.\n\nThen, and only then, does Andrellion let himself hope once again."
 flavour_zokka.2.a:0 "Perhaps, the future would be better than the now."
 zokka_daylight_blinds_tt:0 "All owned provinces following a creed of the §YSun Cult§! will see their population §Rdepart§! with Andrellion.\n\n§YSiadan's Jadd§! population will be §Rabandoned to their fate§!!"
 flavour_zokka.3.t:0 "The Nascent Xhazobain"
 flavour_zokka.3.d:0 "Zokka, the legendary Devourer-of-Suns, is certain to become Xhazobain. He comes demanding our total supplication to his cause!"
 flavour_zokka.3.a:0 "The Sandfang are his to command!"
 flavour_zokka.3.b:0 "As he says; though Tluukt shall still rule us!"
 flavour_zokka.3.c:0 "Never!"
 flavour_zokka.5.t:0 "Flock Together"
 flavour_zokka.5.d:0 "The wind is good today - good, and high, and strong, rushing between the cliffs in great curling gusts. It pulls at Síphe's feathers as she stretches, enjoying the feeling and smells brought along with it; of cold stone and pine resin, crisp and clean.\n\n"You wouldn't have lasted a day," she teases, talons gripping the edge of the wall. "One wrong gust and you'd have gone tumbling into the ravine."\n\nSarádun scoffs, rolling her shoulders. "You exaggerate. I've scaled the pass three times now-"\n\n"Twice," Síphe corrects, smirking. "The first barely counted." Her companion rolls her eyes.\n\n"Fine. Twice. But I've never fallen." Síphe opens her beak to reply-\n\nA sound splits the air. Sharp. Raw. Horrified.\n\nA shriek, high and piercing, not from wind or prey or quarreling nestmates. It freezes the warmth in her chest. Another cry follows, then another, then another. All around the pair, wings unfurl, heads snapping towards the heart of the roost. Instinct drives them forward, and Síphe moves with them, every muscle drawn tight. Her stomach twists, panic clawing at her throat.\n\nShe knows before she sees it.\n\nThe nursery is a ruin. Dozens of broken shells are shattered against the rock, glistening wet. Raw yolk and iron lingers in the air. The chamber is thick with the sounds of grief; wailing, choked gasps, desperate moans.\n\nThe gnolls are there, claws stained with the evidence of their crime, erasing the delegatory pretense they had arrived with. Some lie dead, torn apart in aggreived fury. Others are held firm. Their bodies shake - not with terror, but laughter.\n\n"Glory to Zokka! Glory to the eater of suns!" Their howls are twisted and guttural, unused to the foreign tongue. Screams and jeers echo from outside, and Síphe feels something break inside her. Distantly, she notices Sarádun drop to her knees. She understands.\n\nThis was not the only nursery. This was not the only massacre."
