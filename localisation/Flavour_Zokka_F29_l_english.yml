 xhazobain_primacy_tradition_desc:0 "Despite the common misconception held outside of Gnollish society, most gnolls never seek to strike a pact directly with a Xhazob. The risk of failure is high, and failure is undesirable when it means certain death. Zokka's pack thinks differently. In this school of thought, no effort should be spared when supporting the [F29.Monarch.GetTitle] in their quest to be named [F29.xhaz_gender_tt] - success is the ideal, and those who fail were never worthy rulers in the first place."
