 #Charkuchin Events
 charkuchin_kobold.0.title:0 "Charkuchin Expansion"
 charkuchin_kobold.0.desc:0 "These lands our ours to claim."
 charkuchin_kobold.0.a:0 "Its time to claim these mountains."
 charkuchin_kobold.0.b:0 "It's time to claim these mountains, with money for the AI."
 charkuchin_kobold.1.title:0 "We are Ascendant!"
 charkuchin_kobold.1.desc:0 "Now begin our true reign!"
 charkuchin_kobold.1.a:0 "We are Charkuchar."
 charkuchin_kobold.1.b:0 "We are an Empire."
 charkuchin_kobold.1.c:0 "We are the Federation."
 charkuchin_kobold.1.e:0 "We are a Grand Republic."
 charkuchin_kobold.2.title:0 "Hinuibird Migration Start" #placeholder
 charkuchin_kobold.2.desc:0 "It has begun. Look out!" #placeholder
 charkuchin_kobold.2.a:0 "Be careful" #placeholder
 charkuchin_kobold.2.a.tt:0 "Monthly Supply Costs triple to §R[Root.insyaa_charkuchin_kobold_citadel_supplies_total_cost.GetValue]§!"
 charkuchin_kobold.3.title:0 "Hinuibird Predation" #placeholder
 charkuchin_kobold.3.desc:0 "The movement patterns of the Hinuibirds above our settlements indicates predatory intent" #placeholder
 charkuchin_kobold.3.a:0 "Send some soldiers" #placeholder
 charkuchin_kobold.3.a.tt:0 "Send §Y5000§! infantry units to [hinuibird_predation.GetName] or it will lose development" #placeholder
 charkuchin_kobold.4.title:0 "Hinuibird Carcass" #placeholder
 charkuchin_kobold.4.desc:0 "A Hinuibird fight has occurred and the carcass has been left - this could provide ample supplies" #placeholder
 charkuchin_kobold.4.a:0 "Send some soldiers" #placeholder
 charkuchin_kobold.4.a.tt:0 "Send §Y1000§! infantry units to [hinuibird_carcass.GetName] to gain some supplies" #placeholder
 charkuchin_kobold.5.title:0 "Hinuibird Landslide" #placeholder
 charkuchin_kobold.5.desc:0 "A Hinuibird crashing into an unstable portion of rock has caused a landslide on one of our settlements. We must send a relief effort!" #placeholder
 charkuchin_kobold.5.a:0 "Send the supplies" #placeholder
 charkuchin_kobold.5.b:0 "We can't afford the 25 supplies" #placeholder
 charkuchin_kobold.6.title:0 "Hinuibird Migration End" #placeholder
 charkuchin_kobold.6.desc:0 "It has finished, for now. We survive once more." #placeholder
 charkuchin_kobold.6.a:0 "They will be back" #placeholder
 charkuchin_kobold.6.a.tt:0 "In another 12 years this will happen again" #placeholder
 charkuchin_kobold.7.title:0 "Without Supplies, We Are Doomed" #placeholder
 charkuchin_kobold.7.desc:0 "Every province we have outside the citadels and supply centres is depopulating" #placeholder
 charkuchin_kobold.7.a:0 "We must do something, and soon" #placeholder
 charkuchin_kobold.7.a.tt:0 "Every province that does not have a citadel or supply facility will §Rlose§! §Y1§! random development, unless it is at §Y1/1/1§! in which case it will be §Rdecolonised§!.\n\nProvinces in the §YLowlands§! and §YTitanoflora§! regions will be targeted first." #placeholder
 charkuchin_kobold.9.title:0 "The Range is United" #placeholder
 charkuchin_kobold.9.desc:0 "We have taken every province in the Charkuchar ranges and we have a surplus of supplies." #placeholder
 charkuchin_kobold.9.a:0 "We are safe from the Hinuibirds now" #placeholder
 charkuchin_kobold.9.a.tt:0 "The Supplies Mechanic will be disabled\n" #placeholder
 charkuchin_kobold.11.title:0 "Surplus Supply Facilities" #placeholder
 charkuchin_kobold.11.desc:0 "We can only make use of 10. This one we have captured will be destroyed" #placeholder
 charkuchin_kobold.11.a:0 "We didn't need it anyway" #placeholder
 charkuchin_kobold.12.title:0 "We Are Out of Supplies!" #placeholder
 charkuchin_kobold.12.desc:0 "It's only a matter of time before our provinces are abandonded." #placeholder
 charkuchin_kobold.12.a:0 "We should've seen it coming" #placeholder
 charkuchin_kobold.12.a.tt:0 "Every 4 months, every province that does not have a citadel or supply facility will lose 1 random development, unless it is at 1/1/1 in which case it will be decolonised. This will happen until we have positive Supplies" #placeholder
 charkuchin_kobold.13.title:0 "Hinuibird Predation Failure" #placeholder
 charkuchin_kobold.13.desc:0 "We did not protect our people in time" #placeholder
 charkuchin_kobold.13.a:0 "My bad" #placeholder
 charkuchin_kobold.14.title:0 "Hinuibird Carcass Failure" #placeholder
 charkuchin_kobold.14.desc:0 "We did not get to the corpse in time" #placeholder
 charkuchin_kobold.14.a:0 "Meh" #placeholder
 charkuchin_kobold.15.title:0 "Hinuibird Predation Success" #placeholder
 charkuchin_kobold.15.desc:0 "We were able to protect our people" #placeholder
 charkuchin_kobold.15.a:0 "We prevented needless deaths" #placeholder
 charkuchin_kobold.16.title:0 "Hinuibird Carcass Success" #placeholder
 charkuchin_kobold.16.desc:0 "We got to the corpse in time!" #placeholder
 charkuchin_kobold.16.a:0 "Woot, loot!" #placeholder

