 cot_lots_grave:0 "Lothane 'The Great Usurper' sil Wex's Memorial"
 cot_lots_grave_desc:0 "This is a memorial commemorating the life (and death) of Lothane III sil Wex. A great amount of debate was given over to the location and title afforded, but it was eventually decided the neutral location of the Moonmount, where he could look over the vastness of His Empire (That he faces east and does not have vision on Anbenncost or the West Dameshead is not overlooked). Likewise, his title, "The Great Usurper" is a compromise between the pro-Wex Lothanites (who wishted to call him 'The Great') and the anti-Wex Whitearrows (who wished to call him 'The Usurped')."
