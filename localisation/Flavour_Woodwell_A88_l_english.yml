l_english:
 
 #missions
 A88_druids_title:0 "Druids, Arisen"
 A88_druids_desc:0 "A sorry sight the proud lands of Carneter have fallen into, that the last of their realms with even a shred of independence is a backwater, adrift from its past and with no future to call its own. That must change. The druids are the last of the Carnetori, the only ones who remember the days of oak and river, the days of the trees and hillocks. And perhaps, with their help, we could remember too."
 A88_more_work_title:0 "Honest Work"
 A88_more_work_desc:0 "The one thing Woodwell has lacked for the longest time are the crafts of the great Cannorian cities and towns. Deep in the woods, our people live mostly in shrouded hamlets and small towns amongst the more well trodden routes.\n\nBut with the changing times and growing burgher class, there have been demands to make use of our country’s wealth, primarily in the form of the coveted Carnetori Oak, not only strong and beautiful, but touched by the fey. We will of course need to fund further infrastructure and administration necessary to handle these projects, but it will surely be worth it."
 A88_warcry_title:0 "A Cry for War"
 A88_warcry_desc:0 "As of now, we are a dog backed into a corner. To the north stand Eilisin, who’s claws wrap around the very heart of Carneter’s woodlands. And to the south and west stand Pearlsedge and Lorent respectively, who’s navies ever hunger for our lumber. \n\nWe must remind them that we are of Ancard, and like him, we shall suffer no incursion."
 A88_reclaim_title:0 "Reclaim Lost Land"
 A88_reclaim_desc:0 "The time has come. We have strength in arm and ally, and we have united our people around one goal: Reclaim what was lost, and punish those who take from us. Move swift betwixt the trees, strike them hard and fast, and let not the most ignorant vagabond claim we are a weak or ill people.\n\nLeave none standing."
 A88_woodwork_title:0 "Out of The Woodwork"
 A88_woodwork_desc:0 "With the land prosperous, our borders secure, and our freedom recognized, many in our country are taking the step back to recline and enjoy the fruits of our labor. After all, with the rising power of Woodwell, many are now trying to work with us, instead of stamping us out. There is, they would say, no need for more tireless work.\n\nWrong. There is one more thing we need to do to make sure our nation is truly as it should be, the realm should be centralized, commanded by the crown and his loyal advisors. The factions must be placated, the local administrators reined in, and the lands made stable."
 A88_support_title:0 "Writing Down Support"
 A88_support_desc:0 "The burghers of our realm have always rivalled the druids, as they have long coveted the rich timber of the Deruwren, for ships, tools, and now paper. However, with the drive to reassert ourselves on the state of Cannor, the druids have… acquiesced to some of the merchant’s demands.\n\nIf the lands could be developed and trade routes established, we could gain great favor with the burghers, and earn both their support for our aims as well as a steady supply of paper from which we can pen our story."
 A88_cultivation_title:0 "Culture Cultivated"
 A88_cultivation_desc:0 "They sing and speak so much of Dameria, and of Lencenor. Of Luminaries and High Kings, and of their tragedies and triumphs. But who sings and speaks of Carneter? Of the rivers and the trees, of the spirits and the men, of brave Ancard, who spilt his life’s essence upon the waters to give his home a moment longer of freedom. These stories, once known true, now fade from all but the eldest of druids.\n\nWe shall not have our story denied, we shall find out who we are."
 A88_diplomacy_title:0 "Old Enemy, New Friend"
 A88_diplomacy_desc:0 "In order to face these new foes, perhaps our old ones, diminished with time, would come of some use. Wesdam, the march of a forlorn Dameria, once the frontier of an empire that fought our people. The Roilsardi, people of the thorn, who know of that noble resistance we seek. And Tretun, a people as ancient as us, brought low by the Pearlsedgers. Together, we shall act."

 #events
 flavour_woodwell.1.t:0 "To Grow From Reeds"
 flavour_woodwell.1.d:0 "“I don’t understand,” Said the boy, gesturing to the legal texts and decrees he was reading, “Why do I have to learn all of this?”\n\n“Because, Attalus,” Answered the young druid, “It is important for a ruler to understand how his realm functions. And that means reading boring scrolls and parchment on taxation.”\n\n“I could have my servants read it for me.”\n\n“And then it would be their realm. If you let others do your work for you, they can control you, tell you whatever they please.”\n\n“Really? None of you have ever done that to me, right?”\n\nMarion could only nod and watch as the boy went back to reading his taxation reports. It was times like this where he wondered what his mentor, Talien, had been thinking all those years ago, when he had put his plan in motion. He knew it was for the good of the realm, he knew it was a task given to Talien, and later himself, by truer powers of the Deruwren than mortal lords. But it felt wrong, and Marion didn’t think that feeling would ever go away.\n\nAfter a few moments, he gave some advice to Attalus."
 flavour_woodwell.1.a:0 "“You just need to mind the boredom and push forward.”"
 flavour_woodwell.1.b:0 "“You’re Lord now, go with your guy, whatever you feel is ‘fair’."
 flavour_woodwell.2.t:0 "Support of The Spirits"
 flavour_woodwell.2.d:0 "Attalus’ voice broke the silence. “Is something supposed to be happening-”\n\nMarion answered him first with a tap on the leg with his staff. “Shush.” He added.\n\nThe boy, now older, stood in the center of the grove, surrounded by the circle of druids, who chanted in Old Lencori, the ancient language of the Carnetori. To be honest, Attulus did not understand exactly ‘why’ he needed to do this. His father hadn’t, and his mother seemed apprehensive to let Marion or the rest organize this whole affair.\n\n“The ceremony is important, it was done by every king of Carneter, since the times of-”\n\nAttalus interrupted. “Lorenan and Ancard, I know,” His hands wrung together to stop himself from squirming due to boredom and strain, “But I don’t understand why *I* need to do this. I’m no king, I'm hardly a lord.”\n\n“The point is that it's an ancient ceremony that’s extremely important to both our ancient people *and* us druids. So you will undertake it and you will not complain.”\n\n“...Yes Marion.”\n\nJust then, there was rustling in the underbrush at the edge of the clearing, and out emerged a strange sight. A procession of winged serpents, hovering across the path, writhing with the movements of the wind. “Cualebris.” The Druid whispered their name to him.\n\n“Cualebris,” Attalus spoke, trying his best to sound authoritative but not demanding, “The time will come for me to rule this land in my own right. I seek your blessing, for a long and prosperous reign.”\n\nAfter a few moments, the Cualebris began to dance around him, making great and terrific noises like the dragons of yore. Attalus felt a mix of awe and fear, to see such amazing spirits of the forest, to have them choose him. And as soon as it began, it was done, and the serpent-spirits of the Deruwren departed from the grove, leaving Marion to congratulate him."
 flavour_woodwell.2.a:0 "“You have a good heart. They can always see that.”"
 flavour_woodwell.2.b:0 "“You spoke well, it was your tongue which convinced them.”"
 flavour_woodwell.3.t:0 "Marching On"
 flavour_woodwell.3.d:0 "Attalus gripped the double handed axe, the handle slippery with sweat. “Are you *sure* this is a good idea?” He looked in front of him, where several very large and very scary men stood on the other side of a rickety bridge.\n\nMarion only shrugged. “Ancard held his own against many warriors sent by the High King of Lencenor. We’ve only sent three.”\n\n“Yes, but those axes are sharp!”\n\n“Well of course, why would we hit you with blunt axes?”\n\n“Because you’re not trying to kill me?”\n\n“Warriors are hardly forged from dull axes and without intent to kill. I’d recommend you fight, my Lord.”\n\nAttalus grumbled and murmured curses beneath his breath, but he gripped his axe tighter and took stock of his enemies. And with a deep breath, he marched onto the bridge. The wooden steps creaked and groaned, and the structure swerved slightly as the warriors mimicked his actions, closing in on him.\n\nThe fight was a half wrestle, half balancing act, with Attalus using his axe to block their blows while he tried to grapple and kick them. It was almost no use though, for even as he kicked two into the water below, the third pushed against him like a bear, threatening to make him a head shorter.\n\nBut Attalus took a deep breath, and jammed the base of his axe against the man’s nose, before throwing him off into the river. Only slightly bloodied and bruised, he raised his axe up as the crowd of nobles, peasants, and druids cheered. And as he smiled, Marion gave a solemn nod and put a hand on his shoulder."
 flavour_woodwell.3.a:0 "“You’d be a good King.”"
 flavour_woodwell.3.b:0 "“You’ll be a good warrior.”"
 flavour_woodwell.4.t:0 "A Child From The Reeds"
 flavour_woodwell.4.d:0 "Suddenly something startled the stag Humbert was hunting and, before he had time to fire, it was long gone. He looked around. The water in the small creek reflects the sunlight of a perfect day, and the reeds wave slowly before a light breeze. Was that laughter? He realized now what had startled the animal. \n\nIn a cradle, floating among the reeds, lay a laughing little baby. Judging by his smile, Humbert would later say that he has never known fear in his life."
 flavour_woodwell.4.a:0 "We adopt him as our own!"
 flavour_woodwell.5.t:0 "Humbert's Demise"
 flavour_woodwell.5.d:0 "The boy stood before the grave, as his mother muttered prayers to Nerat and to Humbert’s personal god of Falah. He was, as the boy was told many times, fond of a hunt. They gave offerings of fruit, and flowers, and the many antlers the late lord had gained from his hobby over the years. And the boy wondered if his father was happy, wherever he was.\n\nAnd then, out of the corner of his eye, he saw the druids approach. They dressed in blacks, greens, and browns, appearing to be just a part of the woods themselves. The one in front, a man who seemed elder than even his late father, looked at him with soft eyes, like moss, before speaking to his mother.\n\n“With the new lord being so young, we were hoping to negotiate the terms of the regency-”\n\n“Here? At the funeral?” His mother snapped, and the boy felt her hand on his tighten. “Perhaps you mean to use my late husband’s tomb as a hall, or his tombstone as a table!”\n\n“I did not mean to offend.”\n\n“Well you have. You have been curious about this boy since Humbert found him… but you are right. My son needs to be tutored properly, and as such I will allow you to take him into the woods and raise him amongst the druids, provided I am a part of his regency council.” A pause. “And I get to visit him.”\n\nThe druid smiled. “A fair compromise as always, my lady.” The boy felt his mother let go of him, and the druid beckon him forward. And against his better judgement, he obeyed. But the boy felt betrayed. Why was he being taken into the woods by these strange people, why did his mother let him go, why did his father die and leave him as lord?"
 flavour_woodwell.5.a:0 "Someone glared from the corner..."
 flavour_woodwell.6.t:0 "Competition From The Bushes"
 flavour_woodwell.6.d:0 "“It is folly.” Spoke the noble, as they walked amongst the wooden statues, previous counts and kings before them, the rulers of Carneter. “The boy is some babe Humbert found in the woods.”\n\n“It was his will.” Spoke the druid, stroking his beard as he stared back at the lord, “Does it truly matter if he is Humbert’s blood?”\n\n“Yes!” The lord spat. “Our blood has ruled these lands for countless generations, since the elder days of Lorenan and Ancard. Why is this boy fit to rule and we are not?”\n\n“I can assure you, the boy is being raised to the utmost standards. He learns the poetry and oratory of his peers, how to fight and hunt, and how to administer a realm.”\n\n“And yet he is no noble, he is in all likelihood some peasant child left to die in a year of dirth.”\n\nThe druid, upon hearing this, stood taller, and at once the noise of the birds and the trees and life seemed to cease, as if to let him speak his piece. “Are you questioning the last will of your late-lord?”\n\nThe noble was silent, but only for a moment."
 flavour_woodwell.6.a:0 "“No, I am questioning its speaker.”"
 flavour_woodwell.7.t:0 "Pearlsedgers Make Their Move."
 flavour_woodwell.7.d:0 "The time has come: the nobility have finally decided to try to push their claim. The pearls gleam menacingly."
 flavour_woodwell.7.a:0 "What will happen now?"
 flavour_woodwell.8.t:0 "The Council of Woodwell"
 flavour_woodwell.8.d:0 "The lords, priests, burghers, and now the druids had come to Woodwell, now a refurbished capital of the realm. They filed through the entrance into a newly built chamber, where stood Marion, the would-be lord’s regent and key advisor, though some lords laughed at that idea.\n\n“Welcome, are we now able to discuss the matter of succession?”\n\n“Indeed we are.” Announced the lord, “Are you still parading that boy around as-”\n\n“Boy?” Came a cry, and in strode Attalus, arrayed in robed, now standing half a foot taller than even the lord, “Do you think me a boy still?”\n\nThey glared at one another, until the lord replied. “...You are some ill-origin babe Humbert found during a hunt. What blood do you have?”\n\n“And what valor do you? I have studied the history and ways of our people. I have hunted and fought amongst commoners and nobles alike, in the elder methods of Ancard. I have known hunger and fear and sorrow.”\n\n“And that makes you a lord?”\n\n“It makes me wise. What makes me a lord is their word, not yours.” He then turned to the estates, “Who would you have lead us? Some baron who has never left his manor? Or a man who has walked amongst you all, who is Humbert’s will-defined successor, and who has the blessing of the gods, men, and spirits in his reign?”\n\nHis estates cheered as he finished his oration, and he turned to Marion."
 flavour_woodwell.8.a:0 "“The Druid smiled.”"
 flavour_woodwell.9.t:0 "Annexation of The County of Woodwell."
 flavour_woodwell.9.d:0 "Due to decades of internal instability and unrest, as well as the mishandling of local politics, the aristocrats of Woodwell have pledged their support if we make a move to oust their ineffictive rulers and put them out of their misery."
 flavour_woodwell.9.a:0 "With pleasure."
 


