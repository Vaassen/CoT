#Missions
 U09_blood_gold_for_the_empire_title:0 "Blood Gold"
 U09_blood_gold_for_the_empire_desc:0 "Our empire requires both gold and a way to deal with the undesirables and slaves. Golkora is the perfect place for both."

 U09_finish_what_we_started_title:0 "Finish What we Started"
 U09_finish_what_we_started_desc:0 "We cleaved Kheterata in half. We must deal with our new conquest and prepare to decapitate the fallen empire."

 U09_administrative_synthesis_title:0 "A Blended Administration"
 U09_administrative_synthesis_desc:0 "The Kheteratan way of governance is both advanced and similar to ours. We can both learn from it and improve it."

 U09_acknowledge_reality_title:0 "Facing the Facts"
 U09_acknowledge_reality_desc:0 "A new gnollish dominion of the Sorrow aproches, but Kheterata has seen enough blood already. The Khetarch must realize this."

 U09_birth_of_an_empire_title:0 "Birth of an Empire"
 U09_birth_of_an_empire_desc:0 "Kheterata has been ruled by us gnolls before, and now, it will become the base of the new gnollish empire."

 U09_all_shall_bow_title:0 "All Shall Bow"
 U09_all_shall_bow_desc:0 "The gnoll tribes of the Gol have been united, except for the Rakkazi traitors. We must correct this and continue our unification."

 U09_no_quarter_for_traitors_title:0 "No Quarter Given"
 U09_no_quarter_for_traitors_desc:0 "All gnolls shall bow to us, and the traitors in Rakkaz will serve as an example for those who denie us."

 U09_a_worthy_army_title:0 "A Worthy Army"
 U09_a_worthy_army_desc:0 "An empire requires a proper professional army, not just a horde of decentralized raiders."

 U09_from_where_to_dictate_title:0 "From Whence Orders Hail"
 U09_from_where_to_dictate_desc:0 "Ilzin Grizaka must become a proper capital for our empire."

