 flavour_gnollakaz.1.a:0 "All hail the great conqueror Grizaka, Empress-of-Gnollkind!"
 flavour_gnollakaz.1.b:0 "All hail our mighty ruler Grizaka, Empress-of-Gnollkind!"

 flavour_gnollakaz.2.t:0 "A Meeting with the Khetarch"
 flavour_gnollakaz.2.d:0 "TBD"
 flavour_gnollakaz.2.a:0 "A title gained by both Right and Blood!"

 flavour_gnollakaz.3.t:0 "A True Gnollish Empire"
 flavour_gnollakaz.3.d:0 "TBD"
 flavour_gnollakaz.3.a:0 "The Sorrow has become our destiny"

