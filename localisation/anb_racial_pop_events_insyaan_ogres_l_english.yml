l_english:
 insyaan_ogre_flavour_events.1.t:0 "The Bloom of the Plateau"
 insyaan_ogre_flavour_events.1.d:0 "Missives have entered your chambers talking of a meticulously tended garden, unlike any cultivation the realm has seen before, hidden in the heights of the Great Plateau. They speak of rows of a peculiar root stretching across terraced slopes, their leaves a deep, almost black green.\n\nThe advisors huddle amongst themselves, then split into two camps. One side opposes anything to do with it.\n\n“Let’s leave it all together, my [Root.Monarch.GetTitle]; the beasts who inhabit the planes are far too cruel to anger.”\n\nThe latter group insists that an expedition is sent."
 insyaan_ogre_flavour_events.1.a:0 "Send a scouting party to survey the fields."
 insyaan_ogre_flavour_events.1.b:0 "What use are a bunch of plants?"
 insyaan_ogre_flavour_events.1.c:0 "I’m something of a greenthumb myself - send the gardeners some aid!"
 insyaan_ogre_flavour_events.1.e:0 "Mulch for our farmers at least."
 insyaan_ogre_flavour_events.1.f:0 "It seems they do not have the right paperwork; send in the tax-man!"

 insyaan_ogre_flavour_events.2.t:0 "A Meticulous Garden"
 insyaan_ogre_flavour_events.2.d:0 "The scouting party has returned, and with them crates upon crates overflowing with vegetables the size of Solewood logs. The party’s leader emerges from the pack, unable to hide his grin. \n\n“My [Root.Monarch.GetTitle],” his voice boomed, “it was a sight to behold!” The rest of his crew hurried along to bring in what remained of the crops.\n\n“Our journey was not an easy one; we set out at first light of the fifth day, crossing the canyons where the wind howled and the rocks threatened to give way under our feet. But after a full day of climbing, we reached the Great Plateau – with nothing but the silver shine of the moon to guide us, we caught sight of that verdant patch, and what a beauty it was!”\n\nThe commander laughs heartily as his crew unload a cornucopia of colossal herbs and roots of all colours, alongside some luminous and jagged greens rivalling the size of Kanolowele’s greatest beer barrels. The leader gestures at the  magnitude of their acquisitions. \n\n“These will feed our people for many winters,” and he laughed once more.\n\nHis laugh is an infectious one, with his entourage sharing in the fray, but the advisors at [Root.Monarch.GetTitle]’s side eye the food with a nervous expression. What should the [Root.Monarch.GetTitle] do with this tribute?"
 insyaan_ogre_flavour_events.2.a:0 "Distribute it to all in [Root.Country.GetName]."
 insyaan_ogre_flavour_events.2.b:0 "The Royal Banquet will be the largest yet!"
 insyaan_ogre_flavour_events.2.c:0 "The [Root.Monarch.GetTitle]’s men shall never go hungry again!"
 insyaan_ogre_flavour_events.2.e:0 "After all, why shouldn’t I keep it?"
 insyaan_ogre_flavour_events.2.f:0 "Perhaps we misunderstood these ‘Skyfall Ogres’?"

