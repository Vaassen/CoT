 binsplosionevents.1.t:0 "The End of Authority"
 binsplosionevents.1.d:0 "damn binwarji sucks"
 binsplosionevents.1.a:0 "oh no"

 binsplosionevents.2.t:0 "Authority Collapsed"
 binsplosionevents.2.d:0 "wow everyone hates us"
 binsplosionevents.2.a:0 "Oh no!"

 binsplosionevents.3.t:0 "Authority Restored"
 binsplosionevents.3.d:0 "all rebellious elements gone"
 binsplosionevents.3.a:0 "...but at what cost"

 binsplosionevents.4.t:0 "Ogre Magic"
 binsplosionevents.4.d:0 "We keep seeing ogres on our borders. Why are they here? They’re doing magic. Someone stop them!"
 binsplosionevents.4.a:0 "We can’t afford to right now"
 binsplosionevents.4.b:0 "Insult Tzilekal for letting ogres wander around their lands"
 binsplosionevents.4.c:0 "Perhaps we can send a mage to reason with them"

 binsplosionevents.6.t:0 "Planetouched Revolt"
 binsplosionevents.6.d:0 "A powerful planetouched has riled up peasants against the nobility"
 binsplosionevents.6.a:0 "Placate her demands"
 binsplosionevents.6.b:0 "Put her down"
 binsplosionevents.6.c:0 "Grant her a fiefdom"

 binsplosionevents.8.t:0 "Taafi Refusals"
 binsplosionevents.8.d:0 "Taafi are refusing to join the army without better compensation."
 binsplosionevents.8.a:0 "Don’t need you guys anyway"
 binsplosionevents.8.b:0 "Pay them to stop complaining"
 binsplosionevents.8.c:0 "Promise investments in their lands if they join"

 binsplosionevents.9.t:0 "Nobility Demand Replacement"
 binsplosionevents.9.d:0 "Nobility want to put one of their own on the throne instead"
 binsplosionevents.9.a:0 "I resign"
 binsplosionevents.9.b:0 "Absolutely not"
 binsplosionevents.9.c:0 "If we fail, they may have the throne"

 binsplosionevents.10.t:0 "Dendugma Steel Crusaders"
 binsplosionevents.10.d:0 "A band of religious crusaders have returned to their home in Dendugma. They will only strengthen their desire for independence if we let them."
 binsplosionevents.10.a:0 "We need them!"
 binsplosionevents.10.b:0 "Hold a celebratory festival for their return"
 binsplosionevents.10.c:0 "Let them return"

