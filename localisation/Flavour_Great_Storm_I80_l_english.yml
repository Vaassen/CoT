 I80_fun:0 "The caehnate of the Wild Hunt experiences a miraculous rejuvenation, as thousands of centaurs rally under their banner. They are driven by our challenge."
 I80_war_with_green_flame:0 "We will declare war on Green Flame and incorporate their caehnate into ours while their leader is... preoccupied. With some luck we'll capture him alive!"
 I80_green_flame_cores:0 "Owns all of Green Flames' cores"
