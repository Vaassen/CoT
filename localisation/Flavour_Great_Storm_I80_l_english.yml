 I80_smolderblaze_burning: "Smolderblaze Burning"
 desc_I80_smolderblaze_burning: "FIREISHALLFIRETHEREISNOHOPEFORTHEMTHEFLAMEMUSTBURNBRIGHTERHIGHERBRIGHTERHIGHERBRIGHTER"
 I80_tempestcallers: "Tempestcallers"
 desc_I80_tempestcallers: "Shamans who have donned the title of "Tempestcaller". They excel in all things evocation and will propel us to new heights in that field of study!"
 I80_devotion_hearts: "Devotion in our Hearts"
 desc_I80_devotion_hearts: "Our newly built temples inspire devotion in many of our subjects."
 I80_rudimentary_woodcutting_industry: "Rudimentary Woodcutting Industry"
 desc_I80_rudimentary_woodcutting_industry: "Chopping down the lumber from the northern forests just to bring them home to Zurenkhiin... These centaurs have their work cut out for them. Or not. Please laugh."
 I80_sochar_support: "Sochar Support"
 desc_I80_sochar_support: ""Father, I don't know why you would not just enforce your will. There is no need for... any of this...""
 I80_united_in_will: "United in Will"
 desc_I80_united_in_will: "Negeal. There was no other choice. It had to be done...right? The shamans seem happy, at least..."
 I80_extensive_reorganization: "Extensive Reorganization"
 desc_I80_extensive_reorganization: "Changes within the Conclave of Shamans? Curious. Nothing bad can come from this."
 I80_first_caehn_then_king: "First Caehn, then King!"
 desc_I80_first_caehn_then_king: "Dreams...hopes...desire and pride. Flowing together into one. The Ganzamh Centaurs must be integrated, if the Great Storm is to be successful in its task."
 I80_diplomat_occupied: "Occupied Diplomat"
 desc_I80_diplomat_occupied: "Our little stunt must be supported by a diplomat if it is to be successful. Where ever you wish to send him, this is more important."
 I80_slander: "Slandered"
 desc_I80_slander: "Bugger off, Great Storm!!!!! Stop being annoying!!!!!!!!!!"
 I80_the_great_storm_1: "The Great Storm"
 desc_I80_the_great_storm_1: "The Great Storm. Many a centaur and men alike drowned due to it's incredible force, pushing those it targets into the lake. We'd be lying if we said that we know how the thing works."
 I80_the_great_storm_2: "The Empowered Vortex"
 desc_I80_the_great_storm_2: "Created by hundreds of Tempestcallers channeling their powers onto a single place and now empowered by recreating that moment. Beautiful really. If it doesn't kill you horribly."
 I80_faith_assured: "Faith Assured"
 desc_I80_faith_assured: "Our task is fulfilled. The perversion of faith that was the Filustkhuga sect is no more. And once the last memory of it has faded..."
 I80_rukunai_style_monasteries: "Rukunai-style Monasteries"
 desc_I80_rukunai_style_monasteries: "Building a Temple while this modifier is active will refund 20 ducats once it is built."
 I80_men_for_beyond_the_gate: "Men for beyond the Gate"
 desc_I80_men_for_beyond_the_gate: "There are not few volunteers to support our brethren in Khaashalg. Let's standardize the process and make sure that our troops will snatch the best ones. The chaff can go die against the facestealers."
 I80_searching_for_the_divine: "Searching for the Divine"
 desc_I80_searching_for_the_divine: ""Somewhere... It needs to be somewhere in those mountains. Maybe north? What's a few thousand more dead, I NEED TO FIND THE STORMBRINGER AS SOON AS POSSIBLE!""
 I80_crisis_of_faith: "Crisis of Faith"
 desc_I80_crisis_of_faith: ""HOW DARE THESE GREAT STORM PEOPLE KILL OUR PEOPLE!!!! HOW DARE THEY TRY AND FORCE THEIR WAYS UPON US!!!!!! DEATH SHALL BE THEIR REWARD!!! AND SUFFERING AND PAIN AND MURD-""
 I80_emulant: "Emulant of the Storm King"
 desc_I80_emulant: ""It is not enough that I hear about him. I need to become him. This is what I was born to do, right? This is my purpose. My way of ascension.""
 I80_shaman_funded_temples: "Shaman-funded Temples"
 desc_I80_shaman_funded_temples: "Building a temple while this modifier is active will grant 10 project progress, as well as 10 ducats upon the completion of said temple."
 I80_an_upstart: "An Upstart"
 desc_I80_an_upstart: ""Who does this small centaur think he is? 'Oh, I'll go and the roc will be my patron, mimimimimi'. Maybe I should just rid myself of that Tempestcaller...""
 I80_to_listen: "First Lesson: To Listen is to Live"
 desc_I80_to_listen: ""-erefore instrumental that you people actually learn how to be patient. If you are just galloping with full speed into facestealers while having no masks... Well, no shit. And now there are new ones. Great job, guys.""
 I80_red_humans: "Red Humans...?"
 desc_I80_red_humans: "Red Humans with sharp ears and really cool trinkets. The red people are gone, but their trinkets remain. For your lordship to enjoy, of course. :) "
 I80_big_cat_prowess: "Prowess of the Big Cat"
 desc_I80_big_cat_prowess: ""Yo, dude. That is sick. Jumping on people and ripping them apart limb from limb. I kinda wish I was a big cat now as well...""
 I80_taryebalkharr_success: "Unlikely Success"
 desc_I80_taryebalkharr_success: "Our company has apparently split up at some point. Well, no matter. We shall reap rewards from both of them at the same time then!"
 I80_arduous_research: "Arduous Research"
 desc_I80_arduous_research: "This one is a bit difficult, my caehn. But give the shamans some time. They'll make it work."
 I80_very_arduous_research: "Extremely Arduous Research"
 desc_I80_very_arduous_research: ""My caehn, I assure you. The Tempestcallers are still fully loyal to you. Just give them some time. The current magical project is...difficult...""
 I80_windwalking: "Walking amongst the Winds"
 desc_I80_windwalking: "This is a bit of a strange one. The shamans did say that this was to be used for our traders, but it does not seem too useful? As of now, at least."
 I80_storm_wake: "Stormwake"
 desc_I80_storm_wake: "The devastation wrought by our Tempestcallers has a name now. Stormwake. Cracked Skies leading to cracked soil. A downpour never ending..."
 I80_fort_rending: "Fortrending"
 desc_I80_fort_rending: ""Oh, so you try and hide in your little stone thing? Have a thunderbolt be thrown onto you. Actually, no. Have hundreds of thunderbolts just break your little stone refuge. Not enjoying these refitted cannons, are you? Little coward man human bloke.""
 I80_increasing_demands: "Increasing Demands"
 desc_I80_increasing_demands: ""My caehn. No. There is no money missing from the coffers of the caehnate. All is as it should be. The Tempestcallers? No. Most certainly not. Yes, my caehn. I am here if you need me. Have a good night.""
 
