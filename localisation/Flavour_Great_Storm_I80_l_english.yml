 ######## WINDBEARING PROJECT ########
 #####################################
 #Event 40 - Windbearer - NOT DONE
 flavour_great_storm.51.t:0 "Windbearer"
 flavour_great_storm.51.d:0 "‘Bearing the wind’ has always been at least thought about when talking about the ways that magic can be applied. However, despite multiple noteworthy individuals being capable of such arcane arts, there has never been a centralized push to realize such dominion over it.\nThat changes today.\nOur caehn might be slightly apprehensive about his name being used for this project, but that’s his fault for having such an appropriate name!\nWe are currently sending shamans to survey the lands, but having the caehn’s court move would be a tremendous help towards our research.’"
 flavour_great_storm.51.a:0 "Moving across the plains as Irdaeos intended."
 I80_modifier_removal_tt:0 "Lasts until the stage is completed."
 I80_mage_movement_tt:0 "Moving your capital during this stage will add 25 magical experience each time."
 #Event 41 - Network of the Malukhuga - NOT DONE
 flavour_great_storm.52.t:0 "Network of the Malukhuga"
 flavour_great_storm.52.d:0 "‘We are currently in the midst of creating a network that can manifest strong gales along certain routes. We aren’t quite certain what we can use it for, but we’ll find out soon enough.\nNow, here’s an interesting thought: \nSomeone has suggested that the places of worship that we’ve seen inhabited by those Rukunai can act as a sort of amplifier. If we were to build some of our own they could be an immeasurable boon to our projection of the winds. Now, that will be costly, but the Malukhuga have agreed to recompense the caehnate if these temples are built.\nWe can alternatively choose to embrace more… conservative ways of research.’"
 flavour_great_storm.52.a:0 "Every new temple shall amplify our efforts!"
 flavour_great_storm.52.b:0 "The expenses are too high."
 I80_duration_magical_project_tt:0 "Lasts as long as the unique magical project is being researched"
 #Event 40 -The Wind in our Hair - NOT DONE
 flavour_great_storm.53.t:0 "The Wind in our Hair"
 flavour_great_storm.53.d:0 "‘Hah! Our research has culminated!\nThat breeze you are feeling? That’s not natural, that is us. With no effort of any shaman whatsoever. The temples amplify it on their own.\nNow, the direct benefits? Travelling from place to place is easier than ever, provided you travel on the appropriate routes. And although we trade little with the humans of the lake, it is undeniable that our merchants have a distinct edge over them.’"
 flavour_great_storm.53.a:0 "Helpful, although not too useful for the moment."
 #Event 41 - Other Side of the Coin - NOT DONE
 flavour_great_storm.61.t:0 "Other Side of the Coin"
 flavour_great_storm.61.d:0 "‘You’ve heard? The caehn wants us to focus on applying windbearing into armies.’\n\n‘You are the 5th person to tell me.’\n\n‘Well, how are you going to do it?’\n\n‘Pushing people into the sea with wind or something, I don’t know. I’m just annoyed. Wanted to work on something different. Something more interesting.’\n\n‘Maybe we could use the already established wind system to create high-speed arrows that pierce enemies from afar.’\n\n‘Your suggestion is noted.’"
 flavour_great_storm.61.a:0 "He liked the enthusiasm, but the idea was utter drivel."
 #Event 40 - Tempestcallers - NOT DONE
 flavour_great_storm.62.t:0 "Tempestcallers"
 flavour_great_storm.62.d:0 "‘Lightning Wielders? That name is a bit unwieldy but it can work.’\n\nThe group of highly skilled shamans was aggressively ideating their next steps.’\n\n‘Nah, that one caehnate calls itself like that. Would send mixed messages to the caehn. You know how he is. We might get all blown up if he even suspects any disloyalty.’\n\nThe comment was meant as a joke, but it was not devoid of some truth.’\n\n‘So Stormtamer is ruled out, Windwaker sounds strange and Tempestbringer makes it sound calamitous.’\n\n‘Tempestcallers?’ ’\n\n‘The order of Tempestcallers, calling tempests onto the unlucky people who stand in their way! I like it.’\n\n‘Without that “Order” part. Makes it sound like you are part of those rukunai monks.’  ’\n\n‘Wait, I think the caehn is nearby. To your stations, everyone!’"
 flavour_great_storm.62.a:0 "‘Seems like the newly trained shaman-generals are hard at work!’"
 I80_war_mage_experience_tt:0 "Recruiting a war mage will grant us 50 project progress until the end of the stage."
 #Event 41 - Raining World - NOT DONE
 flavour_great_storm.63.t:0 "Raining World"
 flavour_great_storm.63.d:0 "The river is flooding. This is really bad.\nErkyll would get into so much trouble. \nOh, there go the crops. Someone's going hungry this winter. \nWait, there’s a whole flock of sheep there. Oh no!\nNot the sheep!\nWhy are they standing around there!?\nRun, please. Erkyll could do naught but watch as the sheep just passively waited until the river flooded enough to take them into the sea. A most horrifying sight.\nThis whole thing is a disaster. He just wanted to test out some rain spells. Just to see how good they’d be at stopping invading Filustkhuga.\nThat mission might be accomplished, but–\nOops, there goes another sheep. This time he could hear it bleat. Or was that just his imagination?\nHe could already imagine hearing his instructor say:"
 flavour_great_storm.63.a:0 "‘Beautiful work, Tempestcaller!’ Wait, what?"
 I80_war_magic_experience_tt:0 "We will gain half the mana spent on war magic back as magical project progress.\nLasts until the end of the project."
 #Event 40 - Downpour - NOT DONE
 flavour_great_storm.64.t:0 "Downpour"
 flavour_great_storm.64.d:0 "It has been raining for 3 straight days. The plains that the camp was sitting upon were turning into the worst kind of mud. No one wants to be here.\nThe rather loud prattling and crackling of the rain was barely audible to most people here at this point. But sleeping was miserable. The close lightning strikes made it impossible. 3 tents were destroyed by them already. \nThe envoy was to come today. Everyone from the entire camp, drenched in rain, sat there on the precipice just waiting for the slacker to arrive. They saw him fall into the mud 4 times when he approached. \nVindication.\nThe camp was not packed together. It was deemed appropriate by everyone to just leave the place. \n\n‘Final Result: Demoralizing?’"
 flavour_great_storm.64.a:0 "Rain breaks down all forms of resistance, given enough time."
 I80_storm_wake_tt:0 "Lands occupied by you while either "Elemental Fury" or "Shock and Awe" are cast will severely hamper enemies. "
 #Event 41 - Independent Research - NOT DONE
 flavour_great_storm.71.t:0 "Independent Research"
 flavour_great_storm.71.d:0 "‘The conclave will now concern itself with the request of Tempestcaller Thaimalk of Codörgann.’\n\n‘The nature of the Swirling Beast of Tirughuun is still poorly understood by the members of the conclave. It was created during the Drowning of the Flame, yet we don’t know how the caehn -\n- he is not here, right? Oh, he left? Good. -\n- managed to actually project it. Why or what is powering its continued existence. I’m suspecting that the caehn will not respond positively towards our inquiry, so I’d request that we keep that between us. \nI got off-track. The actual inquiry is that the funds of the conclave be used to investigate the nature of the vortex. It would be great if someone could also convince the caehn to move the court to the vortex, just so we have more hoofs on the plain.’\n\n‘The request will hereby be voted on.’"
 flavour_great_storm.71.a:0 "A mere formality in this case."
 I80_tirughuun_capital_tt:0 "Moving our capital to Tirughuun will grant us 50 magical project experience.\nIt would be prudent to start constructing a mage tower there..."
 #Event 40 - Understanding the Vortex - NOT DONE
 flavour_great_storm.72.t:0 "Understanding the Vortex"
 flavour_great_storm.72.d:0 "The sheep are placed and ready to be led into the storm.\nFlock Log 55 is about to begin.\nIt would be a tad dangerous for the sheep to be directly observed, so the Tempestcallers opted for the most sensible solution: Having some diviners on the side that give direct information on how the sheep are flung around in the Swirling Beast. \n\n‘Sheeps 1 to 3 were ripped to shreds it seems?’\n\n‘5 is too scared to move.’\n\n‘If you look upwards you can see 6 to 11 experiencing flight.’\n\n‘12 to 20 are getting pushed into the sea.’\n\n‘And it seems like 4 is surviving this round. Again. That is 31 times in a row!\nThaimallk…’"
 flavour_great_storm.72.a:0 "‘...that’s another 30 rams for you! You are on a roll!’"
 flavour_great_storm.72.b:0 "‘...don’t tell me you rigged the Whirlwind when we empowered it.’"
 I80_tirughuun_mage_tower_tt:0 "Building a mage tower in Tirughuun will propel their research to new heights!"
 #Event 41 - Swirling, Endlessly - NOT DONE
 flavour_great_storm.73.t:0 "Swirling, Endlessly"
 flavour_great_storm.73.d1:0 "Greetings court mage!\nThe Tempestcallers tasked with analyzing the nature of the Whirlwind have made a breakthrough!\nThrough the tragic demise of Sheep 4 we were able to ascertain that there are strange artifacts buried in the exact spot where the sheep was hiding out. A brave crew of one Tempestcaller and 3 sheep were sent to retrieve the artifacts and they did. We did suffer 2 casualties, but their sacrifice was invaluable.\nThe artifacts that we now have are… clearly not made by humans or harpies. They’d already own all of the plains if it were them who built them.\nSomeone - we suspect the caehn or an affiliate of his - got their hands on them somehow and channeled great amounts of storm magic into them. \nThe result is this great Vortex left behind in the wake of that war. We can’t remove it. \n\nNow, we can’t replicate those things. But we can create imitations. They are bulky and heavy, however. So you’d only see them on great machines of war, if we were to ever build some. And provided we are able to channel magic into them."
 flavour_great_storm.73.d2:0 "Greetings court mage!\nThe Tempestcallers tasked with analyzing the nature of the Whirlwind have made a breakthrough!\nThrough the tragic demise of Sheep 4 we were able to ascertain that there are strange artifacts buried in the exact spot where the sheep was hiding out. A brave crew of one Tempestcaller and 3 sheep were sent to retrieve the artifacts and they did. We did suffer 2 casualties, but their sacrifice was invaluable.\nThe artifacts that we now have are… clearly not made by humans or harpies. They’d already own all of the plains if it were them who built them.\nThey do bear a striking resemblance to the arcane foci that Taryebalkharr has found beyond the gate, which is quite the curious connection.\nSomeone - we suspect the caehn or an affiliate of his - got their hands on them somehow and channeled great amounts of storm magic into them. \nThe result is this great Vortex left behind in the wake of that war. We can’t remove it. \n\nNow, we can’t replicate those things. But we can create imitations. They are bulky and heavy, however. So you’d only see them on great machines of war, if we were to ever build some. And provided we are able to channel magic into them."
 flavour_great_storm.73.a:0 "‘The caehn in that war was not bearing the gift of magic, so how…?’ "
 I80_fortrending_tt:0 "Casting either "Elemental Fury" or "Flaming Munitions" will grant us additional buffs."

 #MODIFIERS AND RELATED TOOLTIPS
 I80_empowerment_of_the_filustkhuga: "Empowerment of the Filustkhuga"
 desc_I80_empowerment_of_the_filustkhuga: "We shall be with Irdaeos. One way or another!\n"
 I80_council_of_shamans: "Council of Shamans"
 desc_I80_council_of_shamans: "Caehn Vranulk has elevated the disparate Malukhuga into one entity, capable of advancing our magic in unique ways.\n"
 I80_flight_towards_wild_hunt: "Flight towards Wild Hunt"
 desc_I80_flight_towards_wild_hunt: "We are experiencing a drain of new recruits. They keep on defecting to Wild Hunt in response to Great Storm's challenge\n"
 I80_worst_weeks_of_the_caehn: "Worst Weeks of the Caehn"
 desc_I80_worst_weeks_of_the_caehn: ""§GSomeone...please... make it stop...§!"\n"
 I80_system_of_understanding_mod: "System of Understanding"
 desc_I80_system_of_understanding_mod: "The advances of magical infrastructure allows us to understand Irdaeos' gift better.\n"
 I80_smolderblaze_bound: "Smolderblaze Bound"
 desc_I80_smolderblaze_bound: "Why kill the strongest mage of Nuzurbokh? Make him teach our own!\n"
 I80_smolderblaze_burning: "Smolderblaze Burning Bright"
 desc_I80_smolderblaze_burning: "§RFIREISHALLFIRETHEFLAMEMUSTBURNBRIGHTERHIGHERBRIGHTERHIGHERBRIGHTERPLEASEHIGHERPLEASEBRIGHTERHIGHERCACKLEBRIGHTERHEARTHECRACKLETHEHIGHERVOICESWITHINBRIGHTER§!\n"
 I80_tempestcallers: "Tempestcallers"
 desc_I80_tempestcallers: "Shamans who have donned the title of "Tempestcaller". They excel in all things evocation and will propel us to new heights in that field of study!\n"
 I80_devotion_hearts: "Devotion in our Hearts"
 desc_I80_devotion_hearts: "Our newly built temples inspire devotion in many of our subjects.\n"
 I80_rudimentary_woodcutting_industry: "Rudimentary Woodcutting Industry"
 desc_I80_rudimentary_woodcutting_industry: "Chopping down the lumber from the northern forests just to bring them home to Zurenkhiin... These centaurs have their work cut out for them. Or not. Please laugh.\n"
 I80_sochar_support: "Sochar Support"
 desc_I80_sochar_support: ""Father, I don't know why you would not just enforce your will. There is no need for... any of this..."\n"
 I80_united_in_will: "United in Will"
 desc_I80_united_in_will: "Negeal. There was no other choice. It had to be done...right? The shamans seem happy, at least...\n"
 I80_extensive_reorganization: "Extensive Reorganization"
 desc_I80_extensive_reorganization: "Changes within the Conclave of Shamans? Curious. Nothing §Rbad§! can come from this.\n"
 I80_first_caehn_then_king: "First Caehn, then King!"
 desc_I80_first_caehn_then_king: "Dreams...hopes...desire and pride. Flowing together into one. The Ganzamh Centaurs must be integrated, if the Great Storm is to be successful in its task.\n"
 I80_diplomat_occupied: "Enacting the Plan"
 desc_I80_diplomat_occupied: ""Yes. The plan. The plan. Of course. I'll have the details in a moment. The plan, yes.""
 I80_slander: "?!?!?!?!?!"
 desc_I80_slander: "It appears that we were burned. Heavily\n"
 I80_the_great_storm_1: "The Great Storm"
 desc_I80_the_great_storm_1: "The Great Storm. Many a centaur and men alike drowned due to it's incredible force, pushing those it targets into the lake. We'd be lying if we said that we know how the thing works.\n"
 I80_the_great_storm_2: "The Empowered Vortex"
 desc_I80_the_great_storm_2: "Created by hundreds of Tempestcallers channeling their powers onto a single place and now empowered by recreating that moment. Beautiful really. If it doesn't kill you horribly.\n"
 I80_faith_assured: "Faith Assured"
 desc_I80_faith_assured: "Our task is fulfilled. The perversion of faith that was the Filustkhuga sect is no more. And once the last memory of it has faded...\n"
 I80_rukunai_style_monasteries: "Rukunai-style Monasteries"
 desc_I80_rukunai_style_monasteries: "§TBuilding a Temple while this modifier is active will refund 20 ducats once it is built.§!\n"
 I80_men_for_beyond_the_gate: "Men for beyond the Gate"
 desc_I80_men_for_beyond_the_gate: "There are not few volunteers to support our brethren in Khaashalg. Let's standardize the process and make sure that our troops will snatch the best ones. The chaff can go die against the facestealers.\n"
 I80_searching_for_the_divine: "Searching for the Divine"
 desc_I80_searching_for_the_divine: ""Somewhere... It needs to be somewhere in those mountains. Maybe north? What's a few thousand more dead, I NEED TO FIND THE STORMBRINGER AS SOON AS POSSIBLE!"\n"
 I80_crisis_of_faith: "Crisis of Faith"
 desc_I80_crisis_of_faith: ""HOW DARE THESE GREAT STORM PEOPLE KILL OUR PEOPLE!!!! HOW DARE THEY TRY AND FORCE THEIR WAYS UPON US!!!!!! DEATH SHALL BE THEIR REWARD!!! AND SUFFERING AND PAIN AND MURD-"\n"
 I80_emulant: "Emulant of the Storm King"
 desc_I80_emulant: ""It is not enough that I hear about the Storm King. I need to become him. This is what I was born to do, right? This is my purpose. My way of ascension."\n"
 I80_shaman_funded_temples: "Shaman-funded Temples"
 desc_I80_shaman_funded_temples: "§TBuilding a temple while this modifier is active will grant 10 project progress, as well as 10 ducats upon the completion of said temple.\n\n§!§YRemoved when no longer researching the Windbearing Project.§!"
 I80_an_upstart: "An Upstart"
 desc_I80_an_upstart: ""Who does this small centaur think he is? 'Oh, I'll go and the roc will be my patron, mimimimimi'. Maybe I should just rid myself of that Tempestcaller..."\n"
 I80_to_listen: "First Lesson: To Listen is to Live"
 desc_I80_to_listen: ""-erefore instrumental that you people actually learn how to be patient. If you are just galloping with full speed into facestealers while having no masks... Well, who could have thought. And now there are new ones. Great job, guys."\n"
 I80_red_humans: "Red Humans...?"
 desc_I80_red_humans: "Red Humans with sharp ears and really cool trinkets. The red people are gone, but their trinkets remain. For your lordship to enjoy, of course. :) \n"
 I80_big_cat_government: "Big Cat Governmental Proficiency"
 desc_I80_big_cat_government: "Our new cat advisor is bringing new ideas to the table! He is exactly what we need at this moment. Though, things do seem to get missing more often now..."
 I80_big_cat_prowess: "Prowess of the Big Cat"
 desc_I80_big_cat_prowess: ""Yo, dude. That is sick. Jumping on people and ripping them apart limb from limb. I kinda wish I was a big cat now as well..."\n"
 I80_taryebalkharr_success: "Unlikely Success"
 desc_I80_taryebalkharr_success: "Our company has apparently split up at some point. Well, no matter. We shall reap rewards from both of them at the same time then!\n"
 I80_arduous_research: "Arduous Research"
 desc_I80_arduous_research: "This one is a bit difficult, my caehn. But give the shamans some time. They'll make it work.\n\n§YRemoved when no longer researching the Windbearing Project.§!"
 I80_very_arduous_research: "Extremely Arduous Research"
 desc_I80_very_arduous_research: ""My caehn, I assure you. The Tempestcallers are still fully loyal to you. Just give them some time. The current magical project is...difficult..."\n\n§YRemoved when no longer researching the Windbearing Project.§!"
 I80_windwalking: "Walking amongst the Winds"
 desc_I80_windwalking: "This is a bit of a strange one. The shamans did say that this was to be used for our traders, but it does not seem too useful? As of now, at least."
 I80_storm_wake: "Stormwake"
 desc_I80_storm_wake: "The devastation wrought by our Tempestcallers has a name now. Stormwake. Cracked Skies leading to cracked soil. A downpour never ending...\n§YRemoved when unsieged.§!\n"
 I80_fort_rending: "Fortrending"
 desc_I80_fort_rending: ""Oh, so you try and hide in your little stone thing? Have a thunderbolt be thrown onto you. Actually, no. Have hundreds of thunderbolts just break your little stone refuge. Not enjoying these refitted cannons, are you? Little coward man human bloke.""
 I80_increasing_demands: "Increasing Demands"
 desc_I80_increasing_demands: ""My caehn. No. There is no money missing from the coffers of the caehnate. All is as it should be. The Tempestcallers? No. Most certainly not. Yes, my caehn. I am here if you need me. Have a good night."\n§YRemoved when the Tempestcallers have fulfilled their research.§!\n"
