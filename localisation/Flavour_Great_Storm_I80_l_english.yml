 I80_project_lvl2_tt: "“It is not enough that our sad little wooden imitations might float a tiny bit better on the water. We must prepare for our purpose!”"
 I80_project_lvl3_tt: "“As the flame has been drowned, and our revenge has found its mark, we are left wondering: What is that thing the caehn summoned? A Vortex, of some sort?” \n“A beast, voracious in its lust for murder. Drowning those it deems evil. Quite fitting, really.”"