 ### Generic Mission custom tooltips
 #Missions Column 1
 AYN_military_innovations_mod_refresh_yes_tt:0 "£yes£If we have 5 or more §YQeyikul Reputation§! when we form §YJinnakah§! we will §YRenew§! this effect for §Y20 years§!"

 AYN_military_innovations_mod_refresh_no_tt:0 "£no£If we have 5 or more §YQeyikul Reputation§! when we form §YJinnakah§! we will §YRenew§! this effect for §Y20 years§!"

 AYN_50_50_convert_provinces_tt:0 "§Y50%§! of our §YTribal Land Provinces§! will convert to §YGenie Cult§!"
 #Missions Column 2
 AYN_ardimyan_prosperity_yes_tt:0 "£yes£If §YEvery Tribal Land Province§! does not have any §YQeyikul Warbands§! we will gain an Extra §G1.5 Monthly Tribal Development§!"

 AYN_ardimyan_prosperity_no_tt:0 "£no£If §YEvery Tribal Land Province§! does not have any §YQeyikul Warbands§! we will gain an Extra §G1.5 Monthly Tribal Development§!"
 #Missions Column 3
 AYN_event_insight_meeting_of_tribes:0 "§GEvent Insight§!\n\nWe will call the Guryadaggan Tribes to a meeting where we can either try to resolve any conflicts between tribes, increasing their §YOpinion§! of us and our [Root.Monarch.GetTitle]'s §YDiplomatic Reputation§! or we can join in the arguments to increase our §YPrestige§! and increase our troops §YShock Damage§! whilst also reducing our [Root.Monarch.GetTitle]'s §YDiplomatic Reputation§!"

 AYN_walaalay_bonds_1_effect_tt:0 "§TIf:§!\nIf we have an Ally with §G200 Opinion§! and §G65 Trust§! we will vassalise them"

 AYN_walaalay_bonds_2_effect_tt:0 "If we have §YNo Allies§! we will stop being §RHistorical Friends§! with every other tribe and gain the §YAgainst the World§! modifier"

 AYN_every_loyal_vassal_TD_tt:0 "For every loyal Guryadagga vassal we will get §G0.0125 Monthly Tribal Development§!\n"

 AYN_against_world_refresh_yes_tt:0 "If we have the §YAgainst The World§! modifier we will:\n£yes£ Refresh '§YAgainst The World§!' for §Y20 years§!, §Yupgrading§! it to the following effects:\n Movement Speed §G+10%§!\n Siege Ability §G+10%§!\n Liberty Desire in Subjects §G-7.50%§!\n"

 AYN_against_world_refresh_no_tt:0 "If we have the §YAgainst The World§! modifier we will:\n£no£ Refresh '§YAgainst The World§!' for §Y20 years§!, §Yupgrading§! it to the following effects:\n Movement Speed §G+10%§!\n Siege Ability §G+10%§!\n Liberty Desire in Subjects §G-7.50%§!\n"

 AYN_change_government_tt:0 "We will become a §YTheocracy§! along with all of our subjects"

 AYN_get_6063_6584_from_reforming_tt:0 "\nIf §YArdim Qarast§! or §YQasrig Alahmar§! is owned by one of our subjects, they will cede the province to us\n"
 
 AYN_tribal_development_explaning_tt:0 "For every point of §YTribal Development§! up to §Y30§! we develop our provinces using it \n\n we currently will gain §Y[ROOT.tribal_development_variable.GetValue]§! development"

 ardimyan_sultanate_planetouched_tt:0 "Our §YRulers§! and §YHeirs§! will §GAlways§! be Planetouched"
 #Mission Column 4
 AYN_chosen_of_ardimya_modifier_desc_tt:0 "Whenever we would gain a §YCult Power§! to cast in our §YIncantations§! we will have a §Y10%§! chance to gain two §YCult Power§! instead of one"

 AYN_chosen_of_ardimya_mana_gain_tt:0 "\nIf we have cast §YSix Incantations§! (Currently [ROOT.GeniCultUsageCounter.GetValue]) where two of which have cost §YThree§! or more §YCult Power§! (Currently [ROOT.GeniCultUsageCounter3plus.GetValue])"

 AYN_chosen_of_ardimya_yes_tt:0 "£yes£Whenever we cast a §YMajor Incantation§! or higher we will also gain §M10 Mana§! for each §YCult Power§! we spend with a maximum gain of §M30 Mana§!"

 AYN_chosen_of_ardimya_no_tt:0 "£no£Whenever we cast a §YMajor Incantation§! or higher we will also gain §M10 Mana§! for each §YCult Power§! we spend with a maximum gain of §M30 Mana§!"


 ### Modifier locs
 AYN_chosen_of_ardimya_desc:0 "Whenever we would gain a §YCult Power§! to cast in our §YIncantations§! we will have a §Y10%§! chance to gain two §YCult Power§! instead of one"


 ### Qeyikul System
 AYN_lethiathan_is_really_annoying_tt:0 "Due to the way Lethiathan is coded, after you defeat a medium warband you will have to wait for a month tick to get the add tribal land discount"

 qeyikul_coloniser_notification_tt:0 " Around Ardimya there are roaming bands of Qeyikul, if you colonise a province with a warband the Qeyikul will attack it. If we do not defeat them  the settlement will be §RAbandoned§! and we will not be able to colonise the province for 3 years. \n\n If you didn't colonise the province and have instantly colonised it though a mission then you will be able to use a decision to attack the warbands"
 AYN_small_qeyikul_tt:0 "We will fight a §YSmall§! Qeyikul Warband, due to size it will have §YLow Organisation§! and will therefore be easier to defeat"
 AYN_medium_qeyikul_tt:0 "We will fight a §YMedium§! Qeyikul Warband"
 AYN_large_qeyikul_tt:0 "We will fight a §RLarge§! Qeyikul Warband, due to their immense size it is recomended to provoke these warbands with caution"

 ### Legacy System
 you_got_a_legacy_tt:0 "You have gain a §YGenie Legacy§! by migrating giving you a perma modifier (they dont do anything else rn)\n there are 4 of them in total (Amubariz starts with one - subjugate them to get it)"
 S87_we_start_with_a_legacy_tt:0 "In your tribes possenion you have a §YGenie Legacy§! which gives you a perma modifier (they dont do anything else rn)\n there are 4 of them in total"

 ### Non-Generic custom tooltips
 #S85
 S85_green_hierophant_yes_tt:0 "£yes£We will use minor invisiblity wards to kidnap a random enemy general, forcing them to work as one of our commanders. However even if we caputre a War Wizard they will not use their magic for us (We will not be able to get a 7+ Shock general)"
 S85_green_hierophant_no_tt:0 "£no£ We are not at war so use the Hierophant to capture an enemy general"
 S85_3_units_in_Kazriadoka_tt: "If we have 3 units in the province of Kaziradoka they will gain a buff and we will gain Kombedak as an free accepted culture"
 S85_has_activated_due_judgement_tt:0 "We have currently or previously activated the §YMajor§! Genie Cult Incantation §YDue Judgement§!"
 S85_has_warmth_of_life_tt:0 "We currently have the effect §YWarmth of life§! from casting an Incantation"
 S85_unlock_unique_incantation_tt:0 "We will unlock a unique Genie Cult Incantation called §YGreen Hierophant§!, a powerful spell which will allow us to steal a top-brass random enemy general"
 S85_in_5_years_province_better_tt:0 "In Seven and a half years, Ardim Qarast will gain 1/1/1 development along with a §YMerfolk Settlement§!"

 #S86
 S86_raid_human_can_fight_tt:0 "As a player owns a province in the Baashi Badda area they can choose to fight our raid if we raid their land"
 S86_ships_needed_to_raid_islands_tt:0 "If we have 4 ships we can also raid §YCusuub Qasr§! and §YMagaalad Qasr§!"
 S86_every_none_island_province_gets_raided_tt:0 "We will §YRaid Qasri Almadeheda§! and §YDagaalsh Baashi§!"
 S86_unique_genie_cult_tt:0 "Every owned proivnce in Djinnakah subcontinent will get §G+20% Friendly Movement Speed§! for §Y20 Years§!"
 S86_unlock_unique_incantation_tt:0 "We will unlock a unique Genie §YCult Incantation§! called §YHighway Star§!, a powerful spell which will allow us to travel faster in any owned province in the Djinnakah region"

 #S87
 S87_unlock_unique_incantation_tt:0 "We will unlock a unique Genie §YCult Incantation§! called §YPlanet Waves§!, a powerful spell which will boost our armies shock damage for a short period"
 S87_has_any_other_legacy_tt:0 "We have any other non-Faasas §YLegacy§!"
 S87_manpower_gain_from_incantations_tt:0 "Whenever we cast an §YIncantations§! we will gain 1000 manpower per §YCult Power§! we used to cast it"
 S87_affinity_with_balsam_tt:0 "Up to 3 Provinces with a §YPlant§! trade goods which is either owned by us or is in our §YTribal Land§! will recive the §YAffinty with Balsam§! Modifier.\nEvery §YIncense§! trade good province we currently own will also get this modifier"

 #S88
 S88_unlock_unique_incantation_tt:0 "We will unlock a unique Genie §YCult Incantation§! called §YAqua Necklace§!, a powerful spell which will summon sailors for us depending on how many merfolk settlements we have in our provinces or tribal land"
 S88_sea_migration_tt:0 "We will §YMigrate§! across the seas and claim the land we find as our §YTribal Land§!"
 S88_we_have_migrated_here_before:0 "§RWARNING§!\n This province is already our §YTribal Land§!, we will gain nothing for migrating here\n"
 S88_come_back_to_the_mainland_tt:0 "We will return back to §YAwliyo Aadan§! and the mainland of Ardimya"
 S88_gain_terra_cores_on_island_tt:0 "If we have every island in Ardmiya, apart from §YPumzish Haayo§!, as apart of our §YTribal Land§! we will get §YTerratorial Cores§! on §YCusuub Qasr§! and §YMagaalad Qasr§!"

