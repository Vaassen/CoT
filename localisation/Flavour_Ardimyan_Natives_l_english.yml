 qeyikul_coloniser_notification_tt:0 " Around Ardimya there are roaming bands of Qeyikul, if you colonise a province with a warband the Qeyikul will attack it. If we do not defeat them  the settlement will be §RAbandoned§! and we will not be able to colonise the province for 3 years. \n\n If you didn't colonise the province and have instantly colonised it though a mission then you will be able to use a decision to attack the warbands"

 AYN_military_innovations_mod_refresh_tt:0 "§TIf§! we have 5 or more §YQeyikul Reputation§! when we form §YJinnakah§! we will renew this modifier for §Y20 years§! (even if we have lost it)"

 AYN_every_loyal_vassal_TD_tt:0 "For every loyal Guryadagga vassal we will get §G0.0125 Monthly Tribal Development§!"

 AYN_against_world_refresh_tt:0 "\nIf we have the §YAgainst The World§! modifier we will: \n §YRefresh§! '§YAgainst The World§!' for §Y20 years§!, §Yupgrading§! it to the following effects:\n Movement Speed §G+10%§!\n Siege Ability §G+10%§!\n Liberty Desire in Subjects §G-7.50§!\n"

 AYN_tribal_development_explaning_tt:0 "For every point of tribal development up to 25 on the year we reformed we will get an equivalent amount of development in our provinces \n\n we currently will gain §Y[ROOT.tribal_development_variable.GetValue]§! development"

 AYN_walaalay_bonds_1_effect_tt:0 "If we have an Ally with §G200 Opinion§! and §G65 Trust§! we will vassalise them"

 AYN_walaalay_bonds_2_effect_tt:0 "If we have no allies we will §RStop§! being §YHistorical Friends§! with every other tribe and gain the §YAgainst the World§! modifier"

 AYN_change_government_tt:0 "We will become a §YTheocracy§! along with all of our subjects"

 ardimyan_sultanate_planetouched_tt:0 "Our §YRulers§! and §YHeirs§! will §GAlways§! be Planetouched"

 AYN_chosen_of_ardimya_mana_gain_tt:0 "\nIf we have cast Six §YIncantations§! where two of which have cost three or more §YCult Power§! whenever we cast an §YIncantation§! we will also gain §M10 Mana§! per level of Incantation cast with a maximum of §M30 mana§! gained"

 AYN_chosen_of_ardimya_no_modifier_desc_tt:0 "Whenever we would gain a §YCult Power§! to cast in our §YIncantations§! we will have a §Y10%§! chance to gain two §YCult Power§! instead of one"

 AYN_chosen_of_ardimya_desc:0 "Whenever we would gain a §YCult Pow#r§! to cast in our §YIncantations§! we will have a §Y10%§! chance to gain two §YCult Power§! instead of one"

 AYN_lethiathan_is_really_annoying_tt:0 "Due to the way Lethiathan is coded, after you defeat a medium warband you will have to wait for a month tick to get the add tribal land discount"

 AYN_50_50_convert_provinces_tt:0 "As we pillages the non-belivers in Ardimya half of our §YTribal Land§! provinces will convert to §YYGenie Cult§!"


