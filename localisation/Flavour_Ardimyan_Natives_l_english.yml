 qeyikul_coloniser_notification_tt:0 " Around Ardimya there are roaming bands of Qeyikul, if you colonise a province with a warband the Qeyikul will attack it. If we do not defeat them  the settlement will be §RAbandoned§! and we will not be able to colonise the province for 3 years. \n\n If you didn't colonise the province and have instantly colonised it though a mission then you will be able to use a decision to attack the warbands"

 AYN_every_loyal_vassal_TD_tt:0 "For every loyal Guryadagga vassal we will get §G0.0125 Monthly Tribal Development§!"

 AYN_against_world_refresh_tt:0 "\nIf we have the §RAgainst The World§! modifier we will refresh it for 20 more years and upgrade it with §G-7.5% Liberty Desire in Subjects§!"

 AYN_tribal_development_explaning_tt:0 "For every point of tribal development up to 25 on the year we reformed we will get an equivalent amount of development in our provinces \n\n we currently will gain §Y[ROOT.tribal_development_variable.GetValue]§! development"

 AYN_walaalay_bonds_tt:0 "If we have an Ally with §G200 Opinion§! and §G65 Trust§! we will vassalise them\n\nIf we have no allies we will stop being §RHistorical Friends§! with every other tribe and gain the §RAgainst the World§! modifier"

 AYN_change_government_tt:0 "We will become a §YTheocracy§! along with all of our subjects"

 ardimyan_sultanate_planetouched_tt:0 "Our §YRulers§! and §YHeirs§! will §GAlways§! be Planetouched"

 AYN_chosen_of_ardimya_mana_gain_tt:0 "\nIf we have cast Six §YIncantations§! where two of which have cost three or more §YCult Power§! whenever we cast an §YIncantation§! we will also gain §M10 Mana§! per level of Incantation cast with a maximum of §M30 mana§! gained"

 AYN_chosen_of_ardimya_no_modifier_desc_tt:0 "Whenever we would gain a §YCult Poweer§! to cast in our §YIncantations§! we will have a §Y10%§! chance to gain two §YCult Power§! instead of one"

 AYN_chosen_of_ardimya_desc:0 "Whenever we would gain a §YCult Poweer§! to cast in our §YIncantations§! we will have a §Y10%§! chance to gain two §YCult Power§! instead of one"


