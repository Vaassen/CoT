 ### Qeyikul System
 AYN_lethiathan_is_really_annoying_tt:0 "Due to the way Lethiathan is coded, after you defeat a medium warband you will have to wait for a month tick to get the add tribal land discount"

 qeyikul_coloniser_notification_tt:0 " Around Ardimya there are roaming bands of Qeyikul, if you colonise a province with a warband the Qeyikul will attack it. If we do not defeat them  the settlement will be §RAbandoned§! and we will not be able to colonise the province for 3 years. \n\n If you didn't colonise the province and have instantly colonised it though a mission then you will be able to use a decision to attack the warbands"

