 # Events
 flavour_samsumbat.0.title: "A New Republic" #placeholder
 flavour_samsumbat.0.desc: "The revolt was 5 years ago. Our government is new and inefficient. We will thrive." #placeholder
 flavour_samsumbat.0.a: "The will of the people" #placeholder
 flavour_samsumbat.1.title: "The Constitution" #placeholder
 flavour_samsumbat.1.desc: "Do we want authority to be more centralised (moderate) or decentralised (radical)?" #placeholder
 flavour_samsumbat.1.a: "Centralised" #placeholder
 flavour_samsumbat.1.b: "Decentralised" #placeholder
 flavour_samsumbat.2.title: "Guild Support" #placeholder
 flavour_samsumbat.2.desc: "We support the guilds, and the guilds support the government" #placeholder
 flavour_samsumbat.2.a: "Adventurer support" #placeholder
 flavour_samsumbat.2.b: "Clergy support" #placeholder
 flavour_samsumbat.2.c: "Mage support" #placeholder
 flavour_samsumbat.2.d: "Merchant support" #placeholder
 flavour_samsumbat.3.title: "Slave Agitators" #placeholder
 flavour_samsumbat.3.desc: "Our enslaved brothers and sisters need some help" #placeholder
 flavour_samsumbat.3.a: "Rise up!" #placeholder
 flavour_samsumbat.4.title: "The First Amendment" #placeholder
 flavour_samsumbat.4.desc: "Do we want military to answer to the mayor (moderate) or the war council (radical)?" #placeholder
 flavour_samsumbat.4.a: "Centralised" #placeholder
 flavour_samsumbat.4.b: "Decentralised" #placeholder
 flavour_samsumbat.5.title: "The Fifth Amendment" #placeholder
 flavour_samsumbat.5.desc: "Does people include the 'monstrous' races (radical) or not (moderate)?" #placeholder
 flavour_samsumbat.5.a: "No monsters" #placeholder
 flavour_samsumbat.5.b: "We are all people" #placeholder
 flavour_samsumbat.6.title: "We Can Free Them All" #placeholder
 flavour_samsumbat.6.desc: "Our beginnings were humble - the liberation of a small group of mine slaves under Maracout for self-rule. We knew we had to deal a fatal blow to the slavers in Saqraxat or we would never be safe. But now...now we see that our vision was too narrow. Look at how much better off the people are, at the prosperity of our realm. There are countless slaves in the world. We can free them all." #placeholder
 flavour_samsumbat.6.a: "We must free them all!" #placeholder
 flavour_samsumbat.7.title: "Slave Agitators" #placeholder
 flavour_samsumbat.7.desc: "Our enslaved brothers and sisters in Khetepara are ready to rise up. They just need some financial and military help - help we can provide." #placeholder
 flavour_samsumbat.7.a: "Together we rise" #placeholder
 flavour_samsumbat.8.title: "Arrogant Mages" #placeholder
 flavour_samsumbat.8.desc: "The mages of Muhaqaar grew arrogant, even before becoming governors of the area. Using their gifts to bind their slaves' minds? Despicable. With the liberation of those enslaved in the tower and free distribution of the research therein, we give our people the freedom and resources they need to study magic for the better of all. It also serves as a reminder that the power of Nirakhet surpasses all" #placeholder
 flavour_samsumbat.8.a: "Magic ability does not make one superior" #placeholder
 flavour_samsumbat.8.a.tt:0 "Every province in the §YLeta Muhaqaar§! or §YShena Muhaqaar§! areas that are not §YNirakhetist§! gain:"
 flavour_samsumbat.9.title: "Show Them The Way" #placeholder
 flavour_samsumbat.9.desc: "Aakhetist, Elikhetist, and heathen alike have not treated Mother Nirakhet with the reverence she deserves. With a new great temple erected where the sacred lake meets the river, our priests given full oversight over the lands around the lake, and large public sermons being given in the area, the people long oppressed can begin to learn about the goddess who truly cares for them." #placeholder
 flavour_samsumbat.9.a: "Mother knows best" #placeholder
 flavour_samsumbat.9.a.tt.1: "The §YDevelopment of Temples§! clergy privilege now gives §G+3%§! Local Missionary Strength for §YTemples§! and §YCathedrals§!"
 flavour_samsumbat.9.a.tt.2: "The §YReligious Culture§! clergy privilege now gives §G+3%§! Local Missionary Strength for §YTemples§! and §YCathedrals§!"
 flavour_samsumbat.10.title: "Improved Mine Safety" #placeholder
 flavour_samsumbat.10.desc: "Our heritage - toiling in the mines for our Kheteratan masters, cruel overlords with no regard for the loss of life in the dangerous tunnels. No longer will our people risk their lives for precious stones. We have invested heavily in new safety protocols and equipment." #placeholder
 flavour_samsumbat.10.a: "Every life is important" #placeholder
 flavour_samsumbat.10.a.tt.1: "Every owned §YCopper§!, §YIron§!, or §YGems§! province gains:"
 flavour_samsumbat.10.a.tt.2: "From now, any §YCopper§!, §YIron§!, or §YGems§! province that has production developed §Ytwice§! will gain §YImproved Mine Safety§!"
 flavour_samsumbat.11.title: "The Emancipation Proclamation" #placeholder
 flavour_samsumbat.11.desc: "No more slavery! We will tear down the palace, the symbol of oppression!" #placeholder
 flavour_samsumbat.11.a: "No more slaves" #placeholder
 flavour_samsumbat.11.a.tt: "§Y9§! random provinces will gain §Y1§! random development\n"
 flavour_samsumbat.12.title: "A New Steward's Authority" #placeholder
 flavour_samsumbat.12.desc: "Our ally Samsumbat has done it. Now they have the Steward's authority, they demand we conform." #placeholder
 flavour_samsumbat.12.a: "We will bend our knee to the Steward" #placeholder
 flavour_samsumbat.12.b: "Our people desire to follow their example" #placeholder
 flavour_samsumbat.12.c: "Just another tyrant. We stay free!" #placeholder
 flavour_samsumbat.13.title: "Elikhet's Promise" #placeholder
 flavour_samsumbat.13.desc: "Elikhet made an oath to the last Storm Queen that as long as he lived no Akasi would be enslaved by his people. They remember. The Stewards that were his successors failed. We come to honour that promise." #placeholder
 flavour_samsumbat.13.a: "We fulfill his oath" #placeholder
 flavour_samsumbat.14.title: "Freehold Farmers" #placeholder
 flavour_samsumbat.14.desc: "The newly free citizens who did not want to return to their old toil have been given new opportunities to contribute to the republic with diversified food production, so we do not rely solely on the crops grown on the banks of the Sorrow. Others who were tired of their life in the mines have joined them." #placeholder
 flavour_samsumbat.14.a: "Serfs no longer" #placeholder
 flavour_samsumbat.14.a.tt.1: "Each of our §YLivestock§! provinces with §YSavannah§! terrain in the §YKubaci§! region will change to our §Yprimary culture§! and gain §Y2§! random development"
 flavour_samsumbat.14.a.tt.2: "For §Yeach§! of those provinces, one of our provinces producing §YCopper§!, §YIron§!, or §YGems§! will lose §Y1§! random development"
 flavour_samsumbat.15.title: "Reorganise the Satrapies" #placeholder
 flavour_samsumbat.15.desc: "We never wanted mere tributaries, paying us tax for protection. It has always been about the liberation of the common people, giving them a voice, giving them freedom. We have finally been able to re-organise our satrapies to better reflect this goal. The whole is now greater than the sum of its parts." #placeholder
 flavour_samsumbat.15.a: "We are brethren" #placeholder
 flavour_samsumbat.16.title: "Formalised Satrapies" #placeholder
 flavour_samsumbat.16.desc: "The Steward of the Sorrow has always exerted influence on the surrounding nations. We do not seek to subjugate,but to liberate, and we are using this tradition to accomplish our goal. Our allies work closely together and our republican government is having a greatly positive impact on all of them. We must continue the reforms to transform the Stewardship into the greatest tool of liberarate Halann has ever seen!" #placeholder
 flavour_samsumbat.16.a: "For the people" #placeholder
 flavour_samsumbat.17.title: "Horashesh Converted" #placeholder
 flavour_samsumbat.17.desc: "For too long the clerics in Kheterata relied on their slaves for every menial task they could think of, and they could not possibly do the gods' work without them, or so the high priest said. Our priests of Nirakhet have shown them what is possible - Horashesh, that stubbornly heathen region of Kheterata is now full of people who honour the Khet, and every one of our state leaders honour Mother Nirakhet. Liberty is healthy for the mind, body, and soul." #placeholder
 flavour_samsumbat.17.a: "Freedom in religion" #placeholder
 flavour_samsumbat.18.title: "The Eleventh Amendment" #placeholder
 flavour_samsumbat.18.desc: "The influence of the Khet's hedonism is causing some corruption in our leaders." #placeholder
 flavour_samsumbat.18.a: "Establish a corruption oversight committee" #placeholder
 flavour_samsumbat.18.b: "After election, community service" #placeholder
 flavour_samsumbat.19.title: "A New Constitution" #placeholder
 flavour_samsumbat.19.desc: "We have learned a lot. Our founding document is a great foundation, but we are so big it needs a rewrite." #placeholder
 flavour_samsumbat.19.a: "To a brighter future for all" #placeholder
 flavour_samsumbat.19.title: "Old Colonies Liberated" #placeholder
 flavour_samsumbat.19.desc: "Millennia ago, the influence of Mother Sorrow and her son Elikhet extended across the sea to Businor. Once more, the people of these great cities live, not as serfs, but as citizens, under a state that protects their rights and gives them room to flourish. Already there are rumblings of discontent in their neighbours as they see what is possible in our great republic..." #placeholder
 flavour_samsumbat.19.a: "Centuries of oppresion are over" #placeholder
 flavour_samsumbat.20.title: "Old Colonies Liberated" #placeholder
 flavour_samsumbat.20.desc: "Millennia ago, the influence of Mother Sorrow and her son Elikhet extended across the sea to Businor. Once more, the people of these great cities live, not as serfs, but as citizens, under a state that protects their rights and gives them room to flourish. Already there are rumblings of discontent in their neighbours as they see what is possible in our great republic..." #placeholder
 flavour_samsumbat.20.a: "Centuries of oppresion are over" #placeholder
 flavour_samsumbat.20.a.tt: "Gain the §YLiberation of the Oppressed§! Casus Belli against every monarchy with a capital in §YEscann§! or §YWestern Cannor§! for the next §Y200§! years.\nThis casus belli §Rdisables§! taking land, but makes it §G50% cheaper§! to §Yrelease nations§! and §Ychange government§!"
 flavour_samsumbat.21.title: "Iron Trees, Iron Chains" #placeholder
 flavour_samsumbat.21.desc: "Something about Taafi and Makan" #placeholder
 flavour_samsumbat.21.a: "We are brethren now" #placeholder
 flavour_samsumbat.21.a.tt: "Each of our §YMedasi§! gains a Cultural Union with the §YWest Sarhaly§! culture group"
 flavour_samsumbat.22.title: "A Great Union of States" #placeholder
 flavour_samsumbat.22.desc: "Maracout had a dream - a dream to see all slaves freed from their chains, to see every person given the chance to live their life without oppression. As Steward of the Sorrow and with our Medasi states, we have created a home where his dream has been realised. Our republic is strong, our citizens are free, and our diverse government only strengthens our unity." #placeholder
 flavour_samsumbat.22.a: "We are stronger as one" #placeholder
 flavour_samsumbat.22.a.tt: "Each of our §YMedasi§! gains the same modifier"
 flavour_samsumbat.23.title: "The Old Republic" #placeholder
 flavour_samsumbat.23.desc: "Before the Empire of Anbennar, there was the Republic of Dameria. Before the Emperor, there was the Senate. Before tyrants, there were statesmen. There could have been more, but the dream was crushed by kings. We return to that ideal and build upon it. No more will the people of Anbennar be slaves to despots. No more will they toil for nobles who care more for their blood purity than feeding their people. No more! Today in Anbennar, from the ashes of the empire a new republic is born. All are welcome, all are free. The fire of this revolution will burn down every state that oppresses its people!" #placeholder
 flavour_samsumbat.23.a: "Liberty! Equality! Fraternity!" #placeholder
 flavour_samsumbat.23.a.tt.1: "Gain the §YLiberation of the Oppressed§! Casus Belli against §Yevery country in the world§! for the next §Y200§! years.\nThis casus belli §Rdisables§! taking land, but makes it §G50% cheaper§! to §Yrelease nations§! and §Ychange government§!"
 flavour_samsumbat.23.a.tt.2: "Every province in §YEmpire of Anbennar§! @Z01 will gain:"
 flavour_samsumbat.24.title: "The Spear of Elikhet" #placeholder
 flavour_samsumbat.24.desc: "After compiling and re-organising all of the documentation for the new government, we have come across records of Daviros Stormbreaker. He saved Elikhet and his spear is a symbol of the inherit equality of every person. It is being held by the order of Stormbreakers. What shall we do with this symbol?" #placeholder
 flavour_samsumbat.24.a: "Keep it on display" #placeholder
 flavour_samsumbat.24.b: "Our top general will wield it to inspire the troops" #placeholder

 # Event Insight tooltips
 F60_event_insight_2_tt:0 "The §YClergy§! could inspire more §Yvolunteers§! for the army\nThe §YMerchants§! could give the government favourable §Yloans§!\nThe §YAdventurers§! could help us negotiate with local §Ymercenaries§!\nThe Mages might spare an experienced §Ymage§! for our council." #placeholder
 F60_event_insight_4_tt:0 "Our mayor showing his courage could inspire other §Ygenerals§!\nA proper military council could §Yreassure§! the guilds" #placeholder
 F60_event_insight_5_tt:0 "Exploting these monsters could make it easier to §Yreplace§! them with our own people\nAccepting them as people could inspire them to §Yjoin§! in our fight" #placeholder
 F60_event_insight_6_tt:0 "We cannot stop until every enslaved person is free" #placeholder
 F60_event_insight_7_tt:0 "Our agents in other countries will agitate for the freedom of the slaves" #placeholder
 F60_event_insight_8_tt:0 "Our study of magic and religion in the area will be more effective" #placeholder
 F60_event_insight_9_tt:0 "The clergy will be able to more effectively spread their message" #placeholder
 F60_event_insight_10_tt:0 "Our copper, iron, and gemstone mines will be safer for all" #placeholder
 F60_event_insight_11_tt:0 "§WThe enslaved will be free, §Yno matter the cost§!...§!" #placeholder
 F60_event_insight_14_tt:0 "More of our people will move from the mines to the farms in §YFangaula§!" #placeholder
 F60_event_insight_13_tt:0 "Our people in §YAkasik§! will be free, knowing we kept Elikhet's promise" #placeholder
 F60_event_insight_15_tt:0 "Our §YMedasi§! will become further integrated into §Y[Root.GetName]§!" #placeholder
 F60_event_insight_16_tt:0 "We will be able to better implement our diplomatic policies" #placeholder
 F60_event_insight_17_tt:0 "The clergy will finally understand the new order of things" #placeholder
 F60_event_insight_18_tt:0 "A proper council in place could reduce the chance of §Ycorruption§! in our elected leader\nIf the guilds have enough influence, they may take a hand in enforcing the §Ystability§! of our realm" #placeholder
 F60_event_insight_19_tt:0 "Our new government will be the foundation of a great future" #placeholder
 F60_event_insight_20_tt:0 "We will be able to liberate everyone under the thumb of a monarch in Cannor" #placeholder
 F60_event_insight_21_tt:0 "Everyone in Fangaula will be kin" #placeholder
 F60_event_insight_22_tt:0 "Those who join our great state will be even more welcome" #placeholder
 F60_event_insight_23_tt:0 "The old republic will live again, and together we will liberate all Halann" #placeholder

