 F60_the_fifth_amendment_title:0 "The Fifth Amendment"
 F60_the_fifth_amendment_desc:0 "“They certainly make one a little uncomfortable, no? How many humans have been killed by their claws and knives, I wonder?”\n\n“And are we any better? How many humans have been killed by other humans, Pralup? We’re not here to debate whether they make you comfortable - we are here to decide if they have the same fundamental rights as the rest of us.”\n\n“Why should they? What have they done for us? Have they fought for our freedom? No! They are the ones enslaving us! Keep them in their place, I say.”\n\n“If a person’s value depends on the actions of their entire race, well then, we might need to excuse ourselves, hmm? If we do not extend to them the same rights we humans enjoy, can we truly say we are liberators, or just another kind of oppressor?”\n\n“You go too far, councillor Huraam. They are nothing like us”\n\n- Samsumbat council debate over the personhood rights of the so-called “monstrous races”"

