 republicanism_steward_reform_emperor:0 "Republicanism" #placeholder
 republicanism_steward_reform_desc:0 "Our satrapies are ready for elections" #placeholder
 inaugurate_pilgrimage_reform_title:0 "§JInaugurate the Pilgrimage§!@F60" #placeholder
 inaugurate_pilgrimage_reform_emperor:0 "Inaugurate the Pilgrimage" #placeholder
