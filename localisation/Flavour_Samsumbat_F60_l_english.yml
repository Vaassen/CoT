 hospitaller_brotherhood_reform_title:0 "§JHospitaller Brotherhood§! @F60" #placeholder
 hospitaller_brotherhood_reform_emperor:0 "Hospitaller Brotherhood" #placeholder
 hospitaller_brotherhood_reform_desc:0 "Aakhet was a bloodthirsty conquerer. Nirakhet is a caring mother. The Ahati will be the face of that help" #placeholder

