l_english:
 judgement_title:0 "Judgement"
 judgement_desc:0 "As part of our arrival into these woods we’ve had to start sending out more and more spies and patrols to see what we can learn of the terrain. These woods are unpredictable and seem accustomed to making our life miserable as newcomers. We need to send out more patrols and feelers to the local Wood Elves to see what can be done. Failing this, we’ll need to take some lore land for ourselves and ask them once under our rule."

 nemesis_title:0 "Nemesis"
 nemesis_desc:0 "Against the odds we are continuing to triumph and doing so in a way that makes our cause proud. Instead of punitive measures that only deprive us of those who have expertise in this strange land we have found ourselves in. Their rulers pay homage to us and we prove that for as much as we shall have a kind of a peace, that we’ll back that promise with force if needed and bring those who will never accept our presence here to heel as many times as it takes."

 against_the_hunters_title:0 "Against The Hunters"
 against_the_hunters_desc:0 "The Hunter’s Grove is a prime target for expansion and was the site of many battles during our incursion in these woods, its terrain prompts great training for hunters. Such resources must be claimed for ourselves, our dominance must be felt and so the grove must be made ours, especially against the other clans. Blightseed must be ended."

 respect_earned_title:0 "Respect, Earned"
 respect_earned_desc:0 "In our struggles with the remaining Sallas of the Wood Elves we have done our best to fight honourably, the struggle between us seems unlikely to abate given our newcomer status and their homes that we took but it doesn’t mean we need be savage. Many of them who are under our rule may still wish for liberation but it isn’t impossible to prove that at the very least we are the better option when it comes to orcish rulers. It should be possible to have local compromise and the beginnings of respect."

 moonlit_tryst_title:0 "Moonlit Tryst"
 moonlit_tryst_desc:0 "Kavu, brother of Gordak, has long been in a complicated position. His inheritance is unlikely given the main line ruling the clan, but has been content nonetheless. However as our conquest of the Wood Elves continued, so too have odd reports regarding a relationship of his with an elf from the Hunter’s Grove. He has continued to serve the clan well, better even than before they met, but the rumours regarding the precise nature of their encounters have distracted many of those who follow his command within the internal structures of those in charge of keeping the peace as he has. The truth must be revealed."

 howl_of_the_triumphant_title:0 "Howl of the Triumphant"
 howl_of_the_triumphant_desc:0 "Our rivals are crushed, those who would have wrought cruelty destroyed and while our new subjects may not love us they can see we are much worse than alternatives would have been. The fruits of loyalty shall take time to grow but those seeds are planted with hands of all kinds. Peace may never be too close but devastation seems far when our banners march to put down those who resist the new order upon these woods."

 first_challenge_title:0 "First Challenge"
 first_challenge_desc:0 "We came to the Deepwoods on Dookan’s orders and guidance. Now the host has splintered we need to restore that order and enforce the discipline that has grown lax. The other warlords embrace cruelty, but Gordak says no more and to make sure he is listened to then we’ll need to meet the challenges that are arrayed in our way!"

 vord_and_khagor_title:0 "Vord and Khagur"
 vord_and_khagor_desc:0 "Vord of Beasteater a Khagur of Sapchopper, both of these rulers have risen in prominence and their cruelty knows no bounds. Gordak set his own path and to that end these would be rivals must be ended. Honour demands that they must be stopped and as their fellows it must done by our hand. Let us marshall all true orcs to put an end to those who only ravage, for the way must be lead by"

 recruit_elven_outcastes_title:0 "Recruit Elven Outcastes"
 recruit_elven_outcastes_desc:0 "Many elves do not have a clear place in their society, whether by destruction of family bonds with the chaos following our invasion, exile and punishments that had left them adrift or because of various grudges with existing authorities. These outcastes often have struggled, especially with the familial nature of relationships in the Sallas and those we now have command over. Their expertise can be useful though and with our commitment to being fair even in conquest we can win them other as compared with other clans they are not allying with wholesale destruction of their people."

 end_silentblade_title:0 "End Silentblade"
 end_silentblade_desc:0 "The Silentblade clan have long been in thrall to something darker, something Gordak has felt since the beginning when he said no more and removed the previous rulership of our clan and rejected further cooperation with their ends. Their machinations cannot be tolerated and with our position as the pre-eminent clan secured then it's time to return to one of the great roots of all our woes here in the Woods."

 ending_what_was_title:0 "Ending What Was"
 ending_what_was_desc:0 "We continue to feel that whatever force was behind the Silentblade clan has not truly been excised and that it stinks of betrayal, vile and desperate. We have secured our position, rooted out the leaders who might have fallen prey to such depredations but it seems there is more to do. For this rot to be removed, expunged from our new home then we must lay waste to the current. We shall make something as a challenge to this force, to taunt them into the open so that they may hide no longer. Something wicked this way comes and the Deepwoods will be forever changed once we bring this thrashing corruption to the open so that all left in its wake shall be judged."

 enlist_goblins_title:0 "Enlist the Goblins"
 enlist_goblins_desc:0 "We share the Flower Grove with many goblins and its time we re-establish links and put them to work. By hook or by crook we shall make use of their talents and see about restoring the kinds of relationships we find elsewhere. Our fellow orcs are cruel, but there are ways we can follow the same path while respecting limited autonomy in return for certain expectations of service. No longer master and slave, but liege and vassals."

 being_better_orcs_title:0 "Being Better Orcs"
 being_better_orcs_desc:0 "We are orcs. Orcs whose strength comes in all things, our people have a long history within the Dwarovar and now with our following of Korgus to Escann and beyond. These woods are far from what we once knew, and for those who remember the caverns still then we must prove as the next generations. For the orcish people to have a future, we must improve ourselves able to change. For though our skin is less mutable, the Orcish soul will never be bound in chains while the Cursed Howl can be heard."

 next_generation_title:0 "Next Generation"
 next_generation_desc:0 "The Forest Goblins and Wood Elves were here before us, but now we have come and it's clear that the next generation who live in the Deepwoods will have them along us and the other Goblins who came with us. The Deepwoods will be Orcish lead from here on but it shall not be Orcish exclusive, we have much to learn from these other denizens as part of keeping ourselves strong and making sure our place is not overtaken in our weakness. There is a bounty in these woods if we could but take it, and those outside will surely not have been idle. Let us make sure future generations know our invasion as the last great one as all people step forwards under our rule."

 secure_tribal_loyalty_title:0 "Secure Tribal Loyalty"
 secure_tribal_loyalty_desc:0 "The tribal elders and power structure has served us well, but we need to make sure they are onboard with the agenda of honour and justice that we strive to bring in true orcish fashion to our wayward cousins and the elves and goblins that would see us as only brutes. We’ll need their support at every stop to be able to stave off those who insist we join in the despoiling of these woods for no gain."

 howling_in_the_woods_title:0 "Howling in the Woods"
 howling_in_the_woods_desc:0 "Our howl is that of those cursed to wander, for we were trapped here by chasing enemy forces and then being locked into a strange place, with different kinds of goblins and elves unlike those we encountered back in Escann. But to survive we must find some peace with these other denizens and while they may not always be harmonious we can ask them to howl in fury at these strange circumstances that keep us all entrapped."

 oubligs_lesson_title:0 "Oublig's Lesson"
 oubligs_lesson_desc:0 "Oublig was a goblin who was pivotal in taking down an archfey, the Eldest, when Corin and her Circle came to these lands. Though their faith is not ours, their contributions are still pivotal and worth learning from. For what comes when divinity intercedes and how the intervention of pernicious fey can create such disharmony if not properly prepared for. The fey cannot be stamped out entirely, not now or ever but their influence needs to be worked with and controlled for, to the extent that such a thing is ever possible. For just as with the others, we inhabit this land with them."

 history_repeats_title:0 "History Repeats"
 history_repeats_desc:0 "Once upon a time before even the coming of the Orcs, there was also nary an elf here. Some whisper the same is true even of the satyrs too. But then we came into this new environment chasing those who had fought us before and we learnt of all that was different here. This was said to be what happened to the elves in their struggle against an ancient empire in the Escann we travelled via. So it is that under our stewardship that this history repeated and just like before where struggles broke out that a new order and a new kind of peace has been found. It shall surely take the elves and goblins time to adjust, but they both have at least once before and with our eyes upon the future we shall blaze the trail ahead for them to follow when they are ready."


 ch_baby_event_tt:0 "It must have been 10 years since the Champion of the Melee Event" 
 integrating_vassals_cost_2_dip_adm_tt:0 "§MAll our Wood Elf and Forest goblin subjects will be integrated for 2 admin and 2 dip per development.§!"
 ch_autonomy_reduction_goblin_tt:0 "§MAll provinces we own that are Green Orc, Forest Goblin or Common Goblin will have a 10 autonomy reduction.§!"
 ch_elf_minorities_tt:0 "§MAll provinces we own in the Flower Grove or Yfelorr will have an elven minority added.§!"
 ch_children_of_destruction_tt:0 "§MAll provinces we own will have an elven, half-orc and goblin minority added.§!"

 cursed_howl_conquest:0 "Conquest of the Woods"
 cursed_howl_war_taxes:0 "Mustering the War Host"
 cursed_howl_bulgu:0 "The Words of Wise Folk"
 cursed_howl_bulgu_permanent:0 "Bringing the Howl"
 cursed_howl_history_conquered:0 "Start of a New Story"
 cursed_howl_fences_mended:0 "Bridging Divides"

 karakhanbar_black_hearth_council_reform_ch:0 "Oak and Hearth Pact"
 karakhanbar_black_hearth_council_reform_ch_desc:0 "By the union of orc and elf, the Oaken monarchies of Wood Elves are not enshrined but remade into fuel. Instead of crowns upon heads, they are now coals beneath the great Black Hearth. This covenant between bloodlines and eras is the furnace-heart of Karakhanbar. From its fire rise towers of smoke and steel, and its light is not of hearth or home, but of forge and flame - unyielding and terrible enough to eradicate the dominion of accursed Ashentree Fey. "

 flavour_cursed_howl.1.t:0 "Petalmasher Submission"
 flavour_cursed_howl.1.d:0 "AI only really, why are you seeding these two tags this close in MP if you're seeing this?"
 flavour_cursed_howl.1.a:0 "If you're seeing this otherwise, please report on Discord"
 flavour_cursed_howl.1.b:0 "No really, please do"
 flavour_cursed_howl.2.t:0 "A Change in Faith"
 flavour_cursed_howl.2.d:0 "Our clan has resided in the Deepwoods for generations now. Our reason for coming here, Korgus Dookanson and his ill fated Greentide, has faded away. Yet, the memories of our ancestors and the caverns of the Dwarovar they called home remain fresh. Their struggles and triumphs are still celebrated in communal songs during regular gatherings and special celebrations alike.\n\nIndeed, their heroic deeds and tenacity still inspire our youth today. Little ones even run about in mock play, replacing devilish dwarves with fickle fey and the rocky caves with forest canopy. Notably, these heroes include not only legendary figures such as Og Beardbreaker and Grima the Shadow but also more recent figures such as Gordak Cursed Howl. Over time, it is possible that these great orcs will overshadow Dookan himself in the eyes of [Root.GetName]..."
 flavour_cursed_howl.2.a:0 "Let us sing of the past and prove our worth for the future!"
 flavour_cursed_howl.3.t:0 "Bosk, Beheaded"
 flavour_cursed_howl.3.d:0 "Bosk is cruel and even in defeat remains unaccepting of his circumstances, lashing out at this wardens. He was still a prisoner but even once as hated as he was treated as the leader of a clan that he once was. Orcs followed him for a reason and that much is to be respected even when nothing else about him deserves such grace. The assembly of the elders is called and this blackguard against what the orcs of our kind stand for is brought forth to be judged. His muscles atrophied of his own volition, he remains in chains for a warriors death does not become him if he were to attempt to attack those present.\n\nThe outcome is not in doubt and neither are his crimes. Yet Bosk refuses to recognise the principles of this calling to account and in the end there is only the finality to be realised with his execution. Gordak grasps his claymore and makes easy the last moments. It has more than Bosk deserves and yet he retains some dignity in refusing to beg at this final hour.\n\n"I see there is some true orc left in that head somewhere, before the rest revealed itself." the blade is raised, and then falls."
 flavour_cursed_howl.3.a:0 "Shame"
 flavour_cursed_howl.4.t:0 "A Chance Encounter"
 flavour_cursed_howl.4.d:0 "The nightfall in the Deepwoods was a dangerous place for orcs, Kavu Cursed Howl thought as he led the patrol in the name of his brother to check nothing had passed through the area recently as part of their campaigns. He’d always been the quietest one and that had landed him the role of chief scout as one of the first to adjust to the surface compared to his time in the Spine. His brother had looked out for him though ever since Bolk adopted them into his family as heirs, but his independent streak had meant he was never going to really follow Gordak’s footsteps.\n\nHe was the voice of reason on the shoulder so many days, the one who inspired Gordak to see what could be when the time came to stop the one who’d looked after them since the fall of Khugdihr. And he was the one who kept them alive amidst the chaos of the campaign. But Gordak was doing well and he was proud of what was going on with the clan. The fighting was far from over when it came to relations with the wood elves but it was going differently now.\n\nKavu lead a patrol personally, seeking to check the terrain and make sure none of the native beasts of the Deepwoods has passed through recently. He had no knack for husbandry and so had to rely on others when it came to understanding these strange creatures. These thoughts weighed on him somewhat as he passed through the foliage, only turning at the last moment as she realised the footsteps he was hearing weren’t entirely in sync with his feet.\n\nSlowly turning around, he saw her. A female elf with the longest hair he’d ever seen and piercing eyes that dragged his stare directly to match hers. She looked at him and seemed to be taking him in, just as he did her. Her bow raised, his hand on a throwing axe.\n\nNeither moved, the stillness and silence of the forest in this moment becoming deafening. In this strange moment of connection, he wanted to call out, to ask her name. To learn something of this face he wouldn’t forget anytime soon. But instead she just smirked and turned around slowly as he decided to catch up with the men who’d went on ahead."
 flavour_cursed_howl.4.a:0 "What just came over him?"
 flavour_cursed_howl.5.t:0 "Would Be Conquerors"
 flavour_cursed_howl.5.d:0 "Vordak and Khagur were two chieftains who came into the Deepwoods, Khagor having been lost to the Feyrealm for much of the invasion and Vordak steaming from a failed invasion of the heart of Ciranmyna. Both cruel to a fault though, their legacy is one of failure and wanton destruction without rebuilding anything in their wake. The Beasteater and Sapchopper clans followed the same practices as Bolk used to enforce over our clan. Gordak decided no more for us and no our reach has extended such that no more shall be the truth for all orcs.\n\n“Korgus died and yet we remain here, the Deepwoods are a freer place than the confines of the Serpentspine. They would have conquered these woods in a way that drowned us all in blood and stained the ground itself red. We find ourselves attacked time and again but this is different than revelling in the suffering that conflict brings. We wish ourselves a home and we’ll make it here, by force if the Wood Elves continue to reject that reality. But orcs are not satyrs-come-massacres, our lives do not exist for the purpose of craving violence as they do in their debauchery.“ the chieftain spoke as he thundered to the audience that gathered in the wake of our great victory, two angry figures lying in the arena gathered for the final duel.\n\n“You entered this contest for the Orcish soul under the childish delusion that you were going to kill and pillage everyone in your wake and that no one would be strong enough to object. At Ciranmyna, the Flower Grove and dozens of other places you showed your ugliness and naivete to us all. The wind was sown, and its time the Reaper has his due.” Gordak said as he dropped below, wielding the masterwork blade he inherited from his father with a twirl as he charged them both to finish their legacy personally"
 flavour_cursed_howl.5.a:0 "Both skewered at the end of his claymore, in one fell swoop."
 flavour_cursed_howl.6.t:0 "Separated and Distinct"
 flavour_cursed_howl.6.d:0 "As the scouts position on the flank suddenly became less of a flank and more of an encirclement he couldn’t help but wonder why this had to happen now. At the very least the Cursed How’s new conduct had allowed for prisoners on either side. Perhaps there’d be a chance there to avoid being cut down now and  looking for escape later as the situation changed.\n\nHe and his men laid their arms down for the moment, he could just about make out from the bits of the Elven tongue he’d picked up that they were deciding if it wasn’t just easier to kill them and hope they didn’t know anyone potentially captive on the Orcish side. He signed this to the others and then saw something that struck him. Her, again. She looked over and clearly saw him too as she spoke to her comrades, they were getting agitated and speaking so fast now he couldn’t really understand. Eventually she alone came over to speak.\n\n“This tongue, you understand me?” she asked but it wasn’t a question, she seemed to guess he’d understand Goblin.\n\n“Yes. Enough anyway.” he said “I got on well with the shortstacks.” it wasn’t a lie, but Bolk had asked him to learn as part of manners when it came to ‘servants’.\n\n“Good, I’d like to speak with you..” she said before he interrupted.\n\n“Me too…” the words slipped out, he wasn’t even sure with what tone but he almost wanted to blush, and on a battlefield!\n\n“Fey give me strength, men are men I sup-” she said, though she had a smile of her own that had crept in that her tone hadn’t recognised, this strange moment of connection interrupted by the sound of warhorns, the timbre indicating Gordak’s personal guard.\n\n“That would be … my brother. He’s .. uh … always looking out for me.” Kavu said, hoping to keep this women from having them all killed to avoid the worry.\n\n“Well he can worry no longer … and perhaps owe Arya Whistlebreeze should this situation ever be reversed.” she said as she seemed confused too by how this interrogation had gone sideways and then zig-zagged entirely as she whistled for a mount and they rode off."
 flavour_cursed_howl.6.a:0 "I didn’t know how to explain to the others, and definitely not my brother"
 flavour_cursed_howl.7.t:0 "Strange Reflection"
 flavour_cursed_howl.7.d:0 "It was another night just like the one on that strange patrol as Kavu looked up from the dwelling he’d made in the canopy here in the Flower Grove they’d made home. He looked up at the night sky and the freedom it indicated. They’d never expected any of this, what Escann had been like and what the whole surface had been like with the great variety here.\n\nHe had a long life ahead of him, and yet he can’t help but remember that woman. Arya. Unlike the others she seemed to view him as a person, an enemy to be sure but not just a monster to be killed without mercy. The reports of others in brief captivity report it being seen almost as a cruel joke or humouring of the orcs to treat them as even worth ransom.\n“How thankful I must be” he says aloud to the stars. “But why then must I feel these pangs…”\n\nWas it guilt, or something else? His feelings are strange and something like that which Gordak says people feel for those they … love?"
 flavour_cursed_howl.7.a:0 "That can’t be right, Kavu thinks."
 flavour_cursed_howl.8.t:0 "Requiem for the Departed"
 flavour_cursed_howl.8.d:0 "Arya walked amidst the lands she dwelled in. She’d been forced to flee her home and her husband's grave when the Orcs had come. It had been one of the most painful decisions she’d ever taken, to leave the place where it often felt like her heart still lay in the Flower Grove. And yet now it sometimes felt like it beat again, but instead as a guilty cancer at the crux of herself. In her dreams she walked the rows of the departed and the grave markers, their ghosts reaching out. Haunted in her dreams and waking moments both.\n\nHer hands drifted over her brooch that she kept safe and remember the image of what he looked like. But he just reminded her of that orc. It was odd when she first saw him that night, but the way he held himself and walked, the way that he’d moved that just had caused her to stop in the first place as it had seemed her first love had returned in new form. She didn’t know how long orcs lived for but as absurd as the idea was, that orc would have been 30 if she had to guess and that was too close for comfort.\n\nThe stories of how the elves had come to these woods and become the Wood Elves often glossed over any violence that would have occured between them and the forest goblins before the current detente compared to the newer goblins. Did others before desire peace even at the outset, shaped by earlier loss"
 flavour_cursed_howl.8.a:0 "Did others too feel guilt at strange stirrings?"
 flavour_cursed_howl.9.t:0 "Champion of the Melee"
 flavour_cursed_howl.9.d:0 "The clash had been a ferocious one and all around Kavu saw bodies piled high, elf and orc, slain by each other’s hands. The ground of the clearing was stained red and the blood seemed to flow into a sort of pool that threatened to become a lake. Or so it seemed with his exhausted vision as he came to rest by one of the few untouched trees. It’s unblemished nature likely just chance, but it still proved a symbol of his own unlikely survival.\n\nAs he sat down, he felt the tiredness catch up as the energy seemed to leave his body. Why had this come at such a time and why did it feel like a pyrrhic victory if ever there was one. Then a sound caught his ears, that of another person’s breath. Just around the tree and he crawled over to see if it was friend or foe.\n\n“Hello.” said a familiar elf as he found himself a bit lost for works. “I don’t think you ever told me your name?”\n\nIt was such a silly question and especially at a time like this, but he felt compelled to answer Arya. “Kavu. Hello … I’ve been thinking of you, can’t quite forget you for some reason.”\n\nShe laughed and then coughed in pain. “Two for two then. You remind me of someone I used to know. It feels like our paths endeavour to cross time and again. I have wondered if a force is at work.” \n\n“Fey give you strength?” Kavu did his best to smile with a grin as this unusual conversation continued apace.\n\nArya was about to open her mouth when he decided instead to clamber forward and close it, inviting himself in for a kiss and after a moment’s hesitation she took an arm and brought him in closer, pushing at his back.\n\nPerhaps some force was pushing at them both, but in that moment after such grotesquery on a battlefield there was a time for simple pleasures, a time for selfishness and a time for the simple company of another’s embrace even as they might battle again come the morn."
 flavour_cursed_howl.9.a:0 "Can love bloom, even on a battlefield?"
 flavour_cursed_howl.10.t:0 "Once and Future Bonds"
 flavour_cursed_howl.10.d:0 "Kavu Cursed Howl travelled with a purpose, the woods were not entirely pacified; even if most resistance was mere non-compliance. And for one such group, Kavu and his men had come to disperse them, peacefully if possible.\n\nAs they rode into the encampment he saw her, Arya. She smiles at him like she’d expected to see him again one day even after time apart. With a child who was not an elf like the others, too green by half.\n\n“Is he … ?” he asks, not even bothering to wait. \n\n“Yes.” came her answer and he felt his legs get weak as so much of his world and existence seemed to change in a moment, for something so real to come of a night that had felt more a dream every year since the encounter.\n\nBut reality interrupted such idle thoughts, “We’re leaving tomorrow and trouble your authority no longer.” she says, her words making it clear it was to a foreign place they didn’t truly know.\n\n“And the tyke?” he asked, unsure what answer he wanted. “Tavdan only knows his mother. We were something but the stars are not aligned to give us any more time than we had that night. Our places require us to be apart.” Arya said.\n\n“Well then in another world, I wish that we had time.” he said painfully, feeling so wracked with doubt and distracted in this moment.\n\n“We shall be back tomorrow and I hope -” he said as wasn’t sure how the sentence ended. That she’d be there with his child, or that she’d away and potentially safe outside the woods.\n\nHis mind was troubled the entire night as he decided to return alone and sent his men off elsewhere, in such a state as he was Kavu wondered how didn’t bump into Arya when he saw that she was in the clearing of the night prior, Tavdan holding her hand in that childlike that indicated he was trying to be brave.\n\n“But…” he stammered.\n\n“But what? Mayhaps I lied or changed my mind” Arya said, squeezing their son's hand. “But to tell the truth he asked about you last night. I may never quite make my peace with the new reality here but that he .. and also I .. deserve a family come whatever may. And so I humbly request your protection.” she grinned\n\n“I suppose I shall have to make sure you are treated well then, as mother of a potential future chief.” he said as he embraced them both, filled with the strength to lift them both into the air in this moment."
 flavour_cursed_howl.10.a:0 "Kavu wasn’t sure Arya’s jaw would ever pick itself up to close again"
 flavour_cursed_howl.11.t:0 "Not the End"
 flavour_cursed_howl.11.d:0 "“This isn’t over…” the Silentblade chieftain laughed as he croaked his last.\n\nHis scolding in these moments, the laughter that came before we could take no more still rings in the clearing.\n\nHis body begins to dissolve before our eyes, into a horrific black gunk that seeps into the ground.\n\nThis seemed to be unexpected to his other subdued companions who seemed unaware of this. Whether this was planned or an unexpected manifestation of power, one thing is certain and that is that we cannot be sure whatever malign force was operating is truly over."
 flavour_cursed_howl.11.a:0 "Curses"
 flavour_cursed_howl.12.t:0 "End Troknars Ilk"
 flavour_cursed_howl.12.d:0 "It will take to finish burning out the rot at the heart of the land Silentblade had taken or owned. Something had been here, though exactly what is impossible to see. Many of the orcs and others enslaved here were unresponsive about what they had seen or knew, as if it had been taken from their memory directly.\n\nThe game being played is clearly a dangerous one and even without direct evidence it reeks of the fey. Long have some suspected their influence among aspects of our invasion and yet the way their favour has primarily been felt by the Elves and Goblins had left many to question if something else might be at play. After all these woods are home to much that is queer, something even older than the fey seems less and less likely now but the idea once had credence in the rumourmonging on the subject.\n\nPatrols are kept still though, and for those we’ve put in place of managing the local communities we’ve made sure they are accounted for. There doesn’t seem to be more than the usual resistance across the provinces we’ve taken but a pervasive unease has settled all the same.\n\nIndeed things are somehow worse even when more patrols remain unmolested, their workings proceeding far apace of usual schedules. The tension refuses to abate, near everyone sent to that region can feel that something hangs above it all and is biding its time and enjoying the torment of such excruciating uncertainty."
 flavour_cursed_howl.12.a:0 "Does this mean we need to send more or less forces then?"
 flavour_cursed_howl.13.t:0 "Deepwoods Aflame"
 flavour_cursed_howl.13.d:0 "It started suddenly, the capital ablaze and ash falling from the sky. The phrase turned literal even for those of us who understand it not. Each speck hostile and malign, burning those who it fell upon and soon the cacophony of the injured and casualties was all that could be heard across the encampment.\n\n [Root.Monarch.GetName] rushes to the scene to see a strange figure who seemingly grows out of a pile of ashes, that reform themselves into a greyscale image of a figure awash with authority and a gaze that made even the chief tremble. Bewitching and able to maintain a gaze that keeps their eyes affixed to their terrible and intoxicating presence.\n\nThey don’t even speak but somehow in a fascination of the fey, words can be felt in our ruler’s head as they kneel in this awestruck manner for the time. Their movements in this ashen form somehow giving them a voice never heard before either.\n\n“I am they, the Blackened Prince and it was by thy will that your clan has prospered. Mine influence in those you call the Silentblade set you upon thine current path. Your prosperity, ‘tis owed to me. And for that I bid you to serve me. For I am the true justice and I require utter obedience in turn. I shall ask only this once.”\n\n [Root.Monarch.GetName] feels that they still have their own control, and it is clear that whatever power is felt here is waning. The ash falls no more and they are able to stand up, proud in their response. Whatever truth and whatever power this Blackened Prince has, there is only one answer to this call for obeisance."
 flavour_cursed_howl.13.a:0 "No"
 flavour_cursed_howl.14.t:0 "United We Stand"
 flavour_cursed_howl.14.d:0 "It is upon us, the War of Black Trees. The Blackened Prince corrupts many an orc into these emerald servitors and they assault us across the woods. But we are lucky we are not truly alone, for our subjects see this desperate struggle and we are all together in this time. If we had been cruel or insolent in their limited state then it seems likely that this would be the time to break free, for dreams of a Goblin or Elven resurgence to spark and rise as a new rebellion. But we have brought a kind of peace and they all respect this. \n\nThey may still have issues with how history’s pages turnt, but we have given them a place of their own and they see fit to know that in the future they’ll have a place in whatever comes out of this terrible war between brothers. Once there was a grand conclave between the elves at Elynaile, which the human goddess Corin and the goblin Oublig came to unbidden. They united to stop our invasion and the rampage of the other crueler warlords.\n\nBut today we hold a new council, amidst the rebuilding of the Flower Grove we hold the Council of Gordak, in the name of the one whose sense of justice liberate all the orcs of the Deepwoods from cruelty and abyssal moral degradation. That corruption had been metaphorical, but today the Prince’s influence is literal. They seek to chain us and make us their weapon against the other fey. There is no love lost, to be sure with us and the fey.\n\nBut at this new council it is time for all to unite and answer the call as change sweeps the Deepwoods. The autonomy shall end and our subjects shall join us in full, for united we all stand against this menace. This epitome of old enmities shall be ended by a new union of orc, goblin and elf!"
 flavour_cursed_howl.14.a:0 "Let the armies march as one!"
 flavour_cursed_howl.15.t:0 "Cinders of the Trees"
 flavour_cursed_howl.15.d:0 "The rule of the Cursed Howl chieftains has a long legacy. That of choosing to be just and seizing mantles when injustice might go. Our reign may never be as kind as others, but there are rules to be followed instead of the arbitrariness that comes with those who forsake natural laws and intrinsic feeling that makes us all sapient.\n\nThose divides may not be healed this generation, or even in the one after. But our new royalty with its half-orc nature represents this hope for a future across different boundaries. Some had pressed for a different government, by elders selected to rule in rotation. Others for a rule by shamans with the new place of religion in our culture.\n\nBut it seems a monarchy we are to remain, and one in which there is a place for the other denizens of the Deepwoods as all serve. The trees may burn, the branches may break but they shall fall together and be bound up into kindling for our nation's flame. We shall not be a pyre for the ambitions of those who would toy with us, but we shall burn brightly for our own end and to  cast aside these wretches who would keep all the Deepwoods ensorcelled and immutable."
 flavour_cursed_howl.15.a:0 "A pact, an oath, of oak, of hearth."
 flavour_cursed_howl.16.t:0 "Children of Destruction"
 flavour_cursed_howl.16.d:0 "Across our lands there has been a slow increase in marriages and other unions between orc and elf, and more to the point there have been many children from these unions who have begun to take their own places in a way that wasn’t possible with the rare children of elf-goblin unions in the voltoj. These half-elves/half-orcs seem akin to the reports we hear of half-orcs in Escann and so for now we shall know them as such. While this belies their elven inheritance, it does show that our country sees our orcish roots as the strongest.\n\nLife isn’t always easy for these new children, often the products of some unions less pleasant and yet still kept and raised by sole parents or by both in more loving situations. But whatever the case there is much adaptation to be done and a long road ahead as we all adjust to a permanent future with better relations between the people of the woods. The destruction that they inherit shall hopefully be the last great conflagration in its history."
 flavour_cursed_howl.16.a:0 "Another people, another beginning"
 flavour_cursed_howl.30.t:0 "A Challenge From the Orcs"
 flavour_cursed_howl.30.d:0 "This should be AI only unless you've done MP seeding with nations really close together in the Deepwoods. You're being baited to attack Cursed Howl"
 flavour_cursed_howl.30.a:0 "Do"
 flavour_cursed_howl.30.a:0 "Don't"
