#Missions

 khatalashya_araizary_support_title: "Araizary Support"
 khatalashya_araizary_support_desc: "When the gods created lizardfolk, they also created guides for their creations. They created the first araizary, the Thraxis, and from it was born every other araizary. They are like us, and Taneyas is their home as much as it is ours. Most Araizary live on the water - not just the sea but the very air itself. Skipping from raindrop to raindrop, passing through the mists, appearing to lost sailors and waylaid explorers to help them. The 333rd Empire is as much theirs as it is ours, for our fates are intertwined. With their support, we too shall become creatures of both the land and sea. With their support, they will identify heroes of the Final Empire who will be capable of conquering the seas."
 khatalashya_araizary_support_tt: "Gain 3 Marines when recruiting explorers"

 khatalashya_tribal_naga_title: "Tribal Naga"
 khatalashya_tribal_naga_desc: "None deserve the accolades for leading lizardfolk to the prophesied final empire more than the naga. It is they whose steady hand-I mean gaze, have guided our society to this long promised glory. Sometimes though, those naga who live in the great cities can take too much of the attention. They guide the leaders of great nations and the people of our thriving cities, but it is the sole naga tending to their tribal flock who have put in the hours guiding with little help from outside support. We need to start supporting the naga of these tribes, for some of them may not even realise the prophecy has been fulfilled."

 khatalashya_aquatic_beings_title: "Aquatic Beings"
 khatalashya_aquatic_beings_desc: "What makes lizardfolk special compared to the many other races in this world? Our diversity with mutations is a good starting point, but perhaps that we are just at home on the water is another. Lizardfolk are capable of surviving and thriving in all sorts of environments. There have been historic lizardfolk empires based out of the desert, on islands, or even on one occasion operating entirely underwater as was the case with the 80th Empire. Ever since the Onslaught some 2500 years ago, lizardfolk have lost their island-hopping ways. We should strive to bring it back. We cannot be the greatest final empire if we don’t at least cover the territory all past empires did."

 khatalashya_the_great_cities_title: "The Great Cities"
 khatalashya_the_great_cities_desc: "A human builder once asked a lizardfolk explorer what the architectural style of lizardfolk looked like. The answer: a hundred thousand years of styles all built on top of each other. Every one of the great lizardfolk cities have been built atop existing locales. Cities like Shalazar and Zerat have stood in the same place for millennia, building and rebuilding. Some houses have stood in the same place for thousands of years. The stone may change. The rooms may change. The roof may change. Yet it is still the same great building standing in the same great city. In that way, no lizardfolk city ever truly dies."

 khatalashya_the_merfolk_canal_title: "The Merfolk Canal"
 khatalashya_the_merfolk_canal_desc: "Merfolk and lizardfolk have not always gotten along. Not openly hostile, although many lizardfolk did not appreciate that the merfolk made the sacred Arskitse Zatsarya into their home. Instead it was just coldness and distance.\n\nA merfolk queen did approach us at the port in Khugra with a fascinating proposal: build a canal across the Jasiir Jadid.\n\nFor the merfolk, this would have innumerable benefits. The thin strip of mountains are insurmountable for any merfolk, preventing merfolk on either side of the strip who live not a day’s journey apart should there exist a waterway from ever seeing each other. It would be incredible for our efforts too, as ship travel all the way around Ardimya can take an intolerable amount of time. Travel to Haless could be so much easier if we followed their scheme."
 khatalashya_the_merfolk_canal_tt: "Can build Merfolk Canal earlier"

 khatalashya_empire_of_souls_title: "Empire of Souls"
 khatalashya_empire_of_souls_desc: "The excitement over the history of the Empire of Souls has grown within our empire. Lulupan, the great lizard spirit, must be a sign that the rainforest in south Haless was once the home of lizardfolk. Who knows what else could be there? The humans that live there are understandably not aware of the majesty of our past empires and may not have recognised lizardfolk ruins for what they truly are. It’s time to reclaim Lulupan in the name of the lizardfolk. Said claim may be 80,000 years old, but all claims are permanent for the Final Empire."
 khatalashya_empire_of_souls_tt: "event was here"

 khatalashya_arskitse_empire_title: "Arskitse Empire"
 khatalashya_arskitse_empire_desc: "The 300th Empire was a naval-based empire. Its capital was located on the island with the Arskitse Spire - the very same spire that now is half-submerged in the sea. It wasn’t that long ago that it stood proud on that island entirely above sea level, but the island was sunk in the wake by the Deep Devils during The Onslaught, when those creatures from the sea rose up to attack coastal settlements across not just Taneyas but as far north as the Dragon Coast in Cannor and into the Divenhal. Ever since the Arskitse Empire collapsed, Lizardfolk have not dared sail out further than Fahvanosy. So many islands, once inhabited by lizardfolk, left for ruin.\n\nWe can’t let this fear of the deep ocean rule our senses. We are the final empire! We will rule the islands once again."

 khatalashya_approve_examination_title: "Approve Examination"
 khatalashya_approve_examination_desc: "Examination of Kus an Zhyani has revealed wonders beyond our wildest imaginations. But what of the spire at Shalazar? What of Khankatesh? Could it not hold similar wonders? Our mages have wished to examine the spire in more depth for centuries, but what few examinations have been conducted in the past have unearthed little. The spire’s inner workings are inscrutable. This was not a worry in the past, but after we discovered what the true purpose of the spire at Zerat was, engineers and mages have been examining Khankatesh with greater scrutiny, attempting to make sense of its mysteries. We should give them full authority to study this spire. I am sure they will not blow up the spire as the Karrasian Empire did to the spire in Ashazual many centuries ago."
 333_can_upgrade_gate_of_earth: "Easier access to Shalazar Monument "

 khatalashya_thraxi_patterns_title: "Thraxi Patterns"
 khatalashya_thraxi_patterns_desc: "The Thraxis is the highest and most important of all the Araizary. It has accompanied the lizardfolk ever since the second empire, when it helped their civilisation recover from the ruin of the first empire. Its importance is best exemplified by its presence on our flag, representing eternity. Yet the last time one spoke or heard of the Thraxis was thousands of years ago by the 318th Empire, and all it did then was bless a local tchoken ranch. Some scholars of the 333 empires theorized that it was killed during the Greenblight, a terrible period when dragons and draconic creatures roamed Taneyas and destroyed towns and cities.\n\nThe truth to the matter lies in the stars. The Thraxis is not one being, but a collection of smaller thraxi - araizary made of stars. Thraxi appear and disappear according to the patterns of the stars. Each tribe typically associated themselves with one star pattern and, by extension, one thraxi. If we can learn how to track the stars, we can track the thraxi, and eventually summon the Thraxis itself. The only problem is looking at the stars for too long can cause…issues."

 khatalashya_the_plane_of_earth_title: "The Plane of Earth"
 khatalashya_the_plane_of_earth_desc: "There has been much debate over the message left when the Zatsarya in Shalazar collapsed. The prevailing opinion is that genies took the spire and created a replica to stand as a mockery in its place. Genies have not roamed Sarhal since Ashen Skies, once again proving that all other races on this planet will crumble while the lizardfolk remain eternal. Yet it still feels humiliating that for thousands of years our people have been worshipping a false spire.\n\nA new question has emerged though from this line of thinking: Does the original still exist? The final message seemed to imply it did. Somewhere through the portal to the Plane of Earth, the true spire still exists. Our miners and engineers have gradually improved operations to extract resources through careful expeditions into the Plane of Earth. It is now time to send a deeper expedition. Find this genie who took our spire, and get it back!"

 khatalashya_summon_the_thraxis_title: "SUMMON THE THRAXIS"
 khatalashya_summon_the_thraxis_desc: "The results from the thraxi observatory are in. There is a very narrow band of time when the stars are in alignment that this summoning ritual will work. As Agradent is in retrograde, as the thraxi are active, the right conditions have been reached such that we can call to the stars and bring It down. The being upon our flag, the most senior of all araizary. The one that has looked over our kind from the second empire onwards. It’s time to\n\nSUMMON\n\nTHE\n\nTHRAXIS!"

 khatalashya_lupulan_the_lizard_spirit_title: "Lupulan: The Lizard Spirit"
 khatalashya_lupulan_the_lizard_spirit_desc: "REPLACE_ME"
 333_earlier_rending_tt: "Rending will happen"
 333_appease_big_ghostly_lizard: "We will gain option to appesse Lizo"

 khatalashya_precursor_experiments_title: "Precursor Experiments"
 khatalashya_precursor_experiments_desc: "Dragons left Aelantir long ago. Any attempts by the Draktaya lizardfolk to find them has turned up nothing. But interest in draconic revenge has long dropped in significance behind learning what happened between our ancestors and the Precursors.\n\nAn expedition has discovered a building that bears an eerie resemblance to the Zatsarya in our homeland. A great spire with inner workings similar to that of the spire in Zerat. It appears this one has been intentionally sabotaged so attempts to turn it back on have proved ineffective, but bigger mysteries lie in some core design elements. This was not built by lizardfolk. This was built by elves. Did lizardfolk build this for precursor elves? What happened then that meant lizardfolk society collapsed while elven society continued until Ashen Skies?\n\nIn amongst the old precursor records, we may have found the answer - or more accurately, where we can find our answer. The records speak of a construction collaboration project between lizardfolk and elves somewhere in the Ocean of the Lost. On an island somewhere stands a symbol of lizardfolk and elves working together to build something incredible. We must find it."

 khatalashya_beyond_the_stormwall_title: "Beyond the Stormwall"
 khatalashya_beyond_the_stormwall_desc: "While in the past we may have been reluctant to admit the Precursor Elves had reached levels completely beyond our capabilities, the final empire does not have such insecurities. For the Precursor Empire collapsed with no hope of ever reforming, while our own is eternal. Their destruction of the 271st Empire is just a part of history now, instead of a grudge to maintain against their ancestors. We will reach their level, it is simply a matter of time. It is why we can look at their creations and marvel at the sheer scale of their ingenuity.\n\nWe have scoured Aelantir for as much elven knowledge as we can, but with the dropping of the stormwall, new lands have appeared with a cornucopia of potential precursor relics waiting to be unearthed. We know of this land’s name from the records across precursor archives. On Serenbór, in the Pillar of Heavens, they speak of these lands where incredible experiments were run. Manufacturing life, creating beasts of war.\n\nInsyaa."

 khatalashya_the_golden_scales_title: "The Golden Scales"
 khatalashya_the_golden_scales_desc: "In the records found at the Spire of the Lost, the elves referred to the lizardfolk as the Golden Scales, due to a unique form of gleaming armor that was our ancestors wore - or perhaps it was a natural coloration that was wiped out? It is unclear, for the Precursors had surprisingly little interest in understanding our biology, especially when compared to the study of the Zatsarya.\n\nStill, it was clear that some study of lizardfolk was conducted after the war, although to what extent is unclear. There are records of a being called a Wishcatcher they seemed especially interested in, but the details are scattered. We have been able to piece together maps of Aelantir from before the Ruin though, and believe we know where research of lizardfolk and biological research was done. One was in a mysterious land called Insyaa. The other was in what today is known unflatteringly as the Leechdens. We should explore both of these places further. Perhaps they contain clues. Not just to what happened to us after the war, but perhaps the elves learned something about our own biological makeup."

 khatalashya_empire_of_stars_title: "Empire of Stars"
 khatalashya_empire_of_stars_desc: "In a meeting to decide what next to ask the Thraxis, one naga suggested asking about how real the stories about the 12th Empire were. The naga in question, who hailed from Shalazar, had been having an almost century-long argument with another naga from Zerat about the true nature of this empire. Nobody else had even the slightest interest, but the seniority of said naga meant the idea was submitted to be discussed as an option. It was only when the subject could be evaded no longer did the $MONARCHTITLE$ say what the rest of the group had been thinking.\n\nNobody really cared about the validity of the 333 empires anymore. We had gone beyond the stars. We had questioned the very nature of the universe. We had learned how to control our own mutations, picked fights with genies, outlasted the Precursors. We lived on other planets. The only people who still brought up debates were those holding grudges over slights and insults. The bickering over whether the 12th, or the 130th, or the 158th, or any empire really existed feel so petty and meaningless when we live amongst the stars."

 khatalashya_the_prophecy_is_true_title: "The Prophecy Is True"
 khatalashya_the_prophecy_is_true_desc: "Lizardfolk civilization has risen and fallen. The jungles of Taneyas are littered with their remains. Their glories, accomplishments, and failings. Three hundred and thirty two empires across a hundred thousand years. New dawn after new dawn, collapse after collapse. A great empire will rise, only for it to inevitably fall as the sun sets./n/nBut not us. For the prophecy has come true. The cycle has been broken. The three hundredth and thirty third empire is here. The final empire; Khatalashya! We shall take our place amongst the stars where no light ever fades, for our empire shall be eternal."

 khatalashya_the_records_of_shangra_title: "Records of Shangra"
 khatalashya_the_records_of_shangra_desc: "The lizardfolk script is written with tens of different colors, making it somewhat difficult for anyone other than the very learned to parse it. A simpler version was devised some years ago that only used four colours that could be used by merchants and others not in the royal court or halls of chroniclers. In our weaker moments, one wishes this simpler writing style had not been created, for it has allowed heresy of Anzalkatsa to spread. Ideas about how many empires there have truly been, and how many of these historical empires may in fact be nonsense. In even weaker moments, we wonder whether these heretical preachers are correct…\n\nNo! We are looking at this incorrectly. This simpler language is a tool, not a curse. Control the language and we can control the message. If we can formulate rejoinders to every complaint of false empires before uproar about one begins, we will be prepared to combat these heresies. To do this, we need absolute control over the records of Shangra. The catacombs of tomes contain historical records dating back thousands upon thousands of years. It’s there where details of many historical empires lie. Often it is from Shangra that the heretical ideas emanate from in the first place, as though being able to directly read these texts is what highlights their contradictions. If it lies purely under the control of the naga, these ideas will stop spreading…hopefully."

 khatalashya_assert_naga_dominance_title: "Assert Naga Dominance"
 khatalashya_assert_naga_dominance_desc: "The final, prophesied empire has been declared. A joyous occasion, surely?\n\nNo, say the peasantry. They doubt us. They doubt the naga. How on earth could one possibly reliably count 333 empires? They say this is all a conspiracy by the naga to completely rule. Nobles, merchants, adventurers, mages, inventors, so many demand for more say in how this empire is run. This empire was prophesied by the naga. It was delivered under the guidance of the naga. It shall be run under the watchful eyes of the naga, for now and forever. For this empire is forever, as too is the will of the naga."
 khatalashya_assert_naga_dominance_tt: "Current ruler needs to complete at least 2 naga agendas. Currently completed §Y[ROOT.count_church_agendas_current_ruler.GetValue]§!"

 khatalashya_hydromancer_marines_title: "Hydromancer Marines"
 khatalashya_hydromancer_marines_desc: "Hydromancy is a magical school unique to lizards. Developed out of our closer connection to the water compared to other, more evolutionary challenged races, it allows us to control the seas to support our aquaculture and our armies. Naval invasions are common across lizardfolk history, most famously with the birth of the 217th Empire. Embedding hydromancers into our naval invaders will allow for much easier conquest of the islands on western Sarhal. "

 khatalashya_aelantir_lizardfolk_title: "Aelantir Lizardfolk"
 khatalashya_aelantir_lizardfolk_desc: "The discovery of Aelantir and the records of the precursors have allowed us to connect the pieces of so many parts of our history. For example, it seems clear now that the ancient empire the 271st Lizardfolk Empire fought was that of the Precursor Elves, the great empire that nevertheless died out, as all non-lizardfolk empires inevitably do. We also now have context for empires that existed before the Precursor Elves overthrew their old masters in the hated dragons.\n\nFor there were lizardfolk in Aelantir once. Not many, it must be said. The 118th Empire was in Aelantir, although its reputation as an "empire" is controversial as it is unclear whether this empire had any more than 5,000 occupants. There were also empires like the 73rd that sailed to Aelantir to defeat the dragons, only to be defeated themselves. They were known as the Draktaya, or Dragonslayers. They are the empire whose legacy we will emulate. We come here to conquer and to rule. To destroy any last draconic influence in Sarhal or Aelantir, and find the truth of what happened to them."

 khatalashya_summer_isle_lizardfolk_title: "Summer Isle Lizardfolk"
 khatalashya_summer_isle_lizardfolk_desc: "Halflings have never garnered the same ire amongst humans that the humans have. Relations have been positively cordial between our two, and we trade spices, dyes and cloth across the sea regularly. And yet something about the lizardfolk that live on the Summer Isles being under the rule of halflings has always felt wrong. It was not always this way. The Itayzemby Lizardfolk once sat in positions of power across all corners of the islands. Even somewhat recently Tsamanosy island was run out of the port city of Teramzadai by a lizardfolk administration.\n\nThere is a genius way to increase lizardfolk presence on the islands. Each lizardfolk family usually does not keep every egg from a clutch. The smallest and frailest are usually discarded, eaten, or sent to the temple to be raised there, as few families can afford to rear every clutch. We should send those smallest eggs to hatch on Tsamanosy. Not only will this increase their power over the island, but their short stature as runts of the clutch will instead be right at home amongst the halflings."

 khatalashya_spire_of_the_lost_title: "Spire of the Lost"
 khatalashya_spire_of_the_lost_desc: "We found it. On an island so deep in the middle of the ocean that no maps catalogue its existence. The elves called it Serenbór, a Bridge to the Stars. For that is what the elves and the lizardfolk were working together to build. A great spire that could take them beyond the heavens. Yet clearly it wasn’t finished. We need to know why. We need to know the truth."

 khatalashya_the_pillar_of_heavens_title: "The Pillar of Heavens"
 khatalashya_the_pillar_of_heavens_desc: "As much as it pains it to admit, the elves really knew what they were doing. The Pillar of Heavens is an incredible feat, on par with anything the first Lizardfolk Empire built, and beyond anything we can currently construct. Our wisest lizards have moved en-masse to the colonies (the Aelantir colonies that is, not the space colonies) to study this incredible structure. Our first goal was to see if we could activate it again, but it appears whatever location on the other side is not accepting its activation, or at least that is the current main theory.\n\nWhere we have had greater success is by analysing the structure itself. The precursors left behind construction details on the Pillar of Heavens, albeit much of the details have been lost. It has taken a long time, but we think we may be able to build parts of a new Zatsarya ourselves, so long as we have most of an existing base to work from. Thankfully Sarhal has a number of these partially constructed Zatsarya. The Irikin spire, the shattered remains at Ashuzual, the spire-turned-citadel in Kuvunika. Each of these have most of the main parts already in place. With the full power of the state, we can rebuild them."

 khatalashya_the_wishcatcher_title: "The Wishcatcher"
 khatalashya_the_wishcatcher_desc: "REPLACE_ME"

 khatalashya_investigate_every_lizard_title: "Investigate Every Lizard"
 khatalashya_investigate_every_lizard_desc: "REPLACE_ME"

 khatalashya_a_new_capital_for_naga_title: "A New Capital for the Naga"
 khatalashya_a_new_capital_for_naga_desc: "We have something of a problem. Our choice for administrative centre for the final empire has started to cause fractures in our coalition. Discussion on which center would be the "correct" choice for a capital gets bogged down in endless debate because every historic lizardfolk city considers their city to be the most important. You would think the naga, in all their wisdom, could rise above the ruckus. But naga too have their loyalty to their hometowns and have not been able to leave aside their biases to make an objective correct choice. To choose a new capital, we need one that all naga can agree on. We may have the perfect idea.\n\nYou see, the humble and profoundly stupid tchoken is the food of the masses. It has fed lizardfolk for as long as there have been lizardfolk. No naga is above a good roast tchoken leg. But if there's one delicacy a naga enjoys above that of the succulent tchoken, it would be a fish from Lasadza Fish Market, for there is no greater taste than a freshly caught Lasadza trout fried over an open fire. Locals have even started pairing them with a new Aelantir food type called potatoes, which go wonderfully if chopped and fried alongside the fish. Lasadza Fish Market has never been home to any historical empire (with the possible exception of the 200th Empire, which was located in the middle of the lake in a floating capital) so none can claim bias in its choice, and every naga would relish the chance of living closer to the the source of such a delicacy."

 khatalashya_two_hubs_of_naga_title: "Two Hubs of the Naga"
 khatalashya_two_hubs_of_naga_desc: "The two greatest cities of lizardfolk in Shalazar and Zerat have historically also hosted the greatest council of naga across Taneyas. Unfortunately these two hubs of naga have grown apart over time, not helped by the centuries where the cities were separated by the bloodcursed Ashhana. This has led to the Rhada naga of Shalazar and the Ichiadza naga of Zerat having very different opinions of how society should operate, how leaders should act, and how to direct our people.\n\nWe need to stop this factionalism amongst the naga. There already exists dissenting voices amongst the populace as to the validity of the 333rd Empire prophecy. If we do not present a united front of naga, this will only fuel the conspiracies and weaken our ruler’s position, as they will be forced to constantly balance the trust of the two factions."

 khatalashya_under_kus_an_zhyani_title: "Under Kus An Zhyani"
 khatalashya_under_kus_an_zhyani_desc: "Overlooking Zerat, the city between the lakes, stands Kus An Zhyani. The greatest of all Zatsarya. Where other spires have been worn down, damaged, blown up, cursed, sunken, or gone missing over the millennia, the spire of Zerat stands as unblemished as it did the day the first empire built it. It is a testament to the longevity of lizardfolk civilisation. As long as it stands, the prophesied empire would arrive.\n\nNow that the final empire is here though, the naga have been facing repeated questions by the ruler and his non-naga advisors. Is it not time to explore Kus An Zhyani? Understand the messages left by the first empire? Understand its purpose? Why did the gods show them how to build it, and what is its purpose? It it time to break with thousands upon thousands of years of tradition and let more than the spire’s guardians into the sacred spire?"

 khatalashya_the_shadowroot_title: "The Shadowroot"
 khatalashya_the_shadowroot_desc: "The Night Hags of Yezel Mora have terrorized the lizardfolk since they arrived shortly after Ashen Skies, on year 1 of the modern calendar. Terrifying though they may be, in the grand scale of lizardfolk history, that is but a blip on the timeline. Their power is but a fraction of some of the most terrible creatures that have collapsed lizardfolk society over time. The 271st Empire and the magical beings from across the ocean who collapsed the most advanced lizardfolk empire since the very first one. Or the many lizardfolk empires that were brought to ruin by the mythical being known only as Tchazara, including the 85th, 99th, 100th, 120th, and 121st.\n\nThe Night Hags are just another in the long list of powerful beings the lizardfolk eventually overcame. They cannot collapse this empire, for this is the 333rd Empire, and our reign is eternal. Removing their blight from the lands is as simple as removing their control over the world tree at the center of the Shadow Swamp. The swamp was once home to lizardfolk too, before those hags took control. It will belong to lizardfolk soon once again."

 khatalashya_empires_outside_taneyas_title: "Empires Outside Taneyas"
 khatalashya_empires_outside_taneyas_desc: "The great cities of Taneyas have been the centers of most of the lizardfolk empires, and for centuries it has been our home. But obviously lizardfolk have not just stewed in these jungles for a hundred millennia. The empires between the 35th and 42nd that existed across the sea in Haless. The desert empires of 234th to the 243rd that stood in the Salahad. The 118th Empire that was in what today we know as Aelantir. From the genie coast to the coffee coast, deep in the Shadow Swamp to the Summer Isles, lizardfolk have made many different corners of this planet our home.\n\nIt’s time to move outside Taneyas. Claim and reclaim all previous homes of empires past. Taneyas cannot contain the Final Empire. Even Halann will struggle to contain our inevitability."

 khatalashya_naga_bureaucracy_title: "Naga Bureaucracy"
 khatalashya_naga_bureaucracy_desc: "Do you know what the worst part about being the stewards of the final, the prophesied, the 333rd Empire is? That nobody tells you how much work goes into said stewardship. You would think the naga could relax now that the empire is destined to last forever, but that has not stopped the endless paperwork from flowing through the halls of governance. It has increased the workload of the [ruler.title] far too much, leaving little room to concentrate on external matters of war, colonisation, diplomacy, and so on.\n\nWhen you find yourself in doubt though, one can always turn to the examples of the previous 332 empires and see what we can learn from them. For this we turn to the 167th Empire, whose complex and sophisticated bureaucratic system was developed over centuries to the point where the bureaucracy could function with no oversight from the ruler. It got to the point where the king abdicated in fury over his apparent lack of purpose and handed the crown to a tchoken, yet the empire remained running for the next 80 years under tchoken royalty.\n\nThe lesson from this is not that we could put a tchoken in charge and we would be fine, and you would have to have the brains of said tchoken to think that. Said empire did eventually collapse after all, and ours will never. Instead the lesson is that a functioning bureaucracy can free the [ruler.title] from internal responsibilities and focus on the big picture. Hand all bureaucratic matters over to the naga and the state will so smoothly that it will never fail."

 khatalashya_genie_coast_lizardfolk_title: "Genie Coast Lizardfolk"
 khatalashya_genie_coast_lizardfolk_desc: "Of all the greatest enemies of lizardfolk, dragons stand at the top. In second place though stood the genies. They took great delight in crushing many a historical lizardfolk empire. The 313rd Empire in Madriamilak. The 239th Empire in the Shadow Swamp. The 137th, the 307th, so many lizardfolk lives ended at the hands of the genies.\n\nAnd yet we know that once they feared us. The 271st Empire, possibly the third greatest of the historical empires, after the first and our own, scared the genies out of all lizardfolk territory. Their greatest cities stood in what today is called Dao Nako; the Genie Coast. At the Zatsarya of Kazakesh once stood a tremendous city. Before the city was sunk into the earth itself and lizardfolk were chased from these lands by genies and humans alike. What lizardfolk that remain here live a downtrodden existence, forced into hiding by the humans who would oppress them.\n\nRestore the city of Kazakesh. Restore the Shyashkay lizardfolk culture of Dao Nako that have been beaten into the dirt. We are the Final Lizardfolk Empire. All lizardfolk will come under our reign, and all lizardfolk will prosper under our reign. If not now, then soon, and when they do, it will last for eternity."

 khatalashya_271_empire_title: "271 empire"
 khatalashya_271_empire_desc: "271 empire"

 khatalashya_colonial_naga_title: "Colonial Naga"
 khatalashya_colonial_naga_desc: "Colonial Naga"
 khatalashya_colonial_naga.tt: "Up to 30 provinces of lizardfolk culture in Dao Nako and up to 30 in Fahvanosy gets 1 manpower and 1 tax"

 khatalashya_mutations_outside_taneyas_title: "Mutations Beyond Taneyas"
 khatalashya_mutations_outside_taneyas_desc: "As much as we like to pretend the massive variety of mutations amongst lizardfolk has always been accepted as natural, in reality some of the more extreme mutations were more reluctantly accommodated than happily embraced. Not every mutation variant commands the respect the naga gets for instance, for not all mutations have the power of the naga, both culturally and magically.\n\nHowever, as more lizardfolk move outside the jungles of Taneyas, we’ve started to see more mutations crop up. New generations are hatched with characteristics never before seen in lizardfolk. Some Taneyas lizardfolk have developed prejudices towards these new lizardfolk, calling them not "true" lizardfolk. This is an insidious belief, as if this idea takes hold, even mutations born within Taneyas can be rejected, as they do not conform to the vision of what a "true" lizardfolk looks like.\n\n We cannot allow this narrow view of what a lizardfolk is to take hold. We are the empire to rule all lizardfolk. This is a central part of the prophecy. Not a specific kind of lizardfolk. All lizardfolk."

 khatalashya_precursor_research_title: "Precursor Research"
 khatalashya_precursor_research_desc: "The records at the bottom of Kazakesh have opened the door to so much lost knowledge. These are from the 271st Empire, the most advanced lizardfolk civilisation until our own. They could tell that the spire had a technical purpose. They worked together with the Precursor Elves to try figure out what its purpose was. Yet to the best of our knowledge, they weren’t able to uncover its secrets.\n\nWe, however, have uncovered the secrets of Khus an Zhyani. We know the Zatsarya are teleporters that can send you to an unknown world. We believe Kazakesh can too send us to a different part of Romutha, allowing us to explore more of this strange land. Despite being buried underground, the spire appears as though its insides are fully functioning. If we follow the same process as we did in Zerat, we can activate Kazakesh too."

 khatalashya_agradent_materials_title: "Agradent Materials"
 khatalashya_agradent_materials_desc: "The discoveries on the planets of Agradent and Romutha are astonishing. Ores and metals found so rarely on Halann are abundant on Romutha. Agradent is littered with old Precursor Elven artefacts and knowledge. Our engineers have been salivating over what we can do with these materials in full abundance.\n\nWhat has perplexed our researchers the most though is the presence of lizardfolk on these other planets - or in the case of Agradent, lizardfolk ruins. They must date back to the first empire, for that is when the spires were built. But what of all these other spires? Do they all go to other planets? Was Halann the origin point of all interstellar travel, or was Halann not the original. Something before the First Empire. Something not of Halann.."

 khatalashya_mutation_investment_title: "Mutation Investment"
 khatalashya_mutation_investment_desc: "The more lizardfolk move to different lands, the more we realise how much variance in mutations there can be. It’s not just random. Mutations are often reactions to the environment itself. Which then raises questions of how much control can we have over mutations. We considered each one a gift from the gods that could not be predicted, but by now we know there is some level of control in the process. Take all the strangest and most unique mutations across Taneyas and start experimenting. Can we move the eggs of mutated lizardfolk out of their homeland and they will still be born with the correct characteristics? If we move a naga egg to Romutha, are they born differently?\n\nIt is staggering how much we don’t know about ourselves. We don’t even know where we’re from, how we got here, why we change, and so much more. The more we learn about ourselves, the more we realise how little we truly know."

 khatalashya_a_spire_between_planes_title: "A Spire Between Planes"
 khatalashya_a_spire_between_planes_desc: "We found the spire in the Shadow Swamp!\n\nObviously we knew that there were once more Zatsarya. They can be damaged after all, and have stood for tens of thousands of years. But what became of those other spires? For the most part, we understood them as being completely destroyed and their component parts carted off to different parts of the continent. In some cases they were swallowed by earth and lava, as was the case for the one destroyed during the 223rd Empire.\n\nBeing buried by lava though is one thing. Lava could probably melt even a Zatsarya. Swamp water though? Surely no Zatsarya could be destroyed by that. We already have an example of a spire remaining perfectly preserved after being swallowed by the earth. Kazakesh, the spire on the Genie Coast, worked just fine.\n\nAfter extensive expeditions, the spire was uncovered, albeit not by any prospector, but by a simple tchoken farmer. In Tovhichesu, the tip of a spire, fading in and out of sight. It appears to exist between two planes at once, although its connection to the shadow plane is fading. Pulling it out of the earth will be the most difficult task. But once we do, there will be no greater sign of lizardfolk control over the Shadow Swamp than resurrecting a great Zatsarya at its centre. I wonder what planet this one leads to?"

 khatalashya_space_naga_title: "Spacefaring Naga"
 khatalashya_space_naga_desc: "Naga are creatures of routine and tradition. It is they who guide the people to live virtuous lives according to Anzalkatsa. It is they who pronounced the 333rd Empire and that the prophecy had finally been fulfilled. Naga are integrated into every aspect of the running of Khatalashya.\n\nAnd yet in these heady days of space travel, the naga have felt like control has been slipping through their fingers. Trying to guide the lives of space colonies from Taneyas feels impossible. Are they living true to the teachings of Anzalkatsa, so far away from the homeland?\n\nNaga too must move with the times. Eternity does not stand still. There needs to be permanent naga headquarters in every one of our space colonies. No more of these special naga envoys, reluctant to leave their homes on the shores of Lake Lasadza. Romutha needs its own naga. So too does Agradent. So too does every planet where lizardfolk now make their home. We cannot fear that a spacefaring naga’s interpretation of Anzalkatsa may drift from those on Halann, for the interpretations of Anzalkatsa doctrine will shift an infinite amount of times in the infinite time of the final empire."

 khatalashya_space_mutations_title: "Mutations Beyond Halann"
 khatalashya_space_mutations_desc: "New mutations have been appearing across every space colony. There is one new mutation on Romutha capable of drinking the black oil on that planet and breathing fire, using it as fuel. Another on Agradent has developed legs similar to that of a cricket, allowing them to jump astonishing distances. This is on top of the unique mutations present in the lizardfolk populations found on other planets.\n\nAttempts to integrate all of these mutations into our military have not gone well. Taneyas commanders have little experience with them and find it difficult to incorporate such a variety of lizardfolk into battle plans. We would be better off granting more autonomy to the colonies in matters of military organisation. They know how to use these mutations and get the best out of them during warfare."

 khatalashya_the_eternal_empire_title: "The Eternal Empire"
 khatalashya_the_eternal_empire_desc: "REPLACE_ME"

 khatalashya_the_underwater_spire_title: "The Underwater Spire"
 khatalashya_the_underwater_spire_desc: "The question of how to re-active the spire of Arskitse has been a tricky subject for a while. It could be possible to haul it from the bottom of the ocean onto land, but dislodging it from the seafloor would be difficult without sending divers down to dig it up, nd the merfolk would never allow us to do that. A full scale extermination of merfolk was not an option either, and fistfights had started when it was brought up in one meeting.\n\nFortunately, we may have our solution. Shagatan lizardfolk are more than happy spending their entire lives underwater. Even merfolk with Taneyas parents, if their eggs are hatched on Shagatan, are born with the glidz mutation that allows them to spend hours, even days, underwater. "

 khatalashya_mutations_controlled_title: "Controlled Mutations"
 khatalashya_mutations_controlled_desc: "It is amusing that humanity considers elves, orcs, harpies, dwarves, and harpies all as separate races from themselves. A sign of their lower intellect and lack of history to see long term. Lizardfolk can look so very different from one another. The mutations different types of lizardfolk can exhibit vary so incredibly wildly. Extra sets of arms, eyes, legs. Massive hulking armored bodies that rival a troll in size to the small scuttling lizards near indistinguishable from a kobold. These are all lizardfolk, and all part of the final empire. Bring all mutation variations under our control and let them understand that all mutations of lizardfolk are part of the 333rd Empire."

 khatalashya_end_the_bloodcurse_title: "End the Bloodcurse"
 khatalashya_end_the_bloodcurse_desc: "The bloodcurse tore Taneyas asunder. Thousands upon thousands of lizardfolk, twisted by the curse of the Night Hag’s Coven, stampeded through the jungles and collapsed the penultimate empire. A tragedy, yes, but as an empire that is destined to last for eternity, we can take the long view on such a curse. The 332nd Empire was hardly the only empire to collapse due to a disease of some kind. The 19th Empire suffered from the Curse of Angels where its populace gradually faded out of existence. The 158th Empire collapsed in a pandemic due to eating too many tchoken. A curse like this will pass.\n\nThe issue is one of control. The bloodcurse causes the Ashhana to lose control of their mind and attack whatever is in front of them. If we can maintain full control over every Ashhana Lizardfolk in our borders, we can control every and any instance of a crocodilian lizard from falling to the red mist ever again."

 khatalashya_irikin_spire_title: "The Irikin Spire"
 khatalashya_irikin_spire_desc: ""Kuiika Gamyi" the humans call it. We know it’s true name. The Irikin Zatsarya. Standing proud in the wide open plains to the west of Taneyas, it was once home to the great Irikin Lizardfolk culture. The top broke off some indeterminable time ago, although we can surmise via the records of historical lizardfolk empires that it occurred sometime between the 51st and 102nd empires. Yet even despite that, its majesty is incredible. Even the humans know that, for they too worship it. Although they do not understand its true meaning. It was left for us. For the final empire.\n\nAdmittedly it appears the damage to it means it will never be able to be restored to its original purpose. Nevertheless, the symbolic importance of returning this spire to lizardfolk hands would signify we are ready to reclaim the plains and restore the lost Irikin culture."

 khatalashya_we_used_to_live_here_title: "We Used to Live Here"
 khatalashya_we_used_to_live_here_desc: "We know lizardfolk used to live in the Shadow Swamp. There were even empires with a capital based out of here. Supposedly a great Zatsarya even stood near its center. As our early colonists attempt to make this place a new home for our expanding empire, that seems impossible to believe. Color drains the further you venture into the swamp. Even the brightest scaled lizard loses its vibrancy under its monochrome magic. Our multicolored text we hold such pride in becomes unreadable in simple black and white.\n\nStill, there are some positive signs. Ever since we purified the Shadowroot Matriarch of the Night Hag’s torture, shoots of green have started appear on some trees. The shambling mounds that terrorise even the trolls appear to be fewer in number. Perhaps the most promising sign though is how utterly unfazed our farm’s tchoken are by the surroundings. Not a single bit of color leaves their body. If a simple tchoken can handle the swamp, then surely a race as resilient and resourceful as the lizardfolk can thrive in such an alien environment."

 khatalashya_new_irikin_mutations_title: "New Irikin Mutations"
 khatalashya_new_irikin_mutations_desc: "Lizardfolk mutations were often considered to be blessings by the gods. Each lizardfolk has always had the possibility of a mutation emerging during their time in the egg, although not all mutations will emerge at the correct time for each lizard. The emergence of the dashirik mutation amongst the Irikin Lizardfolk has prompted us to examine our mutations with more interest. They have evolved to be more comfortable in direct sunlight, with broader and wider legs better suited to travelling long distances over the plains. Records of past empires show that lizards with these mutations have existed in the past.\n\nThis brings to bear a fascinating idea: could we tap into our beings and resurrect old mutations? Is this something that we won’t need to rely on purely divine intervention to achieve, but something we could recreate with the right conditions?"

 khatalashya_shadow_lizards_title: "Shadow Lizards"
 khatalashya_shadow_lizards_desc: "The 333rd Empire may be set to last for eternity, but eternity is ever changing. Lizardfolk mutate and so do our beliefs. The idea that the Khaga-Yetsa is cursed and should not be entered has lost supporters amongst the populace. Many naga are…reluctant to shift their beliefs, and technically have the sort of absolute power to convince the [ruler.title] to not bow to their whims. But naga have not risen to such positions of political influence by ignoring the desires of their people. Besides, with the gasabi lizardfolk able to enter this cursed spire, the prospect of activating it feels so tantalisingly close. What other worlds lie on the other side?"

 khatalashya_space_tchoken_title: "Spaceborne Tchoken"
 khatalashya_space_tchoken_desc: "Life on the planetary colonies can be harsh. Crops failing is a common occurrence, and a lot of food has to be transported to the colonies to keep them afloat. Endless open lands available for those seeking a new life sounds exciting until you realise how unforgiving attempting to eke out an existence on these alien worlds can be. The colonies would have failed if not for one secret trick of the lizardfolk species.\n\nThe tchoken.\n\nIt adapts to any environment seamlessly. Its attitude to life does not change no matter whether the sun shines bright above Halann or the black ring of Romutha hovers ominously above it. To be compared to a tchoken was once considered the greatest of insults. It meant you were stupid, ignorant, gormless, and slow. On the colonies to be compared to a tchoken…well, it still usually is meant as an insult. But for some it is about resilience. About the ability to adapt to any surroundings. It represents what it truly means to be a citizen of Khatalashya. It doesn’t matter where in the world - no, the galaxy - you are. You will adapt. You will survive. You will thrive."

 khatalashya_empire_of_the_swamp_title: "Empire of The Swamp"
 khatalashya_empire_of_the_swamp_desc: "Empre"

 khatalashya_tchoken_farms_title: "Tchoken Farms"
 khatalashya_tchoken_farms_desc: "The Shadow Swamp is ours. The Night Hags have been purged and their terrors will never again trouble the lizardfolk. Another enemy of our kind perished as we once again survive and thrive.\n\nAnd thrive is indeed the correct word for how our resettlement of the Shadow Swamp has gone. The secret ingredient was the humble and stupid tchoken. Where other crops failed and animals struggled, tchoken revelled in such harsh conditions, unblemished by the color-sapping properties and unfazed by the local fauna. You would think it bravery had you not earlier that day been forced to rescue a sinking tchoken that had wandered into a bog and made no effort to prevent itself from sinking as it chewed on plants.\n\nAnd yet, despite this, our settlements in the Shadow Swamp, and indeed our glorious final, prophesied, 333rd Empire, runs on tchoken. If the front of our flag proudly shows the Thraxis, then its back surely contains the bulbous eyes and stubby legs of the tchoken. "


#Events

 empire_333.1.t: "Faith in the Prophecy"
 empire_333.1.d: "How do we know there have been 333 empires?\n\nEver since the pronouncement of Khatalashya, this question has been raised, and the answers given by those in charge and the naga have not really satisfied those asking the questions. For starters, these empires supposedly stretch back 100,000 years. That is a truly mind-bogglingly large amount of time. The amount of records we have from even the 330th Arskitse Empire are slim, most of it having been lost in the wake of the Onslaught, when many of their great cities were sunk beneath the ocean.\n\nThat was a little over 2,500 years ago. How could we possibly know about empires 25,000 years ago? Even what verifiable records we do have are written by a lizard who was copying a text that was copying a text of a writer who heard from a hermit who spoke to a spirit that heard it from the gods themselves. It is a historical game of Yanshen Whispers where the message has surely been lost over time.\n\nThe issues could be alleviated if the stance was that the stories of the 333 empires are merely metaphorical. They are fables. Lessons you can take in how to properly govern a country. But if you accept that stance, then there is no reason why the 333rd Empire should be special. The entire prophecy is founded upon the central conceit that Khatalashya is definitely the 333rd Empire, and therefore destined to last forever. Should even one small piece of doubt enter the minds of its citizens, faith in the prophecy will collapse and the absolute right to rule will be challenged. The naga will not allow that to happen."
 empire_333.1.a: "You will not doubt the prophecy"

 empire_333.2.t: "Nonsense Empires"
 empire_333.2.d: "The issue of the 333 empires shows no signs in subsiding. If anything, the problems are only getting worse. Most lizardfolk only know about a few of the more famous empires. The 1st Empire, who were bestowed the spires by the gods. The 271st Empire, whose advancements frightened even the genies. What has been less publicised at the empires with perhaps more dubious stories, and the entire prophecy risks becoming a laughing stock.\n\nTake, for example, the 55th Empire. It was simply a single hermit alone in his hut. He declared himself emperor and dared anyone to challenge him. When nobody spoke up, which naturally nobody did as he was completely alone, he pronounced the beginning of his "empire" and started detailing his exploits as emperor.\n\nThe fact that this empire is counted amongst the 333 is made all the more jarring by the fact Karassk was never considered an official empire despite ruling the entire eastern Sarhal coast at one point. The explanation that it couldn’t be declared the 333rd Empire while the 332nd Empire of Zerat still stood doesn’t hold water when you consider that there have been times where multiple empires were active at once, including on occasion when 6 empires were all active at the same time. It is almost as though they were not declared the final empire as they did not allow the naga to have as much importance in their society as they wished...\n\nFaith in the 333rd Empire will lie in its actions. Despite being eternal, we do not have eternity to assuage the doubts of the populace. If our reach can encompass all lizardfolk, our influence stretches across the oceans and beyond even the stars themselves, then stories like that of the hermit will just become curious oddities of our foundational story rather than undermining faith in the prophecy."
 empire_333.2.a: "There has definitely been 333 empires"
 empire_333.2.tt: "We will get periodic events that drop our nation’s Faith in the Prophecy. Complete missions to restore Faith in the Prophecy."

 empire_333.3.t: "After Arkitse"
 empire_333.3.d: "The 330th Empire’s capital was in Arskitse, a great city that now rests underwater. The story goes that the emperor conducted an arcane ritual out in the middle of the ocean, and in doing so angered residents of the deepest underwater trenches. These Deep Devils rose up and invaded not just Taneyas, but the entire continent, from the Divenhal to Ardimy, in an event known as The Onslaught. They sank many of their island cities to the bottom of the sea. Lizardfolk may be semi-aquatic, but they cannot live in an underwater city. Besides, after the monstrous creatures rose from the deep ocean, few lizardfolk were keen to enter the waters again for years. The cities were abandoned, with only the Arskitse spire rising above the sea as a reminder of what was once there.\n\nOver a thousand years later, these sunken cities were home to a new people: merfolk. Arskitse is now their home, as are many other sunken cities along the coast. Lizardfolk have long cultural memories so had little trust in a species that emerged from the seas. But Deep Devils the merfolk are not.Instead a new theory has emerged.\n\nMerfolk are ruinborn.\n\nMerfolk only appeared in Sarhal shortly after Ashen Skies in the year 1. Though at first glance their fishy scales and long tails instead of legs might lead you to consider otherwise, they do bear a general elf-like appearance, including their pointed ears. The discovery of degenerative ruinborn in Aelantir that have mutated far beyond what elves normally look like lends credence to the theory.\n\nThis is a controversial topic in merfolk society. To them, merfolk are merfolk, and not some other race. Some people have even been ostracised and kicked out of their homes for trying to debate the topic.\n\nMany of these ruinborn-ancestry believers have banded together and approached us recently asking for assistance. They wish to return to Aelantir and uncover the truth. Crossing the ocean as a merfolk is not feasible. But with the help of an above-sea ship, they could hitch a ride with us to Aelantir if we can secure them a new home."
 empire_333.3.a: "We will do our best to assist you"
 empire_333.3.tt: "If we or a subject control provinces in Aelantir in 5 years, we will get new Merfolk Settlements in Aelantir"
 empire_333.3.b: "Get there yourselves"
 empire_333.3.c: "We can bring you there now"

 empire_333.4.t: "Aelentir Merfolk"
 empire_333.4.d: "The theory that merfolk are ruinborn has grown amongst merfolk society, although in doing so it has only increased the blowback against it. Merfolk societies are typically not eager to share any internal struggles with those above land, but we have gathered that there are entire villages worth of merfolk ready to leave for fear of persecution for their belief in the ruinborn theory. With out new holdings in Aelantir, we are ready to give them a new home."
 empire_333.4.a: "The land of the free"

 empire_333.5.t: "Stars in the Sea"
 empire_333.5.d: "To ponder the heavens is to ponder the nature of the gods themselves, and is not a box a lizard should dare open.\n\nBefore Anzalkatsa, the primary lizardfolk faith was a mixture of worship of the araizary, and belief in the creator gods. Both araizary and the gods were symbolised in the stars. The proof of this was that attempting to discern the movements of the stars would afflict not just the observer, but everyone in their village, with a sort of sickness. Across Halann this is known as Astral Terror, an affliction that occurs whenever one studies the night sky for too long.\n\nIn our hubris, we believed the final empire would be immune to this ailment. That we could examine the movements of the constellations and summon the Thraxis back to Taneyas and tell it of our accomplishments. This was not the case. The observatories in Katala Raz and Odu Kherass have been destroyed. Torn down by their own occupants, driven mad by the skies, speaking of something that was watching them back. Not the Thraxis. Something else. Something always out of your field of view. Something watching us.\n\nAnd yet…\n\nThe island observatory was different. Instead of gazing through a telescope, they looked at the sea itself. Using its reflection to gaze at the stars. The idea that this would solve Astral Terror was mocked. After all, telescopes too use reflections, as they are simply a series of lenses and mirrors. Perhaps it was not the reflections that saved us, but the araizary in the water.\n\nWhatever the reason, it must be studied further. For true breakthroughs have been made in the movement of the stars, the patterns of the thraxi, and the possible method by which we can summon the Thraxis. The araizary of eternity meets the eternal empire. We are so close."
 empire_333.5.a: "Divert all resources to the island observatory"

 empire_333.6.t: "Deep into the Plane of Earth"
 empire_333.6.d: "The Plane of Earth has no sky. The most comparable location would be the tunnels under the Serpentspine, but nothing could quite compare to the sheer strangeness of this land. The earth itself appeared to glow, giving the whole land a dim red light that illuminated proceedings. Rivers of mud flowed in upwards waterfalls, while formations of pure diamond kilometers across hovered in mid-air. The inhabitants were not typically hostile, although neither were they typically friendly. Mining expeditions tended to give any earth elementals wandering the plane a wide berth. If one had made its home next to a rich vein of coal, we had little option but to mark it on a map for future exploration and move on.\n\nThankfully, genie palaces were hard to miss. Their resplendent glory contrasted supremely with the ugly rock and earth that surrounded them. Hewn from ore and bright gemstones, each one stood out amongst the landscape and were used as markers in maps for explorers already.\n\nThe first expeditions had simply planned to mark every genie palace on the map as a place to explore later, but as luck would have it, we did not need to explore that far. Standing atop one genie palace, gleaming with greater beauty than even the palace itself, stood what we were looking for: A Zatsarya! In one, complete piece, the stars sparkling across its face. The path was drawn, the expedition returned, and our next expedition of 20,000 troops returned to reclaim our spire.\n\nIt was a disaster. "Look at these flies", roared the lead genie, flicking her hand and wiping away every single weapon in our arsenal. "I think they want their spire back, how cute. These are the creatures you were once afraid of?" Another genie gestured their hand vaguely in the direction of the army, sending a cascading river of mud to wipe away the forces. "I told you, they once had wishcatchers. It was different. It was…"\n\nNobody heard the rest of the conversation. Only 12 lizardfolk returned."
 empire_333.6.a: "That went poorly"

 empire_333.7.t: "Tchoken in the Cursed Spire"
 empire_333.7.d: "Nobody enters the Khaga-Yetsa. It is cursed. It has been cursed as far back as the 34th Empire. If you enter the spire, you die. The longest someone has stayed alive after entering the spire is 12 seconds. There have been a few exceptions to this over time, but on every occasion what emerged from the cursed spire afterwards was a being so hideously mutated and terrifying that no records have been left of what they resembled, except that the resulting monstrosity successfully collapsed the empire. With that warning in place, a strict perimeter is placed around the spire so none even dare try enter it.\n\nThe job of a guard of a spire that kills you can be quite boring though. It is understandable that their minds may have wandered and they may not have noticed when something wandered into the spire. Not a lizardfolk though, nor a troll or human nor halfling, but something much more mundane: A tchoken. The guards only spotted it as it sauntered brazenly into the open door at its front.\n\nCue utter panic. The most common form of empire collapse has been at the hands of a tchoken, a curious case indeed given there is nary a creature less threatening than a tchoken. For the 333rd Empire to potentially fall at the hands of a mutated monster tchoken would be the greatest embarrassment of them all. A full half hour of sheer panic was replaced by confusion when out from the spire wandered our defiant tchoken. But it was not alone. For accompanying it were a full family of tchoken, who had evidently been living in the spire.\n\nThis whole ordeal raised so many questions. It was well known that tchoken were typically unaffected by certain types of planar magic. It’s why their bright colors shone even amongst the monochrome surroundings of the Shadow Swamp. But for them to wander into the cursed spire of Khaga-Yetsa was something else entirely. Could the right mutation of lizardfolk also breach the cursed spire? On top of that, why were we still afraid? We are the final empire. If we truly believe we are eternal, then no monster can destroy our empire. We can conquer the mystery of the cursed spire as well. We just got our first clue."
 empire_333.7.a: "Start the investigations"

 empire_333.8.t: "Usurpation of the Golden Scales"
 empire_333.8.d: "10,000 years ago, the elves of Aelantir overthrew their draconic masters. 2,000 years later, they encountered our ancestors and struck up a friendship over a mutual hatred of dragons and desire to share research. We were friends. Allies. We worked together to understand the mysteries of Halann. How did damestear work? What was the purpose of the spires in Sarhal? What was Astral Terror? The elves knew they wanted to reach beyond the sky itself, but whatever was up there was preventing them. They needed another way, and we both believed the answer lay in the spires.\n\nThe half-built spire on Serenbór was a symbol of this cooperation, or so our archeologists have been able to gather. While unsuccessful at restarting the spires in Sarhal, the two sides agreed to work together to construct their own spire using what knowledge they had gathered from Kazakesh. It was a symbol of our friendship. A mutual desire to understand the world and allow both peoples to thrive.\n\nBut something went wrong. There does not appear to have been a clear event. The answers remain scattered and unfocused. Some records blame lizardfolk for being uncomfortable building a mimic of what was granted to us by the gods. Other records blamed a mysterious being called the Wishcatcher, although what it did was unclear. Others simply spoke of not wanting to share the skies with "lesser" beings.\n\nThe resulting war was known as the Usurption of the Golden Scales. The war was one of extermination. They cast aside our friendship and destroyed our civilization, and with it the 271st Empire, the greatest Lizardfolk Empire since the first, was destroyed."
 empire_333.8.a: "Never trust an elf"

 empire_333.9.t: "The Empire of Souls"
 empire_333.9.d: "For those doubters of the 333 empires, the supposed Empire of Souls in Haless is a source of mockery. If every empire bar one between the 34th and 43rd Empire was based out of Haless, then why do no lizardfolk live there now? Why are there no lizardfolk ruins? Claiming it was tens of thousands of years ago is fanciful, as we have ruins of ancient empires across Taneyas. Were the buildings too spirited away?\n\nEver since the Merfolk Canal was built and travel to Haless became easier, more and more lizardfolk merchants have been travelling to the continent, and word has been spreading of something that may indeed prove the Empire of Souls. As we understand it, each region of Haless is guarded by a great spirit. A dragon, an elephant, a carp, a fox. So, what is the great spirit that rules over the Lulupan Rainforest, the most natural habitat for lizardfolk on the continent? A lizard.\n\nThe coincidence is too great. It must know of the Empire of Souls. It must have come from the times of the Empire of Souls. As we quash any doubters of the 333 empires, we must gather definitive proof of their existence, and in the spirit of Lulupan we may have an answer."
 empire_333.9.a: "To Haless!"

 empire_333.10.t: "We Were Their Experiment"
 empire_333.10.d: "Precursor Ruins litter the Effelai. The presence of the singing jungle has dissuaded naught but the most determined, or suicidal, of explorers. The troves of relics and research facilities here are incredible, if one can push past the carnivorous plants and their seedthralls. Normally it is the facilities packed with relics that attract the most attention. Today though, it was a simple archive. A few elves had used this location to study a primitive species, making adjustments to their surroundings to see their response. Removing troublesome pests who might interrupt their experiments. Poking and prodding at their subjects and taking diligent notes.\n\nWe were those subjects. During the Usurpation of the Golden Scales, the elves did not just defeat us in battle. They continued fighting. Long after we had any ability to fight back, they continued to slaughter us. They destroyed our technology, our cities, our knowledge. They targeted specific mutations that they feared - the mysterious Wishcatcher - and ensured they killed every last one. In the interest of nothing but curiosity, they saw the many accomplishments of our great empire, and reduced us to using nothing but sticks and stones. And then they just watched. For a thousand years, watched us struggle.\n\nUsurpation? That is what they called it? Stare around this hideous jungle, at the leechmen that inhabit this land. At the ruin circle. At the relics of their empire. You usurped nothing. Your people failed. You blew all this up. We survived. Because the lizardfolk always survive. We were here before the elves, and we will be here long after the last elf dies. The final empire has always been destined to rise, and not even the Precursor Elves could stop it!"
 empire_333.10.a: "Just try usurp us now!"

 empire_333.11.t: "Get Back Our Spire"
 empire_333.11.d: "The genie palace stood unchanged from when we last broached its entrance deep in the Plane of Earth. The Zatsarya at its middle stood gleaming and sparkling as the last time we saw it. The army was smaller compared to last time we passed through the portal in Shalazar, yet more confident. This time the genies did not even notice the force until they had entered the grand palace gates. The first pair of genies spotted did not even speak, but merely waved a hand in the general direction of our army and continued their conversation.\n\nBut nothing happened. The army continued to march. The first round of soldiers started to prepare their muskets. One of the genies stared at their hand in confusion. The other peered at the army in disgust, until their eyes rested on a singular figure in our midst. Her expression shifted slowly from disgust to horror to sheer panic and, stumbling over herself, she screamed and ran. Fear too struck the second genie, but instead he stood up and shouted: "By the power of my wish, I demand you all to cease your existence!"\n\nThe air shimmered. Sparks shot from the genie’s hands and swirled above the army, before coalescing into a single stream and pouring down into the open mouth of a single, wide-frilled lizard. The genie did not move. Stuck in place through nothing but abject terror. The last thing he could do before being riddled with musketfire was scream.\n\n"A WISHCATCHER!!!"\n\nWithin 3 hours, the entire palace had been occupied. Every genie had either been driven out, or been…eaten? It was not clear what happened. Musketfire does not kill a genie, but it does temporarily incapacitate them. Then the wishcatcher would approach the genie and it would simply fade, leaving behind nothing but a pair of curly-toed boots. Genies are supposed to be incapable of dying. They can only be bound or banished. But if their very essence of being was eaten, what happens?\n\nWhatever had happened, genies were no threat to our kind anymore. The spire could be returned to its rightful place in Shalazar. The being that so terrified both elves and genies had returned. No mutation could ever be wiped out again, for now we know they can always be brought back. Every mutation is eternal. Our empire is eternal!"
 empire_333.11.a: "Take that genies!"

 empire_333.12.t: "Inner Workings of the Zatsarya"
 empire_333.12.d: "Peering out over the great city of Zerat, in an open courtyard, flanked by holy guards, stands Khus an Zhyani. The Centre of Heavens. A gift from the gods to the first lizardfolk empire, along with all the other Zatsarya spread across Sarhal. Yet none are as complete and unblemished as the spire in Zerat. In the stillness of the morning light, as the small crowd waited for the $MONARCHTITLE$ to speak, $MONARCH$ steeled their nerves. [GetSheHeCap] knew the statement they were about to make would cause controversy, not least amongst the naga. But it was time. They were the final empire. If not now, then when?\n\n"I am lifting the ban on entering the upper floors of this Zatsarya." The whirring from the spire was instantly drowned out by murmurs and shouts from the crowd. Several naga, including the leading figure in the current high temple, started to move forward, but $MONARCH$ continued.\n\n"The gods left us these spires to be used when we are ready. For as long as lizardfolk have stood, we have not been ready. There have been no signs from the gods, nor anyone, that we are ready. But we are the final empire!" He stepped forward, pushing ahead of the naga that were stepping onto the stage.\n\n"We are the prophecy. There is nothing beyond our capabilities, because there is nothing beyond us. Will will uncover the mystery of the spires. For if we are eternal, then it is simply a matter of when.""
 empire_333.12.a: "Begin the research"

 empire_333_13.t: "Appease Lupulan"
 empire_333.13.d: "We did it!"
 empire_333.13.a: "Appease"
 empire_333.13.b: "Close"

