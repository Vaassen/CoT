 empire_333.15.t: "Why We Survive"
 empire_333.15.desc: "Why do lizardfolk have so many mutations? It's for survival. Not every mutation will prove useful in the moment, but many more will. If we all looked the same, we would all die the same. This is how we lizardfolk keep coming back from the brink over and over again. There was always a mutation that was suited to the situation we found ourselves in.\n\nThis is why the Lizardfolk before us established themselves on so many different planets. It was for survival. Should something happen to the intergalactic transportation system, they knew they would have spread their people out to so many locations that some would still survive. One strain, one mutation, could revive the empire. That way the empire would never die. That way lizardfolk would never die.\n\nThere may have been 333 lizardfolk empires on our planet of Halann. But we are still part of that original space empire. They knew one of their kind would make it back to this spot and rebuild what was broken. We are not the 333rd Empire. We are the First Empire."
 empire_333.15.a: "The Eternal Empire"

 empire_333.49.t: "SUMMON THE THRAXIS"
 empire_333.49.d: "The ritual began.\n\nAs the lights in the sky lined up to the markings in the sand, each constellation glowed and grew in the sky. As though the sky itself was falling, each collection of stars falling together. Thraxi, each made up of thousands of stars, sunk down from the heavens and in front of the congregation. As another sank to the ground, it joined its brethren and spun together. Faster and faster as each thraxi joined the throng. Faster and faster is span, more and more lights joining its ranks, the center of the whirring mass shining as bright as the sun itself. And then, with one brilliant flash of light, there it stopped above the crowd. The symbol of eternity. The Thraxis.\n\nAt first many fell to their knees. The naga in attendance curled up in awe. Yet as the minutes wore on, an awkward silence descended over the crowd. Could the Thraxis speak? In records it had spoken, but this thing had no mouth. It wasn’t doing anything but hovering there. With a searing look from the head naga, the $MONARCHTITLE$ shuffled to [Monarch.GetHerHis] feet and stood…in front? Of the Thraxis and started to speak. "To thee most resplendent of being-"\n\n[Monarch.GetSheHeCap] was cut off by a voice that sounded like a million voices all speaking at once. "Hello dear, how nice for us to see you. It has been…time since we last spoke to one like yourself. Tell us, what is it you wish to know?\n\nThe voice was simultaneously comforting and terrifying, like a million terrors tucking you into bed. The $MONARCHTITLE$ stuttered and stammered, realising [Monarch.GetSheHe] was not prepared for this. "Wh-wh-what can you tell us? How old are you?"\n\nThe Thraxis swirled in place for almost a full minute, before it finally responded. "We are older than time. We were here before you. Before dragons. Before genies. Before the skies and the seas and the land and all beyond. Your question is difficult for us to answer, as to have an age, we must have a birth date in time. That is something we do not possess." The Thraxis spun in place for another minute before speaking again. "We enjoyed this visit very much. Do feel free to contact us again if you have any more questions. We will be-"\n\nRight at that moment, light from the sun spilled out over the jungle and onto the beach where the crowd stood. In that light, each star of the Thraxis faded, and before anyone knew what was going on, it was gone."
 empire_333.49.a: "They seem to like us at least"

 empire_333.50.t: "The Thraxis Returns"
 empire_333.50.desc: "As the stars descended, the constellations spun and whirred into the place, the Thraxis graced us with their presence once more. This time we were more prepared for the long silence before the whirling spiral of lights began to speak, and waited patiently for them to begin.\n\n"We are so pleased to see you again." The voice of a million voices echoed around the clearing. "What is it you wish of us? Shall we bless a farm again? Or do you wish to hear a story? We have many interesting tales to tell after all.""
 empire_333.50.a: "Are the gods real?"
 empire_333.50.b: "Why do people go crazy if they look at the stars?"
 empire_333.50.c: "What are humans and why have they spread so much?"
 empire_333.50.d: "What is a tchoken?"
 empire_333.50.e: "What happened to the Shadow Swamp lizardfolk?"
 empire_333.50.f: "Were there really 333 empires?"
 empire_333.50.h: "How long did our war with the Precursor Elves last?"
 empire_333.50.i: "What are the lizardfolk ruins on other planets?"
 empire_333.50.j: "What is a Wischcatcher?"
# empire_333.50.k: "a"
# empire_333.50.l: "a"
# empire_333.50.m: "a"
 empire_333.50.end: "Cool to have you"

 empire_333.51.t: "Are the Gods Real?"
 empire_333.51.desc: ""Yes"\n\nThere was a long pause as the lizardfolk waited for the Thraxis to elaborate, but it appeared to believe the single word answer was sufficient. Eventually one did ask: "So that means Raka Drakt and Naga-Katesh are indeed real? What about non-Lizardfolk faiths? The Cannorian gods, like Castellos. Or Elikhet, the god of the humans in Kheterata? Are they indeed fake?"\n\nThere was another long pause before the Thraxis spoke again. "We cannot speak to any individual god. It is easy for us to lose track of who or what gets called a god. Dragons have been worshipped as gods. Elves too. Angels, demons, even we have been worshipped as a god before. Their stories change over time and we struggle to keep track of truth from myth. We struggle with the evolution of stories over the passage of time, as time does not have meaning to us. What is now a god may have once been a demon, or a dragon, or a normal lizardfolk, or have simply been a fanciful tale."\n\nThe crowd murmured and shuffled in their seats, the murmuring growing louder as neighbours grew animated in their disagreements with each other, before finally the Thraxis spoke again. "We would advise you not to worry about the reality of your gods, or any others. Believe in what you created, for that is very real. Look upon what stories you told, what cities you built, and what art you created. Everything fades - well, everything but us. But those stories can last and carry your legacy. At the very least, we shall remember your story."
 empire_333.51.a: "Wise words"

 empire_333.52.t: "Going Crazy from Stargazing"
 empire_333.52.desc: "NOTE: NEEDS TO BE REWRITTEN. BAD LORE\n\n"So you are aware of that which lives in the sky". The Thraxis span its outer arms a few times. "We may have been before time, but that does not mean we know all. We do not know nor understand that which lives in the sky. We do not know if it lives or thinks. We have not tried conversing with it. Unlike you, it does not seem interested in conversation."\n\n"Then why does it exist?" asked one lizardfolk, with a tone of fury and indignation. "What possible reason could there be for a…thing that drives you mad for looking at the sky?" There was a long pause as the defiant lizardfolk gradually lost their anger and slowly sat back down with a guilty look on their face. The long pause made it worse, with the lizard gradually sinking lower and lower into the ground before finally the Thraxis saved him from his embarrassment.\n\n"If you look at the sun, does it not induce pain and blindness? If you stay in the water, do you not drown? Both of these are important to life, and you do not question why they can also kill you. We are sure that which lives in the sky too is important to life here on Halann.""
 empire_333.52.a: "I don’t like the idea that there’s something up there.."

 empire_333.53.t: "What are humans?"
 empire_333.53.desc: ""Which ones are the humans again? Are they the ones with no scales and are about half your size?" There was a long back and forth between the lizardfolk and the Thraxis as they explained the difference between halflings, humans, elves, ruinborn, dwarves, and various other scale-less races. It was quickly clear that they were not going to get a satisfactory answer on why humanity were taking over the planet. But just before the sun rose and the crowd left disappointed they had perhaps wasted a rare chance to question the Thraxis on something it did not know, it dropped one final nugget of wisdom.\n\n"We have seen many different races rise and fall on this planet. Elves, giants, lizardfolk, dragons, ytier, genies, celestials, so many others we do not remember the exact names of. It can be difficult for us to keep up. We did not realise the elves were considered to have fallen, although even we recognised the significance of the Ruin when it occurred. Humans are relatively new - even newer than the lizardfolk. We are sure that their fall shall occur, as it does with all people of the planet.""
 empire_333.53.a: "The lizardfolk, however, will never fall again!"

 empire_333.54.t: "What is a Tchoken?"
 empire_333.54.desc: ""A most delightful creature", said the Thraxis, followed by a terrifying cacophony of voices that eventually the crowd realised was laughter. "We did wonder when it was that you would ask about it. It can be difficult for us to tell one lizardfolk from another across times, but we always know when we are speaking to a new person when you ask about a tchoken, for every lizardfolk eventually enquires about the tchoken."\n\nThe Thraxis continued speaking, much more animatedly than usual, with none of their usual long pauses. "The tchoken have been here as long as you have. They have thrived as you have, suffered when you have, risen and fallen as your people have. We do not understand why so many speak of them with disdain, or why they do not feature more prominently on your emblems. While we are quite humbled that you have placed our form on your flag, we would have thought no creature had a greater bond with your kind than the tchoken. Perhaps it is so part of your society that you consider it part of this great empire you built, as much as any other lizardfolk? We hope that is how you see it, for to care for the tchoken is to care for yourselves.""
 empire_333.54.a: "Number one tchoken fan over here"

 empire_333.55.t: "Shadow Swamp Lizardfolk"
 empire_333.55.desc: ""That is a very broad question you ask of us, for the Shadow Swamp has had many inhabitants. Do you mean those who contracted the curse from the Night Hags, or the ones whose city and ancient spire sank into the bog. Or perhaps you speak of the toymakers who made the most delightful wooden tchoken. Or do you mean…did we say something untoward?"\n\nThe Thraxis had stopped talking as there was a sudden rise in exclamations and questions. The head speaker stood up and demanded the crowd settle down, before turning to the Thraxis. "Our initial question was indeed about those cursed by the Night Hags, but in doing so you have revealed something we wish to learn so much more about."\n\n"We would gladly share more", said the Thraxis, its million voice cacophony positively beaming with pride. "Each carving was about half the size of a normal tchoken, and was intended to be used by new hatchlings. They were coated in a special oil so the children would not get splinters and-"\n\n"Apologies oh wise and venerable one, but it was not the tchoken carvings that interested us, but the sunken spire you spoke of. Of course, we would love to learn about the tchoken carvers afterwards", the speaker hurriedly added, noticing the lights that made up the million stars of the Thraxis had started to dim. "But we were not aware of a spire in the Shadow Swamp, and such a thing would be an incredible find if we could locate it."\n\nThe Thraxis remained silent for over a minute, with murmurs spread across the crowd, with one even shouting "just let them tell us about the tchoken", before the Thraxis spoke again. "We do not know of its exact location anymore, for the paths through the swamp change over time, and it appears to have also grown in size. We do remember it was located to the west of the world tree. We are afraid that is all we can offer. As for the tchoken carvings, each one was painted ever so slightly differently..""
 empire_333.55.a: "Not much to go off"

 empire_333.56.t: "Were there really 333 Empires?"
 empire_333.56.desc: ""What is an empire dear?", asked the Thraxis. The head speaker started to answer, but their voice quickly faded as arguments amongst the crowds drowned them out. Of course. The question that had plagued Khatalashya’s legitimacy since its inception would inevitably start arguments before even the Thraxis had a chance to speak. Eventually the $MONARCHTITLE$, who always attended Thraxis hearings but usually took a back seat during questions, stood up and shouted over the crowd: "Quiet! If you truly wish to learn the truth, you will let that which has lived longer than every subject of our empire speak, for they offer wisdom far greater than any your minds combined could muster". The shouting stopped, although the low murmur continued as the $MONARCHTITLE$ turned and addressed the Thraxis once again. "In your own time, please do answer. As you have observed, this question has troubled our people for some time."\n\n"What counts as an "empire" is not clear to us", said the Thraxis, after its customary long pause. "We do not see the difference between one lizardfolk empire and the next. To us, you are lizardfolk. As we are a million voices speaking as one, the lizardfolk to us are a united body moving together. To us, you are still the first empire, for lizardfolk have never ceased to be, as so many others on this world have done so.""
 empire_333.56.a: "We’re still the first empire?"

 empire_333.57.t: "War with the Precursors"
 empire_333.57.desc: ""The lizardfolk have fought with many people. It can be difficult for us to tell when one war ends and another begins." The tension, which had been high before the question, dissipated quickly as it seemed instead the lizardfolk would get a typically rambly answer from the Thraxis. That is, until it spoke again.\n\n"But they were different.\n\n"They did not stop. They developed…we can scarcely call them weapons. Tools of extermination. We don’t understand what happened, for before that the two sides were friendly. We did not see it all, for we dared not test what they could not kill."\n\nThe crowd was deathly silent. This was not a tone anyone had ever heard the Thraxis use before. The voices it spoke with usually echoed around each other in a disconcerting cacophony, but this time each voice spoke as one in a deafening tone.\n\n"We are unsure if we have a beginning. Before meeting those elves, we believed we also did not have an end. After seeing what they did though, we changed our mind. If anything could end eternity, it would have been them. You have seen the evidence in what they did in Aelantir. All we can say about that is it was almost much, much worse.""
 empire_333.57.a: "Terrifying"

 empire_333.58.t: "Lizardfolk on other planets"
 empire_333.58.desc: ""How delightful! We are so glad to hear you have reunited with your brethren." There was an excited murmur around the crowd. "So they are indeed lizardfolk like us then", said the lizard who was tasked with the noble duty of speaking with the Thraxis. "When did our ancestors leave this world and establish new homes on other planets? Was this the first empire?"\n\nThe Thraxis paused, spinning in place for a while. "We don’t leave this planet. That which lives in the sky would not allow us to, and we do not wish to venture into one of those lovely spires of yours. This planet you speak of may have been visited by your kind before you even reached this world."\n\nThere was a short pause, but this one was interrupted by the crowd, who almost in unison started shouting new questions. Even the head speaker, tasked with both containing the crowd and conversing with the Thraxis, had temporarily lost her composure. Eventually it was a naga who hushed the crowd with a spark of magic lightning shot into the air with a violent crack. In the stunned silence, the naga in question broke protocol and spoke: "Are you telling us that lizardfolk do not come from this world?\n\n"Did you not know?" asked the Thraxis, prompting another outburst from the crowd and another crack of lightning from the naga. "We would have mentioned it sooner if we had realised. That does not make this land not your home. You do not need to have been born here. You have made this land your home, and it will remain yours for as long as you live here. It will also remain part of each of you who do leave this world. Think of it like the many new mutations your kind undergoes. Each mutation becomes part of your people. Each dead mutation remains part of your people. You are of this planet, and every planet of lizardfolk is part of you. You are all you are, and all you have been is part of you.""
 empire_333.58.a: "We’re aliens!?!"

 empire_333.59.t: "What is a Wishcatcher"
 empire_333.59.desc: " "What a curious name. Is it perhaps some kind of charm or token to hang by one’s sleeping quarters." The speaker slowly and calmly explained everything they had heard about the Wishcatcher. From what the genies said, to the message left by the fake spire in Shalazar, to the various logs they had found written by the Precursor Elves. None of them seemed to be ringing any bells with the Thraxis. That is, until one person in the crowd mentioned that one of the Precursor messages spoke of "frills", which caused the Thraxis to whirr back into life and speak with its million voices with a renewed vigor..\n\n"Oh that curious lizard! Yes we do remember that being. A Wishcatcher you call it? What a wonderfully evocative name. It did more than catch a wish though. It ate wish magic. By spreading its magnificent frilled mane, it drew in the very essence of a genie’s magic and devoured it whole. We believe there were more types of magic it could eat. It could perhaps even eat us, but it was far too polite to do such a thing. Of course those elves would be frightened of it - and definitely the genies. Their existence is one of wish magic. I do not know what would be left of them if you ate its wish. Perhaps its shoes would remain."/n/nThe Thraxis span quicker and laughed at its own  joke, the million voices laughing at different tones and paces, creating a din akin to being buried alive with a thousand beehives. But even its laugh could not drown out the excited chatter amongst the crowd. Something so strong even beings with power beyond our comprehension feared it..."
 empire_333.59.a: "How do I get one!"

