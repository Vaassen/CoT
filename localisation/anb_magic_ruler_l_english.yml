 #magic_ruler.10.t:0 "Choose Ward Target"
 #magic_ruler.10.d:0 "Defensive Wards can come in all shapes and fashions, from enhancing the resistance of objects such as walls, creating magic shield and barriers to glyphs and runes acting as traps.\n\nMost contemporary castles had some sort of ward, at least to protect them from low-level magic attacks like fireballs or magic missiles, and was the source of steady work for many beginner mages.\n\nIn addition to creating Defensive Wards at forts and high value provinces, Defensive Wards can be created wherever §O[Root.Monarch.GetName]§! is located."
 #magic_ruler.10.a:0 "Ward [ward_province_1.GetName]"
 #magic_ruler.10.b:0 "Ward [ward_province_2.GetName]"
 #magic_ruler.10.c:0 "Ward [ward_province_3.GetName]"
 #magic_ruler.10.e:0 "Ward [ward_province_4.GetName]"
 #magic_ruler.11.t:0 "Choose Feast Target"
 #magic_ruler.11.d:0 "The basic test of journeyman conjuration is looking at images and summoning a magical copy of it, essentially creating a duplicate.\n\nMasters however, can created entire rooms and decorations with their mind and imagination, making the most fantastical ideas true and possible for the short time the conjuration spell lasts."
 #magic_ruler.11.a:0 "Hold a Magical Feast with [magic_ally_1.GetName]"
 #magic_ruler.11.b:0 "Hold a Magical Feast with [magic_ally_2.GetName]"
 #magic_ruler.11.c:0 "Hold a Magical Feast with [magic_ally_3.GetName]"
 #magic_ruler.11.e:0 "Hold a Magical Feast with [magic_ally_4.GetName]"
 #magic_ruler.12.t:0 "Choose Fortress Target"
 #magic_ruler.12.d:0 "Makeshift magical fortifications is a commonplace thing in war, often in the form of barricades or cover - however, like most conjured objects, it only lasts for a short period of time.\nThe most powerful conjurers have discovered however that if the same exact object is conjured over a periodic length of time, it can enter a state of permanence. One such example is the conjuration of magical fortresses and citadels with only willpower and a few choice reagents."
 #magic_ruler.12.a:0 "Conjure on [fort_magic_province_1.GetName]"
 #magic_ruler.12.b:0 "Conjure on [fort_magic_province_2.GetName]"
 #magic_ruler.12.c:0 "Conjure on [fort_magic_province_3.GetName]"
 magic_ruler.17.t:0 "Choose Plant Growth Target"
 magic_ruler.17.d:0 "Apprentice mages learn life-related transmutation magics but experimenting on plants, which is agreed to be a much safer way to teach the consequences of failing to alter living things rather than using animals or people.\n\nA more talented mage can use this rudimentary skillset to encourage growth in plant life, creating healthier, faster and even tastier crops and food."
 magic_ruler.17.a:0 "Cast Plant Growth on [plant_growth_province_1.GetName]"
 magic_ruler.17.b:0 "Cast Plant Growth on [plant_growth_province_2.GetName]"
 magic_ruler.17.c:0 "Cast Plant Growth on [plant_growth_province_3.GetName]"
 magic_ruler.17.e:0 "Cast Plant Growth on [plant_growth_province_4.GetName]"
 magic_ruler.17.f:0 "Cast Plant Growth in our Capital"
 magic_ruler.18.t:0 "Choose Skill to Enhance"
 magic_ruler.18.d:0 "Enhancement of abilities is a common spell amongst adventuring parties, dealt out by wizards and clerics alike.\nThe base version of the spell is a temporary and short-term effect to give an edge in battle, but a more skilled practitioner can combine the spells with weaker but long-lasting draughts that, over a longer period of time, can attain a more permanent change.\n\n§R(To allow your ruler some respite, this spell can only be cast every 5 years regardless of success)§!"
 magic_ruler.18.a:0 "Cast Permanent Dame's Wisdom"
