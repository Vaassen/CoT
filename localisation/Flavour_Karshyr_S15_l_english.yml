 S15_aquaculture_tt:0 "Construct an §YAquaculture Industry §! in this province.\n\nAquaculture is quickly becoming Karshyr’s greatest Asset, providing us with vast quantities of traditionally rare resources. Founded out of the city of Karshyr but spread and diversified throughout the gulf it has become the envy of many in Sarhal or even Cannor We may be limited by land or bureaucracy but Whether it be dyes, pearls or simply fish, Aquaculture will always provide us with the wealth of the Sea.\n\n[From.aquaculture_dyes]\n[From.aquaculture_gems]\n[From.aquaculture_fish]\n[From.aquaculture_spices]\n[From.aquaculture_salt]"

