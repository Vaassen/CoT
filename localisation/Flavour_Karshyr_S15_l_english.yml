l_english:
 #Writing by wdfrodo, coding by Creatively Bankrupt

 #Missions
 S15_strengthen_the_hydromancer_guild_title:0 "Strengthen the Hydromancer Guild"
 S15_strengthen_the_hydromancer_guild_desc:0 "The Hydromacer’s Guild are the representatives of the Mages on Karshyr, with the Karassk’s control removed they are rising in power and could benefit us greatly with our support."

 S15_spread_the_farms_title:0 "Spread the Farms"
 S15_spread_the_farms_desc:0 "Within Karshyr our aquaculture projects have been bolstering its production of dyes, aiding our economy and trade systems. This has led to many within our nation wishing to spread these systems outside of Karshyr, forming the aquaculture guild. "

 S15_reclaim_the_lost_islands_title:0 "Reclaim the Lost Islands"
 S15_reclaim_the_lost_islands_desc:0 "Unlike the Isle of Karshyr, which has been inhabited since time immemorial, many of the Rankaty Islands have only recently been settled and others remain yet uninhabited.\nAs Karshyr itself is considered to be a part of the Rankaty Islands, it is only reasonable that we claim the rest as our own.\nThey are bound to be home to abundant, untapped resources, which we could use for our expanding settlements and our fleets.\nThe Rankaty Islands are also of strategic value to us, as they could be used as a staging ground for a siege against Karshyr itself, should they fall into the hands of an enemy.\nFor our future prosperity and safety, Karshyr must become the sole ruler of the Rankaty Islands."

 S15_a_natural_ally_title:0 "A Natural Ally"
 S15_a_natural_ally_desc:0 "Our claims on the Rankaty Islands have been realized, with all of the Islands now firmly under our direct control. However, these islands are not as uninhabited as we had expected: It seems that there are multiple merfolk settlements scattered across the isles.\nDue to the merfolk's ties to the Baashidi, especially their tendency to rely upon the Baashidi to handle interactions with outsiders, the relations between our peoples has previously been rather frigid.\nThe merfolk have now come to learn that our people are not savage beasts, but rather a civilized people, with whom they can interact cordially. We have no intentions of adversely affecting the merfolk's settlements. Their presence could become an opportunity for us, if we cooperate with one another."

 S15_invite_them_to_karshyr_title:0 "Invite Them To Karshyr"
 S15_invite_them_to_karshyr_desc:0 "Since our discovery of the merfolk's presence on the Rankaty Islands, we have been able to arrange for various trade agreements and have effectively become close allies. Our expansion has required an abundance of food, which the merfolk have been able to provide in exchange for our dyes, which they seem to be fond of. We did not expect our interactions with the merfolk to go as well as they have, yet we gladly welcome this pleasant surprise.\n\nAs we have little to fear from the merfolk, there is no reason to not further our alliance with them. We shall invite them to create a settlement on the Isle of Karshyr itself, so that we can accelerate the barter - and demonstrate the goodwill - between our people."

 S15_the_city_of_nazyhn_title:0 "The City of Nazhyn"
 S15_the_city_of_nazyhn_desc:0 "Nazhyn. The biggest potential asset of our nation, giving us a product completely irresistible to all, a gateway to the wealth that corrupted Nazhni. But also a gateway to the Pariah status of Nazhni."


 S15_begin_the_restoration_title:0 "Begin the Restoration"
 S15_begin_the_restoration_desc:0 "Once upon a time - over a millennium ago - our city was one of the largest and greatest in all of the Anzara Empire, its architectural and infrastructural design outclassing that of any other city within the empire. However, that has not been the case for an aeon. The city's grand temples, magnificent citadels and extravagant ports all lay in disrepair, unmaintained and in dire need of restoration.\nWith our newfound freedom, we finally have the resources to restore Karshyr to its former glory: Roads shall be expanded and repaved, temples renovated, citadels modernized and ports refurbished. Our city shall not wallow in disrepair, instead it shall thrive once more and become the cultural jewel that it is destined to be.\nKarshyr shall become a city worthy of rule: The Shining Crater-Capital of the Lizardfolk."

 S15_adventures_into_aquaculture_title:0 "Adventures into Aquaculture"
 S15_adventures_into_aquaculture_desc:0 "Karshyr’s main export has always been the Seaweed Dyes of the capital which has encouraged experimentation and growth whilst we were trapped on our island under Karassk. This has led to the creation of widespread aquaculture which has spiked dye production upwards."

 S15_export_the_khateshala_title:0 "Export the Khateshala"
 S15_export_the_khateshala_desc:0 "Karassk placed the Naga on our throat for a millenia, extracting the wealth of our island and leaving it in disarray. We see no reason not to return the favor."

 S15_finalise_the_crater_city_title:0 "Finalise the Crater City"
 S15_finalise_the_crater_city_desc:0 "The Crater-City has garnered a new title, one that describes the newest era of its existence: The Western Gateway to Taneyas.\nKarshyr has once again become one of the greatest cities of the lizardfolk, restored and expanded to heights that were previously unimaginable.\nOur citadels crest over the edges of the crater and our ports bustle with more activity than ever before, not an hour passes without a ship sailing into - or out of - the docks.\nThe shipyards, capable of creating grand vessels well-suited for trade or warfare, have become a staple of the city, one which cannot be ignored by even our rivals.\nTraders and travelers from the west, should they seek goods from - or entry into - Taneyas, arrive at our ports and barter at our markets before venturing further into lizardfolk lands.\nWhile it had once been a curse that Karshyr sat at the periphery of its kin, it has now become its greatest asset."

 S15_the_great_pearl_cave_title:0 "The Great Pearl Cave"
 S15_the_great_pearl_cave_desc:0 "The Merfolk of Chenshkhad have discovered a great pearl cave which seems to be magically reproducing. Even preliminary experimentation has revealed the viability of mass scale production."

 S15_improve_the_project_title:0 "Improve the Projects"
 S15_improve_the_project_desc:0 "Aquaculture has become the backbone of our economy, the key to our control of trade internally and externally. Devoting resources to consolidating them will allow for greater efficiency and expand our reach."

 S15_control_the_gulf_title:0 "Control the Gulf"
 S15_control_the_gulf_desc:0 "Our fleets grow larger by the day, now patrolling the entirety of the Gulf's waters unimpeded. No other realm that maintains a navy in Taneyas is capable of threatening ours. We own various key portions of the Gulf's coastline, ensuring our foothold on the mainland is unchallenged. Even if they wished to, none in Taneyas could hinder our expansion.\n\nYet our footholds on the Gulf's coastline are in need of consolidation, no longer shall we merely hold portions of the coast, instead we shall lay claim to the entirety of the Adzalaz Gulf. It shall be under our rule forevermore and we shall become the rightful lieges of Taneyas' entire coast."

 S15_ousted_slavers_title:0 "Ousted Slavers"
 S15_ousted_slavers_desc:0 "The Baashidi of Qasri Abeesooyinka have long enslaved the Lizardfolk. We have overturned them but we will not resort to their methods, by exploiting our aquaculture expertise we can do something much more efficient."


 S15_a_beachhead_secured_title:0 "A Beachhead Secured"
 S15_a_beachhead_secured_desc:0 "WIP: We have Defeated the tyrants of Karassk and secured a foothold on the mainland if Taneyas. We are now free to push into Taneyas for the first time in our History and secure our independence and prosperity."

 S15_avenge_the_millenia_title:0 "Avenge the Millenia"
 S15_avenge_the_millenia_desc:0 "A millennium ago we stepped into Karassk to submit to their king. Our Fleet lay in ruin, Our once great city charred by the scars of War and thousands of our finest never returned to homes. We were left crippled and humiliated for an age, our city forgotten to time and eroded into a mere shadow of its former self and the Naga were enforced upon us, enslaving us to the whims of Karassk\n\nAnd now we walk into Karassk, the Victors of the war and the masters of ourselves once more. We have much to repair within Karshyr and beyond but the first step will be removing our ties to Karassk and the Naga they imposed upon us. Their imperial palace will be set ablaze with their false kings and naga inside. And the First fire will be from the treaty of Servitude we signed a millennium ago."

 S15_karshyr_prosperous_title:0 "Karshyr Prosperous At Last"
 S15_karshyr_prosperous_desc:0 "Karshyr’s Isolation has ended, we have seized a position as a pre-eminent power within the Lizardfolk. Our Control over the former Tyrants of Karassk and more importantly our independence is secured forever more."

 S15_eclipse_the_sapphire_title:0 "Eclipse The Sapphire"
 S15_eclipse_the_sapphire_desc:0 "Khugra has been rising in influence, its central position allowing it to dominate trade in the Adzalaz Gulf. Securing the city will bring us one step closer to controlling the economic heart of the Lizardfolk."

 S15_the_city_of_shadows_title:0 "The City of Shadows"
 S15_the_city_of_shadows_desc:0 "The City of Nazhni has become the core of corruption within Taneyas, the centre with which the Corrosive Nazhyn and the despicable Shadow Pact has spread. We may not follow the prophecy but we won’t allow such evil to spread its roots."

 S15_formalise_the_council_title:0 "Formalise The Council"
 S15_formalise_the_council_desc:0 "Karshyr’s has always been underdeveloped even at our historical zenith, after the millennium of Naga administrators it has been reduced to the extent where it’s barely capable of managing Karshyr Proper. This worked well when we were a vassal and was acceptable when we stepped onto the mainland but with our control over many major cities its flaws are on full display. In order to alleviate this issue the heads of the aquaculture guild have been called into Karshyr, in exchange for granting them an advisory council to the Crown they will manage the day to day running of the major cities of Karshyr and the various aquaculture projects outside."

 S15_conquer_the_isle_title:0 "Conquer the Isle"
 S15_conquer_the_isle_desc:0 "Karshyr has never been in a more prosperous state than it is now, not even in ancient times had our city maintained such influence and wealth as it does now.\nNow that our own prosperity is secured, it is time that we turn our focus elsewhere: To our halfling friends in Fahvanosy.\n\nMuch like we helped them in uniting the Southern Isle of Fahvanosy, we shall now assist them in realizing their claim on the rest of Fahvanosy.\nOwnership over a majority over the Isle would ensure the prosperity of our halfling friends, as their control - and by extension, our control - over the clove trade would be absolute."

 S15_the_merfolk_city_title:0 "The Merfolk City"
 S15_the_merfolk_city_desc:0 "If it were not for the merfolk, our expansion and dominance over the Adzalaz Gulf would not have been nearly as easy as it was. Our alliance with them has proven to be highly beneficial, thus it is our turn to offer them something for their assistance. It would not befit us to exploit our allies, we would rather that our people prosper together.\n\nThe merfolk shall be granted a city of their own, one which shall be both represented in the council and placed upon lands ideal for the merfolk's habitation. The estuary of the Khazyna River in Gokadas Soro would be the best candidate for such a settlement.\nOur alliance shall continue to prove prosperous, for both the merfolk and for us."

 S15_the_gulf_united_title:0 "The Gulf United"
 S15_the_gulf_united_desc:0 "Karshyr is no longer merely the richest city in all of Taneyas, it has become the capital of one of the greatest lizardfolk empires this world has ever seen. Our realm has grown to be far more than just our Crater-Capital, it now spans the entirety of the Adzalaz Gulf, nearly half of all of Taneyas has been united under our banner. The coffers of our cities overflow with coins and trinkets, by far the wealthiest lizardfolk that have ever graced Taneyas.\n\nBeyond Taneyas, we are renowned throughout all of Sarhal. Legends of our grand fleets’ strength have spread across Sarhal's coasts. We are - by far - the most powerful nation within Sarhal. None of our neighbors are capable of competing with us, neither militarily nor economically.\n\nOnly the greatest empires of Cannor are capable of rivaling us.\nWe are - without a doubt - the most influential realm in Sarhal."

 S15_the_future_of_karshyr_title:0 "The Future of Karshyr"
 S15_the_future_of_karshyr_desc:0 "If you had seen us 500 Years ago, You would have seen an unstable island ruled by the exploitative Naga, a crippled economy made to support the despots of Karassk and nothing else and a subjugated Vassal who held no power, economic or political. We weren’t even an afterthought in Lizardfolk Politics, let alone a contender for control over the Adzalaz Gulf.\n\nNo one Would have guessed that we would ever break the chains of Karassk’s rule and yet we now stand as the undoubtable leader of the Lizardfolk. But yet our path is still unclear, we have no need for further conquest nor wealth, no need to exert ourselves. Many wish for us to pursue the prophecy and declare the 333rd empire but for once us and the naga agree, we shall never take up that mantle. Our power lies not in prophecy or fate but in our cities and our aquaculture, in our mages and allies. They shall dictate our fate, not the delusions of dead empires."


 S15_introduce_ourselves_title:0 "Introduce Ourselves"
 S15_introduce_ourselves_desc:0 "To most of our lizardfolk kin, the edges of Taneyas are the edges of civilization itself. However, unlike other lizardfolk, we know that there is more to the world.\nThanks to our friends in Fahvanosy, we have heard tales of traders from a civilization to the far north of the Salahad.\nIf these tales are to be trusted, these northern lands - and their traders - are more prosperous than all of Taneyas, possessing innumerable riches with which they might barter.\nThe Vyzemby have not betrayed our trust before and it is unlikely that they would do so now.\nWe shall seek to contact this northern civilization, so that we might introduce ourselves properly."

 S15_rebuild_karassk_title:0 "Rebuild Karassk"
 S15_rebuild_karassk_desc:0 "As much as we despise Karassk, we would be squandering an opportunity to seize our control over the gulf by razing the city to the ground. The bountiful fisheries of the city have revitalised the local economy and we shall seize our control over them forever."

 S15_before_cannor_arrives_title:0 "Before Cannor Arrives"
 S15_before_cannor_arrives_desc:0 "Cannor’s wealth makes it a prime target for our exports but also a looming threat. Their ships can sail further and faster than anything we can make. We must counteract this and secure our territorial integrity."

 S15_discuss_the_spire_title:0 "Discuss the Spire"
 S15_discuss_the_spire_desc:0 "With the Cannorian advancements into Sarhal our still fragile relationship with them will likely be tested. We can afford to compromise over most of Fanguala but our people will refuse to surrender the spire of New Hookfield."

 S15_the_isle_united_title:0 "The Isle United"
 S15_the_isle_united_desc:0 "For the first time in its history, Fahvanosy is no longer settled by squabbling tribes of Vyzemby Halflings. With our assistance, our dear allies, the Mazava Halflings, have finally united Fahvanosy under their banner. They are the undisputed rulers of Fahvanosy, the sole owners of the clove trade, which brings them innumerable riches.\n\nWith the clove trade ensuring the stability of their economy and our fleets ensuring the safety of their realm, we are able to experiment with cloves without concern.\nThe Sweetport, Teramzadai, would be the ideal location for our clove experiments. Our halfling friends will not deny our interests and they will certainly not deny our continued trade."


 S15_our_friends_in_fahvanosy_title:0 "Our Friends In Fahvanosy"
 S15_our_friends_in_fahvanosy_desc:0 "Our city's position at the edge of Taneyas has never been ideal. We are too far away from the mainland to meaningfully involve ourselves in the political machinations of our fellow lizardfolk, and while Karassk ruled over our lands, we were unable to maintain any influence in Taneyas, leaving us effectively isolated from our kin. This isolation caused us to seek friends elsewhere, peering out past the edges of lizardfolk civilization.\n\nThat is how we met the Vyzemby Halflings to our southwest. They have proven to be valuable friends and trustworthy trade partners over the last millennium.\nNow that we have freed ourselves from Karassk, we are able to deepen the ties to our halfling friends, so that this friendship may blossom into a full-fledged alliance."

 S15_push_for_amiratsamo_title:0 "Push For Amiratsamo"
 S15_push_for_amiratsamo_desc:0 "Amiratsamo has always been a land of squabbling tribes, unable to make any true gains over one another. Our support for [S15_halfling_ally.GetName] has given them the edge and allowed them to control the island"

 S15_the_southern_island_united_title:0 "The Southern Island United"
 S15_the_southern_island_united_desc:0 "The Kingdom of Amritsamo has replaced the once disjointed and feuding tribes of Fahvanosy's southern isle.\nOur halfling allies have been able to claim the isle for themselves, bringing an end to the petty squabbles of the local tribes and introducing centralized rule to the south of Fahvanosy.\nIt is unlikely that the halflings would have been able to succeed in this endeavor without our assistance, and it is certain, if they had succeeded without us, it would have been with far more bloodshed.\nThe newfound leadership - and the local populace - of Amritsamo are well aware of their eternal debt to us.\nThus, we are left with a decision to make: Should we formally request Amritsamo's fealty?"



 S15_friends_in_sarhal_title:0 "Friends in Sarhal"
 S15_friends_in_sarhal_desc:0 "After so long of being informally neglected by all nations within our direct vicinity due to our rejection of the Prophecy we now stand as the head of Ravelian in the region, secure in the knowledge that we will never fight alone again."


 S15_exporting_ravelianism_title:0 "Exporting Ravelianism"
 S15_exporting_ravelianism_desc:0 "Although converting to Ravelianism has strengthened our relationship with the cannorian powers we now lack any regional allies. We should leverage our economic might to spread the word of Ravelianism for both the faith and our security."

 S15_a_lizard_rectorate_title:0 "A Lizard Rectorate"
 S15_a_lizard_rectorate_desc:0 "We may be recognised by the Ravelians in Cannor but They still refuse to protect the people of Sarhal from the threat of the Shadowswamp. We cannot allow them to abandon us and we will leverage our influence to ensure this."

 S15_contain_the_shadow_title:0 "Contain the Shadow"
 S15_contain_the_shadow_desc:0 "The Shadowswamp, the ulcer of Sarhal which threatened to burn the world to the ground has been evicted from the lands of the Lizardfolk forevermore. We can now rest assured that Lizards will never be subjected again."


 S15_investigate_the_spires_title:0 "Investigate the Spires"
 S15_investigate_the_spires_desc:0 "The Spires have long been the centres of Lizardfolk worship, their presence dominating the sky around the cities that were built in their shadow. Yet no records tell of their construction, nor any attempts to understand why or how they were built. No Lizarfolk has dared tamper with the spires due to their religious and symbolic importance, especially so in regards to the naga. We have no need for such caution, we care not for the protests of the Naga and the God Fragment is proof that ancient artifacts can and should be studied. Even then we shall start at New Hookfield as a proof of concept and find out what can be taken and learnt from the spires."

 S15_relics_from_near_and_far_title:0 "Relics From Near and Far"
 S15_relics_from_near_and_far_desc:0 "The Spire project was conceived as a way to bring the ideas of Ravelianism to the lizardfolk and an attempt to understand the spires. We did not anticipate finding working machinery, let alone to the calibre that was uncovered in the Caverns surrounding the spire at New Hookfield. The Hookfield port, once a minor port used as a supply stop for cannorian trips has become a capital of trade never seen since the days of the Ananona through the exportation of these relics to the Ravelians of Cannor.\n\nAnd yet however profitable the relic trade is, we can do so much more with them. The Hydromancer’s guild have already been drafting plans and using their wealth to import the relics of Aelantir for further study, with our backing these plans, once mere dreams, could become reality."

 S15_the_prototype_project_title:0 "The Prototype Project"
 S15_the_prototype_project_desc:0 "When the Mages began this it was seen as a pipe dream, a complete fallacy that would never be achieved. When we found the relics under the spire the project transformed into a theoretical experiment, everyone saw it no longer as a dream but as a question. But it was still seen as purely theoretical, the level of investment and devotion to such a project was too great for anyone to truly pursue it.\n\nTo even acquire the raw power to enhance the magical essence of an individual has always been seen as simply impossible. But for Karshyr to achieve independence was impossible, to control the Gulf was impossible and we shall prove that the Khateshala project is possible as well"

 S15_the_khatelasha_project_title:0 "The Khateshala Project"
 S15_the_khatelasha_project_desc:0 "Missing Loc"


 S15_ravelian_recognition_title:0 "Ravelian Recognition"
 S15_ravelian_recognition_desc:0 "Our switch to Ravelian has been a godsend for helping us work with the Cannorians. However many in Cannor view this as a simple ploy to gain favourable trade terms, We shall shatter this illusion by proving our faith to the High Rector Themselves."

 S15_artifice_and_aquaculture_title:0 "Artifice And Aquaculture"
 S15_artifice_and_aquaculture_desc:0 "To say we are the traditional ravelian nation would be a blatant lie, many decry our loyalty to our mages and lack of a formal Artificery guild. We will not abandon our mages, they have been pivotal in securing our independence and prosperity, but we can incorporate the rising artificers into our existing Aquaculture guild. Whilst this would severely handicap the traditional artificers due to them being forced to split their resources with the much more entrenched aquaculture guild it would also provide far more equipment, expertise and personnel to our aquaculture whilst still maintaining a devoted artificery core to further our research elsewhere."


 S15_the_ravelian_coast_title:0 "The Ravelian Coast"
 S15_the_ravelian_coast_desc:0 "Our Leadership may have converted to Ravelian but that means nothing without the support of the people, if anything it hurts us due to their loyalty to the prophecy which we are actively defying. We must show them the benefits of Ravelianism of wealth and alliance with Cannor."

 #Events
 flavour_karshyr.0.t: "Starting event"
 flavour_karshyr.0.d: "WIP: I am the starting event. I may be deleted before this hits steam."
 flavour_karshyr.0.a: "Go away."

 flavour_karshyr.1.t: "The Next Step of Our Alliance"
 flavour_karshyr.1.d: "A Direct Meeting between the [Root.Monarch.GetTitle] of Karshyr and the King of Amiratsamo. It’s a celebration of the unification of Amiratsamo but when the leaders pivot to talking about the future plans the Karshyrian King has the option to request Vassalisation or not.\n\nCB: We want to vassalise them."
 flavour_karshyr.1.a: "WIP: Let's do it."
 flavour_karshyr.1.b: "WIP: Nah."

 flavour_karshyr.2.t: "WIP: They want to annex us."
 flavour_karshyr.2.d: "WIP: Karshyr wants to vassalize us."
 flavour_karshyr.2.a: "WIP: There is nothing we can do."
 flavour_karshyr.2.b: "WIP: Are they out of their minds!?"

 flavour_karshyr.3.t: "The Specialisation of Karshyr"
 flavour_karshyr.3.d: "Meeting Between the [Root.Monarch.GetTitle] of Karshyr and the Heads of the Aquaculture Guild. They discuss the increasing profitability of the aquaculture of Karshyr but the heads diverge on how to handle the future of the projects. Some argue for specialising the Seaweed towards Dye whilst others argue to diversify towards having edible seaweed as well as dyes to feed the military and Navy\n\nCB: Do we like our farms being diverse or specialised?"
 flavour_karshyr.3.a: "WIP: I hate diversity!"
 flavour_karshyr.3.b: "WIP: I love diversity!"

 flavour_karshyr.4.t: "Cannorian Diplomacy"
 flavour_karshyr.4.d: "Our Sailors through hugging the Sarhal Coast have reached a continent beyond the Salahad desert, a land dominated by Humans. Although initially hostile to us, calling us "Monsters" and "Kobolds" after talking to them through a magical translator they agreed to let us dock, talk and trade.\n\nCB: The Cannorians are willing to do diplomacy with us."
 flavour_karshyr.4.a: "Who knows what they could give us?"

 flavour_karshyr.5.t: "Fisheries of Karassk"
 flavour_karshyr.5.d: "Karassk may have been our old oppressor but we have certainly taken our revenge, the city shall forever been second to our island. However although most traders go to karshyr due to its closer position and more valuable resources, most cannorians who wish to stay for longer periods of time go to Karassk as it has far more space than Karshyr. This has led to a boom in the fisheries that took over after we razed the city, expanding the traditional fish farms, our nations access to the sharks within the seas and the fledgling aquatic variations of the Tchokens.\n\nCB: Karassk sure has fisheries."
 flavour_karshyr.5.a: "Support the new fish Markets."

 flavour_karshyr.6.t: "Expulsion of the Shadows"
 flavour_karshyr.6.d: "Karshyr's religious situation isn't exactly secret, our public expulsion of the naga has caused many to assume we have abandoned the prophecy. However lack of direction isn't equal to a lack of morals as the elite of Nazhni soon found out. They offered us paultry concessions in exchange for the monarchy and nobles converting to Shadow pact. We promptly exposed their lies and corruption and left them to their fate at the Lizards of Nazhni. \n\nCB: The elites in Nazhyn wanted to do Shadow Pact stuff, we killed them all."
 flavour_karshyr.6.a: "Good Riddance."

 flavour_karshyr.7.t: "The Unlikely Prosperity"
 flavour_karshyr.7.d: "Our trading with the Cannorians has been the most unexpected asset to our nation. We not only get markets for our dyes and pearls but also the ability to import cloths and technology. These imports have been coming with the ideas of Cannorian religions. Regent Court and Corinite have no interest for us but the growing movement of Ravelinism is making great progress in the cities.\n\nCB: We've been trading with Cannor, and it's been great."
 flavour_karshyr.7.a: "Let's see where this goes."

 flavour_karshyr.8.t: "The Question of Nazhyn"
 flavour_karshyr.8.d: "Meeting Between the [Root.Monarch.GetTitle] of Karshyr and the Heads of the Aquaculture Guild. Debate immediately pushes towards How to handle the Nazhyn. Most Heads push towards Mass Producing the Nazhyn but some push against it due to it potentially straining our relationship with Cannor.\n\nCB: Do we ban spices from existance?"
 flavour_karshyr.8.a: "Permit the expansion of Nazhyn Production."
 flavour_karshyr.8.b: "Ban The Production of Nazhyn §RThis will prevent us from ever cultivating Nazhyn (spices)!§!"

 flavour_karshyr.9.t: "The Future of Karshyr"
 flavour_karshyr.9.d: "If you had seen us 500 Years ago, You would have seen an unstable island, a crippled economy and a subjugated Vassal. Now you see The Largest power economically and militarily in Sarhal in control of some of the Largest and most Prosperous lands in the world.\n\nHowever The cities beg for us to fully embrace the ideals of Ravelianism, arguing that the Cannorians and Aquaulture are our sources of Power.\n\nCB: We are now Ravelians."
 flavour_karshyr.9.a: "Embrace the Rising Ravelians"

 flavour_karshyr.10.t: "WIP: Conversion"
 flavour_karshyr.10.d: "WIP: Karshyr is now Ravelians."
 flavour_karshyr.10.a: "Let's join them."
 flavour_karshyr.10.b: "Nah."

 flavour_karshyr.11.t: "The Saint of Karshyr"
 flavour_karshyr.11.d: "Karshyr's rapidly growing Ravelian church has struggled to gain new members due to the lack of local representation. As such the church has petitioned the Rectorate to appoint a Local saint.\n\nThere are 2 Obvious choices, The Anonymous of Karshyr, a Hydromancer and chronicler from Millenia ago and Dzankot III, The Mage who earned us our freedom from Karassk"
 flavour_karshyr.11.a: "The Anonymous."
 flavour_karshyr.11.b: "The Mage."

 flavour_karshyr.12.t: "A Successful procedure"
 flavour_karshyr.12.d: " It has been successful, Through Reverse engineering the powers of the spires we have been able to do what was previously unthinkable, transform [Root.Monarch.GetName] And [Root.Heir.GetName] into  Khateshala thus drastically enhancing their magical powers\n\nCB: Our ruler and heir are now mages."
 flavour_karshyr.12.a: "Let's join them."

 flavour_karshyr.50.t: "Transfer of Technology"
 flavour_karshyr.50.d: "Our Aquaculture Exports have been bringing in Vast wealth through importing raw wealth and valuable goods rare in Sarhal. However a significant portion of the court wishes to request schematics and exports from Cannor instead to aid our technological expertise.\n\nWIP: Buy Cannorian technology."
 flavour_karshyr.50.a: "Buy it."
 flavour_karshyr.50.b: "Nah."

 flavour_karshyr.51.t: "You shouldn't be able to see this."
 flavour_karshyr.51.d: "If you can see this, let me know on the discord - CB."
 flavour_karshyr.51.a: "I will!"

 flavour_karshyr.52.t: "Acknowledgement of the Anonymous"
 flavour_karshyr.52.d: "Recently we have made great strides towards the cannorians perceiving us as equals. This new perspective has led to many cannorians discovering the work of the Anonymous of Karshyr. Our people have petitioned the order of Chroniclers to accept his works into their Archive.\n\nCB: We want to get our guy into the Cannorian archive."
 flavour_karshyr.52.a: "They accept!"

 flavour_karshyr.53.t: "Early Cannorian Investment"
 flavour_karshyr.53.d: "Whilst most traders between us and Cannor are leaving from Karshyr our ruler has received a Trader from Cannor who wishes to help build our growing cities. This would be a huge help in bolstering the city but would also involve further concessions to the Cannorians.\n\nCB: Cannorians support our growth."
 flavour_karshyr.53.a: "WIP: Accept."
 flavour_karshyr.53.b: "WIP: Refuse."

 flavour_karshyr.54.t: "Cannorian Investment"
 flavour_karshyr.54.d: "Whilst most traders between us and Cannor are leaving from Karshyr our ruler has received a Trader from Cannor who wishes to help build our growing cities. This would be a huge help in bolstering the city but would also involve further concessions to the Cannorians.\n\nCB: Cannorians support our growth."
 flavour_karshyr.54.a: "WIP: Accept."
 flavour_karshyr.54.b: "WIP: Refuse."

 flavour_karshyr.55.t: "Ravelian Investment"
 flavour_karshyr.55.d: "Whilst most traders between us and Cannor are leaving from Karshyr our ruler has received a Trader from Cannor who wishes to help build our growing cities. This would be a huge help in bolstering the city but would also involve further concessions to the Cannorians.\n\nCB: Ravelians support our growth."
 flavour_karshyr.55.a: "WIP: Accept."
 flavour_karshyr.55.b: "WIP: Refuse."

 flavour_karshyr.60.t: "Ravelian Imports"
 flavour_karshyr.60.d: "The Ravelian movement has been proven willing to invest into states in exchange for hosting their various societies and lodges. Although they usually limit this to Cannor our large cities and openess to trade has resulted in them requesting to open one up in a key city.\n\nCB: Ravelians want to build a lodge."
 flavour_karshyr.60.a: "WIP: Permit."
 flavour_karshyr.60.b: "WIP: Forbid."

 flavour_karshyr.61.t: "Cannorian Colonies"
 flavour_karshyr.61.d: "Our relations with the Cannorians has always been done on the premise that We are half a continent Away and as such will rarely directly compete. However now the Cannorians are moving into Sarhal this has created a diplomatic crisis over the border.\n\nWIP: Cannorians have colonies in Sarhal."
 flavour_karshyr.61.a: "WIP: Recognise that they have colonies then."
 flavour_karshyr.61.b: "WIP: Challenge them."

 flavour_karshyr.62.t: "Pearlsedge Trade"
 flavour_karshyr.62.d: "Our artificial Pearl farms have been incredibly efficient, becoming one of our largest exports to Cannor. This has attracted the attention of Pearlsedge who also have a substantial hold over the pearl market. They have asked to purchase our designs for their own farms. Whilst we could outright refuse them and increase our hold over the market, selling them wouldn't cost our economy too much and would greatly improve relations.\n\nCB: Our farms are good, Pearlsedge are interested. What do?"
 flavour_karshyr.62.a: "WIP: Sell our designs."
 flavour_karshyr.62.b: "WIP: Keep our designs."

 flavour_karshyr.70.t: "Ravelian Converts"
 flavour_karshyr.70.d: "Our Aquaculture technology has attracted many ravelians from Cannor who have in turn started Converting the local lizardfolks. Whilst this has led to economic growth in the aquaculture provinces it has also led to heavy conflict with the local Lizardfolk who still favor the Prophecy.\n\nCB: Ravelian converts have appeared."
 flavour_karshyr.70.a: "WIP: Support Ravelians."
 flavour_karshyr.70.b: "WIP: Support Locals."

 flavour_karshyr.71.t: "A Visit from the Rectorate"
 flavour_karshyr.71.d: "When our nation Converted to Ravelianism it was more so to improve relations with Cannor and centralise power into our cities. However we now see ourselves as the leader of the Ravelian World through our influence over the Rectorate.\n\nCB: We have influence over the pope."
 flavour_karshyr.71.a: "WIP: We are commited to this religion."

 flavour_karshyr.100.t: "Build Aquaculture!"
 flavour_karshyr.100.d: "WIP: What aquaculture project do we want to build?"
 flavour_karshyr.100.a: "WIP: Dyes"
 flavour_karshyr.100.b: "WIP: §gDyes (insuffcient capacity!)§!"
 flavour_karshyr.100.c: "WIP: Gems"
 flavour_karshyr.100.d: "WIP: §gGems (insuffcient capacity!)§!"
 flavour_karshyr.100.e: "WIP: Fish"
 flavour_karshyr.100.f: "WIP: §gFish (insuffcient capacity!)§!"
 flavour_karshyr.100.g: "WIP: Nazhyn (spices)"
 flavour_karshyr.100.h: "WIP: §gNazhyn (spices) (insuffcient capacity!)§!"
 flavour_karshyr.100.i: "WIP: Salt"
 flavour_karshyr.100.j: "WIP: §gSalt (insuffcient capacity!)§!"
 flavour_karshyr.100.z: "WIP: Nothing, go away!"

