l_english:
 
 cot_price.1.t:0 "Ebonsteel armour"
 cot_price.1.d:0 "With the recent development of the Arquebus and Pike and Shot formation, firearm is quickly becoming the primary weapon on the battlefield. But with new threats come new solutions. The gerudian smiths have begun forging armour made of Ebonsteel, that is able to stop multiple bullets. Now every nation will be scrambling to obtain it and gain the edge on the battlefield in this new age of warfare"
 cot_price.1.a:0 "Best offense is good defense!"
 EBONSTEEL_ARMOUR_HAPPENED:0 "Ebonsteel armour"

 cot_price.2.t:0 "Deepwoods expeditions"
 cot_price.2.d:0 "Escann is changing. Old kingdoms are dead and new powers are on the rise. But with the restored order comes need for new adventures. One such place recently coveted by fortune-hunters is the deepwoods forest. In the past it has been impossible to explore due to the verdant veil and the fey magic. However, now these is a tool to deal with those - Cold Iron. Weapons and tools made from this magical metal are said to be very effective against the fey, making this land of opportunity ripe for the taking. In the near future, hordes of adventurers will pour into the deepwoods weilding weapons made from our Cold Iron... and we are sure to profit from it."
 cot_price.2.a:0 "I'm going on an adventure!"
 DEEPWOODS_EXPEDITIONS_HAPPENED:0 "Deepwoods expeditions"

 cot_price.3.t:0 "Decrease in deepwoods expeditions"
 cot_price.3.d:0 "The era of adventuring is coming to a close. Most of the deepwoods has already been explored, mapped and plundered. With that, our Cold Iron weapons are just not as sought after as they once were."
 cot_price.3.a:0 "It was fun while it lasted, where to for the next adventure?"
 DEEPWOODS_EXPEDITIONS_STOP_HAPPENED:0 "Decrease in deepwoods expeditions"