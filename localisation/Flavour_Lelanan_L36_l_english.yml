l_english:
 ##Missions

 #Column 1
 lelanan_lelis_ixora_title:0 "Leli's Ixora"
 lelanan_lelis_ixora_desc:0 "When Leli planned a trip to the jungles\nSearching for a new perfume\nI insisted that I come along with her\nPicturing a Tall Mouther being her doom\n\nInstead, though, I quickly learned\nThat the real danger was the sheer hills\nThe awful, treacherously steep jungles\nConspiring to exhaust our wills\n\nWe traveled together for days\nSearching high and low and gathering plants\nAnd on the sixth day we came across a calm, serene grove\nBrilliant white flowers, more than even Kolo grants\n\nThey exuded a fragrance most intoxicatingly pleasant\nAnd a powerful aphrodisiac, most clearly\n“This is it, Kyola!” Leli exclaimed\nOnce we had finally exhausted ourselves sincerely\n\n“Lel has blessed me with the perfect flower!”\nI laughed and nodded and kissed my wife\nThe White Flowers threatened us once again\nIn one of the most important moments of Leli’s life"

 lelanan_bless_the_ixora_jungles_title:0 "Bless the Ixora Jungles"
 lelanan_bless_the_ixora_jungles_desc:0 "[MissionTriggerBlessIxoraDesc]"
 lelanan_bless_the_ixora_jungles_desc_1: "I watched Leli stride through the fields of Ixora Flowers\nAdmiring her work with the Mihipha to spread life\nHer bright dress billowed in the breeze that shook the trees\nAnd my heart swelled with affection for my lover. For my wife\n\nI strode towards her, breathing in the intoxicating scent of the Ixora\nFelt my heart beat harder as its scent filled my senses\nAll around me the fantastical flowers grew magically \nCarefully cultivated by Leli’s great efforts--spared no expenses\n\nI reached Leli, swept her up in my arms\nBrought my lips to hers with fiery passion\nWe tumbled to the ground together giggling\nAmongst her fields of blessed Ixora, so in fashion"
 lelanan_bless_the_ixora_jungles_desc_2: "I walked arm-in-arm with Leli\nSurveying her beautiful fields of Ixora flowers\nEvery one was a gift for our departed wife\nA reminder of Kyola and Leli discovering them after many hours.\n\nThe Mihipha had blessed these fields with Lel’s power\nStrengthening their aphrodisiac effect\nThe very jungle rain that fell nourished the white flower\nA clear sign of Lel’s desire for us to connect\n\nLeli gently kissed my shoulder and looked up at me longingly\nMy name gentle upon her lips\nI smiled at her, leaning down to kiss my wife\nKyola was gone, but looking at Leli my heart still skips"

 lelanan_new_white_flower_jungles_title:0 "New White Flower Jungles"
 lelanan_new_white_flower_jungles_desc:0 "[MissionTriggerNewJunglesDesc]"
 lelanan_new_white_flower_jungles_desc_1: "I stood next to Leli and Felana\nLooking into the empty warehouse\nThe energizing scent of Ixora lingered in the air\nBut inside was not even a mouse\n\n“When is the next harvest going to be ready?”\nI asked Leli curiously as I rubbed her back.\n“Not for another month,” she shook her head\n“This is quite a dire sidetrack…”\n\nFelana made a most curious face\nAnd as I tilted my head towards her she smiled widely\n“The other jungles on Fahvanosy can’t grow more White Flowers\nBut I’ve been reading about the Aelantiri jungles idly…”"
 lelanan_new_white_flower_jungles_desc_2: "I stood next to Leli quietly\nLooking into my empty warehouse\nThe energizing scent of Ixora lingered in the air\nBut inside was not even a mouse\n\n“When is the next harvest going to be ready?”\nI asked Leli curiously as I rubbed her back.\n“Not for another month,” she shook her head\n“This is quite a dire sidetrack…”\n\nI scrunched my face tightly in deep thought\nAnd as my love tilted her head towards me I smiled widely\n“The other jungles on Fahvanosy can’t grow more White Flowers\nBut I’ve been reading about the Aelantiri jungles idly…”"

 #Column 2
 lelanan_rangitas_plan_title:0 "Rangita's Plan"
 lelanan_rangitas_plan_desc:0 "“Great and mighty Lel, Goddess of all that is Good\nGuardian of our great city, lend me your will\nThat I might face my death with all the grace I should\nAnd hear you speak until all the world is tranquil\n\nI have seen your many visions\nSeen the precipice we stand on\nI know the great Heartblades’ missions\nGuessed the True Chosen has been drawn\n\nSo I close my weary eyes\nSee the Isles laid out before\nShe strides so tall likewise\nHer heart bared forever more\n\nYet the path you show is fraught\nHer young future not yet set\nSo I ask now having fought\nPlease guide her to greatness yet\n\nI have spent a lifetime planting seeds\nFor trees I will never see grow\nFor what greater act of Love is there\nThan the mother who gives her life to children sow?”\n\n-Rangita Tallfried’s last poem, found in her personal journal after her passing"

 lelanan_rayafos_folly_title:0 "Rayafo's Folly"
 lelanan_rayafos_folly_desc:0 "In my childhood I traveled to Rayafo many a time\nAnd found the people there shared our heart\nLovers of food, festivals, and each other\nMore in common than ever we had apart\n\nWhat I could never understand\nWas their worship of the disgraced other\nRejecting Lel’s rightful position\nDespite her clear position as the Great Mother\n\nIn so very many ways we were the same\nIn the most important way of all we were very apart\nWhile we walked the Isles so softly\nThe other Vyzemby saw the world with no heart\n\nThey struggled and fought for dominance\nTrying to control the Isles to their own end\nBut we knew that it was instead Love\nWhich carried the great power to mend"

 lelanan_a_mothers_protection_title:0 "A Mother's Protection"
 lelanan_a_mothers_protection_desc:0 "My knuckles bare white as I grip my spear\nThe Mihipha eyes me warily\n“Are you sure of this, Kyola?” he calls with a frown\n“This is much too far to train primarily”\n\n“To defeat Haingo, this is what is needed,” I reply\nThe monarch’s violent white flames dancing in my mind.\n“The Great Mother protects,” I assert. “Always”\nHe sighs, his hands raised towards me and magic defined\n\n“You Daughters of Lel are all crazy.”\nI smile, for he is right, and his fire races towards me\nIt sizzles and hisses and roars, like a beast eager to devour\nBut I imagine before me Lel’s great sea\n\nFor I know my Great Mother Lel will protect\nAnd my faith forms into an abjured dome before\nThe fire washes harmlessly against it\nLike water laps at the shore\n\nThe flames break\nAnd I grin at the stunned Mihipha"

 lelanan_an_open_heart_title:0 "An Open Heart"
 lelanan_an_open_heart_desc:0 "[MissionTriggerHeartDesc]"
 lelanan_an_open_heart_desc_1: "“A book?” I said, surprised\nIsabel Mirthvoice was not so mundane\n“Not just any book,” she replied\n“But one from which we have much to gain”\n\n“A great tome of many love stories\nFrom all across Halann”\nI smiled and nodded slowly\n“You seem to have quite a plan”\n\n“How would we collect these spread out stories?\nThese: Tales of Halann’s Love?”\n“We will carry your Mihipha far and wide, of course\nAnd reach out our open glove!”\n\nHer husband, a Karshyr Lizardfolk\nNodded along with a great smile\n“With my hydromancy and her navigation…\nIt won’t take quite as long a while”"
 lelanan_an_open_heart_desc_2: "I sat beside Leli as Isabel Mirthvoice spoke\nHer Lizardfolk husband at her side\nThey were sharing a Karshyr love story\nLeli looked sad sitting on our side\n\n“I do apologize,” I interrupted\n“May we get to your proposal?”\nIsabel coughed, nodding politely\n“Yes, of course. We are at your disposal\n\nA great tome of many love stories\nFrom all across Halann\nWe will carry Mihipha far and wide\nAs we carry out Lel’s great plan!”\n\nI looked at Leli pensively\nSaw the pain and yearning behind her eyes\nBut maybe this could help us heal\nShe spoke confidently to my surprise\n\n“Tales of Halann’s Love, huh?”\nLeli’s smile carried so much pain\n“I would be happy to help, of course\nFrom this mission we have much to gain”"

 lelanan_spreading_our_love_title:0 "Spreading our Love"
 lelanan_spreading_our_love_desc:0 "It was purely by chance\nThat Isabel brought Ixora with her as she sailed Halann\nBrought Leli’s special perfume to Cannor and East Sarhal\nGave Leli’s business a new dawn\n\nExcept it wasn’t by chance at all\nLeli had specifically asked Isabel for support\nAnd once Cannorians and Halessi got her perfume\nIt became the talk of every single court\n\nTraders began making the journey all the way to Lelanàn \nHoping to get their hands on Leli’s wondrous perfume\nRisking their lives to get their hands on the incredible profits\nIxora could guarantee them; no matter the risk of doom\n\nThe eighth report of a ship carrying Ixora sunk\nFinally made the issue clear that something had to be done\nIf Leli’s love was to safely reach Cannor and East Sarhal\nSafe ports of trade had to be won"

 lelanan_a_loving_home_title:0 "A Loving Home"
 lelanan_a_loving_home_desc:0 "At first it was just halflings, humans, and lizardfolk\nEach of us playing our role in our flourishing city\nBut the Spouse’s Crusade and Tales of Love\nLit a beacon across Halann for all who never found pity\n\nWe were a safe place for all with Love in their hearts\nA refuge for the downtrodden, the persecuted, the outcast\nGnolls who rejected demon-worship came here \nHoping to find a place they could live in peace.\n\nThose whose Love fell outside of accepted societal norms came\nHoped to protect the fragile love they held to dearly\nEven a few Trolls freed from their dire curse had arrived\nHoping to find safety, knowing suffering oh so clearly\n\nBut sometimes these people--all equal in Lel’s eyes\nWere not met with a gentle gaze and care\nAll we could do was strive to do better each and every day\nSo all can find a home in the City of Love; their hearts we would repair\n\nThat is our §VLabour of Love§!"

 lelanan_the_scent_of_love_title:0 "The Scent of Love"
 lelanan_the_scent_of_love_desc:0 "A thousand peoples ran all about\nA thousand scents wafted in the air\nOnly one calmed the Troll’s bout\nOnly one did the Elf put in her hair\n\nOnly one scent was part of the rituals\nOnly one did the Gnoll delight in\nOnly one was good enough for humans\nOnly one did all wish to share with kin\n\nIt brought the world together\nTo enjoy the pleasing scent\nIt was all the rage world-wide\nAll knew what Ixora meant"

 #Column 3

 lelanan_the_city_of_love_title:0 "The City of Love"
 lelanan_the_city_of_love_desc:0 "I walk the streets of the City of Love\nEvery day meeting new people\nYet something is missing inside me\nNo matter how much I pray at your steeple\n\nI was raised to become a paladin\nMy every word and action of Lel’s divine embrace\nYet as I studied and trained day in and out\nI felt myself losing my great pace\n\nI best the other Heartblades in training\nThen extend my help to them with a smile\nThey giggle and take my hand so gratefully\nAnd my heart flutters so weightlessly\n\nYet they move on in time\nBlessed by your divine embrace\nAnd I am left here all alone\nThe only to never feel even a trace\n\nWhat do I lack, o’ Great Matriarch\nMother of all, Ruler of the gods themselves?\nWhat do my sisters know that I do not\nOr am I more broken than I thought?\n\nIs it my cursed birth?\nMy mismatched body?\nMy pained heart when I see the lump in my throat?\nDoomed to a body I was never meant to have?"

 lelanan_the_broken_marriage_title:0 "The Broken Marriage"
 lelanan_the_broken_marriage_desc:0 "Lel was not always the Great Matriarch\nRuler of the Nakavy Avo\nThe greatest shrine once lay in Kunolo\nAnd Kolo reigned as Great patriarch instead\nHe was Lel’s husband, tamed by her great Love\nThe marriage between the two tumultuous\nYet their love a high gift to behold.\n\nTheir namesake cities followed their example\nTwin centres of Halfling history\nA deeply kindred spirit bonded their people\nUntil the cities were torn apart\n\nIf we are to cement Lel’s superiority\nAmongst the Nakavy Avo\nIt must be Lelanàn who returns the lost shrine\nForever to Vyzemby control.\n\nWe shall mend the broken bond of marriage\nBetween the wed cities and their patron Gods."

 lelanan_the_spouses_reunion_title:0 "The Spouses' Reunion"
 lelanan_the_spouses_reunion_desc:0 "[MissionTriggerReunionDesc]"
 lelanan_the_spouses_reunion_desc_1: "I stood on the balcony overlooking Kunolo\nPride swelling in every corner of my heart\nMy efforts to oversee the rebuilding of the great city\nHad been an incredibly successful art\n\nThe streets bustled with the newest citizens of Lelanàn\nPeople from every walk of life hurrying about\nThey once more lived their lives with laughter and joy\nAnd it was finally time for me to my wives route"
 lelanan_the_spouses_reunion_desc_2: "The war was over. Or at least, that’s what they had told us.\nBut for us, it would never be over.\nNot with her gone.\nNot with Kyola torn from our lives forevermore."

 lelanan_labours_of_love_title:0 "§VLabours of Love§!"
 lelanan_labours_of_love_desc:0 "[MissionTriggerLaboursDesc]"
 lelanan_labours_of_love_desc_1: "“Have you ever escorted pilgrims to the Dongray Shrine?”\nI asked in a harsh, scolding tone\nShe lowered her gaze and shook her head\n“No, High Priestess. I have never been beyond Lelanàn stone”\n\n“Then consider you have not seen the roads across our Isles\nThat you have not pushed carts up steep jungle hills\nIn the pouring monsoon rains, and the suffocating heat of summer\nJust completing a pilgrimage is itself a great test of our wills”\n\nUntil you have experienced the suffering our people face\nJust getting to their shrines to pay homage to the gods \nDo not think to contest this plan. Understood?”\nThe Priestess sets her jaw tightly, then nods.\n\nI softened my tone. “Your concern is not unreasonable\nThe logistics and cost will surely be greatly above\nBut some things are worth any cost and any effort\nSuch is what makes it a §VLabour of Love§!.”"
 lelanan_labours_of_love_desc_2: "I looked over the account books for Leli’s business\nThe candles around our room flickered gently\nThe monsoon rains gently pattered on our glass windows.\nThe sound of our shared breathing filled the silence contently\n\n“Leli, these roads… They’re terribly expensive\nAre we sure they are a good plan?”\nLeli turned to face me, a small smile on her face\nThese days her smiles lasted such a small span… \n\n“The cost is irrelevant, Felana\nBecause building them is not a matter of income.\nDo you know who drafted the plans for them?\nWhose mind such ambition could ever have come from?”\n\nI shook my head, unable to recall who it was\nThat had come up with such an ambitious road plan.\n“It was Kyola, my love…” Leli said forlornly\nTurning back to look out the window. “Only she can.”\n\nI looked down at the ledger again and then closed it\nUnderstanding now the importance of these roads.\n“One of her §VLabours of Love§!, then?”\nLeli nodded, “Always… One of her codes”"

 lelanan_lels_ascendancy_title:0 "Lel's Ascendancy"
 lelanan_lels_ascendancy_desc:0 "[MissionTriggerLelAscendancyDesc]"
 lelanan_lels_ascendancy_desc_1: "“Eleven shrines there were\nTen to the members of the Nakavy Avo lesser\nPaying homage to the family members\nEven Kolo: the disgraced predecessor\n\nOnly one to the Great Matriarch herself\nOnly one which stood far and away above the others\nThe people of Lelanàn have proven our strength\nProven the power of Lel’s Love--of the Great Mother\n\nNo longer will I tolerate any to be elevated above Lel’s\nIt is past time we gave our goddess her proper veneration and arts\nJust as she rules the Great Family\nSo too only she deserves to rule our hearts”\n\n-The Decree of Ascendancy, issued by Chosen of Lel Kyola Heartblade in 1491"
 lelanan_lels_ascendancy_desc_2: ""“Eleven shrines there were\nTen to the members of the Nakavy Avo lesser\nPaying homage to the family members\nEven Kolo: the disgraced predecessor\n\nOnly one to the Great Matriarch herself\nOnly one which stood far and away above the others\nThe people of Lelanàn have proven our strength\nProven the power of Lel’s Love--of the Great Mother\n\nNo longer will I tolerate any to be elevated above Lel’s\nIt is past time we gave our goddess her proper veneration and arts\nJust as she rules the Great Family\nSo too only she deserves to rule our hearts”\n\n-The Decree of Ascendancy, issued by the Chosen of Lel in 1491"

 lelanan_the_life_beneath_us_title:0 "The Life Beneath Us"
 lelanan_the_life_beneath_us_desc:0 "The great mountain bore great magic\nReagents as common as wheat or wood\nSo we sought to secure yet more wealth\nExcavated far deeper than we should\n\nLel’s gifts were oft enigmatic\nHer life took many different forms\nAnd as we delved ever deeper\nThis time it birthed a great storm"

 lelanan_lels_greatest_gift_title:0 "Lel's Greatest Gift"
 lelanan_lels_greatest_gift_desc:0 "[MissionTriggerGreatestGiftDesc]"
 lelanan_lels_greatest_gift_desc_1: "When the Mihipha came to me\nI did not want to believe it\nThe mere idea I could bear a child\nNo longer be deeply unfit\n\nI clutched my stomach tightly\nNearly cried at the mere plan\nThen summoned my mages back\nSaid “If anyone, we can\n\nLel’s greatest gift is Love\nFor life flows forth from it\nIf we can share that life with all\nThen I will spare effort not a bit"
 lelanan_lels_greatest_gift_desc_2: "When the Mihipha came to us\nI could hardly believe my ears\nThe mere idea we could bear a child\nOur dream for so many years\n\nLeli was so elated\nAgreed to support them from above\nIt was an opportunity to show\nHow equal to theirs was our love\nIf only Kyola could share this with us\nHow happy she would be\nOur daughter in her arms\nHer heart would finally have been free"

 #Column 4

 lelanan_kyolas_oath_title:0 "Kyola's Oath"
 lelanan_kyolas_oath_desc:0 "A Paladin’s Oath is carved into their very soul\nGuiding their morals and lives in return for their great power\nProtecting the innocent from disasters far greater than they\nAnd felling terrible demons with naught but faith in their hearts.\n\nMy Oath came last of my Sisters\nThe orphanage my home alone\nBut while I thought so long to be broken\nMy Oath proved stronger than all\n\nIt came to me as I lay alongside Leli and Felana\nPondering my deep affection while my fingers ran through soft hair\nThey had accepted my differences wholeheartedly\nAnd now I shared in their passion for one another.\n\nIn their Love."

 lelanan_assert_lels_position_title:0 "Assert Lel's Position"
 lelanan_assert_lels_position_desc:0 "I had seen the Shrine of Yuye\nBack in my adolescence\nIt was shoddy and run down\nNot like Lel’s great magnificence\n\nThinking back on that infuriated me\nNot just with shame at the disgrace\nBut at how dare any could think\nAny other could occupy Lel’s sacred place"

 lelanan_and_armoured_chest_title:0 "and Armoured Chest"
 lelanan_and_armoured_chest_desc:0 "[MissionTriggerArmouredDesc]"
 lelanan_and_armoured_chest_desc_1: "Spears clang upon abjured shields\nDivine power surges, dummies turned to smoldering ash\nI stood over the paladins as they got back to their feet\nHow hard I worked to show them they were still too brash\n\n“Do not think yourselves weak, my sisters”\nI helped one of them up\n“You make Lel proud with your might. \nIn fact, come, please share a cup\n\nI think that you are more than ready\nTo help me with something I’ve been planning\nFor a while now the lost Ananoma\nHave been so very enchanting\n\nOur work is not yet finished\nA new generation of paladins need be trained\nFor the day we return to the lost cities\nAnd reclaim the land so pained"
 lelanan_and_armoured_chest_desc_2: "Kyola was the strongest of her generation \nHer divine power outstripped all of her peers\nYet she now lay in the Great Matriarch’s arms\nHow true came our greatest fears\n\nI asked Leli set aside an endowment\nFunding the training and arming of the other Daughters\nWe prayed together every night\nNo others lose their lovers to war across Her waters\n\nYet we knew that our grief\nCould not turn us away from Lel\nAnd so as we helped the next generation of paladins\nWe launched expeditions to where we used to dwell"

 lelanan_the_role_of_the_mihipha_title:0 "The Role of the Mihipha"
 lelanan_the_role_of_the_mihipha_desc:0 "The Mihipha were many things across Fahvanosy\nMages, scholars, bards, diplomats.\nIn Lelanàn, however, they had slowly taken on a new role\nOne which resulted in a great many spats\n\nService to Lel was their new calling\nMy priesthood increasingly composed of their number\nTheir magical talent, knowledge, and aptitudes making them perfect\nAnd breaking them from their purposeless slumber"

 lelanan_lels_blessed_waters_title:0 "Lel's Blessed Waters"
 lelanan_lels_blessed_waters_desc:0 "[MissionTriggerBlessedWatersDesc]"
 lelanan_lels_blessed_waters_desc_1: "I touched the pool, focused on my faith in Lel\nHer domain over water was absolute\nSo her divine power surged forth from me\nAnd transformed the entire pool, Holy Water taking root\n\nThe small fish within grew more excited and energized.\nAnd I smiled at Felana as she stared down in awe\n“It tastes a touch sweet if you want to drink from it.”\nShe leaned down, cupping her hands and tracking a draw\n\n“Oh, it is! And the fish looks so energized!\nWe could bless any pool of water like this?”\nI nodded, thinking about the grand plan I had devised.\n“This is the next §VLabour of Love§!: blessing even the abyss”"
 lelanan_lels_blessed_waters_desc_2: "I ran my hand idly through the blessed pool\nFelt the tingling of the rejuvenating water\nThe fish within the pool swam excitedly\nAnd for a moment, I felt like Her daughter\n\nThis was another of the great §VLabour of Love§!\nKyola had devised so long ago\nAnd as I felt the magic upon my hand I reminisced\nRemembered all the things I loved about her so\n\nThe pain remained, but…\nIt got a bit lighter every day\nLike the fish swimming before me life went on\nAnd Good still remained in the world where it may"


 lelanan_blessing_her_rains_title:0 "Blessing Her Rains"
 lelanan_blessing_her_rains_desc:0 "[MissionTriggerBlessingRainsDesc]"
 lelanan_blessing_her_rains_desc_1: "I stood in that great monsoon\nFeeling the rain crashing down\nHeard the wind’s bestial howl\nWhipping about my silken gown\n\nI raised my hands to the sky\nShouted my prayer to our great Lel\nFelt her magic surging through me\nLike drawing up from a mighty well\n\nI plunged my hands into the ocean\nFelt my magic wash away from me\nWhile I could not bear a child\nThere was still so much I could be\n\nSo much life teemed in the water\nI could feel it all so very clear\nAnd now they, too, would know the Mother\nWould too be able to hold her dear"
 lelanan_blessing_her_rains_desc_2: "That night felt just like all the others\nEven as we knew of the great ritual\nWe stayed in our warm bedroom\nBut maybe that was just habitual\n\nOutside the monsoons raged wildly\nWhile the paladins touched the sea\nI swear the rain glowed golden\nBut Leli insists that was just me\n\nNow the sea is rife with life\nLel’s blessing bestowed on all\nHer holy rains soothe our wounds\nNo matter how minor or small"

 #Column 5

 lelanan_reclaim_and_rebuild_title:0 "Reclaim and Rebuild"
 lelanan_reclaim_and_rebuild_desc:0 "[MissionTriggerReclaimDesc]"
 lelanan_reclaim_and_rebuild_desc_1: "Every Ananoma had their own unique differences\nThe dilapidated honeycomb cities as varied as we are today\nSo each Ananoma had their own lessons to impart upon us\nEach lost city holding many forgotten secrets they yearned to betray\n\nIf we were to learn their secrets and assert ourselves--\nAssert Lel as the dominant power in South Sarhal\nIt was imperative that we reclaim, fortify, and then rebuild\nEach of the Ananoma as soon as possible and not forestall\n\nI ran my hands over my detailed sketches\nThe entire layout of Lelanàn laid out on the desk before me.\nWith the lessons of the past we could build a new future\nFor the greatest city there ever would be"
 lelanan_reclaim_and_rebuild_desc_2: "Every Ananoma had their own unique differences\nThe dilapidated honeycomb cities as varied as we are today\nSo each Ananoma had their own lessons to impart upon us\nEach lost city holding many forgotten secrets they yearned to betray\n\nKyola had once dreamt of a new Ananoma\nOne built in the heart of Lelanàn and its etches\nBut her dream died in its infancy along with her\nAnd now I looked over only her rough sketches \n\nBut as the Vyzemby finally returned to our long-lost homes\nI thought maybe, we could relearn our long forgotten schemes\nAnd once we reclaimed our once great heritage\nWe could fulfill another of her dreams"

 lelanan_the_ocean_ananoma_title:0 "The Ocean Ananoma"
 lelanan_the_ocean_ananoma_desc:0 "[MissionTriggerOceanAnanomaDesc]"
 lelanan_the_ocean_ananoma_desc_1: "Lelanàn was the City of Love\nAs surely as Lel’s power flowed through me\nYet that brought my wonderful metropolis a great issue:\nThe people were spilling out into the sea!\n\nThe city’s population doubled, then doubled again\nHouses built atop one another while the city spread out\nDozens of teams of paladins laboured day and night against filth\nYet our exponential growth posed an exponential issue no doubt\n\nFelana had drafted plans\nMore ambitious than even my own\nRebuild the entire city from the ground up\nBuild a new Ananoma with all that was known\n\nCentered around our bustling harbour\nAnd the glorious Cathedral of Lel which overlooked it\nLelanàn would be rebuilt the largest metropolis on Halann\nAll would be able to find a place of love they would fit"
 lelanan_the_ocean_ananoma_desc_2: "Lelanàn was the City of Love\nAs surely as Lel’s love was inside me\nYet that brought our wonderful metropolis a great issue:\nThe people were spilling out into the sea!\n\nThe city’s population doubled, then doubled again\nHouses built atop one another while the city spread out\nDozens of teams of paladins laboured day and night against filth\nYet our exponential growth posed an exponential issue no doubt\n\nMore ambitious than even Kyola’s\nI had drafted plans of my own\nRebuild the entire city from the ground up\nBuild a new Ananoma with all that was known\n\nCentered around our bustling harbour\nAnd the glorious Cathedral of Lel which overlooked it\nLelanàn would be rebuilt the largest metropolis on Halann\nAll would be able to find a place of love where they would fit"

#Events
 flavour_lelanan.0.t: "Love Does Not Die"
 flavour_lelanan.0.d: "Rangita’s passing was solemn\nHaving led Lelanàn for so long\nThe idea that she was departed\nCould feel nothing but wrong\n\nHer funeral was grand\nLeli and Felana at my side\nAnd as we stood before Lel’s shrine\nThe new High Priestess gestured wide\n\n“Though Rangita may be gone\nWe know the Nakazy guide her to rest\nHer many teachings remain with us\nPushing us all to be our best\n\nLove freely. Love openly. Love often\nHer greatest teachings of all”\nI lowered my head and reflected\nUpon my own impossible wall\n\nI had long kept out of relationships\nPaladins of Lel expected to bear life\nBut my cursed body was born so wrong\nAnd I could never be a good wife\n\nYet here I stood now, listening to those words\nA cruel fate to those in different cities and a different start\nBut I was in the City of Love, not life\nAnd Lel would never condemn these feelings in my heart"
 flavour_lelanan.0.a: "I Needed to Tell Leli and Felana how I Felt"

 flavour_lelanan.1.t: "Lelanàn's Weakness"
 flavour_lelanan.1.d: "Long have we eyed the grand city of Lelanàn\nThe jewel of the isles, the center of Vyzemby faith\nNow we receive a strange report, the dilapidation of their defenses\nThe complacency of their city’s garrison."
 flavour_lelanan.1.a: "Now is the time! We Strike!"
 flavour_lelanan.1.b: "This is surely a trap to lure us in."

 flavour_lelanan.2.t: "The Upstart Sisterhood"
 flavour_lelanan.2.d: "Long have we warily eyed the grand city of Lelanàn\nThe jewel of the isles, the center of Vyzemby faith\nNow they have struck against Rayafo, annexing them in a dastardly scheme \nHow dare a country of mere priestesses think themselves worthy to rule the Isles"
 flavour_lelanan.2.a: "We Shall Strike Down the Upstarts!"
 flavour_lelanan.2.b: "Now is Not the Right Time…"

 flavour_lelanan.3.t: "Humble Beginnings"
 flavour_lelanan.3.d: "As I patrol the city I yawn, a swarm of children running by\nThe game they play so happily is theirs and theirs alone\nThey are lively and energetic no matter how one might pry\nProof of Lel’s domain over Life as their feet clatter on stone\n\nThe sun bears down on me hatefully as I walk further\nThe water trickles past me carried by Lel’s great streams\nI dip my hands and drink of her soothing ambrosia\nAnd feel the power of Her third domain in me like soothing dreams\n\nGlass shatters, shouted curses erupt nearby, my heart races\nMy blade jumps to my hand, I race towards the commotion\nI burst through the door of the humble perfumery, scanning for violent traces\nAnd find two goddesses kneeling on the ground\n\nBroken pottery is scattered around them\nI see myself in the jagged edges and shattered purpose\nYet the two women are deeply radiant\nAnd they pick up the pieces with a careful tenderness\n“Oh Goodness, look at us,” one of them says\nAnd I obey her honeyed words eagerly\n“Welcome to Leli’s fragrances, Paladin\nWe apologize for the disturbance”\nI shake my head, deep shame clouding my feelings\n“It is I to apologize to you. I heard the commotion and feared the worst”\nThe second woman smiles with uplifting radiance\nAnd my heart leaps and bounds out of my chest\n“Thank you for the concern,” her silken voice blesses me.\n“I am Felana, and she my wife, Leli.\nWould you maybe stay with us for a bit?\nTry some of Leli’s perfume while you sit?”\n\nI nod and smile widely, my awe hard to conceal\n“I am Kyola Heartblade, paladin in training\nAnd I would deeply love to” I replied with great zeal"
 flavour_lelanan.3.a: "What I was lacking was Lel’s Second Domain: Love"

 flavour_lelanan.4.t: "Estranged Spouses, Estranged Cities"
 flavour_lelanan.4.d: "I sat in the corner of the tavern\nSipping on my honeyed mead\nWatching the people of Kunolo go about their days\nNot so different from Lelanàn itself\n\nBut on this third day of reconnaissance\nI noticed the subtle difference\nFor sitting at the table to my right was a pair\nA Halfling and tall Human\n\nI could not determine their genders\nClearly lovers how they held another\nBut as I looked around to see what others thought of them\nNobody paid them any heed at all.\n\nI was the only one surprised by their bold differences\nAnd I looked down at my mug thoughtfull\nIn Lelanàn, such a sight was not impossible\nI knew that fact all so well\n\nBut there remained a sense of ostracization\nOthering towards those who Loved differently\nI and Leli and Felana had felt this\nAnd maybe the City of Love itself \nMay still have more yet to learn about Love\n\nAfter all, Love Must be Unashamed.\nAnd here it was on full display for all\nA perfect manifestation of unashamed Love\nAnd an example for all to follow"
 flavour_lelanan.4.a: "It was Time our Cities Were Reunified"

 flavour_lelanan.5.t: "Kyola's Choice"
 flavour_lelanan.5.d: "I stood before the High Priestess\nHer personal chambers swirling with perfume\nA slight smile rested on my face\nAs her offer hung in the air.\n\n“I’m honoured, my High Priestess\nThough I admit I question why me\nI have a flawless record, yes\nBut I have Sisters more flawless yet.”\n\nThe High Priestess smiled warmly at me\nTaking a bite of one of her ever-favoured pastries\n“Do not discredit your influence, Kyola.\nI have heard much of how your Sisters look up to you\n\nThey turn to you for guidance.\nYour prowess against Rayafo was unquestionable\nYou saved many lives with your heroism in battle\nAnd we will need that heroism more yet\n\nThere is no better candidate to lead the Spouse’s Crusade\nNow, do you accept or not?”\n\nI lowered my head, honoured most deeply\nThat the Chosen of Lel herself thought so highly\nI carefully considered my reply in that time\nFor I knew all too well the risks\n\nOn the battlefield\n§RNobody was assured to return to their loved ones alive…§!"
 flavour_lelanan.5.a: "“I can Fulfill my Oath in my Wives’ Arms”"
 flavour_lelanan.5.b: "“My Oath Demands I Fight for Kolo”"

 flavour_lelanan.6.t: "Kyola's End"
 flavour_lelanan.6.d: "The arrows whistled towards me\nHammering into my holy shield\nAnd further burdening my weary mind\n\nI desperately sought an ally\nBut was greeted with only death\nFellow Daughters of Lel lay fallen\nIn the blood-soaked mud around me\n\nAll around me were my enemies\nTheir spears and blades poking and prodding\nAs a hunter wears down their prey\n\nOne of the hunters stepped too close\nA surge of my holy power slaying them instantly\nBut I stumbled as my mind swam from the exertion\nFor it was all too much, far far too much... \nToo much physical effort, too much fighting, too much magic\n\nMore arrows whistled through the air towards me\nSo I abjured a new shie-\n\nI let out a cry of pain and nearly toppled\nLooked down in horror at my chest\nOne of the arrows had struck too fast\nAnd pierced my heart with its hateful tip\n\nI fell to my knees then onto my side\nThe blood and mud splashing beneath me\nI clutched at my chest, my heart seizing as it gave out\nAnd felt ice-cold dread grip my very soul\n\nIt couldn’t be…I had assured them\nI had promised that I would return triumphant\nI tried to drag myself through the mud\nTo return back to the warm arms of my waiting wives.\n\nBut my body could only go a few metres\nBefore it gave out on me\nAnd I felt the blood-soaked mud on my face \nAs the world grew cold and distant and quiet\n\nThe Nakazy sisters were coming to take me away."
 flavour_lelanan.6.a: "No… Please… I have to return… to my Wives…"

 flavour_lelanan.7.t: "The Meaning of an Oath"
 flavour_lelanan.7.d: "Every paladin describes discovering their Oath different\nSome like a puzzle finished, others like a fog clearing\nFor myself it was the descent of a grand purpose\nRaw and inevitable and holy\n\nThe water I drank, the life I lived\nThey were gifts from Lel as surely as the sun rose each day\nBut they were small compared to the two gifts\nI held in my arms every night I lay\nThe gift of Love in physical form before me\nMy purpose and reason for living\n\nLove Must be Given Freely\nLet none living or dead get in the way of Lel’s greatest gift\nAnd never pass judgement on others for the way they choose to Love\nSo long as Love is given consensually\nIt can create life, build empires, and topple tyrants\n\nLove Must be Unashamed. \nToo often Love is forced to the corners; \nshunned, rejected for being different.\nProtect all whose Love has been oppressed\nAnd let your own Love be expressed freely to the world\nAs an example for all\n\nLove Must be Shared with All. \nTo Love oneself is the basis of Love\nBut the true heart of Love is to Love all others utterly selflessly\nBy sharing this selfless love as far and wide as possible\nIt grows and multiplies, and all are uplifted by its majesty\n\nThis was my Oath\nEngraved upon my heart and soul\nAnd as I repeated its tenets in my mind\nI could feel the swell of divine magic within me.\n\nI looked down at Leli and Felana tenderly\nKissed the tops of each of their heads\nI was a Paladin of Lel in full now\nAnd I knew now what had to be done\n\nFor it was my duty and Oath to use the power\nMy Great Mother had finally rewarded\nTo spread her gifts to all the world"
 flavour_lelanan.7.a: "All the World Shall Know Lel’s Love"

 flavour_lelanan.8.t: "Kyola's Triumphant Return"
 flavour_lelanan.8.d: "My armour was battered, my spear broken\nBut my spirit remained unshaken\nI had won. We had won\nAnd Kunolo had been retaken\n\nOnce again and forevermore in Vyzemby control\nAnd already rebuilt even greater than before\nSo I returned to my home; to the dearly missed Lelanàn\nAnd my ship arrived back at the harbour\n\nLeli and Felana stood together on the docks\nWaving to me excitedly as I stepped ashore\nBut while I yearned for some intimate time with my wives\nThe docks were crowded with many more\n\nThose waiting chanted my name and I smiled at the sight\nI looked between the crowd and my wives\nPride clear on their faces\nAnd laughed, “What’s all this about!?”\n\nLeli giggled, leaning up on her toes to give me a kiss.\n“The High Priestess wishes to speak with you\nMost immediately, my mighty wife. \nYour time leading Lelanàn isn’t over yet…”\nI looked down at her in surprise\nThe meaning of her words dawning on me\nAnd smiled at Felana in amazement.\n“Well then, whatever could this be?”"
 flavour_lelanan.8.a: "I shall continue to Lead with Love!"

 flavour_lelanan.9.t: "Without Her..."
 flavour_lelanan.9.d: "Her body lay before us; lifeless, oh so still\nMy second love—Our second love—not moving\nShe was gone\nNot speaking\nNot laughing\nNo warmth\nNo breathing\n\nLeli simply wept beside me\n\nTwo weeks since we were told\nTwo weeks grieving her passing\nYet the pain never subsided\nAnd upon this world I felt now trespassing\n\nI sniffled, held Leli tightly\nHad to remain strong for us both\nGently rubbed her shaking back\nThought of Kyola’s Oath\n\nWe held no such power\nNo strength nor beauty such as she\nAnd now I felt the weight of her absence\nFelt how deeply she had changed we\n\nHow could I do without her?\nWithout her late night reassurances?\nHer guiding confidence?\nHer endless love?\n\nHow could I ever hope to make this world better as she did?"
 flavour_lelanan.9.a: "A World that was Forever Diminished Without Her…"

 flavour_lelanan.10.t: "Kyola's Ceremony"
 flavour_lelanan.10.d: "I wore the robes of a High Priestess\nThought of Felana’s sweet words to me\nStood before the great loud audience\nAnd bent down unto my one knee\n\n“Kyola Heartblade, hero that you are\nYou are here today because Lel has spoke\nShe has seen your actions—how you inspire hope\nAnd now seeks to make you leader of her folk”\n\nThe audience cheered so loudly\nI looked over them and smiled\nMy time spent back had paid off\nMy victory anything but mild\n\nMany Priestesses stood around us\nTheir support so hard to earn\nYet my great efforts had not been wasted\nFor this position which I did yearn\n\n“Kyola Heartblade!” the High Priestess continued\nHanding the sign of her station to me so gently\n“You are the Chosen of Lel; High Priestess\nMay you rule over us all intently”"
 flavour_lelanan.10.a: "“I shall Lead With Love!”"

 flavour_lelanan.11.t: "The Paladin Frontiers"
 flavour_lelanan.11.d1: "My blade slashed with divine power\nThe dense Fangaulan jungle in our way\nWe tread upon dirt which had seen no Halfling\nAnd once we found Ninakaire we planned to stay\n\nWe expected to find a den of monsters\nThe light of civilization lost from its honeycombed walls for years\nSo we came ready for any threat which we may face\nIn our arms gribbed tightly our great spears\n\nI slashed through another thick bough\nFound myself emerging onto a clear hilltop\nOverlooking the ruins of the Ninakaire Ananoma\nThe huge honeycomb structures bringing us to a stop\n\nAs more of my paladins caught up\nI could hear their gasps of awe\nI smiled as I set off down the the hill\nMy divine blade ready for this maw"
 flavour_lelanan.11.d2: "I arrived in Ninakaire\nSeveral months after it was found\nThe reclamation rife with details \nOf monster attacks and a diseased mound.\n\nThe honeycomb structures of the Ananoma\nWere truly a sight to behold\nStill standing taller after years of decay\nThan Fahvanosy’s fortresses so bold\n\nPaladins bustled everywhere\nSet to the Labour of Love that was reclamation\nI nodded respectfully as they hurried past me\nAnd I bowed my head to them as they greeted my station.\n\n“Madam Falana! I am glad you made it safely\nWhat do you think of our hard work?\nThis was made possible thanks to you and Madam Leli\nUs standing amongst such aweing stonework”\n\nI looked around and imagined the potential\nThe towering Ananoma standing tall so long\nNodded to the Paladin beside me\n“Kyola would be proud of us being so strong”"
 flavour_lelanan.11.a: "We Shall Reclaim These Lost Homes"

 flavour_lelanan.12.t: "Afomapobo Stirs"
 flavour_lelanan.12.d1: "It started with naught but a rumble\nThe earth releasing a great groan\nThen the shaking began in earnest\nAnd a great burst of lava was thrown\n\nThe sky darkened with ash\nAs the world was set alight\nI led my Paladins to the mountain\nAll who could gave swift flight\n\nWe conjured our great magics\nContained the lava as best we could\nWhile my priestesses rushed to help\nAll who had withstood\n\nIn the end the province was ruined\nAll was burnt to black ash\nAfomapobo had stirred from its slumber\nFor we had been too brash."
 flavour_lelanan.12.d2: "It started with naught but a rumble\nThe earth releasing a great groan\nThen the shaking began in earnest\nAnd a great burst of lava was thrown\n\nThe sky darkened with ash\nAs the world was set alight\nThe Paladins rushed to the mountain\nAll who could gave swift flight\n\nThey conjured their great magics\nContained the lava as best they could\nWhile the priestesses rushed to help\nAll who had withstood\n\nIn the end the province was ruined\nAll was burnt to black ash\nAfomapobo had stirred from its slumber\nFor we had been too brash."
 flavour_lelanan.12.a: "Send Relief Immediately! Save as Many Lives as Possible!"

 flavour_lelanan.13.t: "The Divinity Love Brings"
 flavour_lelanan.13.d1: "The Enahelibe Ritual was most sacred\nSomething I had read about a great deal\nBut conducting it firsthand was a very different experience \nOne for which I had little zeal\n\nI recited the prayers to Lel perfectly\nWhile the Mihipha circled the slowly dancing pair\nTheir voice infused with a magic that excited the participants\nAnd readied them for the arousal which hung in their air\n\nThat was what made the ritual difficult for me\nThe couple so tender and loving and sweet\nThey danced as one so close together\nTheir hearts moving their feet\n\nAnd I could not help but think about my inability to participate\nIn the Enahelibe Ritual which brought great fertility\nThat was the cost of my being born in the opposite body\nI would never carry the life-creating ability\n\nAs the ritual continued on I set aside my feelings\nConsidered the magic hanging in the air\nHow else could it be used for good?\nI asked later in quiet prayer"
 flavour_lelanan.13.d2: "The Enahelibe Ritual was our famous fertility ritual\nA Mihipha and priestess conducting an elaborate dance\nExciting the participating lovers and their hearts\nAnd preparing them for the sacred act of creating life; increasing their chance.\n\nUnfortunately the context of fertility the ritual carried\nMeant it was only conducted for couples who could create life\nLess orthodox couples like Leli and I\nConsidered less important than a common knife\n\nSo I may have been driven by spite\nWhen I lobbied to redirect the Mihipha away from the Ritual\nLeveraging Leli’s immense financial support of the Sisterhood\nTo get what I wanted; my anger was a touch habitual"
 flavour_lelanan.13.a: "The Mihipha can support the Paladins"
 flavour_lelanan.13.b: "The Mihipha can support the Priests"

 flavour_lelanan.14.t: "Her Water Gives Us All Life"
 flavour_lelanan.14.d1: "I entered the huge tent and looked around\nSo many of my Daughters of Lel running about\nTook in the sight of so many wounded\nPained groans and disciplined orders leaving no doubt\n\nI watched a paladin carry a crate of holy water in\nHanded bottles out to all the others\nThe strangest part of it all, to my surprise\nWas that on our cots weren’t just our mothers\n\nEnemy soldiers were as common as friendly\nReceiving medical care at the gentle hands of my best\nA Paladin poured soothing holy water over a deep cut\nAnd the foes pain subsided as they were blessed\n\nThe actual act of healing would still take many weeks\nFarther away a man’s arm had been lost to cannonfire\nTheir amputated limb cauterized by divine blade\nThe pain softened by holy water given without desire\n\nIt was easy to show love to a friend or lover\nMuch harder to show love to a foe\nYet if we were to spread love to the world\nWe would need to mend all wounds, we know"
 flavour_lelanan.14.d2: "I entered the huge tent and looked around\nSo many of the Daughters of Lel running about\nTook in the sight of so many wounded\nPained groans and disciplined orders leaving no doubt\n\nI watched a paladin carry a crate of holy water in\nHanded bottles out to all the others\nThe strangest part of it all, to my surprise\nWas that on our cots weren’t just our mothers\n\nEnemy soldiers were as common as friendly\nReceiving medical care at the gentle hands of Lelanàn’s best\nA Paladin poured soothing holy water over a deep cut\nAnd the foes pain subsided as they were blessed\n\nThe actual act of healing would still take many weeks\nFarther away a man’s arm had been lost to cannonfire\nTheir amputated limb cauterized by divine blade\nThe pain softened by holy water given without desire\n\n“It was easy to show love to a friend or lover\nMuch harder to show love to a foe\nYet if we were to spread love to the world\nWe would need to mend all wounds,” Kyola would say, “that we know”"
 flavour_lelanan.14.a: "Even our Enemies Deserve Her Love"


 flavour_lelanan.80.t: "Aelentiri Ixora"
 flavour_lelanan.80.d1: "“How are the White Flowers faring in Aelantir?”\nI asked Leli as I sat with her one night\nFelana gently humming a soothing song beside us\nSitting beneath the room’s soft light\n\nLeli looked up from her ledger\nHer long hours spent working showing on her face\nAnd as I gently took the book from her hands and set it aside\nShe smiled at me with her usual smile filled with divine grace\n\n“They are doing so much better than I ever could have hoped, Kyola!\nI’m currently recruiting Mihipha to travel to the colony swiftly\nOnce they set up the White Flower Farms there\nWe’ll be producing more Ixora in Aelantir than here; making history!”\n\nI smiled, the shine in her eyes making my heart soar\nGiving her a soft kiss before picking her up in my arms with ease\n“That is exquisite news, my dear. Good enough that you deserve a reward.”\nI set her down on our bed and tucked her in. “Get some rest, Leli, please…”"
 flavour_lelanan.80.d2: "I rubbed my tired eyes and looked over at Leli\nHer face bearing the signs of a weariness even greater than my own.\nWith one hand I closed the ledger before me\nAnd with my other I tenderly rubbed her back as she let out a quiet groan\n\nThe gesture immediately caused her eyes to droop shut\n“My love… Let’s get some rest…” I murmured to her\n“We’ve done enough work for today”\nLeli nodded drowsily, smiling faintly, her speech a slur\n\n“You’re right, you’re right... The flowers will be okay if we rest…”\nI took her hand and guided her to our bed\nBlew out the nearby candles before joining her\n“I’m so proud of you, Leli…” I murmured against her head"
 flavour_lelanan.80.a: "“The flowers that you have planted will grow even while you rest.”"
 flavour_lelanan.80.b: "“And Kyola would be so proud too…”"

 flavour_lelanan.81.t: "Alone Again"
 flavour_lelanan.81.d: "I always knew it would happen one day\nWhen my wives aged faster than me\nMy divine Oath extended my lifespan\nThat much was plain to see\n\nYet as I stood over their old bodies\nI wept like I never had before\nFor my great lovers were gone\nAnd now alone I had to do yet more\n\nEven now they still held hands sweetly\nTheir love deeper than even death\nAnd as I dropped to me knees at their side\nA part of me wished for that one final breath\n\nBut my work was not yet done\nLel’s power still flowed strong through me\nOur Great Matriarch asked for more\nAnd if I didn’t answer, what would I be?\n\nSo I finally left that room\nSpent my nights all alone\nI honoured their deep Love\nAnd built yet more stone by stone"
 flavour_lelanan.81.a: "The Hole Never Goes Away, Only Gets Smaller…"

 magic_project_lelanan_project_1.0.t: "To Share the Gift of Life"
 magic_project_lelanan_project_1.0.d: "To Share the Gift of Life"
 magic_project_lelanan_project_1.0.a: "To Share the Gift of Life"

 magic_project_lelanan_project_1.1.t: "Pursuit of Blessings"
 magic_project_lelanan_project_1.1.d: "A myriad of new relationships, each a blessing upon us all\nAll shapes and sizes and genders, surrounding us like a comforting shawl\n\nBut we cannot deny the issue, Lel asks we all create life\nBut these relationships bear no children, no matter the husband or wife\n\nThe Mihipha have come forth, with a deeply ambitious plan\nTo allow all to create life together, no matter dwarf or troll, woman or man\n\nFirst we shall dive our annals, sort out our own knowledge\nMayhaps our greatest institutions will help, the Mihipha or their college\n\nNext we seek the Lizardfolk, whether foreign or abroad\nTheir eggs are truly wondrous, a miracle by which we are awed\n\nThen the half-races existing, testaments to our divine mission\nLet us find somewhere they are free, and make our own addition\n\nThe Magisterium is vaunted, the Old Damenath vaults renowned\nAnd if they deny our access still, there is always something else to be found\n\nHaless is a land of mystics, of secrets most profane\nWhether migrants of natives still, let us not shy from the arcane\n\nOnce knowledge is collected, no secret left alone\nDamestear will be needed, others or our own\n\nThen we hope dearly, our achievement will ring out\nFor our love for all the world, will never again be in doubt"
 magic_project_lelanan_project_1.1.a: "Let us collect knowledge from across Halann!"

 magic_project_lelanan_project_1.2.t: "Our Own Knowledge"
 magic_project_lelanan_project_1.2.d: "A book, a letter, a song\nA record, a carving, a spell\nOur very own Mihipha\nSo much knowledge they can tell\n\nThey gather at the college\nThe first and greatest assembly\nTransmutation is the answer!\nWhat other way could there be?\n\nThe agreement is unanimous\nTomes studied, copied, learned\nTo succeed in our holy mission\nInto minds the knowledge burned"
 magic_project_lelanan_project_1.2.a: "We Will Have to Travel Abroad!"
 magic_project_lelanan_project_1.2.b: "Our Own Mihipha Are Well Versed!"
 magic_project_lelanan_project_1.2.c: "The College Holds What We Need!"

 magic_project_lelanan_project_1.3.t: "Approaching the Lizardfolk"
 magic_project_lelanan_project_1.3.d: "And egg holds boundless potential\nThe lizardfolk know this well\nSo we seek their novel knowledge\nThe distinctions they can tell\n\nThey say heat can change their sex\nSuch a simple mechanic\nWhat can we learn from this matter?\nWill this lesson be titanic?\n\nA Priestess of Lel gives her egg\nSo we might learn from it directly\nAnd with the knowledge we learn here\nWe will create this magic correctly"
 magic_project_lelanan_project_1.3.a: "Their Knowledge is Another Piece of Our Puzzle"
 magic_project_lelanan_project_1.3.b: "Our Own Lizardfolk Can Help!"
 magic_project_lelanan_project_1.3.c: "Our Friends to our East Offer Support!"

 magic_project_lelanan_project_1.4.t: "Studying Half-Race Biology"
 magic_project_lelanan_project_1.4.d: "We seek all make life together\nWith some already able\nIt behooves us to ask them\nIf they can contribute to our fable\n\nAn orc and human pairing\nThey answer all our questions\nLet us speak to their young daughter\nEven offer their suggestions\n\nA rare elf hobgoblin couple\nVolunteer with their whole family\nYet we find them to be mules\nNot quite right with their anatomy\n\nBut they’re proof that we can do this\nThat our mission is ordained\nWe must solve the muling problem\nNo longer be restrained"
 magic_project_lelanan_project_1.4.a: "Their Knowledge is Another Piece of Our Puzzle"
 magic_project_lelanan_project_1.4.b: "Let Us Talk To Our Own Peoples!"
 magic_project_lelanan_project_1.4.c: "Our Friends Abroad Offer Support!"

 magic_project_lelanan_project_1.5.t: "Approach the Magisterium"
 magic_project_lelanan_project_1.5.d: "They turn their noses at us\nConsider our mission well beneath\nBut we turn their minds towards us\nGifts upon them we bequeath\n\nTheir vaults are truly endless\nAll Cannor’s knowledge in our hands\nWe pour over tomes and annals\nFor now this sates our demands\n\nOthers eschew their support\nPursue a different path\nThe best part of loving all though\nIs comparing our joint math"
 magic_project_lelanan_project_1.5.a: "Their Knowledge is Another Piece of Our Puzzle"
 magic_project_lelanan_project_1.5.b: "We Can Perform Our Own Research"
 magic_project_lelanan_project_1.5.c: "The Magisterium Accepts Our Request!"

 magic_project_lelanan_project_1.6.t: "The Knowledge of Haless"
 magic_project_lelanan_project_1.6.d: "Haless is a land most arcane\nKnowledge everywhere abound\nEven the spirits whisper secrets\nBy Lel, let them all be found\n\nFrom the mystics of the Xia\nAnd their bodily magic\nTo the Oni in their temples\nAnd their history most tragic\n\nWe shall talk to the Halessi\nShare with them a cup of tea\nHear their explanations\nFor how their magic can be"
 magic_project_lelanan_project_1.6.a: "Their Knowledge is Another Piece of Our Puzzle"
 magic_project_lelanan_project_1.6.b: "Let Us Talk To Our Own Peoples!"
 magic_project_lelanan_project_1.6.c: "Our Friends in Haless Offer Support!"

 magic_project_lelanan_project_1.7.t: "Damestear and Life"
 magic_project_lelanan_project_1.7.d: "The knowledge is assembled\nDeep secrets made so free\nAnd all signs point to one thing\nWithout which our dream cannot be\n\nDamestear is the secret\nThe key to our great miracle\nIt can alter physiology\nTransmutation made empirical\n\nFrom the very stars it comes\nProvidence so divine\nOnce we have secured it\nMotherhood will be mine!"
 magic_project_lelanan_project_1.7.a: "Damestear, as Always, Proves Critical"
 magic_project_lelanan_project_1.7.b: "We Must Import More Damestear From Abroad!"
 magic_project_lelanan_project_1.7.c: "We Can Use Our Own Supply!"

 magic_project_lelanan_project_1.10.t: "Love for All the World!"
 magic_project_lelanan_project_1.10.d1: "The doctors told me not to\nThe mihipha warned of danger\nBut all my life I had wanted\nTo see my baby in a manger\n\nSo I pushed past their objections\nStepped into that old dance\nFaced my gentle friend\nAnd fell into a trance\n\nMonths it took long after\nMagic still subject to time\nWhen I gazed down at my daughter\nI heard a gentle chime\n\nI wept for so long after\nShe looked just like my gone lovers\nMy little darling child\nMy heart finally recovers"
 magic_project_lelanan_project_1.10.d2: "I held Leli’s hands\nAs we danced that sacred dance\nHeartbeats deeply synced up\nBoth us in a great trance\n\nAfterwards we made love\nAnd both felt it deep within us\nKyola’s love was all around\nTelling us not to fuss\n\nMonths it took long after\nMagic still subject to time\nWhen we gazed down at my daughter\nWe heard a gentle chime\n\nWe wept for so long after\nShe looked just like our gone wife\nMy little darling child\nWe finally return to life"
 magic_project_lelanan_project_1.10.d3: "The new dance was ecstatic\nAllowing for all us three\nWe felt the magic in us\nAnd knew this was meant to be\n\nI bore our great child\nDelighted beyond belief\nAfter so many years of fighting\nFinally in my belly grew relief\n\nShe was the strongest of us all\nOur child born of pure love\nWe knew she would do great things\nThe one I had always dreamed of\n\nWe closed our eyes as she played\nOur bodies together curled\nFinally rested our old bones now\nAnd felt Love for All the World!"
 magic_project_lelanan_project_1.10.a: "Let All Know the Gift of Life no Matter Their Love!"


 flavour_lelanan.100.t: "The First Love Poem"
 flavour_lelanan.100.d: "I could hear my father nearby\nMy mind so addled with sickness\nDoor to door he ran between them\nHoping anyone could fix this\n\n“She’s too sick.”\n“She’s a lost cause.”\n“She’ll infect us.”\n“She’s dying.”\n\nNobody even cared to try help us\nSo my father carried me far and wide\nEvery scrap of food went to me as we wandered\nUntil finally Lelanàn found us on its tide\n\nI remember hitting the ground as my father collapsed\nJust as we reached the Great Shrine of Lel\nBut as the priestesses hurried to help us\nHe was far beyond saving even with a spell"
 flavour_lelanan.100.a: "His Love Saved my Life…"

 flavour_lelanan.101.t: "New World, New Love"
 flavour_lelanan.101.d: "Aelantir was a land of great mystery\nBut our mission was perfectly clear\nSo we sailed due straight West\nReached those lands with no fear\n\nBut when our explorers dropped their anchors\nAnd stepped foot on distant shores\nThey stumbled right into a proper city\nThey found houses, even with doors!\n\nThey were greeted with pensive caution\nThe first Halflings the natives had ever seen\nBut one approached the Explorer with joy\nAnd made a great big scene\n\nWe could not understand their language\nBut we knew when one spoke of love\nAnd while the rest looked on in surprise\nOur Explorer just removed their glove\n\nA kiss on the Ruinborn’s hand\nA smile shared between them\nThat was all it took to begin\nThe creation of a world-crossing gem"
 flavour_lelanan.101.a: "Everywhere we go, People Love all the Same"

 flavour_lelanan.102.t: "Love Between Victims"
 flavour_lelanan.102.d: "Not all Love was mundane\nFor Halann was a fraught world\nThe Shadow Curse was our greatest foe\nFor around the Hag’s fists hearts were twisted and curled\n\nYet the Ashanna had discovered a way\nTo shake their deadly bloodlust curse\nAnd when one day they met a shadow troll\nThey knew the poor troll had it even worse\n\nSo they sang a gentle song for them\nAnd the troll felt their heart so calmed\nThey gently took each other’s hands\nTogether their hearts were balmed\n\nBut the Hags tolerated no dissent\nAnd so they fought and ran and fled\nAway from that blighted curse\nFor their love they would be bled\n\nBut they made it to our arms\nAnd we welcomed them in so dearly\nMended their wounds and deep cuts\nAnd found they loved each other so sincerely"
 flavour_lelanan.102.a: "Their Love Freed Them Both"

 flavour_lelanan.103.t: "A Mutual Love of Food"
 flavour_lelanan.103.d: "As with the Halfling and Dunesole Ogre\nNot all Love was romantic in source\nSometimes a mutual Love was all it took\nTo sand down a relationship which starts so coarse\n\nThe Halfling was a renowned chef\nTraveling Sarhal in search of a new ingredient\nBut to the towering desert Ogre\nHe himself was a meal so expedient\n\nBut the Halfling made an offer\nA bargain to save his life\nWith his great cooking skills\nSurely he could find the ogre a wife\n\nNow its been thirty years since\nAnd the two are suspectly both still single\nBut you’ll find them in the Halfling’s restaurant\nAlways willing to mingle"
 flavour_lelanan.103.a: "Lel’s Love Came in Many Forms"

 flavour_lelanan.104.t: "Forbidden Love"
 flavour_lelanan.104.d: "Halann was no so kind as we\nAnd oft Love found opposition\nSuch as when a Harimari Noble fell\nFor someone of much lower condition\n\nShe met that Hobgoblin captain at night\nThey hid away their taboo love\nFor a thousand rules they were breaking\nOrdained by those higher above\n\nBut the flame in their hearts could not die\nAnd it grew till it engulfed their souls\nSo they fled the oppressive systems\nFought their way out of their mutual holes\n\nThey made it all the way to Lelanàn\nArriving one quiet morning in the monsoon rain\nAnd as they held each other’s hands openly\nThey knew: they were free from that pain"
 flavour_lelanan.104.a: "Their Love Was Free to Flourish With Us"

 flavour_lelanan.105.t: "A Love Never Forgotten"
 flavour_lelanan.105.d: "Not all lived so long as those with Elvish blood\nWhich was a blessing so many sought\nYet it was so easy for us to imagine\nHow such a lifespan could end up quite fraught\n\nAs we built up ties with the elves of Cannor\nSo many had tales they wished to share\nAnd they traveled down to Lelanàn\nSeeking help with their deep despair\n\nFor an Elf who loved another\nTheir lifespan could become a curse\nAs they watched their companions die\nWhat fate could be any worse?\n\nSo we carefully recorded their stories\nHelped them preserve the love they had lost\nAnd as they shared their past with others\nFrom their hearts melted that cold frost"
 flavour_lelanan.105.a: "Time Did Not Treat All Love Fairly"

 flavour_lelanan.106.t: "Love Amongst Ashes"
 flavour_lelanan.106.d: "Collecting Tales from Escann was a difficult task\nThe hatred between them running so deep\nBut as we wandered that war-torn land\nWe found four strange people tending their sheep\n\nA Goblin, Orc, Human, and someone inbetween\nSuch a peculiar sight together they did make\nBut as we approached them for their story\nTruly, it was impossible for us to make a mistake\n\nThey told us of their village\nWhere the victims of the Greentide hid\nThey found comfort in each other\nAnd eventually, share love they did\n\nBut they were hated for their tolerance\nChased from their homes by an angry mob\nNow they wander below the Serpentspine\nUnable to find a single job\n\nSo we brought them back to Lelanàn\nWhere they found their final place\nAnd as they settled down for good\nThey were a beautiful mixture of race"
 flavour_lelanan.106.a: "They Were Welcomed Here With Open Hearts"

 flavour_lelanan.107.t: "Small hearts, Big Love"
 flavour_lelanan.107.d: "They did not always love each other so\nIn fact it started with a collapsing home\nShe tried to evict the annoying Kobold\nHe tried to blow up the blasted Gnome\n\nBut as they fought and tangled and competed\nThey found a fondness within another\nAnd in time their anger softened\nEven if sometimes they still hated each other\n\nBut their romance was a deep taboo\nTheir biologies completely not a match\nAnd when they were discovered one day\nTheir joint work was dumped down the hatch\n\nSo they followed the artificer tradition\nAnd fled to where they could be free\nHeld one another as they got on a boat\nAnd came to us across the great big sea\n\nTheir teams of companions came with them\nAnd now they run the Lelanàn workshop\nBut you won’t find them there\nYou’ll find them admiring a raindrop"
 flavour_lelanan.107.a: "Love was Love, no Matter Our Differences"

 flavour_lelanan.108.t: "An Unlikely Loving Couple"
 flavour_lelanan.108.d: "It started in the strangest way\nA Harpy capturing a Gnoll after battle\nBut the weirdest thing occurred after\nDespite Gnolls usually being labour cattle\n\nAs the two spent years together\nThey grew too close to resist\nAnd finally one day as they rested\nThey Harpy approached and they kissed\n\nBut Gnolls are incompatible mates\nAny Harpy worth their salt knows this\nSo the Roost exiled both of them\nDenied them their newfound bliss\n\nThey wandered together in search of a home\nBut for two ‘monsters’ the world is a cold place\nUntil finally they heard of Lelanàn\nAnd thought just maybe they could make their case\n\nYou can find them in the Northern district\nAlways happy to talk about their tale\nJust remember to why they’re there\nAnd share with them a cup of ale"
 flavour_lelanan.108.a: "How could we Not Admire Such Love?"

 flavour_lelanan.109.t: "Forbidden Plains, Forbidden love"
 flavour_lelanan.109.d: "When they first met in battle it was random\nWhen they met the second time it was chance\nWhen they met the third time it was fate\nAnd by the fourth? They knew their dance\n\nThey were both battlefield medics\nPassing each other as they tended the hurt\nUntil one day the Centaur was injured\nAnd the Human approached and tore their shirt\n\nThey crossed the line that day\nAs they looked in each other’s eyes\nAnd ever since that moment\nCompletely changed their lives\n\nFar away they fled\nTheir love so deeply forbidden\nNone would know their story\nWhich they fought to keep well hidden\n\nUntil they found themselves in Lelanàn\nHaving crossed the world to be free\nAnd if you wish to talk to them\nRemember: the Centaur likes tea."
 flavour_lelanan.109.a: "With us Their Love Finally Found Acceptance"

 flavour_lelanan.110.t: "A Love Older Than Most"
 flavour_lelanan.110.d: "Some Tales came to us themselves\nSuch with the Dwarf and the Elf mages\nWhen approached and asked to help\nThey agreed to put their story on our pages\n\nThey had both worked for the Magisterium\nKeeping their work and love apart\nBut as their love crossed a century old\nThey decided a new course to chart\n\nThey retired all the way in Lelanàn\nArriving hand-in-hand\nAnd now they teach at the Mihipha College\nTheir love no longer banned\n\nTheir students say they are quite funny\nThe duo enjoying their positions\nBut while the Elf is quite relaxed now\nDon’t ask the Dwarf about their ambitions"
 flavour_lelanan.110.a: "Their Love is an Example to us All!"

 flavour_lelanan.111.t: "Love is Like Magnets"
 flavour_lelanan.111.d: "Infinite demand, but finite Damestear\nThat was the Mage-Artificer Paradox\nYet Love is made and given freely\nEven between those trapped inside the box\n\nThe Mage was ambitious, seeking to master the world\nThe Artificer was content, seeking to soften life\nYet their two sides were ever at each other’s throats\nTheir fields constantly filled with strife\n\nBut the two shared an idea\nAnd their cooperation started\nIt blossomed into a great vision\nAnd the two could never be parted\n\nEven as their friends bickered and fought\nThey worked ever on\nTheir dream bringing them together\nAs they stayed up together until dawn\n\nBy sharing their split resources\nThey forged something new\nAn example to us all\nAnd a gift for Lel’s chosen few"
 flavour_lelanan.111.a: "While their Compatriots Fought, They Could Only Love"

 flavour_lelanan.112.t: "The Tides of Love"
 flavour_lelanan.112.d: "Their meeting was pure chance\nA Captain falling into the stormy sea\nAs a Merfolk was swimming by\nThe accident they did see\n\nThe Captain was stranded in the water\nTheir ship continuing until it was gone\nSo the Merfolk helped them get to shore\nAnd they talked on and on\n\nThey shared a great deal more in common\nThan one would ever expect\nAnd even once the Captain was rescued\nEvery year they came back and checked\n\nThey would sit in the shallows then\nHold each other in their arms\nBut there was nowhere they could share\nNowhere they could indulge in each other’s charms\n\nBut when the Ocean Ananoma was complete\nThey both rushed to ask each other\nAnd now they live on the fourteenth pier\nAlong with the Merfolk’s mother."
 flavour_lelanan.112.a: "The Ocean Ananoma Brought Them Together!"

 flavour_lelanan.113.t: "A Strange love"
 flavour_lelanan.113.d: "The Fey are a very beautiful force\nEphemeral and powerful and aloof\nUninvolved with the world\nSometimes they change, though\n\nThey start writing love poems\nDelivering them to the doorstep of nosy mages\nTalking about their gorgeous elven lover\nAnd the Deepwoods from which they came\n\nThe Archfey were not pleased\nThat they would fall in love with a mere elf\nSo the Fey hero valiantly defended their lover\nBut tragically, was forced to swiftly flee\n\nThey conjured an old connection\nEmerged so far to the South\nBut their lover had made it with them\nAnd the weird Island Halflings nearby seemed safe\n\nSo I thank you for giving us a home\nAnd protecting us if the Archfey try to destroy our love\nIn return I have attached some notes on magic\nAnd will always brag about my lover if you wish"
 flavour_lelanan.113.a: "Love is Love, Even if we do Not Understand"

 flavour_lelanan.114.t: "Can Love be Built?"
 flavour_lelanan.114.d: "When our first Homonculus was completed\nDeep questions immediately arose\nAnd as they spoke and expressed thought\nEven our best philosophers froze\n\nCan an artificial life feel Love?\nCan it feel anything at all?\nWhere do we draw the line?\nWhere do we build that wall?\nWhen a cat greets the return of its caretaker\nIs that not an expression of Love?\nWhen a dog is excited for its caretaker waking\nIs that not an expression of Love?\n\nWhy should we not extend Love to all of Lel’s Life?\nWhy should we draw lines where none exist?\nCan not the Homonculus think?\nDoes its existence not persist?\n\nLel holds the creation of Life through Love\nAbove all else in her portfolio\nAnd did not the Mihipha pour Love\nAs this Life they did grow?"
 flavour_lelanan.114.a: "Can we Judge if They Can Love?"

 flavour_lelanan.115.t: "To Love a Paladin"
 flavour_lelanan.115.d: "“We travel with our mother everywhere\nHer mission divinely ordained\nEven as the moving is difficult\nWe could be no better trained”\n\n“My wife is a mighty woman\nI could never be more proud\nI clean her armour and weapons\nSo with the kids she can be so loud”\n\n“Mom is the coolest paladin ever\nLike a hero from a bedtime story\nSo when I grow up one day soon\nI, too, will earn great glory!”\n\nThey were the family of a paladin\nTheir lives rife with worry and stress\nYet in them she found great strength\nAnd their small wounds she would bless\n\nI thought of Leli and Kyola\nHow our own small family was the same\nThose long nights we spend together\nAre the source of a Paladin’s flame"
 flavour_lelanan.115.a: "A Paladin is Their Family"

 flavour_lelanan.116.t: "A Love Most Alien"
 flavour_lelanan.116.d: "A family of new arrivals\nCame from so far to the East\nTraveled from beyond the ocean\nCould not quite partake in our feast\n\nA dozen of them there were\nStrangely elven in design\nNeither eat nor sleep nor breath\nWith hearts that were most benign\n\nCommunication was fraught\nYet we never lost our hope\nAnd eventually they explained\nThey were much more than a homunculus trope\n\nA great big family they were\nEven without the need to produce life\nAnd together they had survived\nEndured Insyaa’s deadly strife\n\nWe presented a gift for their stories\nAs they settled in right very quick\nSomething that reminded us of them\nAn Everburning Candlestick"
 flavour_lelanan.116.a: "They Weren't so Different, Them and us"

 flavour_lelanan.117.t: "The Love of Storytelling"
 flavour_lelanan.117.d: "Hello, o’ gentle reader\nI just wanted to thank you\nFor listening to my story\nAnd building something new\n\nI have always loved stories\nAnd Anbennar has so many\nSo I am proud to humbly add\nMy own to this lovely tapestry\n\nI hope you enjoyed the experience\nAnd had fun spreading much Love\nI hope to tell more stories one day\nBut for now, I am proud of this one\n\nHave a good day!\nEnjoy a swell cup of Water\nAppreciate the wonder of Life\nAnd most of all: live with Love"
 flavour_lelanan.117.a: "Thank you! <3"


