 mechanim_formable_desc_custom_tooltip_null: "You cannot settle in this region, travel further to find permanent settlement"
 mechanim_formable_desc_custom_tooltip_kiretua: "From the shores of the Fingers, we gaze to the sea, and contemplate founding §GKiretua§!. Because we will sail those seas, the ones nearby and ones ever so far beyond. And when we have sailed every sea, we will sail the planes, or perhaps even the gaps beyond the stars."
 mechanim_formable_desc_custom_tooltip_rangitema: "We have learned of our past, and all its horrors. All the suffering visited upon us, and all those who lived in this land. We will take up the mantle of §GRangitema§! with one quest: The Kiamoa Must Not Fall."
 mechanim_formable_desc_custom_tooltip_anahira: "These lands are well-suited to be explored by Soarer Mechanim, and they have come to form a large number of our tribe. One in particular calls themself the Canary King, and he has a vision: to settle the city of §GAnahira§! at the top of the mountain nearby, where all Mechanim might come and learn to fly."
 mechanim_formable_desc_custom_tooltip_pa_aroha: "Here, close to a Gene Pillar that birthed horrors, we will bring love. In the city-state of §GPa-Aroha§!, all mechanim can explore art, themselves, and each other. And perhaps, one day, we might find the one who inspires us: The Poet."
 mechanim_formable_desc_custom_tooltip_rakauma: "We will not settle. We will not impose our will on the Hinuiforest, nor carve a niche in it. No -- we will wander it, and learn from it. We will tame the hinuifauna, we will live in harmony with the land, and we will thrive as §GRakauma§!."
 mechanim_formable_desc_custom_tooltip_taikatanga: "Though we remember little of our pasts, when we look on Kanolowele, all we can see is decay. Bickering, where once there was unity. Wars, where once there was peace. Disagreement, where once there was consensus. Perhaps as §GTaikatanga§!, we can restore the old -- and we will not do it alone."
 mechanim_formable_desc_custom_tooltip_motu_ahi: "According to all laws of magic, there is no way a mechanim could ever use a spell. Our bodies are inorganic and as such are incapable of conjuration. But we don't care about what we've been told is impossible, and as §GMotu-Ahi§!, we will find a way. Those volcanoes are ever so inspiring..."
 mechanim_formable_desc_custom_tooltip_wairuakore: "We have learned of the Infinite Self, and we know it does not include us. But that does not mean we do not have a purpose in this world. We will found §GWairuakore§!, and seek to support the Infinite Self, and ensure those who make it up can prosper under our care."
 mechanim_formable_desc_custom_tooltip_i_numbe: "We will take the first step on the path Golodh sees. We will form §RI-Numbe§!, the Foundation, and the purification of Insyaa will begin."
 mechanim_formable_desc_custom_tooltip_haeta: "The hinuijungle is a terrifying place, but we have learned to like danger. To track great beasts, hunt them down, and bring the giants down. When we gather as §GHaeta§!, we will take on an even greater quest: to kill a Holohana."
 mechanim_formable_desc_custom_tooltip_kaikoura: "We arrived this land, and discovered the Hinuiprawns. Immediately we thought: how can we ride them, and what could we hunt on Hinuiprawnback? We must immediately pursue this with all our efforts; forming §GKaikoura§! is but the start."
 mechanim_formable_desc_custom_tooltip_tokara: "Amidst this desolate land, we will found §GToka'ra§!, and seek to build it into a paradise."
 mechanim_formable_desc_custom_tooltip_tiauna: "We have learned from the Yenbenmirra. We have learned from the Charkuchin. And now, we -- the children of fire -- have something to say. In §GTiauna§!, we will form a great union, and build a civilization that human, mechanim, and kobold each call their own."
 mechanim_formable_desc_custom_tooltip_maniakoura: "The golden plains here inspire us to form §GManiakoura§!, where self-augmentation is the ultimate art form."
