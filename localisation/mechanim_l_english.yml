 mechanim_start_event_tt: "Your travels to learn of your people and history will send you across all Insyaa. Do not expect to stay in one place for long.\nAvoid the §RHolohana§!, as they will end your travels prematurely.\nYou must visit §Y5 Gene Pillars§! before you can finally learn your history and §Ysettle§! into a §Ynation§!, but the more you explore, the more you will learn and benefit...\nThe lessons we learn will shape:"
 can_form_mechanim_nation_tt: "You have visited at least §Y5 Gene Pillars§! and learned of your past (Currently: [Root.mechanim_progress_level.GetValue])"

 mechanim_advancement_tooltip: "[Root.mechanim_advancement_custom_loc_tt]"

 mechanim_advancement_custom_loc_level_0: "Gain §G100§! §YCrowns§!"
 mechanim_advancement_custom_loc_level_1: "Gain §G25§! of each §YMana Point§!"
