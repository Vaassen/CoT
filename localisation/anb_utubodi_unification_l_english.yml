 utubodi_unification.0.t:0 "Utubodi mechanics"
 utubodi_unification.0.d:0 "Who are we? The Utubodi! What do we want? Kakunor! When do we want it? NOW!"
 utubodi_unification.0.a:0 "We want Kakunor!"
 utubodi_unification.0.b:0 "Oh shit, that's us!"

 utubodi_unification.1.t:0 "We got Kakunor"
 utubodi_unification.1.d:0 "Kakunor is ours now."
 utubodi_unification.1.a:0 "Cool."

 utubodi_unification.2.t:0 "Collapsed Scaffold"
 utubodi_unification.2.d:0 "Early in construction, a major scaffold collapses."
 utubodi_unification.2.a:0 ""Double the shifts. We finish no matter the cost.""
 utubodi_unification.2.b:0 ""Take time to train the workers. No more blood for stone.""

 utubodi_unification.3.t:0 "Vision of the Old Ways"
 utubodi_unification.3.d:0 "Workers uncover ancient engravings hinting at forgotten techniques."
 utubodi_unification.3.a:0 ""Ignore superstitions. Use our own plans.""
 utubodi_unification.3.b:0 ""Inscribe the teachings. Adapt the design.""


