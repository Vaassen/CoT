 # MODIFIERS
 W37_secured_flank:0 "Secured Flanks"
 desc_W37_secured_flank:0 "Our enemies no longer threaten the passes behind us. The warbands can rest secure in the knowledge that their homes are defended."
 W37_troll_dens:0 "Troll Dens"
 desc_W37_troll_dens:0 "Troll families occupy the caves and hollows overlooking these roads. Travellers pay for passage, while invaders must contend with the inhabitants."
 W37_rapid_advancement:0 "Rapid Reorganisation"
 desc_W37_rapid_advancement:0 "New drills and unfamiliar formations have unsettled the warbands. Our military reforms will take time to become second nature."
 W37_troll_envoys:0 "Troll Envoys"
 desc_W37_troll_envoys:0 "Arrangements with Garnettoof's envoys help the faithful maintain the fortifications that shelter their shared beliefs."
 W37_troll_lairs:0 "Troll Lairs"
 desc_W37_troll_lairs:0 "Permanent lairs gather families, workshops and toll collectors around the mountain roads. Every winding trail has its watchful keeper."
 W37_troll_traps:0 "Troll Traps"
 desc_W37_troll_traps:0 "Concealed pits, false trails and ambush sites turn the passes into a maze of dangers for those who enter without permission."
 W37_troll_attrition:0 "Troll Traps"
 desc_W37_troll_attrition:0 "Concealed pits, false trails and ambush sites turn the passes into a maze of dangers for those who enter without permission."
 W37_troll_towers:0 "Troll Towers"
 desc_W37_troll_towers:0 "Stout towers overlook growing settlements along the passes. Their protection draws craftsmen, traders and faithful families to the mountains."
 W37_spread_the_light:0 "Spread the Light"
 desc_W37_spread_the_light:0 "Settlers and priests venture into the darkness together, carrying the Old Sun's teachings into new communities."
 W37_taxing_metals:0 "Troll Toll: Metals"
 desc_W37_taxing_metals:0 "A share of every metal caravan fills our coffers and supplies the workshops that equip our warbands and settlements."
 W37_taxing_wool:0 "Troll Toll: Wool"
 desc_W37_taxing_wool:0 "The wool merchants pay their dues in coin and warm cloth. Our travellers are better prepared for the mountain roads."
 W37_taxing_gold:0 "Troll Toll: Gold"
 desc_W37_taxing_gold:0 "Gold passing through our mountains leaves a generous contribution behind. Its gleam adorns the halls of our rulers and temples."
 W37_taxing_rare_goods:0 "Troll Toll: Rare Goods"
 desc_W37_taxing_rare_goods:0 "Precious cargo attracts the attention of our toll keepers. Exotic wares enrich our markets and reward the merchants who trade under our protection."
 W37_taxing_livestock:0 "Troll Toll: Livestock"
 desc_W37_taxing_livestock:0 "The drovers surrender a share of their herds at the passes. Well-stocked provisions sustain those who travel through our lands."
 W37_taxing_slaves:0 "Troll Toll: Slaves"
 desc_W37_taxing_slaves:0 "Dues from slave caravans enrich the priesthood and finance its missionaries. Outsiders regard this arrangement with suspicion and contempt."
 W37_taxing_wood:0 "Troll Toll: Timber"
 desc_W37_taxing_wood:0 "Timber merchants contribute sound beams and seasoned planks alongside their coin. Our builders put these supplies to good use."
 W37_taxing_fur:0 "Troll Toll: Furs"
 desc_W37_taxing_fur:0 "Fine pelts arrive as payment for safe passage. Their sale enriches the treasury, while the finest adorn our most honoured figures."
 W37_magical_longevity:0 "Magical Longevity"
 desc_W37_magical_longevity:0 "Ancient wards and carefully studied omens preserve our ruler's vitality. Their practice deepens the magical learning of the faithful."
 W37_crushed_jaher:0 "Jaher's Legacy Humbled"
 desc_W37_crushed_jaher:0 "The champions of the New Sun have been humbled. Our shared triumph restores the standing of those who kept the Old Faith."
 W37_zealots_triumphant:0 "Zealots Triumphant"
 desc_W37_zealots_triumphant:0 "Victory has vindicated the faithful. The warbands march with renewed conviction that the Old Sun watches over them."
 W37_troll_cities:0 "Troll Cities"
 desc_W37_troll_cities:0 "Once scattered dens have become thriving cities. Markets, workshops and temples flourish beneath the towers of the mountain passes."
 W37_devoted_zealots:0 "Devoted Zealots"
 desc_W37_devoted_zealots:0 "The faithful cling fiercely to the Old Sun. They resist conversion and allow little room for those who challenge their beliefs."
 the_warded_gate_W37:0 "The Warded Gate"
 desc_the_warded_gate_W37:0 "Wards protect the gate overlooking the woods. Its guardians stand watch where the light of the mountains meets the shadows beneath the trees."
 the_warded_gate_two_W37:0 "The Sunward Gate"
 desc_the_warded_gate_two_W37:0 "Renewed wards shine over the gate. It stands as a lasting bulwark of the Old Faith above the shadowed woods."

 # DECISIONS
 cot_X51_tunnel_travel_title:0 "Traverse the Hidden Tunnel"
 cot_X51_tunnel_travel_desc:0 "Send §Y10 infantry regiments§! from §Y$PROV632$§! through the hidden tunnel to §Y$PROV4227$§!. The passage can accommodate infantry only."
 cot_W37_the_troll_toll_title:0 "Collect the Troll Toll"
 cot_W37_the_troll_toll_desc:0 "Claim our share of the commerce passing through the mountains. Choose a category of goods to tax, granting a §Y10-year§! benefit. An expanded toll also provides an immediate payment."
 cot_X51_tunnel_travel_back_title:0 "Return Through the Tunnel"
 cot_X51_tunnel_travel_back_desc:0 "Send §Y10 infantry regiments§! from §Y$PROV4227$§! through the hidden tunnel to §Y$PROV632$§!. The passage can accommodate infantry only."
