 L68_fools_all_of_them_qarsi_abeesoonyinka_tt:0 "§YKarassk§! or a §YSubject Of Karasssk§! owns §YQarsi Abeesoonyinka§!, or Karassk has a §YSize 50 Spynetwork§!, 25 if Karassk has a §YDiplomat, Spymaster or Statesman§! employed, and has §YMilitary Access§! in the §YOwners Of Qarsi Abeesoonyinka§! or §YOverlord Of The Owner Of Qarsi Abeesoonyinka.§!"
 L68_more_modest_amount_effect_tt:0 "§YOverreliance on Mercenaries§! gets §G+10%§! §YNational Manpower Modifer§! and §G-5%§! §YMercenary Cost§!, but looses §R-5%§! §YMercenary Maintenance§! and §R+5%§! §YMercenary Manpower§!, and now §RCannot be Revoked.§!"
