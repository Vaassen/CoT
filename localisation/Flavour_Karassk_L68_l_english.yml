 L68_a_matter_of_courage_tt:0 "Karassk is the strongest Trade Power in the §YAdzalaz Gulf§!, §YSea Of Lel§! and §YClovesight§ Trade Nodes§!, has §Y20 Light Ships§! in any §YProvince§! belong to each of the §YTrade Nodes§!, ie 20 Ligth Ships in Adzalaz Gulf then 20 Light Ships in Sea of Lel etc."
