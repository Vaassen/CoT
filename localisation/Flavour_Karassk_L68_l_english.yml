 #estate prviledges 
 estate_burghers_khair_families_our_land:0 "Khair Families - Our Land" 
 estate_burghers_khair_families_our_land_desc:0 "While humans working our land is nothing new its clear the Khair have much more insight on how to properly manage the humans doing so. With the various familes being responsible for not only making sure that the humans that live among us our as productive as ever, especailly along the coasts, in our land. But also, the humans are aware of where they are and are not wanted."
 estate_burghers_khair_families_our_land_non_cult_tt:0 "§YHuman Minorities§! on §YCoastal Land§! will give out §Y7.5%/15%/7.5% Goods prodcued§! depending on if they are §ROppressed§!/§GCoexisting§!/§MIntegrated§!; when having §YRacial Tolerance§! change from one major postion to another it will take up to a §YYear to refect these changes.§!"
 estate_burghers_khair_families_our_land_cult_tt:0 "§YHuman Majority§! provinces will have §Y15%/33%/15%§! cheaper §YCultural Conversion Cost§! and faster §YCultural Conversion Speed§!  depending on if they are §ROppressed§!/§GCoexisting§!/§MIntegrated§!; when having §YRacial Tolerance§! change from one major postion to another it will take up to a §YYear to refect these changes.§!\n\n§YHuman Provinces§! that are §YCulturly§! Converted will grant a random non-human province a §YLarge Human Minority.§!"

 estate_burghers_khair_families_the_right_to_teach:0 "Khair Families - The Right To Teach "
 estate_burghers_khair_families_the_right_to_teach_desc:0 "Having also gone through a simular education the Khair are best suited for the teaching of other humans that now find themselves in our empire. Through hard work shall they be molded to our needs."
 estate_burghers_khair_families_the_right_to_teach_tt:0 "§YHuman Majorites And Minorities§! provinces will have §Y7.5%/15%/7.5%§! less §YBuilding Cost§! and faster §YBuilding Time§!  depending on if they are §ROppressed§!/§GCoexisting§!/§MIntegrated§!; when having §YRacial Tolerance§! change from one major postion to another it will take up to a §YYear to refect these changes.§!\n\n§YCannot Purge Or Expell Humans.§!"

 estate_burghers_khair_families_iysashlagila_management:0 "Khair Families - Iysashlagila Management"
 estate_burghers_khair_families_iysashlagila_management_desc:0 "Simular to the army the various humans are now given the right in order to serve the rest of the empire in its campaigns. The Khair Families over see this process organizing and equiping the various humans into their own regimensts and armies, drilling them with the knowlegde they need to protect the regular amry no matter their own costs."
 estate_burghers_khair_families_iysashlagila_management_tt:0 "§YHuman Majority§! provinces will have §R-50%§! Local Manpower Modifer this will not change with changing §YRacial Tolerance§!.\n\n§YHuman Majorites And Minorities§! will give §Y0.15/0.33/0.15§! Land Forcelimit  depending on if they are §ROppressed§!/§GCoexisting§!/§MIntegrated§!; when having §YRacial Tolerance§! change from one major postion to another it will take up to a §YYear to refect these changes.§!\n\nWill unlock a §GIysashlagila§! Mercenary Company for every §Y250 Human Majority Development§! up to §YFour§!."
 estate_burghers_khair_families_iysashlagila_management_merccoexp_tt:0 "With §GCoexisting§! §YRacial Tolerance§!"
 estate_burghers_khair_families_iysashlagila_management_mercco_tt:0 "§G+66%§! Mercenary Manpower, §G-66%§! Mercenary Cost, §G+5%§! Mercenary Discipline"
 estate_burghers_khair_families_iysashlagila_management_mercnotcoexp_tt:0 " With §ROppressed§!/§MIntegrated§!"
 estate_burghers_khair_families_iysashlagila_management_mercnotco_tt:0 "§G+33%§! Mercenary Manpower, §G-33%§! Mercenary Cost, §G+2.5%§! Mercenary Discipline"

 estate_burghers_khair_families_human_ships_halfling_sailors:0 "Khair Families - Humans Ships, Halfling Sailors"
 estate_burghers_khair_families_human_ships_halfling_sailors_desc:0 "While humans for centiures have served in the navy, in particular on Khair fleets, its clear this was always an akward sistuation. However with all of Fahvanosy in controll of the emprie the Khair do not need to steep so low, and  have their private ships crewed by halfings. This boon is even larger then it at first seems as now the humans that would have been made to sail and interact with mercantile endevors they would not understand can now build the ships that they would other wise waste time on."
 estate_burghers_khair_families_human_ships_halfling_sailors_tt:0 "§YHuman Majority§! provinces will have §R-50%§! §YLocal Trade Power§! this will not change with changing §YRacial Tolerance§!.\n\n§YHuman Majorites§! will give §Y1/2/1§! Naval Forcelimit depending on if they are §ROppressed§!/§GCoexisting§!/§MIntegrated§!; when having §YRacial Tolerance§! change from one major postion to another it will take up to a §YYear to refect these changes.§!\n\n§YHuman Minorities§! will give out §Y0.25§! Naval Forcelimit.\n\nMax Flagships and Global Ship Trade Power is doubled at §GCoexisting.§!"

 estate_nobility_imperial_fisheries:0 "Imperial Fisheries"
 estate_nobility_imperial_fisheries_desc:0 "The Sea of Karassk since time immemorial has bee home to wide varity of aquatic life. The most important to the kingdom have been the great sharks that prowel it depths. For centuries the gifts provided by the goddess have been used to raise these sharks, and other time bread them into the perfect beast of war. The Ankashyi have been the most involed in this process, producing not only the most best of sharks but the best of handlers."
 estate_nobility_imperial_fisheries_tt:0 "§YDocks Or Drydocks§! built surrounding the §YSea Of Karassk§! will allow for the recruitment of §YSea Beasts§! in those provinces."
