 #goverment
 karassk_laushan_city:0 "Laushan City"
 karassk_laushan_city_desc:0 "Laushan City was orginally a project set up the Godseeker dynasty, orignally meant as a place to keep the various vassals and visitors to the empire. As it has floated off the shore in the Sea Of Karassk it grew eventually becoming an essentialy independent settlement, now the majority of vessels making up the city become under control of the Emperor. Now the city sails the open seas, pulled by giant sharks, the ships keeping settlers, administrators, and dragoons. It sails flying the red and black sails to directly interveen on the Emperors behalf while Karassk remains the seat of imperial power."
 karassk_laushan_city_idzarshin_tribgov_tt:0 "Uses unique §YTributaries§! type called §YIdzarshins§!. When forcing a nation to become a §YTributary§! in a §YPeace Deal§! will become a §YIdzarshin§! instead."
 karassk_laushan_city_capital_movett:0 "Uses unique §YTributaries§! type called §YIdzarshins§!. When forcing a nation to become a §YTributary§! in a §YPeace Deal§! will become a §YIdzarshin§! instead.\n\nIf §YKarassk§! is not the §YCapital§! it will gain §YThe First Seat§! modifier granting §G-100%§! §YGoverning Cost AND Local Autonomy§! and §G-33%§! §YLocal Development Cost.§!\n\n On moving the §YCapital§! to a §YCoastal Province§! will grant §G-33%§! §YCultural Conversion Cost And Time§!, §G-30§! §YYears Local Seperatism§!, §G-0.10§! §YMonthly Autonomy§!, §G+100%§! §YLocal Sailors§!, and §G+66%§! §YLocal Goods Produced§! to the §YArea§! it is moved to for §YFive Years.§! Can only move §YCapital§! every §YFive Years.§!"
 
