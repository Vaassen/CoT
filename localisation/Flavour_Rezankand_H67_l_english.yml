 #Tooltips
 rezankand_our_long_lost_brothers_tt:0 "We will establish Frontiers in §YUor'ví§! and §YMoimoiksul§!"
 rezankand_sixth_age_of_the_sea_tt:0 "We will establish Frontiers in §YNur Elizna§!, §YAisuaisu§!, and §YAisukesthi§!."
 rezankand_troll_elves_tt:0 "We will establish Frontiers in the §YJunglemouth§! area."
 rezankand_jahers_duty_tooltip:0 "Won §Y20§! battles against Taychendi countries. (currently §YNumRezankandJahersDuty§!/20)"
 rezankand_first_clash_tooltip:0 "Won §Y10§! battles against Ameion. (currently §YNumRezankandFirstClash§!/10)"
 rezankand_first_clash_manpower_tt:0 "If we won §Y10§! battles against Ameion, gain:\n"
 rezankand_first_clash_modifier_tt:0 "\nIf we won §Y15§! battles against Ameion, gain:\n"
 rezankand_first_clash_battles_tt:0 "If we won §Y20§! battles against Ameion, gain:\n\n§GWe won't lose the §YOrenkoraim§!, §YRoyakkotar§! and §YUesrennu§! areas after completing §YDispel the Dark§!.§!"
 rezankand_first_clash_ameion_defeat_tt:0 "\nIf Ameion doesn't own any provinces in Taychend, gain:\n\n§GWe won't lose the §YSibisimra§! and §YVul Tenvach§! areas after completing §YDispel the Dark§!.§!\n"
 rezankand_new_exemplars_tt:0 "After completing §YLand of Sunlight§! we will lose the modifier and gain access to the §YRuinborn Exemplars§! Clergy privilege.\nLose access to the §YEstablish New World Missions§! privilege."
 rezankand_dispel_the_dark_tt:0 "§RWe will abandon our holdings in Taychend. Our impact in the region will be greater the more slave producing provinces we own.§!"
 rezankand_dispel_the_dark_bonus_tt:0 "Because we own §Y8§! §YSlave§! provinces or §YOren Nariyu§! provinces, we will gain the following bonuses:"
 rezankand_dispel_the_dark_dev_bonus_tt:0 "We will gain §G10§! random development in our owned provinces in the §YDry Coast Region§! per §YSlave§! provinces owned ([Root.rezankand_slave_provinces.GetValue])"
 rezankand_dispel_the_dark_colony_bonus_tt:0 "We will create 2 §YFrontiers§! in the §YDry Coast Region§! per §YSlave§! provinces owned ([Root.rezankand_slave_provinces.GetValue])"
 rezankand_dry_coast_tt:0 "Every owned province in the §YDry Coast Region§! will get §G1§! base tax, if it is §YProsperous§! gain §G2§! instead"
 rezankand_trapped_in_shadows_tt:0 "Start the §YIncident Trapped in Shadows.§!"
 
