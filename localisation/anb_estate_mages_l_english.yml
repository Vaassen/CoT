 estate_mages:0 "Mages"
 estate_mages_desc:0 "This estate represents the organized magical population of the country, where it be guilds, schools or state-run institutions. Mages are capable of wielding great spells and powers that any wise ruler would make use of, with care, of course.\n\n§TMages can §YCast Spells§! for the country, but this requires a minimum amount of §Y15%§! £estate_influence£ to do so. The higher the £estate_influence£, the §Ystronger or longer§! their spells will be, at §g(0 - 33) (33 - 66) (66 - 100)§! £estate_influence£ respectively.§!"
