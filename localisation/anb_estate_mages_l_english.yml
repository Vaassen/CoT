 estate_acolytes:0 "Acolytes"
 estate_acolytes_desc:0 "The Acolytes are not only the direct apprentices of the Ascending Dragon but also the direct representatives of their master's will across the Black Demesne. The land is divided between their dominions, and they are encouraged to compete against each other for their master's favour, but be careful, for within the Black Demesne there must be a Master who has power... and Acolytes to crave it."
