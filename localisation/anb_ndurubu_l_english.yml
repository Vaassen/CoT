l_english:
 #decision
 unite_the_ndurubu_title:0 "Unite the Ndurubu"
 unite_the_ndurubu_desc:0 "The Ndurubu Confederation has been shattered by war after the murder of the elected king Imaro by malcontent traditionalists, and the 40 tribes that make up our people are split in three different factions. The reactionary Atijoko, led by the prolific raider Bwana Sinnaban, cling to the old ways in the east; while the young king Diakarida leads the Kuraoko around the ancestral capital of Fojara. In the west, the Fire Planetouched Luro Vual has rallied several tribes under the banner of a planetouched supremacist ideology, and rules the land with a fiery fist. As if this was not bad enough, vultures circle in the skies above the corpse of the confederation. The nomadic gnolls in the north have seized the fortress of Xhazsaya, and now threaten the heart of our people. The greedy merchants of Kunolo have similarly intervened from the south and seized Durpupa under the pretense of protecting themselves from cattle raids. Will one of these three aspirants bring order to the lands of the Ndurubu again by restoring the Confederation and shaping it in their image, or is the fate of our people to succumb under the boot of foreign oppressors?"
 restore_ndurubu_tooltip:0 "We must be the only one of the three Ndurubu claimants left standing."
 ndurubu_unification_reward_tt:0 "If our starting ruler is alive, we will recieve an additional reward."
 
 #events
 ndurubu_events.1.t:0 "A Federation of Prides"
 ndurubu_events.1.d:0 "“I am told the boy tyrant has finally been sent with daddy, and that hotheaded imbecile in the west is dead once and for all. This calls for a celebration! Men, go get your horses, we are going on a raid. Where? Does it matter? We are lions, and the world is our prey!”\n\nLike any other people, we Ndurubu are defined by our traditions. And as we are the bravest and proudest across all Halann, those traditions should be held as uniquely sacred and untouchable. When someone threatens this exalted order, granted upon us by Fojara Himself, there is little option but to pass them through the sword. Protecting the legacy and future of our people is a task with little room for mercy and compassion. But the deed was left unfinished, and we fell into civil war, the very existence of our confederation under threat of death, be it through outside invasion or internal corruption. But our cause was righteous, as it was the cause of the old and good ways. Fojara was on our side, regardless of what the pretenders might have proclaimed, and so we were brought to victory. Bwana Sinnaban, victor in a hundred raids, and victor in this war for the soul of the Ndurubu! He is the paladin of tradition, the champion of the old ways, undefeated in combat, first among the lions and favorite of Fojara! And with his spear risen, riding in the vanguard, he leads us to glory, and to rule over Fangaula!"
 ndurubu_events.1.a:0 "A Confederation Forged Anew!"
 ndurubu_events.1.b:0 "But Let Us Not Forget Where We Came From"
 
 ndurubu_events.2.t:0 "One Pride. One King"
 ndurubu_events.2.d:0 "“Father, can you see me? The deed is done, our family avenged and the traitors dead, I alone rule over the vast savannah our people call home. Tell me then, why do I feel no satisfaction? Oh, Great Fojara, so much left to be done…”\n\nIn our hearts we always knew the cause of the Kuraoko was the cause of God, that the reforms we brought were that Fojara desired for our people. When the Atijoko slaughtered our rightful king and his family, with only his youngest  escaping the massacre, that faith was put to the test. But the young prince rallied our desperate souls and filled them with hope yet again. He spoke of a vision in his dreams, of our patron beast and the path of glory he laid ahead for him. And now, the first part of this long path has been walked. We put down the traitors, who dared call themselves guardians of tradition while being nothing but paladins of rot and stagnation, with all the ruthlessness they had earned; we quenched the flames in the west and put Luro to the sword. We have resisted the threats of both gnolls and merchants, and will soon be ready to bring them war and pain. The lands of the Ndurubu bow down to one king and one only, may his rule last an eternity! As he has brought a new day for our people, let him soon bring one to all of Fangaula. The Land of Authority, shaped by the hand of the Lion Prince!"
 ndurubu_events.2.a:0 "A Confederation Forged Anew!"
 ndurubu_events.2.b:0 "But Let Us Not Forget Where We Came From"
 
 ndurubu_events.3.t:0 "The Lion of Fiery Mane"
 ndurubu_events.3.d:0 "“They laughed! They laughed at me! They called me freak, bastard, they rubbed their power and their riches in my face, as if they could ever match the blessing God bestowed me! I came to the world with fire in my veins, and they thought they could laugh at me? Well, who is laughing now? They are dead, all dead, burnt to a crisp, and me? I am dancing through the flames, and I will never die!”\n\nLuro Vual Trawore is the ember that sets this rotten world aflame! The confederation was a relic, a pathetic shadow of itself, split by ridiculous petty squabbles. How could it be not, when it had fallen in the hands of the unblessed? How can a land filled with men who move mountains, shift rivers, command hurricanes and summon wildfires let mere mortals take the reigns of rule? Reformists, traditionalists, they are all the same, pathetic, little insects with delusions of grandeur. And that is why they lost! Because they fought with sticks and stones while we were born with mastery over nature itself! Who could be the champion of Fojara, but the Lion of Fiery Mane? The Victorious One, the storm of fire that burns all who oppose us. We fought for more than just command over the tribes of the Ndurubu, we fought for a new future in this land, one where power is in the hands of those born to wield it. An Age of Fire begins now, under the leadership of our King Crowned in Fire, and woe to any who dares stand in his way!"
 ndurubu_events.3.a:0 "A Confederation Forged Anew!"
 ndurubu_events.3.b:0 "But Let Us Not Forget Where We Came From"
 
 ndurubu_cores_tt:0 "We will gain §Gcores§! in every Ndurubu province in Fangaula, and the cores of the defeated pretenders will be removed."
 
 NDURUBU_NAME:0 "Ndurubu"
 NDURUBU_NAME_ADJ:0 "Ndurubu"
 
 L16_first_among_the_lions:0 "First Among the Lions"
 L16_first_among_the_lions_desc:0 "Bwana Sinnaban has led us to victory in the struggle for Ndurubu unification. Our greatest warriors rally under his banner. With him as our leader we will ride for glory and plunder until the end of the horizon!"
 
 S95_the_lion_prince:0 "The Lion Prince"
 S95_the_lion_prince_desc:0 "Diakarida Sidibe has led us to victory in the struggle for Ndurubu unification. The young prince, chosen by Fojara, seeks to build a stronger Ndurubu, one that is not tied to the chains of the past. Under his wise leadership, the Ndurubu will come to rule all of Fangaula and bring forward a new age!"
 
 S94_lion_of_fiery_mane:0 "Lion of Fiery Mane"
 S94_lion_of_fiery_mane_desc:0 "Luro Vual has led us to victory in the struggle for Ndurubu unification. The King Crowned in Fire has come to set alight the rot that consumes Fangaula, so that a new paradise might emerge from the ashes. The scorching flames of a thousand wildfires bend to his will, and soon, so shall all of Fangaula!"