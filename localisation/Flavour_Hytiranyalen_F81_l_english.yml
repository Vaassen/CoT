 estate_artificers_hyti_labs:0 "Well-equipped Labs"
 estate_artificers_hyti_labs_desc:0 "From raw materials to tools of all kinds, from ancient pieces of relics to magic scroll from all of Halann, our laboratory have everything that could be possibly needed for researching, and more. Rats included."
