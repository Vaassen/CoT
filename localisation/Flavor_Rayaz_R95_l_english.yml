 #Events
 rayaz_event.1.t:0 "Reminiscing on the Past"
 rayaz_event.1.d:0 "Sykar stands upon a hill looking towards an army of six tribes. He's stressed, but he doesn't let it show, calming himself with the memory of war games he played with his brother Katyradz just a year ago. Everything happened so fast when he took over, just as the Nagas said. A call for a holy war, to destroy the empire that is blocks the prophecy of the 333rd by its existence. A coalition of surprisingly united chieftains of deep western jungles. A rebellion up north, just as the "history books" said. \n\nThat's at least how he lied to himself. He still wanted to deny the fact that almost his entire life was meticoulously planned out. But for now Sykar snaps out of it. He's got a war to lead. He cannot let them down. He will not let them down." #First person direction for the whole MT probably? Rewrite?
 rayaz_event.1.a:0 "We are successful, yet only just begun"
 rayaz_event.2.t:0 "Life of the Chosen One"
 rayaz_event.2.d:0 ""
 rayaz_event.2.a:0 "I shall cherish this confession, father"
