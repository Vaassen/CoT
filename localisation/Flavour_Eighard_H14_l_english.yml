 hibernal_requisitions_level_three:0 "Hibernal Requisitions (III)"

 H14_the_dreaded_cold_title:0 "The Dreaded Cold"
 H14_the_dreaded_cold_desc:0 "We must destroy Immarel Winterswrath. But as things stand, we have little chance. Some of our unique magics may give us the edge we need."

