 H14_strange_new_faces_desc:0 "The Cannorians seek to invade our rightful claims. They'll get what's coming to them."
 H14_strange_new_faces_tt:0 "Every province in the §YBroken Lands§! Subcontinent that is conquered from a country with a capital in Cannor or their subject (including colonies) will add §G+10.0§! of each Monarch Power, once per province."

