 flavour_eighard.6.d:0 "Get in loser, we're going vassalizing"
 flavour_eighard.6.a:0 "On Wednesdays We Wear Pink"
 flavour_eighard.6.b:0 "You Will Not Make Fetch Happen"

 flavour_eighard.7.t:0 "Stagnation"
 flavour_eighard.7.d:0 "Our Esbagg walks all the way to the center of the forest, to the Rotting Ruins. They begin to hear voices"
 flavour_eighard.7.a:0 "I see, I see..."
 flavour_eighard.7.b:0 "Must've been the wind"
 H14_whispering_woods:0 "The Whispering Woods"
 H14_stagnation:0 "Stagnation"

 flavour_eighard.8.t:0 "A Wind-Chilled Meeting"
 flavour_eighard.8.d:0 "The Cult of Rot comes with an ultimatum - surrender control of [Root.GetName] to them. Peacefully, or by force."
 flavour_eighard.8.a:0 "Ok sure"
 flavour_eighard.8.b:0 "Hell no"
