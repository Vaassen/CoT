###Flavour Events

 flavour_eighard.100.d:0 "The trapdoor opens to reveal a set of stone stairs leading down into darkness. They enter the basement, with Allara leading. Keldora enters the room, standing there for a moment while her eyes adjust to the light—Allara has already started poking around. It’s a rather unassuming room—walls lined with stone, a few rotting tables, everything covered in a thin layer of dust. One one of the tables is a tattered piece of white cloth. Keldora glances at it. She looks away. She glances at it again. What is it?\n\nShe is, then, assaulted.\n\nImages flash through her mind, too fast to be seen, too overwhelming to be pushed past. Candlelight. Secrecy. Anger. Hope. Footsteps. Hush. Silence. Silence. Safety. Then sudden light. Discovery. Shouting. Figures. Swords. Blood. Pain. Fire. Ruin. Run. Her shirt is caught. Tug on it. It rips. Get out get out get out GET OUT GET OU-\n\nShe jerks and shrinks back against the wall, slumping to the floor. She wraps her arms around her legs, slowly rocking back and forth.\n\n“Kel? KELDORA!” Allara runs over to her, crouching in front of her. “What’s going on? What’s wrong?” Keldora shook her head, words inaccessible. Allara slips her arms under Keldora’s, hoisting her up. The other woman, surprising in her strength, carries a limp Keldora up the stairs, through the burned house, and out into the street, where she sets her down. It is all Keldora can do to remain upright.\n\n“Kel, Kel, I’m here, it’s alright,” Allara says, crouching down beside the stunned woman. “What happened in there?” Keldora’s breathing is heavy, erratic.\n\n“I, I—I don’t know,” she says. “A memory, something I forgot—or was forced to?”\n\n“What was it?”\n\n“It was…my family. My neighbors.” Keldora is crying now, choking on her tears. “They were scared, and missed the old Eighard, and then the soldiers came, and then-” She cuts off.\n\n“Oh, Kel,” Allara says. “Of course they were scared. The unfamiliar is always scary. But think of what you’ve gained. Think of the community you’ve found, and what the Princess means to you. We tried to show them, but they didn’t understand, and hated us for it. There was no other way.”\n\nKeldora sniffs. “Yes, Allara, you’re right. Praise Autumn.”\n\nPraise Autumn,” Allara says. They press their foreheads against each other and hug in the empty street."
 flavour_eighard.100.a:0 "Tomorrow, they will continue on their way."
 flavour_eighard.100.b:0 "No, linger in this place. Something has happened here."