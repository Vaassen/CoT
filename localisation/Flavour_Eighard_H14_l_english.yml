 H14_eordand_winter_tt:0 "The maluses from winter will be counteracted in all provinces in the §YEordand§! Subcontinent"

 flavour_eighard.39.t:0 "Between Worlds"
 flavour_eighard.39.d:0 "In we go. Stick close"
 flavour_eighard.39.a:0 "The clock is ticking"
 flavour_eighard.40.t:0 "Getting Warmer..."
 flavour_eighard.40.d:0 "The Seelie court fey are consumed"
 flavour_eighard.40.a:0 "One."
 flavour_eighard.41.t:0 "And Warmer..."
 flavour_eighard.41.d:0 "The Unseelie court fey are consumed"
 flavour_eighard.41.a:0 "Two."
 flavour_eighard.42.t:0 "Very Warm..."
 flavour_eighard.42.d:0 "The unaligned fey are consumed"
 flavour_eighard.42.a:0 "Three."
 flavour_eighard.43.t:0 "Found You"
 flavour_eighard.43.d:0 "The Amber Princess finds the remaining seasonal fey cowering. They are consumed."
 flavour_eighard.43.a:0 "Eternal Autumn, finally"
