 H14_winterswrath_broken_desc:0 "Immarel is dead. WE must now ransack her chambers. Where did she get her power from?"

 H14_reclaim_dorcurt_title:0 "Reclaim Dorcurt"
 H14_reclaim_dorcurt_desc:0 "The Peitar of Iadth stole Dorcurt, the center of our faith, from us. We will reclaim it."
 H14_bastion_of_faith:0 "Bastion of Faith"

