 eighard_exploit_dev_value:0 "Number of Times Exploited Development"

 H14_autumn_unified_title:0 "Autumn, Unified"
 H14_autumn_unified_desc:0 "Winter destoryed, Autumn united. Finally. But we've received a missive. Our Esbagg, called to a meeting in a seemingly random place. Alone"

 H14_purity_title:0 "Purity"
 H14_purity_desc:0 "We have pushed back the Cult of Rot. We set our sights on Pelomar"
 H14_autumn_purified:0 "Autumn Purified"

 H14_finding_truth_title:0 "Finding the Truth"
 H14_finding_truth_desc:0 "Having completed our conquest of the Domandrod, it's time to figure out what's really going on here"

 H14_malnatur_title:0 "Malnatur"
 H14_malnatur_desc:0 "With the revolts our state is facing, we must build a massive prison in our capital, where prisoners will be left to decay into nothing"
 H14_finished_war_for_domandrod_tt:0 "Have §Ywon§! the war for the Domandrod"
 H14_no_fort_building:0 "Has no §YFort§! building"

 H14_cut_wings_off_title:0 "Cut Their Wings Off"
 H14_cut_wings_off_desc:0 "With the stae their object of worship is in, the followers of Drozma Tur are up in arms. We shall fix this"
 H14_end_false_visions:0 "Ended the False Visions"
 H14_ynn_claim_tt:0 "§Y[Root.GetName]§! gains a permanent claim on every province that §Yexperiences winter§! in the §YYnn§! Subcontinent and §Y[1142.GetName]§!"

 H14_breathing_in_title:0 "Breathing In"
 H14_breathing_in_desc:0 "The Amber Princess has mandated we strengthen the 3 Ynnic cities. For what purpose we know not, but we are beholden to her."

 H14_the_end____title:0 "The End..."
 H14_the_end____desc:0 "The Amber Princess is ready to enact the final phase of her plan"
 H14_skill_5_adm_advisor:0 "Any §YAdministrative Advisor§! is currently employed with skill of at least §Y5§!"

 H14____is_never_the_end_title:0 "...Is Never The End"
 H14____is_never_the_end_desc:0 "The Archfey have been consumed"
 H14_ended_deepwoods_war_tt:0 "Have won the War for the Deepwoods"
 
###Column 4

 H14_prepare_second_strike_title:0 "Prepare the Second Strike"
 H14_prepare_second_strike_desc:0 "We must prepare our revenge against the Peitar who broke the Hibernal Crusade"

 H14_field_of_broken_oaths_title:0 "A Field of Broken Oaths"
 H14_field_of_broken_oaths_desc:0 "It was at Minnorac that the Hibernal Crusade was broken. The Peitar are to blame"
