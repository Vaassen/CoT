 H14_aglow:0 "Aglow"

 flavour_eighard.35.t:0 "I Can See Your Breath"
 flavour_eighard.35.d:0 "Allara and Keldora - two incredibly traumatized women. But they're in love so it's fine don't worry about it"
 flavour_eighard.35.a:0 "Peak"
 flavour_eighard.36.t:0 "Recurrent"
 flavour_eighard.36.d:0 "Allara and Keldora visit the town where Keldora grew up."
 flavour_eighard.36.a:0 "Zamn"
 flavour_eighard.36.b:0 "Something is terribly wrong"
 flavour_eighard.37.t:0 "Drift"
 flavour_eighard.37.d:0 "Keldora, remember. All is not as it seems."
 flavour_eighard.37.a:0 "Zamn"
 flavour_eighard.37.b:0 "Something is DEFINITELY wrong"
 flavour_eighard.38.t:0 "Only Here and Nowhere Else"
 flavour_eighard.38.d:0 "It's quiet in the Ynn Valley today. Too quiet"
 flavour_eighard.38.a:0 "On the edge of desolation"
