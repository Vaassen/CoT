 H14_pretender_of_faith_desc:0 "Einnsag dares call themselves the leader of the Autumn Court? Where were they on the front lines, hmm?"

 H14_rude_awakening_title:0 "Rude Awakening"
 H14_rude_awakening_desc:0 "The Summer Court preaches of decadance, of tranquility. We will show them the decay such vice begets."
 H14_stagnant_wave:0 "Stagnant Wave"
 H14_rude_awakening_area_tt:0 "All provinces in the §YTrimgarb§!, §YEaregasach§!, §YSaregasach§!, §YSerakriok§! and §YTrimthir§! areas:\n   One of the following must be true:\n      Is open for colonization\n      Owned by §Y[Root.GetName]§! or its non-Tributary subjects"

 H14_tawdry_yellows_gaudy_pinks_title:0 "Tawdry Dyes" 
 H14_tawdry_yellows_gaudy_pinks_desc:0 "Everyone knows we have the best dyes. Sglard and Dearktir, however, didn't get the memo. Now that we have conquered them, we can rectify that."
 H14_tawdry_dyes_tt:0 "Meaning of above: Fewer than §Y10§! provinces in the §YEordand Subcontinent§! (excluding the §YDomandrod Region§!) are of §YPeitar§! culture"
 H14_dye_monopoly:0 "Dye Monopoly"
 
 H14_champions_no_longer_title:0 "Champions No Longer"
 H14_champions_no_longer_desc:0 "Pelomar. We spit on their grave. THe grave of all the Peitar"
 H14_oathbroken:0 "Oathbroken"
