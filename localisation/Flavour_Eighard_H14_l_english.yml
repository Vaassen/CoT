 H14_urban_reshaping:0 "Urban Reshaping"

 H14_secure_fringes_title:0 "Secure the Fringes"
 H14_secure_fringes_desc:0 "The Cannorian's are everywhere! Even in the fringes of the Ynn their presence is felt."
