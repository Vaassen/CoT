 H14_fey_backing:0 "Fey Backing"
 H14_war_for_domandrod_one_ptm:0 "War For The Domandrod"
 H14_war_for_domandrod_one_ptm_desc:0 "To fully crush Liughagcal, we will need at least §G+100.0%§! War Score against them. It will not be possible to peace out before then!"
 H14_war_for_domandrod_two_ptm:0 "War For The Domandrod"
 H14_war_for_domandrod_two_ptm_desc:0 "To fully crush Liughagcal, we will need at least §G+100.0%§! War Score against them. It will not be possible to peace out before then!"
 cb_iaochri:0 "Iaochri"
 cb_iaochri_desc:0 "Right. The War. The War For The Domandrod. The War Specifically For The Domandrod. The Domandrod War." ###TODOAMBER: DESCRIPTION!!!!
 flavour_eighard.14.t:0 "Without a Trace"
 flavour_eighard.14.d:0 "We are fighting a war for the Domandrod, and yet the archfey are unseen. Where are they?"
 flavour_eighard.14.a:0 "Wherever there's shadow, there's a light. Be on your guard."
 flavour_eighard.23.t:0 "Cowardice"
 flavour_eighard.23.d:0 "The Princess finds the archfey, who are escaping into a portal - all escape except the Gloam Knight, who is blocked by the Princess. The Gloam Knight, cornered, stands his ground and fights the Amber Princess"
 flavour_eighard.23.a:0 "Stop your futile effort. You're going to make a fool of yourself."
 flavour_eighard.24.t:0 "Drink Deeply"
 flavour_eighard.24.d:0 "The Amber Princess wins, and then consumes the Gloam Knight, leaving him an empty husk piloted by nothing. Some troops are in awe, others are horrified and desert"
 flavour_eighard.24.a:0 "It'll be a date to die for."
 H14_eternal_autumn_mild:0 "Eternal Autumn"
 H14_eternal_autumn_normal:0 "Eternal Autumn"
 H14_eternal_autumn_severe:0 "Eternal Autumn"

 flavour_eighard.16.t:0 "The Princess and the Dragon"
 flavour_eighard.16.d:0 "Varlengeilt seems confident despite the situation. The arrival of the Amber Princess changes things, and he flees."
 flavour_eighard.16.a:0 "THE LEGIONS OF EVIL ARE ON YOUR DOORSTEP! THEY WILL FEAST UPON OUR HEARTS!"
 flavour_eighard.25.t:0 "The Holdouts"
 flavour_eighard.25.d:0 "Rebels rise up in Svemel again! It appears that Varlengeilt is not quite as gone as we first thought."
 flavour_eighard.25.a:0 "Stab, kill, kill!"
 flavour_eighard.26.t:0 "Every Day Is The Same"
 flavour_eighard.26.d:0 "Varlengeilt in a cave. His body weakens by the day. It is his birthday. He has little time left."
 flavour_eighard.26.a:0 "The wrong cake? Disaster, indeed."
 flavour_eighard.27.t:0 "The Prince's Last Gasp"
 flavour_eighard.27.d:0 "Varlengeilt makes his grand return, along with the last of his followers."
 flavour_eighard.27.a:0 "Falling on his talon in grief seemed like too much trouble, I take it?"
 flavour_eighard.28.t:0 "You Poor Thing"
 flavour_eighard.28.d:0 "The Amber Princess comes across Varlengeilt, a twitching mess on the floor. She does not end his suffering."
 flavour_eighard.28.a:0 "Look, the bruises form a pretty pattern!"
 H14_desperate_outrage:0 "Desperate Outrage"
 H14_broken_dragon:0 "The Broken Dragon"

