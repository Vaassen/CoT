###Mission Events
 H14_consequences_tt:0 "§rThis will have consequences...§!"

 flavour_eighard.1.t:0 "A Midnight Visitor"
 flavour_eighard.1.d:0 "The Esbagg recieves a visitor in the middle of the night. They offer their organization's services in the upcoming conflicts, for the promise of a later favour."
 flavour_eighard.1.a:0 "I'll take the deal"
 flavour_eighard.1.b:0 "No thanks!"
 flavour_eighard.9.t:0 "Pay Our Due"
 flavour_eighard.9.d:0 "The visitor comes knocking again. We must give them what we promised"
 flavour_eighard.9.a:0 "Ok fine"
 flavour_eighard.9.b:0 "Actually no"

 flavour_eighard.2.t:0 "A Spoiled Marriage"
 flavour_eighard.2.d:0 "The Autumn Court and Winter Court, bnound in marriage. What a load of rubbish."
 flavour_eighard.2.a:0 "Mawwiage is what brings you apart today" #Amber didn't actually give me an option desc for this one
 H14_salting_the_fields:0 "Salting the Fields"
 H14_salting_the_fields_desc:0 "While this modifier lasts, §YExploiting Tax Development§! will give §G10§!¤ crowns per level of base tax in the province, up to §Y100§!¤"

 flavour_eighard.3.t:0 "An Offer Most Frigid"
 flavour_eighard.3.d:0 "The shadowy figures approach us once again. In the times to come, the special magics they offer may be of use"
 flavour_eighard.3.a:0 "Sure" 
 flavour_eighard.3.b:0 "Nah"
 H14_war_with_gemradcurt:0 "The next time we declare war on Gemradcurt:\nCast §SIcewardery§!:\n"

 flavour_eighard.10.t:0 "The Final Solstice"
 flavour_eighard.10.d:0 "Immarel is cornered. She should have died the first time"
 flavour_eighard.10.a:0 "Goodbye, fuck you!" 
 H14_slayed_the_witch:0 "Slayed the Witch"

 flavour_eighard.4.t:0 "In Her Tower"
 flavour_eighard.4.d:0 "Searching through Immarel's study, [Root.GetAdjective] soldier's discover evidence of dealings between Immarel and the Everfrost Prince"
 flavour_eighard.4.a:0 "Damn her and damn the Prince"
 flavour_eighard.11.t:0 "Further Research"
 flavour_eighard.11.d:0 "This shadowy organization appraoches us yet again, offering to investigate the concerning reords we found in Immarel's tower"
 flavour_eighard.11.a:0 "Yeah sure"
 flavour_eighard.11.b:0 "Nah"
 H14_investigating_magic_records:0 "Investigating Magical Records"

 flavour_eighard.5.t:0 "A Chance Arrangement"
 flavour_eighard.5.d:0 "The Cult of Rot, eh? I might be able to get behind that..."
 flavour_eighard.5.a:0 "Let's work together"
 flavour_eighard.5.b:0 "Actually, you're cringe"
