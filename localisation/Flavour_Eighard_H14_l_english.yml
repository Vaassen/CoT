 flavour_eighard.22.t:0 "Somni"
 flavour_eighard.22.d:0 "This world will be consumed. But not quite this moment. You still have a little time left. You can stave it off. Well, you can try."
 flavour_eighard.22.a:0 "A 2mm hole in the world... slowly expanding..."
 flavour_eighard.31.t:0 "It Stays With You"
 flavour_eighard.31.d:0 "Allara and Keldora under the autumn sun. They can't even begin to understand how wrong everything is"
 flavour_eighard.31.a:0 "The eternal petrichor of autumn leaves..."
 H14_consume_tt:0 "§YExploiting Development§! will now remove §G-100.0§! devastation, give §G+25.0§! church power, and add §G+2.0§! absolutism"
 H14_thanks_for_playing:0 "Thanks for playing!"
 H14_consumption:0 "Consumption"
 H14_autumn_leaves:0 "Autumn Leaves"

 flavour_eighard.32.t:0 "Chimera"
 flavour_eighard.32.d:0 "The Amber Princess has asked us to prepare ritual circles around [2007.GetName] and [2037.GetName]"
 flavour_eighard.32.a:0 "Ok"
 flavour_eighard.33.t:0 "As You Are But Not As You Were"
 flavour_eighard.33.d:0 "The Amber Princess pays the ruler of [Root.GetName] a visit. The Princess asks for some of the ruler's life force."
 flavour_eighard.33.a:0 "I can spare a little"
 flavour_eighard.33.b:0 "Yeah here's a bunch"
 flavour_eighard.34.t:0 "Waves Upon Waves"
 flavour_eighard.34.d:0 "A portion of [2007.GetName] and [2037.GetName]'s population has disappeared. It seems a little warmer in Darblath now. Praise the Princess!"
 flavour_eighard.34.a:0 "Praise be!"
