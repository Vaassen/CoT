 H14_her_true_power_title:0 "Her True Power"
 H14_her_true_power_desc:0 "The Amber Princess has revealed herself to be more powerful than we ever believed. Truly we were right to put our faith in Her"

 H14_growing_strength_title:0 "Growing Strength"
 H14_growing_strength_desc:0 "The ame Princess hungers. She demands more yuri with each passing day, and we are more than happy to oblige"
 H14_icewardery_upgrade_double_duration_tt:0 "The duration of §SIcewardery§! will now be §GDoubled§! when cast"

