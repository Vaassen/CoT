 H14_bastion_tt:0 "Once the rebels have been defeated and §Y[1969.GetName]§! is back under §Y[Root.GetName]§!'s control, begin construction of a §YBastion§! for §G0.0%§! of the cost and §R200.0%§! of the time, with §G20.0%§! of the progress already completed."

 flavour_eighard.18.t:0 "Praise Be"
 flavour_eighard.18.d:0 "A madman cries heresy, that the Amber Princess is not her at all, but some eldritch being. He is hanged for his words. Elsewhere, a preacher tells of the glory of the Princess"
 flavour_eighard.18.a:0 "Hallelujah, amen"
 H14_banoghard:0 "Banoghard"
 H14_banoghard_ADJ:0 "Banoghardian"
 H14_praise_be_tt:0 "Unlock Cult of Rot Fey influencers.\n\nThe §YExpansionist Zealotry§! [Root.GetChurchOrFallbackName] Privilege no longer reduces absolutism and does not reduce morale and loyalty when at peace."
 H14_husk_knight:0 "The Husk Knight"
 H14_adm_rot_amber_princess_tt:0 "§Y5§! random provinces not currently benefitting from §YWarmth Rites§! will lose §R-1§! random development. §Y5§! random provinces currently benefitting from §YWarmth Rites§! will gain §G+1/1/1§! development."

 flavour_eighard.19.t:0 "Such Beauty"
 flavour_eighard.19.d:0 "The Amber Princess stares up at the Golden Dome. She feels the magic within it, and consumes it."
 flavour_eighard.19.a:0 "You're not you when you're hungry..."

 flavour_eighard.20.t:0 "Have You Heard The Word..."
 flavour_eighard.20.d:0 "Allara and Keldora are doing outreach. One of them is a little more enthusiastic than the other."
 flavour_eighard.20.a:0 "...of the glory of the Princess?"
 H14_heard_the_word_tt:0 "Holding a festival now refunds §G+50.0§! religious power and gives §G+50.0§! of each monarch power."

 flavour_eighard.21.t:0 "Into The Woods"
 flavour_eighard.21.d:0 "The Amber Princess rips through the barriers to the Deepwoods. In we go."
 flavour_eighard.21.a:0 "Feet first into hell"
 flavour_eighard.30.t:0 "Breathing Out"
 flavour_eighard.30.d:0 "It is done. It is time for the final phase of the Amber Princess' plan."
 flavour_eighard.30.a:0 "And making sure it's crowded when we get there"
 H14_final_mission:0 "Reveal the final mission"
