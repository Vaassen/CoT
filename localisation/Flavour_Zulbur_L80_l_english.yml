l_english:
 L80_uniting_the_tribes_title:0 "Uniting the Tribes"
 L80_uniting_the_tribes_desc:0 "We Ashana have stood apart for too long, subject to the bloodcurse we could never unite into the cohesive power we can be. No more, we shall overcome our external divisions just as we shall overcome our internal ones"

 L80_relorks_travels_title:0 "Relork’s Travels"
 L80_relorks_travels_desc:0 "'I could sit and wait, rely on my advisors to project power and enjoy a life of luxury. But that wouldn't unite my people, that wouldn't defeat the bloodcurse and that wouldn't make a tale to live forever'"

 L80_the_united_people_title:0 "The United People"
 L80_the_united_people_desc:0 "What was once a squabbling collection of tribes and chiefs is now a power ready to rise and face the outside world, free from our failures."

 L80_to_revive_those_lost_title:0 "To Revive those Lost"
 L80_to_revive_those_lost_desc:0 "Rayaz may have seen it as merely converting Karashan but in truth they were taking away what holds the curse at bay, removing our link to stability. We can only hope the damage is not to severe"

 L80_to_start_a_song_title:0 "To Start a Song"
 L80_to_start_a_song_desc:0 " A good Ruler knows how to face any problem, they will be remembered for Decades."

 L80_the_stone_castle_of_zulbur_title:0 "Expanding the Stone Castle"
 L80_the_stone_castle_of_zulbur_desc:0 "Sitting in the Heart of Zulbur lies the Stone Castle, the shining beacon of our mastery of Architecture. Although famed more for its Beauty than its practicality, we shall make it an icon of both"

 L80_our_great_arts_title:0 "Our Great Arts"
 L80_our_great_arts_desc:0 "To Unify the Ashana politically is easy, not much can stop us from controlling the lands through force or diplomacy. To unify the Ashana societally will take far longer"

 L80_memories_of_the_fight_title:0 "Memories of the Fight"
 L80_memories_of_the_fight_desc:0 "We may have vanquished the folly of the Claw but their memory still lingers, the idea of violence over art. But we will advance, we always will."

 L80_the_dream_of_adzalan_title:0 "The Dream of Adzalan"
 L80_the_dream_of_adzalan_desc:0 "We have brought the Ashana to the end of their tribal squabbles, brought them out of the villages and into our rightful glory, brought them away from the Brutal ideas of the Claw Faction. Now we rise into the future, not as Zulbur, but as Adzalan"

 L80_the_city_of_the_east_title:0 "The City of The East"
 L80_the_city_of_the_east_desc:0 "Shalazar may not have the best memories of us Ashana but it's wealth and power are too tempting to neglect and too threatening to ignore"

 L80_zulburs_wonders_title:0 "Zulbur’s Wonders"
 L80_zulburs_wonders_desc:0 "We may not wish to make Zulbur the sole site for Ashanan Art but we shall make the city the centre of all styles and specialities, with our Architecture and sculpture highlighted"

 L80_an_ashanan_coast_title:0 "An Ashhanan Coast"
 L80_an_ashanan_coast_desc:0 "We have always been confined to the northern Jungles and Hills of Taneyas, away from the wealth and power of the coast. No Longer, we shall break into the sea to spread and recieve the art of the world"

 L80_the_question_of_ashakani_title:0 "The Question of Ashakani"
 L80_the_question_of_ashakani_desc:0 "Ashakani to the north poses the question of what truly defines our society. Are we Ashana or Zaradyrra first?"

 L80_our_return_title:0 "Our Return"
 L80_our_return_desc:0 "Shalazar has fallen once more to the Ashana, but where as we were once here to pillage and raze we are now here to learn and rule"

 L80_the_east_secured_title:0 "The East Secured"
 L80_the_east_secured_desc:0 "The Borders of the Ashana may have Waxed and Waned over the years but we now have a chance to fix them where we shall no longer need to fear a resurgent Rhada"


 flavor_zulbur.1.t:0 "The Question of Ashakani" 
 flavor_zulbur.1.d:0 "Relork debates the question Again and again. Should those who wronged and harmed the Ashana be allowed to thrive within our society, should the past be forgiven for the good of the future?"
 flavor_zulbur.1.a:0 "Towards the future."

 flavor_zulbur.2.t:0 "The Lessons of Our Jungles"
 flavor_zulbur.2.d:0 "We Cannot rule with just Zulbur. To do so wouldn't make Adzalan, it would make us Tyrants. We shouldn't make our people follow Zulbur's arts, we should make Zulbur incorporate our people's arts, creating something so much more than it's parts"
 flavor_zulbur.2.a:0 "To unite us all."

 flavor_zulbur.3.t:0 "To Truly Unite"
 flavor_zulbur.3.d:0 "We Could build a stone castle in every city, every tribe. We could display our dominance to all. Or we could build a gold-gilded statue in Karaach, a Stone Tower in Tsuz, specialising our building talents for all"
 flavor_zulbur.3.a:0 "Let the Construction Begin."

 flavor_zulbur.4.t:0 "To Realise the Dream"
 flavor_zulbur.4.d:0 "And yet we have moved on. What was once a society split in between art and war is now a stable and united power within Northern Taneyas. And yet We can still be more, we can still reach further in pursuit of a dream once impossible"
 flavor_zulbur.4.a:0 "And so we shall."

 flavor_zulbur.5.t:0 "The Tale of Relork"
 flavor_zulbur.5.d:0 "And now Relork relaxes, safe in the knowledge that we are safe and prosperous. No longer will the curse tear at the seams of our society or minds, no longer will the Ashana be known as raiders or Monsters but instead as Artists and creators. No Longer will Relork have to fight for what he believes in for it is entrenched in all that he loves. And Now relork can Relax, and watch his deeds be immortalised in Adzalani culture, through both his statues within Zulbur, and the widespread tale of Relork sweeping Adzalan"
 flavor_zulbur.5.a:0 "And his sucessor is clear."
 flavor_zulbur.5.b:0 "And his country continues."

 flavor_zulbur.6.t:0 "To Feed our Kingdom"
 flavor_zulbur.6.d:0 "Ishyaga's art has very little in common with ours or any of the Ashana for that matter. As such Relork decides to incorporate it through establishing a major Kitchen within the Stone Castle"
 flavor_zulbur.6.a:0 "Food for all!"

 flavor_zulbur.7.t:0 "Order through Art, Art through Order"
 flavor_zulbur.7.d:0 "Abussa focuses not around traditional Arts to quell the bloodcurse but instead focusing around bureaucracy to keep Order. Through adopting their Governmental advances, we can emulate their policies and concentrate it within Zulbur"
 flavor_zulbur.7.a:0 "Order within our souls."

 flavor_zulbur.8.t:0 "To Forge and Carve"
 flavor_zulbur.8.d:0 "Tsuz's forges are in many ways adaptable to our sculpture and architecture. Through sculpting with Stone and steel we can help syncretise our styles to create more detail and depth"
 flavor_zulbur.8.a:0 "Our Statues Gleam Anew."

 flavor_zulbur.9.t:0 "The History of Art"
 flavor_zulbur.9.d:0 "Zatal prides itself on it's history and records, keeping it's past coherent and their minds clear. Sculpture provides another avenue to keep the history of our societies and alive in the forefront of our minds."
 flavor_zulbur.9.a:0 "We Shall use the past to seize the future."

 flavor_zulbur.10.t:0 "Cleansing And Building"
 flavor_zulbur.10.d:0 "Kakhazajar combats the bloodcurse through focusing on combating the decaying influence of the Shadowswamp. We may not face such a severe threat of the decay in Zulbur but we can still apply their principles in our Architecture"
 flavor_zulbur.10.a:0 "The Cleansed Lake shines across our Kingdom."

 flavor_zulbur.11.t:0 "Gilding our Statues"
 flavor_zulbur.11.d:0 "Yosasad's Gold mine created a culture of Gilding and engraving to drive away the curse. Integrating them into our sculpting is one of the cleanest fits among the Ashanan arts"
 flavor_zulbur.11.a:0 "Golden Gilding for All!"

 flavor_zulbur.12.t:0 "Masking the Curse"
 flavor_zulbur.12.d:0 "Rshak's society is built around masks, for the commonfolk these are ceremonial to help handle the bloodcurse, for the nobles they are magical with the capability to transform their bodies. We may have no taste for their magic but their talent for craftsmanship makes a natural inclusion within our blooming society"
 flavor_zulbur.12.a:0 "Masks of Wood and Walls of Stone."

 flavor_zulbur.13.t:0 "Rhadan Mastery"
 flavor_zulbur.13.d:0 "The Rhada may be newer than us to the ways of Zaradyrra but their expertise developed over millennia has built up a large bank of talent and skill. In Ashakani this is seen through their mastery of glass, a talent that we can easily utilise in our castle"
 flavor_zulbur.13.a:0 "Glass and Stone."

 flavor_zulbur.14.t:0 "To Reclaim the Claw"
 flavor_zulbur.14.d:0 "Gasha was one of the most ardent supporters of the claw faction, proposing violence and conquest as ways to "Contain" the curse. The idea of War as art may be outlandish to us but we shall still try to adopt their ways, and help them see ours."
 flavor_zulbur.14.a:0 "The Guided Claw."

 flavor_zulbur.15.t:0 "The Tale of Relork"
 flavor_zulbur.15.d:0 "Karashan were lost to the Riverclaw kingdom of Rayaz, They were forced to abandon Zaradyrra or face the wrath of their armies. But although their arts may have been lost, their people still remember the time before, still hope to reclaim that prosperity, and we shall gladly help them."
 flavor_zulbur.15.a:0 "Art for all."

 flavor_zulbur.16.t:0 "To Convince the Claw"
 flavor_zulbur.16.d:0 "There is no Shame in being Monstrous, There is only Shame in Staying Monstrous."
 flavor_zulbur.16.a:0 "Forwards, forever and a day."

 flavor_zulbur.17.t:0 "The End of Relork"
 flavor_zulbur.17.d:0 "And so Relork ends, his people prepared to Carry his Legacy into the Future, to keep his ideals of growth and progress and to quell the curse forevermore"
 flavor_zulbur.17.a:0 "And his memory will live on."

 flavor_zulbur.18.t:0 "Relork The Eternal"
 flavor_zulbur.18.d:0 "And so Relork ends, his ideals enshrined into Ashanan Society and art, his chosen successor [Root.Monarch.GetName] will ensure that Adzalan will continue on as a power not only in the political sphere, but also the artistic and societal spheres."
 flavor_zulbur.18.a:0 "And his memory shall never die."

