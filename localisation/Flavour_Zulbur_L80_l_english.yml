l_english:
 L80_uniting_the_tribes_title:0 "Uniting the Tribes"
 L80_uniting_the_tribes_desc:0 "We Ashana have stood apart for too long, subject to the bloodcurse we could never unite into the cohesive power we can be. No more, we shall overcome our external divisions just as we shall overcome our internal ones"

 L80_relorks_travels_title:0 "Relork’s Travels"
 L80_relorks_travels_desc:0 "'I could sit and wait, rely on my advisors to project power and enjoy a life of luxury. But that wouldn't unite my people, that wouldn't defeat the bloodcurse and that wouldn't make a tale to live forever'"

 L80_the_united_people_title:0 "The United People"
 L80_the_united_people_desc:0 "What was once a squabbling collection of tribes and chiefs is now a power ready to rise and face the outside world, free from our failures."

 L80_to_revive_those_lost_title:0 "To Revive those Lost"
 L80_to_revive_those_lost_desc:0 "Rayaz may have seen it as merely converting Karashan but in truth they were taking away what holds the curse at bay, removing our link to stability. We can only hope the damage is not to severe"

 L80_to_start_a_song_title:0 "To Start a Song"
 L80_to_start_a_song_desc:0 " A good Ruler knows how to face any problem, they will be remembered for Decades."

 L80_the_stone_castle_of_zulbur_title:0 "The Stone Castle of Zulbur"
 L80_the_stone_castle_of_zulbur_desc:0 "Sitting in the Heart of Zulbur lies the Stone Castle, the shining beacon of our mastery of Architecture. Although famed more for its Beauty than its practicality, we shall make it an icon of both"

 L80_our_great_arts_title:0 "Our Great Arts"
 L80_our_great_arts_desc:0 "To Unify the Ashana politically is easy, not much can stop us from controlling the lands through force or diplomacy. To unify the Ashana societally will take far longer"

 L80_memories_of_the_fight_title:0 "Memories of the Fight"
 L80_memories_of_the_fight_desc:0 "We may have vanquished the folly of the Claw but their memory still lingers, the idea of violence over art. But we will advance, we always will."

 L80_the_dream_of_adzalan_title:0 "The Dream of Adzalan"
 L80_the_dream_of_adzalan_desc:0 "We have brought the Ashana to the end of their tribal squabbles, brought them out of the villages and into our rightful glory, brought them away from the Brutal ideas of the Claw Faction. Now we rise into the future, not as Zulbur, but as Adzalan"

 L80_the_city_of_the_east_title:0 "The City of The East"
 L80_the_city_of_the_east_desc:0 "Shalazar may not have the best memories of us Ashana but it's wealth and power are too tempting to neglect and too threatening to ignore"

 L80_zulburs_wonders_title:0 "Zulbur’s Wonders"
 L80_zulburs_wonders_desc:0 "We may not wish to make Zulbur the sole site for Ashanan Art but we shall make the city the centre of all styles and specialities, with our Architecture and sculpture highlighted"

 L80_an_ashanan_coast_title:0 "An Ashhanan Coast"
 L80_an_ashanan_coast_desc:0 "We have always been confined to the northern Jungles and Hills of Taneyas, away from the wealth and power of the coast. No Longer, we shall break into the sea to spread and recieve the art of the world"

 L80_the_question_of_ashakani_title:0 "The Question of Ashakani"
 L80_the_question_of_ashakani_desc:0 "Ashakani to the north poses the question of what truly defines our society. Are we Ashana or Zaradyrra first?"

 L80_our_return_title:0 "Our Return"
 L80_our_return_desc:0 "Shalazar has fallen once more to the Ashana, but where as we were once here to pillage and raze we are now here to learn and rule"

 L80_the_east_secured_title:0 "The East Secured"
 L80_the_east_secured_desc:0 "The Borders of the Ashana may have Waxed and Waned over the years but we now have a chance to fix them where we shall no longer need to fear a resurgent Rhada"


 flavor_zulbur.1.t:0 "Relorks plea" 
 flavor_zulbur.1.d:0 "uwu please be our friends"
 flavor_zulbur.1.a:0 "pwease?"
