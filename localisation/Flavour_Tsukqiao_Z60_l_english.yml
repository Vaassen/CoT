 #The Arena Fight Tooltips
 tsukqiao_arena_fight_1_1.tt:0 "£yes£§G(Strenght: 87/60)§! This brutal move incapacitates the opponent\n\n§Y[Root.GetRulerTitleAndNameOrRegencyCap]§! gains §G+5§! §YStrenght Points§!\n\n§YChallenge 'Break the Weak' Progression: £no£ §R107§!/§G120§! Enemies Defeated with Hand-to-Hand Combat§!"
