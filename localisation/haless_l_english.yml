 haless.701.t: "Slumbering Voices Within the Mountain's Belly"
 haless.701.desc: "Excavating tunnels in the remote mountains of northern Yanshen is usually a mundane affair. Yet a recent discovery has stirred unease. In a disused shaft within a [haless_mine_province.GetName], several miners uncovered a stone stele carved with strange runes. Its form bears clear resemblance to the ritual iconography of the Devouring Path, and the surrounding chamber was littered with wax-sealed bones and shattered soul vessels.\n\nAfter careful examination, scholars have confirmed the site to be a remnant left behind by followers of the Devouring Path. Among the workers, the place is already being referred to as the “Old Altar of the Devourer,” with claims that echoing voices rise from the shaft during the night.\n\nIt is time to decide how we shall respond to this buried trace of faith."
 haless.701.a: "Send mages to purify the tainted ruins"
 haless.701.b: "Seal off the shaft and mine elsewhere"
 haless.701.c: "Record the layout as a ritual method"
 haless.701.d: "This must be an Altar to the Mother Empire!"
 haless_purging_profane: "Purging the Profane"
 haless_sealed_shaft: "Sealed Shaft"
 haless_lost_rite: "Completion of the Lost Rite"
 haless_devouring_rite: "Devouring Rite from the Mother Empire"

 haless.702.t: "The Iron of the Mountains"
 haless.702.desc: "The northern mountains of Yanshen have long been rich in iron, the backbone of the realm’s arms and military strength. For generations, mining and governance here have been overseen by court-appointed officials working with local authorities. Most sites are managed directly by state offices under strict statutes to prevent mountain damage or unlawful extraction.\n\nRecently, highland officials reported that local miners and craftsmen tested a new method: combining ancestral timber-frame tiering with folk-developed gunpowder blasting, greatly boosting ore yield without harming the terrain. This works only with the unique stone of Beikling and Demon Hills, yet results are remarkable.\n\nLocals petition to keep using it and grant mining guilds more discretion for flexible operations. The court, though recognizing its merit, fears such liberty could invite imitation elsewhere, eroding mining regulations and disrupting coordination.\n\nShould one adapt to local advantage—or uphold the rules that bind the realm?"
 haless.702.a: "Recognize local innovation and promote reform"
 haless.702.b: "Do not proceed; maintain current mining standards"
 haless.702.c: "Send our mining specialists to assist the discussion"
 haless_mining_method: "Northern Ridge Mining Method"
 haless_central_supervision: "Central Supervision"
 haless_composite_extraction: "Composite Extraction"

 haless.703.t: "The Goldscale Accord"
 haless.703.desc: "The goldscaled kobolds are renowned across Yan for their expertise in mountain trade routes. The golden scales they wear shimmer brilliantly under the sun, serving not only as a symbol of identity but also as a mark of credit and wealth. Their so-called “Goldscale Crafts” are crafted with ingenious mechanisms and rare mountain materials. Unique in design and craftsmanship, these goods are highly popular at markets and gatherings, beloved by both commoners and merchants alike.\n\nRecently, a prominent kobold trade guild from the region surrounding the Temple of Jinxiou has, for the first time, formally addressed the local authorities with a proposal to establish a mutual trade agreement. They suggest dispatching a delegation to reside permanently in the major towns of the Yanzhong region. The aim is to build a more stable supply network, expand their distribution channels, and promote closer commercial exchange. The guild promises to bring with them skilled Goldscale artisans, rare mountain goods, and finely crafted wares—injecting new vitality into the local economy.\n\nThis is the first time a kobold trade guild has proposed a partnership of this scale, drawing significant attention from local officials. Most view it favorably, believing it could broaden the market and boost tax revenue. However, some voices of concern have been raised: if a foreign merchant guild is allowed to take root locally, might they eventually control the arteries of commerce and marginalize native merchants in both livelihood and influence?"
 haless.703.a: "Grant them permanent presence; establish a Balance Mission at the border markets"
 haless.703.b: "Restrict their influence; enforce trade control"
 haless_goldscale_embassy: "Goldscale Embassy"

 haless.704.t: "Frontier Echoes"
 haless.704.desc: "Along the mountain frontier where Beikling meets Jiangyang, watch posts and forts have stood since ancient times—repaired yearly, manned by generations of soldiers. When wind sweeps the ridgeline, some claim to hear faint thunderous steps of giant birds from deep in the steppe—whether enemy riders or echoes of old wounds, none can say.\n\nThough no major conflict has broken out in recent years, alarms still come from the passes and rivers guarded here. A frontier commander now petitions to reinforce key outposts and rotate in more troops. Meanwhile, local officials propose a “Frontier Labor Mandate,” calling on registered peasants to aid patrols in the off-season to offset shortages.\n\nThough concerning only part of the border, the plan has stirred debate in the capital: grant on-the-spot authority to strengthen defenses, or act cautiously to prevent militia practices from spreading?"
 haless.704.a: "Reinforce the forts and deploy more troops"
 haless.704.b: "Implement communal rotation duties"
 haless.704.c: "Maintain the current posture"
 haless.704.d: "Host caravans and organize frontier trade"
 haless_fortified_line: "Fortified Line"
 haless_trade_hub: "Trade Hub"

 haless.705.t: "Tea Traditions of North and South"
 haless.705.desc: "Tea is more than a commodity—it is a part of life in Yanshen.\n\nAs tea-producing regions in both Naamjyut and Beikling continue to flourish, public debate grows over what defines the proper “Way of Tea.” In Beikling, emphasis is placed on water temperature, fire timing, and seasonal rhythms of the mountains—favoring restraint and discipline. In Naamjyut, by contrast, aroma and presentation reign supreme, blending forest aesthetics with artistic display.\n\nEvery few years, merchants and scholars from both regions hold informal tea competitions and exhibitions, sometimes even attracting the attention of high officials. Among the people, this has come to be known as the “Northern–Southern Tea Duel.”\n\nThis year, such an exchange unfolds under your rule. Local officials and trade guilds now request official recognition and guidance to represent their preferred regional styles. How will you respond?"
 haless.705.a: "Encourage mountain rituals to promote the Beikling culture"
 haless.705.b: "Endorse the Southern elegance in favor of the Jyut"
 haless.705.c: "Let both traditions flourish in open competition"
 haless_beikling_tea: "Beikling Way of Tea"
 haless_favoring_northern: "Favoring Northern Tea"
 haless_southern_tea: "Southern Tea Aesthetics"
 haless_favoring_southern: "Favouring Southern Tea"
 haless_contending_tea: "Contending Ways of Tea"
 haless_fusion_tradition: "Fusion of Tea Traditions"

 haless.706.t: "The Colors of the Jungle, the Shadows Beneath the Roof"
 haless.706.desc: "Dyes come from vines and mosses; motifs echo the markings of mist-worms and the veins of rainforest leaves. Homes stand by the forest, with rain from woven bamboo eaves falling clear of skirt and robe.\n\nAmong the Naamjyut, such patterns and aesthetics are deeply rooted in the daily lives of both commoners and artisans.\n\nThough generations in Yanshen have brought customs and values close to those of other Yanshen cultures, the Naamjyut remain a distinct branch, shaped by unique geography and history into a vivid artistic style. Dense forests, broad hills, and poor roads have kept their craft from spreading widely, yet preserved a rare local charm.\n\nFrom time to time, weaving officials or guild envoys visit, recording patterns for reproduction and trade. As with other regional crafts in Yanshen, Naamjyut textiles are gradually entering broader cultural exchange.\n\nYet as this jungle-born design language gains reach, debate stirs: is it the proud continuation of local craft, or an unstandardized evolving style?\n\nFaced again with such a dispute, will you respond?"
 haless.706.a: "Establish standards and officially recognize the style."
 haless.706.b: "Let it be used freely without official sanction."
 haless.706.c: "This is not something we need to concern ourselves with."
 haless.706.d: "Vigorously promote our cultural identity."
 haless_official_naamjyut: "Official Naamjyut Artistic Standards"
 haless_unregulated_naamjyut: "Unregulated Naamjyut Goods"
 every_naamjyut_province_tt: "Every owned §YNaamjyut§! province receives the following:"
 haless_ignored_naamjyut: "Ignored Naamjyut Art"
 haless_aggressive_naamjyut: "Aggressively Promoted Jungle Aesthetics"
 haless_exotic_naamjyut: "Exotic Naamjyut Attire"

 haless.707.t: "Ballads Beyond Understanding"
 haless.707.desc: "The dialects of Naamjyut are notoriously intricate—tones shift from mountain to mountain, and the melodies of children's songs differ even between neighboring forest villages.\n\nEvery so often, the issue of “language unification” resurfaces in local governance—some regional officials propose standardized pronunciation to improve administrative efficiency and coordination.\n\nYet the elders always resist.\n\nThey say: “If my mother’s lullaby is sung in a different tune, it’s no longer the song of my home.”\n\nMust language be made uniform? Or should songs remain shaped by the mountain winds?"
 haless.707.a: "Standardizing tongue is necessary. Civil officials must learn the capital dialect."
 haless.707.b: "Let village songs remain. We will slow the push for standardized speech."
 haless.707.c: "Adapt the written communication system to accommodate as many as possible."
 haless_language_promotion: "Language Promotion"
 haless_gradual_standardization: "Gradual Linguistic Standardization"
 haless_smooth_communication: "Smooth Communication"
 haless_accommodation_local: "Accommodation of Local Speech"

 haless.708.t: "Voices Beneath the Canopy"
 haless.708.desc: "Dn vine-covered forests, old tongues still murmur. Among Naamjyut hillfolk, artisans, and spirit-guides, many still use Kai words, songs, and storytelling. Incense at festivals, totemic cloth, and burial rites all echo distant Kai traditions. Though long part of Yanshen culture, Kai-descended Naamjyut have not cut ties with the old realm beyond the mountains. Some clans keep kinship there; spirit-guides preserve ancient prayers; traders bring Kai incense and charm-scrolls through passes, known to elders. As Kai’s politics shift and Yanshen unifies, some fear such links may sway Naamjyut’s governance; others see them as heritage. Recently, one tribe’s close dealings with the Kai drew wide debate. Will you respond?"
 haless.708.a: "Let the forest tongue be. It has its own path."
 haless.708.b: "Restrain these exchanges. The forests must remain orderly."
 haless.708.c: "Build the forest roads—let the mountain speak to the mountain."
 haless_tolerated_woodland: "Tolerated Woodland Traditions"
 haless_suppressed_forest: "Suppressed Forest Speech"
 haless_road_old: "Road to the Old Realm"

 haless.709.t: "The Prosperous Yanhe"
 haless.709.desc: "Since ancient times, the banks of the Yan River have been the most prosperous lands in all of Yanshen. The broad and tranquil river teems with merchant vessels laden with rare goods, carrying wares from the borderlands and even distant Samokhex to the celestial capital of Tianlou. This trade route was once maintained and modified by the empires of Harimor and Jaher to transport troops and grain. Even after their fall, the Yan River has continued to flow silently, nourishing the lands of Jiangszun.\n\nThe impact of this trade reaches far beyond merchants and the nobles who enjoy such luxuries—it has transformed many of the cities along the Yan. Their people, more than others in Yanshen, have grown fond of worldly pleasures. Dockworkers unload cargo through the day, then spend their generous pay reveling in the city’s delights. These cities are filled with wine-houses, theaters, and exotic shops that remain open deep into the night. Their shimmering lights reflect upon the river, leading foreign visitors to marvel and name them “cities that never sleep.”"
 haless.709.a: "Thriving commerce enriches the realm."
 haless.709.b: "Let the world know of this glory."
 haless.709.c: "Ensure this brilliance lasts forever."
 FROM_YANHE_PROVINCES_TT: "from the development of provinces along the §YYanhe§! in §YYanshen§!"
 distribute_dev_among_yanhe_provinces_tt: "Distribute §Y10§! development randomly among §YUrban§! provinces along the §YYanhe§!"

 haless.710.t: "Descendants of the Waters"
 haless.710.desc: " For generations, the people of Jiangszun have lived along the Yanhe. This mighty river, running across the heart of Yanshen, nourishes not only fertile fields but also bustling towns and constant flows of merchants. “Those who gain the water thrive; those who lose it fall into ruin.”—so goes the saying of Jiangszun’s ancestors.\n\nBut the bounty of the Yanhe has never been without risk. Flooding from heavy rains, siltation from drought, and the decay of neglected tributaries all threaten navigation and irrigation. Every generation must rise to the task of maintaining the river’s breath and pulse.\n\nIn recent years, the section near [jiangszun_city_province.GetName] has again shown signs of trouble. Be it flooding or blockage, boats struggle to pass, and irrigation fails. Local officials and town representatives jointly petition for funding to repair levees, dredge channels, and restore locks. Some merchant guilds have offered to assist financially.\n\nHow shall we respond to this appeal concerning the lifeblood of the Yanhe?"
 haless.710.a: "Mobilize the laborers and clear the river."
 haless.710.b: "Enlist the guilds, share the returns."
 haless.710.c: "This is not a priority at present."
 haless_river_laborers: "River Repairs by Laborers"
 haless_river_guilds: "River Repairs by Guilds"
 haless_river_joint: "Joint Yan River Effort"

 haless.711.t: "Broken Dike, Stagnant Waters"
 haless.711.desc1: "A long-neglected stretch of the Yanhe has gradually dried up near [jiangszun_city_province.GetName]. Once-bustling docks now stand exposed as sandbanks rise and fishing boats run aground. Freight traffic is forced to reroute, making the trade of rice and grain a difficult endeavor, and local market prices have spiraled into chaos.\n\nSome boatmen have already left in groups, seeking work downstream. The old saying returns to popular memory: “Where boats cannot go, the people do not dwell.”"
 haless.711.desc2: "Weeks of heavy rainfall have finally breached the weakened levees near [jiangszun_city_province.GetName]. Several downstream villages now lie underwater—paddy fields are thick with mud, homes have collapsed, and residents have fled for higher ground.\n\nThough not a catastrophic flood, the waters refuse to recede. Rumors of disease are spreading, and merchants have lost confidence in the region. Both cargo flow and tax income have plummeted."
 haless.711.a: "We should have repaired it sooner..."
 haless.711.b: "We can only try to contain the damage now..."
 haless.711.c: "We must draft a comprehensive restoration plan."
 haless_river_dried: "River Mouth Dried Up"
 haless_major_flooding: "Major Flooding"

 haless.712.t: "The Voice of the Field Assembly"
 haless.712.desc: "Among the villages of the Yanhe basin, it is common for Jiangszun farmers to form self-organized “Field Assemblies” (Tianhui) to discuss matters such as seasonal plowing, rotational irrigation, granary reserves, and grain tax allocations. Though lacking official recognition, these grassroots gatherings often exert significant influence on local agricultural planning.\n\nRecently, several such assemblies along the Yanhe have jointly submitted a petition. They request formal representation at the township level, with a seat at advisory councils to deliberate on waterworks, taxation, and the division of common lands.\n\nThis is not the first such proposal—nor is it isolated. As these assemblies become more stable across regions, their demands for institutional presence have grown. Some local officials support the idea, citing improved governance and cooperation. Others warn that such inclusion may disrupt the established power structure of towns and introduce new instability.\n\nShall we heed these voices from the fields?"
 haless.712.a: "Let the Tianhui speak."
 haless.712.b: "Absorb them quietly; appoint their leaders as officials."
 haless.712.c: "This is overreach. Suppress such assemblies."
 haless.712.d: "Ensuring the needs of the people comes first."
 haless_speaking_farmers: "Speaking for the Farmers"
 haless_puppet_farmers: "Puppeting the Farmers"
 haless_angry_farmers: "Angry Farmers"
 haless_mandate_people: "Mandate of the People"

 haless.713.t: "Graceful Melodies by the Lakeside Stage"
 haless.713.desc: "In the midstream of the Yanhe, the Celestial Lake lies like a smoky mirror nestled among the hills. Spanning several counties, it glistens with clear blue waves and scattered fishing boats—one of the most iconic sights in all of Yanshen.Towns along its banks thrive on the lake’s bounty. Fishing booms, and boats carry goods between markets and temples. Each year, as spring fades into early summer, and the lake winds turn mild, locals host the “Ten Days of Floating Theater.” Fishing halts, rafts are moored in the shallows, and commoners and nobles alike gather on the shores to watch plays performed over the water.\n\nThese plays are drawn from Jiangszun legends, river spirit myths, and tales of the Blue Sashes. Their lyrics are refined, their gestures sharp. They have long transcended entertainment—becoming part of the cultural soul of Yanshen."
 haless.713.a: "Off we go to the show!"
 haless.713.b: "Keep an eye out for gifted lyricists and composers."
 haless.713.c: "I’ll write a scene myself."
 haless_opera_craze: "Opera Craze"

 haless.714.t: "The Great Weaving Exhibition"
 haless.714.desc: "A grand contest of silk weaving has begun along the Yanhe, drawing together renowned artisans and master weavers from across the land. The event features two stages: a public exhibition of submitted samples and a final jury review. Brilliant ribbons cross the air, and patterns shimmer in the lamplight—stopping passersby in their tracks.The techniques on display span a rich spectrum. Some excel in tightly woven fabrics with intricate, enduring motifs. Others favor airy, flowing textures that dance with light. A few bold workshops introduce experimental methods, blending dyed threads or incorporating mixed materials for dazzling new effects.\n\nCrowds gather, debate erupts—awed spectators, artisans, and merchants dispute the merits of each style. Now that the contest has concluded, one style has emerged triumphant… or perhaps all have?"
 haless.714.a: "The structured traditional weave wins the day."
 haless.714.b: "The light and graceful style sways the judges."
 haless.714.c: "Every form has its place."
 haless_conventional_silkwork: "Intricate (but Conventional) Silkwork"
 haless_loose_silkwork: "Graceful (but Loose) Silkwork"
 haless_best_silkwork: "Graceful and Intricate Silkwork"

 haless.715.t: "A Fearsome Administrator"
 haless.715.desc: "In recent years, a gifted administrator trained in eunuch academies has gained renown. Skilled in tax calculation and judgment, he has, in three years, reorganized granaries, surveyed lands, repaired canals, and reformed labor and levy rules—each task meticulously overseen to completion.\n\nGrain yields have risen, rivers run clear, and accounts balance. Merchants and assemblymen praise him: “Ten years’ work in three—truly a statesman.” Some urge his methods be compiled into a new Administrative Canon; others see him as a model to solve the shortage of capable officials.\n\nYet concerns grow. Power concentrated in his hands leaves little oversight; he commands appointments, levies, decrees, and judgments alone. One warns, “A eunuch may nourish the vessel; but if he becomes the lifeblood, who restrains him?” Another says, “When rule by man outweighs rule by law, statutes bend to one will.”\n\nShall his authority be embraced and spread, or curbed before excess takes root? The choice is yours."
 haless.715.a: "Promote his system; let all officials learn from it."
 haless.715.b: "Grant him a title, and embed his practices into law."
 haless.715.c: "No administration should depend on one man."
 haless_model_eunuch: "Model Eunuch Administrator"
 random_adm_3_discounted_advisor_tt: "Gain a random skill §Y3§! §Gdiscounted§! §YAdministrative§! advisor"
 random_adm_2_discounted_advisor_tt: "Gain a random skill §Y2§! §Gdiscounted§! §YAdministrative§! advisor"
 random_adm_1_discounted_advisor_tt: "Gain a random skill §Y1§! §Gdiscounted§! §YAdministrative§! advisor"

 haless.716.t: "Harsh Eunuch, Heavy Taxation"
 haless.716.desc: "In a certain place within the country, a eunuch-born administrator has recently assumed local governance. Under the banner of "rectifying tax rolls and cleansing corruption," he has quickly erased fiscal deficits. However, his methods are brutal — levying excessive taxes, seizing merchant ledgers, and meddling in private trade and inheritance. Rumors suggest he enslaves the poor and seizes warehouses for personal use. The markets lie quiet; travelers detour the region.\n\nA popular saying spreads: "Beneath the hat lies only bone," mocking his homely appearance and ruthless actions. Even local elites and Tianlou's Xuezhefang have joined voices in protest, accusing him of abusing authority and oppressing the people.\n\nThe eunuch defends himself: “To fear public unrest is to abandon the duties of governance. If discipline falters, the whole bureaucracy will collapse.” His tone veils a warning — punish him too harshly, and others may avoid civil service altogether.\n\nShall we value his results, or root out a growing rot?"
 haless.716.a: "Dismiss him and investigate the charges."
 haless.716.b: "Let him be."
 haless.716.c: "Launch a legal crackdown to set an example."
 haless_crackdown_eunuch: "Crackdown on the Eunuchs"
 haless_injustice_redressed: "Injustice Redressed"
 haless_arrogant_eunuch: "Arrogant Eunuchs"
 haless_eunuch_abuses: "Eunuch Abuses"
 haless_defiant_eunuch: "Defiant Eunuchs"
 haless_purge_injustice: "Purge of Injustice"

 haless.717.t: "The Flowing Years Poetry Assembly"
 haless.717.desc: "The Yanzhong region has long been the heart of Jiangszun’s poetic tradition, where styles meet and talents flourish.\n\nTo the west, poetry rings bold and sorrowful—of metal, stone, and far frontiers. To the east, verses flow with elegance and feeling, painting nature and emotion. Though distinct, these traditions thrive together: poets trade verses across the winds and debate meaning, enriching a shared spirit.\n\nAs the realm grows, new lands bring fresh voices. Once-unknown regions now yield poets of note, each with their own dialects, imagery, and sensibilities. Scholars collect and annotate these works, preserving a bloom that transcends any single school.\n\nIn recent years, poetry has flourished across Yanshen—from Jiangszun masters to Beikling singers, Naamjyut forest poets to Szitu lyricists, fine verse spreads far.\n\nNow a new movement rises: the Yanshen Grand Poetry Assembly—an ambitious gathering to celebrate the finest works of this age."
 haless.717.a: "Classic Rhymes Revived: Ancient Tones from the Upper Frontier"
 haless.717.b: "Eastern Breeze of Verse: Riverbank Elegance"
 haless.717.c: "Golden Sounds and Jade Resonance: Ancient Tones of Jiangyang"
 haless.717.d: "Seven Syllables of the Cold Mountains: Beikling High Chants"
 haless.717.e: "Intricate and Rigorous: Gangim’s Rhetorical Tradition"
 haless.717.f: "Bright as the South Wind: Naamjyut Verses"
 haless.717.g: "Martial Songs and Short Verse: Legacy of Szitu"

 haless.718.t: "Classic Rhymes Revived"
 haless.718.desc: "In the ancient borderlands, barren hills stretch across the horizon. Beneath their worn soil lie the remnants of the long-lost Longcheng and the tombs of ancient emperors. It is said that the poems of this land were once passed down directly by the Dragon Emperor, and among all the poetry traditions of Yanshen, none are older.Their verses resound with strength, their language is dense and solemn. Some lament the life of soldiers stationed far from home, evoking the snow and desolation of the frontier; others tell of the hardships of the common folk, laboring in the fields, weathering the years.\n\nThis year, officials traveled across the borderlands to collect verses both old and new. What they gathered has spread far and wide —Some echo the fading laments of garrison soldiers, piercing the soul;Some weep with the sorrow of women and scholars, each word deeply felt;\n\nSome speak the thoughts of boatmen, plain and true.What poem was recorded this year?\n\nPerhaps within it lies the heart of the borderfolk — and the pulse of Yanshen itself."
 haless.718.a: "[Root.Get_Haless_718_A]"
 haless.718.a_1: "We gather bracken as it springs – But when return? Not till next year’s end."
 haless.718.a_2: "The millet drooped in sorrow, The sacred grain began to grow."
 haless.718.b: "[Root.Get_Haless_718_B]"
 haless.718.b_1: "Peach trees are fresh and young//Its flowers are flamboyant…"
 haless_718_b_1_tt: "This maiden is going to be a bride\nAnd she will get along with her future home\n--------------"
 haless.718.b_2: "Big rat, big rat, no more of my grain."
 haless_718_b_2_tt: " For three long years I’ve fed you – and you’ve never cared for me!\n--------------"
 haless.718.c: "[Root.Get_Haless_718_C]"
 haless.718.c_1: "No clothes? I’ll share my robes. The lord raises troops;"
 haless_718_c_1_tt: "I ready my spear — And stand with you.\n--------------"
 haless.718.c_2: "My chariots are equipped, My horses are yoked."
 haless_718_c_2_tt: "The four steeds are strong, And we set out to the east.\n--------------"
 haless.718.d: "[Root.Get_Haless_718_D]"
 haless.718.d_1: "With pleased sounds the deer call to one another, eating the wild duckweed…"
 haless_718_d_1_tt: "I have here admirable guests; the lutes are struck, and the mouth-organ is blown.\n--------------"
 haless.718.d_2: "Look at those recesses in the banks of the Qi…"
 haless_718_d_2_tt: "With their green bamboos, so fresh and luxuriant!\nThere is our elegant and accomplished prince—\nAs from the knife and the file,\nAs from the chisel and the polisher!\nHow grave he is, how dignified!\nHow commanding, how distinguished!\nOur elegant and accomplished prince—\nNever can he be forgotten!\n--------------"

 haless.719.t: "Eastern Breeze of Verse"
 haless.719.desc: "As the eastern wind sweeps through Yanzhong, poetry follows in its wake.\n\nIn recent years, the provinces east of Jiangszun have seen a surge in refined literary spirit. Scholars and poets meet to recite and discuss; salons gather by lakeside pavilions, and verse contests enliven city outskirts. East of Yanzhong, the style grows ever more delicate, skilled in evoking feeling and depicting scene — the quiet of forests and mountains, the stillness of lantern light behind drawn curtains. The language is gentle yet firm, the sentiment distant yet unmelancholy, drawing emotion from landscape and setting ambition beyond the material.\n\nVerses drift through open windows, spoken by farmers and woodcutters alike. Scholars compete to record fine lines; literary societies praise new works. Even in boudoirs and among children at play, stanzas are easily recalled. The flourishing of “eastern verse” now rivals the classical tradition.\n\nThis year’s chosen works range from tender and graceful to ethereal and serene, or bright and self-contained. Which will be crowned the true voice of elegance in this eastern breeze of verse?"
 haless.719.a: "[Root.Get_Haless_719_A]"
 haless.719.a_1: "From dreams I wake — the tower’s gates are locked,"
 haless_719_a_1_tt: "The wine is gone, the curtain hangs slack\nLast year’s sorrow returns with spring again:\nAmid falling blossoms, one stands alone,\nWhile in the light rain, swallows fly in pairs.\n--------------"
 haless.719.a_2: "What grief can you bear?"
 haless_719_a_2_tt: "Like a river of spring water, it flows eastward, endlessly.\n--------------"
 haless.719.b: "[Root.Get_Haless_719_B]"
 haless.719.b_1: "Where am I when I wake from wine tonight?"
 haless_719_b_1_tt: "By the river, where willows grow and the moon lingers in dawn’s wind.\n--------------"
 haless.719.b_2: "Flowers fall, and I cannot stop them—"
 haless_719_b_2_tt: "But swallows, so familiar, return again\n--------------"
 haless.719.c: "[Root.Get_Haless_719_C]"
 haless.719.c_1: "Pay no mind to wind and rain beating through the forest—"
 haless_719_c_1_tt: "Let me sing aloud as I stroll along\nWith a bamboo cane and straw shoes, I go lighter than a horse.\nWhy fear? Let the mist and rain fall — I’ll live freely.\n--------------"
 haless.719.c_2: "People have sorrow and joy, separation and reunion…"
 haless_719_c_2_tt: "The moon has dimness and brightness, waxing and waning.\nSuch things have never been perfect since ancient times.\nMay we all be blessed with longevity —\nAnd though miles apart, we’ll share the beauty of the moon together.\n--------------"

 haless.720.t: "Golden Sounds and Jade Resonance"
 haless.720.desc: "Since ancient times, Jiangyang has stood as Yanshen’s northeastern bulwark — a land of mountain passes and ocean gates, rich in terrain and spirit. Here, people live armed, their lives bound with defense and culture. Between fortresses and harbors, the region breeds loyal warriors and heartfelt poetry.\n\nThe people are earnest; their customs embrace song and verse, often expressing joy and sorrow. The Yuefu form prevails, with five-syllable lines shaping deep reflection. Each year, wind sweeps from the north, rustling grass like clashing armor. Soldiers hear wind and horses in the night — echoes of battles past.\n\nAs before, officials collect songs to preserve the people’s voice. This year’s melodies from military villages and mountain hamlets are stirring — old words sung anew, filled with sorrow and pride. The ballads speak of distant memories or present passions.\n\nWhat verses were recorded? In each word, the spirit of Jiangyang resounds — echoing between mountains and seas."
 haless.720.a: "[Root.Get_Haless_720_A]"
 haless.720.a_1: "I sing, and the moon lingers on…"
 haless_720_a_1_tt: "I dance, and my shadow scatters. When sober we share our joy, when drunk we go our separate ways. Let us pledge a journey beyond emotion — to meet in the distant Astral Sea.\n--------------"
 haless.720.a_2: "Thinking of you has aged me…"
 haless_720_a_2_tt: "Time has flown so fast. Let’s not speak of what is lost — just eat and drink well, and carry on.\n--------------"
 haless.720.b: "[Root.Get_Haless_720_B]"
 haless.720.b_1: "Ten thousand miles to the frontlines I rode, crossing mountain passes like flying…"
 haless_720_b_1_tt: "Northern winds ring the metal watch-drums, cold moonlight gleams on iron armor.\n--------------"
 haless.720.b_2: "Scarlet fruits fall in fierce winds, profuse blossoms scatter in pale autumn."
 haless_720_b_2_tt: "On the narrow road, the jeweled canopy tilts; startled steeds shatter the twin shafts.\nWho would have thought that steel, forged a hundred times,\nCould soften to silk 'round a finger’s touch?\n--------------"
 haless.720.c: "[Root.Get_Haless_720_C]"
 haless.720.c_1: "Our life won’t last a hundred years…"
 haless_720_c_1_tt: "Yet we worry as if we lived a thousand. Days are short and nights are long — why not roam with torch in hand?\n--------------"
 haless.720.c_2: "Strive while time is ripe — for time waits for no one."

 haless.721.t: "Seven Syllables of the Cold Mountains"
 haless.721.desc: "North of Upper Yanshen, the Cold Mountains stretch deep toward the Demon Hills, forming a key barrier of Yanshen. In Beikling, snow piles in ravines, wind scours pine and stone, and copper and iron run beneath. Its people excel in mining and tea-making, known since old as “land of ancient iron and mountain tea, between fire and cold spring.”\n\nThough remote, their literary spirit endures. Beikling folk are strong and sharp, favoring seven-syllable verse, vigorous and lofty. Some liken forest and mountain to steadfast solitude; others reflect on mines, casting truths of human rise and fall with concise force. Each line is like molten iron — powerful, rugged, noble, distinct from softer southern rhymes.\n\nThis year, scholars met at the Cold Mountain forum, compiling Seven Syllables of the Cold Mountains to honor the snowy range. Their words are solemn, fiery, like ore in the forge or frost on granite — carrying the resolve of ice and flame, the hearts of iron and stone. Some verses burn, others speak with frosted clarity, yet all voice the soul of Beikling. Which line shall mark this year’s Words of the Cold Mountains?"
 haless.721.a: "[Root.Get_Haless_721_A]"
 haless.721.a_1: "Why should a man not wear his Wugou sword,"
 haless_721_a_1_tt: "And reclaim the fifty prefectures lost beyond the passes?\n--------------"
 haless.721.a_2: "If only Flying General were stationed at Long Cheng"
 haless_721_a_2_tt: "No Nomadic Cavalry would dare cross Demon Hills.\n--------------"
 haless.721.b: "[Root.Get_Haless_721_B]"
 haless.721.b_1: "Late at night..wind through bamboo knocks out the autumn’s rhythm —"
 haless_721_b_1_tt: "...Thousands of rustling leaves, all seem to whisper sorrow.\n--------------"
 haless.721.b_2: "Pity the bones by the River of No Return,"
 haless_721_b_2_tt: "Still they haunt the dreams of boudoir women in springtime.\n--------------"
 haless.721.c: "[Root.Get_Haless_721_C]"
 haless.721.c_1: "Though green mountains divide us, we share the same clouds and rain;"
 haless_721_c_1_tt: "The bright moon, when has it ever shone on only one village?\n--------------"
 haless.721.c_2: "Suddenly, like a spring breeze in the night,"
 haless_721_c_2_tt: "(Snow like) thousands upon thousands of pear trees burst into bloom\n--------------"

 haless.722.t: "Intricate and Rigorous"
 haless.722.desc: "The elegance of the Yanshen Coast is famed for intricate lines and rigorous form.\n\nFor generations, the Gangim have lived by river and sea, nurtured by the Yan River’s spirit and known for talent through the ages. They honor invention and exploration, seeing craft and principle as noble, with mechanical skill and theoretical change as the true path of knowledge.\n\nScholars favor symmetry and precision, casting new ideas into refined rhetoric. Insights appear in parallel couplets, often in the fu style — structured, symbolic, yet never ostentatious.\n\nGangim prose may detail ship mechanics or water flow with clarity; explore celestial instruments and astronomy with order; or wander mountains and rivers, using metaphor for philosophy. Every couplet matches, every word is placed with care. Their work prizes reason over emotion, innovation without losing grace — a rigorous, distinct current in Yanshen letters.\n\nThis year, scholars on the coast compiled a hundred new fu. The language is grand, the ideas ingenious — some delve into logic, others turn words like gears. Which shall best represent today’s Gangim?"
 haless.722.a: "[Root.Get_Haless_722_A]"
 haless.722.a_1: "Draw diagrams to express their form, craft words to describe their design."
 haless.722.a_2: "Devise with ingenuity to craft instruments, exhaust subtle reasons to shape writings."
 haless.722.b: "[Root.Get_Haless_722_B]"
 haless.722.b_1: "What once brought joy, now with a glance has become the past;"
 haless_722_b_1_tt: "I cannot help but feel sorrow for it —\nLet alone that life and death follow their course, and all must end eventually!\n--------------"
 haless.722.b_2: "I am but a mayfly between heaven and earth, a mere grain upon the vast sea."
 haless_722_b_2_tt: "I grieve the fleeting moment that is life, and envy the great long river, flowing on forever.\n--------------"
 haless.722.c: "[Root.Get_Haless_722_C]"
 haless.722.c_1: "Later generations mourn, yet fail to take warning,"
 haless_722_c_1_tt: "Thus causing later generations to mourn them as well.\n--------------"
 haless.722.c_2: "Unmoved by gain, unswayed by loss;"
 haless_722_c_2_tt: "In high office, he worries for the people;\nIn seclusion, he worries for his lord.\n--------------"

 haless.723.t: "Bright as the South Wind"
 haless.723.desc: "In the southern reaches of Yanshen, dense forests rise, their branches lush and leaves thick, where rain and dew turn into mist. The peoples of Naamjyut dwell among these jungles and ravines, moving by mountain trails and riverboats. Living close to flora and fauna, they are innately perceptive and expressive — born poets, with a gift for song and word.\n\nTheir literary tradition reveres the Chu-style poetry — enigmatic, resonant, and refined. They delight in using fragrant herbs to symbolize virtue, and rare birds to convey emotion. Their verses are lavish and vivid, painting vibrant natural scenes, pouring deep sentiment into long, winding lines. Each composition bursts like blossoms after the rain, glowing with color; or covers like the morning mists, layered and evocative.\n\nIn recent years, Naamjyut writing has grown ever more ornate—rooted in ancient literary traditions, yet surpassing them in emotional depth and expressive brilliance. Their poetry is rich in feeling and vast in imagery, adorned with such vibrant language that even the classics seem to pale in comparison.\n\nNaamjyut culture holds the tea ritual in high regard. Their rainforest-grown teas are exceptionally prized, and the art of their preparation is intricate. In the act of tea-drinking, poetry naturally emerges—each sip brings forth a verse, each leaf stirs a vision. Tea, verse, and jungle blend into a harmonious symphony of elegance.\n\nThis year, poets have traveled to Naamjyut, collecting scrolls of verse, each brimming with spiritual charm. These are now gathered together — and from among them, one shall be chosen as “The Verse of the Year from Naamjyut.”"
 haless.723.a: "[Root.Get_Haless_723_A]"
 haless.723.a_1: "O see how she beams and how sweetly smiles!"
 haless_723_a_1_tt: "Her grace inspires love, delight so bountiful.\n--------------"
 haless.723.a_2: "Morning I drink the dew-fallen magnolia,"
 haless_723_a_2_tt: "Evening I sup on fallen chrysanthemum blooms.\n--------------"
 haless.723.b: "[Root.Get_Haless_723_B]"
 haless.723.b_1: "Come back, spirit! The South is no place to tarry."
 haless_723_b_1_tt: "Ice mounts high and flies in thousand-mile snow.\n--------------"
 haless.723.b_2: "Ah, Autumn's sorrowing breath! Wilted grasses shiver in the wind."
 haless.723.c: "[Root.Get_Haless_723_C]"
 haless.723.c_1: "In primordial age, who first taught the Way?"
 haless_723_c_1_tt: "Before sky and earth took shape—how can we know?\n--------------"
 haless.723.c_2: "Dawn’s light arises in the eastern sky,"
 haless_723_c_2_tt: "Illuminates the balustrade westward high.\nCalm my steed and ease its pace,\nBrightly glows the night, its tranquil grace.\n--------------"

 haless.724.t: "Martial Songs and Short Verses"
 haless.724.desc: "The hills of Xianjie stretch endlessly, their paths winding through the clouds. Since ancient times, this has been the land of sects and martial orders. The great schools of the Xia each claim their territory here, befriending through blade, debating through path — earning the land the name: “the realm of martial clans.”\n\nHere, poetry does not follow rigid rules. Scholars draw from swordplay to compose their verses — in mountain wanderings or drunken debates, brush strokes fall into place. Their lines do not chase rhyme or couplets, nor cling to regulated tones. They seek only to express will and emotion — where thought leads, words follow. Some shout their grief, some proclaim joy; some lament the vast heavens, others swear upon life and death. These are called the “short verses” of the martial world.\n\nTheir poems are free yet ordered, rising like a sudden wind, running like a rainbow's arc. A single page may hold a lifetime of feeling; a few words can seal the heart. As they say in the martial world:\n\n“One who has no fixed form but holds true spirit — that is the true Xia.”\n\nThis year’s Xianjie poetry gathering was held atop a cliff. Disciples from many sects came to present their verses. Some wrote of parting from friends, others of honor repaid with bold action, others of secluded practice among lonely peaks. Their tones are proud, serene, solemn — each worthy of being passed down among the jianghu.\n\nThree such verses now rise to the forefront, all widely acclaimed.\n\nBut tell us — which of them best represents the spirit of a true Xia this year?"
 haless.724.a: "[Root.Get_Haless_724_A]"
 haless.724.a_1: "The dew on the chives—"
 haless_724_a_1_tt: "how easily it dries; though gone today, it returns tomorrow—yet once a person dies, when shall they return?\n--------------"
 haless.724.a_2: "In the field of mugwort, whose land is this?"
 haless_724_a_2_tt: "Souls—both noble and base—are gathered alike. How urgent the Death-Lord’s bidding—no life can linger even a moment.\n--------------"
 haless.724.b: "[Root.Get_Haless_724_B]"
 haless.724.b_1: "My ‘five-flowered steed’ or rich fur are each worth a thousand pieces of gold,"
 haless_724_b_1_tt: "Call the servant to get us good wine, let him sell these,\nTogether we’ll end the cares of ten thousand years.\n--------------"
 haless.724.b_2: "O Let’s all drink and sing our song — In your life could you live years long?"
 haless.724.c: "[Root.Get_Haless_724_C]"
 haless.724.c_1: "Where are the great men of the past//And where are those of future years?"
 haless_724_c_1_tt: "The sky and earth forever last;\nHere and now I alone shed tears.\n--------------"
 haless.724.c_2: "Till mountains crumble,"
 haless_724_c_2_tt: "rivers run dry, winter thunders, summer snows, earth and sky unite—only then will I dare to part from you.\n--------------"

 haless.725.t: "New Fields Beyond the Fort"
 haless.725.desc: "In the borderlands between North Yanshen and Shuvuush, hills roll across landscapes of forest and grass. This region has long served as both frontier defense and a haven for migrants — a place of both cultivation and conflict. Old forts lie in ruin, the flames of war extinguished, yet the land still waits for revival.\n\nRecently, a retired military settler in his sixties gathered old comrades and kin to reclaim a patch near a ruined border fortress. They dug irrigation canals, diverted a tributary of the Yanhe, and raised earthen dams and wooden bridges. Over ten families have now settled, bringing their own oxen and tools to build homes and till fields — a budding village in the making.\n\nThis caught the attention of local officers. Some praise their “diligence in both defense and cultivation,” hailing them as examples for frontier recovery. Others, however, warn of disorder if unofficial settlement continues without state sanction.\n\nA border commander now petitions the court: should we recognize this act of reclamation, grant official registration, and award them state farmland as a reward for their self-driven frontier revival?"
 haless.725.a: "Grant them household status and establish a frontier hamlet."
 haless.725.b: "Enforce military regulations. Private reclamation is forbidden."
 haless.725.c: "Peace has returned. Let civil settlement expand."
 haless_reclamation_settlement: "Emerging Reclamation Settlement"
 haless_reclamation_suppressed: "Reclamation Suppressed"
 haless_formal_reclamation: "Formal Reclamation Program"

 haless.726.t: "Fortress Sparring Meet"
 haless.726.desc: "In the hills and valleys of northwestern North Yanshen, fortresses and mountain towns dot the rugged terrain. Isolated and hard to reinforce, the locals have long developed a habit of self-reliance. Martial gatherings are a common tradition: at seasonal festivals, villagers compete in bouts held before temple courtyards or inside walled compounds.\n\nThese duels are not simply tests of strength but follow inherited codes of respect and technique — bowing before each match, ceasing before injury. Lineages are preserved through master-disciple registers, earning this region the name "Little Martial World of the North."\n\nRecently, a routine meet was disrupted by a military officer, claiming “unauthorized assembly” and “disrupting order.” In the resulting scuffle, a young martial artist was injured, nearly inciting a riot. Since then, unrest has stirred among the fortress towns.\n\nThe elder master who led the gathering has submitted a petition, asking for official recognition of these martial societies. He proposes a registry system and oversight to integrate them under state rule — preserving traditions while preventing disorder.\n\nShall we legitimize this legacy of blades and discipline?"
 haless.726.a: "Issue the Martial Society Edict and approve it."
 haless.726.b: "Dissolve the martial societies and ban mass gatherings."
 haless.726.c: "Approve the petition and send new recruits to train together."
 haless_martial_society: "Martial Society Edict"
 haless_jiangyang_arts: "Jiangyang Martial Arts"
 haless_suppressed_organizations: "Suppressed Local Organizations"
 haless_martial_expansion: "Martial Society Expansion"
 haless_jiangyang_evolved: "Jiangyang Martial Arts Evolved"

 haless.727.t: "Six Garrisons Reformed"
 haless.727.desc: "Yanshen’s military strength is rooted in six key regions, each with its own strategy and tradition. Bianfang guards the western border with disciplined, swift-moving troops; Szicheng, in the heartland, houses the Grand War Camp and oversees mobilization; Jiantsiang defends the northeast, known for its strict order and role in holding off nomads and ancient threats. Gushibi hosts the Stone Army Alliance and gathers mercenaries; Jiangdu, the “City of Warlords,” holds the highest military command and has a history of powerful local generals; Damaogong, on the ancient Halberd Plains, trains infantry skilled at countering cavalry. Together, these six form the core of Yanshen’s military power.\n\nThough each of these six holds distinct military styles and roles, all are core to Yanshen’s martial power. Since their unification under one banner, they have followed centralized directives but lacked deep integration. Now, with order reestablished and command unified, a rare opportunity arises to reform and coordinate.\n\nThis spring, the Grand Command has launched a “Six-Army Review,” rotating officers through each garrison to reevaluate and cross-examine doctrines. Jiangdu seeks clearer delegation of duties; Szicheng and Jiantsiang discuss respective eastern and western preparedness; Bianfang and Damaogong propose joint infantry-cavalry drills; while Gushibi advocates for integrating mercenary structure into the border forces.\n\nThe military system of Yanshen has long gone unchanged. If the six regions collaborate in earnest, they may rekindle the power of joint warfare and prepare for future enemies. Yet with such varied doctrines, mismanagement could grind the gears of reform.\n\nNow is the time for clear statutes and realigned duties. Only as one can the six armies move without hesitation."
 haless.727.a: "Drill Together, and Let Discipline Steel the Heart"
 haless.727.b: "Fortify the Walls, and Repel the Foes"
 haless.727.c: "Incorporate the Rovers, and Reinforce with Flexibility"
 haless.727.d: "Perfect the Halberd, and Break Their Line"
 haless_ironblood_reform: "Ironblood Reform"
 haless_walls_jiantsiang: "Walls of Jiantsiang"
 haless_stone_army: "Stone Army Accord"
 haless_halberd_charge: "Halberds Against the Charge"

 haless.728.t: "Outside the Enclosures"
 haless.728.desc: "North Yanshen, a region of hills and pastures, has long upheld the unwritten custom of rotating communal grazing on untended lands. Recently, a noble family in southwestern North Yanshen expanded their estate and irrigation, claiming nearby wildlands—traditionally used by herders—as private, citing labor reach as justification. They expelled the herders and sought formal land registration, sparking widespread outrage. Surrounding villagers protested, some even arming themselves. While herders demand protection of traditional grazing rights, some gentry see this as an opportunity to pilot land reform. Though local for now, the issue has drawn broader attention.\n\nYou must now decide how the law shall rule."
 haless.728.a: "Land belongs to those with deeds. Let enclosures stand."
 haless.728.b: "Grazing is livelihood. Wild land should not be closed."
 haless.728.c: "Let us legislate boundaries — survey first, divide after."
 haless_recognized_land: "Recognized Land Deed"
 haless_rotational_grazing: "Rotational Grazing Land"
 haless_legislated_land: "Legislated Land Allocation"

 haless.729.t: "Intermarriage Beyond the Hearth"
 haless.729.desc: "Situated in the northeastern corner of Yanshen, North Yanshen stands where mountains meet ocean winds.\n\nOld frontier ways taught that “mountains and rivers do not block kinship”—travelers often settled in villages, garrison farmers married locals, and records tell of Shuvuush women tending winter fires and Lakeborn merchants docking in spring. Their descendants shaped the region's “frontier norm.”\n\nToday, Shuvuush riders roam the highlands, descendants of the Heavenly Kingdom farm by the lake, and treasure fleets trade year-round. The border remains active, and interethnic marriages—though now rarer—quietly persist in garrisons and villages, accepted under the saying: “each village keeps its own ways.”\n\nBut in one settlement, a cluster of such marriages recently drew public notice. As word spread, debate erupted.\n\nSome praise the practice as binding hearts and fostering border peace. Others, especially gentry voices, call for restraint to protect household order.\n\nMore critical voices denounce it as a loss of propriety, warning: “if the heart flows like water, the levee will break."
 haless.729.a: "Born of the same rivers and hills — let marriage follow nature."
 haless.729.b: "A man’s marriage strengthens, a woman’s weakens."
 haless.729.c: "Jiangyang guards its soul—let no foreign wind shake its roots."
 haless_intermarriage_permitted: "Interethnic Marriage Permitted"
 haless_intermarriage_restricted: "Interethnic Marriage Restricted"
 haless_intermarriage_prohibited: "Interethnic Marriage Prohibited"

 haless.730.t: "[Root.GetName]'s Little New Year"
 haless.730.desc: "The annual Little Year of [Root.GetName] has arrived once more in the coastal towns.\n\nOriginally a fisherfolk’s ritual of offerings to the sea for calm waters—marked by lanterns, libations, and incense—this festival has since evolved into the most bustling, trade-rich celebration on Yanshen’s eastern coast.As the day approaches, fish-patterned lanterns are strung across streets, red silk knots tied to prows. Open-air stages are built; salty sea ballads ring out as street performers entertain crowds. At alley corners, fishers hold the “Shell Banquet” with salt-boiled seafood and rice brew to welcome guests.\n\nTraveling merchants set up stalls, selling foreign textiles and spices. Teahouses and cloth halls open trying booths for curious shoppers to don imitation foreign fashions—each stranger and more vibrant than the last.\n\nThis year, the festival coincides with the docking of a grand Northern Ocean fleet. Traders, artisans, and diplomats from many nations arrive, and the celebration reaches new heights. Flags flap across crowded streets, voices mingle in a dozen tongues, and townsfolk from all around gather to revel together."
 haless.730.a: "Expand these ports and foster cultural exchange with foreign fleets."
 haless.730.b: "Take a chance and try to recruit some foreign talent."
 haless.730.c: "Celebrate grandly and launch a coastal fair to boost trade."
 haless_cultural_exchange: "Promoted Cultural Exchange"
 haless_eastern_port: "Eastern Port Fair"
