l_english:
 ar_hs_active:0 "Necromancy: Harvest of Souls"
 desc_ar_hs_active:0 "Enemy land casualties from substantial battles feed the Harvest. All earned tiers end when this five-year window closes."
 ar_hs_casting_cooldown:0 "Harvest of Souls: Gathering Shadows"
 desc_ar_hs_casting_cooldown:0 "Harvest of Souls can be cast once every five years."
 ar_hs_ready_to_cast_tt:0 "Harvest of Souls is off cooldown, and a Harvest is not active."
 ar_hs_cast_tt:0 "For §Y5 years§!, harvest enemy land casualties from battles against countries at war with us. A battle must inflict at least §Y2,500 enemy land casualties§! to count. Each tier costs §Y400 casualties per point of land force limit§! at casting, with a minimum of §Y5,000§!. Each tier gives §G+2% Discipline§! and §G+4% Siege Ability§!, up to §Y5 tiers§!. Every tier expires at the original five-year deadline. Casting cooldown: §Y5 years§!."
 ar_hs_review_harvest_decision_title:0 "Review the Harvest of Souls"
 ar_hs_review_harvest_decision_desc:0 "Tier: §Y[Root.ar_hs_tier.GetValue] / 5§!.\nSouls gathered: §Y[Root.ar_hs_total_souls.GetValue]§!.\nSouls per tier: §Y[Root.ar_hs_souls_per_tier.GetValue]§!.\nProgress towards the next tier: §Y[Root.ar_hs_unspent_souls.GetValue]§!.\n\nBoth victories and defeats can feed the Harvest. Our own losses, rebels, ships and attrition do not count. No new Reaper's Due is incurred."
 ar_harvest_souls.status.t:0 "The Weight of the Harvest"
 ar_harvest_souls.status.d:0 "The spirits of our fallen enemies gather around the ritual.\n\nHarvest tier: §Y[Root.ar_hs_tier.GetValue] / 5§!.\nTotal souls gathered: §Y[Root.ar_hs_total_souls.GetValue]§!.\nSouls required per tier: §Y[Root.ar_hs_souls_per_tier.GetValue]§!.\nSouls towards next tier: §Y[Root.ar_hs_unspent_souls.GetValue]§!.\n\nEach tier grants §G+2% Discipline§! and §G+4% Siege Ability§!. These bonuses end with the original five-year ritual, regardless of when a tier was reached. At tier five, further souls grant no additional bonus."
 ar_harvest_souls.status.ok:0 "The living will furnish the rest."
 ar_hs_tier_1:0 "Harvest of Souls: Tier 1"
 desc_ar_hs_tier_1:0 "The harvested dead guide our soldiers and whisper through the walls of enemy fortresses. This tier ends with the active Harvest."
 ar_hs_tier_2:0 "Harvest of Souls: Tier 2"
 desc_ar_hs_tier_2:0 "The harvested dead guide our soldiers and whisper through the walls of enemy fortresses. This tier ends with the active Harvest."
