#Events
 flavour_dogeater.0.t:0 "The Rabid of Dogwood"
 flavour_dogeater.0.d:0 "\"Hold it right there whelp, one step further and you'll be out of our clan's protection and into Dogeater hunting grounds.\nHm? Never heard of them before? Well sit down then, it's better if you know what you might be getting into.\n\nSimply put, the Dogeater clan cares not for honor. Nothing is too low for them, they eat dogs for Dookan's sake. Every night I can hear their screams and shouts as they endlessly brawl each other over the most minor squabbles. They claim to be a clan of the strong, a clan of pure strength, yet all I see is disgraceful savagery. Walk into their territory by just a margin, and droves of warg riders will come to you challenging you to a fight. I experienced this myself, barely escaped with my limbs intact, it's how I lost my eye here, see?\n\nThough I must admit, a true orc cannot help but admire their brazen strength and questionable bravery. In fact, I have heard their chieftain dwarfs even the largest of our clan, I have even heard rumors of him having ogre blood in his veins. Many of his clan would even happily boast that his father killed Corin, that he was stronger than Korgus. Simple ravings of idiotic lunatics I would say. If he was truly that strong, where was he in Castanoth? Where was he when Corin actually killed Korgus? Just a bunch of cowards who can't even admit dishonor.\n\nBut still, I cannot emphasize this enough: You are wargfeed if you choose to step any closer to those brutes. Just thinking of what they are doing in those woods brings me disgust!\""
 flavour_dogeater.0.a:0 "*SNIFFFFFS* AUGH, DHOULZA, GIMME MORE OF DAT GOOD SHIT GAHAHA!"

