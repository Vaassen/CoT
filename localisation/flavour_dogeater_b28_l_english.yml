#Missions
 B28_call_the_wargmasters_title:0 "Call the Wargmasters"
 B28_call_the_wargmasters_desc:0 "\"Many orcs still tink they bigger, stronger dan us ladz, even amongst our own. 'Ere gonna beat dem and dere doggies to a pulp, dat's gonna show em who's da boss around 'ere! An' 'den we gonna bring dem to beat the others to a pulp\""
 B28_dogfeeder_title:0 "Dogfeeder"
 B28_dogfeeder_desc:0 "\"Our party has been starving for a few days now. We expected the woods of Escann to be teeming with life and game, yet it seems as if all the wildlife has fled to elsewhere the moment we set our foot in these blasted woods, every footprint seems to lead to nowhere besides blankets of wet soil. I'm getting really worried… Lorenzo is eyeing me weirdly while sharpening his blade right now, I don't know for how longer we can-Wait! I just heard snarling, perhaps Falah blessed us finally with great game!\"\n\n Diary of Isabella Leonarn, Wargfeed"
 B28_warg_breeding_title:0 "Warg Breeding"
 B28_warg_breeding_desc:0 "\"We have da best wargs around, da biggest and speediest. See this good girl right here? *Smacks it* This girl can mow down so many footies in one charge!... Awww, she's all tuckered out.\""
 B28_rapid_evolution_title:0 "Rapid Evolution"
 B28_rapid_evolution_desc:0 "\"Ya would think the Dogeaters are merely a bunch of idiots, and I wouldn't blame ya one bit. But don't underestimate them, every battle, every fight, every victory they emerge stronger, more cunning and brutal than before. If you defeat them, make sure they're dead.\"\n\n -Gluk Stronghide, Bladebreaker general"
 B28_rise_of_the_warglords_title:0 "Rise of the Warglords"
 B28_rise_of_the_warglords_desc:0 "Big orcs ride big wargs, biggest orc around ride biggest wargs around."
 B28_the_top_dog_title:0 "The Top Dog"
 B28_the_top_dog_desc:0 "\"I have da biggest warg!\""
 B28_theyll_never_see_it_coming_title:0 "They'll Never See It Coming"
 B28_theyll_never_see_it_coming_desc:0 "\"Ya know why dey call demselves Clouded Eye? It's cuz their head might as well be in da clouds with all da tinkin' dey do. We ain't do dat 'ere, we see, we smash, simple az. Now, 'ere the plan, dere are non, just charge in and show dem cloudheads what it means to be da best orcs in da world. While dey be thinkin' of holdin' speeches and stuff , we'll be clobberin' dere houses, dere loot and dere grandmas. Easy as beating a baby!\""
 B28_embrace_chaos_title:0 "EMBRACE CHAOS!"
 B28_embrace_chaos_desc:0 "\"Aight boyz, when I got ta 'dis place from da mountains, all I saw were a buncha of knuckleheads like youz clobbering ya skulls out, an absolute paradise. But den I found out ya also do a buncha lame nickerknacks. Ain't no time for dat, else ya become one of da cloudheads. From now on, if yer ever hear anymore of dat nonsense, deck 'em in da schnoz, else imma deck ya both. Propa orcs were not made by Dookan ta farm, propa orcs were not born ta read or whatever, propa orcs were born to smash da holds, da cities an' weak scums! We da orcs, an' we was made to bring da gods to da ground den stomp dem flat!\""
 B28_i_need_men_title:0 "I Need Men!"
 B28_i_need_men_desc:0 "\"WHAT DID YA JUST SAY YA WORTHLESS MAGGOT! YA GONNA BRING ME YER BOYZ, SEND DEM TO DA FIELDS OR ELSE IM SENDING MINE TO YOUR'S! IF YA AIN'T FIGHTIN FOR ME, THEN YA FIGHTIN' AGAINST ME!\""
 B28_sojourners_of_ash_title:0 "Sojourners of Ash"
 B28_sojourners_of_ash_desc:0 "\"Ya say dis iz downtown Castanoth, not lootin' ground. But where smash happen, dat lootin' ground. Lootin's ground'z a state of mind\""
 B28_soul_searching_title:0 "Soul Searching"
 B28_soul_searching_desc:0 "\"Even humies can kill orcs, Clouded Eye said sum humies are orcs too, I believe it\""
 B28_the_final_crescendo_title:0 "The Final Crescendo"
 B28_the_final_crescendo_desc:0 "'Ere we go"
 B28_ragh_title:0 "RAAAAAAAAAAAAAGH!"
 B28_ragh_desc:0 "RAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGGGGGGGGGGGGHHHHHHHHHHHHHHHHHH!""
 B28_i_have_an_announcement_to_make_title:0 "I Have An Announcement To Make"
 B28_i_have_an_announcement_to_make_desc:0 "\"DEY ALL SAY IMMA FAKE, DEY ALL SAY IM WEAK, DEY ALL CALL ME STOOPID. I'LL PROVE DEM ALL WRONG. I'LL PROVE IT RIGHT AT DER FACES IF I HAVE TA. EVEN DA DEAD, EVEN DA ROT AN' EVEN DA BONES.\n\nNOW GIT OUTTA 'ERE AND KRUSH DEM ALL!\""
 B28_tactics_of_the_tide_title:0 "Tactics of the Tide"
 B28_tactics_of_the_tide_desc:0 "\"Even though Korgus was a bogus, I musta admit der was a genius to him, sending as many men at dem, each tryin' ta kill de other as much as da enemy.\""
 B28_shes_gone_move_on_title:0 "She's Gone, Move on!"
 B28_shes_gone_move_on_desc:0 "\"Ya need ta forget 'er, man\""
 B28_mightiest_of_allkind_title:0 "Mightiest of Allkind"
 B28_mightiest_of_allkind_desc:0 "Best"
 B28_break_their_bones_title:0 "Break Their Bones!" 
 B28_break_their_bones_desc:0 "\"Other orcs are too concerned with sitting around doin' nuttin, but not us. Time sittin' around a table not feastin' is time not smashin'. All ya hav' ta do is follow me, stick 'em with ya swords, slice 'em with ya axes, break 'em bones with ya fix if ya have ta, and before ya know it, we're gonna be runnin' to da next one.\""
 B28_korgus_the_bogus_title:0 "Korgus the Bogus!"
 B28_korgus_the_bogus_desc:0 "\"Ma father slew Corin, yet 'er wretched shambling corpse was all it tuk ta bring dat quack on his knees! Ma father was da strongest! He was stronger dan Dookanson! Anymore arguing against dis and I'm caving ya skullz in!\""
 B28_thoughtdeath_title:0 "Thoughtdeath"
 B28_thoughtdeath_desc:0 "WEZ BEEN WRIT'N RED COZ RED MAKEZ YA GO FASTA SO OUR BOSS SAID "OI MAYBE ITD MAKE YA GITZ LERN FASTA" SOZ WE WROTE IN RED N NOW WEZ SMATA N WE ALMOST STOPPED FIGHT'N TO CONTEMPLATE LIFE BUT IT GOT BARBOG ALL DEPRESSED N HE KRUMPED 'IMSELF SO NOWZ DA BOSS SAY WE CAN'T READ NO MORE"
 B28_for_the_horde_title:0 "For the Horde!"
 B28_for_the_horde_desc:0 "\"achoo\""
 B28_seizing_power_title:0 "Seizing Power"
 B28_seizing_power_desc:0 "I'm tired of writing temporary loc"
 B28_all_parties_must_end_title:0 "All Parties Must End"
 B28_all_parties_must_end_desc:0 "Everyone go home"
