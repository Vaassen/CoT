#Events
 flavour_dogeater.0.t:0 "The Rabid of Dogwood"
 flavour_dogeater.0.d:0 "\"Hold it right there whelp, one step further and you'll be out of our clan's protection and into Dogeater hunting grounds.\nHm? Never heard of them before? Well sit down then, it's better if you know what you might be getting into.\n\nSimply put, the Dogeater clan cares not for honor. Nothing is too low for them, they eat dogs for Dookan's sake. Every night I can hear their screams and shouts as they endlessly brawl each other over the most minor squabbles. They claim to be a clan of the strong, a clan of pure strength, yet all I see is disgraceful savagery. Walk into their territory by just a margin, and droves of warg riders will come to you challenging you to a fight. I experienced this myself, barely escaped with my limbs intact, it's how I lost my eye here, see?\n\nThough I must admit, a true orc cannot help but admire their brazen strength and questionable bravery. In fact, I have heard their chieftain dwarfs even the largest of our clan, I have even heard rumors of him having ogre blood in his veins. Many of his clan would even happily boast that his father killed Corin, that he was stronger than Korgus. Simple ravings of idiotic lunatics I would say. If he was truly that strong, where was he in Castanoth? Where was he when Corin actually killed Korgus? Just a bunch of cowards who can't even admit dishonor.\n\nBut still, I cannot emphasize this enough: You are wargfeed if you choose to step any closer to those brutes. Just thinking of what they are doing in those woods brings me disgust!\""
 flavour_dogeater.0.a:0 "*SNIFFFFFS* AUGH, DHOULZA, GIMME MORE OF DAT GOOD SHIT GAHAHA!"
 flavour_dogeater.1.t:0 "The Best Dogs"
 flavour_dogeater.1.d:0 "\"CHIEF! IN DA PAST FEW WEEKZ, WE LOT BEEN MAKIN' MOR BABY WARGS\""
 flavour_dogeater.1.a:0 "Make MOREEEEEE"
 flavour_dogeater.1.d:0 "Make dem SPEEEEEDYYYY"
 flavour_dogeater.11.t:0 "Dush Surges through enemy line"
 flavour_dogeater.11.d:0 "\"I live bitches\""
 flavour_dogeater.11.a:0 "Oh shit!"
 flavour_dogeater.12.t:0 "Dush Returns From Great Hunt"
 flavour_dogeater.12.d:0 "\"I live bitches\""
 flavour_dogeater.12.a:0 "Oh shit!"
 flavour_dogeater.13.t:0 "Wargs Breakout!"
 flavour_dogeater.13.d:0 "GRRRRRRRRRRRRRRR, BARK BARK WOOF BARK BARK BARK WOOOF AWOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO"
 flavour_dogeater.13.a:0 "\"GIT DEM BACK IN DER CAGES\""
 flavour_dogeater.2.t:0 "Triumph of the Mindless"
 flavour_dogeater.2.d:0 "\"In my many, many years as a shaman and scholar of Clouded Eye. I have witnessed many atrocities, a destruction of a hold, the onslaught of the goblins and violent orcish infighting for bids of power as well as the rise and fall of many maniacal leaders. Yet not many can compare to those of Dogeater. They fight with almost gleeful rage, eat anything they can get their hands on, not only slaying their fellow orcs at a moment's notice but also ready to backstab their commanders without a second thought.\n\nAs towns and villages get razed to the ground, more and more, including me, have fled to the concealed hill forts. Things seem dire, but I remain steadfast in hope. Our clan has gone through worse times, worse tragedies and it won't simply end to these metalheads! We have heard from our allies that they are preparing for a counterattack as I speak. I assure you, the Dogeater Clan is no-\"*CRASH*\n"
 flavour_dogeater.2.a:0 "BLBLBUAUWJFJFALFALFZKMZJNCAJFN"
 flavour_dogeater.3.t:0 "Societal Collapse"
 flavour_dogeater.3.d:0 "It's been quite some time since my father died at the maws of the dogeaters. Many of us managed to flee to the woods and set up resistance efforts, inspired by his final speech. However, our efforts have not bore fruit, many of us died in our last gambit to reclaim our clan, and I'm starting to lose hope myself. In fact, ever since then, the dogeaters have only become more violent, more savage, more uncaring and more battle-hungry. They cannot be bribed for they have no need for scraps of gold, they cannot be intimidated for they are assured they will be reborn even in death, they CANNOT be reasoned with for they can only respond in shouts and grunts. Though I remain hopeful still, surely a clan constantly on the brink of implosion is not long for this world, right"
 flavour_dogeater.3.a:0 "\"Oi, is dat a book ya holdin'?!\""
 flavour_dogeater.41.t:0 "One Last Riot"
 flavour_dogeater.41.d:0 "Insert domestic abuse and drug overdose"
 flavour_dogeater.41.a:0 "*GARGLES*"
 flavour_dogeater.100.t:0 "Chaos's Zenith"
 flavour_dogeater.100.d:0 "Dush is dead! Everyone fight!"
 flavour_dogeater.100.a:0 "GRAGGGH!"
 flavour_dogeater.4.t:0 "RAAAAAAAAAAAAGH"
 flavour_dogeater.4.d:0 "\"RAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGGGGGGGGGGGGGGGGGGGGHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHH\""
 flavour_dogeater.4.a:0 "\"RAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHH\""
 flavour_dogeater.5.t:0 "Corin, Twice Lived, Thrice Dead"
 flavour_dogeater.5.d:0 "I am better than corin!"
 flavour_dogeater.5.a:0 "Well, that was eventful"
 flavour_dogeater.6.t:0 "Greater than Korgus"
 flavour_dogeater.6.d:0 "My dad can beat up your dad!"
 flavour_dogeater.6.a:0 "I'M DA REAL SON OF DOOKAN"
 flavour_dogeater.6.b:0 "Dookan iz ded and we krumped 'im"
 flavour_dogeater.92.t:0 "Dush Dogeater has leveled up"
 flavour_dogeater.92.d:0 "Just telling you so you know"
