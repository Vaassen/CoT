 B28_tide_tt:0 "As long as you have §YRule of the Strong§!, after you declare war, you gain §G10% morale damage§! per points of §Ynegative stability§!, and §R-10% morale damage§! per point of §Ypositive stability§! for 15 years and lose §G2 points of war exhaustion§! for each §Ynegative point of stability§!"
