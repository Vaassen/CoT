 L53_lose_all_buffs_tooltip:0 "The Kolovadoy is FUCKING DEAD and now you lose all the cool buffs they had, WOMP WOMP."
 L53_kolovadoy_retirement_tooltip:0 "The Kolovadoy will pick a worthy successor and then retire. Current ruler leaves, next ruler gets +2 to each stat."