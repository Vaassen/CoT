 L53_the_tower_stands_alone:0 "The Tower Stands Alone"
 L53_the_tower_stands_alone.d:0 "The Tower stands alone! We shall reclaim the mainland by ourselves, or not at all!\n\nTiboktsamo is a recently independent nation following the collapse of the Fangaulan Emprie and Kheterata. Desperate for legitimacy, the Tower Commanders have found it in the form of intense nationalism. The promise of reclaiming the Ananoma and fulfilling the prophecy of the Kolovadoy is a double edged sword. While it has done wonders for military recruitment, any deviation from that promise risks losing the confidence of the public. It has also put a strain on diplomacy, as other nations feel uneasy about associating with such fiery rhetoric. Especially when said rhetoric describes them as "traitors" or "barbarians."\n\nNo allies while you have this bonus, and you lose this bonus if you take any land in the Fahvanosy Region. Bonus only lasts until the birth of colonialism, at which point the fervor has died down with the discovery of Cannor."

 the_tower_stands_alone_lost.t:0 "Decline in Tiboktsamo nationalism"
 the_tower_stands_alone_lost.d:0 "The recent conquests of [Root.Monarch.GetName] have shaken the faith of the people. People openly whisper in fearful tones that the [Root.Monarch.GetTitle] no longer cares to reclaim the mainland. That, like so many before [Root.Monarch.GetHerHim], [Root.Monarch.GetHerHis] covetous gaze has turned to the Summer Isles. While such rumors would never bring about open revolt, the nations recruitment has taken a hit."
 the_tower_stands_alone_lost.a:0 "Fools! Can't they see what I'm trying to accomplish?"

 the_tower_stands_alone_expired.t:0 "Decline in Tiboktsamo nationalism"
 the_tower_stands_alone_expired.d:0 "With the passage of time, the fires of nationalism that once burned within Tiboktsamo have faded to embers. People begin to wonder if, perhaps, the solutions to the nations woes can be found in the outside world. Rumors of distant peoples from across the seas lead some to believe that the tower need not stand alone."
 the_tower_stands_alone_expired.a:0 "It was nice while it lasted..."

