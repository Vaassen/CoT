 flavour_tiboktsamo.0.t:0 "A lifetime in pursuit of perfection"
 flavour_tiboktsamo.0.d:0 "There were often times I found myself wondering whether the Southern Tower was the great structure keeping watch over our island home, or the commander whose stern presence seemed so much larger than his body. Though he had not the grotesquely elongated form of a human, he was taller than the titans of legend in spirit. Even at 70 years of age, he was awake before dawn and out inspecting the tower defenses and speak with the night-guard. By sunlight, he was already in the field drilling the garrison. There was nothing that couldn't be improved, no wall without weaknesses, no form without flaw. No such thing as 'good enough.'\n\nI... Think that is why he was never Kolovadoy. Never chosen. 30 years he served as Commander, and yet he never once attempted to claim the mantle. Never found the perfect moment to reclaim our home. Even when the brigands of Bibyobi sought to steal our home, even when the greedy and fat merchants of Kunolo lost the protection of their Khet masters, even when the first signs of age began to show that he was running out of time... Now, he tells me that it is too late for him. That he will never be Kolovadoy. That he spent his life in pursuit of perfection, and realized too late he had already found it. He may never be Kolovadoy, but I..."
 flavour_tiboktsamo.0.a:0 "I will make him proud."

 flavour_tiboktsamo.1.t:0 "Declaring a Kolovadoy"
 flavour_tiboktsamo.1.d:0 "When I was 14, I faced my first otakazemby. It was a massive, brutish, and misshapen creature, over twice my size. A pirate captured off the shore of our island, given a club and a chance to give it's wretched life some meaning. It was the most frightened I'd ever been in my life. Still, I remembered my training and took Turozi's Stance. Deflect it's strike with my shield, retaliate with my training spear. I remember that fear turning to pride, when the bruised human finally yielded.\n\nThe emotions of that day, both fear and pride, were nothing compared to what I felt now. This was no life or death struggle, it was something far more terrifying. Legacy. The legacy of Andrianary Longwatch, a man who had been a father to me, whose watch had now ended. In his departure from the role of Tower Commander, he had named me his successor. More than that, he had named me Kolovadoy.\n\nHe had spoken of when they'd first found me, the child of an escaped slave from Kunolo. A woman I'd never known, who gave her life to bring me to the Tower. How he'd taken me in, watched me grow into the warrior I am today. He called me a gift, from Kolo's shrine, a child of the land that I must reclaim...\n\nThey all believe it. I see it in their eyes. Brothers in arms who had once been my equals now look to me as their saviour."
 flavour_tiboktsamo.1.a:0 "I cannot let them down."

 flavour_tiboktsamo.2.t:0 "Trials for Traitors"
 flavour_tiboktsamo.2.d:0 "Honestly, how dare you adapt and thrive to life alongside humans? They've only held this land for like a thousand years, where is your pride in the nation of Kolonama? Anyways, get executed nerd."
 flavour_tiboktsamo.2.a:0 "... hey, why isn't anyone clapping?"

 flavour_tiboktsamo.3.t:0 "Divinity Undone"
 flavour_tiboktsamo.3.d:0 "'-and that concludes my 98 page thesis on why Kunolo isn't a real god and only the Nakavy Avo pantheon is real! Any questions?'\n'Does this mean we should go back to being racist against lizards then?'"
 flavour_tiboktsamo.3.a1:0 "With gusto!"
 flavour_tiboktsamo.3.a1:0 "We're not THAT evil."

 flavour_tiboktsamo.4.t:0 "Another form of cowardice"
 flavour_tiboktsamo.4.d:0 "What do you MEAN you don't want to get press ganged into our empire?"
 flavour_tiboktsamo.4.a:0 "We asked so nicely the first time!... We're done asking."

 flavour_tiboktsamo.5.t:0 "Ghost stories"
 flavour_tiboktsamo.5.d:0 "Oh boy, I sure hope that there will never be consequences to ruthless forced integration!"
 flavour_tiboktsamo.5.a:0 "*consequences*"

 flavour_tiboktsamo.6.t:0 "Aftermath of the Prank"
 flavour_tiboktsamo.6.d:0 "Well, that sucked, let's not do it again and- Kolo damnit, who ate all these villages while I wasn't looking!?"
 flavour_tiboktsamo.6.a:0 "At least the survivors are a bit more receptive to relocation..."

