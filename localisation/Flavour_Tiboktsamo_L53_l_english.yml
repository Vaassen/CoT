l_english:

 sunken_citadel_title:0 "Sunken Citadel"
 sunken_citadel_desc:0 "The ache of Torapinoma is familiar to many halflings, who gaze across the sea towards that long ruined citadel. Once great, the predations of barbarians and nature itself have weathered away its proud walls. Squatters and looters infest its halls, defiling it with their presence. This can no longer be allowed."

 the_place_of_lizards_title:0 "The Place of Lizards"
 the_place_of_lizards_desc:0 "With any questions on the place of lizards put to rest, it is time we ready Drongray's shrine. Though talk of the spire in the center of this tower being of lizardfolk make rather than ancient halflings is superstition at most, the association makes this an ideal location for such a shrine regardless."

 knowing_better_title:0 "Knowing Better"
 knowing_better_desc:0 "There are those among the Fangaulans who claim to be scholars. In the lawless and divided lands of Negefama, there is a repository of the collected works of these so-called intellectuals. Such quant notions should be disregarded. Let our technological superiority speak for itself, as we show the humans what true scholarship looks like."

 the_fangaulan_archives_title:0 "The Fangaulan Archives"
 the_fangaulan_archives_desc:0 "Though they contain no worthwhile scholarship unknown to our own researchers, the Fangaulan Archives have nonetheless been confiscated. While filled with inaccuracies, some of these texts have proven useful.\n\nA long standing theory among Amezetany scholars is the existence of so-called 'Ghost Halflings'. Much like us, these Halflings did not retreat during the fall of the Ananoma. Rather, they fortified settlements and hid in the woods... More than perhaps any other, these are our long-lost kin. They must be reintegrated.\n\nOf course, the ill-educated and superstitious Fangaulans failed to recognize these ghost halflings. Instead, scared of their power and mastery of Jyvas arts of illusion, sightings of these Halflings have been misinterpreted as sightings of an imaginary boogey-man creature called 'Eloko.' An entity that supposedly takes the form of a Halfling to deceive and devour unlucky travelers. No such creature exists, and further reports of its existence are to be treated as anti-halfling rhetoric punishable by fine. The existing reports shall be catalogued and sought out, until all ghost halfling communities are accounted for and reintegrated."

 ghosts_busted_title:0 "Ghosts Busted"
 ghosts_busted_desc:0 "With the grateful ghost Halflings having been peacefully integrated or otherwise reeducated, and any remaining Kaino and Jiromji dissidents dealt with, it is time to place our focus on Latranoma. The ancient citadel, shrouded in mystery and darkness, is the perfect location for the clergy of Jyva.\n\nReminder to all citizens that Eloko is not real, and that spreading rumors of such a creature is a punishable offense. By order of the Tower Commander, however, this restriction is to be waived for immigrants leaving villages decimated by dissident action. But you are reminded, and encouraged to remind others, that these people are merely processing the trauma of the conflict and had no true experience with supernatural entities."

 declaring_a_kolovadoy_title:0 "Declaring a Kolovadoy"
 declaring_a_kolovadoy_desc:0 "Across the nation and across the seas, people cheered and sang joyous songs at the arrival of the Kolovadoy! None could doubt their chosenhood, for the power of Kolo himself radiated off of them. Even in the den of thieves and brigands of Bibyobi, they spoke in fear and reverence. In Kunolo, the fat traitors quaked in fear as joyous masses of the oppressed Halflings, rightful rulers of Kolonama, awaited liberation. In Rayafo, the cowardly Meblic dynasty seethed and stewed in their own inadequacy. So it was, when Kolo's Champion was made Tower Commander!"

 our_claim_vindicated_title:0 "Our claim vindicated"
 our_claim_vindicated_desc:0 "With the reclamation of Kolonama, peace, law, and order have been restored to these turbulent lands. The brigands of Bibyobi have been put down, like the beasts they claimed to tame. Of the halflings of Kolonama, the faithful have been liberated and the traitors await their punishment. In the face of such victory, the priests of Jyva gladly endorsed our claim! There is no truth to any rumors of bribery or blackmail, report anyone spreading such misinformation to your local garrison. Stay safe, praise Kolo."

 trials_for_traitors_title:0 "Trials for Traitors"
 trials_for_traitors_desc:0 "Freedom, liberty, and justice! It is on this national holiday that we remember the trials that brought these virtues back to Kolonama. When the heinous actions of traitorous halflings were punished, those who forsook Kolo for the false gods of Fangaula. Still the cheers echo through the city, when all Halfling slaves were avenged and the false equity of Kunolo was replaced with rightful meritocracy."

 eternal_vigil_title:0 "Eternal Vigil"
 eternal_vigil_desc:0 "To err is mortal, and even the Kolovadoy, chosen by divines, is such. We should remember this, and follow their example. For though they, in an act of misplaced kindness, were too gentle on the traitorous Kunolon dissidents, they learned from their mistake and corrected it. Now, The Tower's watch is eternal. Its gaze reaches from Tiboktsamo to Kolonama, watching over all citizens and ensuring their safety and their loyalty."

 glorious_return_title:0 "Glorious Return"
 glorious_return_desc:0 "For millennia, The Tower stood tall and guarded over Kolonama. The people of Tiboktsamo never fell, never retreated, never faltered, never betrayed our ideals. Our long vigil has not ended, but our exile has. At last, there is rightful rulership of Kolonama. The city, rebuilt and restored, is worthy of a Jakatany should there be a Jakatany worthy of it. Once again, Kolo's people shall be ruled from the home of Kolo's Shrine."

 a_prophecy_fulfilled_title:0 "A Prophecy fulfilled"
 a_prophecy_fulfilled_desc:0 "From Latranoma to Vadronoma, all the lands of the coast belong to their rightful owners. There are none who dare challenge the truth of Kolo's prophecy, for it has been made manifest on the world. What awaits us now is greater than prophecy, a destiny of our own manifestation. May the Kolovadoy look upon their legacy with pride and joy, knowing they have created a better world for all.\n\nVyoronsi forever! Vyorsnsi forever! Vyoronsi forever!"

 divided_they_fall_title:0 "Divided, they fall"
 divided_they_fall_desc:0 "Barbarians are fickle creatures, incapable of governing themselves or curtailing their baser impulses. Look no further than the people of Zuvavim and Mihitarib, whose once mighty alliance proved far too great for Rayafo to overcome. Though we would certainly have defeated both, there was no need. For it is in the nature of the barbarian to destroy themselves, as the lawlessness of both nations allowed for pirates bearing their flag to reign within the Sea of Lel. Their own corruption saw their alliance tear apart, as each blamed the other for this disgrace. So it was, that we brought law back to this lawless land."

 pardons_for_the_worthy_title:0 "Pardons for the Worthy"
 pardons_for_the_worthy_desc:0 "The forefathers of Rayafo were cowards, traitors, and deserters. Those who fled from the fall of Saikinoma, and mingled with the barbarian islanders. But whilst they bare the shame of this, there are those among them who are not beyond redemption. For millennia, Tiboktsamo has offered pardons to Amezetany of the Summer Isles. Those willing to fight for redemption have filled our ranks, with our ranks swelling with eager volunteers each time we reclaim an Ananoma. Now, with Saikinoma reclaimed, it is time to welcome the worthy back to their long lost home. Under The Towers guidance, they shall once again earn the right to call themselves people of the coast."

 punishment_for_the_rest_title:0 "Punishment for the rest"
 punishment_for_the_rest_desc:0 "Famous for our mercy and benevolence, all citizens of the nation are compelled to remember that The Tower is not weak. Those who reject mercy, who spit in the face of justice, are to be punished. So it was that an example needed to be made at the shrine of Nakinta. For too long, the grandfather of The Pantheon and shaper of the earth has been worshipped falsely. Housed in petty islander hovels, and praised by illiterate fools, his shrine in Mapiltra is an insult. We shall make a true house of learning for this ancient god of wisdom, in a city worthy of his presence."

 the_human_kolovadoy_title:0 "The human "Kolovadoy""
 the_human_kolovadoy_desc:0 "Warning! Be on the lookout for signs of heresy! Amongst the ill educated hut-dwelling humans of Zuvavim, a vile heresy has been formulated amongst those whose limited intellect grants them enough low cunning for malice. That the Kolovadoy need not be Halfling, that a human could fill this role, is heresy and punishable by death. Any such spreaders of this heresy are to be reported. The Kolovadoy is a Halfling, their arrival confirmed by the priests of Jyva. Do not allow these liars to poison your mind!"

 a_brothers_betrayal_title:0 "A Brothers Betrayal"
 a_brothers_betrayal_desc:0 "When Kolo first fell, we were shown what the lawless chaos of Lel's rule allowed. Kolo's own brother, Turozi, began an affair with Lel. Betrayed kin and wife, Kolo was humiliated within the pantheon as he had been humiliated in the world of mortals. This humiliation ends now. With his shrine reclaimed and his honor restored in this world, we must fight for his honor in the pantheon. Turozi may be the god of warriors, but he must be humbled and reminded of his place. For his strength is nothing compared to that of Kolo."

 impenetrable_shell_title:0 "Impenetrable Shell"
 impenetrable_shell_desc:0 "Following the glorious defeat of Turozi's Champion, Kolo's dominance over his brother was made clear to all. For the world of mortals reflects the world of the gods. Beaten and humbled, the priests of Turozi agree he has sworn off his affair to Lel. A new shrine shall be constructed, where he will serve penance by training Kolos warriors. He shall turn the lizard gate into an impenetrable shell, against any foe. Be they the lizards of the East, or humans of the West. Under the watchful eye of The Tower, and of Kolo, he shall be kept from wandering from his duty again."

 flavour_tiboktsamo.0.t:0 "A lifetime in pursuit of perfection"
 flavour_tiboktsamo.0.d:0 "There were often times I found myself wondering whether the Southern Tower was the great structure keeping watch over our island home, or the commander whose stern presence seemed so much larger than his body. Though he had not the grotesquely elongated form of a human, he was taller than the titans of legend in spirit. Even at 70 years of age, he was awake before dawn and out inspecting the tower defenses and speak with the night-guard. By sunlight, he was already in the field drilling the garrison. There was nothing that couldn't be improved, no wall without weaknesses, no form without flaw. No such thing as 'good enough.'\n\nI... Think that is why he was never Kolovadoy. Never chosen. 30 years he served as Commander, and yet he never once attempted to claim the mantle. Never found the perfect moment to reclaim our home. Even when the brigands of Bibyobi sought to steal our home, even when the greedy and fat merchants of Kunolo lost the protection of their Khet masters, even when the first signs of age began to show that he was running out of time... Now, he tells me that it is too late for him. That he will never be Kolovadoy. That he spent his life in pursuit of perfection, and realized too late he had already found it. He may never be Kolovadoy, but I..."
 flavour_tiboktsamo.0.a:0 "I will make him proud."

 flavour_tiboktsamo.1.t:0 "Declaring a Kolovadoy"
 flavour_tiboktsamo.1.d:0 "When I was 14, I faced my first otakazemby. It was a massive, brutish, and misshapen creature, over twice my size. A pirate captured off the shore of our island, given a club and a chance to give it's wretched life some meaning. It was the most frightened I'd ever been in my life. Still, I remembered my training and took Turozi's Stance. Deflect it's strike with my shield, retaliate with my training spear. I remember that fear turning to pride, when the bruised human finally yielded. The emotions of that day, both fear and pride, were nothing compared to what I felt now.\n\n'You are an upstart brat! Unseasoned, untested in battle, and unworthy!' Haingo Oldstone nearly screamed as his gnarled and aged finger pointed accusatorially at me. I stood head bowed before the Council of the Tower, meek and subservient. This ancient body of lieutenants had chosen, from amongst themselves, the Tower Commanders of Tiboktsamo for nearly a generation. But just yesterday, Andrianary Longwatch had chosen me as his successor, without consulting them, and promptly retired.\n\n'Should the Council will it-' I began meekly 'I will gladly resign-'\n\n'Out of the question' said Naka Mastbreaker, the unofficial head of the council. He had been the expected successor, a man I respected. I would gladly have given the title to him. 'What's done is done. Andrianary has done more than declare you his successor, he has named you Kolovadoy. Whether we like it or not, the people of Tiboktsamo have chosen to believe him in this claim. To step down now would be spitting upon Kolo, tantamount to desertion and treason.' Though calm, there was an edge of anger to his voice. As if behind each word, there was a concealed dagger waiting to strike. 'You will be the Tower Commander. You will attempt to be the Kolovadoy. But while the masses may believe this, we have yet to be convinced. I advise that you heed our council, for if you fall short... We will see you disgraced and denounced as a false Kolovadoy, buried without honors and remembered by none...' He paused, gauging my reaction. The fear he saw in my eyes... I believe it satisfied him. 'But, for now, you have the people's faith. Don't disappoint them.'"
 flavour_tiboktsamo.1.a:0 "I won't. I swear it."

 flavour_tiboktsamo.2.t:0 "Trials for Traitors"
 flavour_tiboktsamo.2.d:0 "Honestly, how dare you adapt and thrive to life alongside humans? They've only held this land for like a thousand years, where is your pride in the nation of Kolonama? Anyways, get executed nerd."
 flavour_tiboktsamo.2.a:0 "... hey, why isn't anyone clapping?"

 flavour_tiboktsamo.3.t:0 "Divinity Undone"
 flavour_tiboktsamo.3.d:0 "'-and that concludes my 98 page thesis on why Kunolo isn't a real god and only the Nakavy Avo pantheon is real! Any questions?'\n\n'Does this mean we should go back to being racist against lizards then?'"
 flavour_tiboktsamo.3.a1:0 "With gusto!"
 flavour_tiboktsamo.3.a2:0 "We're not THAT evil."

 flavour_tiboktsamo.4.t:0 "Another form of cowardice"
 flavour_tiboktsamo.4.d:0 "What do you MEAN you don't want to get press ganged into our empire?"
 flavour_tiboktsamo.4.a:0 "We asked so nicely the first time!... We're done asking."

 flavour_tiboktsamo.5.t:0 "Ghost stories"
 flavour_tiboktsamo.5.d:0 "Oh boy, I sure hope that there will never be consequences to ruthless forced integration!"
 flavour_tiboktsamo.5.a:0 "*consequences*"

 flavour_tiboktsamo.6.t:0 "Aftermath of the Prank"
 flavour_tiboktsamo.6.d:0 "Well, that sucked, let's not do it again and- Kolo damnit, who ate all these villages while I wasn't looking!?"
 flavour_tiboktsamo.6.a:0 "At least the survivors are a bit more receptive to relocation..."

 flavour_tiboktsamo.7.t:0 "A late night visit"
 flavour_tiboktsamo.7.d:0 "'Lol, I ate all those villages while you weren't looking' ~Eloko, REAL!?"
 flavour_tiboktsamo.7.a1:0 "jyva please use prophecy to check under my bed for monsters"
 flavour_tiboktsamo.7.a2:0 "jyva please use sorcery to keep monsters from coming out of my closet"

 flavour_tiboktsamo.8.t:0 "Issuing the Challenge"
 flavour_tiboktsamo.8.d:0 "'1v1 me, fox only, final destination' spoke Kolo's champion\n'no, go level up first nerd' spoke Turozi's champion thusly"
 flavour_tiboktsamo.8.a:0 "I'll be back for you, bitch"

 flavour_tiboktsamo.9.t:0 "Tougher than the Toughest"
 flavour_tiboktsamo.9.d:0 "WORLD STAR, WOOO, FUCK YEAH, WORLD STAR!"
 flavour_tiboktsamo.9.a:0 "is he gonna be okay?"

 flavour_tiboktsamo.10.t:0 "Two tales of the tailed"
 flavour_tiboktsamo.10.d:0 "Hhrrmmm.. Hate lizard? Or love lizard?"
 flavour_tiboktsamo.10.a1:0 "HATE LIZARD!"
 flavour_tiboktsamo.10.a2:0 "luv lizard :3"

 flavour_tiboktsamo.11.t:0 "The truest discussion"
 flavour_tiboktsamo.11.d:0 "Nakinta says you guys are bitches, and so we're taking your shrine"
 flavour_tiboktsamo.11.a:0 "Yoink!"

 flavour_tiboktsamo.12.t:0 "A Rightful Jakatany"
 flavour_tiboktsamo.12.d:0 "To king or not to king?"
 flavour_tiboktsamo.12.a1:0 "Yas king"
 flavour_tiboktsamo.12.a2:0 "Nah king"

 flavour_tiboktsamo.13.t:0 "A Prophecy Fulfilled"
 flavour_tiboktsamo.13.d:0 "[Root.TiboktsamoAProphecyFulfilled]"
 flavour_tiboktsamo.13.d1:0 "You made it all the way to the end, but your ruler died before they could fulfill the prophecy of the Kolovadoy. You get a consolation prize, but miss the cool bonus."
 flavour_tiboktsamo.13.d2:0 "Your ruler fulfilled the prophecy of the Kolovadoy, but didn't survive to the end. You still get the bonus!"
 flavour_tiboktsamo.13.d3:0 "Is this... Forever?\n\nThere are times when I hate Andrianary Longwatch. A man I saw as a father. A man who told me I was special, I was chosen. A man who stole my life in the name of a dream that wasn't mine. But I can't truly hate him, because his life was stolen too. Wasted in search of perfection that he never found. That's the part they don't tell you about living for a cause. It eats up every other part of your life, and when that cause is gone you realize there's nothing left.\n\nThe Ananoma are reclaimed and restored, the prophecy is fulfilled. My people are happy, our harvests bountiful, our prayers to Kolo seemingly answered. My purpose is complete, and yet I still live.\n\nI no longer know my people, and they do not know me. I don't know when it happened... Perhaps it was when the Ghost Halflings united with the Kaino and Jiromji. It was hatred of me that brought them together, a hatred I had failed to see. Perhaps, it was the moment I was first chosen. When my comrades became followers.\n\nI am an old man now, yet still I look to you for wisdom. Andrianary Longwatch, Tower Commander... Father. Have I done enough? Can I step aside, as you did? Choose a successor, as you chose me, and leave these burdens behind? I wish simply to live out the rest of my days in quiet, to be anything other than Chosen."
 flavour_tiboktsamo.13.a1:0 "His purpose, completed without him."
 flavour_tiboktsamo.13.a2:0 "In his memory."
 flavour_tiboktsamo.13.a3:0 "I'm so tired... Can I rest?"
 flavour_tiboktsamo.13.a4:0 "No, what right do I have to inflict this onto another? I can pretend a while longer..."

 flavour_tiboktsamo.14.t:0 "Death of the Chosen"
 flavour_tiboktsamo.14.d:0 "YOU ARE DEAD, IS NOT BIG SURPRISE."
 flavour_tiboktsamo.14.a1:0 "Fine, we'll finish it without him."
 flavour_tiboktsamo.14.a2:0 "RIP get well soon, we'll never forget you"

 L53_eloko_sighting:0 "There's ghost halflings in them/their hills!"

 L53_kolovadoy_1:0 "Koloavody Level 1"
 desc_L53_kolovadoy_1:0 "Nice start, kid."
 L53_kolovadoy_2:0 "Kolovadoy Level 2"
 desc_L53_kolovadoy_2:0 "Okay, now we're getting somewhere."
 L53_kolovadoy_3:0 "Kolovadoy Level 3"
 desc_L53_kolovadoy_3:0 "Alright, fine, I'm impressed."
 L53_kolovadoy_4:0 "Kolovadoy Level 4"
 desc_L53_kolovadoy_4:0 "... And now I'm starting to get a bit scared."
 L53_kolovadoy_5:0 "Kolovadoy Level 5"
 desc_L53_kolovadoy_5:0 "... Holy shit."

 L53_kolonama_buff:0 "Reclamation of Kolonama"
 desc_L53_kolonama_buff:0 "Greatest among cities, as Kolo is greatest among gods, our rulers reclamation of Kolonama has inspired greater loyalty among the faithful."
 L53_torapinoma_buff:0 "Reclamation of Torapinoma"
 desc_L53_torapinoma_buff:0 "A marvel of engineering, even among Ananoma, our rulers reclamation of Torapinoma inspires our own builders to strive towards the greatness of their ancestors."
 L53_latranoma_buff:0 "Reclamation of Latranoma"
 desc_L53_latranoma_buff:0 "Secluded deep within the darkness of the Dao Nako, our rulers reclamation of the Far Citadel of Latranoma inspires our agents to more boldly seek truths in shadows."
 L53_saikinoma_buff:0 "Reclamation of Saikinoma"
 desc_L53_saikinoma_buff:0 "A center of learning greater than any other in the world, our rulers reclamation of Saikinoma attracts the greatest minds the world over to the restored house of wisdom."
 L53_vadronoma_buff:0 "Reclamation of Vadronoma"
 desc_L53_vadronoma_buff:0 "A symbol of the indomitable Vyzemby spirit, our rulers reclamation of the Lizard Gate of Vadronoma reminds our soldiers that the size or strength of our foes is inconsequential compared to our own might."

 L53_the_tower_stands_alone:0 "The Tower Stands Alone"
 desc_L53_the_tower_stands_alone:0 "The Tower stands alone! We shall reclaim the mainland by ourselves, or not at all!\n\nTiboktsamo is a recently independent nation following the collapse of the Fangaulan Emprie and Kheterata. Desperate for legitimacy, the Tower Commanders have found it in the form of intense nationalism. The promise of reclaiming the Ananoma and fulfilling the prophecy of the Kolovadoy is a double edged sword. While it has done wonders for military recruitment, any deviation from that promise risks losing the confidence of the public. It has also put a strain on diplomacy, as other nations feel uneasy about associating with such fiery rhetoric. Especially when said rhetoric describes them as "traitors" or "barbarians."\n\nNo allies while you have this bonus, and you lose this bonus if you take any land in the Fahvanosy Region. Bonus only lasts until the birth of colonialism, at which point the fervor has died down with the discovery of Cannor."

 flavour_tibokstamo.15.t:0 "Decline in Tiboktsamo nationalism"
 flavour_tibokstamo.15.d:0 "The recent conquests of [Root.Monarch.GetName] have shaken the faith of the people. People openly whisper in fearful tones that the [Root.Monarch.GetTitle] no longer cares to reclaim the mainland. That, like so many before [Root.Monarch.GetHerHim], [Root.Monarch.GetHerHis] covetous gaze has turned to the Summer Isles. While such rumors would never bring about open revolt, the nations recruitment has taken a hit."
 flavour_tibokstamo.15.a:0 "Fools! Can't they see what I'm trying to accomplish?"

 flavour_tiboktsamo.16.t:0 "Decline in Tiboktsamo nationalism"
 flavour_tiboktsamo.16.d:0 "With the passage of time, the fires of nationalism that once burned within Tiboktsamo have faded to embers. People begin to wonder if, perhaps, the solutions to the nations woes can be found in the outside world. Rumors of distant peoples from across the seas lead some to believe that the tower need not stand alone."
 flavour_tiboktsamo.16.a:0 "It was nice while it lasted..."

 win_battle_tiboktsamo_10_tooltip:0 "Win §Y10§! battles. (Currently §Y[Root.tiboktsamoBattlesWon.GetValue]§!)."
 win_war_tiboktsamo_5_tooltip:0 "Win §Y5§! wars. (Currently §Y[Root.tiboktsamoWarsWon.GetValue]§!)."

 L53_lose_all_buffs_tooltip:0 "The Kolovadoy is FUCKING DEAD and now you lose all the cool buffs they had, WOMP WOMP."
 L53_kolovadoy_retirement_tooltip:0 "The Kolovadoy will pick a worthy successor and then retire. Current ruler leaves, next ruler gets +2 to each stat."