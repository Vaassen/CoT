 lichdom_project.name:0 "Lichdom"
 lichdom_project.desc:0 "Lichdom\nBecome a lich. Can only take the project if you are a Powerful Mage. Will reset all progress if ruler dies during progression."

 magic_project.700.t:0 "Pursuit of Lichdom"
 magic_project.700.d:0 "\"You have the book? Give it here, I must have it!"\n-Wizard King Xamarzu\n\nThe pursuit of such dark majesty is a hard and fraught one. Such a quest requires immense knowledge, and at each stage we begin by ascertaining how a properly motivated wizard might ascend in the first place. What makes it all the more challenging is that progress made by one ruler can hardly carry over to the next..."
 magic_project.700.a:0 "Hire some [Root.GetMagesName] to find what I need!"
 magic_project.700.b:0 "Time to break out the elbow grease!"
 ruler_studying_lichdom:0 "Immortals Stand Peerless"

 magic_project.701.t:0 "Lichdom Project: Crafting the Phylactery"
 magic_project.701.d:0 "\"Here lies Gradolf--found a box, wasn't looking, got lich pox."\n-The epitaph of deceased adventurer Gradolf Flixis \n\nWith the discovery of the dark knowledge required to achieve lichdom, it is revealed that the very foundation of such a dark gift lies within a phylactery.\nA phylactery is some form of container which stores a lich's soul, typically something small and easy to transport or hide, for if the phylactery is destroyed then the lich will perish with it.\nThe first step for any would-be lich is to craft such a wondrous item."
 magic_project.701.a:0 "An amulet capable of containing a small object"
 magic_project.701.b:0 "An ornate, jewel-encrusted box"
 studying_lichdom_amulet:0 "Phylactery: Amulet"
 studying_lichdom_amulet_desc:0 "Our soul will be stored in an necklace"
 studying_lichdom_box:0 "Phylactery: Ornate Chest"
 studying_lichdom_box_desc:0 "Our soul will be stored in an box"
 
 magic_project.702.t:0 "Lichdom Project: Engraving the Phylactery"
 magic_project.702.d:0 "\"The life so short, the craft so long in learning."\n-Altonius Hammergraft, High Balgarsmith\n\nA phylactery must be engraved with enormous amounts of magical notation in order to hold the would-be lich's spirit and allow them to cast spells upon it."
 magic_project.702.a:0 "Scribe dark spells on tiny magical scrolls to put inside"
 magic_project.702.b:0 "Carve unholy runes on the interior walls and fill them with liquified Damestear"
 magic_project.702.c:0 "Coat the insides with enchanted blood of a magical beast"
 studying_lichdom_parchment:0 "Phylactery: Scrivener"
 studying_lichdom_parchment_desc:0 "Our magics are written in very small handwriting"
 studying_lichdom_runes:0 "Phylactery: Runesmith"
 studying_lichdom_runes_desc:0 "Our magics are contained by unreadable runes"
 studying_lichdom_blood:0 "Phylactery: Bloodborn"
 studying_lichdom_blood_desc:0 "Our magics are all over the place"

 magic_project.703.t:0 "Lichdom Project: Enchanting the Phylactery"
 magic_project.703.d:0 "\"The soul is a volatile and fragile thing. Bereft of a body, most of them move on to the next life. Most..."\n-Famous Monster Hunter Dr. Reginald síl Vekt\n\nArguably the most important and delicate step in the path of lichdom is the lengthy process of enchanting the phylactery to become a suitable home for the immortal ruler's soul, turning it into a beacon for their dark essence that calls more strongly than the allure of the afterlife. The mind, after all, may not want to move on, but the blind and dumb soul has fewer qualms, and so must be safely entrapped for the rest of eternity."
 magic_project.703.a:0 "Perform Dark Enchantments"
 lichdom_mod_1:0 "Lichdom: A Prepared Phylactery"

 magic_project.704.t:0 "Lichdom Project: The Transformation Potion"
 magic_project.704.d:0 "\"...The souls that don't move on, well, normally they're harmless. Sure, they'll make a lot of noise, eat a few cats, maybe try to take revenge on their killer; but all you really need to do is make them realize they're dead and resolve whatever's holding them to this plane."\n-Famous Monster Hunter Dr. Reginald síl Vekt\n\nThe Transformation Potion is essentially an extraordinarily toxic magical potion that must instantly kill the spellcaster upon imbibing. If they linger for even a moment, the transformation will fail and the drinker will perish without attaining lichdom. It has a wide variety of different ingredients, but needs a primary catalyst of poison, which one do you aim for?"
 magic_project.704.a:0 "4 roots of Queen's Belladonna"
 magic_project.704.b:0 "2 bowls of ground Halanna's Tears"
 magic_project.704.c:0 "10 blooms of Fey-touched Hemlock"
 studying_lichdom_roots:0 "Potion: Sans Merci..."
 studying_lichdom_roots_desc:0 "Our death is enabled by a close relative of the potato"
 studying_lichdom_bowls:0 "Potion: The Goddess Wept"
 studying_lichdom_bowls_desc:0 "Our death is enabled by the principle that eating unknown things is usually dangerous"
 studying_lichdom_blooms:0 "Potion: The Hollow Stem"
 studying_lichdom_blooms_desc:0 "Our death is enabled by a close relative of the carrot"
 
 magic_project.705.t:0 "Lichdom Project: Transformation Potion Reagents"
 magic_project.705.d:0 "\"The ones that scare me are those who *chose* to become what they are. There's no reasoning with that kind of insanity."\n-Famous Monster Hunter Dr. Reginald síl Vekt\n\nThe Transformation Potion is no simple potion, and in fact requires another deadly catalyst."
 magic_project.705.a:0 "3 grams of Black Damestear"
 magic_project.705.b:0 "6 drops of Neratic Asp Venom"
 magic_project.705.c:0 "1 tincture of Wyvern Blood"
 studying_lichdom_korashi:0 "Potion: The Black Star"
 studying_lichdom_korashi_desc:0 "Our death is secured by a material which may or may not exist. Depending."
 studying_lichdom_venom:0 "Potion: It Killed Its Creator"
 studying_lichdom_venom_desc:0 "Our death is secured by a substance from the feeblest host"
 studying_lichdom_wyvern:0 "Potion: The End of Legends"
 studying_lichdom_wyvern_desc:0 "Our death is secured by a beast that seems quite lively, all things told"

 magic_project.706.t:0 "Lichdom Project: Potion Vessel"
 magic_project.706.d:0 ""...The vessel must be as dark and accursed as the path of lichdom itself, so no ordinary glass bottle will do."\n-'Necromantic Tactics', a common Inquisitorial training guide, on lichdom and its accompanying signs.\n\nOnce the Transformation Potion's contents are complete, it must be transferred into a special container specifically made for the purpose of lichdom. Such a container must be dark and accursed, and created of only the vilest means and materials."
 magic_project.706.a:0 "Rip out the heart of an innocent"
 magic_project.706.b:0 "Find me a unicorn and bring me its horn!"
 magic_project.706.c:0 ".......... (There is Silence)"
 lichdom_mod_2:0 "Lichdom: A Potion of Soul Separation"

 magic_project.707.t:0 "Lichdom Project: Dark Ritual Preparation"
 magic_project.707.d:0 "\"A man's home is his castle, and a lich's ritual chamber is his home. It should be decorated as such."\n-Lich King Xamarzu\n\nAs every good mage knows, preparation is half the battle. The dark ritual of lichdom is a dangerous undertaking, and the ritual chamber must be prepared accordingly, with several overlapping magical circles, enchanted ornaments, and an appropriately ornate pedestal on which to place the phylactery."
 magic_project.707.a:0 "Make the preparations, as best we can"
 magic_project.707.b:0 "I wield expertise in this area!"
 studying_lichdom_prep:0 "Ritual: Armed to the Teeth"
 studying_lichdom_prep_desc:0 "Our solitude is preserved by many pointy things"
 studying_lichdom_circle:0 "Ritual: The Signs and Sigils"
 studying_lichdom_circle_desc:0 "Our solitude is preserved by a single round thing"
 
 magic_project.708.t:0 "Lichdom Project: Dark Ritual Cleansing"
 magic_project.708.d:0 "\"It is both ironic and sad - your 'liches' come so close to enlightenment, before they throw it all away on the dark altar of earthly immortality."\n-Xiou the Unnamed, Halessi Guru \n\nOnce all preparations are complete, the supplicant must then cleanse their body and soul of all the burdens of worldly flesh. This often requires years of voluntary deprivation to evoke a state of near death and mindlessness."
 magic_project.708.a:0 "Begin the Cleanse"
 magic_project.708.b:0 "Transmutation spells will help quicken the process"
 studying_lichdom_cleansing:0 "Ritual: Dark Cleansing"
 studying_lichdom_cleansing_desc:0 "Puts stubborn stains into your robes"
 studying_lichdom_cleansinger:0 "Ritual: Darker Cleansing"
 studying_lichdom_cleansinger_desc:0 "Puts stubborn stains into your robes"
 
 magic_project.709.t:0 "Lichdom Project: Consumption"
 magic_project.709.d:0 "\"So long have I waited for this moment. No matter the consequence, no matter the pain, I will not falter."\n-Archmagus Gerenoth, last words \n\nWhen the time is ready, the supplicant must stand inside their ritual chamber next to the phylactery and drink the transformation potion. If they don't drink it fast enough or they don't die immediately the body and soul will fail to separate fully and the lich-to-be will die permanently."
 magic_project.709.a:0 "Drink."

 magic_project.710.t:0 "Ascension to Lichdom"
 magic_project.710.d:0 "\"It is done."\n-Morgurax, the First Lich\n\nThe pain is truly terrible. The poison scours your bones and the ritual tears your spirit from its earthly vessel. Every inch of your body feels as though it is burning, freezing, and evaporating, all at once. But finally, the pain fades. And you are still standing.\n The next few days are quiet ones, spent assessing your new existence alone in your chambers. Your new body looks much like your old one, though you no longer feel the pangs of hunger or thirst, nor any other distracting mortal urge. Your flesh already hangs loosely from your bones due to the emaciation of your long cleansing. Given enough time, it will eventually slough away and leave only your polished skeleton behind. You will be a perfect being in body as well as in mind and soul."
 magic_project.710.db:0 "Immarel Winterswrath has at last ascended to an eternal power - lichdom. Immortal, she can essentially rule Gemradcurt for all eternity. However, due to her rather unique path to achieving Lichdom, doing so off of the back of a very powerful Archfey patron, and using his esoteric designs for a phylactery and purging ritual, the nature of her ascension has been rather different to that of Morgurax, the first lich.\n\nHer phylactery, deep within the Frostspear, is completely immobile, unable to be moved from it's position without a great deal of effort - furthermore, it is essentially physically and magically connected to the spell-maelstrom that swirls high above the city, so that the "Heart of Winter" and the Eternal Winter that Gemradcurt has been cast into are intimately connected. While this means that Immarel's soul is potentially more susceptible to being discovered and destroyed, and the process of ascending to Lichdom infinitely more expensive than the traditional method, it has other, potentially greater benefits.\n\nThe greatest of these is that Immarel's soul can be "transferred" from one physical body to another, replacing the mind of the person whose body she inhabits, rendering the transferral subject braindead in the process, but most notably NOT killing the subject's physical body, as in the normal process. This allows her to keep a physical connection to the world around her - something that the Everfrost Prince seems to be rather keen on, likely so that Immarel too can feel the "cold embrace of winter". Transferral is difficult and time-consuming, and cannot be done on a whim, but nonetheless it can be done without too much fuss, allowing Immarel to change bodies once her old one gets too old or damaged to use. Physical differences in appearance can be covered up with illusion magic, much like Liches often do in the east. However, should Immarel's host body be killed physically, Immarel will be forcibly booted back to the Heart-Chamber beneath the Frostspear, and must first recover for a time before re-transferring to a new host body. While this method, and slightly unique form of Lichdom, is too bespoke and limited to be utilised anywhere else, it is nonetheless vital to the success of the Immarellian regime. Pray that Immarel uses the gift bestowed to her wisely..."
 magic_project.710.a:0 "Look upon me. I am perfect."
 become_a_lich_tt:0 "For as long as the Phylactery persists, so too will the §RLich§!.\n\nThe laws of the natural world have been defiled.\n§RCertain beings residing beyond the material plane may not take kindly to this.§!\n"
 ruled_by_lich:0 "Ruled by a Lich"
 lich_ruler:0 "Lich Ruler"
 lich_ruler_desc:0 "Liches are the ultimate expression of inhumanity and magical power. You are also utterly immortal... so long as that phylactery in the capital stays safe and hidden!"

 magic_project.711.t:0 "Affairs of a Lichly State"
 magic_project.711.d:0 "Unholy multitudes of dark acolytes flock to the banners of $COUNTRY$ and have raised a good question: why does the esteemed [Root.Monarch.GetTitle] [Root.Monarch.GetName] still cling to a state unsuited for such magical domination?\n\nThey have suggested a shift in the power structure of the country, focusing on [Root.Monarch.GetName] and of course, [Root.Monarch.GetHerHis] magical subordinates."
 magic_project.711.a:0 "Turn into a Magocracy!"
 magic_project.711.b:0 "The government is fine as it is."

 magic_project.712.t:0 "Lichless Government"
 magic_project.712.d:0 "With the death of our lich ruler, the administrators of country face a new dilemma: how will we function without a ruler that has served us since time immemorial?"
 magic_project.712.a:0 "The lich had a worthy apprentice to take the mantle"
 magic_project.712.b:0 "The dark acolytes of the realm solidified their magocratic control"
 magic_project.712.c:0 "The realm reverted back to its old form, before the dark times"

 magic_project.713.t:0 "Lich Revival"
 magic_project.713.d:0 "Days after the lich's death, a strange dark substance oozes out of the phylactery. The dark substance soon forms into a rotting, naked duplicate of the former ruler before their lingering soul penetrates and possesses their undead vessel once again.\n\n§B(A new heir will be created, but this heir is actually your lich reborn. Use this time to rename your lich if needed)§!"
 magic_project.713.a:0 "The lich assumes their rightful place as [Root.Monarch.GetTitle]."
 magic_project.713.b:0 "Our immortal ruler is shortly revived and takes their rightful place as [Root.Monarch.GetTitle]!"	#Used in Elections.txt, also used for vampires and other immortal ruler types

 magic_project.714.t:0 "Invaders Searching for Phylactery"
 magic_project.714.d:0 "Our capital, [Root.GetName], has been occupied and the invaders are searching for our phylactery. If they are left to search unopposed, it is only a matter of time until it is found and destroyed."
 magic_project.714.a:0 "We must stop them quickly!"
 magic_project.714.b:0 "Our wards will slow them down, but we must hurry!"
 
 magic_project.715.t:0 "Search for the Phylactery Begins"
 magic_project.715.d:0 "[From.Owner.GetName] is ruled by a lich and we have occupied their capital. We have started searching [From.GetName] for the lich's phylactery, the container for their soul, so it can be destroyed and the lich with it."
 magic_project.715.a:0 "Hold onto [From.GetName]. Give the [Root.Culture.GetName] time to work."

 magic_project.717.t:0 "Lich Phylactery Destroyed!"
 magic_project.717.d:0 "You could feel it at an instant.\n\nWith the destruction of [Root.Monarch.GetName]'s phylactery came the destruction of [Root.Monarch.GetHerHis] soul. Soon after that death begins to reclaim what was rightfully theirs, and [Root.Monarch.GetName]'s physical coil begins to fade to dust, leaving nothing."
 magic_project.717.a:0 "Nooooooooo!"

 magic_project.718.t:0 "A Monster Destroyed"
 magic_project.718.d:0 "We have found the corrupted heart of the evil that plagues us. The phylactery of the lich is now in our grasp. With the destruction of this phylactery, we can remove the immortality of the lich [From.Owner.Monarch.GetName] and destroy them once and for all, forever ridding our world of the malaise of their influence."
 magic_project.718.a:0 "Evil never outlasts good."

