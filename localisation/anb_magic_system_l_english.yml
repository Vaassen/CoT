 magic_system.66.t:0 "Rise of a Witch-King"
 magic_system.66.d:0 "[Root.Monarch.GetName] has made [Root.Monarch.GetHerselfHimself] known as a powerful practitioner of magic, and one unbound by the shackles of old laws and regulations, or as the Anbenncóster sycophants call it: a Witch-King.\n\nThe international community see [Root.Monarch.GetName] as a power-mad leader of a pariah state and an outcast amongst the diplomatic circles of the world...\n\n...but who cares?\n\nA lion does not concern itself with the opinions of sheep."
 magic_system.66.a:0 "Kneel before me!"
 magic_system.67.t:0 "Death of a Witch-King"
 magic_system.67.d:0 "The [Root.Monarch.GetTitle] is dead!\n\nWhispers of freedom spreads through [Root.Country.GetName], as the light of hope dawns on a possible new direction for [Root.Country.GetName].\nWill the dread realm continue on under a worthy successor, will ambitious warlords seek to fill the power vacuum left by such a power, or will freedom strike true and liberate the oppressed peoples?"
 magic_system.67.a:0 "A worthy successor rises!"
 magic_system.67.b:0 "Chaos reigns..."
 magic_system.68.t:0 "Witch-King Reformed?"
 magic_system.68.d:0 "The [Root.Monarch.GetTitle] has grown tired of that phrase, "witch-king". [Root.Monarch.GetSheHeCap] has grown tired of the groans and moans. And perhaps it's been long enough since those hot-headed days that [Root.Monarch.GetSheHe] can now consider an alternative route..."
 magic_system.68.a:0 "Freedom for all peoples!"
 magic_system.68.b:0 "I still am who I am."
 magic_system.69.t:0 "Evil [This.Monarch.GetTitle] Removed"
 magic_system.69.d:0 "[This.Monarch.GetName] has been defeated and their empire shattered!\n\nWhispers of freedom spreads through [This.Country.GetName], as the light of hope dawns on a possible new direction for [Root.Country.GetName].\nWill the dread realm continue on under a worthy successor, will ambitious warlords seek to fill the power vacuum left by such a power, or will freedom strike true and liberate the oppressed peoples?"
 magic_system.69.a:0 "We must retain control of what still remains"
 magic_system.70.t:0 "[From.Monarch.GetName] [From.Monarch.Dynasty.GetName] Removed"
 magic_system.70.d:0 "Thanks to our righteous deeds [From.Monarch.GetName] has been defeated and their empire shattered!\n\nThis will surely be the dawn of a new era for [From.Country.GetName]."
 magic_system.70.a:0 "Legends will be told our of deeds here today!"
 
 incident_witch_prince:0 "Rise of a Witch-Prince in the empire"
 incident_witch_prince_member_alert:0 "[imperial_witch_king.Monarch.GetName] styles themselves Witch-King, and through their actions they have proven to be one in truth. The emperor cannot co-exist with Witch-Kings cause it's a challenge to their authority so there's growing pressure to remove them."
 incident_witch_prince_emperor_alert:0 "[imperial_witch_king.Monarch.GetName] styles themselves Witch-King, and through their actions they have proven to be one in truth. The emperor cannot co-exist with Witch-Kings cause it's a challenge to their authority so there's growing pressure to remove them."
 magisterium_may_join_war_tt:0 "The Magisterium will be asked to join us in our war, but may refuse to do so."
 magic_system.71.t:0 "Rise of a Witch-Prince"
 magic_system.71.d:0 "With the news that [imperial_witch_king.Monarch.GetName] has chosen to style themselves Witch-King, the empire has been shaken, surely the emperor will not allow his subjects to make such bold declarations?"
 magic_system.71.a:0 "They have forfeited the right to rule."
 magic_system.71.b:0 "Have we denounced them yet? Let's try that again."
 denounced_witch_king:0 "Unlawful Ruler"
 cowardly_emperor:0 "Cowardly Emperor"
 magic_system.72.t:0 "Rise of a Witch-Prince in [imperial_witch_king.GetName]"
 magic_system.72.d:0 "With the news that [imperial_witch_king.Monarch.GetName] the emperor has declared war to depose them, as the foremost magical authority in the empire it is our responsibility to aid the emperor in this cause."
 magic_system.72.a:0 "We will join the emperor."
 magic_system.72.b:0 "We have other concerns."
 shirked_imperial_responsibility:0 "Shirked Imperial Responsibilities"

 magic_system.77.t:0 "The Black Doctrine"
 magic_system.77.d:0 ""On the question of divinity, the view of the clergy is mistaken. A god is not simply a distant celestial, but instead a being capable of perceiving the magical chaos that binds the world. Therefore, if a sufficiently powerful mage can bend the chaos of magic to their will, they must then be considered an ascendant god."\n- Adelar síl na Whistlehill\n\nThe writings of Adelar, one of the many floodborn mages born in Escann during the Crimson Deluge, had been banned in the wake of the many wars in Cannor, as maverick mages used them to justify war and atrocity. Yet his writings lived on in the thriving underground book trade, collected into a single tome known as The Black Doctrine.\n\nHaving secured a translated copy of The Black Doctrine, [This.Monarch.GetName] now understands why it was banned: fear. The same fear that had caused their neighbours to dub [This.Monarch.GetHerHim] a Witch King. It was a fear of the truth - that [This.Monarch.GetSheHe] was so above all others that [This.Monarch.GetSheHe] was effectively a god.\n\nNot in [This.GetName] though. Here, where [This.Monarch.GetName] rules completely, there can be only one truth."
 magic_system.77.a:0 "I am the Truth!"
 magic_system.77.b:0 "I shall not abandon my faith."