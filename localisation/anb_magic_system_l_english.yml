 #####################
 ### EXP MODIFIERS ###
 #####################
 # Here is an explanation of how the exp modifier values are localized:
 # The exp modifiers (ruler, estate, schools) are all exported to a FLOAT VARIABLE id'ed after the modifier but with _val at the end
 # (i.e. mages_ruler_experience_mod becomes mages_ruler_experience_mod_val)
 # This happens very often. Every month, when you gain xp, when you change menus, and when you start advancing.
 # If you are advancing, two of the variables are summed together to create a FLOAT VARIABLE called total_magic_experience_mod_val
 # These variable ids are then localized with names that are their own value, but in green or red and decimal form.
 # This is done using custom localisation that changes the color code based on the value of the variable
 # It also appends .0 if necessary, to be consistent with PDX tooltips.
 # However, in order to access these names, you have to pass them through custom localisation
 # So [Root.get_mages_ruler_experience_mod_val] might result in §G+20.0%§! after all is said and done
 #### Do [Root.get_mages_ruler_experience_mod_val] if you want to access a nice, colored, percentage modifier value in any context. 
 # Note: Heir xp mods are the same numbers as ruler xp mods so this is bit shared between them.

 # The above is then wrapped in a second localised STRING identified with the _string append. 
 # So for example, mages_ruler_experience_mod_string includes mages_ruler_experience_mod_val
 # The _string loc contains the name of thing whose magic xp mod is being shown
 # And that name is in teal if that modifier is currently in use. This is followed by a colon, a space, and the _val
 # So for example, mages_ruler_experience_mod_string might be "Ruler: §G+20%§!"
 # Or it might be "§TRuler:§! §G+20.0%§!" if the ruler is studying.
 #### Do custom_tooltip = mages_ruler_experience_mod_string if you just want that one string in a custom tooltip or something.

 # In order to make this all accessible, it is finally placed inside a CUSTOM LOC string that does nothing except point at the previous string loc line.
 # The custom loc string is named after the modifier, with get_ appended
 # Therefore, [Root.get_mages_ruler_experience_mod_string] works to get you the modifier name and value.
 #### Do [Root.get_mages_ruler_experience_mod_string] if you want to integrate the things done here into another loc string

 total_experience_mod_val:0 "[This.GetTotalXpModPos][This.total_experience_mod_val.GetValue][This.GetTotalXpModDecimal]%§!"
 total_experience_mod_string:0 "§TTotal:§! [This.get_total_experience_mod_val]" #TODO Bonbon: consider giving this some additional functionality? Putting the crown there or something.
 mages_ruler_experience_mod_val:0 "[This.GetRulerXpModPos][This.mages_ruler_experience_mod_val.GetValue][This.GetRulerXpModDecimal]%§!"
 mages_ruler_experience_mod_string:0 "£monarch_crown_icon£[This.GetRulerAdvancingColor]Ruler:§! [This.get_mages_ruler_experience_mod_val]"
 mages_heir_experience_mod_string:0 "£heir_crown_icon£[This.GetHeirAdvancingColor]Heir:§! [This.get_mages_ruler_experience_mod_val]"
 mages_estate_experience_mod_val:0 "[This.GetEstateXpModPos][This.mages_estate_experience_mod_val.GetValue][This.GetEstateXpModDecimal]%§!"
 mages_estate_experience_mod_string:0 "£mages_estate_icon£[This.GetEstateAdvancingColor][This.GetMagesName]:§! [This.get_mages_estate_experience_mod_val]"
 abjuration_experience_mod_val:0 "[This.GetAbjurationXpModPos][This.abjuration_experience_mod_val.GetValue][This.GetAbjurationXpModDecimal]%§!"
 abjuration_experience_mod_string:0 "[This.GetAbjurationAdvancingColor]Abjuration:§! [This.get_abjuration_experience_mod_val]"
 conjuration_experience_mod_val:0 "[This.GetConjurationXpModPos][This.conjuration_experience_mod_val.GetValue][This.GetConjurationXpModDecimal]%§!"
 conjuration_experience_mod_string:0 "[This.GetConjurationAdvancingColor]Conjuration:§! [This.get_conjuration_experience_mod_val]"
 divination_experience_mod_val:0 "[This.GetDivinationXpModPos][This.divination_experience_mod_val.GetValue][This.GetDivinationXpModDecimal]%§!"
 divination_experience_mod_string:0 "[This.GetDivinationAdvancingColor]Divination:§! [This.get_divination_experience_mod_val]"
 enchantment_experience_mod_val:0 "[This.GetEnchantmentXpModPos][This.enchantment_experience_mod_val.GetValue][This.GetEnchantmentXpModDecimal]%§!"
 enchantment_experience_mod_string:0 "[This.GetEnchantmentAdvancingColor]Enchantment:§! [This.get_enchantment_experience_mod_val]"
