 abjuration_desc:0 "The School of Abjuration deals in spells that protect, block or banish, such as defensive wards. Mages who focus in this school are called Abjurers."
 conjuration_desc:0 "The School of Conjuration deals in spells that bring creatures or materials to this plane, such as elemental servants. Mages who focus in this school are called Conjurers."
 divination_desc:0 "The School of Divination deals in spells that reveal information, such as scrying or foretelling the future. Mages who focus in this school are called Diviners."
 enchantment_desc:0 "The School of Enchantment deals in spells that interweave magic into existing objects. Often this is to affect the minds of others, such as charming or dominating creatures and people. Mages who focus in this school are called Enchanters."
 evocation_desc:0 "The School of Evocation deals in spells that manipulate energy or create something out of nothing, such as creating a fireball. Mages who focus in this school are called Evokers."
 illusion_desc:0 "The School of Illusion deals in spells that alter the outward perception of things or create false images, sounds, and ideas. Illusory constructs are perceived by several beings at once, and yet are not bound by the constraints of reality. Mages who focus in this school are called Illusionists."
 necromancy_desc:0 "The School of Necromancy deals in spells that manipulate, create or destroy positive life energy, such as draining someone's essence or creating an undead army. Mages who focus in this school are called Necromancers."
 transmutation_desc:0 "The School of Transmutation deals in spells that change an object and its properties into something else, such as turning rocks into gold or shapeshifting into creatures. Mages who focus in this school are called Transmuters."

