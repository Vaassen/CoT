### MISSIONS
 S98_adventure_begins_title:0 "The Adventure Begins"
 S98_adventure_begins_desc:0 "We our in our ancestral homeland. Some to seek fortune, some to seek fame, and others at the behest of our overlords in Rayafo. Regardless of why we are here, we all share the same goals. Land and fortune… glory and adventure. To claim our prizes, we must fight those who drove our ancestors out of this land. We must fight the beasts that haunt the jungle. We must rule once more!"

 S98_oppression_kaino_title:0 "The Kaino Oppression"
 S98_oppression_kaino_desc:0 "The Kaino people have long been oppressed by the other cultures of Fangaula. Long ago they transgressed holy bounds and supported the evil lich from which they get their name. Ever since, they have exiled to the deeps of the Dao Nako jungle, lands we once called our own. However, where the rest of the Fangaulan people see others to be shunned and oppressed, we see potential allies. In a land where we are outnumbered, the Kaino people provide a much needed source of support against the rest of the Fangaulan peoples."

 S98_southern_tower_title:0 "The Southern Tower"
 S98_southern_tower_desc:0 "The Halflings of Tiboktsamo are a haughty and proud people. The last remaining clan of our kind that did not flee to Favahnosy, the Tiboktsamo people have grown hateful of Halfling and Human alike. Refusing to treat with us and bent on conquest, these former brothers and sisters are now a thorn in the side of Sarhal. Additionally, they occupy a strategically important island. It is time we bestow upon them the glory of rightful rulership and replace their wardens with heroes."

 S98_freeing_the_ananoma_title:0 "Freeing the Ananoma"
 S98_freeing_the_ananoma_desc:0 "The Ananoma, ancient beehive-shaped fortresses built by our ancestors on the mainland, dot the shores of Southern Sarhal. These once proud structures have fallen into disrepair, but they can be reclaimed and fortified again. One such Ananoma is located just to the east of our land, in the great city of Kunolo. Now ruled by humans, Kunolo's great trading port and the Ananoma within must be under our control if we seek to wrest Southern Sarhal into our grasp."

 S98_reclaiming_the_throne_title:0 "Reclaiming the Throne"
 S98_reclaiming_the_throne_desc:0 "When the crown of Rayafo sent us to the mainland to reclaim past glory, they assumed we would return all of our conquests to them. However, we have grown too strong, too proud and too rich to hand over our hard-won spoils to bureaucrats who do nothing but sit in their halls on their safe little island. We must instead use our newfound strength to bend their knees to us. It is no longer our path to serve a distant crown on an island, but their path to serve the reclamation of our ancestral rights."

 S98_the_hydra_title:0 "The Hydra"
 S98_the_hydra_desc:0 ""A hundred heads! Fifty tails… All bigger than the last!"\n\n "Radama, get your mind straight, five, six heads at most. Was a big creature, just like the ones in the painting of old king Ravaka in the capital hall."\n\n "Aye, just like that, but bigger, scarier, stronger!"\n\n "…Anyways, it was a hydra. Just outside the first Ananoma to the west. I reckon our fancy, new Monster Hunters can handle it." - Radama and Zalifa, Husband and Wife and Co-Owners of the Sira Bamdivy"

