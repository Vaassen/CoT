 A33_on_wings_of_artificery_title:0 "On Wings of Artificery"
 A33_on_wings_of_artificery_desc:0 "It seems commonplace now, doesn’t it? And yet the way we war now, the way we keep peace, was yet another unimaginable thing the children of Verne seized from their dreams. I’d give my left nut to fly on one of those things, to see the world from there. Safer than it’s ever been, and more terrifying to be at their mercy..."
