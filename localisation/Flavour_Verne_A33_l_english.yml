l_english:
 A33_the_vernman_renaissance_title:0 "The Vernman Renaissance"
 A33_the_vernman_renaissance_desc:0 "Not a stupid question at all - quite perceptive! Indeed, we did not follow Cannor in its lust for all things elven, in its memories of Dameria. Not all the way, at least. We took what made sense, we Vernmen did, without forgetting the dark shadow at Cannor’s back, the bloody tragedy of Escann. In their grief they brought to us the memory of the knight, the young lad willing to be made foolish for a cause!\n\nI saw you with that one by the bar… an idiot, no? But earnest, and charming. We Vernmen know even an idiot can be a hero, if he is good at his core. Everywhere else, rebirth meant knowledge alone - even our friends the Eborthíli are more of the mind than the spirit, even now… it is no insult! It is merely this - think what a fool our Corin must have seemed to the clever and the sensible."
 erne_A1_tt_1yes:0 "£yes£ If §YRenaissance§! has NOT been adopted, the following effects happen:"
 verne_A1_tt_1no:0 "£no£ If §YRenaissance§! has NOT been adopted, the following effects happen:"
 verne_A1_tt_2yes:0 "£yes£ §TAlternatively§!\nIf §YRenaissance§! has been adopted, the following effect happens:"
 verne_A1_tt_2no:0 "£no£ §TAlternatively§!\nIf §YRenaissance§! has been adopted, the following effect happens:"

 A33_the_grand_port_of_heartspier_title:0 "Grand Port of Hearstpier"
 A33_the_grand_port_of_heartspier_desc:0 "Not a city lone but a river flow, our Vernman heart. Twin cities, Verne and Heartspier, see, up or down the course from one another. You’ll find folk who’ve never left their riverboats for more than a day, folk for whom its water might as well be the whole world. Then a level up from that, the fisher lads who never leave the Gulf, the freightsmen who do two trips a day from Stingport. Waters and waters and waters, radiating out.\n\nS’easy to forget now, with the great warehouse city and the wharfs, that this is where we first looked out from Cannor, this is where we dared most, dreamed most. Go anywhere around the world, find any lad with a great moustache. Even if he’s never been here, he had to go through here, up in his head. We all do."
 verne_new_armada:0 "A New Armada"
 verne_new_armada_desc:0 "PLACEHOLDER"
 verne_port_of_adventure:0 "Port of Adventure"
 verne_port_of_adventure_desc:0 "This port is one of the fabled Vernmen Ports of Adventure, harbours from which a thousand stories began."
 verne_the_wyverns_gulf:0 "The Wyvern's Gulf"
 verne_the_wyverns_gulf_desc:0 "PLACEHOLDER"

 A33_the_vernissage_title:0 "The Vernissage"
 A33_the_vernissage_desc:0 "See, it’s better if I plot it out for you like this. We have the cups; yours is the main building, mine is the entrance. The first building, the heart, is by the cruelty of time perhaps the least impressive, though it is still beautiful in its way. Smaller special collections are kept there, temporary follies, to get to which the adoring crowd must pass all others...\n\nYou must imagine, back in the day, a grand gallery at the centre of a large plot. Leafy parkland, for none of the other wings had been built up then..."

 A33_expand_the_Vernissage_title:0 "Expand the Vernissage"
 A33_expand_the_Vernissage_desc:0 "“All the knowledge of the world is at my fingertips; I take a tome, and bring it from the Royal Library across the street, and sit among the gentle breezes and flowers of the Vernissage park. The ladies and gents here do not reject me - they nod as they pass, for I wear what they wear, I do as they do. I spend entire days among the gardens, and this is accepted as simply the price of study, what one must do if one is to suffuse in the world.\n\nI avoid the Bronze Wings, of course. There is a plaque there which says something especially stupid about Biakata, and I must be a sub-Rector before I have a chance of amending it.”\n\nArchivist Kilewo Lesedi, Private Correspondence"
 verne_A8_effect_tt_1:0 "£no£ If we have completed the §YInfrastructure§! ideas, the following effect will happen:"
 verne_A8_effect_tt_2:0 "£yes£ If we have completed the §YInfrastructure§! ideas, the following effect will happen:"
 verne_A8_effect_tt_3:0 "£no£ If we have completed the §YEconomic§! ideas, the following effect will happen:"
 verne_A8_effect_tt_4:0 "£yes£ If we have completed the §YEconomic§! ideas, the following effect will happen:"
 verne_A8_effect_tt_5:0 "£no£ If we have completed the §YAdministrative§! ideas, the following effect will happen:"
 verne_A8_effect_tt_6:0 "£yes£ If we have completed the §YAdministrative§! ideas, the following effect will happen:"

 A33_zenith_of_the_eastern_princes_title:0 "Zenith of the Eastern Princes"
 A33_zenith_of_the_eastern_princes_desc:0 "If Verne did not exist, Arawkelin would be the most beautiful city in the world - I say so from experience! They grow moustaches there, you know, the otherwise hairless elves - they have a cosmetic magic for it. They swagger in the shadow of golden temples, quite as handsome and impressive as any Vernman. You see them on the floating markets, chatting up loves of a thousand peoples, taking as much advantage as they can of the sunset on the river. As it should be!"
 verne_martao_deal:0 "Martao Deal"
 verne_martao_deal_desc:0 "PLACEHOLDER"
 verne_A9_effect_tt1:0 "Converts up to §Y10§! owned provinces in the §YLupulan Rainforest§! region to §YCorinite§!"
 verne_A9_effect_tt2:0 "\nEnables Halessi adventures"

 A33_the_halanni_exposition_title:0 "The Halanni Exposition"
 A33_the_halanni_exposition_desc:0 "Of course it is arrogant! To claim to be capital of the entire world, the very centre of history, even for a moment. But we have gone even further. In bringing together all the greatest treasures of the world in one place, in claiming ownership so profoundly over the very stories of the world, the Exposition makes this claim permanently. More importantly, it makes the idiot dare - come take it from us, then, if you’re so upset..."
 verne_A10_effect_tt_1:0 "\n\n£no£ If we have completed the §YDiplomatic§! ideas, the following effect will happen:"
 verne_A10_effect_tt_2:0 "£yes£ If we have completed the §YDiplomatic§! ideas, the following effect will happen:"
 verne_A10_effect_tt_3:0 "£no£ If we have completed the §YInfluence§! ideas, the following effect will happen:"
 verne_A10_effect_tt_4:0 "£yes£ If we have completed the §YInfluence§! ideas, the following effect will happen:"
 verne_A10_effect_tt_5:0 "£no£ If we have completed the §YCourt§! ideas, the following effect will happen:"
 verne_A10_effect_tt_6:0 "£yes£ If we have completed the §YCourt§! ideas, the following effect will happen:"
 verne_international_investment:0 "International Investment"
 verne_international_investment_desc:0 "PLACEHOLDER"

 A33_the_heart_of_darkness_title:0 "The Heart of Darkness"
 A33_the_heart_of_darkness_desc:0 "The Effelai is beautiful. Keep that in mind, when I tell you this next one. We fear the Effelai as animals, as we should, for its vengeance and cruelty are terrible indeed. But it is a place of stories and of adventure, a place where the adventurer is tested. You see things there which are seen nowhere else, and you know new fears. We begin, paradoxically, already at the jungle’s heart..."
 verne_A11_effect_tt:0 "\n§GEvent Insight§!\nWe will set out to explore in the ruin deep in the Effelai, the jungle might not appreciate this..."

 A33_the_grand_vernissage_title:0 "The Grand Vernissage"
 A33_the_grand_vernissage_desc:0 "When you go to the complex - and you must - you’ll find one of the old Halls of Exposition converted into what’s called the Parade Hall. Unassuming, in truth, it tends to get missed because it’s tucked behind a staircase off the main Promenade. Inside, one of the earliest attempts at mass-scale magical holorecording plays over and over, recording the opening of the Grand Galerie to the public. Forget the parade itself - though it was by all means mind-blowing, a parade of fifty peoples and a grand air show of wyvernriders. Instead, ponder the amount of effort, and magic, and the sheer cost invested in such a recording, so long before modern artificery? You see! The recording itself is as singular as the event..."
 verne_A12_trigger_tt:0 "§Y40§! §YWyvern§! regiments are present"
 verne_A12_effect_tt:0 "\nEach artifact present in the §YVernissage§! will grant us §G20§! of each monarch power, §G5§! prestige, §G20§! splendour, §R1§! agressive expansion and §G1§! innovativeness\n"

 A33_project_holohana_title:0 "Project Holohana"
 A33_project_holohana_desc:0 "Of course we were first through the storm wall, when it finally fell. We are Verne, and the only thing greater than a challenge is a completely unknown one. They have recordings of these things, these great beasts, in the Vernissage. They date from less than a year after Insyaa became accessible. A year!\n\nPicture this: Insyaa, [GetYear]..."

 A33_alvars_reforms_title:0 "Alvar's Reform"
 A33_alvars_reforms_desc:0 "Stay sat, good friend! - the service here is fine. Drink well, and hear the florid tale of Verne.\n\nA lesser man than I in a lesser pub than this may tell you finely of our beloved Alvar, wyvern-seeker King. He will speak with bated breath of his adventurer’s heart, the lust for danger shared with every Vernman true who grew his moustache in our storied land. He will not tell you of the Alvar young who in his father’s court first smelled the Lilac stink, who yelled his throat but hoarse, begging that his father not water this evil flower in Vernman blood...\n\nBut you’ve got me, and so you’re lucky, see! - for you will know the Alvar who opened every gate of Verne to the suffering Escanni, those from whom we Vernmen remembered chivalry. Alvar knew that the profit of heedless bravery is only death; he knew the boisterous heart of his people, and sought to make them just as wise.\n\nYou must choose whichever Alvar you love best, of course. Such is the tyranny of the listener."
 verne_exaltation_of_adventurers:0 "Exaltation of Adventurers"
 verne_exaltation_of_adventurers_desc:0 "PLACEHOLDER"
 verne_foreign_doctrines:0 "Foreign Doctrines"
 verne_foreign_doctrines_desc:0 "PLACEHOLDER"
 verne_B1_1_effect_ttyes:0 "£yes£ If both §YGenerous Quest Rewards§! and §YHeroes in the Army§! are granted to the §YAdventurers§! estate and the §YVernmen Adventurers§! mercenaries are hired, the following effects will happen:"
 verne_B1_1_effect_ttno:0 "£no£ If both §YGenerous Quest Rewards§! and §YHeroes in the Army§! are granted to the §YAdventurers§! estate and the §YVernmen Adventurers§! mercenaries are hired, the following effects will happen:"
 verne_B1_2_effect_ttyes:0 "£yes£\n§TAlternativerly§!\nIf §YHeroes in the Army§! has been revoked and either §YArbaran§!, §YWex§! or §YLorent§! has a 100 opinion of §YVerne§!:, the following effects happen:"
 verne_B1_2_effect_ttno:0 "£no£\n§TAlternativerly§!\nIf §YHeroes in the Army§! has been revoked and either §YArbaran§!, §YWex§! or §YLorent§! has a 100 opinion of §YVerne§!:, the following effects happen:"

 A33_the_riches_of_the_khenak_title:0 "The Riches of the Khenak"
 A33_the_riches_of_the_khenak_desc:0 "It’s not called Redbrass, you know. Redbrass, you don’t know it? Well, it’s - well it’s not called that. It’s Vernman bronze, you make sure you don’t walk into any shop here and call it Redbrass, because that it isn’t. …? It’s for cannons, mostly… well, scales, sometimes. Well, perhaps you won’t. But if you do, you make sure you don’t call it Redbrass, no Vernman calls it redbrass. Quite right, you’re one of the good ones.\n\nIt comes out the Khenak, and only the Khenak. So the gunpowder age was ours to rule, like fate, like the lucky roll of the die. But it’s not enough to roll right, never is. We knew to take the place, and plant our flag, and make it ours."
 verne_redbrass_surpluss:0 "Redbrass Surpluss"
 verne_redbrass_surpluss_desc:0 "PLACEHOLDER"
 verne_B2_1_effect_ttyes:0 "£yes£ If only §YBronzewing Hall§!, §YVerne§! and §YArca Lar§! have been developped, the following effects happen:"
 verne_B2_1_effect_ttno:0 "£no£ If only §YBronzewing Hall§!, §YVerne§! and §YArca Lar§! have been developped, the following effects happen:"
 verne_B2_2_effect_ttyes:0 "£yes£ §YAlternatively§!\nIf any of §YLokkek Height§!, §YMount Khenak§! and §YKhenak Pass§! also have §Y5§! base production and §Y15§! development or §YExpanded Infrastructure§!, the following effect happens:"
 verne_B2_2_effect_ttno:0 "£no£ §YAlternatively§!\nIf any of §YLokkek Height§!, §YMount Khenak§! and §YKhenak Pass§! also have §Y5§! base production and §Y15§! development or §YExpanded Infrastructure§!, the following effect happens:"
 verne_khenak_excavations:0 "The Khenak Excavations"
 verne_khenak_excavations_desc:0 "PLACEHOLDER"

 A33_the_rogue_duchy_title:0 "The Rogue Duchy"
 A33_the_rogue_duchy_desc:0 "Odd to think now, of course, but there was a time, a long long time, when the northern parts of Verne were taken from us. These sorts of things shrink from a distance, seem silly to a foreigner like you, I’ll bet - but Galéinn was torn away, and we felt its absence. Do you understand what I mean when I say that a man must regain his honour before he can do great things? We wished to face the world, we Vernmen, but we needed to be whole."
 verne_restoring_the_borders:0 "Restoring the Borders"
 verne_restoring_the_borders_desc:0 "PLACEHOLDER"

 A33_across_the_pond_title:0 "Across the Pond"
 A33_across_the_pond_desc:0 "Think of the last place you stayed, before you started your way here. You look smart enough, but even if it was some run-down dockside tavern.  It’s the last stop before your grand journey, before an old time ends and a new one begins. It’s a delicious anticipation. For we fargoers of Verne, that place is Akasik. Not home, exactly, but a gateway, a place of friendly faces and silver tongues. Headed south or east, you’re likely to see an Akasi port on a Vernman itinerary.\n\nIt is among the loveliest places of the world, not word of a lie. People talk of the desert and forget the coast, the place you stop off. Green as anywhere, gorgeous sun, these little date cakes with syrup… I’ve half a mind to retire there, if I can scrape up the cash."
 verne_B4_effect_tt:0 "Unlocks Akasi and Bulwari §YAdventures§!."

 A33_in_search_of_adventure_title:0 "In Search of Adventure"
 A33_in_search_of_adventure_desc:0 "So now we finally come to it! Don’t blush, that question’s likely the first you should’ve asked. Why is it, exactly, that a Vernman possessed of a virile and healthy moustache must always be in search of a good death? Well, your standard priest of Nerat will go on about death as a mirror to life, perhaps, but I’m just a man in a pub, and I intend to cite Corin.\n\nBear with me, here  - you may as well have just asked me why Corin went to war. Of course, she’s a woman of justice, a righter of wrongs, all that sort of thing… but there are many kinds of justices, and some of them sit in courthouses and I’m sure they’re very wise indeed. Not Corin. Corin climbs up the tree before everyone else has finished bickering about where to find a ladder. Her spirit is in the questing, in the finding! Just as it is in ours."
 verne_off_to_adventure:0 "Off to Adventure"
 verne_off_to_adventure_desc:0 "PLACEHOLDER"
 verne_unlock_network_of_adventure:0 "We will now gain the §Yupgradable§! modifier §YNetwork of Adventure§! scaling with the number of §YPort of Adventure§! in the world.\n\nFurthermore, a Province UI button will now be usable in coastal centers of trade in South Aelantir and Sarhal to establish a new §YPort of Adventure§!.\n"
 adventuring_ports_provinces:0 "Adventuring Ports"
 verne_port_of_adventure_button_tt:0 "Establish a Port of Adventure\n'The valiant venturers of Verne are vigorously vouchsafed from vile vandals via a vast variety of vigorously-invacuated naval vantages.'\n"
 verne_port_of_adventure_button_effect_tt:0 "§Y100§! colonist Join a Frontier in a §YRandom§! province in the [This.GetRegionName] Region."
 verne_unlock_sarhali_adventures:0 "Unlocks Sarhali §YAdventures§!."

 A33_the_lands_of_adventure_title:0 "The Lands of Adventure"
 A33_the_lands_of_adventure_desc:0 "Now, forget what you’ve heard on this; let none accuse the Vernman of lacking an earnest love for South Aelantir! Our second home, as well it might be, for it is a continent and a land which demands the bravest alone, which in its every bower hides danger and wonder both. We made a home there no less keenly than the ruinborn, and let none doubt this! Does a younger sibling love a mother less for knowing her later? The emerald depths, the bloody drama of Taychend, the noble vaulted cities of Kheios… One forgets, we were not the ones to bring slaves to that place! No, we sought something else, the very nature of ourselves in that wealthy land, and as much wisdom as we could gain from its inhabitants..."
 verne_B7_effect_tt1:0 "Unlock Effelai and Amadian adventures."
 verne_B7_effect_tt2:0 "If we complete the First Circumnavigation §YThe Vernissage§! will display the §YTour of Halaan§! granting §G+1§! naval maneuver."

 A33_a_most_prized_item_title:0 "A Most Prized Item"
 A33_a_most_prized_item_desc:0 "One of the greatest endeavours humankind had ever undertaken at the time, though of course we beat that soon enough! The very body of a dragon, brought home across the ocean in perfect condition. What other nation of Cannor would have thought to dare of such a thing, I ask you? None! You must read Howerton’s account, for he knew the mage who came up with the whole idea in the first place, though I’m already getting ahead of myself. It begins in New Heartspier, which back then was known as Orenkoraim"
 verne_B9_trigger_tt:0 "§YBlue House§! Adventure completed"
 verne_gigantic_endeavour:0 "Gigantic Endeavour"
 verne_gigantic_endeavour_desc:0 "PLACEHOLDER"

 A33_laments_regatta_title:0 "The Lament's Regatta"
 A33_laments_regatta_desc:0 "Ha! I told you we would beat the thing with the dragon. Everything down there, impossibly fucking old, and in some ways even more trouble, ‘cause with the dragon bones, we weren’t shitting ourselves that some five thousand year old lizardfolk trap might go off and chop us to pieces.\n\nThis time, it’d take a whole lot more coordination..."

 A33_new_verne_title:0 "New Verne"
 A33_new_verne_desc:0 "Where else to place the capital of New Verne than Taychend? It is a country which knows its heroes, which remembers them, as we do ours. I will not tell the stories of that place for them; you have to go there, and wander under the spires of the ancients, and hear thousands of years of bold folk who fought and died for glory, too seldom for justice. Then you will know the will of Corin: that the heroism of the sentient spirit must bend ever towards what is right."
 verne_new_world_monopolies:0 "New World Monopolies"
 verne_new_world_monopolies_desc:0 "PLACEHOLDER"
 verne_B12_effect_tt:0 "All colonial areas in §YSouth Aelantir§! will be consolidated under singular regional administrations"
 NEW_VERNE:0 "New Verne"
 NEW_VERNE_adj:0 "New Vernman"
 verne_rename_to_new_verne_tt:0 "Our Colonial Nation in the §YTaychend§! region will be renamed to §YNew Verne§!"

 A33_old_friends_old_rivals_title:0 "Old Friends, Old Rivals"
 A33_old_friends_old_rivals_desc:0 "Don’t be shocked - those ones come to blows every week, usually in this very courtyard. It’s a Vernman thing. Like me pouring you the last of this - no, no, I insist.\n\nWe’ve always nurtured our feuds. In some ways one must respect a loyal enemy, for they show a sort of constancy all their own. We fought the pissants of the Pearls for the better part of a thousand years, they who ever sought to tighten their grip on the Dame’s lovely throat. A man cannot trust a people who take for their banner the pale white of the sickbed, for they will prove themselves wan and untrustworthy at the table. Pearlsedge suckled on the imperial teat, always manoeuvring for petty little gains, always dodging a fair fight.\n\nWe fought them with the Eborthíli, in point of fact. You see, it is the same with them and the Busilari. One an honest sort, one duplicitous. The Eborthíli fellow is a little reserved, perhaps, hard to read. He will prefer to play the gentle host, to keep everything moving. But he will not lie."
 verne_wyvern_stride:0 "The Wyvern's Stride"
 verne_wyvern_stride_desc:0 "PLACEHOLDER"

 A33_a_matter_of_pride_title:0 "A Matter of Pride"
 A33_a_matter_of_pride_desc:0 "“The matted Pearl collects her sea-logged dreck\nand nestles firmly in the purse’s weft\nAnd ever scrabbling at her poxéd neck \nDisgorges rancid juices from her cleft.”\n\n- ‘The Unclutched Pearl’, Verse 106, Anonymous."

 A33_the_allure_of_the_luna_title:0 "The Allure of the Luna"
 A33_the_allure_of_the_luna_desc:0 "[Root.verne_allure_of_the_luna_loc]"
 verne_allure_of_the_luna_loc_emperor:0 "Hard to defend, hard to defend, even for such a proud Vernman as I… but you have to know the longing the heart has for true family. The folk of the Luna were our cousins, our brothers! Ah, maybe you roll your eyes at the thought that genuine feeling might drive a country, but we are not unfeeling seneschals, we sons of Verne. We heed our passions even in the cold art of the state. We knew our family must be together, and longed to make it so..."
 verne_allure_of_the_luna_loc_not_emperor:0 "We were condemned, of course! By those with no familial bone in their body, those who have not had a child wander lost, those who do not know the keen pain of a family rent. So we went and we took our cousins by the ear, brought our family home - all the disagreements could be ironed out later. A man is a liar if he says he wouldn’t do the same. Mm. Maybe some Golden Giberdi..."
 verne_C3_effect_tt:0 "\n§GEvent Insight§!\nOur armies will march towards any defiant state in the Luna, the Emperor will not stay idle and the Imperial parliament will surely step in aswell - it would be good to sway opinion before escalating tensions.\n\nThe Imperial Parliament will debate our claim on the Luna, our allied free cities will side with us and are likely to enter our dominion."

 A33_the_kingdom_of_Verne_title:0 "The Kingdom of Verne"
 A33_the_kingdom_of_Verne_desc:0 "And so you see? Perhaps the boy in Alvar dreamed nightly of the wyvern’s soar, but not the man. The man remembered Verne - ‘not duchy mere, but kingdom old’. He saw our right and left wings unfurled over Luna and Khenak both, ready to launch. Even I, a man who’ll happily boast of that brilliant King - I would not claim of Alvar prescience clear. Instead, he saw what val’rous Verne must be, were it to face a future shrouded grey.\n\nWho are we then? - no, a fair question! I see that smile, too, perhaps a little disbelieving? I do not blame you - the brave must be ridiculous. And we are gladly so! Bold where others cower, vibrant where others are static, full of love and passion for the places and stories of this world. You sit here with me, in a little window bay overlooking the street, and I promise I will take you everywhere we went. Verne is the boldness to act, Verne is earnest memory. Verne is the madness to clamber on a wyvern’s back; Verne is dying gladly for a friend.\n\nOrder another drink, by Corin, don’t stand on ceremony. We’re not even at the bit with the cannibals..."
 verne_the_wyvern_king:0 "The Wyvern King"
 verne_the_wyvern_king_desc:0 "PLACEHOLDER"
 verne_C4_trigger_tt1:0 "Verne earned the full support of the Parliament during the §YLegacy of Bellac§! Incident."
 verne_C4_trigger_tt2:0 "Verne earned partial support of the Parliament during the §YLegacy of Bellac§! Incident."
 verne_C4_trigger_tt3:0 "Verne did not earn the support of the Parliament during the §YLegacy of Bellac§! Incident."

 A33_corins_shield_title:0 "Corin's Shield"
 A33_corins_shield_desc:0 "The heaven’s house was left empty; all the gods had left\nAnd in such times the black sheep may return, may prove his worth\nAnd come once more into the family hearth. So Agrados saw\nThe devastation of the people, the green ruin of Escann.\nThus we call Corin redeemer, for as she saves us\nSo is her life the atonement of Agrados.\nOurs is not the cold justice of the magistrate; the whistling air\nWhich howling among the stacks may yet forget to live.\nOurs is the redemption, the one who takes arms\nThe woman and the goddess, who remembers what it is\nto be mortal. Blood flowed through Corin, red as her locks\nAnd still does. We who name ourselves for our lady know\nJustice is not merely maintained; it is sought out.\n\n- Callatine of Stoutharbour, The Defence of Corin, Verse XVII "
 verne_C6_effect_tt:0 "All owned §YVernman§! provinces will have a §Y50%§! chance of becoming §YCorinite§!."

 A33_spread_the_word_title:0 "Spread the Word"
 A33_spread_the_word_desc:0 "This one is Eborthíli, do you see? The little blue wyvern. They have followed us in many things, perhaps at the cost of their pride… but it is the nature of the folk of Tef to take the long view, to be gently unbothered by questions of furious honour. So it was with Corin, for in questions of religion, the Eborthíli have ever proven placid and tolerant. It is as I say - an easy folk to get along with! But some things are vital, they lie at the heart. And when tested, the Eborthíli always eventually prove themselves righteous..."

 A33_in_the_name_corin_title:0 "In the Name of Corin"
 A33_in_the_name_corin_desc:0 "That the folk of Taychend have valour - not to mention magnificent beards - was never in question for us. They made fierce friends so easily - we loved their stories, their great history, their boldness. What worried us was their justice, their sense of right and wrong beyond the cult of the hero. For of course we Vernmen know the value of heroism, and have long wished for Cannor to grant it more recognition.\n\nMark my words when I say this - Oren Nayiru was to Taychend as Corinism was to Escann - a new light and a new hope. How fitting, that it should come about through the work of Ecaris, one of Corin’s closest allies in life! For Corin herself reflected justice and the righting of wrongs, and there were so many wrongs to be addressed in Taychend..."
 verne_C8_effect_tt:0 "\nEnables the Taychendi and Kheionai adventures\n"
 verne_corinite_synchretism:0 "Corinite Synchretism"
 verne_C8_effect_tt2:0 "All §YOren Nayiru§! provinces in Taychend owned by our Colonial Nations will get §YCorinite Synchretism§! until the end of the game, granting the following effect:\nLocal Missionary Strength: §R-100.0%§!\nLocal Tolerance of Heathens: §G+10.0§!"

 A33_born_of_valour_title:0 "Born of Valour"
 A33_born_of_valour_desc:0 "“The motif references a traditional song-cycle of the Effelai, but the style is classic Revivalist, part of an Cannorian Elven attempt to reassert 11th and 12th century styling and work after a century of perceived human dominance. The jungle vines are rendered almost as grapevines, while the holy figures who hold out against the jungle threat are depicted in keeping with Avatars, particularly the hagiographic imagery of Corin which proliferated at the time the fan was made. Donated by the half-ruinborn síl Maguake family, as part of the estate which would become the Valourpoint treasury building.\n\nLot n°1195, 16th century Valourpoint Fan. Wood and Silk.\n‘Valour at Sea’ Collection."
 verne_half_ruinborn_small_modifier:0 "Small Half-Ruinborn Minority"
 verne_half_ruinborn_small_modifier_desc:0 "PLACEHOLDER"
 verne_half_ruinborn_large_modifier:0 "Large Half-Ruinborn Minority"
 verne_half_ruinborn_large_modifier_desc:0 "PLACEHOLDER"
 verne_C9_effect_tt1:0 "\n£no£ If §YValorpoint§! is independent and our ally the following effects happen:"
 verne_C9_effect_tt2:0 "\n£yes£ If §YValorpoint§! is independent and our ally the following effects happen:"
 verne_C9_effect_tt3:0 "£no£\n§TAlternativerly§!\nIf §YValorpoint§! is not independent or not our ally and we have a colonial nation in §YNoruin§! the following effects happen:"
 verne_C9_effect_tt4:0 "£yes£\n§TAlternativerly§!\nIf §YValorpoint§! is not independent or not our ally and we have a colonial nation in §YNoruin§! the following effects happen:"
 verne_seas_of_valour_A33:0 "As long as §YVerne§! is the ally or the overlord of §YValorpoint§! or a colonial nation in §YNoruin§! we will gain the following modifiers:\nNaval Maintenance Modifier: §R+20.0%§!\nSailour Recovery Speed: §G+20.0%§!\nHull Durability: §G+5.0%§!\nMorale Lost on Sunk Ship: §G-5.0%§!"
 verne_seas_of_valour_other:0 "As long as §YVerne§! is our ally or our overlord we will gain the following modifiers:\nNaval Maintenance Modifier: §G-25.0%§!\nSailour Recovery Speed: §R-15.0%§!\nHull Durability: §G+5.0%§!\nMorale Lost on Sunk Ship: §G-5.0%§!"

 A33_the_vernman_era_title:0 "The Vernman Era"
 A33_the_vernman_era_desc:0 "“Herewithin is declared by Royal Writ the Peace of Verne, which brooks no Interference of vessels true (notwithstanding the trade of Souls) within fifty leagues of the Vernman Shore. The Shore is defined hereby as the United Kingdoms of Verne, Eborthíl and Akasik, the Southern Continent of Aelantir, and all Valorous Islands therebetween.”\n\nSecond Act of Maritime Supremacy, Preamble"
 verne_corinite_supremacy:0 "Corinite Supremacy"
 verne_corinite_supremacy_desc:0 "PLACEHOLDER"
 verne_vernman_era:0 "The Vernman Era"
 verne_vernman_era_desc:0 "PLACEHOLDER"
 verne_C11_effect_tt:0 "\n§YEvery§! country in §YCannor§!, §YSarhal§! and §YHaless§! will get §YCorinite Supremacy§! until the end of the game giving the following effect:\n§R-100.0%§! Resistance to Conversion\n"

 A33_valour_on_the_seas_title:0 "Valour on the Seas"
 A33_valour_on_the_seas_desc:0 "Inevitable, that scions of Verne should sometimes strike out on their own and make their name. But correct, too, that we should bring them back into the fold. Families belong together, whatever the diehard Valourpointers might say in the homes that the Pax Vernica keeps safe. The ambitious man, fighting for what is right, does not always come off well. Perhaps neither did we, on that night, the 16th Teysuren..."
 verne_C12_effect_tt2:0 "\n§GEvent Insight§!\nWe will bring §YValorpoint§! into the fold and bring them under our crown."
 verne_C12_effect_tt3:0 "\n§Y10§! Half-Ruinborn minorities will be created in owned provinces."

 A33_all_roads_lead_to_verne_title:0 "All Roads Lead to Verne"
 A33_all_roads_lead_to_verne_desc:0 "Ach, Verne is a clumsy city. No, don’t deny it, it’s a compliment to her. She’s fifteen things at once, the neighbourhood of the entire world, falling over herself to boast as a Vernman does. Everyone who arrives there boasts too, you see, insists on teaching the world exactly who they are - like a gallery at the Vernissage, they preen and show off. Taychendi blocks looming over transplanted Kelino temples, elven lodges keeping their careful distance from halfling bazaars: Verne is fucking gaudy! But here’s the truth: even those who hate her profusion of architectures, her endless sprawl… they all want to be there anyway. Fitting, really, that the only shared landmark, the only thing that stays the same wherever you are in the city, are the wyvern-spires."
 verne_grand_fleet_tier2:0 "Grandest Fleet"
 verne_grand_fleet_tier2_desc:0 "PLACEHOLDER"
 verne_all_roads_lead_to_verne:0 "All Roads Lead to Verne"
 verne_all_roads_lead_to_verne_desc:0 "PLACHOLDER"
 verne_corinite_hegemony:0 "Corinite Hegemony"

 A33_the_verne_halann_title:0 "The Verne-Halann"
 A33_the_verne_halann_desc:0 "Ah, you’ve been patient with me. No, no, don’t dissemble - Vernmen don’t dissemble, and you’re here, after all. This is how you know us, see. All these long-winded stories, these tales, this boasting! It’s us, it’s Verne. It’s why all the greatest sailors in the world are racing here, right now. Not just for the prize, but for the thrill of the act itself! That’s the spirit which built an Empire, and anyone can be a Vernman if they first perceive it. Maybe you will be…?\n\nTomorrow, or the day after - I see the Tellum Gazette’s still covering its arse on prediction - the spirit of the wyvernriders will charge into this city, right under our window. So you see why I kept insisting on this table. You could try the crowds tomorrow, sure, get lost in the endless streams of folk unlucky enough not to have run into a proper Vernman their first night, bake in the sun and sweat yourself faint… but I think you’re smarter than that. Better here, eh? In the company of a friend, with a good drink.\n\nCome, let us toast. To Verne - your very favourite fool."
 verne_halann_champions:0 "Verne-Halann Champions"
 verne_halann_champions_desc:0 "PLACEHOLDER"
 verne_halann_comitee:0 "The Verne-Halann Comitee"
 verne_halann_comitee_desc:0 "PLACEHOLDER"

 A33_taking_to_the_seas_title:0 "Taking to the Seas"
 A33_taking_to_the_seas_desc:0 "The mountain behind us, the Gulf ours - ah, Vernmen back then didn’t have all the modern stuff, and we weren’t what we are now. Scrappy, we were, taming the lion. Ambitious, and eager - ‘the sunset red no Vernman sailor fears/ but battens fast, horizon’s troubles clears’... By any count, we outfoxed them by breaking all the rules, reversing all the logic of naval encounter. The navies of the time, they didn’t want a pitched battle right up close, counted their careful pennies. We rammed right up their arseholes, gave the first man overdecks a double share of the plunder."
 verne_impressment_drive:0 "Impressment Drive"
 verne_impressment_drive_desc:0 "PLACEHOLDER"
 verne_glorious_engagement_given_tt:0 "We will adopt the §YGlorious Engagement§! naval doctrine, giving the following effects:\n§G+20.0%§! Chance to Capture Ennemy Ships\n§G+100.0%§! Naval Tradition from Battles\n§G+1§! Fleet Movement Speed"

 A33_taming_the_lion_title:0 "Taming the Lion"
 A33_taming_the_lion_desc:0 "“Keep him off me!” yells the scholar, and he’s adjusting his glasses and frantically restringing his stomach-crossbow, and so the swordsman bounds forward, dodging and weaving like, and the great lion takes a good few goes at him. It’s a dance they repeat, you see, for a few minutes or more, until the swordsman, losing his balance, stumbles to the ground. The lion approaches, rearing up for a final swipe,  and THUD! There goes a crossbow quarrel through the big beast’s head.\n\nSo the swordsman scrambles to his feet, takes a good ‘fucking hell’ breath, comes over and slaps his good lad - that’s Eborthíl - on the back, and Busilar’s fucked for good. And that’s a truer way of telling it than if I bandied about with numbers of soldiers, let me tell you."
 verne_D4_effect_tt1yes:0 "£yes£ If §YVerne§! own and has cored the §YBusilar§! area and the §YBusilari Strait§! area, the following effect will happen:"
 verne_D4_effect_tt1no:0 "£no£ If §YVerne§! own and has cored the §YBusilar§! area and the §YBusilari Strait§! area, the following effect will happen:"
 verne_D4_effect_tt2yes:0 "£yes£ §TAlternatively§!\nIf §YEborthíl§! controls the §YBusilar§! area and the §YBusilari Strait§! area, the following effect will happen:"
 verne_D4_effect_tt2no:0 "£no£ §TAlternatively§!\nIf §YEborthíl§! controls the §YBusilar§! area and the §YBusilari Strait§! area, the following effect will happen:"

 A33_a_union_of_crowns_title:0 "A Union of Crowns"
 A33_a_union_of_crowns_desc:0 "“The wyvern rears in pride of place, one claw raised over a planar sphere which traditionally represents Halann. Its wings unfurl over the other figures. To its left nests the tranquil blue wyvern of Eborthíl, a feature of the late 16th century onwards, as the wyvern motif displaces the dragon across much of Vernman art. The Akasik aoudad peers out at the world, incisive and curious, perhaps signifying Akasik’s role as Verne’s colonial gateway.”\n\nLot n°491, 17th century Vernman figurine. Bronze and Porcelain.\nGrand Galerie Collection"
 verne_wingspan:0 "Verne's Wingspan"
 verne_wingspan_desc:0 "PLACEHOLDER"
