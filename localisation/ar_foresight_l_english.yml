l_english:
 ar_fs_visions_window:0 "Divination: Unspent Futures"
 desc_ar_fs_visions_window:0 "We can spend our remaining Visions through national decisions."
 ar_fs_casting_cooldown:0 "Foresight: Recovering Our Sight"
 desc_ar_fs_casting_cooldown:0 "Foresight can be cast once every five years."
 ar_fs_foreseen_battle:0 "Foresight: The Foreseen Battle"
 desc_ar_fs_foreseen_battle:0 "Our commanders have already witnessed the next exchange of blows."
 ar_fs_perfect_audience:0 "Foresight: The Perfect Audience"
 desc_ar_fs_perfect_audience:0 "We know the right word, the right gift, and the right moment."
 ar_fs_ready_to_cast_tt:0 "Foresight is off its five-year cooldown."
 ar_fs_can_spend_tt:0 "Our Foresight window is open and we have at least §Y1 Vision§! remaining."
 ar_fs_cast_tt:0 "Gain §Y3 Visions§! to spend through decisions within §Y5 years§!. Recasting replaces unspent Visions. Foresight has a §Y5-year§! casting cooldown."
 ar_fs_has_fort_tt:0 "We lead a siege of an enemy fort which has not received a Vision during this casting."
 ar_fs_fort_reward_tt:0 "Spend §Y1 Vision§! to add §G5 siege progress§! to a selected eligible fort. Each fort may receive this benefit once per casting. Cancelling spends nothing."
 ar_fs_foreseen_battle_decision_title:0 "Foresight: The Foreseen Battle"
 ar_fs_foreseen_battle_decision_desc:0 "Visions remaining: §Y[Root.ar_fs_visions.GetValue]§!.\n\nSpend one Vision for §G+2 Attacker Dice Roll§! and §G+2 Defender Dice Roll§! for §Y90 days§!. This replaces The Perfect Audience. The same active boon cannot be renewed."
 ar_fs_falling_fortress_decision_title:0 "Foresight: The Falling Fortress"
 ar_fs_falling_fortress_decision_desc:0 "Visions remaining: §Y[Root.ar_fs_visions.GetValue]§!.\n\nChoose a fort where we lead the siege and spend one Vision for §G+5 siege progress§!. Use Next fort to browse. A fort can only be chosen once per casting."
 ar_fs_perfect_audience_decision_title:0 "Foresight: The Perfect Audience"
 ar_fs_perfect_audience_decision_desc:0 "Visions remaining: §Y[Root.ar_fs_visions.GetValue]§!.\n\nSpend one Vision for §G+3 Diplomatic Reputation§! and §G+25% Improve Relations§! for §Y1 year§!. This replaces The Foreseen Battle. The same active boon cannot be renewed."
 ar_foresight.fort.t:0 "The Falling Fortress"
 ar_foresight.fort.d:0 "Our diviners have seen the defenders of §Y[ar_fs_target_fort.GetName]§! abandon a crucial position. A warning delivered now could make that future certain.\n\nVisions remaining: §Y[Root.ar_fs_visions.GetValue]§!."
 ar_foresight.fort.confirm:0 "Make this future certain."
 ar_foresight.fort.next:0 "Show me another fortress."
 ar_foresight.fort.cancel:0 "Keep the Vision for another day."
