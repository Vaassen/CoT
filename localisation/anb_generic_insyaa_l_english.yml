 anteater_hysteria_colony_cost_increase: "Anteater Hysteria."
 anteater_hysteria_colony_cost_increase_desc: "Horrific tales of anteater attacks have spread throughout our nation, making it difficult to attract new settlers to the colonies. We have thus been forced to invest a significant amount of resources into increased financial incentives for new colonists and into measures to protect our people against anteaters to maintain a steady growth in our colonies."
 repurposed_termite_mound: "Repurposed Termite Mound."
 repurposed_termite_mound_desc: "Colonists have taken over a former termite mound, establishing a prospering settlement within its central cavity. Fungal farms formerly managed by termites have been repurposed to provide both sustenance and waste disposal for the settlement. In addition to this, the mound also provides ample protection from the elements, hinuifauna, and enemy forces alike."


