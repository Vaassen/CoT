 magic_project.300.t:0 "Know Thy Self"
 magic_project.300.d:0 ""
 magic_project.300.a:0 "The orb reveals what is within"
 orb_of_omniscience_project_effect_1:0 "§YEye for Talent§! now gives you greater control over which advisor you receive.\n\n§YDeposit Divination§! lasts twice as long." 
 
 magic_project.301.t:0 "Know Thy Enemy"
 magic_project.301.d:0 ""
 magic_project.301.a:0 "The orb reveals what is without"
 orb_of_omniscience_project_effect_2:0 "§YScry§! lasts twice as long and gives §G+25§! Spy Network in all affected nations."
 
 magic_project.302.t:0 "Know What is Not"
 magic_project.302.d:0 ""
 magic_project.302.a:0 "The orb reveals the future and all within it"
 orb_of_omniscience_project_effect_3:0 "Double the effects of §YManipulated Fortune§!.\n\n§YForesight§! now gives §G-15.0%§! All Powers Cost."
 
 magic_project.400.t:0 "The Base"
 magic_project.400.d:0 ""
 magic_project.400.a:0 "A crown!"
 magic_project.400.b:0 "A scepter!"
 magic_project.400.c:0 "A sword!"
 
 magic_project.401.t:0 "The Substance"
 magic_project.401.desc:0 "We have determined the shape that our rule will take. But what is the substance of that rule, and how shall we achieve its legitimation?"
 magic_project.401.a:0 "Bless and consecrate it"
 magic_project.401.b:0 "Inscribe it with the code of laws"
 magic_project.401.c:0 "Our rod shall be of silver"
 magic_project.401.d:0 "Our rod shall be of bronze"
 magic_project.401.e:0 "Forge the blade of sharpened steel"
 magic_project.401.f:0 "Forge the blade of precious gold"
 
 magic_project.402.t:0 "The Finish"
 magic_project.402.desc:0 ""
 magic_project.402.a:0 "Imbue it with the knowledge of all who came before"
 magic_project.402.b:0 "Imbue it with the potential of what could be"
 magic_project.402.c:0 "Top it with a gleaming jewel"
 magic_project.402.d:0 "Top it with an intricate carving"
 magic_project.402.e:0 "Make the hilt of ancient mithril"
 magic_project.402.f:0 "Make the hilt of an advanced alloy"
 
 magic_project.500.t:0 "First Day of Class"
 magic_project.500.d:0 ""
 magic_project.500.a:0 "The new students are on their way!"
 battlemage_academy_project_effect_1:0 "The §YRecruit War Wizard§! Estate Action now costs §Y150§! Military Power.\n\nWar Wizards now spawn with §G+1§! Shock and §G+1§! Maneuver (Total 1/8/5/1)"
 
 magic_project.501.t:0 "Midterms"
 magic_project.501.d:0 ""
 magic_project.501.a:0 "These new textbooks will surely boost their confidence"
 battlemage_academy_project_effect_2:0 "The §YRecruit War Wizard§! Estate Action now costs §Y100§! Military Power.\n\nWar Wizards now spawn with §G+1§! Fire, §G+1§! Maneuver, and §G+1§! Siege (Total 2/8/6/2)"
 
