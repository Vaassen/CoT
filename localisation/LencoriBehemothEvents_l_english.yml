 improve_behemoth_construction: "Improve Behemoth Construction"
 improve_behemoth_construction_desc: "(PLACEHOLDER)"
 improve_behemoth_construction_effect_tt: "The naval supply requirement of §YBehemoth Shipyard§! is §Ghalved§! and the §Ycap§! is increased by §G+5§!\n§YBehemoth Shipyard§! now provide §G-25%§! §YLocal Ship Cost§!, §G+50%§! §YBlockade Force Required§! and an additional §G+25%§! §YLocal Shipbuilding Repair§!"

