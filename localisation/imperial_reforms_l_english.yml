 ###EVENTS###
 flavour_eoa.1.t:0 "Emperor Guarantees Temple Rights"
 flavour_eoa.1.d:0 "The diet has passed a new reform which increases Emperor's control over Imperial Lands specifically as they apply to places of worship."
 flavour_eoa.1.a:0 "Emperor's authority increases..."
 flavour_eoa.1.b:0 "The Emperor is truly godly!"
 flavour_eoa.1.c:0 "This is for the best."
 flavour_eoa.1.e:0 "We have no choice but to comply..."
 flavour_eoa.1.f:0 "Come and take it if you dare!"
 flavour_eoa.2.t:0 "Nobles of The Wand"
 flavour_eoa.2.d:0 "The Magical nobility of the Empire have institutional advantages which gives them incredible power within the empire."
 flavour_eoa.2.a:0 "The mages grow in power..."
 flavour_eoa.2.b:0 "As it should be!"
 flavour_eoa.3.t:0 "Law Regarding The Employment of Artifice and Extramagical Practices"
 flavour_eoa.3.d:0 "The Emperor has passed a new law which heavily regulates artifice and its use."
 flavour_eoa.3.a:0 "We have no choice but to comply."
 flavour_eoa.3.b:0 "Try to find a compromise!"
 flavour_eoa.4.t:0 "Order of Imperial War Wizards Created"
 flavour_eoa.4.d:0 "The Emperor has established a professional corps of warmages at the employ of the Empire."
 flavour_eoa.4.a:0 "Fireball!"
 flavour_eoa.5.t:0 "Mages Peace Declared!"
 flavour_eoa.5.d:0 "With the power of the magisters now unparalleled and the Emperor's authority reigning supreme, a decree banning all armed conflict within the empire has been passed."
 flavour_eoa.5.a:0 "To Crothan we go with the court cases..."
 flavour_eoa.6.t:0 "Choosing An Imperial Marshall"
 flavour_eoa.6.d:0 "The time has come to appoint a new marshall for the empire."
 flavour_eoa.6.k:0 "We need some time to think about it."
 flavour_eoa.6.l:0 "We need not empower the princes even more."
 flavour_eoa.6.a:0 "Istralore shall be our Marshall."
 flavour_eoa.6.b:0 "The Vernemen are fit for the role."
 flavour_eoa.6.c:0 "Neckcliffe shall safeguard our shores."
 flavour_eoa.6.e:0 "Sugamberians will watch over the south and the east."
 flavour_eoa.6.f:0 "The Grand Duchy of Wex shall provide us with their warriors."
 flavour_eoa.6.g:0 "Orda Aldresia's battlemages have our trust."
 flavour_eoa.6.h:0 "Knights of Cestirande shall ride with us."
 flavour_eoa.6.i:0 "The Elfrealm of Ibevar is our choice."
 flavour_eoa.6.j:0 "Charge Pearlsedge to protect the Dameshead."
