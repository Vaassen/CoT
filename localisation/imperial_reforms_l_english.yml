 flavour_eoa.7.t:0 "Elevation To The Marquis Rank"
 flavour_eoa.7.d:0 "The Emperor has invited us to join the ranks of the marquis and defend the empire."
 flavour_eoa.7.a:0 "We'd be honored!"
 flavour_eoa.7.b:0 "Nah I'd refuse"
 flavour_eoa.8.t:0 "Allocation of Internal Divisions"
 flavour_eoa.8.d:0 "The Emperor has divided lands of the Empire into several different administrative divisions, each deemed to have their own strengths and advantages."
 flavour_eoa.8.a:0 "Adopt The Reforms!"
 flavour_eoa.8.b:0 "We're doing just fine."
 flavour_eoa.9.t:0 "Expansion of The Imperial Electors College"
 flavour_eoa.9.d:0 "The Emperor has decided to equalise the voting system by introducing a new elector to the roster of the electors"
 flavour_eoa.9.a:0 "Interesting"
 flavour_eoa.9.b:0 "We shall take the initiative and become an elector!"
 flavour_eoa.10.t:0 "Efforts To Reform The Feudal Law"
 flavour_eoa.10.d:0 "If feudal laws and customs are to survive this new age, they must be changed according to the new social, economic, and political landscape."
 flavour_eoa.10.a:0 "But can we truly do that?"
 flavour_eoa.11.t:0 "The Imperial Realm War!"
 flavour_eoa.11.d:0 "In order to defend the Empire, all princes of the empire must line up behind the emperor and go to war as a united force, only then shall the Empire of Anbennar's true might come to be realized!"
 flavour_eoa.11.a:0 "Understood."
 flavour_eoa.11.b:0 "Forwards!"
