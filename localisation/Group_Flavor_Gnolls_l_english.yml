 gnoll_flavor.2.title: "Loyalty Enforced"
 gnoll_flavor.2.desc: "STUB - Our gnollish overlords have sent an incursion into our lands, plundering our fields and villages and terrifying our people into submission."
 gnoll_flavor.2.a: "But we didn't do anything!"

 gnoll_flavor.3.title: "From Chains to Court"
 gnoll_flavor.3.desc: "STUB - A slave from [event_province.GetName] has come to our attention as a particularly capable individual, with ideas and skills that could highly benefit our country. However, lifting someone from such lows to such heights goes against the entire hierarchy our society is built on."
 gnoll_flavor.3.a: "Bring them to our court."
 gnoll_flavor.3.b: "We cannot subvert our whole society for one individual. Slaves are slaves, and will always be such."