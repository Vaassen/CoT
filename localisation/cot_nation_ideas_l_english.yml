 A52_idea_1:0 "Scalemail"
 A52_idea_1_desc:0 "The pathetic newts that frequently trespass into our kingdom from the looming Dragonheights are little more than pests, though even they have their uses. Their scales, flayed from their flesh while their blood still runs warm, are incredibly strong for their light weight. While others trudge into battle clad in heavy and immobilizing plate or fragile leather, Eaglecresters proudly march into the fray in resplendent kobold-scale cuirasses."
