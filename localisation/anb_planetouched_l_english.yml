 planetouched.101.t:0 "Planetouched Heir"
 planetouched.101.d:0 "It is difficult to hide when a child has powerful planetouched powers. If flowers bloom under every step they take, or the hair on their head is permanently aflame, then chances are the news will get out sooner or later. It's shocking that word of [Root.Heir.GetName]'s true power has not split out before now, but there is no point in hiding it any longer. The heir to the throne of [Root.GetName] is planetouched."
 planetouched.101.a:0 "A frightening power"

 planetouched.102.t:0 "Planetouched Heir"
 planetouched.102.d:0 "[Root.Heir.GetName] stood out against any potential alternate candidate in part due to their powerful planetouched powers. They had kept the powers relatively hidden until recently, as planetouched were often feared and misunderstood across the history of Sarhal, but with their path to the throne secured, there is no longer any point in hiding that [Root.Heir.GetSheHe] is a planetouched."
 planetouched.102.a:0 "Interesting"

 planetouched.103.t:0 "Planetouched Commander"
 planetouched.103.d:0 "A promising new soldier has been making waves in the military, using their unique powerful planetouched powers to destroy their foes and command loyalty amongst their peers. Planetouched have historically made for excellent military leaders and we can count our blessings that this individual fell into our laps and not those of our enemies."
 planetouched.103.a:0 "Promote them to general at once"
 
 planetouched.104.t:0 "Planetouched ruler republic"
 planetouched.104.d:0 "This is a hidden event so this is just fluff, you can safely ignore it"
 planetouched.104.a:0 "Good luck"

 planetouched.201.t:0 "Fire breaks out in courtroom"
 planetouched.201.d:0 "Courtroom became over crowded with petitioners and one has caught on fire! Now it has spread far outside the courtroom what tf do we do??"
 planetouched.201.a:0 "Let the fire burn out"
 planetouched.201.b:0 "Try to put out the Blaze"

 planetouched.202.t:0 "Our Troops Find Inspiration within $MONARCH$'s Flame"
 planetouched.202.d:0 "Whilst inspecting one of our armies $MONARCH$ realised that they train more diligently when they are observing them up close rather than from a distance. $MONARCH$ believes that this stems from their obviously planetouched appearance - whether this is due to them being inspired by the flames or that their fright of the flame fuels their diligence cannot be said however $MONARCH$ could choose to use one of these to help our armies become better than our rivals. When consulting their advisors on this though some said that it might cause too much stress on our dear ruler whereas other advisors say that it is a necessary step to ensure our expansion. Now they have heard all sides of the argument and they have come to decisions which are..."
 planetouched.202.a:0 "We should let them take from the Fire"
 planetouched.202.b:0 "Leet them learn the feeling of burning flesh"
 planetouched.202.c:0 "Seems like to much effort for me"

 planetouched.203.t:0 "Fire in the Jungle!!"
 planetouched.203.d:0 "Our ruler whilst going out on a leisurely ride, to allow the day-to-day struggles of a ruler to be forgotten for a few short moments, has accidently made the forest around them catch fire! \n\nThe blaze has quickly grown so large that our ruler couldn’t contain the fire by themselves. We could limit the destruction by using the small royal guard which came along to protect our $MONARCH_TITLE$ as they could be used to dig up a perimeter to stop the flame from growing too large. However the blaze could also be used to create a new city to extend our nation's control over the isolated jungle communities which surround where the new city could be built."
 planetouched.203.a:0 "Use the burnt area to  build a new city"
 planetouched.203.b:0 "Try to limit the fire and let the plantlife regrow"
 FPT_random_fire_spread_jung_tt:0 "§RDevasation§! will be a random number up to 25"

 planetouched.301.t:0 "Storm gets prevented by ruler"
 planetouched.301.d:0 "Ruler has prevented a sandstorm from hitting a vital area in the desert or a dust from savannah/dryalands. This has given us the chance to exploit or grow the area. However as time passes the storms might come back"
 planetouched.301.a:0 "Great use the respite to exploit the natural resources"
 planetouched.301.b:0 "Use the respite to develop a trading hub"
 planetouched.301.c:0 "Great! create an outpost but stop development as the storms will return"
 planetouched.301.e:0 "Thats fine we have lived in these sands for generations"

 planetouched.302.t:0 "Ruler uses wind powers to ‘attract more trade’"
 planetouched.302.d:0 "Ruler is a bit sneaky and uses their powers to move ships towards our ports. Some ppl realise some don't either way its good but should we get a better rep if he stops or should we use the money"
 planetouched.302.a:0 "Stop him and build more attractive trade ports"
 planetouched.302.b:0 "I mean it is good for business…"
 planetouched.302.c:0 "Stop them. Our finances are good as is"
 WPT_3_more_time_COT_upgrade_tt:0 "up to 3 other Centres of Trade will be given §JTrade Power§! depending on their level"

 planetouched.401.t:0 "Rulers Affinity with water can help our Ships"
 planetouched.401.d:0 "$MONARCH$ has been practising and strengthening their planetouched abilities. Whilst doing this they have found a way to manipulate waves underneath our ships to help our sailors achieve more without the need for more effort. The two best ways they have figured to use these power is that they can either focus and help our armadas by giving them a better reputation, increasing the amount of inspired people enlisting into our navies \n\nFound out how to move ships and help them fight BUT only strong enough to help one side of the navy. Should they focus on helping trade or out nations armada?"
 planetouched.401.a:0 "Use it to improve our Trade"
 planetouched.401.b:0 "Use it to improve our Armada"

 planetouched.402.t:0 "Proffesional Planetouched Marines?"
 planetouched.402.d:0 "Water plantouched likes other like them. Our ruler wants a only water-touched marines corps as it would mean that they can fight better near water as they can fight alongside the waves"
 planetouched.402.a:0 "A professional squadron will only help our nation"
 planetouched.402.b:0 "No this is too expensive"

 planetouched.501.t:0 "Ruler Helps The Movements of Precious Metals"
 planetouched.501.d:0 "Rulers has chosen to help the moving of minerals from the mines to the capital. Improves Trade and increases profits from less highwayman-ing. ect. But what to do with the extra money generated"
 planetouched.501.a:0 "Use the Profits to improve the mines"
 planetouched.501.b:0 "Use the profit to build a strong trade centre"
 planetouched.501.b:0 "Keep the Profit"

 planetouched.502.t:0 "Ruler can help with construction"
 planetouched.502.d:0 "Ruler can control earth and do shii but should he use it to destroy walls of enemy cities or build our own cities"
 planetouched.502.a:0 "Its better to use for offensive capabilities"
 planetouched.502.b:0 "Use it to get new building materials"
 planetouched.502.c:0 "Seems to much work"

 planetouched.601.t:0 "Life if blooming under $MONARCH$ Energy"
 planetouched.601.d:0 "Our glorious ruler was blessed with Life energy by the Orisha and with their ascension to our throne life has seemingly blossomed with them. This can be seen from the gorgeous flowers growing from every nook and cranny around the castle and house of our ruler who has decreed that they should only be cut if they are a real issue to the day-to-day life of the servants. However it cannot just be seen in the castle but everywhere in our domains with trees healing faster, apples growing larger and livestock becoming larger and healthier with even the runts of the litter looking like prized cattle. \n\nThis has done wonders for our food exports as everyone in and outside our realm has heard about these new animals and desires their fat and juicy meat to try for themselves so bidding for cattle grown blessed by $ruler_name$ has grown tenfold and sometimes twentyfold to before. However as the cattle are a limited breed a Question has arisen. What should we choose to do with these so called 'blessed cows'?"
 planetouched.601.a:0 "Seize all of these ‘Magical Animals’ and sell them!"
 planetouched.601.b:0 "Control the export of the animals"
 LPT_years_income_3_telling_tt:0 "Gain §G3 years§! worth of Trade Income."
 LPT_wool_livestock_less_explain_tt:0 "For 15 years all wool and livestock provinces will gain: \n§R -33% Local Production Efficiency§! \n§R +2 Local Unrest§! \n"
 LPT_wool_livestock_add_explain_tt:0 "For 7.5 years all wool and livestock provinces will gain: \n §G+33% Local Production Efficiency§! \n"

 planetouched.602.t:0 "Ruler is too lenient with criminal"
 planetouched.602.d:0 "Life energy has attracted many new ppl to our cities but the ppl arent good ppl and monarchs nature about life means that they aint punishing ppl correctly letting theifs and criminals walk free protected from retaliation of the army"
 planetouched.602.a:0 "This policy might help relations with the underworld"
 planetouched.602.b:0 " We need to stop them!"

 planetouched.701.t:0 "Shadow Energy Kills Consort"
 planetouched.701.d:0 "$MONARCH$ was relaxing after a long day of ruling, laying next to their husband/wife feeling happy from being near them. One of the only people who truly understands them. Their soul, their reason to push that little bit harder to grow the nation and keep it standing. $MONARCH$ embraced "
 planetouched.701.a:0 "Oh my dear Wife"
 planetouched.701.b:0 "Oh my dear Husband"

 planetouched.702.t:0 "Extension Event"
 planetouched.702.d:0 "Despite $MONARCH$’s dearest husband departing not even a year ago he did leave her with one final surprise, one left inside her the night he was taken. He left a baby. Whom now has been birthed without complication and sits in $MONARCH$s arms peacefully"
 planetouched.702.a:0 "A final gift…"
 planetouched.702.b:0 "They will be a good spare"

 planetouched.703.t:0 "Shadows come to life"
 planetouched.703.d:0 "Shadow puppets turn real?! Use them to dissuade internal dissent within our estate or to use them as spies to help our expansion and destroy our enemies expansion"
 planetouched.703.a:0 "Use them to Spy on our estates"
 planetouched.703.b:0 "Use them as spies"
 planetouched.703.c:0 "Use them as jovial entertainment"

